  VALLEY ARCADE v1.00 | the SNAILCADE seat, Snail Attack Studios | 2026-09-30
  One machine holding the ten PICO-8 games of arcade.valley.games, with a game select screen after the Neo Geo MVS
  multi-slot cabinets (the Director's word, 2026-09-30: an MVS grid of title shots, no placeholder slots, boot into
  FLUTTER). Every game is its studio's own work, played exactly as published: each one's own player page and game.js
  sit untouched beside this page in valley-arcade/<slug>/ and run in the frame below. This page only frames them:
  it opens a game's player, writes PICO-8's own button bits (pico8_buttons) from the on-screen pad, hands a running
  game an audio context the way PICO-8 web players accept one (pico8_audio_context), pauses a game while the select
  screen is up (Module.pauseMainLoop, the runtime's own), and passes ESC and TAB out to the arcade.
  Built by titles/snailcade/working/tools/build.js from src/cart/valley-arcade.html; the roster and the title shots
  come from src/js/04d-valley-art.js (tools/capture-valley.js), from the pack in titles/snailcade/guests/valley-arcade/.
-->

:root{--sky:#a9dde6;--pink:#f3a2b6;--gold:#e6a33a;--teal:#3cb49b;--ink:#07060d;--panel:#101a3a;--panel2:#0a1128;--cur:#ffe34d;--txt:#eaf3ff;--dim:#8fa3c8;--px:"Silkscreen",ui-monospace,monospace}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);overflow:hidden;font:12px var(--px);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#va{position:fixed;inset:0}
#scr{position:absolute;background:#000;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
#bar{position:absolute;display:flex;align-items:center;gap:8px;padding:0 8px;box-sizing:border-box;background:linear-gradient(#0e1530,#070a18);border-top:2px solid var(--teal);white-space:nowrap}
#now{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--dim)}
#now b{color:var(--txt);font-weight:700}
#now i{font-style:normal;color:var(--sky)}
#hint{font-size:9px;color:var(--dim)}
.pill{font:700 10px var(--px);letter-spacing:.5px;color:#1b1030;background:var(--sky);border:0;border-radius:11px;padding:5px 10px;cursor:pointer;box-shadow:0 2px 0 #4f8e99}
.pill:active{transform:translateY(1px);box-shadow:0 1px 0 #4f8e99}
.pill.pk{background:var(--pink);box-shadow:0 2px 0 #a8566c}
.badge{font:700 9px var(--px);color:#fff;background:rgba(7,6,13,.72);border:1px solid rgba(169,221,230,.5);border-radius:6px;padding:3px 6px;pointer-events:none;white-space:nowrap}
#pad .badge{position:absolute}
#pad{position:absolute;display:none;pointer-events:none}
#pad.on{display:block}
.pz{position:absolute;touch-action:none;pointer-events:auto}
#dpad{border-radius:50%;background:radial-gradient(circle at 50% 45%,#232a48,#12162a 70%);box-shadow:inset 0 0 0 2px #2b3559,0 4px 0 #05060c}
#dpad i{position:absolute;background:#3a4570;border-radius:6px}
#dpad i.h{left:12%;right:12%;top:37%;bottom:37%}
#dpad i.v{top:12%;bottom:12%;left:37%;right:37%}
#dpad i.on{background:var(--sky)}
.bt{border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 20px var(--px);color:#fff;box-shadow:0 5px 0 #05060c,inset 0 -4px 0 rgba(0,0,0,.25)}
.bt.o{background:#e8495f}.bt.x{background:#3a78e0}
.bt.on{transform:translateY(3px);box-shadow:0 2px 0 #05060c,inset 0 -2px 0 rgba(0,0,0,.25);filter:brightness(1.25)}
.sp{border-radius:12px;background:#28304f;color:var(--dim);font:700 9px var(--px);display:flex;align-items:center;justify-content:center;letter-spacing:.5px;box-shadow:0 3px 0 #05060c}
.sp.on{background:var(--sky);color:#1b1030}
#padhint{position:absolute;left:0;right:0;text-align:center;font-size:9px;line-height:1.4;color:var(--dim);pointer-events:none;padding:0 6px}
/* THE SELECT SCREEN, after the MVS multi-slot cabinets */
#sel{position:absolute;inset:0;z-index:5;background:radial-gradient(ellipse at 50% 0%,#1d2b66 0%,#0b1233 55%,#050817 100%);display:flex;flex-direction:column;outline:none}
#sel::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
#selHead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 12px 6px;gap:6px 8px}
#selMid{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
#selHead.narrow #selMid{order:3;flex-basis:100%;flex-direction:row;justify-content:center;gap:14px}
#selLogo{font:400 20px "Bungee",Impact,sans-serif;letter-spacing:1px;color:#eaf8ef;text-shadow:2px 2px 0 var(--gold),4px 4px 0 #7a3d12;white-space:nowrap}
#selLogo span{color:var(--pink)}
#selWhat{font:700 11px var(--px);color:var(--sky);letter-spacing:2px;text-align:center}
#selTime{font:700 11px var(--px);color:var(--dim);white-space:nowrap}
#selTime b{display:inline-block;min-width:2.2ch;font-size:20px;color:var(--cur);text-shadow:0 0 8px rgba(255,227,77,.6)}
#grid{flex:1;display:grid;gap:8px;padding:6px 12px;align-content:safe center;justify-content:safe center;min-height:0;overflow:auto}
.cell{position:relative;background:linear-gradient(var(--panel),var(--panel2));border:2px solid #24336e;border-radius:6px;padding:5px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
.cell img{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:2px}
.cell .t,.cell .s{text-align:center;line-height:1.15;max-width:100%;overflow:hidden;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cell .t{font:700 var(--ts,10px) var(--px);color:var(--txt)}
.cell .s{font:400 var(--ss,8px) var(--px);color:var(--sky)}
.cell .s.unk{color:#ff9a86}
.cell.cur{border-color:var(--cur);box-shadow:0 0 0 2px rgba(255,227,77,.35),0 0 18px rgba(255,227,77,.45)}
.cell.cur::before{content:"1P";position:absolute;left:-2px;top:-10px;font:700 9px var(--px);color:#1b1030;background:var(--cur);padding:1px 4px;border-radius:3px;animation:blink .5s steps(1) infinite}
.cell.now::after{content:"PLAYING";position:absolute;right:4px;top:4px;font:700 7px var(--px);color:#fff;background:rgba(232,73,95,.9);padding:1px 3px;border-radius:2px}
@keyframes blink{50%{opacity:.35}}
#selFoot{padding:4px 12px 10px;text-align:center}
#selKeys{font:700 9px var(--px);color:var(--txt);letter-spacing:.5px}
#selSrc{font:400 8px var(--px);color:var(--dim);margin-top:4px;line-height:1.35}
#selBack{margin-top:6px}
#msg{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;background:#050817;color:var(--txt);font:700 11px/1.6 var(--px)}
#msg.on{display:flex}
[hidden]{display:none!important}
</style>

/* ---- where the games are: beside this page (valley-arcade/<slug>/), else the live site ---- */
function base(){
  try { if(window.parent !== window && window.parent.SNAILCADE_CARTS) return LIVE; } catch(e){}   /* the offline arcade carries no game files */
  var p = location.protocol;
  if(p === 'about:'){ try { return new URL('games/valley-arcade/', document.baseURI).href; } catch(e){ return LIVE; } }   /* srcdoc: the arcade's own address */
  if(p === 'blob:'){ try { return new URL('games/valley-arcade/', window.parent.document.baseURI).href; } catch(e){ return LIVE; } }
  try { return new URL('valley-arcade/', location.href).href; } catch(e){ return LIVE; }
}
var BASE = base();
function bySlug(s){ for(var i = 0; i < GAMES.length; i++) if(GAMES[i].slug === s) return GAMES[i]; return null; }
function studioOf(g){ return g.studio || 'STUDIO TO BE CREDITED'; }
function gw(){ try { var w = game.contentWindow; return w && w.document ? w : null; } catch(e){ return null; } }   /* null when the game is foreign (the live site from a file) */

/* ---- layout: the square game, the bar, the pad on touch screens ---- */
function layout(){
  var W = window.innerWidth, H = window.innerHeight, bar = 34, pad = $('pad');
  ST.touch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
  var S, gx, gy, portrait = H >= W * .95;   /* a near square screen (an unfolded phone's cabinet screen) lays out tall too: the pad under the game */
  pad.className = ST.touch ? 'on' : '';
  function put(id, x, y, w, h){ var e = $(id); e.style.left = Math.round(x) + 'px'; e.style.top = Math.round(y) + 'px'; e.style.width = Math.round(w) + 'px'; e.style.height = Math.round(h) + 'px'; }
  if(ST.touch && portrait){
    S = Math.min(W, H - bar - 190); S = Math.max(S, Math.min(W, 120));
    gx = (W - S) / 2; gy = 0;
    put('scr', gx, gy, S, S); put('bar', 0, gy + S, W, bar);
    var py = gy + S + bar, ph = H - py; put('pad', 0, py, W, ph);
    var d = Math.min(ph * .72, W * .44, 190), b = Math.min(d * .42, 78);
    put('dpad', W * .06, (ph - d) / 2 + 8, d, d);
    put('bX', W - W * .06 - b, (ph - d) / 2 + 8, b, b);
    put('bO', W - W * .06 - b * 2.15, (ph - d) / 2 + 8 + b * .95, b, b);
    put('bSelP', W / 2 - 38, 10, 76, 24); put('bMenu', W / 2 - 38, 42, 76, 24);
    $('padhint').style.width = ''; $('padhint').style.right = '0';
  } else if(ST.touch){
    var side = Math.max(130, Math.min(220, W * .22));
    S = Math.min(H - bar, W - side * 2); gx = (W - S) / 2; gy = Math.max(0, (H - S - bar) / 2);
    put('scr', gx, gy, S, S); put('bar', gx, gy + S, S, bar);
    put('pad', 0, 0, W, H);
    var d2 = Math.min(side * .86, H * .5), b2 = Math.min(side * .36, 70);
    put('dpad', (side - d2) / 2, H - d2 - 24, d2, d2);
    put('bX', W - side / 2 - b2 * .1, H - b2 * 2.3, b2, b2);
    put('bO', W - side / 2 - b2 * 1.2, H - b2 * 1.25, b2, b2);
    put('bSelP', (side - 76) / 2, 14, 76, 24); put('bMenu', W - side + (side - 76) / 2, 14, 76, 24);
    $('padhint').style.width = Math.round(side) + 'px'; $('padhint').style.right = 'auto';
  } else {
    S = Math.min(W, H - bar); gx = (W - S) / 2; gy = Math.max(0, (H - S - bar) / 2);
    put('scr', gx, gy, S, S); put('bar', gx, gy + S, S, bar);
  }
  /* the version badge: in the bar on a desk, on the pad on a touch screen (never over the game: its corners carry HUDs) */
  var bd = $('badge');
  if(ST.touch){ pad.appendChild(bd); var pr = pad.getBoundingClientRect();
    if(portrait){ bd.style.left = ''; bd.style.right = '8px'; bd.style.top = ''; bd.style.bottom = '6px'; $('padhint').style.top = (pr.height - 40) + 'px'; }
    else { bd.style.right = ''; bd.style.bottom = ''; bd.style.left = '8px'; bd.style.top = '44px'; $('padhint').style.top = '72px'; } }
  else { $('bar').appendChild(bd); bd.style.left = bd.style.top = bd.style.right = bd.style.bottom = ''; }
  $('bSel').hidden = ST.touch;
  $('hint').textContent = ST.touch ? '' : (S > 560 ? 'TAB: GAME SELECT' : '');
  $('selHead').className = W < 560 ? 'narrow' : '';
  /* the MVS grid: five across and two down, or two across and five down, whichever gives the bigger slot */
  var fit = function(c){ var r = Math.ceil(GAMES.length / c); return Math.floor(Math.min((W - 24 - (c - 1) * 8) / c, (H - 150) / r - 36)); };
  ST.cols = fit(5) >= fit(2) ? 5 : 2;
  ST.cw0 = Math.max(56, fit(ST.cols));
  fitGrid();
}

function cellSize(cw){
  grid.style.gridTemplateColumns = 'repeat(' + ST.cols + ',' + cw + 'px)';
  grid.style.setProperty('--ts', Math.max(6, Math.min(11, Math.floor(cw / 13.5))) + 'px');
  grid.style.setProperty('--ss', Math.max(6, Math.min(9, Math.floor(cw / 17))) + 'px');
}
function fitGrid(){
  var cw = ST.cw0 || 96; cellSize(cw);
  if(sel.hidden) return;
  for(var k = 0; k < 40 && cw > 78 && (grid.scrollHeight > grid.clientHeight + 1 || grid.scrollWidth > grid.clientWidth + 1); k++){ cw -= 3; cellSize(cw); }
}

/* ---- the game frame ---- */
function playerURL(g){ return BASE + g.slug + '/index.html'; }
/* each game gets a fresh frame, and the one before it is thrown away whole: loading a game into the frame the last one is
   still leaving stalled it now and then (1 in 10 switches in a repeat of the gate's own steps: the new player never ran) */
function freshFrame(){
  var old = game, f = document.createElement('iframe');
  f.id = 'game'; f.title = old.title; f.setAttribute('allow', old.getAttribute('allow'));
  try { old.onload = null; old.src = 'about:blank'; } catch(e){}
  old.parentNode.replaceChild(f, old);
  game = f;
  return f;
}
function load(slug, auto){
  var g = bySlug(slug); if(!g) return;
  ST.cur = slug; ST.started = false; ST.loadN++;
  if(ST.audio){ try { ST.audio.close(); } catch(e){} ST.audio = null; }
  msg('');
  var n = ST.loadN, f = ST.loadN > 1 ? freshFrame() : game;
  f.onload = function(){ var w = gw(); if(n === ST.loadN && f === game && !(w && w.location.href === 'about:blank')) hookGame(g, auto); };
  f.src = playerURL(g);
  nowLine();
}
function hookGame(g, auto){
  var w = gw();
  if(!w){ nowLine(); return; }             /* foreign: it plays, with its own keys and its own start */
  var d = w.document;
  if(!d.getElementById('canvas') || typeof w.pico8_buttons === 'undefined'){ msg('THE GAME FILES FOR ' + esc(g.title.toUpperCase()) + ' ARE NOT HERE.<br>(' + esc(playerURL(g)) + ')'); return; }
  msg('');
  /* ESC and TAB go out to the arcade and the select screen; a tap anywhere wakes the arcade's controls */
  w.addEventListener('keydown', function(e){
    if(e.key === 'Tab'){ e.preventDefault(); e.stopPropagation(); if(!e.repeat) openSel(); return; }
    if(e.key === 'Escape'){ relayKey(e); return; }
    markStarted();
  }, true);
  w.addEventListener('keyup', function(e){ if(e.key === 'Escape') relayKey(e); }, true);
  w.addEventListener('pointerdown', function(){ markStarted(); try { window.dispatchEvent(new Event('pointerdown')); } catch(e){} }, true);
  var st = d.getElementById('start');
  if(st && auto && activated()){
    /* the player's own start, with an audio context this page may open: the way PICO-8 web players take one */
    try { ST.audio = new (window.AudioContext || window.webkitAudioContext)(); w.pico8_audio_context = ST.audio; if(ST.audio.resume) ST.audio.resume(); } catch(e){ ST.audio = null; }
    try { w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'x', keyCode: 88 })); } catch(e){}
    markStarted();
  }
  focusGame();
  nowLine();
}
function markStarted(){ if(!ST.started){ ST.started = true; nowLine(); } }
function activated(){ try { return !!(navigator.userActivation && navigator.userActivation.hasBeenActive); } catch(e){ return false; } }
function relayKey(e){ try { window.dispatchEvent(new KeyboardEvent(e.type, { key: e.key, code: e.code, keyCode: e.keyCode, repeat: e.repeat, bubbles: true })); } catch(x){} }
function focusGame(){ if(ST.open) return; try { game.focus(); var w = game.contentWindow; if(w) w.focus(); } catch(e){} }
function nowLine(){
  var g = bySlug(ST.cur); if(!g) return;
  $('now').innerHTML = '<b>' + esc(g.title.toUpperCase()) + '</b> &#183; <i>' + esc(studioOf(g).toUpperCase()) + '</i>';
  $('padhint').textContent = ST.started ? '' : 'TAP THE GAME SCREEN TO START';
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function msg(h){ var m = $('msg'); m.innerHTML = h; m.className = h ? 'on' : ''; ST.err = h || null; }

/* pause and resume a running game with its runtime's own main loop controls */
function pauseGame(on){
  var w = gw(); if(!w) return;
  try { if(w.Module && w.Module[on ? 'pauseMainLoop' : 'resumeMainLoop']) w.Module[on ? 'pauseMainLoop' : 'resumeMainLoop'](); } catch(e){}
  var a = null; try { a = w.pico8_audio_context || w.codo_audio_context || null; } catch(e){}
  try { if(a && a[on ? 'suspend' : 'resume']) a[on ? 'suspend' : 'resume'](); } catch(e){}
  if(on) setBits(0);
}

/* ---- the select screen ---- */
function buildGrid(){
  grid.innerHTML = '';
  GAMES.forEach(function(g, i){
    var c = document.createElement('div'); c.className = 'cell'; c.setAttribute('data-slug', g.slug); c.setAttribute('role', 'button');
    c.innerHTML = '<img alt="" src="' + SHOTS[g.slug] + '"><div class="t">' + esc(g.title.toUpperCase()) + '</div><div class="s' + (g.studio ? '' : ' unk') + '">' + esc(studioOf(g).toUpperCase()) + '</div>';
    c.addEventListener('click', function(){ ST.hi = i; paintSel(); choose(); });
    grid.appendChild(c);
  });
}
function paintSel(){
  Array.prototype.forEach.call(grid.children, function(c, i){ c.classList.toggle('cur', i === ST.hi); c.classList.toggle('now', c.getAttribute('data-slug') === ST.cur); });
  var hc = grid.children[ST.hi]; if(hc && grid.scrollHeight > grid.clientHeight + 1){ var gr = grid.getBoundingClientRect(), cr = hc.getBoundingClientRect();
    if(cr.top < gr.top + 8) grid.scrollTop -= gr.top + 8 - cr.top; else if(cr.bottom > gr.bottom - 8) grid.scrollTop += cr.bottom - gr.bottom + 8; }
  $('selT').textContent = ST.tLeft < 10 ? '0' + ST.tLeft : String(ST.tLeft);
  $('selKeys').textContent = ST.touch ? 'TAP A GAME TO PLAY IT' : 'ARROWS CHOOSE . Z OR ENTER PLAYS . TAB GOES BACK';
}
function openSel(){
  if(ST.open) return;
  ST.open = true; pauseGame(true);
  for(var i = 0; i < GAMES.length; i++) if(GAMES[i].slug === ST.cur) ST.hi = i;
  ST.tLeft = TIME; sel.hidden = false; fitGrid(); paintSel();
  try { sel.focus({ preventScroll: true }); } catch(e){}
  clearInterval(ST.timer);
  ST.timer = setInterval(function(){ ST.tLeft--; if(ST.tLeft <= 0){ ST.tLeft = 0; paintSel(); choose(); } else paintSel(); }, 1000);
}
function closeSel(){
  if(!ST.open) return;
  ST.open = false; clearInterval(ST.timer); sel.hidden = true; pauseGame(false); focusGame();
}
function choose(){
  var g = GAMES[ST.hi]; if(!g) return;
  if(g.slug === ST.cur && !ST.err){ closeSel(); return; }
  ST.open = false; clearInterval(ST.timer); sel.hidden = true;
  load(g.slug, true);
}
function move(dx, dy){
  var cols = ST.cols || 5, n = GAMES.length, i = ST.hi;
  if(dx) i = (i + dx + n) % n;
  if(dy){ var j = i + dy * cols; if(j >= 0 && j < n) i = j; }
  ST.hi = i; ST.tLeft = Math.max(ST.tLeft, 10); paintSel();
}
document.addEventListener('keydown', function(e){
  if(ST.open){
    var k = e.key;
    if(k === 'ArrowLeft'){ move(-1, 0); e.preventDefault(); }
    else if(k === 'ArrowRight'){ move(1, 0); e.preventDefault(); }
    else if(k === 'ArrowUp'){ move(0, -1); e.preventDefault(); }
    else if(k === 'ArrowDown'){ move(0, 1); e.preventDefault(); }
    else if(k === 'Enter' || k === ' ' || k === 'z' || k === 'Z' || k === 'x' || k === 'X' || k === 'c' || k === 'C' || k === 'n' || k === 'N'){ e.preventDefault(); if(!e.repeat) choose(); }
    else if(k === 'Tab'){ e.preventDefault(); if(!e.repeat) closeSel(); }
    return;
  }
  if(e.key === 'Tab'){ e.preventDefault(); if(!e.repeat) openSel(); return; }
  if(e.key === 'Escape') return;
  if(!ST.started) padStart();               /* a key that lands on this page, not the game's: before the start it starts the game */
  focusGame();                              /* after it, the game has the keys again (press it again there) */
});
/* the arcade focuses this page when the coin drops; the keys belong to the game inside it */
window.addEventListener('focus', function(){ if(!ST.open) setTimeout(focusGame, 0); });
$('bSel').addEventListener('click', function(){ openSel(); });
$('selBack').addEventListener('click', function(){ if(ST.err){ choose(); return; } closeSel(); });

/* ---- the on-screen pad: PICO-8's own button bits (0 left, 1 right, 2 up, 3 down, 4 O, 5 X, 6 pause) ---- */
function setBits(b){
  ST.bits = b;
  var w = gw(); if(w && w.pico8_buttons) try { w.pico8_buttons[0] = b; } catch(e){}
  var dp = $('dpad').children;
  dp[0].classList.toggle('on', !!(b & 3)); dp[1].classList.toggle('on', !!(b & 12));
  $('bO').classList.toggle('on', !!(b & 16)); $('bX').classList.toggle('on', !!(b & 32)); $('bMenu').classList.toggle('on', !!(b & 64));
}
var PTRS = {};
function bitsFor(el, x, y){
  if(el === 'dpad'){
    var r = $('dpad').getBoundingClientRect(), dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2), dz = r.width * .12, b = 0;
    if(Math.abs(dx) < dz && Math.abs(dy) < dz) return 0;
    var a = Math.atan2(dy, dx), s = Math.PI / 8;
    if(a > -3 * s && a < 3 * s) b |= 2;             /* right */
    if(a > 5 * s || a < -5 * s) b |= 1;             /* left */
    if(a > s && a < 7 * s) b |= 8;                  /* down */
    if(a < -s && a > -7 * s) b |= 4;                /* up */
    return b;
  }
  return el === 'bO' ? 16 : el === 'bX' ? 32 : el === 'bMenu' ? 64 : 0;
}
function padSync(){ var b = 0; for(var k in PTRS) b |= PTRS[k].b; setBits(b); }
['dpad', 'bO', 'bX', 'bMenu'].forEach(function(id){
  var e = $(id);
  e.addEventListener('pointerdown', function(ev){ ev.preventDefault(); try { e.setPointerCapture(ev.pointerId); } catch(x){} PTRS[ev.pointerId] = { id: id, b: bitsFor(id, ev.clientX, ev.clientY) }; padSync(); padStart(); });
  e.addEventListener('pointermove', function(ev){ var p = PTRS[ev.pointerId]; if(p && p.id === 'dpad'){ p.b = bitsFor('dpad', ev.clientX, ev.clientY); padSync(); } });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function(t){ e.addEventListener(t, function(ev){ if(PTRS[ev.pointerId]){ delete PTRS[ev.pointerId]; padSync(); } }); });
});
$('bSelP').addEventListener('pointerdown', function(ev){ ev.preventDefault(); if(ST.open) closeSel(); else openSel(); });
/* a pad press before the game has started starts it, with this page's audio (the press is this page's) */
function padStart(){
  if(ST.started || ST.open) return;
  var w = gw(), st = w && w.document.getElementById('start');
  if(!st) return;
  try { ST.audio = new (window.AudioContext || window.webkitAudioContext)(); w.pico8_audio_context = ST.audio; if(ST.audio.resume) ST.audio.resume(); } catch(e){ ST.audio = null; }
  try { w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'x', keyCode: 88 })); } catch(e){}
  markStarted();
}

/* ---- a gamepad: SELECT (released without START) opens the select screen; in it, the pad chooses ---- */
var GP = { prev: {}, selDown: false, startSeen: false, rep: 0 };
function gpLoop(){
  requestAnimationFrame(gpLoop);
  var pads = []; try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch(e){}
  for(var i = 0; i < pads.length; i++){ var p = pads[i]; if(!p) continue;
    var btn = function(k){ return !!(p.buttons[k] && p.buttons[k].pressed); }, pv = GP.prev[i] || {};
    var now = { sel: btn(8), start: btn(9), a: btn(0), b: btn(1), l: btn(14) || p.axes[0] < -.6, r: btn(15) || p.axes[0] > .6, u: btn(12) || p.axes[1] < -.6, d: btn(13) || p.axes[1] > .6 };
    if(now.sel && !pv.sel){ GP.selDown = true; GP.startSeen = false; }
    if(now.sel && now.start) GP.startSeen = true;
    if(!now.sel && pv.sel && GP.selDown){ GP.selDown = false; if(!GP.startSeen){ if(ST.open) closeSel(); else openSel(); } }
    if(ST.open){
      if(now.l && !pv.l) move(-1, 0); if(now.r && !pv.r) move(1, 0); if(now.u && !pv.u) move(0, -1); if(now.d && !pv.d) move(0, 1);
      if(now.a && !pv.a) choose(); if(now.b && !pv.b) closeSel();
    }
    GP.prev[i] = now;
  }
}

/* ---- the hooks the gates use ---- */
window.VALLEY = {
  version: VALLEY_VERSION, base: function(){ return BASE; },
  games: function(){ return GAMES.map(function(g){ return { slug: g.slug, title: g.title, studio: g.studio }; }); },
  state: function(){ return { cur: ST.cur, open: ST.open, hi: ST.hi, started: ST.started, err: ST.err, bits: ST.bits, time: ST.tLeft, audio: !!ST.audio }; },
  open: openSel, close: closeSel, pick: function(slug){ for(var i = 0; i < GAMES.length; i++) if(GAMES[i].slug === slug){ ST.hi = i; paintSel(); choose(); return true; } return false; },
  press: function(bits){ setBits(bits); }
};

buildGrid(); layout();
window.addEventListener('resize', function(){ layout(); if(ST.open) paintSel(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitGrid(); });
load(bySlug(DEFAULT) ? DEFAULT : GAMES[0].slug, false);
requestAnimationFrame(gpLoop);
})();
</script>
</body>
</html>
