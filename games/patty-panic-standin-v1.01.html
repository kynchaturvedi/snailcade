var FIRE = { parts: [], MAX_PARTS: 120, _emitters: [] };
FIRE.embers = function(x, y, w, rate, col){
  var em = { x:x, y:y, w:(w||8), rate:(rate||16), col:(col||'#ff7a2a'), acc:0, live:true };

};

      while(em.acc >= 1){ em.acc -= 1;
        if(FIRE.parts.length < FIRE.MAX_PARTS) FIRE.parts.push({ x: em.x + (Math.random() - 0.5) * em.w, y: em.y, vx: (Math.random() - 0.5) * 0.5, vy: -0.55 - Math.random() * 0.7, g: -0.004, t: 0.7 + Math.random() * 0.6, t0: 1.3, col: em.col, kind: 'ember' }); } }

  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
  for(var x = 20; x <= W - 20; x += 28){ ctx.beginPath(); ctx.moveTo(x + .5, 276); ctx.lineTo(x + .5, 388); ctx.stroke(); }
  for(var y = 276; y <= 388; y += 28){ ctx.beginPath(); ctx.moveTo(20, y + .5); ctx.lineTo(W - 20, y + .5); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(W / 2, 332, 50, 0, 6.283); ctx.stroke();
  T(CFG.paletteNote, W / 2, 404, 6, CFG.dim);
}
function drawBye(){ logo(180); T('CLOSE THIS TAB TO RETURN', W / 2, 230, 8, '#ffffff'); }

/* ---- fit and loop (display, resolution and clock laws) ---- */
function fit(){
  var vw = window.innerWidth, vh = window.innerHeight, s = Math.min(vw / W, vh / H);
  if(s >= 2) s = Math.floor(s * 4) / 4;
  var dpr = Math.min(3, window.devicePixelRatio || 1); K = s * dpr;
  cv.width = Math.round(W * K); cv.height = Math.round(H * K);
  cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', fit); fit();
var last = 0, acc = 0, STEP = 1000 / 60;
function loop(now){
  requestAnimationFrame(loop);
  if(!last) last = now; var ms = now - last; last = now;
  if(ms > 250){ ms = STEP; acc = 0; }                       /* drop the lost time, never sprint */
  acc += ms; var n = 0;
  while(acc >= STEP && n < 5){ step(1 / 60); acc -= STEP; n++; }
  if(n === 5) acc = 0;
  render();
}
function step(dt){ S.t += dt; if(S.flash > 0) S.flash -= dt; pollPad(); if(typeof artStep === 'function') artStep(dt); }
function render(){
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.imageSmoothingEnabled = false;
  frameUI();
  if(S.screen === 'menu') drawMenu(); else if(S.screen === 'sound') drawSound(); else if(S.screen === 'input') drawInput();
  else if(S.screen === 'sprite') drawSprites(); else if(S.screen === 'color') drawColor(); else drawBye();
  ctx.fillStyle = 'rgba(0,0,0,.18)'; for(var y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);   /* CRT RASTER PACK look: alpha .13 to .2, pitch 2 */
  if(ERR){ ctx.fillStyle = '#3a0710'; ctx.fillRect(0, H - 18, W, 18); T(ERR.slice(0, 60), W / 2, H - 9, 6, '#ffd7da'); }   /* ERR line LAST */
}
requestAnimationFrame(loop);
})();
