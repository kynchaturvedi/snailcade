<style>/* =====================================================================
   SNAILCADE v1.20 | Snail Attack Studios | stylesheet
   One dark world by design (an arcade at night): every color is set
   explicitly, so the page reads the same on any host theme.
   Three faces, three materials: TILT NEON is the glass tube on the wall,
   SILKSCREEN is the phosphor on the CRT, BARLOW CONDENSED is the printed
   instruction card. BUNGEE is reserved for the backlit marquees.
   ===================================================================== */
:root{
  color-scheme: dark;
  --room:#07050c;
  --wall-a:#170e27; --wall-b:#0c0816;
  --ink:#eaffff; --ink-2:#c6cdea; --ink-3:#8f98bf; --ink-4:#5b638a;
  --pink:#ff3df0; --pink-l:#ffc1f9; --cyan:#46f3ff; --yellow:#ffe34d;
  --green:#51ff7e; --orange:#ffb13d; --purple:#b06bff; --red:#ff4d5e;
  --accent:#ff3df0; --accent-2:#46f3ff; --accent-ink:#1b0718;
  --card:#f3e8cc; --card-2:#e9dab3; --card-ink:#22170f; --card-3:#6b5a45;
  --f-neon:"Tilt Neon","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-pix:"Silkscreen","Courier New",ui-monospace,monospace;
  --f-card:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-mq:"Bungee","Arial Black",Impact,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --top-h:52px;
}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--room);color:var(--ink);font-family:var(--f-card);
  font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus{outline:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- the room ---------------------------------------------------- */
.app{position:fixed;inset:0;overflow:hidden;background:var(--room);touch-action:pan-y}
.room{position:absolute;inset:0;overflow:hidden}
.backdrop{position:absolute;inset:0}
/* v1.16: the room's dark, the back wall and the carpet are canvases (07-lobby.js, paintRoom): as CSS gradients and a CSS tile
   the Director's phone tiled them at its full 2.75x, and ran out of the graphics memory the sign and the placard needed */
.backdrop canvas{display:block;width:100%;height:100%}
.roomc{position:absolute;top:0;display:block}
.stage{position:absolute;left:0;right:0;overflow:visible;pointer-events:none}
.rig{position:absolute;left:50%;top:0;width:0;height:0;transform-style:preserve-3d}
.rig *{box-sizing:border-box}
/* v1.15: the layers the row moves every frame keep the scale they were painted at: without this a phone repainted each one
   at every new size mid swipe (1510 paint tasks in four swipes, 732 with it), and what it could not repaint in time blanked */
.cab,.wall3d,.floor3d,.cm,.snail,.brrig{will-change:transform}
/* and the layers inside them that a moving cabinet carries (the paint trace named each one) */
.cab .face,.cab .side,.face .crt .scan,.face .shade,.cm .face,.cm .side,.cm .shade,.snail-shadow{will-change:transform}
.wall3d{position:absolute;left:-1200px;top:-420px;width:3630px;height:980px;   /* v1.15: its left and width set from the registry (07-lobby.js, sizeRoom); it starts at y -420, not -740: nothing above about -270 is ever on screen */
  transform:translateZ(-88px);backface-visibility:hidden}   /* v1.16: its colours, seams and baseboard are painted on canvases (paintRoom) */
.floor3d{position:absolute;left:-1200px;top:560px;width:3630px;height:640px;   /* v1.15: left and width from the registry (sizeRoom) */
  transform-origin:50% 0;transform:translateZ(-88px) rotateX(90deg);backface-visibility:hidden}   /* v1.16: the carpet and its shading, on canvases (paintRoom) */

/* v1.12: the back room (07b-backroom.js), picked by the BACKDROP switch; THE WALL is the default.
   v1.13: built in 3D, a second stage behind the row (same perspective, same scale), painted once a backdrop */
.brstage{position:absolute;left:0;right:0;display:none;overflow:visible;pointer-events:none}
.brrig{position:absolute;left:50%;top:0;width:0;height:0;transform-style:preserve-3d}
.brrig *{box-sizing:border-box}
.brrig>*{position:absolute}
.brwall{display:block}
.brceil{display:block;transform-origin:50% 0}
.brfloor{transform-origin:50% 0}   /* v1.16: its carpet, shading and pools of light on canvases (brPaint) */
.brfar{display:block;transform-origin:50% 0}
.brart{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.brscr{position:absolute;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.brman{position:absolute;display:block;image-rendering:pixelated;image-rendering:crisp-edges}   /* v1.18: the players, 8 units a pixel */
.brvalley{transform-style:preserve-3d}   /* v1.18: VALLEY, a box of its own: the front, its sign, its side */
.brvalley>canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.brvalley>canvas.brscr,.brvalley>canvas.vsign,.brvalley>canvas.brman{width:auto;height:auto}
.brvalley .vside{position:absolute;left:0;top:0;width:170px;height:560px;transform-origin:0 0;transform:translateZ(-170px) rotateY(-90deg);backface-visibility:hidden}   /* its left side, as an island's left end */
.brvalley .vside canvas{display:block;width:100%;height:100%}
.brvalley .vside.r{left:260px;transform:rotateY(90deg)}   /* v1.19: in HAPPY VALLEY its right side shows */
.brvalley .vman{transform:translateZ(46px)}   /* the friend stands at the sticks, in front of the machine */
.brside{transform-origin:0 0;backface-visibility:hidden}   /* v1.16: its colour and trim on a canvas (.brart) */
.brfade{position:absolute;left:0;right:0;top:0;display:none;pointer-events:none}
.brfade canvas{display:block;width:100%;height:100%}
.app[data-backdrop="floor"] .brstage,.app[data-backdrop="midnight"] .brstage,.app[data-backdrop="happy"] .brstage,
.app[data-backdrop="floor"] .brfade,.app[data-backdrop="midnight"] .brfade,.app[data-backdrop="happy"] .brfade{display:block}
.brroom,.hvroom{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}   /* v1.19: the floor's room and HAPPY VALLEY share the stage */
.brroom>*,.hvroom>*{position:absolute}
.app[data-backdrop="happy"] .brroom,.app[data-backdrop="happy"] .brsign,.app:not([data-backdrop="happy"]) .hvroom,.app:not([data-backdrop="happy"]) .hvsign{display:none}
.app[data-backdrop="happy"] .cm{display:none}   /* VALLEY stands where the change machine stands */
.app[data-backdrop="floor"] .wall3d,.app[data-backdrop="midnight"] .wall3d,.app[data-backdrop="happy"] .wall3d,
.app[data-backdrop="floor"] .cab .wglow,.app[data-backdrop="midnight"] .cab .wglow,.app[data-backdrop="happy"] .cab .wglow,
.app[data-backdrop="floor"] .housesign,.app[data-backdrop="midnight"] .housesign,.app[data-backdrop="happy"] .housesign,
.app[data-backdrop="floor"] .freeplay,.app[data-backdrop="midnight"] .freeplay,.app[data-backdrop="happy"] .freeplay{display:none}   /* v1.18: FREE PLAY hangs on the back wall too, and VALLEY's sign needs its sky */

/* ---------- a cabinet ---------------------------------------------------- */
.cab{position:absolute;left:-130px;top:0;width:260px;height:560px;transform-style:preserve-3d;
  pointer-events:none;--glow:255,61,240;--shade:0;--power:1;--mq:255,61,240}
.cab .face,.cab .side{position:absolute;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cab .face{left:0;width:260px;height:560px;transform:translateZ(85px);pointer-events:auto;cursor:pointer}
.cab .side{left:23px;width:214px;height:560px}
.cab .side.r{transform:translate3d(130px,0,22px) rotateY(90deg)}
.cab .side.l{transform:translate3d(-130px,0,22px) rotateY(-90deg)}
.cab .side canvas{position:absolute;left:-4px;top:-4px;width:222px;height:568px;display:block}   /* v1.16: the art, the angle shade, the trim (paintSides; the margin is SIDE_M) */
.cab .side .sshade{opacity:calc(var(--shade)*.735)}   /* over the standing .32: 1-(1-.32)(1-a) = .32 + shade*.5, as the old colour was */
.cab .wglow{position:absolute;left:-190px;top:-300px;width:640px;height:560px;transform:translateZ(-86px);
  display:block;opacity:var(--power);backface-visibility:hidden}   /* v1.15: a 64 x 56 canvas (paintGlows), the gradient it replaced drawn in it */
.cab .fglow{position:absolute;left:-150px;top:559px;width:560px;height:430px;transform-origin:50% 0;
  transform:translateZ(-60px) rotateX(90deg);backface-visibility:hidden;display:block;opacity:var(--power)}   /* v1.15: a 56 x 43 canvas */
.cab .fshadow{position:absolute;left:-30px;top:558px;width:320px;height:300px;transform-origin:50% 0;
  transform:translateZ(-92px) rotateX(90deg);backface-visibility:hidden;display:block}   /* v1.15: a 32 x 30 canvas */

/* face regions (units are cabinet px) */
.face .tm{position:absolute;top:0;width:8px;height:560px;
  background:linear-gradient(90deg,var(--tm-d) 0,var(--tm) 30%,var(--tm-h) 50%,var(--tm) 70%,var(--tm-d) 100%)}
.face .tm.l{left:0}.face .tm.r{right:0}
.face .mq{position:absolute;left:0;top:0;width:260px;height:96px;background:#0b0b10;
  border-radius:4px 4px 0 0;box-shadow:inset 0 0 0 2px #26262e,inset 0 -3px 0 #000}
.face .mq-art{position:absolute;left:7px;top:7px;width:246px;height:82px;overflow:hidden;border-radius:2px}
.face .mq-lit{position:absolute;left:7px;top:7px;width:246px;height:82px;border-radius:2px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,0) 0,rgba(255,255,255,.12) 42%,rgba(255,255,255,.04) 58%,rgba(255,255,255,0) 100%);
  mix-blend-mode:screen;opacity:var(--power)}
.face .mq-dark{position:absolute;left:7px;top:7px;width:246px;height:82px;border-radius:2px;pointer-events:none;
  background:#050409;opacity:calc(.86 - var(--power)*.86)}
.face .grille{position:absolute;left:10px;top:96px;width:240px;height:12px;background-color:#08080b;
  background-image:radial-gradient(circle,#2a2a33 0 1.1px,rgba(0,0,0,0) 1.4px);background-size:5px 5px;
  box-shadow:inset 0 3px 3px rgba(0,0,0,.9)}
.face .bezel{position:absolute;left:8px;top:108px;width:244px;height:224px;overflow:hidden}
.face .crt{position:absolute;left:46px;top:8px;width:152px;height:208px;border-radius:15px/19px;overflow:hidden;
  background:#020307;box-shadow:0 0 0 3px #030305,0 0 0 5px rgba(255,255,255,.05),0 0 16px 3px rgba(var(--glow),calc(.30*var(--power)))}
.face .crt canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.face .crt .scan{position:absolute;inset:0;pointer-events:none;opacity:var(--scan,1);
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.30) 0 1px,rgba(0,0,0,0) 1px 3px)}
.face .crt .glass{position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    radial-gradient(120% 95% at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.55) 100%),
    linear-gradient(128deg,rgba(255,255,255,.16) 0,rgba(255,255,255,.05) 22%,rgba(255,255,255,0) 38%)}
.face .cp{position:absolute;left:0;top:332px;width:260px;height:60px;
  clip-path:polygon(16px 0,244px 0,260px 100%,0 100%)}
.face .cp-glow{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(var(--glow),calc(.22*var(--power))) 0,rgba(var(--glow),0) 70%)}
.face .lip{position:absolute;left:0;top:392px;width:260px;height:16px;
  background:linear-gradient(180deg,var(--tm-h) 0,var(--tm) 18%,var(--tm-d) 100%);box-shadow:0 3px 4px rgba(0,0,0,.6)}
.face .lower{position:absolute;left:8px;top:408px;width:244px;height:132px;overflow:hidden}
.face .kick{position:absolute;left:8px;top:540px;width:244px;height:20px;
  background:linear-gradient(180deg,#0c0c10,#050507);box-shadow:inset 0 2px 0 rgba(255,255,255,.05)}
.face .shade{position:absolute;inset:0;background:#040308;opacity:var(--shade);pointer-events:none}   /* v1.16: square, so a phone draws it as one colour and keeps no tiles for it (3 MB apiece at 2.75x) */

/* coin door */
.door{position:absolute;left:80px;top:16px;width:84px;height:104px;border-radius:3px;
  background:linear-gradient(180deg,#b9bfcc 0,#8d93a1 12%,#6c7180 55%,#555a67 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),inset 0 -2px 0 rgba(0,0,0,.35),0 2px 3px rgba(0,0,0,.7)}
.door .slot{position:absolute;top:10px;width:30px;height:40px;border-radius:2px;
  background:linear-gradient(180deg,#3a3d47,#23252c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.door .slot.s1{left:9px}.door .slot.s2{right:9px}
.door .lamp{position:absolute;left:3px;top:4px;width:24px;height:14px;border-radius:1px;
  font:700 5px/14px var(--f-pix);text-align:center;letter-spacing:.2px;color:#ffe9ea;
  background:radial-gradient(90% 90% at 50% 50%,#ff5a5f 0,#c8141e 70%);
  box-shadow:0 0 6px 1px rgba(255,60,70,calc(.55*var(--power))),inset 0 0 2px rgba(255,255,255,.6);
  opacity:calc(.35 + .65*var(--power))}
.door .mouth{position:absolute;left:13px;top:23px;width:4px;height:12px;border-radius:2px;background:#050506;
  box-shadow:0 0 0 1px #8e929c}
.door .ret{position:absolute;top:58px;width:16px;height:10px;border-radius:2px;background:linear-gradient(180deg,#2c2f37,#17181d)}
.door .ret.r1{left:16px}.door .ret.r2{right:16px}
.door .lock{position:absolute;left:37px;top:80px;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#f1f3f8,#8c909c 60%,#4c4f59);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.door .lock::after{content:"";position:absolute;left:4px;top:2px;width:2px;height:6px;background:#2b2d33;border-radius:1px}
.door.hit .lamp{animation:lampHit .6s steps(2) 2}
@keyframes lampHit{50%{filter:brightness(2.2)}}

/* control panel furniture */
.stick{position:absolute;width:28px;height:30px}
.stick .base{position:absolute;left:1px;bottom:0;width:26px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#3a3a44,#0d0d11 70%);box-shadow:0 1px 1px rgba(0,0,0,.8)}
.stick .shaft{position:absolute;left:12px;bottom:4px;width:4px;height:16px;border-radius:2px;
  background:linear-gradient(90deg,#9aa0ad,#e8ebf2 45%,#6f7481);transform-origin:50% 100%;transition:transform .08s}
.stick .ball{position:absolute;left:5px;top:0;width:18px;height:17px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffffff 0,var(--ball,#ff3b47) 28%,var(--ball-d,#8e0f18) 100%);
  box-shadow:0 2px 2px rgba(0,0,0,.6);transition:transform .08s}
.pbtn{position:absolute;width:19px;height:13px;border-radius:50%;
  background:radial-gradient(60% 55% at 45% 38%,#fff 0,var(--c) 32%,var(--cd) 100%);
  box-shadow:0 3px 0 var(--cd),0 4px 3px rgba(0,0,0,.7),0 0 8px rgba(var(--cg),calc(.35*var(--power)))}
.pbtn.on{transform:translateY(2px);box-shadow:0 1px 0 var(--cd),0 2px 2px rgba(0,0,0,.7),0 0 14px rgba(var(--cg),.9)}
.sbtn{position:absolute;width:12px;height:8px;border-radius:2px;background:#e9edf7;
  box-shadow:0 2px 0 #7b8090,0 0 6px rgba(255,255,255,calc(.25*var(--power)))}
.sbtn.blink{animation:sblink 1s steps(2) infinite}
@keyframes sblink{50%{background:#5b5e69;box-shadow:0 2px 0 #3a3d46}}
.cpl{position:absolute;font:700 5px/1 var(--f-pix);letter-spacing:.3px;color:var(--cpl,#fff);opacity:.85;white-space:nowrap}

/* theme: DINER (PATTY PANIC) */
.cab.diner{--tm:#ffc23a;--tm-h:#fff0a8;--tm-d:#9c6a0a}
.cab.diner .face{background:linear-gradient(180deg,#b61f2a 0,#a31a25 60%,#8d1520 100%)}
.cab.diner .bezel{background:#120f12;box-shadow:inset 0 0 0 2px #2a2226}
.cab.diner .bezel::before{content:"";position:absolute;left:40px;top:3px;width:164px;height:218px;border-radius:18px/22px;
  background:conic-gradient(#fff1d0 25%,#b61f2a 0 50%,#fff1d0 0 75%,#b61f2a 0) 0 0/8px 8px;opacity:.9}
.cab.diner .cp{background:linear-gradient(180deg,#fff1d0 0,#f1dfb5 100%)}
.cab.diner .cp::before{content:"";position:absolute;inset:6px 22px 8px;border:2px solid #b61f2a;border-radius:6px;
  clip-path:none;opacity:.85}
.cab.diner .lower{background:
  linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 4px,#fff1d0 4px,#fff1d0 12px,#ffc23a 12px,#ffc23a 15px,rgba(0,0,0,0) 15px),
  linear-gradient(180deg,#a51b26,#861420)}

/* theme: NEON (NEON SWARM) */
.cab.neon{--tm:#ff3df0;--tm-h:#ffd2f9;--tm-d:#7c0f73}
.cab.neon .face{background:linear-gradient(180deg,#0c0a16 0,#0a0913 70%,#07060d 100%)}
.cab.neon .tm{box-shadow:0 0 8px rgba(255,61,240,calc(.55*var(--power)))}
.cab.neon .bezel{background:
  repeating-linear-gradient(90deg,rgba(70,243,255,.10) 0 1px,rgba(0,0,0,0) 1px 12px),
  repeating-linear-gradient(0deg,rgba(70,243,255,.10) 0 1px,rgba(0,0,0,0) 1px 12px),
  #04050d;box-shadow:inset 0 0 0 2px #151a33}
.cab.neon .cp{background:linear-gradient(180deg,#171428 0,#0e0c1a 100%)}
.cab.neon .cp::before{content:"";position:absolute;left:20px;right:20px;top:6px;bottom:8px;border:1px solid rgba(70,243,255,.55);
  border-radius:5px;box-shadow:0 0 6px rgba(70,243,255,calc(.4*var(--power)))}
.cab.neon .lower{background:
  repeating-linear-gradient(135deg,rgba(0,0,0,0) 0 26px,rgba(255,61,240,.55) 26px 28px,rgba(0,0,0,0) 28px 40px,rgba(70,243,255,.35) 40px 41px,rgba(0,0,0,0) 41px 64px),
  linear-gradient(180deg,#0c0a16,#07060d)}

/* theme: GRID (GRID GRUDGE, v1.11): the game's fight card, ink and panel steel, ember for your side, steel for theirs */
.cab.grid{--tm:#ff5a3c;--tm-h:#ffc2b3;--tm-d:#7a1e0e}
.cab.grid .face{background:linear-gradient(180deg,#18202f 0,#121827 62%,#0e1420 100%)}
.cab.grid .tm{box-shadow:0 0 8px rgba(255,90,60,calc(.5*var(--power)))}
.cab.grid .bezel{background:
  repeating-linear-gradient(90deg,rgba(96,150,220,.09) 0 1px,rgba(0,0,0,0) 1px 11px),
  repeating-linear-gradient(0deg,rgba(96,150,220,.09) 0 1px,rgba(0,0,0,0) 1px 11px),
  #0b0e14;box-shadow:inset 0 0 0 2px #1d2a42}
.cab.grid .gb{position:absolute;width:16px;height:16px;border:0 solid rgba(55,205,250,.55);box-shadow:0 0 6px rgba(55,205,250,calc(.35*var(--power)))}
.cab.grid .gb.tl{left:7px;top:7px;border-width:2px 0 0 2px}.cab.grid .gb.tr{right:7px;top:7px;border-width:2px 2px 0 0}
.cab.grid .gb.bl{left:7px;bottom:7px;border-width:0 0 2px 2px}.cab.grid .gb.br{right:7px;bottom:7px;border-width:0 2px 2px 0;border-color:rgba(255,90,60,.6)}
.cab.grid .cp{background:linear-gradient(180deg,#18202f 0,#0e1420 100%)}
.cab.grid .cp::before{content:"";position:absolute;left:18px;right:18px;top:6px;bottom:8px;border:1.5px solid #37cdfa;border-radius:8px;
  box-shadow:0 0 5px rgba(55,205,250,calc(.45*var(--power))),inset 0 9px 7px -6px rgba(255,255,255,.10)}
.cab.grid .lower{background:
  linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 5px,#ff5a3c 5px,#ff5a3c 7px,rgba(0,0,0,0) 7px,rgba(0,0,0,0) 10px,#37cdfa 10px,#37cdfa 11px,rgba(0,0,0,0) 11px),
  repeating-linear-gradient(90deg,rgba(96,150,220,.08) 0 1px,rgba(0,0,0,0) 1px 16px),
  repeating-linear-gradient(0deg,rgba(96,150,220,.08) 0 1px,rgba(0,0,0,0) 1px 16px),
  radial-gradient(120% 70% at 50% 110%,rgba(255,90,60,.18),rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#121827,#0b0e14)}

/* theme: SOON (the out of order cabinet) */
.cab.soon{--tm:#4a4d57;--tm-h:#777b87;--tm-d:#25272e;--mq:200,210,255;--glow:120,130,170}
.cab.soon .face{background:linear-gradient(180deg,#2b2d35,#23252c 70%,#1d1f25)}
.cab.soon .bezel{background:#111217}
.cab.soon .cp{background:linear-gradient(180deg,#34363f,#2a2c33)}
.cab.soon .lower{background:linear-gradient(180deg,#26282f,#1f2127)}
.note{position:absolute;left:18px;top:52px;width:118px;padding:10px 8px 9px;transform:rotate(-4deg);
  background:#f3ecd9;color:#1d1a16;font:800 italic 12px/1.05 var(--f-card);text-transform:uppercase;text-align:center;
  box-shadow:0 2px 4px rgba(0,0,0,.6);letter-spacing:.2px}
.note b{display:block;font:400 17px/1 var(--f-mq);letter-spacing:.5px;color:#c8141e;margin-bottom:5px}
.note small{display:block;margin-top:5px;font:600 italic 10px/1.1 var(--f-card);color:#5a5046;text-transform:none}
.note::before,.note::after{content:"";position:absolute;top:-6px;width:34px;height:12px;background:rgba(236,230,205,.78);
  box-shadow:0 1px 1px rgba(0,0,0,.2)}
.note::before{left:-8px;transform:rotate(-24deg)}.note::after{right:-8px;transform:rotate(20deg)}

/* marquee art */
.mq-diner{background:
  radial-gradient(120% 90% at 50% 50%,#fff8e6 0,#ffe6ad 55%,#f5c779 100%)}
.mq-diner .checks{position:absolute;left:0;right:0;height:8px;
  background:conic-gradient(#b61f2a 25%,#fff4dc 0 50%,#b61f2a 0 75%,#fff4dc 0) 0 0/8px 8px}
.mq-diner .checks.t{top:0}.mq-diner .checks.b{bottom:0}
.mq-logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f-mq);line-height:.86;text-align:center;letter-spacing:.5px}
.mq-logo span{position:relative;display:block}
.mq-diner .mq-logo span{font-size:27px;color:#ffc93a;
  background:linear-gradient(180deg,#fff7c2 0,#ffd23f 45%,#ff9a3a 100%);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.mq-diner .mq-logo span::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;
  -webkit-text-fill-color:#4a1b0c;color:#4a1b0c;
  text-shadow:2px 0 #4a1b0c,-2px 0 #4a1b0c,0 2px #4a1b0c,0 -2px #4a1b0c,2px 2px #4a1b0c,-2px 2px #4a1b0c,2px -2px #4a1b0c,-2px -2px #4a1b0c,
    0 4px 0 #b61f2a,1px 5px 0 #7e141c,0 6px 0 #4a1b0c}
.mq-diner .mq-logo{isolation:isolate}
.mq-diner img{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
.mq-neon{background:radial-gradient(90% 120% at 50% 110%,#2a0a3a 0,#0b0716 55%,#05040b 100%)}
.mq-neon .grid{position:absolute;left:-40%;right:-40%;bottom:-6px;height:13.54px;background-size:100% 100%;opacity:.8}   /* v1.16: drawn in perspective (neonGridURL), no longer a 3D plane: 40 tall turned 58deg under a 60 perspective shows 13.54 */
.mq-neon .stars{position:absolute;inset:0;background-image:
  radial-gradient(circle,rgba(234,255,255,.9) 0 .7px,rgba(0,0,0,0) 1px),
  radial-gradient(circle,rgba(70,243,255,.8) 0 .6px,rgba(0,0,0,0) 1px);
  background-size:23px 19px,37px 29px;background-position:3px 4px,11px 9px;opacity:.7}
.mq-neon .mq-logo span{font-size:25px;color:#fff}
.mq-neon .mq-logo span.a{text-shadow:0 0 2px #fff,0 0 5px var(--pink),0 0 10px var(--pink),0 0 18px var(--pink)}
.mq-neon .mq-logo span.b{text-shadow:0 0 2px #fff,0 0 5px var(--cyan),0 0 10px var(--cyan),0 0 18px var(--cyan)}
.mq-neon img{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
.mq-grid{background:#0b0e14}
.mq-grid img{position:absolute}
.mq-soon{background:linear-gradient(180deg,#1b1c22,#131419)}
.mq-soon .mq-logo span{font-size:19px;color:#3d404b;text-shadow:none}
.mq-soon.flick .mq-logo span{color:#dfe6ff;text-shadow:0 0 6px rgba(200,210,255,.8)}
.ribbon{position:absolute;right:-20px;top:9px;width:86px;transform:rotate(38deg);text-align:center;
  font:700 7px/13px var(--f-pix);letter-spacing:.8px;color:#1a0010;background:var(--yellow);box-shadow:0 1px 2px rgba(0,0,0,.5)}

/* ---------- the change machine (decor at the head of the row) ---------------- */
.cm{position:absolute;left:-95px;top:70px;width:190px;height:490px;transform-style:preserve-3d;pointer-events:none;--shade:0}
.cm .face,.cm .side{position:absolute;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cm .face{left:0;width:190px;height:490px;transform:translateZ(70px);pointer-events:auto;cursor:pointer;border-radius:8px 8px 2px 2px;
  background:linear-gradient(90deg,#7f858f 0,#c7ccd6 16%,#a9afba 48%,#c1c6d0 84%,#737883 100%);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.35)}
.cm .side{left:25px;width:140px;height:490px;background:linear-gradient(180deg,#5d626c,#3f434b);border-radius:8px 8px 0 0}
.cm .side.r{transform:translate3d(95px,0,0) rotateY(90deg)}
.cm .side.l{transform:translate3d(-95px,0,0) rotateY(-90deg)}
.cm .lit{position:absolute;left:14px;right:14px;top:16px;height:82px;border-radius:5px;display:grid;place-items:center;text-align:center;
  background:radial-gradient(80% 90% at 50% 45%,#fffdf6 0,#f6ecd6 70%,#e6d9bd 100%);box-shadow:inset 0 0 0 3px #dfe3ea,0 0 22px rgba(255,238,200,.55)}
.cm .lit b{display:block;font:400 30px/1 var(--f-mq);color:#d4202e;letter-spacing:.04em}
.cm .lit small{display:block;margin-top:6px;font:700 8px/1 var(--f-pix);letter-spacing:.22em;color:#3a3d45}
.cm .bill{position:absolute;left:34px;right:34px;top:128px;height:74px;border-radius:5px;background:linear-gradient(180deg,#26282f,#15161a);
  box-shadow:inset 0 0 0 2px #0b0b0d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cm .bill span{font:700 7px/1 var(--f-pix);letter-spacing:.14em;color:#9aa0ad}
.cm .bill .mouth{width:84px;height:5px;border-radius:3px;background:#000;box-shadow:0 0 0 2px #3b3e47,0 0 10px rgba(81,255,126,.35)}
.cm .bill .arr{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:9px solid #51ff7e;
  filter:drop-shadow(0 0 4px #51ff7e);animation:cmArr 1.1s steps(2) infinite}
@keyframes cmArr{50%{opacity:.25}}
.cm .plate{position:absolute;left:30px;right:30px;top:226px;padding:8px 4px;border-radius:3px;text-align:center;
  font:700 7px/1.6 var(--f-pix);letter-spacing:.12em;color:#2a2c33;background:linear-gradient(180deg,#e9edf4,#b9bfcb);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.cm .cup{position:absolute;left:52px;right:52px;top:330px;height:62px;border-radius:6px 6px 10px 10px;
  background:radial-gradient(90% 80% at 50% 20%,#0b0b0e 0,#1e2026 70%,#34373f 100%);box-shadow:inset 0 6px 10px rgba(0,0,0,.9),0 0 0 3px #8f95a1}
.cm .kickcm{position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(180deg,#2a2c33,#15161a)}
.cm .shade{position:absolute;inset:0;background:#040308;opacity:var(--shade);pointer-events:none;border-radius:8px 8px 2px 2px}

/* ---------- neon sign ----------------------------------------------------- */
.signwrap{position:absolute;left:0;right:0;margin:0 auto;width:max-content;display:flex;align-items:center;justify-content:center;pointer-events:none}   /* v1.16: as wide as the sign, not the screen (its layer is tiled at the screen's density) */
.sign{position:relative;display:grid;grid-template-columns:auto auto;align-items:center;column-gap:.14em;row-gap:.1em;font-size:var(--sign-fs,72px)}
.sign-snail{width:1.32em;height:1.02em;flex:none;overflow:visible}
.sign-snail path,.sign-snail circle{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sign-snail .tube{stroke:#d8fff9;stroke-width:3.2}
.sign-snail .halo{stroke:rgba(70,243,255,.55);stroke-width:9;filter:blur(3px)}
.sign-snail.off .tube{stroke:#1b3a3f}.sign-snail.off .halo{stroke:rgba(0,0,0,0)}
.sign-snail{filter:drop-shadow(0 0 4px rgba(70,243,255,.9)) drop-shadow(0 0 14px rgba(70,243,255,.55))}
.sign-snail.off{filter:none}
.sign-word{margin:0;font-weight:400;font-family:var(--f-neon);font-size:1em;line-height:1;letter-spacing:.02em;white-space:nowrap;display:flex}
.nl{display:inline-block;color:#ffe3fb;
  text-shadow:0 0 1px #fff,0 0 4px #ff8df5,0 0 10px #ff3df0,0 0 22px #ff3df0,0 0 44px rgba(255,61,240,.75),0 0 80px rgba(200,20,190,.55)}
.nl.off{color:#3b1c3a;text-shadow:0 0 1px rgba(255,120,240,.15)}
.nl.flaky{will-change:transform}   /* v1.16: the C that stutters is its own small layer, so a stutter repaints one letter, not the sign (9 to 16 MB of fresh tiles at 2.75x) */
.sign-sub{grid-column:1 / -1;justify-self:center;white-space:nowrap;padding-left:.34em;
  font:400 .2em/1 var(--f-neon);letter-spacing:.34em;color:#d9fffb;
  text-shadow:0 0 1px #fff,0 0 4px #46f3ff,0 0 10px #46f3ff,0 0 20px rgba(70,243,255,.7)}
.sign-sub.off{color:#16373b;text-shadow:none}
.freeplay{position:absolute;right:max(18px,calc(var(--safe-r) + 18px));font:400 18px/1 var(--f-neon);letter-spacing:.12em;
  color:#e6ffe9;padding:6px 10px;border:2px solid rgba(81,255,126,.9);border-radius:10px;transform:rotate(-4deg);
  text-shadow:0 0 2px #fff,0 0 6px #51ff7e,0 0 14px #51ff7e;
  box-shadow:0 0 8px rgba(81,255,126,.6),inset 0 0 8px rgba(81,255,126,.4);pointer-events:none}
.freeplay.off{color:#1d3a24;border-color:#1d3a24;text-shadow:none;box-shadow:none}
.housesign{position:absolute;left:max(18px,calc(var(--safe-l) + 18px));width:118px;padding:8px 9px;transform:rotate(2deg);
  background:#e8dcc0;color:#2a1d14;font:800 italic 12px/1.05 var(--f-card);text-transform:uppercase;text-align:center;
  box-shadow:0 3px 8px rgba(0,0,0,.6);pointer-events:none;opacity:.78}
.housesign b{display:block;color:#b8202b;font:400 12px/1 var(--f-mq);margin-bottom:3px}

/* ---------- top bar ------------------------------------------------------- */
.topbar{position:absolute;left:0;right:0;top:0;height:calc(var(--top-h) + var(--safe-t));
  padding:var(--safe-t) max(12px,calc(var(--safe-r) + 12px)) 0 max(14px,calc(var(--safe-l) + 14px));
  display:flex;align-items:center;justify-content:space-between;z-index:5;
  background:linear-gradient(180deg,rgba(7,5,12,.85),rgba(7,5,12,0))}
.brand{display:flex;align-items:center;gap:8px;font:700 12px/1 var(--f-pix);letter-spacing:.14em;color:var(--ink-2)}
.brand svg{width:22px;height:16px}
.tools{display:flex;gap:4px}
.tool{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);
  transition:background .15s,color .15s}
.tool:hover{background:rgba(255,255,255,.07);color:#fff}
.tool svg{width:20px;height:20px;shape-rendering:crispEdges}
.tool[aria-pressed="false"] .on,.tool[aria-pressed="true"] .off{display:none}
.tool.lit{color:var(--yellow)}

/* ---------- placard ---------------------------------------------------------- */
.placard{position:absolute;left:0;right:0;bottom:0;z-index:4;
  padding:24px max(16px,calc(var(--safe-r) + 16px)) calc(24px + var(--safe-b)) max(16px,calc(var(--safe-l) + 16px));
  display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(180deg,rgba(7,5,12,0) 0,rgba(7,5,12,.22) 28px,rgba(7,5,12,.84) 64px,rgba(7,5,12,.95) 100%)}   /* v1.12: a softer top edge, so the snail's lane on the carpet is not dimmed */
.plc{width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.plc-text{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.plc-text.swap{animation:plcIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes plcIn{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
.rm .plc-text.swap{animation:none}
.plc-title{margin:0;font:400 30px/1 var(--f-mq);letter-spacing:.02em;color:#fff;text-wrap:balance;
  text-shadow:0 0 18px rgba(var(--accent-rgb,255,61,240),.45)}
.plc-tag{margin:0;font:600 italic 19px/1.2 var(--f-card);color:var(--ink-2);max-width:46ch;text-wrap:balance}
.plc-meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px}
.plc-meta .facts{font:700 9px/1 var(--f-pix);letter-spacing:.14em;color:var(--ink-3);white-space:nowrap}
.chip{font:700 9px/1 var(--f-pix);letter-spacing:.12em;color:var(--ink-2);padding:5px 7px;border-radius:5px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);white-space:nowrap}
.chip.hot{color:#1a0716;background:var(--accent);border-color:transparent}
.plc-actions{display:flex;justify-content:center;gap:10px}
.coinbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px 0 14px;border-radius:26px;
  font:700 15px/1 var(--f-pix);letter-spacing:.12em;color:#140512;white-space:nowrap;
  background:linear-gradient(180deg,#fff 0,var(--accent) 30%,color-mix(in srgb,var(--accent) 70%,#000) 100%);
  box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 45%,#000),0 8px 18px rgba(0,0,0,.5),0 0 22px color-mix(in srgb,var(--accent) 55%,transparent);
  transition:transform .08s,box-shadow .08s,filter .2s}
.coinbtn:hover{filter:brightness(1.08)}
.coinbtn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 45%,#000),0 3px 8px rgba(0,0,0,.5)}
.coinbtn[disabled]{cursor:not-allowed;color:#9aa0b2;background:linear-gradient(180deg,#3a3d48,#23252d);box-shadow:0 4px 0 #111217;filter:none}
.coinbtn .tok{width:26px;height:26px;flex:none}
.ghost{height:52px;padding:0 18px;border-radius:26px;display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--f-pix);letter-spacing:.12em;
  color:var(--ink-2);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);transition:background .15s,color .15s;white-space:nowrap}
.ghost:hover{background:rgba(255,255,255,.1);color:#fff}
.ghost .ico{width:14px;height:14px;display:none}
.nav{position:absolute;z-index:4;top:50%;width:48px;height:48px;margin-top:-24px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid rgba(255,255,255,.16);background:rgba(10,8,18,.55);transition:background .15s,color .15s,opacity .2s}
.nav.prev{left:max(12px,calc(var(--safe-l) + 12px))}.nav.next{right:max(12px,calc(var(--safe-r) + 12px))}
.nav:hover{background:rgba(255,255,255,.12);color:#fff}
.nav svg{width:18px;height:18px}
.nav[disabled]{opacity:0;pointer-events:none}
.dots{position:absolute;bottom:calc(9px + var(--safe-b));left:50%;transform:translateX(-50%);display:flex;gap:8px}
.dot{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);transition:background .2s,width .2s}
.dot.on{background:var(--accent);width:34px}
.app:not([data-backdrop="happy"]) .dot.vdot{display:none}   /* v1.20: VALLEY's stop, in HAPPY VALLEY only */
.dot.vdot{background:rgba(79,216,204,.35)}
.dot.vdot.on{background:#4fd8cc}
@media (min-width:900px){
  .plc{flex-direction:row;justify-content:space-between;text-align:left;gap:28px}
  .plc-text{align-items:flex-start}
  .plc-meta{justify-content:flex-start}
  .plc-tag{text-wrap:wrap;max-width:60ch}
  .plc-actions{flex:none}
}

.badge{position:absolute;z-index:6;right:max(10px,calc(var(--safe-r) + 10px));bottom:calc(6px + var(--safe-b));
  font:700 8px/1 var(--f-pix);letter-spacing:.14em;color:var(--ink-4);padding:4px 6px;border-radius:4px}
.badge:hover{color:var(--ink-2)}
.err{position:fixed;z-index:60;left:max(8px,var(--safe-l));right:max(8px,var(--safe-r));bottom:calc(26px + var(--safe-b));
  font:700 10px/1.4 var(--f-pix);letter-spacing:.06em;color:#ffd7da;background:#3a0710;border:1px solid #ff4d5e;
  border-radius:6px;padding:7px 10px;white-space:pre-wrap}

/* mascot (v1.12: in the rig, on the carpet; units are cabinet px) */
.snail{position:absolute;left:0;top:0;width:45px;height:30px;cursor:pointer;pointer-events:auto}
.snail canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
/* the shadow and the slime lie IN the carpet (children of .floor3d), so no 3D depth sort can put them under it; floor units: x from the floor's left edge, y is depth from z -88 */
.snail-shadow{position:absolute;left:0;top:0;width:54px;height:16px;z-index:1;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.62) 0,rgba(0,0,0,.3) 45%,rgba(0,0,0,0) 72%)}
.slime{position:absolute;z-index:1;pointer-events:none}
.slime canvas{display:block;width:100%;height:100%}

/* ---------- coin token ------------------------------------------------------- */
.coinfly{position:fixed;z-index:40;width:34px;height:34px;left:0;top:0;pointer-events:none;will-change:transform}
.coinfly svg{width:100%;height:100%}

/* ---------- game session ------------------------------------------------------- */
.session{position:fixed;inset:0;z-index:30;background:#000;overflow:hidden}
.sess-bg{position:absolute;inset:0}
.sess-bg.diner{background:
  radial-gradient(60% 70% at 50% 50%,rgba(0,0,0,0) 40%,rgba(0,0,0,.75) 100%),
  conic-gradient(#2a0c10 25%,#170709 0 50%,#2a0c10 0 75%,#170709 0) 0 0/44px 44px}
.sess-bg.neon{background:
  radial-gradient(60% 70% at 50% 50%,rgba(0,0,0,0) 30%,rgba(0,0,0,.8) 100%),
  repeating-linear-gradient(90deg,rgba(255,61,240,.12) 0 1px,rgba(0,0,0,0) 1px 40px),
  repeating-linear-gradient(0deg,rgba(70,243,255,.10) 0 1px,rgba(0,0,0,0) 1px 40px),#04030a}
.sess-bg.grid{background:
  radial-gradient(60% 70% at 50% 50%,rgba(0,0,0,0) 30%,rgba(0,0,0,.82) 100%),
  repeating-linear-gradient(90deg,rgba(96,150,220,.10) 0 1px,rgba(0,0,0,0) 1px 36px),
  repeating-linear-gradient(0deg,rgba(96,150,220,.10) 0 1px,rgba(0,0,0,0) 1px 36px),
  linear-gradient(90deg,rgba(255,90,60,.10),rgba(0,0,0,0) 40%,rgba(0,0,0,0) 60%,rgba(55,205,250,.10)),#0b0e14}
.sess-side{position:absolute;background-size:100% 100%;filter:brightness(.62) saturate(.95);pointer-events:none}
.sess-side.l{clip-path:polygon(86% 0,0 0,0 100%,79.4% 100%,79.4% 73.2%,97.2% 70.7%,100% 66.8%,84.1% 58.9%,81.3% 19.3%,86% 17.1%)}
.sess-side.r{clip-path:polygon(14% 0,100% 0,100% 100%,20.6% 100%,20.6% 73.2%,2.8% 70.7%,0 66.8%,15.9% 58.9%,18.7% 19.3%,14% 17.1%)}
.sess-screen{position:absolute;overflow:hidden;background:#000}
.sess-screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:block}
.sess-boot{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;pointer-events:none}
.sess-boot pre{margin:0;padding:24px;font:700 13px/1.6 var(--f-pix);letter-spacing:.06em;color:#9dffc0;
  text-shadow:0 0 6px rgba(81,255,126,.6);white-space:pre-wrap;max-width:560px}
.sess-boot.err pre{color:#ffb3b9;text-shadow:0 0 6px rgba(255,77,94,.6)}
.sess-boot .retry{pointer-events:auto;margin-top:14px}
.sess-scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 1px,rgba(0,0,0,0) 1px 3px);opacity:.6}
.sess-fx{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
.sess-ctrl{position:absolute;z-index:3;top:calc(10px + var(--safe-t));left:max(10px,calc(var(--safe-l) + 10px));
  display:flex;align-items:center;gap:8px;transition:opacity .35s}
.sess-ctrl.idle{opacity:.28}
.eject{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:rgba(10,8,18,.72);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.eject svg{width:20px;height:20px}
.confirm{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 12px;border-radius:24px;
  background:rgba(10,8,18,.88);border:1px solid rgba(255,255,255,.2);font:700 10px/1 var(--f-pix);letter-spacing:.12em;color:#fff}
.confirm button{height:34px;padding:0 12px;border-radius:17px;font:700 10px/1 var(--f-pix);letter-spacing:.1em}
.confirm .yes{background:var(--red);color:#1a0206}
.confirm .no{background:rgba(255,255,255,.1)}
.holdesc{position:absolute;z-index:4;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);
  font:700 10px/1 var(--f-pix);letter-spacing:.14em;color:#fff;background:rgba(10,8,18,.85);border:1px solid rgba(255,255,255,.2);
  border-radius:16px;padding:9px 14px;overflow:hidden}
.holdesc i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--red)}

/* ---------- sheets (dialogs) ----------------------------------------------------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,2,8,.74);
  display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.scrim{align-items:center}}
.sheet{position:relative;width:min(560px,100%);max-height:min(86vh,760px);overflow:auto;overscroll-behavior:contain;
  border-radius:18px 18px 0 0;padding:0 0 calc(18px + var(--safe-b))}
@media (min-width:760px){.sheet{border-radius:14px;max-height:84vh}}
.sheet-x{position:sticky;top:10px;float:right;margin:10px 10px -50px 0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;z-index:3}
.sheet-x svg{width:16px;height:16px}

/* the instruction card */
.card{background:var(--card);color:var(--card-ink)}
.card .sheet-x{background:rgba(0,0,0,.28);color:#fff}
.card-head{padding:22px 64px 18px 22px;background:var(--band,#b61f2a);color:#fff;position:relative}
.card-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--band-2,#ffc23a)}
.card-kick{font:700 10px/1 var(--f-pix);letter-spacing:.18em;opacity:.85}
.card-title{margin:8px 0 4px;font:400 34px/1 var(--f-mq);letter-spacing:.02em}
.card .card-tag{margin:0;font:600 italic 18px/1.25 var(--f-card);color:#fff;opacity:.92;max-width:40ch}
.card-body{padding:6px 22px 4px}
.card h3{margin:18px 0 6px;font:800 italic 21px/1 var(--f-card);text-transform:uppercase;letter-spacing:.02em;color:var(--band,#b61f2a)}
.card p,.card li{font:500 18px/1.35 var(--f-card);color:var(--card-ink)}
.card p{margin:0 0 8px;max-width:62ch}
.card ol,.card ul{margin:0;padding-left:22px}
.card li{margin:0 0 6px}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font:500 17px/1.3 var(--f-card)}
.card .kv dt{font:700 10px/1.9 var(--f-pix);letter-spacing:.12em;color:var(--card-3);text-transform:uppercase}
.card .kv dd{margin:0}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.card .tag{font:700 9px/1 var(--f-pix);letter-spacing:.1em;padding:6px 8px;border-radius:4px;background:rgba(0,0,0,.07);color:var(--card-ink)}
.card .note-line{font:600 italic 16px/1.3 var(--f-card);color:var(--card-3)}
.card .card-cta{display:flex;gap:10px;flex-wrap:wrap;padding:16px 22px 4px}
.card .coinbtn{--accent:var(--band,#b61f2a)}

/* the operator panel (settings) */
.op{background:#0d0b16;color:var(--ink);border:1px solid rgba(255,255,255,.08)}
.op .sheet-x{background:rgba(255,255,255,.07)}
.op-head{padding:22px 64px 6px 22px}   /* the right side stays clear for the close button, as on the instruction card */
.op-kick{font:700 10px/1 var(--f-pix);letter-spacing:.2em;color:var(--green)}
.op-title{margin:8px 0 6px;font:400 26px/1 var(--f-mq);color:#fff}
.op-sub{margin:0;font:500 17px/1.3 var(--f-card);color:var(--ink-3);max-width:44ch}
.op-body{padding:4px 22px}
.dip{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.dip-l b{display:block;font:700 12px/1.2 var(--f-pix);letter-spacing:.1em;color:#fff}
.dip-l span{display:block;margin-top:4px;font:500 16px/1.25 var(--f-card);color:var(--ink-3)}
.sw{position:relative;width:64px;height:32px;border-radius:5px;background:#1e1b2c;border:1px solid rgba(255,255,255,.14);flex:none}
.sw::before{content:"OFF";position:absolute;right:7px;top:11px;font:700 8px/1 var(--f-pix);letter-spacing:.08em;color:var(--ink-4)}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:22px;border-radius:3px;
  background:linear-gradient(180deg,#e8ebf4,#a7acbb);box-shadow:0 2px 0 #6a6f7d;transition:left .15s,background .15s}
.sw[aria-checked="true"]{background:#0f2a18;border-color:rgba(81,255,126,.5)}
.sw[aria-checked="true"]::before{content:"ON";right:auto;left:9px;color:var(--green)}
.sw[aria-checked="true"]::after{left:34px;background:linear-gradient(180deg,#eafff0,#8fd6a3)}
.vol{width:150px;accent-color:var(--green)}
.dip-wide{grid-template-columns:1fr}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 11px;border-radius:6px;font:700 9px/1 var(--f-pix);letter-spacing:.1em;color:var(--ink-3);
  background:#1e1b2c;border:1px solid rgba(255,255,255,.14)}
.seg button[aria-checked="true"]{color:var(--green);background:#0f2a18;border-color:rgba(81,255,126,.5)}
.op-foot{padding:14px 22px 0;display:flex;gap:10px;flex-wrap:wrap}
.btn-s{height:40px;padding:0 14px;border-radius:8px;font:700 10px/1 var(--f-pix);letter-spacing:.12em;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:var(--ink-2)}
.btn-s:hover{background:rgba(255,255,255,.1);color:#fff}
.btn-s.warn{border-color:rgba(255,77,94,.5);color:#ffb7bd}
.op .kbd{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:6px 0 4px}
.op .kbd kbd{font:700 10px/1 var(--f-pix);letter-spacing:.06em;color:#fff;background:#1d1a2b;border:1px solid rgba(255,255,255,.2);
  border-bottom-width:3px;border-radius:5px;padding:6px 7px;white-space:nowrap;justify-self:start}
.op .kbd span{font:500 17px/1.3 var(--f-card);color:var(--ink-2);align-self:center}
.op h3{margin:18px 0 8px;font:700 11px/1 var(--f-pix);letter-spacing:.16em;color:var(--yellow)}

.op .log b{font:700 11px/1 var(--f-pix);letter-spacing:.1em;color:#fff}
.op .log p{margin-top:6px}

/* the game list: cabinets walk the floor, game pages open the site's title folders */
.gl{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:8px}
.gl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:5px 14px;width:100%;box-sizing:border-box;text-align:left;
  padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);border-left:4px solid var(--gl,var(--cyan));background:rgba(255,255,255,.04);color:var(--ink)}
button.gl-row:hover{background:rgba(255,255,255,.08)}
.gl-t{grid-column:1;font:400 19px/1.1 var(--f-mq);color:#fff;overflow-wrap:anywhere}
.gl-s{grid-column:1;font:600 italic 16px/1.25 var(--f-card);color:var(--ink-2)}
.gl-c{grid-column:1;font:700 9px/1 var(--f-pix);letter-spacing:.12em;color:var(--ink-3)}
.gl-go{grid-column:2;grid-row:1 / span 3;font:700 10px/1 var(--f-pix);letter-spacing:.12em;color:var(--gl,var(--cyan));white-space:nowrap}
.gl-acts{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.gl-acts:empty{display:none}
.op a.btn-s{display:inline-flex;align-items:center;text-decoration:none}
.op .gl-none{color:var(--ink-3)}
@media (max-width:440px){
  .gl-row{grid-template-columns:minmax(0,1fr)}
  .gl-go{grid-column:1;grid-row:auto;margin-top:3px}
}

/* ---------- toast -------------------------------------------------------------- */
.toast{position:fixed;z-index:70;left:50%;bottom:calc(150px + var(--safe-b));transform:translate(-50%,20px);opacity:0;
  font:700 11px/1.3 var(--f-pix);letter-spacing:.1em;color:#fff;background:rgba(14,11,24,.94);border:1px solid rgba(255,255,255,.16);
  padding:10px 14px;border-radius:10px;transition:opacity .25s,transform .25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------------------------------------------------------- */
@media (max-width:620px){
  .brand span{display:none}
  .plc{gap:10px}
  .plc-title{font-size:24px}
  .plc-tag{font-size:16px}
  .plc-meta .facts{display:none}
  .plc-actions{width:100%}

  .housesign{display:none}
  .freeplay{font-size:13px;padding:4px 7px}
  /* the badge keeps its corner: the dots ride one row above it, so the two never meet on a narrow screen */
  .placard{padding-bottom:calc(40px + var(--safe-b))}
  .dots{bottom:calc(25px + var(--safe-b))}
}
@media (max-width:340px){
  .tools{gap:0}

}
@media (max-height:640px){
  .plc-tag{display:none}
}
@media (max-height:480px){

  .plc{flex-direction:row;justify-content:space-between;text-align:left;gap:16px}
  .plc-text{align-items:flex-start}
  .plc-actions{width:auto;flex:none}
  .coinbtn{height:46px;flex:none}

  .dots{display:none}

@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
}

/* ---- defensive runtime: named failures on screen (08 section 9b) ---- */

/* ---- FEEL core burst and pops (v1.00 constants verbatim), one pool per cabinet ---- */
function makeFeel(){                                   /* binding adaptation: factory, not the page singleton */
  var S = { parts: [], pops: [], MAX_PARTS: 160, _rnd: Math.random };
  function burst(x, y, col, n, spd){
    n = n||14; spd = spd||120;
    for(var i=0;i<n;i++){
      if(S.parts.length >= S.MAX_PARTS) S.parts.shift();
      var a = S._rnd()*6.28318, v = spd*(0.35+S._rnd()*0.65);
      S.parts.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:0.35+S._rnd()*0.3, max:0.65, col:col||'#eaffff', sz:(S._rnd()<0.3)?3:2});
    }
  }
  function pop(x, y, text, col){ S.pops.push({x:x, y:y, t:0.8, text:String(text), col:col||'#ffe34d'}); }
  function tick(dt){
    var i, p, w = 0;
    for(i=0;i<S.parts.length;i++){ p=S.parts[i]; p.life -= dt; if(p.life <= 0) continue;
      p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= (1 - 2.2*dt); p.vy *= (1 - 2.2*dt); S.parts[w++] = p; }
    S.parts.length = w;                                /* in place compaction (08 section 5) */
    w = 0;
    for(i=0;i<S.pops.length;i++){ p=S.pops[i]; p.t -= dt; if(p.t <= 0) continue; p.y -= 30*dt; S.pops[w++] = p; }
    S.pops.length = w;
  }
  function draw(ctx){
    var i, p;
    for(i=0;i<S.parts.length;i++){ p=S.parts[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life/p.max));
      ctx.fillStyle = (p.life < 0.12) ? '#eaffff' : p.col;   // die toward white, never brighter
      ctx.fillRect((p.x|0), (p.y|0), p.sz, p.sz); }
    ctx.globalAlpha = 1;
    for(i=0;i<S.pops.length;i++){ p=S.pops[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, p.t/0.8));
      ctx.font = '700 7px ' + PIXFONT; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#000'; ctx.fillText(p.text, p.x+1, p.y+1); ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y); }
    ctx.globalAlpha = 1;
  }

/* ---- NEON SWARM shockwave (v78 nova release, verbatim factory) ---- */
function makeShockwave(x, y, opts){
  opts = opts || {};
  var max  = opts.max != null ? opts.max : 168;
  var grow = max / (opts.growDur || 0.55);
  var vig  = opts.vignette !== false;
  var vigCol = opts.vigColor || '140,250,255';
  var r = 4;
  return {
    x: x, y: y, done: false,
    update: function (dt) { if (this.done) return; r += grow * dt; if (r >= max) { r = max; this.done = true; } },
    radius: function () { return r; },
    draw: function (ctx, W, H) {
      var a = 1 - (r / max);
      ctx.globalAlpha = 0.25 + Math.max(0, a) * 0.4;
      ctx.fillStyle = '#ffe14a';
      ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 1;
      if (vig) {
        var va = 0.28 * Math.max(0, 1 - r / max);       // cooling vignette recedes
        ctx.fillStyle = 'rgba(' + vigCol + ',' + va.toFixed(3) + ')';
        ctx.fillRect(0,0,W,5); ctx.fillRect(0,H-5,W,5); ctx.fillRect(0,0,5,H); ctx.fillRect(W-5,0,5,H);   /* W,H passed in: logical size */
      }
    }
  };
}
/* ---- NEON SWARM boss arrival timing (v51 elegant form, verbatim state curve) ---- */
function makeArrive(opts){
  opts = opts || {};
  var loomDur = 2.0, loomFrom = 2.8, popTo = 1.35, popDur = 0.22, blinkDur = 0.5, holdDur = opts.hold != null ? opts.hold : 1.0, fadeDur = 0.35;
  var total = loomDur + popDur + blinkDur + holdDur + fadeDur, t = 0;
  return {
    done: false, t: function(){ return t; },
    update: function (dt) { if (this.done) return; t += dt; if (t >= total) { t = total; this.done = true; } },
    state: function () {
      var scale = 1, alpha = 1, a = loomDur, b = a + popDur, c = b + blinkDur, d = c + holdDur;
      if (t < a) { var e = t / loomDur; e = 1 - (1 - e) * (1 - e) * (1 - e); scale = loomFrom - (loomFrom - 1) * e; alpha = 0.35 + 0.65 * e; }
      else if (t < b) { scale = 1 + (popTo - 1) * Math.sin(((t - a) / popDur) * Math.PI); }
      else if (t < c) { alpha = 0.5 + 0.5 * Math.abs(Math.cos(((t - b) / blinkDur) * Math.PI * 3)); }
      else if (t < d) { scale = 1; alpha = 1; }
      else { alpha = Math.max(0, 1 - (t - d) / fadeDur); }
      return { scale: scale, alpha: alpha };
    }
  };
}

/* ---- PATTY PANIC fire (SALAMANDER contribution, verbatim), one pool per cabinet ---- */
function makeFire(){                                   /* binding adaptation: own pool per cabinet */
  var FEEL = { parts: [], MAX_PARTS: 90, _emitters: [] };
  FEEL.embers = function(x, y, w, rate, col){
    var em = { x:x, y:y, w:(w||8), rate:(rate||16), col:(col||'#ff7a2a'), acc:0, live:true };
    FEEL._emitters.push(em);
    return { move: function(nx, ny){ em.x = nx; if(ny != null) em.y = ny; }, stop: function(){ em.live = false; } };
  };
  FEEL.tickEmbers = function(dt){
    var E = FEEL._emitters;
    for(var i = E.length - 1; i >= 0; i--){
      var em = E[i];
      if(em.live){
        em.acc += em.rate * dt;
        while(em.acc >= 1){
          em.acc -= 1;
          if(FEEL.parts.length < FEEL.MAX_PARTS){
            FEEL.parts.push({ x: em.x + (Math.random() - 0.5) * em.w, y: em.y, vx: (Math.random() - 0.5) * 0.5,
              vy: -0.55 - Math.random() * 0.7, g: -0.004, t: 0.7 + Math.random() * 0.6, t0: 1.3, col: em.col, kind: 'ember' });
          }
        }
      }
      if(!em.live) E.splice(i, 1);
    }
    /* ember aging, the shipped per-frame advance (pr.t-=DT; pr.x+=pr.vx; pr.y+=pr.vy; pr.vy+=g), frame scaled */
    var k = dt * 60, w = 0;
    for(var j = 0; j < FEEL.parts.length; j++){ var p = FEEL.parts[j]; p.t -= dt; if(p.t <= 0) continue;
      p.x += p.vx * k; p.y += p.vy * k; p.vy += p.g * k; FEEL.parts[w++] = p; }
    FEEL.parts.length = w;
  };
  FEEL.drawEmbers = function(ctx){
    var P = FEEL.parts;
    for(var i = 0; i < P.length; i++){
      var p = P[i]; if(p.kind !== 'ember') continue;
      var life = Math.max(0, Math.min(1, p.t / (p.t0 || 1.3)));
      var col = life > 0.5 ? p.col : (life > 0.2 ? '#ffd23f' : '#fff3e0');
      ctx.fillStyle = col; ctx.fillRect((p.x - 1) | 0, (p.y - 1) | 0, 3, 3);
      if(life > 0.6){ ctx.fillStyle = '#ffd23f'; ctx.fillRect(p.x | 0, p.y | 0, 1, 1); }
    }
  };
  FEEL.flamePillar = function(ctx, x, yTop, yBot, t, now){
    var h = yBot - yTop;
    if(t < 0.5){
      var heat = t / 0.5; var a = 0.12 + 0.30 * heat;
      ctx.globalAlpha = Math.max(0, Math.min(0.55, a));
      ctx.fillStyle = '#ff9a3a'; ctx.fillRect((x - 4) | 0, yTop | 0, 8, h);
      ctx.fillStyle = '#ffd8a0'; ctx.fillRect((x - 1) | 0, yTop | 0, 2, h);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = '#ff5a1e'; ctx.fillRect((x - 5) | 0, yTop | 0, 10, h);
      ctx.fillStyle = '#ff9a3a'; ctx.fillRect((x - 3) | 0, yTop | 0, 6, h);
      ctx.fillStyle = '#fff3b0'; ctx.fillRect((x - 1) | 0, yTop | 0, 2, h);
      var f = ((now || Date.now()) * 0.02) % Math.max(20, h - 8);   /* the pack may pass its own frame clock */
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect((x - 6) | 0, (yTop + f) | 0, 2, 7);
      ctx.fillRect((x + 4) | 0, (yTop + ((f + h * 0.5) % Math.max(20, h - 8))) | 0, 2, 7);
      ctx.globalAlpha = 1;
    }
  };

    n = n || 3; t = t || 0;
    for(var s = 0; s < n; s++){
      var ry = y - 10 - s * 10 - t * 14;
      if(ry <= 0) continue;
      ctx.globalAlpha = Math.max(0, 0.5 - t * 0.2);
      ctx.fillStyle = t < 1.2 ? '#b9c0d4' : '#e8ecf6';
      ctx.fillRect((x - 6 - s * 2) | 0, ry | 0, 12 + s * 4, 3);

/* ==== 06-attract.js ==== */
/* =====================================================================
   ATTRACT MODE. Every lit cabinet runs its own loop on its own CRT:
   TITLE, DEMO, HIGH SCORES, HOW TO PLAY, the way real cabinets begged
   for quarters. Logical screen 160 x 218, drawn crisp at an integer
   backing scale. The sims step at a fixed 1/60 (clock law: the lobby
   loop drops any backlog over 250 ms and never sprints).
   ===================================================================== */
var AW = 160, AH = 218;

function txt(c, s, x, y, size, col, align, glow, font){
  c.font = (font || ('700 ' + size + 'px ' + PIXFONT)); c.textAlign = align || 'center'; c.textBaseline = 'middle';
  if(glow){ c.save(); c.shadowColor = glow; c.shadowBlur = 8; c.fillStyle = col; c.fillText(s, x, y); c.restore(); }
  else { c.fillStyle = '#000'; c.fillText(s, x + 1, y + 1); c.fillStyle = col; c.fillText(s, x, y); }
}
function makeStars(n, seed){ var R = mulberry32(seed), a = []; for(var i = 0; i < n; i++) a.push({ x: R() * AW, y: R() * AH, s: R() < .25 ? 2 : 1, v: 6 + R() * 26, c: R() < .3 ? '#46f3ff' : (R() < .5 ? '#8fb8ff' : '#eaffff') }); return a; }
function stepStars(st, dt, mul){ for(var i = 0; i < st.length; i++){ var s = st[i]; s.y += s.v * dt * (mul || 1); if(s.y > AH){ s.y = -2; s.x = Math.random() * AW; } } }
function drawStars(c, st, stretch){ for(var i = 0; i < st.length; i++){ var s = st[i]; c.fillStyle = s.c; c.globalAlpha = .75; c.fillRect(s.x | 0, s.y | 0, s.s, s.s * (stretch || 1)); } c.globalAlpha = 1; }

function Attract(cab){
  this.cab = cab; this.g = cab.game; this.cv = cab.canvas; this.ctx = this.cv.getContext('2d');
  this.k = 0; this.frame = 0; this.t = 0; this.acc = 0;
  this.feel = makeFeel(); this.fire = makeFire();
  this.power = 0; this.powerT = -99; this.credit = 0; this.creditT = 0;
  this.stars = makeStars(46, 7 + cab.index * 13);
  this.scenes = SCENES[this.g.theme] || SCENES.soon;
  this.si = 0; this.st = 0; this.S = {};
  this.hi = this.g.house && this.g.house[0] ? this.g.house[0][1] : 0;
  this.enter(0);
}
Attract.prototype.resize = function(k){ if(k === this.k) return; this.k = k; this.cv.width = AW * k; this.cv.height = AH * k; };
Attract.prototype.powerOn = function(delay){ this.powerT = -(delay || 0); };
Attract.prototype.enter = function(i){ this.si = i; this.st = 0; this.S = {}; var sc = this.scenes[i]; if(sc.init) sc.init.call(this); };
Attract.prototype.sfx = function(name){ SND.attract(this.g.id, name, this.cab.pan, this.cab.weight); };
Attract.prototype.sfxNode = function(){ return SND.node(this.g.id, this.cab.pan, this.cab.weight); };   /* v1.11: for a game that plays its own sounds */
Attract.prototype.step = function(dt){
  this.t += dt; this.frame++;
  this.powerT += dt; this.power = this.powerT <= 0 ? 0 : clamp(this.powerT / .55, 0, 1);
  if(this.credit) this.creditT += dt;
  var sc = this.scenes[this.si];
  this.st += dt;
  if(sc.update) sc.update.call(this, dt);
  var dur = this.S.dur || sc.dur;
  if(dur && this.st >= dur) this.enter((this.si + 1) % this.scenes.length);
  this.feel.tick(dt); this.fire.tickEmbers(dt);
};
Attract.prototype.render = function(){
  var c = this.ctx, k = this.k || 1;
  c.setTransform(k, 0, 0, k, 0, 0); c.imageSmoothingEnabled = false;
  var sc = this.scenes[this.si];
  if(this.powerT < 0){ c.fillStyle = '#010103'; c.fillRect(0, 0, AW, AH); return; }
  sc.draw.call(this, c);
  this.feel.draw(c);
  this.overlay(c);
  if(this.power < 1){                                       /* CRT warm up: a line, then the picture */
    var p = this.power;
    c.fillStyle = '#000'; c.globalAlpha = 1 - clamp((p - .45) / .55, 0, 1); c.fillRect(0, 0, AW, AH); c.globalAlpha = 1;
    if(p < .6){ var w = AW * clamp(p / .3, 0, 1), h = p < .3 ? 1 : 1 + (AH - 1) * clamp((p - .3) / .3, 0, 1) * .9;
      c.fillStyle = '#eaffff'; c.globalAlpha = .9; c.fillRect((AW - w) / 2, (AH - h) / 2, w, h); c.globalAlpha = 1; }
  }
};
Attract.prototype.overlay = function(c){
  if(this.g.soon) return;
  if(this.credit){
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(0, AH / 2 - 10, AW, 28);
    if(((this.creditT * 3) | 0) % 2 === 0) txt(c, 'PUSH START', AW / 2, AH / 2 + 4, 11, '#ffe34d', 'center', '#ffb13d');
    txt(c, 'CREDIT ' + this.credit, AW / 2, AH - 12, 8, '#ffffff');

  }

};
Attract.prototype.sample = function(){
  /* the screen's average color drives the glow it throws on the cabinet and the floor */
  try {
    var s = SAMPLER.getContext('2d'); s.drawImage(this.cv, 0, 0, 4, 4);
    var d = s.getImageData(0, 0, 4, 4).data, r = 0, gg = 0, b = 0;
    for(var i = 0; i < d.length; i += 4){ r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
    var n = d.length / 4, m = Math.max(r, gg, b) / n, boost = m > 1 ? clamp(200 / m, 1, 3.2) : 1;
    return [clamp((r / n) * boost, 0, 255) | 0, clamp((gg / n) * boost, 0, 255) | 0, clamp((b / n) * boost, 0, 255) | 0];
  } catch(e){ return null; }
};
var SAMPLER = document.createElement('canvas'); SAMPLER.width = 4; SAMPLER.height = 4;

      var rows = recordsFor(this.g), ranks = ['1ST', '2ND', '3RD', '4TH', '5TH'];
      for(var i = 0; i < 5; i++){

/* v1.15: the three soft glows each cabinet throws are tiny canvases the compositor stretches (the wall glow behind it, the
   pool of screen light on the floor, its shadow), not 640 x 560 CSS gradients: a phone painted those at full resolution and
   again at every colour change. Drawn as the gradients were; the marquee power comes in as the element's opacity. */
function glowOn(c, rgb, cxf, cyf, rxf, ryf, stops){
  var g = c.getContext('2d'), W = c.width, H = c.height, rx = rxf * W, ry = ryf * H;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.setTransform(1, 0, 0, ry / rx, 0, 0);
  var gr = g.createRadialGradient(cxf * W, cyf * H * rx / ry, 0, cxf * W, cyf * H * rx / ry, rx);
  stops.forEach(function(s){ gr.addColorStop(s[0], 'rgba(' + rgb + ',' + s[1] + ')'); });
  g.fillStyle = gr; g.fillRect(0, 0, W, H * rx / ry);

    glowOn(cab.el.querySelector('canvas.fshadow'), '0,0,0', .5, .44, .5, .44, [[0, .7], [.72, 0]]); }
  glowOn(cab.fg, cab.glow.map(function(v){ return v | 0; }).join(','), .5, .3, .46, .42, [[0, .40], [.5, .12], [.76, 0]]);
}
/* v1.16: each side is three small canvases, the art with its standing shade, the shade the row's angle adds (its opacity,
   which the compositor changes without painting), and the trim. As painted CSS (a clipped image, a clipped shade whose
   colour followed the angle, an SVG outline) a side was painted again at every step of a swipe: 72 raster tasks a side in
   four swipes at the Director's 2.75x, each asking for fresh tiles while the old ones were still shown. */
var SIDE_K = 2, SIDE_SK = .5, SIDE_M = 4;                /* art pixels a unit, the angle shade's, and the margin the trim's stroke reaches past the panel */
function sidePath(g, pts){ g.beginPath(); pts.forEach(function(p, i){ if(i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); }); g.closePath(); }

  CABS.forEach(function(cab){
    var tm = getComputedStyle(cab.el).getPropertyValue('--tm').trim() || '#888';
    [['r', PROFILE_R, false], ['l', PROFILE_L, true]].forEach(function(sd){

      if(sd[0] === 'r') cab.sideR = url; else cab.sideL = url;

        var c = side.querySelector('.' + layer[0]), K = layer[1], g = c.getContext('2d');
        c.width = Math.round((214 + 2 * SIDE_M) * K); c.height = Math.round((560 + 2 * SIDE_M) * K);
        g.setTransform(K, 0, 0, K, SIDE_M * K, SIDE_M * K); g.clearRect(-SIDE_M, -SIDE_M, 214 + 2 * SIDE_M, 560 + 2 * SIDE_M);
        if(layer[0] === 'strim'){ sidePath(g, sd[1]); g.strokeStyle = tm; g.lineWidth = 6; g.lineJoin = 'round'; g.stroke(); return; }
        g.save(); sidePath(g, sd[1]); g.clip();
        if(layer[0] === 'sart'){ g.drawImage(art, 0, 0, 214, 560); g.fillStyle = 'rgba(3,2,8,.32)'; }   /* the standing shade (the old calc: .32 + the angle's) */
        else g.fillStyle = 'rgb(3,2,8)';
        g.fillRect(0, 0, 214, 560); g.restore(); });

function layout(){
  var app = $('app'), vw = app.clientWidth, vh = app.clientHeight;

  var topH = document.querySelector('.topbar').offsetHeight;
  var plc = $('placard'), plH = plc.offsetHeight, plPad = parseFloat(getComputedStyle(plc).paddingTop) || 30;
  var fs = Math.min(vw * 0.125, vh * 0.075, 88);
  var signH = vh <= 480 ? 0 : fs * 1.42;                  /* short landscape screens drop the wall sign; the top bar carries the name */
  var sw = $('signwrap'); sw.style.top = (topH - 8) + 'px'; sw.style.height = signH + 'px';
  document.documentElement.style.setProperty('--sign-fs', fs.toFixed(1) + 'px');
  /* the focused face sits 85 (half depth) + 42 (the pull) units in front of the rig plane,
     so it projects larger than 560: m = 1150/(1150-127); the top rises EYE_Y*(m-1) */
  var m = 1150 / (1150 - 127), overTop = EYE_Y * (m - 1), projH = CAB_H * m;
  var areaTop = signH ? topH - 8 + signH + 8 : topH + 4, areaBot = vh - plH + plPad - 6;
  var areaH = Math.max(100, areaBot - areaTop);

  fit = Math.max(fit, .25);

  LOBBY.pitch = CAB_W + gap;
  var top = areaTop + Math.max(0, (areaH - projH * fit) / 2) + overTop * fit;

/* ---- the snail (v1.12: on the carpet, not on the glass) ----

   floor and crawling around as it crosses the arcade systems." It now lives in the 3D rig, on the carpet just in front
   of the cabinets, so it moves with the room when you browse and passes in front of the machines. It crawls the way a
   snail does: the foot stretches forward, then the shell follows, and a ripple of light runs down the foot; it casts a
   shadow, wanders a little, turns around now and then, and leaves a slime trail that glistens and slowly dries. Long

/* the snail in pixels, facing right: a foot that stretches, a head with two stalks, the brand's shell (SNAIL_PX) at 2x */
function drawSnail(){
  var S = SNAIL, g = S.g, hid = S.hide > 0, ph = S.phase, push = Math.max(0, Math.sin(ph));

    g.fillStyle = 'rgba(230,255,240,.9)'; g.fillRect(wave, 20, 2, 2);
    var hx = head - 6;                                                                   /* the head, rounded at the front */
    g.fillStyle = '#51ff7e'; g.fillRect(hx, 14, 6, 6); g.fillStyle = '#9dffc0'; g.fillRect(hx + 1, 14, 4, 1); g.fillRect(hx, 15, 1, 4);
    g.clearRect(hx + 5, 14, 1, 1);

/* a dab of slime under the tail, as wide as the foot (10 floor units), wet in the middle, glinting now and then; one

function stepSnail(dt){
  var S = SNAIL; if(!S.el) return;

  else {

    var push = Math.max(0, Math.sin(S.phase));                                       /* the foot pushes on half the stride */
    S.x += S.dir * S.v * (.2 + push * 1.6) * dt;
    S.z = 138 + Math.sin(S.phase * .06 + 1.3) * 6;                                   /* a slow wander across the carpet */
    S.nextTurn -= dt;
    if((S.dir < 0 && S.x < S.lo + 150) || (S.dir > 0 && S.x > S.hi - 150) || S.nextTurn <= 0){ S.turn = .7; S.flipped = false; S.nextTurn = 25 + Math.random() * 40; }
    if(Math.abs(S.x - S.lastX) >= 2){ slimeDab(S.x - S.dir * 16, S.z + 1); S.lastX = S.x; }

/* ---- the loop (clock law: gaps over 250 ms are dropped, never replayed) ---- */
var LOOP = { last: 0, acc: 0, STEP: 1 / 60, raf: 0, idleT: 0 };
function wake(){ LOOP.idleT = 0; AKIT.boot(); }
function frame(now){
  LOOP.raf = requestAnimationFrame(frame);
  if(SESSION.active){ LOOP.last = now; return; }
  var ms = now - (LOOP.last || now); LOOP.last = now;
  if(ms > 250){ LOOP.acc = 0; ms = LOOP.STEP * 1000; }                      /* drop the lost time, never sprint */
  var dt = ms / 1000;
  /* the row eases to focus; drag owns it while a finger is down */
  if(!LOBBY.drag){
    var target = focusPos(LOBBY.focus), rm = motionReduced();   /* v1.20: VALLEY's stop in HAPPY VALLEY sits left of the first game */
    if(rm){ LOBBY.pos = target; LOBBY.vel = 0; }
    else { var dx = target - LOBBY.pos; LOBBY.vel += dx * 60 * dt; LOBBY.vel *= Math.exp(-11 * dt); LOBBY.pos += LOBBY.vel * dt;
      if(Math.abs(dx) < .0005 && Math.abs(LOBBY.vel) < .0005){ LOBBY.pos = target; LOBBY.vel = 0; } }
  }
  placeRow();
  stepBackroom(dt);                                        /* v1.12: the arcade floor behind the row, when the BACKDROP switch asks for it */
  /* fixed step sims, at most 5 per frame */
  LOOP.acc += ms; var steps = 0;
  while(LOOP.acc >= LOOP.STEP * 1000 && steps < 5){
    for(var i = 0; i < CABS.length; i++){ var c = CABS[i]; if(c.visible || c.attract.powerT < 1) c.attract.step(LOOP.STEP); }
    LOOP.acc -= LOOP.STEP * 1000; steps++;
  }
  if(steps === 5) LOOP.acc = 0;
  LOBBY.sampleI++;
  var moving = !!LOBBY.drag || LOBBY.vel !== 0 || LOBBY.pos !== focusPos(LOBBY.focus);   /* v1.15: the row is sliding */
  for(var j = 0; j < CABS.length; j++){
    var cb = CABS[j];
    /* marquee power and light */
    if(!cb.game.soon && cb.powerAt && now >= cb.powerAt && cb.power < 1){
      var e = (now - cb.powerAt) / 700; cb.power = e >= 1 ? 1 : ((e * 7 | 0) % 2 ? .25 : e);
      cb.el.style.setProperty('--power', cb.power.toFixed(3));
    } else if(cb.game.soon){
      cb.flickT = (cb.flickT || 0) - dt;
      if(cb.flickT <= 0){ cb.flickT = 3 + Math.random() * 6; cb.flickOn = .18 + Math.random() * .25; }
      var fl = cb.flickOn > 0; if(fl) cb.flickOn -= dt;
      var pw = fl ? .7 : cb.powerTarget;
      if(pw !== cb._pw){ cb.el.style.setProperty('--power', pw); cb.mq.classList.toggle('flick', fl); cb._pw = pw; }
    }
    if(!cb.visible) continue;
    if(SHEET.scrim && (LOBBY.sampleI + j) % 4) continue;       /* paperwork open: the floor idles at quarter rate */
    cb.attract.render();
    /* the cabinet's glow follows its screen's colour. v1.15: every glow that reads --glow is repainted when it changes, so it
       changes only at rest (never mid browse), at most twice a second, and only when the colour has really moved (v1.14 set
       it seven times a second on every lit cabinet, and a phone repainted the floor glow, the bezel and the shine each time) */
    if(!cb.game.soon && !moving && (LOBBY.sampleI + j * 7) % 30 === 0 && cb.attract.power >= 1){
      var s = cb.attract.sample();
      if(s){ for(var q = 0; q < 3; q++) cb.glow[q] = cb.glow[q] + (s[q] - cb.glow[q]) * .35;
        var gs = (cb.glow[0] | 0) + ',' + (cb.glow[1] | 0) + ',' + (cb.glow[2] | 0), gl = cb._glowSet || [-99, -99, -99];
        if(Math.abs(cb.glow[0] - gl[0]) + Math.abs(cb.glow[1] - gl[1]) + Math.abs(cb.glow[2] - gl[2]) > 24){ cb.el.style.setProperty('--glow', gs); cb._glowSet = cb.glow.slice(); paintGlows(cb); } }
    }
    /* the joystick follows your input */
    if(cb.stickT > 0){ cb.stickT -= dt; var a = cb.stickT > 0 ? cb.stickDir * 16 : 0;
      cb.sticks.forEach(function(st){ st.querySelector('.shaft').style.transform = 'rotate(' + a + 'deg)'; st.querySelector('.ball').style.transform = 'translateX(' + (a * .28) + 'px)'; }); }
    if(cb.btnT > 0){ cb.btnT -= dt; if(cb.btns[0]) cb.btns[0].classList.toggle('on', cb.btnT > 0); }
  }
  pollPads(dt);
  stepSnail(dt);
  LOOP.idleT += dt;
  /* left alone, the floor runs its own attract: every 12 s it walks to the next lit cabinet */
  if(LOOP.idleT > 45 && !anySheetOpen() && !LOBBY.drag && !motionReduced()){
    LOBBY.autoT = (LOBBY.autoT || 0) + dt;
    if(LOBBY.autoT > 12){ LOBBY.autoT = 0; var nx = LOBBY.focus;
      do { nx = (nx + 1) % GAMES.length; } while(GAMES[nx].soon && nx !== LOBBY.focus);
      setFocus(nx, true); }
  } else LOBBY.autoT = 0;
  if(!LOBBY.flakyT || now > LOBBY.flakyT){ LOBBY.flakyT = now + 9000 + Math.random() * 12000; if(LOBBY.booted) flakyNeon(); }
}

   these arcades at the wall but to feel like you're in the middle of an
   old 80's arcade where there are rows of arcades behind these which are
   in attract mode ... create different backdrops with this wall as

/* ---- the deal (v1.18): every slot gets a game no neighbour has. Slots run along each row; a slot's neighbours are the
   last five in its row and the slots within 600 units of it in the rows in front and behind. A form other than the
   upright never stands next to itself, hues next to each other differ by 50 degrees or more, an island holds one claw
   and one pinball at most, and the least used game wins, ties broken by the seeded dice ---- */
function brHueGap(a, b){ var d = Math.abs(a - b) % 360; return Math.min(d, 360 - d); }
function brDeal(slots, R){
  var used = EXTRAS.map(function(){ return 0; });
  slots.forEach(function(sl, i){
    var row = slots.filter(function(o, j){ return j < i && o.row === sl.row; }).slice(-5), left = row[row.length - 1];
    var near = slots.filter(function(o, j){ return j < i && o.row !== sl.row && Math.abs(o.row - sl.row) === 1 && Math.abs(o.x - sl.x) < 600; });
    var isle = slots.filter(function(o, j){ return j < i && o.isle === sl.isle; });
    var best = -1, bestScore = 1e9;
    for(var e = 0; e < EXTRAS.length; e++){
      var ex = EXTRAS[e], bad = 0;
      if(row.some(function(o){ return o.e === e; }) || near.some(function(o){ return o.e === e; })) continue;   /* never a neighbour's game */
      if(left && left.isle === sl.isle){ var lf = EXTRAS[left.e];
        if(lf[3] === ex[3] && ex[3] !== 'upright') continue;
        if(brHueGap(lf[1], ex[1]) < 50) bad += 40;
        if(lf[4] === ex[4]) bad += 10; }
      if((ex[3] === 'claw' || ex[3] === 'pinball') && isle.some(function(o){ return EXTRAS[o.e][3] === ex[3]; })) continue;
      var score = used[e] * 100 + bad + R() * 9;
      if(score < bestScore){ bestScore = score; best = e; }
    }
    if(best < 0) best = (R() * EXTRAS.length) | 0;   /* never reached with 24 games; kept so a shorter list still builds */
    sl.e = best; used[best]++;

    if(strategy !== 'src' && w.__snailProbe === 1) return true;
    if(w.SNAILCART) return true;
    var cs = d.getElementsByTagName('canvas');
    for(var i = 0; i < cs.length; i++){ try { var c = cs[i], g = c.getContext('2d'); if(!g || !c.width) continue;
      var px = g.getImageData(0, 0, Math.min(c.width, 64), Math.min(c.height, 64)).data;
      for(var k = 3; k < px.length; k += 16) if(px[k] > 0) return true; } catch(e){} }
    return strategy === 'src' ? d.scripts.length === 0 && d.body.childElementCount > 0 : false;

function loadInto(host, html, file, done){
  var order = html === DIRECT ? ['direct'] : ['srcdoc', 'src', 'blob'], tried = [], f = null, blobUrl = null;
  function next(){
    if(f){ try { f.remove(); } catch(e){} f = null; }
    if(blobUrl){ try { URL.revokeObjectURL(blobUrl); } catch(e){} blobUrl = null; }
    var st = order.shift();
    if(!st){ done(null, tried); return; }
    f = document.createElement('iframe');
    f.setAttribute('allow', 'fullscreen *; autoplay *; gamepad *'); f.setAttribute('allowfullscreen', '');   /* explicit lists: a page opened from disk has no origin for 'self' to match */
    var settled = false, timer = null, loaded = false, slow = st === 'src' || st === 'direct';
    function judge(){
      if(settled) return;
      var alive = st === 'direct' ? loaded : frameAlive(f, st);
      if(alive){ settled = true; clearTimeout(timer); tried.push(st + ':ok'); done(f, tried, st); return; }
      if(nowMs() - t0 > (slow ? 2600 : 1400)){ settled = true; tried.push(st + ':dead'); next(); return; }
      timer = setTimeout(judge, 150);
    }
    var t0 = nowMs();
    f.addEventListener('load', function(){ loaded = true; if(!settled){ clearTimeout(timer); judge(); } });
    timer = setTimeout(judge, slow ? 2600 : 1600);
    if(st === 'direct') f.src = file;              /* set before insertion: the only load it can fire is the game's own */
    host.appendChild(f);
    try {
      if(st === 'srcdoc') f.srcdoc = withProbe(html);
      else if(st === 'src') f.src = file;
      else if(st === 'direct'){ /* its src went in before insertion */ }
      else { blobUrl = URL.createObjectURL(new Blob([withProbe(html)], { type: 'text/html' })); f.src = blobUrl; }
    } catch(e){ settled = true; clearTimeout(timer); tried.push(st + ':threw'); next(); }
  }
  next();
}

function mountGame(html){

    out.steps.push(html === DIRECT ? 'fetch:direct' : (embeddedCart(g.cart.file) ? 'fetch:embedded:' : 'fetch:ok:') + html.length);
