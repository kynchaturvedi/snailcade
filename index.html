/* ---- the loop (clock law: gaps over 250 ms are dropped, never replayed) ---- */
var LOOP = { last: 0, acc: 0, STEP: 1 / 60, raf: 0, idleT: 0 };
function wake(){ LOOP.idleT = 0; AKIT.boot(); }
function frame(now){
  LOOP.raf = requestAnimationFrame(frame);
  if(SESSION.active){ LOOP.last = now; return; }
  var ms = now - (LOOP.last || now); LOOP.last = now;
  if(ms > 250){ LOOP.acc = 0; ms = LOOP.STEP * 1000; }                      /* drop the lost time, never sprint */
  var dt = ms / 1000;
  /* the row eases to focus; drag owns it while a finger is down */
  if(!LOBBY.drag){
    var target = LOBBY.focus, rm = motionReduced();
    if(rm){ LOBBY.pos = target; LOBBY.vel = 0; }
    else { var dx = target - LOBBY.pos; LOBBY.vel += dx * 60 * dt; LOBBY.vel *= Math.exp(-11 * dt); LOBBY.pos += LOBBY.vel * dt;
      if(Math.abs(dx) < .0005 && Math.abs(LOBBY.vel) < .0005){ LOBBY.pos = target; LOBBY.vel = 0; } }
  }
  placeRow();
  /* fixed step sims, at most 5 per frame */
  LOOP.acc += ms; var steps = 0;
  while(LOOP.acc >= LOOP.STEP * 1000 && steps < 5){
    for(var i = 0; i < CABS.length; i++){ var c = CABS[i]; if(c.visible || c.attract.powerT < 1) c.attract.step(LOOP.STEP); }
    LOOP.acc -= LOOP.STEP * 1000; steps++;
  }
  if(steps === 5) LOOP.acc = 0;
  LOBBY.sampleI++;
  for(var j = 0; j < CABS.length; j++){
    var cb = CABS[j];
    /* marquee power and light */
    if(!cb.game.soon && cb.powerAt && now >= cb.powerAt && cb.power < 1){
      var e = (now - cb.powerAt) / 700; cb.power = e >= 1 ? 1 : ((e * 7 | 0) % 2 ? .25 : e);
      cb.el.style.setProperty('--power', cb.power.toFixed(3));
    } else if(cb.game.soon){
      cb.flickT = (cb.flickT || 0) - dt;
      if(cb.flickT <= 0){ cb.flickT = 3 + Math.random() * 6; cb.flickOn = .18 + Math.random() * .25; }
      var fl = cb.flickOn > 0; if(fl) cb.flickOn -= dt;
      var pw = fl ? .7 : cb.powerTarget;
      if(pw !== cb._pw){ cb.el.style.setProperty('--power', pw); cb.mq.classList.toggle('flick', fl); cb._pw = pw; }
    }
    if(!cb.visible) continue;
    if(SHEET.scrim && (LOBBY.sampleI + j) % 4) continue;       /* paperwork open: the floor idles at quarter rate */
    cb.attract.render();
    if(!cb.game.soon && (LOBBY.sampleI + j * 3) % 8 === 0 && cb.attract.power >= 1){
      var s = cb.attract.sample();
      if(s){ for(var q = 0; q < 3; q++) cb.glow[q] = cb.glow[q] + (s[q] - cb.glow[q]) * .35;
        cb.el.style.setProperty('--glow', (cb.glow[0] | 0) + ',' + (cb.glow[1] | 0) + ',' + (cb.glow[2] | 0)); }
    }
    /* the joystick follows your input */
    if(cb.stickT > 0){ cb.stickT -= dt; var a = cb.stickT > 0 ? cb.stickDir * 16 : 0;
      cb.sticks.forEach(function(st){ st.querySelector('.shaft').style.transform = 'rotate(' + a + 'deg)'; st.querySelector('.ball').style.transform = 'translateX(' + (a * .28) + 'px)'; }); }
    if(cb.btnT > 0){ cb.btnT -= dt; if(cb.btns[0]) cb.btns[0].classList.toggle('on', cb.btnT > 0); }
  }
  pollPads(dt);
  stepSnail(dt);
  LOOP.idleT += dt;
  /* left alone, the floor runs its own attract: every 12 s it walks to the next lit cabinet */
  if(LOOP.idleT > 45 && !anySheetOpen() && !LOBBY.drag && !motionReduced()){
    LOBBY.autoT = (LOBBY.autoT || 0) + dt;
    if(LOBBY.autoT > 12){ LOBBY.autoT = 0; var nx = LOBBY.focus;
      do { nx = (nx + 1) % GAMES.length; } while(GAMES[nx].soon && nx !== LOBBY.focus);
      setFocus(nx, true); }
  } else LOBBY.autoT = 0;
  if(!LOBBY.flakyT || now > LOBBY.flakyT){ LOBBY.flakyT = now + 9000 + Math.random() * 12000; if(LOBBY.booted) flakyNeon(); }
}

/* ==== 08-session.js ==== */
/* =====================================================================
   A GAME SESSION: coin in, zoom into the tube, boot the cartridge, play,
   then power the tube down and step back onto the floor.
   Cartridges load as same origin documents (fetched, then srcdoc), so a
   game keeps its saves and can call parent.SNAILCADE.exitGame().
   ===================================================================== */
var SESSION = { active: false, phase: 'idle', cab: null, game: null, frame: null, fetchP: null, html: null, err: null,
  holdT: 0, holdOn: false, padT: 0, idleT: 0, idleTimer: 0, autoFs: false, t0: 0 };

function isPhone(){ return Math.min(window.innerWidth, window.innerHeight) < 600 && ('ontouchstart' in window || navigator.maxTouchPoints > 0); }
function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
function requestFs(elm){
  try { var r = elm.requestFullscreen ? elm.requestFullscreen({ navigationUI: 'hide' }) : (elm.webkitRequestFullscreen ? elm.webkitRequestFullscreen() : null);
    if(r && r.catch) r.catch(function(){}); return true; } catch(e){ return false; }
}
function exitFs(){ try { var r = document.exitFullscreen ? document.exitFullscreen() : (document.webkitExitFullscreen ? document.webkitExitFullscreen() : null); if(r && r.catch) r.catch(function(){}); } catch(e){} }
function toggleFullscreen(elm){ if(fsElement()) exitFs(); else if(!requestFs(elm || document.documentElement)) toast('FULL SCREEN IS NOT AVAILABLE HERE'); }

/* Where a cartridge comes from, in order: the copy built into this page (the offline
   file carries every game inside it), else the games folder beside the page. A page
   opened straight from disk may not fetch its neighbours (browsers forbid it), so
   there the arcade hands the loader DIRECT: load the file itself, trust its load. */
var DIRECT = { direct: true };
function embeddedCart(file){
  try { var s = window.SNAILCADE_CARTS; return s && typeof s[file] === 'string' ? s[file] : null; } catch(e){ return null; }
}
function fetchCart(g){
  var url = g.cart.file, emb = embeddedCart(url);
  if(emb) return Promise.resolve(emb);
  if(location.protocol === 'file:') return Promise.resolve(DIRECT);
  return fetch(url, { cache: 'no-cache' }).then(function(r){
    if(!r.ok) throw new Error('MISSING CARTRIDGE: ' + url + ' (HTTP ' + r.status + ')');
    return r.text();
  }, function(e){
    throw new Error('CARTRIDGE UNREACHABLE: ' + url + ' (' + (e && e.message ? e.message : 'network') + ')');
  }).then(function(t){
    if(!t || t.length < 200) throw new Error('EMPTY CARTRIDGE: ' + url);
    return t;
  });
}

function insertCoin(src){
  if(SESSION.phase !== 'idle') return;
  var cab = CABS[LOBBY.focus], g = cab.game; if(g.soon || !g.cart) return;
  wake(); closeSheets();
  SESSION.autoFs = false;
  if(SETTINGS.autofs && isPhone() && !fsElement()){ SESSION.autoFs = requestFs(document.documentElement); }
  SESSION.phase = 'coin'; SESSION.cab = cab; SESSION.game = g; SESSION.err = null; SESSION.html = null;
  SESSION.fetchP = fetchCart(g).then(function(t){ SESSION.html = t; return t; }, function(e){ SESSION.err = e; namedFail(e.message); throw e; });
  SESSION.fetchP.catch(function(){});
  if(SETTINGS.music) AKIT.music.stop();
  var rm = motionReduced();
  SND.ui.coin();
  var slot = cab.door.querySelector('.slot.s1 .mouth'), sr = slot.getBoundingClientRect();
  var from;
  if(src === 'button'){ var ic = $('bCoin').querySelector('.tok').getBoundingClientRect(); from = [ic.left + ic.width / 2, ic.top + ic.height / 2]; }
  else from = [sr.left + sr.width / 2 + 40, sr.top - 90];
  var to = [sr.left + sr.width / 2, sr.top + sr.height / 2];
  function landed(){
    SND.ui.thunk(); cab.door.classList.remove('hit'); void cab.door.offsetWidth; cab.door.classList.add('hit');
    cab.attract.credit = 1; cab.attract.creditT = 0;
    setTimeout(function(){ SND.ui.credit(); }, 120);
    setTimeout(function(){ pressBtn(cab); cab.starts.forEach(function(s){ s.classList.add('blink'); }); }, rm ? 100 : 380);
    setTimeout(function(){ startZoom(); }, rm ? 250 : 620);
  }
  if(rm){ landed(); return; }
  var coin = el('div', 'coinfly', '<svg viewBox="0 0 32 32"><use href="#tokenSym"/></svg>');
  document.body.appendChild(coin);
  var mx = (from[0] + to[0]) / 2, my = Math.min(from[1], to[1]) - 120;
  var anim = coin.animate([
    { transform: 'translate(' + (from[0] - 17) + 'px,' + (from[1] - 17) + 'px) rotateY(0deg) scale(1)', offset: 0 },
    { transform: 'translate(' + (mx - 17) + 'px,' + (my - 17) + 'px) rotateY(540deg) scale(1.15)', offset: .5 },
    { transform: 'translate(' + (to[0] - 17) + 'px,' + (to[1] - 20) + 'px) rotateY(900deg) scale(.55)', offset: .88 },
    { transform: 'translate(' + (to[0] - 17) + 'px,' + (to[1] - 6) + 'px) rotateY(990deg) scale(.35,.12)', offset: 1 }
  ], { duration: 720, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards' });
  anim.onfinish = function(){ coin.remove(); landed(); };
}

function screenRect(){
  var vw = window.innerWidth, vh = window.innerHeight, g = SESSION.game;
  var bez = SETTINGS.bezel && vw / vh > 1.02 && vw >= 700;
  if(!bez) return { left: 0, top: 0, width: vw, height: vh, bezel: false };
  var h = vh * .96, w = Math.min(vw * .92, h * (g.aspect || .727) * 1.0);
  return { left: (vw - w) / 2, top: (vh - h) / 2, width: w, height: h, bezel: true };
}
function applyScreenRect(){
  var r = screenRect(), s = $('sessScreen'), vw = window.innerWidth, vh = window.innerHeight;
  var room = r.bezel ? (vw - r.width) / 2 - 36 : 0, cab = SESSION.cab;
  ['L', 'R'].forEach(function(k){
    var e = $('sessSide' + k), url = cab && (k === 'L' ? cab.sideL : cab.sideR);
    if(room < 110 || !url){ e.hidden = true; return; }
    var hgt = Math.min(vh * .9, room * 560 / 214), w = hgt * 214 / 560;
    e.hidden = false; e.style.width = w + 'px'; e.style.height = hgt + 'px'; e.style.top = ((vh - hgt) / 2) + 'px';
    e.style.left = (k === 'L' ? r.left - 26 - w : r.left + r.width + 26) + 'px';
    e.style.backgroundImage = 'url(' + url + ')';
  });
  s.style.left = r.left + 'px'; s.style.top = r.top + 'px'; s.style.width = r.width + 'px'; s.style.height = r.height + 'px';
  s.style.borderRadius = r.bezel ? '14px' : '0';
  s.style.boxShadow = r.bezel ? '0 0 0 6px #050507,0 0 0 8px rgba(255,255,255,.06),0 0 60px rgba(' + SESSION.game.glow + ',.35)' : 'none';
  return r;
}

function startZoom(){
  var cab = SESSION.cab, g = SESSION.game, rm = motionReduced();
  SESSION.phase = 'zoom'; SESSION.active = true; SESSION.t0 = nowMs();
  var crt = cab.face.querySelector('.crt').getBoundingClientRect();
  var ses = $('session'); ses.hidden = false;
  $('sessBg').className = 'sess-bg ' + g.theme;
  $('confirm').hidden = true; $('holdEsc').hidden = true;
  var boot = $('sessBoot'); boot.classList.remove('err'); boot.style.opacity = '1'; boot.hidden = false; $('bootText').textContent = '';
  var r = applyScreenRect(), s = $('sessScreen');
  SND.ui.enter();
  if(rm){
    ses.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, fill: 'none' });
    afterZoom(); return;
  }
  var sx = crt.width / r.width, sy = crt.height / r.height;
  var tx = crt.left - r.left, ty = crt.top - r.top;
  s.style.transformOrigin = '0 0';                          /* FLIP: translate then scale from the top left corner */
  var zoom = s.animate([
    { transform: 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ')', borderRadius: '40px' },
    { transform: 'translate(0,0) scale(1,1)', borderRadius: r.bezel ? '14px' : '0px' }
  ], { duration: 680, easing: 'cubic-bezier(.65,0,.25,1)' });
  zoom.onfinish = function(){ s.style.transformOrigin = ''; if(SESSION.active) $('app').style.visibility = 'hidden'; };   /* the floor stops compositing while you play */
  $('sessBg').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 680, easing: 'ease-in' });
  ['sessSideL', 'sessSideR'].forEach(function(id){ $(id).animate([{ opacity: 0 }, { opacity: 0, offset: .45 }, { opacity: 1 }], { duration: 760 }); });
  $('sessCtrl').animate([{ opacity: 0 }, { opacity: 0, offset: .7 }, { opacity: 1 }], { duration: 900 });
  setTimeout(afterZoom, 640);
}

var BOOT_LINES = function(g){
  return ['SNAILCADE BIOS v' + SNAILCADE_VERSION, 'ROM CHECK ........ OK', 'RAM CHECK ........ OK',
    'CARTRIDGE ........ ' + g.title, (g.cart.standin ? g.cart.label : 'BUILD ' + g.cart.build), '', 'LOADING'];
};
function afterZoom(){
  if(!SESSION.active) return;
  SESSION.phase = 'boot';
  var fx = $('sessFx'), rm = motionReduced();
  if(!rm) fx.animate([{ opacity: .85 }, { opacity: 0 }], { duration: 260, easing: 'ease-out' });
  var lines = BOOT_LINES(SESSION.game), out = [], i = 0, pre = $('bootText');
  var minT = rm ? 200 : 620, t0 = nowMs();
  (function typeLine(){
    if(!SESSION.active || SESSION.phase !== 'boot') return;
    if(i < lines.length){ out.push(lines[i++]); pre.textContent = out.join('\n'); setTimeout(typeLine, rm ? 0 : 70); return; }
    SESSION.fetchP.then(function(html){
      var wait = Math.max(0, minT - (nowMs() - t0));
      setTimeout(function(){ mountGame(html); }, wait);
    }, function(e){ bootError(e); });

}
function bootError(e){
  if(!SESSION.active) return;
  SESSION.phase = 'error';
  var boot = $('sessBoot'); boot.classList.add('err');
  $('bootText').textContent = 'CARTRIDGE ERROR\n\n' + (e && e.message ? e.message : 'UNKNOWN FAULT') + '\n\nThe machine is fine. The cartridge did not load.\nTry again, or step back onto the floor.';
  var wrap = boot.firstElementChild, row = el('div', 'retry');

/* ---- the cartridge loader: three ways in, each proven alive before we trust it ----
   A  srcdoc  the fetched file as a same origin document (saves and the host API work)
   B  src     the file straight from the host, for hosts that refuse srcdoc
   C  blob    an object URL of the fetched file, the last resort
   D  direct  the file straight from disk, when the page itself was opened from a
              folder: the frame is foreign to the arcade there, so its load is trusted
   A and C carry a one line probe script; B is judged by the cartridge's own globals
   or a painted canvas. A host that blocks every way gets a named failure, never a
   silent black tube. */
var PROBE = '<script>window.__snailProbe=1<\/script>';
function withProbe(html){
  var i = html.search(/<head[^>]*>/i);
  if(i >= 0){ var j = html.indexOf('>', i) + 1; return html.slice(0, j) + PROBE + html.slice(j); }
  return PROBE + html;
}
function frameAlive(f, strategy){
  try {
    var w = f.contentWindow, d = f.contentDocument;
    if(!w || !d || !d.body) return false;
    if(strategy !== 'src' && w.__snailProbe === 1) return true;
    if(w.SNAILCART) return true;
    var cs = d.getElementsByTagName('canvas');
    for(var i = 0; i < cs.length; i++){ try { var c = cs[i], g = c.getContext('2d'); if(!g || !c.width) continue;
      var px = g.getImageData(0, 0, Math.min(c.width, 64), Math.min(c.height, 64)).data;
      for(var k = 3; k < px.length; k += 16) if(px[k] > 0) return true; } catch(e){} }
    return strategy === 'src' ? d.scripts.length === 0 && d.body.childElementCount > 0 : false;
  } catch(e){ return false; }
}
function loadInto(host, html, file, done){
  var order = html === DIRECT ? ['direct'] : ['srcdoc', 'src', 'blob'], tried = [], f = null, blobUrl = null;
  function next(){
    if(f){ try { f.remove(); } catch(e){} f = null; }
    if(blobUrl){ try { URL.revokeObjectURL(blobUrl); } catch(e){} blobUrl = null; }
    var st = order.shift();
    if(!st){ done(null, tried); return; }
    f = document.createElement('iframe');
    f.setAttribute('allow', 'fullscreen *; autoplay *; gamepad *'); f.setAttribute('allowfullscreen', '');   /* explicit lists: a page opened from disk has no origin for 'self' to match */
    var settled = false, timer = null, loaded = false, slow = st === 'src' || st === 'direct';
    function judge(){
      if(settled) return;
      var alive = st === 'direct' ? loaded : frameAlive(f, st);
      if(alive){ settled = true; clearTimeout(timer); tried.push(st + ':ok'); done(f, tried, st); return; }
      if(nowMs() - t0 > (slow ? 2600 : 1400)){ settled = true; tried.push(st + ':dead'); next(); return; }
      timer = setTimeout(judge, 150);
    }
    var t0 = nowMs();
    f.addEventListener('load', function(){ loaded = true; if(!settled){ clearTimeout(timer); judge(); } });
    timer = setTimeout(judge, slow ? 2600 : 1600);
    if(st === 'direct') f.src = file;              /* set before insertion: the only load it can fire is the game's own */
    host.appendChild(f);
    try {
      if(st === 'srcdoc') f.srcdoc = withProbe(html);
      else if(st === 'src') f.src = file;
      else if(st === 'direct'){ /* its src went in before insertion */ }
      else { blobUrl = URL.createObjectURL(new Blob([withProbe(html)], { type: 'text/html' })); f.src = blobUrl; }
    } catch(e){ settled = true; clearTimeout(timer); tried.push(st + ':threw'); next(); }
  }
  next();
}

function mountGame(html){
  if(!SESSION.active || SESSION.phase !== 'boot') return;
  SESSION.phase = 'mount';
  var g = SESSION.game, host = $('sessScreen');
  var mark = document.createElement('div'); mark.style.display = 'none'; host.insertBefore(mark, $('sessBoot'));
  loadInto({ appendChild: function(fr){ fr.title = g.title; host.insertBefore(fr, mark); } }, html, g.cart.file, function(f, tried, st){
    mark.remove();
    if(!SESSION.active || SESSION.phase !== 'mount'){ if(f) f.remove(); return; }
    if(!f){ bootError(new Error('CARTRIDGE BLOCKED BY THIS HOST: ' + g.cart.file + ' (' + tried.join(', ') + ')')); return; }
    SESSION.phase = 'play'; SESSION.frame = f; SESSION.strategy = st;
    var boot = $('sessBoot');
    boot.animate([{ opacity: 1 }, { opacity: 0 }], { duration: motionReduced() ? 1 : 260, fill: 'forwards' }).onfinish = function(){ boot.hidden = true; };
    try { f.focus(); if(f.contentWindow) f.contentWindow.focus(); } catch(e){}
    hookFrame(f);
    if(st === 'direct') toast('PLAYING FROM A FOLDER: USE EJECT TO LEAVE');
    STORE.plays[g.id] = (STORE.plays[g.id] || 0) + 1; STORE.last[g.id] = Date.now(); STORE.lastGame = g.id;
    if(g.cart.build != null) STORE.seen[g.id] = g.cart.build;
    saveStore();
    ctrlActive();

}

/* ---- #diag: a self test of the host, reported to the parent page and the ERR line ---- */
function runDiag(){
  var g = GAMES[0], out = { snailcadeDiag: SNAILCADE_VERSION, origin: location.origin, file: g.cart.file, steps: [] };
  function report(){ try { window.parent.postMessage(out, '*'); } catch(e){} try { if(window.top !== window.parent) window.top.postMessage(out, '*'); } catch(e){}
    namedFail('DIAG ' + JSON.stringify(out.steps)); }
  fetchCart(g).then(function(html){
    out.steps.push(html === DIRECT ? 'fetch:direct' : (embeddedCart(g.cart.file) ? 'fetch:embedded:' : 'fetch:ok:') + html.length);
    var box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-4000px;top:0;width:320px;height:440px;';
    document.body.appendChild(box);
    loadInto(box, html, g.cart.file, function(f, tried, st){
      out.steps = out.steps.concat(tried); out.winner = st || null;
      if(f) f.remove(); box.remove(); report();
    });
  }, function(e){ out.steps.push('fetch:fail:' + e.message); report(); });
}
function hookFrame(f){
  try {
    var w = f.contentWindow; if(!w) return;
    w.addEventListener('keydown', sessKeyDown, true); w.addEventListener('keyup', sessKeyUp, true);
    ['pointerdown', 'pointermove', 'touchstart'].forEach(function(ev){ w.addEventListener(ev, ctrlActive, { passive: true, capture: true }); });
  } catch(e){}
}

function sessKeyDown(e){

    SESSION.holdOn = true; SESSION.holdT = nowMs(); $('holdEsc').hidden = false; ctrlActive();

/* ---- the game list: every cabinet on the floor, then every game page on the site ---- */
/* On the site itself (http or https, not a local test server, not a host frame) links are
   relative and the site's file tree is read live; everywhere else they point at SITE_URL. */
function onSite(){ return /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && !/claude/i.test(location.hostname); }
var SITE = { pages: null, shelf: null, state: 'idle' };   /* state: idle, reading, live (read from the tree), baked (the registry list) */
function sitePages(){ return SITE.pages || PAGES; }
function siteShelf(){ return SITE.shelf == null ? true : SITE.shelf; }   /* baked: the shelf is linked; live: only while test/index.html is on the site */
/* the title folders in a list of site file paths: <slug>/index.html and <slug>/play/index.html.
   test/ is the device-test shelf and games/ the arcade's own cartridges: neither is a title. */
function pagesFromTree(paths){
  var has = {}, dirs = {}, out = [];
  paths.forEach(function(p){ has[p] = 1; var m = /^([a-z0-9][a-z0-9-]*)\//.exec(p); if(m && m[1] !== 'test' && m[1] !== 'games') dirs[m[1]] = 1; });
  function row(id, title, tagline){ return { id: id, title: title, tagline: tagline, index: !!has[id + '/index.html'], play: !!has[id + '/play/index.html'] }; }
  PAGES.forEach(function(p){ if(dirs[p.id]){ out.push(row(p.id, p.title, p.tagline)); delete dirs[p.id]; } });
  Object.keys(dirs).sort().forEach(function(id){ out.push(row(id, id.replace(/-/g, ' ').toUpperCase(), '')); });
  return out.filter(function(p){ return p.index || p.play; });
}
function readSite(){
  if(SITE.state !== 'idle') return;
  if(!onSite() || !window.fetch){ SITE.state = 'baked'; return; }
  var c = STORE.site, now = Date.now();
  if(c && Array.isArray(c.list) && now >= c.t && now - c.t < 600000){ SITE.pages = c.list; SITE.shelf = !!c.shelf; SITE.state = 'live'; return; }
  SITE.state = 'reading';
  fetch('https://api.github.com/repos/' + SITE_REPO + '/git/trees/' + SITE_BRANCH + '?recursive=1')
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      if(!j || !Array.isArray(j.tree) || j.truncated) throw new Error('tree unreadable');
      var paths = j.tree.filter(function(t){ return t.type === 'blob'; }).map(function(t){ return t.path; });
      SITE.pages = pagesFromTree(paths); SITE.shelf = paths.indexOf(SHELF.path + 'index.html') >= 0;
      SITE.state = 'live'; STORE.site = { t: Date.now(), list: SITE.pages, shelf: SITE.shelf }; saveStore();
    })
    .catch(function(){ SITE.state = 'baked'; })
    .then(refreshGames);
}
function pageHref(p, play){ return (onSite() ? '' : SITE_URL) + p.id + '/' + (play ? 'play/' : ''); }
function shelfHref(){ return (onSite() ? '' : SITE_URL) + SHELF.path; }
function gamesBody(){
  var h = '<h3>ON THE FLOOR</h3><ul class="gl">';
  GAMES.forEach(function(g, i){ if(g.soon) return;
    h += '<li><button class="gl-row" data-i="' + i + '" style="--gl:' + g.accent + '"><span class="gl-t">' + esc(g.title) + '</span>' +
      '<span class="gl-s">' + esc(g.tagline) + '</span><span class="gl-c">' + esc(g.cart ? (g.cart.standin ? g.cart.label : 'BUILD ' + g.cart.build) : '') + '</span>' +
      '<span class="gl-go">GO TO CABINET</span></button></li>'; });
  h += '</ul><h3>GAME PAGES</h3>';
  var pages = sitePages(), tgt = onSite() ? '' : ' target="_blank" rel="noopener"';
  if(pages.length){
    h += '<ul class="gl">';
    pages.forEach(function(p){
      h += '<li class="gl-row gl-page" data-page="' + esc(p.id) + '"><span class="gl-t">' + esc(p.title) + '</span>' + (p.tagline ? '<span class="gl-s">' + esc(p.tagline) + '</span>' : '') +
        '<span class="gl-acts">' + (p.index ? '<a class="btn-s" href="' + esc(pageHref(p, false)) + '"' + tgt + '>OPEN PAGE</a>' : '') +
        (p.play ? '<a class="btn-s" href="' + esc(pageHref(p, true)) + '"' + tgt + '>PLAY</a>' : '') + '</span></li>';
    });
    h += '</ul>';
  } else h += '<p class="gl-none">' + (SITE.state === 'reading' ? 'Checking the site for game pages.' : 'No game pages on the site yet. Each Snail Attack game gets its own page here as it opens.') + '</p>';
  if(siteShelf()) h += '<h3>FOR TESTERS</h3><ul class="gl"><li class="gl-row gl-page gl-shelf"><span class="gl-t">' + esc(SHELF.title) + '</span><span class="gl-s">' + esc(SHELF.tagline) + '</span>' +
    '<span class="gl-acts"><a class="btn-s" href="' + esc(shelfHref()) + '"' + tgt + '>OPEN THE SHELF</a></span></li></ul>';
  return h;
}
function bindGames(root){
  Array.prototype.forEach.call(root.querySelectorAll('button.gl-row'), function(b){
    b.addEventListener('click', function(){ var i = +b.getAttribute('data-i'); closeSheets(); wake(); setFocus(i); });
  });
}
function refreshGames(){ var b = document.querySelector('.sheet.games #glBody'); if(b){ b.innerHTML = gamesBody(); bindGames(b); } }
function openGames(){
  readSite();
  var h = '<div class="op-head"><div class="op-kick">EVERY GAME</div><h2 class="op-title" id="sheetTitle">GAME LIST</h2>' +
    '<p class="op-sub">Walk to a cabinet on the floor, or open a game&#8217;s own page.</p></div><div class="op-body" id="glBody">' + gamesBody() + '</div>';
  var sh = openSheet('op games', h, 'sheetTitle');
  bindGames(sh);
}

/* ---- the top bar ---- */
function toggleSound(){ SETTINGS.sound = !SETTINGS.sound; if(SETTINGS.sound) AKIT.boot(); applySettings(); saveSettings(); SND.music(SETTINGS.music);
  if(SETTINGS.sound) SND.ui.press(); toast(SETTINGS.sound ? 'SOUND ON' : 'SOUND OFF'); }
function toggleMusic(){ SETTINGS.music = !SETTINGS.music; if(SETTINGS.music && !SETTINGS.sound){ SETTINGS.sound = true; }
  AKIT.boot(); applySettings(); saveSettings(); SND.music(SETTINGS.music); toast(SETTINGS.music ? 'NOW PLAYING: SNAILCADE AFTER HOURS' : 'MUSIC OFF'); }
function bindUI(){
  $('bGames').addEventListener('click', function(){ openGames(); });
  $('bSound').addEventListener('click', function(){ wake(); toggleSound(); });
  $('bMusic').addEventListener('click', function(){ wake(); toggleMusic(); });
  $('bSettings').addEventListener('click', function(){ openSettings(); });
  $('bHelp').addEventListener('click', function(){ openHelp(); });
  $('bFull').addEventListener('click', function(){ wake(); toggleFullscreen(document.documentElement); });
  $('badge').addEventListener('click', openNews);
  $('bInfo').addEventListener('click', function(){ openInfo(LOBBY.focus); });
  $('bCoin').addEventListener('click', function(){ wake(); pressBtn(CABS[LOBBY.focus]); insertCoin('button'); });
  $('bPrev').addEventListener('click', function(){ wake(); browse(-1); });
  $('bNext').addEventListener('click', function(){ wake(); browse(1); });
  $('bEject').addEventListener('click', askExit);
  $('bExitYes').addEventListener('click', exitGame);
  $('bExitNo').addEventListener('click', cancelExit);
  $('bSessFull').addEventListener('click', function(){ toggleFullscreen(document.documentElement); ctrlActive(); });
  $('session').addEventListener('pointermove', ctrlActive, { passive: true });
  $('session').addEventListener('pointerdown', ctrlActive, { passive: true });
  window.addEventListener('keydown', function(e){
    if(SHEET.scrim){ if(e.key === 'Escape'){ closeSheets(); e.preventDefault(); } else trapFocus(e); return; }
    if(SESSION.active){ sessKeyDown(e); return; }
    onLobbyKey(e);
  });
  window.addEventListener('keyup', function(e){ if(SESSION.active) sessKeyUp(e); });
  ['pointerdown', 'keydown', 'touchstart'].forEach(function(ev){ window.addEventListener(ev, function(){ AKIT.boot(); if(SETTINGS.music && !SESSION.active && !AKIT.music.playing()) SND.music(true); }, { passive: true, capture: true }); });
}

/* ==== 10-boot.js ==== */
/* ---- opening time ---- */
function hashFocus(){
  var h = (location.hash || '').replace(/^#/, '').toLowerCase();
  if(!h) return -1; return indexById(h);
}
function start(data){
  loadStore(); loadSettings();
  STORE.visits = (STORE.visits || 0) + 1; saveStore();
  applySettings();
  $('badge').textContent = 'SNAILCADE v' + SNAILCADE_VERSION;
  buildSign(); buildDecor(); buildCabinets(); buildDots(); buildSnail(); brandMark();
  try { $('floor3d').style.backgroundImage = 'url(' + makeCarpet() + ')'; } catch(e){ namedFail('CARPET: ' + e.message); }
  bindLobbyInput(); bindUI();
  var f = hashFocus();
  if(f < 0 && data && data.focus) f = indexById(data.focus);
  if(f < 0 && STORE.focus) f = indexById(STORE.focus);
  if(f < 0) f = 0;
  LOBBY.focus = f; LOBBY.pos = f; LOBBY._lastFocus = f;
  updatePlacard(); layout();
  if(window.ResizeObserver) new ResizeObserver(function(){ layout(); }).observe($('app'));
  else window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 120); });
  window.addEventListener('hashchange', function(){ if((location.hash || '').toLowerCase() === '#diag'){ runDiag(); return; }
    if((location.hash || '').toLowerCase() === '#games'){ if(!SESSION.active) openGames(); return; }
    var h = hashFocus(); if(h >= 0 && !SESSION.active) setFocus(h); });
  paintSides();
  var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  fontsReady.then(function(){ paintSides(); layout(); });
  powerOn();
  LOBBY.booted = true;
  if((location.hash || '').toLowerCase() === '#diag') setTimeout(runDiag, 300);
  if((location.hash || '').toLowerCase() === '#games') setTimeout(openGames, 300);
  LOOP.raf = requestAnimationFrame(frame);
}
function snapshot(){ return { focus: GAMES[LOBBY.focus] ? GAMES[LOBBY.focus].id : null }; }
var STARTED = false;
function startOnce(d){ if(STARTED) return; STARTED = true; try { start(d || {}); } catch(e){ namedFail('BOOT: ' + e.message); } }
(function boot(){
  /* optional live-update hook from the hosting page; the arcade boots without it */
  var hot = null;
  try { hot = window.claude && window.claude.hot ? window.claude.hot : null; } catch(e){ hot = null; }
  try { if(hot && typeof hot.snapshot === 'function') hot.snapshot(snapshot); } catch(e){}
  try {
    if(hot && typeof hot.ready === 'function'){ hot.ready(startOnce); setTimeout(function(){ startOnce({}); }, 1200); }
    else startOnce((hot && hot.data) || {});
  } catch(e){ startOnce({}); }
})();

})();</script>
