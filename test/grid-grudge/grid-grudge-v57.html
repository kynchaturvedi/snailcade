 v50  SAME TRACK RESUME  (fold no longer leaves the game silent)
   - Bug (Director): starting unfolded then folding stopped the audio and
     it did not come back. v49 correctly stops the old page's audio on
     teardown, but v48's resume SUPPRESSED the new page's music, so the
     folded page stayed silent. Fix: instead of suppressing, a resume now
     CONTINUES the same track that was playing. saveSolo records the
     track name; resumeSolo sets it as the pending track; the first
     musicSync after a resume starts that exact track (not a random one,
     not silence). No overlap (the old audio is torn down by v49), no
     silence, and the same tune carries across the fold.
   - Gate: audiotest asserts a resume continues the SAME track.

 v49  AUDIO LIFECYCLE  (stop audio when the page is hidden or closed)
   - Bug (Director): closing the browser tab left the music still
     playing. The AudioContext and its 25ms scheduler were never torn
     down on page teardown. Fix: lifecycle handlers. On visibilitychange
     to hidden the music stops and the context suspends; on return it
     resumes. On pagehide and beforeunload the scheduler stops and the
     context is closed, so audio cannot outlive the page. This also
     helps the unfold case by stopping the old page's audio.
   - Gate: audiotest asserts hiding and unloading both stop the music.

     unfold kept going and a NEW random track started on top of it. On
     the reload the old page's audio lingers; the new page's first
     gesture ran audioInit -> musicSync, which picked a fresh random
     track. Fix: a solo resume sets suppressMusicOnce, so the first
     musicSync after a resume does NOT start a track. The track already
     playing continues; music control returns on the next mode change.
   - Trade-off noted: if you deliberately reopen a solo game (no audio
     already playing), music stays quiet until the next mode change; a
     RESUME prompt or a continue-the-same-track option can replace this

   - Gate: audiotest now asserts the first sync after a resume is

  cpu = { field:[], spec:[], type:null, target:null, timer:0, thinkTarget:0, preset:level||'MED', lines:0, bag:[], hold:null, inv:[] };
  for (var y=0;y<FIELD_H;y++){ cpu.field.push(new Array(FIELD_W).fill(0)); cpu.spec.push(new Array(FIELD_W).fill(0)); }
  cpuNextPiece();
}
function cpuBagPop(){ if(!cpu.bag.length){ cpu.bag=TYPES.slice(); for(var i=cpu.bag.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0,t=cpu.bag[i]; cpu.bag[i]=cpu.bag[j]; cpu.bag[j]=t; } } return cpu.bag.pop(); }
function cpuPeek(){ if(!cpu.bag.length){ cpu.bag=TYPES.slice(); for(var i=cpu.bag.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0,t=cpu.bag[i]; cpu.bag[i]=cpu.bag[j]; cpu.bag[j]=t; } } return cpu.bag[cpu.bag.length-1]; }
function cpuNextPiece(){ cpu.type=cpuBagPop(); cpu.target=null; cpu.timer=0; }
function cpuAddGarbage(n, gap){ if(!cpu) return; for(var i=0;i<n;i++){ cpu.field.shift(); cpu.spec.shift(); var row=new Array(FIELD_W).fill(GARBAGE_COLOR); row[gap]=0; cpu.field.push(row); cpu.spec.push(new Array(FIELD_W).fill(0)); } }
function cpuSeedSpecials(nl){ var off=AI_PRESETS[cpu.preset].offense; for(var i=0;i<nl;i++){ if(cpu.inv.length>=INVENTORY_CAP) break; cpu.inv.push(off ? weightedSpecial() : ['C','C','C','G','G','N'][Math.floor(Math.random()*6)]); } }
function cpuSelfEffect(letter){ applyEffect(letter, cpu); }
function cpuUseSpecial(){
  if (!cpu || !cpu.inv.length) return;
  var act = aiSpecial(cpu.inv, AI_PRESETS[cpu.preset], specMaxH(cpu.field));
  if (!act) return;
  if (act.target==='ME'){ var f=cpu.inv.shift(); cpuSelfEffect(f); }
  else { var f2=cpu.inv.shift(); if(f2){ if (f2==='S'){ var tf=STATE.field, ts=STATE.spec; STATE.field=cpu.field; STATE.spec=cpu.spec; cpu.field=tf; cpu.spec=ts; } else applyNetSpecial(STATE, f2); announce((SPECIAL_INFO[f2]?SPECIAL_INFO[f2][0]:f2).toUpperCase(), SPECIAL_COLORS[f2]); } }
}
function topOutCpu(){ if (STATE.mode==='over') return; STATE.result='win'; STATE.mode='over'; STATE.active=null; if(typeof sfxWin==='function') sfxWin(); }
function cpuDrive(dt){
  if (!cpu || STATE.mode !== 'play') return;
  var P = AI_PRESETS[cpu.preset];
  if (!cpu.target){
    var plan = botPlan(cpu.field, cpu.type, cpuPeek(), cpu.hold, P);
    if (!plan){ topOutCpu(); return; }
    if (plan.hold){ if (cpu.hold === null){ cpu.hold = cpu.type; cpu.type = cpuBagPop(); } else { var hh=cpu.hold; cpu.hold=cpu.type; cpu.type=hh; } }
    cpu.target = plan; cpu.timer = 0; cpu.thinkTarget = P.thinkMs * (0.65 + Math.random() * 0.7);
  }
  cpu.timer += dt;
  if (cpu.timer >= cpu.thinkTarget){
    var m = cpu.target.m, x = cpu.target.x;
    var y = (cpu.target.y != null && botFits(m, x, cpu.target.y, cpu.field)) ? cpu.target.y : botDropY(m, x, cpu.field);
    if (y >= 0){ cpu.field = botPlace(cpu.field, m, x, y, SHAPES[cpu.type].c); var cc = botClear(cpu.field); cpu.field = cc.f; cpu.lines += cc.lines;
      if (cc.lines > 0){ var g = computeSend(cc.lines); if (g > 0){ if (applyGarbage(STATE, g, (Math.random()*FIELD_W)|0)) topOut(); } if (SEED_PRESET === 'arcade' ? cc.lines >= 1 : cc.lines >= 2) cpuSeedSpecials(cc.lines); } }
    cpuUseSpecial();
    cpuNextPiece();
    if (!botFits(SHAPES[cpu.type].m, 4, 0, cpu.field)) topOutCpu();
  }
}
function announce(text, col){ FX.spName = { text: text, col: col || '#e8eef7', t: 1.3 }; }   // v54: flash a special / line-clear name over the field
function drawAnnounce(){
  var a = FX.spName; if (!a || a.t <= 0) return;
  a.t -= 0.016;
  var f = L.field, cx = f.x + f.w/2, cy = f.y + f.h*0.34 - (1.3 - a.t)*22, al = Math.max(0, Math.min(1, a.t*1.7));
  ctx.save(); ctx.globalAlpha = al; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = '900 ' + Math.max(14, Math.round(f.w*0.11)) + 'px Impact, "Arial Narrow", sans-serif';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(a.text, cx, cy);
  ctx.shadowColor = a.col; ctx.shadowBlur = 12; ctx.fillStyle = a.col; ctx.fillText(a.text, cx, cy);
  ctx.restore();
}
function startVsCpu(level){ cpuLevel=level; VSCPU=true; HAS_OPPONENT=true; cpuInit(level); menuScreen=null; resetGame(); computeLayout(); }
function endVsCpu(){ VSCPU=false; HAS_OPPONENT=false; cpu=null; }

/* =================================================================================== */
function computeLayout(){
  if (WIDE){ computeLayoutWide(); if (HAS_OPPONENT) versusWide(); return; }   // v29 UNFOLDED; v51 versus transform
  var pad = 8;
  var hud = 34;
  var railW = 52;                            // v22: minimal rail (HOLD/NEXT/RIVAL); every pixel goes to the field
  var bandH = 150;                           // bottom controls
  var specialsH = 52, sgap = 6, bandGap = 8; // v22: specials strip back under the field, filling what was slack
  var fieldX = pad;
  var topY = hud + pad;
  var bandY = LOGH - bandH;
  var specialsY = bandY - bandGap - specialsH;
  var maxFieldH = specialsY - sgap - topY;
  var availW = LOGW - railW - pad*3;
  var cell = Math.floor(Math.min(availW / FIELD_W, maxFieldH / FIELD_H));   // v22: cell 23, an EXACT fit on both axes (zero slack)
  var boardW = cell * FIELD_W, boardH = cell * FIELD_H;
  var fieldY = topY + Math.floor((maxFieldH - boardH) / 2);
  var railX = fieldX + boardW + pad*2;
  L = {
    pad:pad, hud:hud, cell:cell,
    field:{ x:fieldX, y:fieldY, w:boardW, h:boardH },
    rail:{ x:railX, y:fieldY, w:LOGW - railX - pad, h:boardH },
    band:{ x:0, y:bandY, w:LOGW, h:bandH },
    boardBottom: fieldY + boardH
  };
  L.menu = { x: LOGW - 54, y: 4, w: 46, h: 26 };         // v30: MENU replaces the vague fullscreen brackets
  // control band (v22, Director): row one = the LEFT|RIGHT slab beside ROT L and ROT R;
  // row two = the full-width DOWN slab beside HARD DROP. Move on the left, act on the right.
  var b = L.band;
  var sq = 64, g8 = 8;
  var rightW = sq*2 + g8;
  var leftW = LOGW - 24 - g8 - rightW;
  var rowH1 = sq, rowH2 = 56, contentH = rowH1 + g8 + rowH2;
  var cy0 = b.y + Math.floor((b.h - contentH)/2);
  L.dpad    = { x: 12, y: cy0, w: leftW, h: contentH };        // L|R top slab, DOWN bottom slab
  L.rotateL = { x: 12 + leftW + g8, y: cy0, s: sq };
  L.rotateR = { x: 12 + leftW + g8 + sq + g8, y: cy0, s: sq };
  L.drop    = { x: 12 + leftW + g8, y: cy0 + rowH1 + g8, w: rightW, h: rowH2 };
  // right rail stack (v31): NEXT, then RIVAL only when a rival exists; HOLD
  // moved down to the control region (Director)
  var rr = L.rail, ry = rr.y, rw = rr.w, gp = 6;
  L.next = { x: rr.x, y: ry, w: rw, h: HAS_OPPONENT ? 110 : 170 }; ry += (HAS_OPPONENT ? 110 : 170) + gp;
  L.opp  = HAS_OPPONENT ? { x: rr.x, y: ry, w: rw, h: Math.max(70, (rr.y + rr.h) - ry) } : { x: 0, y: 0, w: 0, h: 0 };
  // specials strip (v22): front tile | queue chips | USE ON <target> | DROP
  L.specials = { x: pad, y: specialsY, w: LOGW - pad*2, h: specialsH };
  var sp = L.specials;
  // v31 (Director): ONE consolidated icon-USE button with a +N count; the
  // pill, discard, chips, and info tile are retired. HOLD joins this row,
  // down at thumb level with the controls.
  L.spPrimary = { x: sp.x + 8, y: sp.y + 4, w: 128, h: 44 };
  L.hold      = { x: sp.x + sp.w - 84, y: sp.y + 4, w: 76, h: 44 };
  foldedLayout();   // v53: folded restructure for BOTH solo and versus (rival added only in versus)
  L.spFront = { x:0, y:0, w:0, h:0 }; L.spQueue = { x:0, y:0, w:0, h:0 };
  L.spTarget = { x:0, y:0, w:0, h:0 }; L.spDrop = { x:0, y:0, w:0, h:0 };
  L.spAlt = { x:0, y:0, w:0, h:0 };
  computePauseRects();
}

function resize(){
  if (!HAS_DOM) return;
  var vw = window.innerWidth, vh = window.innerHeight;
  if (window.visualViewport){ vw = Math.min(vw, window.visualViewport.width); vh = Math.min(vh, window.visualViewport.height); }   // v32: the real visible box
  try {                                              // v34: fit INSIDE #wrap's safe-area padded content box, not the raw viewport
    var wrapEl = document.getElementById('wrap');    // (the bottom gesture-bar inset clipped the unfolded canvas even after v32)
    if (wrapEl && window.getComputedStyle){
      var cst = window.getComputedStyle(wrapEl);
      vw -= (parseFloat(cst.paddingLeft) || 0) + (parseFloat(cst.paddingRight) || 0);
      vh -= (parseFloat(cst.paddingTop) || 0) + (parseFloat(cst.paddingBottom) || 0);
    }
  } catch (e){}
  var dpr = window.devicePixelRatio || 1;
  applyViewport(vw, vh);                             // v29: pick portrait or the unfolded wide layout first
  var fit = Math.min(vw / LOGW, vh / LOGH);          // CSS px per logical unit that FILLS the screen (no flooring, no letterbox)
  var cw = Math.round(LOGW * fit * dpr), ch = Math.round(LOGH * fit * dpr);   // backing at FULL device resolution -> crisp
  canvas.width = cw; canvas.height = ch;
  canvas.style.width = (cw / dpr) + 'px';            // v52: CSS = backing / dpr exactly so the display maps 1:1 (sharper on fractional pixel ratios)
  canvas.style.height = (ch / dpr) + 'px';
  scale = fit;                                       // CSS px per logical unit, for input mapping
  offX = 0; offY = 0;
  ctx.setTransform(cw / LOGW, 0, 0, ch / LOGH, 0, 0);// logical -> device px (fills the backing at device resolution)
  ctx.imageSmoothingEnabled = false;
}

/* ---- drawing helpers ---- */
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function hexA(hex, a){   // v24: hex colour -> rgba() string at alpha (for the JUICE layer)
  var v = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((v>>16)&255) + ',' + ((v>>8)&255) + ',' + (v&255) + ',' + Math.max(0, Math.min(1, a)).toFixed(3) + ')';
}
function shade(hex, amt){ // amt: + lighten toward white, - darken toward black
  var c = hex.charAt(0)==='#' ? hex.slice(1) : hex;
  var r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  if (amt>=0){ r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; } else { var k=1+amt; r*=k; g*=k; b*=k; }
  return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
}
function panel(x,y,w,h,accent,rad){
  rad = rad==null?10:rad;
  var g = ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#18202f'); g.addColorStop(1,'#0e1420');
  ctx.fillStyle = g; rrect(x,y,w,h,rad); ctx.fill();
  ctx.save(); ctx.shadowColor = accent; ctx.shadowBlur = 3;
  ctx.strokeStyle = accent; ctx.lineWidth = 1.5; rrect(x+0.9,y+0.9,w-1.8,h-1.8,rad); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1; rrect(x+2.4,y+2.4,w-4.8,h-4.8,rad-2); ctx.stroke();
  var sg = ctx.createLinearGradient(x, y, x, y+10);   // v20: glass top edge
  sg.addColorStop(0,'rgba(255,255,255,0.10)'); sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = sg; rrect(x+2, y+2, w-4, 9, rad-2); ctx.fill();
}
function cellRect(gx, gy){ var c = L.cell; return { x: L.field.x + gx*c, y: L.field.y + gy*c, s: c }; }
function drawBlock(px, py, s, color){
  // crisp three-layer bevel, mimicking the reference tile: a dark outer rim, a
  // middle layer (bright top sheen, shadowed sides), a bright inner frame (sheen
  // on top and both sides), and a FLAT centre with no gradient. Integer-aligned.
  // (v21: the v20 gloss sprite experiment reverted to this per the Director.)
  px = Math.round(px); py = Math.round(py); s = Math.round(s);
  var a0 = Math.max(1, Math.round(s*0.06));   // outer rim thickness (thin)
  var a1 = Math.max(2, Math.round(s*0.12));   // to inner edge of middle layer
  var a2 = Math.max(3, Math.round(s*0.175));  // to inner edge of inner layer
  // layer 0: darkest outer rim (also the seam between neighbours)
  ctx.fillStyle = shade(color, -0.58);
  ctx.fillRect(px, py, s, s);
  // layer 1 (middle): base is the shadowed side tone, then a bright top band = sheen
  ctx.fillStyle = shade(color, -0.24);
  ctx.fillRect(px+a0, py+a0, s-2*a0, s-2*a0);
  ctx.fillStyle = shade(color, 0.30);
  ctx.fillRect(px+a0, py+a0, s-2*a0, a1-a0);
  // layer 2 (inner): bright frame on top + left + right, a darker unlit bottom
  ctx.fillStyle = shade(color, 0.55);
  ctx.fillRect(px+a1, py+a1, s-2*a1, s-2*a1);
  ctx.fillStyle = shade(color, -0.02);
  ctx.fillRect(px+a1, py+(s-a2), s-2*a1, a2-a1);
  // centre: flat base colour, no gradient (this is what reads as crisp)
  ctx.fillStyle = color;
  ctx.fillRect(px+a2, py+a2, s-2*a2, s-2*a2);
}

function drawField(){
  var f = L.field;
  // recessed well behind the board
  ctx.fillStyle = '#0a0e17'; rrect(f.x-4, f.y-4, f.w+8, f.h+8, 10); ctx.fill();
  var bg = ctx.createLinearGradient(f.x, f.y, f.x, f.y+f.h);   // v21: richer well gradient (concept)
  bg.addColorStop(0,'#101830'); bg.addColorStop(0.55,'#0b1122'); bg.addColorStop(1,'#070a14');
  ctx.fillStyle = bg; ctx.fillRect(f.x, f.y, f.w, f.h);
  // v21 LIVING GRID (ported from NEON SWARM's reactive backdrop): each grid line
  // carries a slow ambient wave, brightens near the active piece, ripples outward
  // from cleared rows, and surges up from the floor when garbage lands.
  var ap = STATE.active, pcx = ap ? ap.x + ap.m.length/2 : FIELD_W/2, pcy = ap ? ap.y + ap.m.length/2 : 4;
  // v26 GRAVITY WELL (Geometry Wars treatment, Director): the piece is a MASS.
  // Grid points are pulled toward it with a smooth falloff, so the lines visibly
  // bow around the piece as it moves; locks, hard drops, and garbage deepen the
  // well for a beat (FX.wellT). FX.gx/gy are render-side smoothing, never logic.
  var wSpd = Math.abs(pcx - FX.gx) + Math.abs(pcy - FX.gy);
  FX.gx += (pcx - FX.gx) * 0.16; FX.gy += (pcy - FX.gy) * 0.16;
  var gAmp = Math.min(0.45, 0.16 + wSpd * 0.35 + FX.wellT * 0.30);   // cells of pull at the well centre
  function grav(px2, py2){
    var dx2 = FX.gx - px2, dy2 = FX.gy - py2, d2 = dx2*dx2 + dy2*dy2;
    var pull = gAmp * Math.exp(-d2 / 13);
    var dl = Math.sqrt(d2) + 0.6;
    var wob = 0.05 * Math.sin(FX.t*1.6 + px2*0.8 + py2*0.4);   // faint resting warble on top
    return [dx2/dl*pull + wob, dy2/dl*pull + wob*0.7];
  }
  var rip = FX.ripT, ripR = (1 - rip) * 14;   // the ripple ring expands as it fades
  ctx.save(); ctx.beginPath(); ctx.rect(f.x, f.y, f.w, f.h); ctx.clip();   // bowed lines stay inside the well
  ctx.lineWidth = 1;
  for (var gx=1; gx<FIELD_W; gx++){
    var alx = 0.055 + 0.030*Math.sin(FX.t*1.1 + gx*0.55)
            + 0.110*Math.exp(-((gx - pcx)*(gx - pcx))/5)
            + 0.080*rip;
    ctx.strokeStyle = 'rgba(96,150,220,' + Math.min(0.30, Math.max(0.02, alx)).toFixed(3) + ')';
    ctx.beginPath();
    for (var sy=0; sy<=FIELD_H; sy++){
      var dv = grav(gx, sy);
      var wxp = f.x + (gx + dv[0])*L.cell + 0.5, wyp = f.y + Math.min(sy*L.cell, f.h) + dv[1]*L.cell;
      if (sy===0) ctx.moveTo(wxp, wyp); else ctx.lineTo(wxp, wyp);
    }
    ctx.stroke();
  }
  for (var gy=1; gy<FIELD_H; gy++){
    var aly = 0.055 + 0.030*Math.sin(FX.t*0.9 + gy*0.45)
            + 0.090*Math.exp(-((gy - pcy)*(gy - pcy))/7)
            + (rip > 0 ? 0.300*rip*Math.exp(-Math.pow(Math.abs(gy - FX.ripY) - ripR, 2)*0.35) : 0)
            + (FX.surgeT > 0 ? 0.140*FX.surgeT*Math.exp(-(FIELD_H - 1 - gy)*0.35) : 0);
    ctx.strokeStyle = 'rgba(96,150,220,' + Math.min(0.32, Math.max(0.02, aly)).toFixed(3) + ')';
    ctx.beginPath();
    for (var sx2=0; sx2<=FIELD_W; sx2++){
      var dh = grav(sx2, gy);
      var wxq = f.x + Math.min(sx2*L.cell, f.w) + dh[0]*L.cell, wyq = f.y + gy*L.cell + 0.5 + dh[1]*L.cell;
      if (sx2===0) ctx.moveTo(wxq, wyq); else ctx.lineTo(wxq, wyq);
    }
    ctx.stroke();
  }
  ctx.restore();   // end grid clip
  // locked cells (or the cosmetic cell-travel animation while one plays, v44)
  if (FX.anim){ drawFieldAnim(); }
  else for (var y=0; y<FIELD_H; y++){ for (var x=0; x<FIELD_W; x++){
    var v = STATE.field[y][x];
    if (v){ var rc = cellRect(x,y); drawBlock(rc.x, rc.y, rc.s, COLORS[v]); if (STATE.spec[y] && STATE.spec[y][x]) drawSpecialGlyph(rc.x, rc.y, rc.s, STATE.spec[y][x]); }
  }}
  // ghost + active
  var a = STATE.active;
  if (a && STATE.mode === 'play'){
    var gy2 = a.y; while (!collides(a.m, a.x, gy2+1)) gy2++;
    for (var r=0; r<a.m.length; r++){ for (var c=0; c<a.m.length; c++){
      if (!a.m[r][c]) continue;
      var fxg = a.x+c, fyg = gy2+r;
      if (fyg>=0){ var rcg = cellRect(fxg,fyg);   // v26: the shadow mimics the block's SQUARE bevel silhouette (the rounded pill read wrong)
        ctx.globalAlpha = 0.10; ctx.fillStyle = COLORS[a.color]; ctx.fillRect(rcg.x+1, rcg.y+1, rcg.s-2, rcg.s-2);
        ctx.globalAlpha = 0.62; ctx.strokeStyle = shade(COLORS[a.color], 0.25); ctx.lineWidth = 1.5;
        ctx.strokeRect(rcg.x+1.5, rcg.y+1.5, rcg.s-3, rcg.s-3);
        ctx.globalAlpha = 0.28; ctx.strokeStyle = shade(COLORS[a.color], 0.55); ctx.lineWidth = 1;
        ctx.strokeRect(rcg.x+4.5, rcg.y+4.5, rcg.s-9, rcg.s-9);
        ctx.globalAlpha = 1; }
    }}
    for (var r2=0; r2<a.m.length; r2++){ for (var c2=0; c2<a.m.length; c2++){
      if (!a.m[r2][c2]) continue;
      var fx2=a.x+c2, fy2=a.y+r2;
      if (fy2>=0){ var rc2 = cellRect(fx2,fy2); drawBlock(rc2.x, rc2.y, rc2.s, COLORS[a.color]); }
    }}
  }
  // warm frame edge (your side): rounded, glowing
  ctx.save(); ctx.shadowColor = EMBER; ctx.shadowBlur = 2;
  ctx.strokeStyle = shade('#4a5a78',-0.05); ctx.lineWidth = 2; rrect(f.x-1.5, f.y-1.5, f.w+3, f.h+3, 9); ctx.stroke();   // v32: the frame joins the HUD grey family (the blaze still colours it on clears)
  ctx.restore();
}

function placeholderBox(x, y, w, h, label, sub, accent){
  ctx.fillStyle = PANEL; rrect(x, y, w, h, 6); ctx.fill();

function drawMini(box, type, topPad){
  if (!type) return;
  topPad = topPad || 0;
  var m = SHAPES[type].m, col = COLORS[SHAPES[type].c];
  var minx=99,maxx=-1,miny=99,maxy=-1;
  for (var r=0;r<m.length;r++) for (var c=0;c<m.length;c++) if (m[r][c]){ if(c<minx)minx=c; if(c>maxx)maxx=c; if(r<miny)miny=r; if(r>maxy)maxy=r; }
  var pw = (maxx-minx+1), ph = (maxy-miny+1);
  var avW = box.w - 12, avH = box.h - topPad - 4;
  var cs = Math.floor(Math.min(avW/4, avH/2, 16)); if (cs < 3) cs = 3;   // v30: ONE scale for all pieces, sized for the 4x2 worst case (per-piece bbox made the I render oversized)
  var ox = Math.round(box.x + (box.w - pw*cs)/2);
  var oy = Math.round(box.y + topPad + (avH - ph*cs)/2);
  for (var r2=0;r2<m.length;r2++) for (var c2=0;c2<m.length;c2++) if (m[r2][c2]){ drawBlock(ox + (c2-minx)*cs, oy + (r2-miny)*cs, cs, col); }
}

function drawRail(){

  railLabel('NEXT', nb.x+10, nb.y+8, '#8fa2bd');
  var nx = peekNext(3);
  if (HAS_OPPONENT || !WIDE){                           // v51/v53: versus (either fold) and folded solo lay NEXT out horizontally
    var slotW = (nb.w - 12) / 3;
    for (var i=0;i<nx.length;i++){ drawMini({ x: nb.x + 6 + i*slotW, y: nb.y + 20, w: slotW, h: nb.h - 26 }, nx[i], 0); }
  } else {                                              // SOLO: unchanged vertical stack
    var slotH = (nb.h - 24) / 3;

  for (var cxi=0; cxi<=gcols; cxi++){ ctx.beginPath(); ctx.moveTo(gx0+cxi*gcs+0.5, gy0); ctx.lineTo(gx0+cxi*gcs+0.5, gy0+grows*gcs); ctx.stroke(); }
  for (var cyi=0; cyi<=grows; cyi++){ ctx.beginPath(); ctx.moveTo(gx0, gy0+cyi*gcs+0.5); ctx.lineTo(gx0+gcols*gcs, gy0+cyi*gcs+0.5); ctx.stroke(); }
  var midY = gy0 + grows*gcs/2, ocx = ob.x + ob.w/2;

  ctx.fillStyle = shade(STEEL,-0.78); rrect(pX,pY,pW,pH,8); ctx.fill();

  ctx.fillStyle = STEEL; ctx.font='800 9px ui-monospace, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(NET.status==='hosting'?'HOST':(NET.status==='joining'?'WAIT':'SOLO'), ocx, pY+pH/2+0.5);
  ctx.fillStyle = MUTE; ctx.font='9px "Segoe UI", Arial, sans-serif'; ctx.textBaseline='middle'; ctx.fillText(NET.status==='hosting'?('code '+NET.code):(NET.status==='joining'?'linking':'idle'), ocx, midY+7);

function drawSpecialIcon(letter, cx, cy, r, col){   // v43: redesigned HUD iconography, bolder and on-point (from the powerup lab)
  ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.lineWidth=Math.max(1.6, r*0.2);
  if (letter==='A'){
    ctx.fillRect(cx-r*0.7, cy+r*0.42, r*1.4, r*0.26);
    ctx.lineWidth=r*0.26;
    ctx.beginPath(); ctx.moveTo(cx-r*0.5, cy+r*0.02); ctx.lineTo(cx, cy-r*0.52); ctx.lineTo(cx+r*0.5, cy+r*0.02); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy-r*0.42); ctx.lineTo(cx, cy+r*0.26); ctx.stroke();
  } else if (letter==='C'){
    ctx.fillRect(cx-r*0.7, cy-r*0.68, r*1.4, r*0.26);
    ctx.lineWidth=r*0.26;
    ctx.beginPath(); ctx.moveTo(cx-r*0.5, cy-r*0.02); ctx.lineTo(cx, cy+r*0.52); ctx.lineTo(cx+r*0.5, cy-r*0.02); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy-r*0.26); ctx.lineTo(cx, cy+r*0.42); ctx.stroke();
  } else if (letter==='N'){
    ctx.beginPath();
    for (var k=0;k<24;k++){ var a=Math.PI*k/12 - Math.PI/2, rr=(k%2===0)?r*0.98:r*0.42, x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; if(k===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(cx,cy,r*0.2,0,Math.PI*2); ctx.fill();
  } else if (letter==='R'){
    var g=r*0.6, ox=cx-g*1.05, oy=cy-g*1.05, pat=[[1,0,1],[0,1,1],[1,1,0]];
    for (var ry=0;ry<3;ry++) for (var rx=0;rx<3;rx++){ var X=ox+rx*g, Y=oy+ry*g; if(pat[ry][rx]) ctx.fillRect(X,Y,g*0.8,g*0.8); else { ctx.globalAlpha=0.4; ctx.strokeRect(X+1,Y+1,g*0.8-2,g*0.8-2); ctx.globalAlpha=1; } }
  } else if (letter==='S'){
    ctx.lineWidth=r*0.19;
    ctx.beginPath(); ctx.arc(cx,cy,r*0.6,Math.PI*1.15,Math.PI*1.9); ctx.stroke();
    var e1a=Math.PI*1.9, e1x=cx+Math.cos(e1a)*r*0.6, e1y=cy+Math.sin(e1a)*r*0.6;
    ctx.beginPath(); ctx.moveTo(e1x-r*0.24,e1y-r*0.06); ctx.lineTo(e1x,e1y); ctx.lineTo(e1x+r*0.02,e1y-r*0.28); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,r*0.6,Math.PI*0.15,Math.PI*0.9); ctx.stroke();
    var e2a=Math.PI*0.9, e2x=cx+Math.cos(e2a)*r*0.6, e2y=cy+Math.sin(e2a)*r*0.6;
    ctx.beginPath(); ctx.moveTo(e2x+r*0.24,e2y+r*0.06); ctx.lineTo(e2x,e2y); ctx.lineTo(e2x-r*0.02,e2y+r*0.28); ctx.stroke();
  } else if (letter==='B'){
    ctx.lineWidth=r*0.16;
    ctx.beginPath(); ctx.moveTo(cx,cy-r*0.66); ctx.lineTo(cx+r*0.66,cy); ctx.lineTo(cx,cy+r*0.66); ctx.lineTo(cx-r*0.66,cy); ctx.closePath(); ctx.stroke();
    ctx.lineWidth=r*0.22; ctx.beginPath(); ctx.moveTo(cx-r*0.78,cy+r*0.78); ctx.lineTo(cx+r*0.78,cy-r*0.78); ctx.stroke();
  } else if (letter==='G'){
    var bs=r*0.4;
    ctx.fillRect(cx-bs*1.15, cy-r*0.72, bs*0.9, bs*0.9); ctx.fillRect(cx+bs*0.25, cy-r*0.72, bs*0.9, bs*0.9);
    ctx.lineWidth=r*0.2;
    ctx.beginPath(); ctx.moveTo(cx, cy-r*0.16); ctx.lineTo(cx, cy+r*0.38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-r*0.28, cy+r*0.08); ctx.lineTo(cx, cy+r*0.44); ctx.lineTo(cx+r*0.28, cy+r*0.08); ctx.stroke();
    ctx.lineWidth=r*0.15; ctx.beginPath(); ctx.moveTo(cx-r*0.6, cy+r*0.72); ctx.lineTo(cx+r*0.6, cy+r*0.72); ctx.stroke();
  } else if (letter==='Q'){
    ctx.lineWidth=r*0.22; ctx.beginPath();
    ctx.moveTo(cx-r*0.78, cy); ctx.lineTo(cx-r*0.34, cy-r*0.5); ctx.lineTo(cx-r*0.02, cy+r*0.52); ctx.lineTo(cx+r*0.32, cy-r*0.5); ctx.lineTo(cx+r*0.78, cy); ctx.stroke();
  } else if (letter==='O'){
    ctx.beginPath(); ctx.arc(cx, cy+r*0.16, r*0.56, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth=r*0.14; ctx.beginPath(); ctx.moveTo(cx+r*0.32, cy-r*0.34); ctx.quadraticCurveTo(cx+r*0.62, cy-r*0.62, cx+r*0.44, cy-r*0.82); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(cx+r*0.46, cy-r*0.88, r*0.13, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.font='800 '+(r*1.2).toFixed(0)+'px ui-monospace, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(letter, cx, cy+0.5);
  }
  ctx.restore();
}

  ctx.save(); ctx.shadowColor = acc; ctx.shadowBlur = Math.max(4, s*0.35);
  ctx.strokeStyle = acc; ctx.lineWidth = Math.max(1.5, s*0.12); rrect(px+1.5, py+1.5, s-3, s-3, Math.max(2, s*0.16)); ctx.stroke();

function spQueueMax(){ return Math.max(1, Math.floor((L.spQueue.w - QLAB_W + SP_CHIP_G) / (SP_CHIP_W + SP_CHIP_G))); }

  var i = Math.floor((px - (L.spQueue.x + QLAB_W)) / (SP_CHIP_W + SP_CHIP_G));
  return (i >= 0 && i < shown) ? i : -1;   // index into UPCOMING; caller uses inv[i+1]

function drawSpecials(){                                   // v31: the icon IS the use button; the queue is a count
  var s = L.specials;
  if (s && s.h > 0) panel(s.x, s.y, s.w, s.h, '#34425c');  // portrait keeps its slim strip panel
  var b = L.spPrimary, q = STATE.inv, front = q.length ? q[0] : null;
  if (!b || !b.w) return;
  var acc = front ? (SPECIAL_COLORS[front] || EMBER) : LINE2;
  var g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  g.addColorStop(0, '#182236'); g.addColorStop(1, '#0b1019');
  ctx.fillStyle = g; rrect(b.x, b.y, b.w, b.h, 10); ctx.fill();
  if (front){
    var name = (SPECIAL_INFO[front] || [front])[0].toUpperCase();   // v32 (Director): the word description rides the button
    ctx.save(); ctx.shadowColor = EMBER; ctx.shadowBlur = 6; ctx.strokeStyle = EMBER; ctx.lineWidth = 2; rrect(b.x+1, b.y+1, b.w-2, b.h-2, 10); ctx.stroke(); ctx.restore();
    if (b.h >= 60){                                                 // the tall (wide-layout) form
      drawSpecialIcon(front, b.x + b.w/2, b.y + 26, 15, acc);
      ctx.fillStyle = acc; ctx.font = '800 8px "Segoe UI", Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(name, b.x + b.w/2, b.y + 52);
      ctx.fillStyle = TEXT; ctx.font = '800 10px "Segoe UI", Arial, sans-serif';
      ctx.fillText('USE', b.x + b.w/2, b.y + b.h - 8);
    } else {                                                        // the strip (portrait) form
      drawSpecialIcon(front, b.x + 22, b.y + b.h/2, 12, acc);
      ctx.fillStyle = acc; ctx.font = '800 8px "Segoe UI", Arial, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(name, b.x + 42, b.y + b.h/2 - 3);
      ctx.fillStyle = TEXT; ctx.font = '800 9px "Segoe UI", Arial, sans-serif';
      ctx.fillText('USE', b.x + 42, b.y + b.h/2 + 11);
    }
    if (q.length > 1){
      var bw2 = 24, bh2 = 15;
      ctx.fillStyle = shade(acc, -0.45); rrect(b.x + b.w - bw2 - 3, b.y + 3, bw2, bh2, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '800 9px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+' + (q.length - 1), b.x + b.w - bw2/2 - 3, b.y + 3 + bh2/2 + 0.5);
    }
  } else {
    ctx.setLineDash([4,3]); ctx.strokeStyle = LINE2; ctx.lineWidth = 1.4; rrect(b.x+1, b.y+1, b.w-2, b.h-2, 10); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = MUTE; ctx.font = '800 10px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('NO SPECIAL', b.x + b.w/2, b.y + b.h/2 + 0.5);
  }
}

function drawHud(){

  var w1 = ctx.measureText('GRID ').width;

    ctx.save(); ctx.translate(x, ty); ctx.transform(1,0,-0.18,1,0,0);
    var g = ctx.createLinearGradient(0,-24,0,4);      // chrome: light top -> colour -> deep base
    g.addColorStop(0, shade(col, 0.78)); g.addColorStop(0.55, col); g.addColorStop(1, shade(col, -0.28));
    ctx.shadowColor = col; ctx.shadowBlur = 8; ctx.fillStyle = g;

    ctx.fillText(txt, 0, 0); ctx.fillText(txt, 0, 0); ctx.restore();

  if (!L.wide) ctx.fillText(String(STATE.lines), L.menu.x - 6, 42);
}

/* movement pad (v21 spec, v22 geometry): one rectangle split in the middle for
   LEFT | RIGHT (sharing its row with ROT L / ROT R), a full-width DOWN rectangle
   below (sharing its row with HARD DROP). No UP. Held, no dead spots. */
function drawDpad(){
  var d = L.dpad, x=d.x, y=d.y, w=d.w, hh=d.h, act = STATE.heldDir;
  var topH = Math.round(hh*0.50), gap = 8, botY = y + topH + gap, botH = hh - topH - gap;
  function slab(sx, sy, sw, sh){
    var g = ctx.createLinearGradient(sx,sy,sx,sy+sh);
    g.addColorStop(0,'#141b28'); g.addColorStop(1,'#0b1019');
    ctx.fillStyle = g; rrect(sx,sy,sw,sh,12); ctx.fill();
    ctx.save(); ctx.shadowColor = STEEL; ctx.shadowBlur = 3; ctx.strokeStyle = shade(STEEL,-0.3); ctx.lineWidth = 1.5; rrect(sx+0.9,sy+0.9,sw-1.8,sh-1.8,12); ctx.stroke(); ctx.restore();
    var sg = ctx.createLinearGradient(sx,sy,sx,sy+9);
    sg.addColorStop(0,'rgba(255,255,255,0.09)'); sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = sg; rrect(sx+2,sy+2,sw-4,8,10); ctx.fill();
  }
  slab(x, y, w, topH);          // LEFT | RIGHT surface
  slab(x, botY, w, botH);       // DOWN surface
  // centre seam splitting the top slab
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + w/2 + 0.5, y + 8); ctx.lineTo(x + w/2 + 0.5, y + topH - 8); ctx.stroke();
  // pressed highlight: the live half, or the whole DOWN slab
  ctx.fillStyle = 'rgba(55,205,250,0.16)';
  if (act === 'left')  { rrect(x+2, y+2, w/2 - 3, topH-4, 10); ctx.fill(); }
  if (act === 'right') { rrect(x + w/2 + 1, y+2, w/2 - 3, topH-4, 10); ctx.fill(); }
  if (act === 'down')  { rrect(x+2, botY+2, w-4, botH-4, 10); ctx.fill(); }
  // solid triangle arrows
  function tri(dir, axc, ayc, t, on){
    ctx.fillStyle = on ? TEXT : '#c3cddc'; ctx.beginPath();
    if (dir==='left'){  ctx.moveTo(axc - t, ayc); ctx.lineTo(axc + t*0.8, ayc - t*1.1); ctx.lineTo(axc + t*0.8, ayc + t*1.1); }
    if (dir==='right'){ ctx.moveTo(axc + t, ayc); ctx.lineTo(axc - t*0.8, ayc - t*1.1); ctx.lineTo(axc - t*0.8, ayc + t*1.1); }
    if (dir==='down'){  ctx.moveTo(axc, ayc + t); ctx.lineTo(axc - t*1.1, ayc - t*0.8); ctx.lineTo(axc + t*1.1, ayc - t*0.8); }
    ctx.closePath(); ctx.fill();
  }
  var tcy = y + topH/2, tsz = 11;
  tri('left',  x + w*0.25, tcy, tsz, act==='left');
  tri('right', x + w*0.75, tcy, tsz, act==='right');
  tri('down',  x + w/2, botY + botH/2, tsz, act==='down');
}

function drawRotateSq(r, dir, label){
  // v22: obvious rotation icon: a small block circled by a thick arc with a big
  // tangent arrowhead showing the spin direction
  var g = ctx.createLinearGradient(r.x,r.y,r.x,r.y+r.s);
  g.addColorStop(0,'#12233a'); g.addColorStop(0.6,'#0e1a2c'); g.addColorStop(1,'#0a1220');
  ctx.fillStyle = g; rrect(r.x, r.y, r.s, r.s, 14); ctx.fill();
  ctx.save(); ctx.shadowColor = STEEL; ctx.shadowBlur = 5; ctx.strokeStyle = STEEL; ctx.lineWidth = 2; rrect(r.x+1, r.y+1, r.s-2, r.s-2, 14); ctx.stroke(); ctx.restore();
  var gs = ctx.createLinearGradient(r.x,r.y,r.x,r.y+9);
  gs.addColorStop(0,'rgba(255,255,255,0.12)'); gs.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = gs; rrect(r.x+2, r.y+2, r.s-4, 8, 12); ctx.fill();
  var cx=r.x+r.s/2, cy=r.y+r.s/2 - 4, rad=r.s*0.28;
  // the block being rotated
  ctx.fillStyle = '#2c4a6b'; rrect(cx-6, cy-6, 12, 12, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; rrect(cx-6, cy-6, 12, 5, 3); ctx.fill();
  // thick lit arc
  var a0 = (dir>0) ? Math.PI*0.35 : Math.PI*0.65;
  var a1 = (dir>0) ? Math.PI*1.85 : Math.PI*-0.85;
  ctx.save(); ctx.shadowColor = STEEL; ctx.shadowBlur = 3;
  ctx.strokeStyle = '#8fdcff'; ctx.lineWidth = 5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx, cy, rad, a0, a1, dir<0); ctx.stroke(); ctx.restore();
  // big tangent arrowhead at the arc's end
  var px0 = cx + rad*Math.cos(a1), py0 = cy + rad*Math.sin(a1);
  var tx = Math.cos(a1 + dir*Math.PI/2), ty = Math.sin(a1 + dir*Math.PI/2);
  var nx0 = Math.cos(a1), ny0 = Math.sin(a1);
  ctx.beginPath();
  ctx.moveTo(px0 + tx*11, py0 + ty*11);
  ctx.lineTo(px0 + nx0*6.5 - tx*2, py0 + ny0*6.5 - ty*2);
  ctx.lineTo(px0 - nx0*6.5 - tx*2, py0 - ny0*6.5 - ty*2);
  ctx.closePath(); ctx.fillStyle='#8fdcff'; ctx.fill();
  ctx.fillStyle = '#9fb0c8'; ctx.font='800 9px "Segoe UI", Arial, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(label, cx, r.y + r.s - 4);
}

/* ---- netcode transport (browser): PeerJS data channel + connect UI ---- */
function netMakeCode(){ var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s=''; for (var i=0;i<4;i++){ s += A[(Math.random()*A.length)|0]; } return s; }
function netHost(){
  if (typeof Peer === 'undefined'){ NET.status='unavailable'; return; }
  if (NET.peer){ try { NET.peer.destroy(); } catch(e){} }
  NET.role='host'; NET.code=netMakeCode(); NET.status='hosting';
  try {
    NET.peer = new Peer('gg-'+NET.code);
    NET.peer.on('connection', function(c){ netBind(c); });
    NET.peer.on('error', function(){ NET.status='error'; });
  } catch(e){ NET.status='error'; }
}
function netJoin(code){
  if (typeof Peer === 'undefined'){ NET.status='unavailable'; return; }
  code = (code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  if (code.length < 4){ NET.status='offline'; return; }
  if (NET.peer){ try { NET.peer.destroy(); } catch(e){} }
  NET.role='guest'; NET.code=code; NET.status='joining';
  try {
    NET.peer = new Peer();
    NET.peer.on('open', function(){ netBind(NET.peer.connect('gg-'+code, { reliable:true })); });
    NET.peer.on('error', function(){ NET.status='error'; });
  } catch(e){ NET.status='error'; }
}
function netBind(conn){
  NET.conn = conn;
  NET.sendRaw = function(o){ try { if (conn && conn.open) conn.send(o); } catch(e){} };
  conn.on('open', function(){
    NET.status='connected'; HAS_OPPONENT = true; computeLayout();   // v31: RIVAL panel appears
    netSend({ t:'hello', build:BUILD });
    if (NET.role === 'host'){ var seed=(Math.random()*1e9)|0; netSend({ t:'start', seed:seed }); resetGame(seed); }
  });
  conn.on('data', function(d){ try { netDispatch(d); } catch(e){} });
  conn.on('close', function(){ NET.status='offline'; HAS_OPPONENT=false; NET.conn=null; NET.sendRaw=null; });
  conn.on('error', function(){ NET.status='error'; });
}
function netLoopback(){                         // wire self-test: one device, echoed transport, no PeerJS
  if (NET.peer){ try { NET.peer.destroy(); } catch(e){} NET.peer = null; }
  NET.role = 'host'; NET.code = 'LOOP'; NET.status = 'loopback'; NET.conn = { open:true };
  NET.sendRaw = function(o){ setTimeout(function(){ try { netDispatch(o); } catch(e){} }, 30); };   // deferred to mimic the wire and avoid re-entrancy
  HAS_OPPONENT = true; computeLayout();   // v31: RIVAL panel appears
  resetGame((Math.random()*1e9)|0);
}
function promptCode(){ try { return window.prompt('Enter room code (4 characters):') || ''; } catch(e){ return ''; } }
function netTitleStatus(){
  switch(NET.status){
    case 'hosting':     return { txt:'HOSTING - CODE ' + NET.code + ' - share it', col:HEAL };
    case 'joining':     return { txt:'CONNECTING...', col:STEEL };
    case 'connected':   return { txt:'CONNECTED - starting match', col:HEAL };
    case 'loopback':    return { txt:'LOOPBACK - wire self-test: your attacks return to you', col:STEEL };
    case 'unavailable': return { txt:'online play unavailable - solo only', col:MUTE };
    case 'error':       return { txt:'connection failed - tap HOST or JOIN to retry', col:DANGER };
    default: return null;
  }
}

/* v24 JUICE layer: everything here is read-only over FX, clipped to the field */
function drawSpecialFx(){                                   // v36: one distinct effect per powerup
  var s = FX.special; if (!s) return;

  var cx = f.x + f.w/2, cy = f.y + f.h/2;

    case 'G': { ctx.fillStyle = hexA(col, 0.10*t); ctx.fillRect(f.x, f.y, f.w, f.h); break; }   // v44: faint tint; the falling cells carry it
    case 'Q': { ctx.fillStyle = hexA(col, 0.10*t); ctx.fillRect(f.x, f.y, f.w, f.h); break; }   // v44: faint tint; the sliding cells carry it

function drawFx(){
  // v25: the JUICE layer is SACRIFICIAL: any error here is recorded and swallowed,
  // and the canvas state ALWAYS restored, so decoration can never take down the
  // HUD or leak the field clip (the v24 hard-drop crash did exactly that).
  var f = L.field, cs = L.cell;
  if (!FX.clears.length && !FX.parts.length && !FX.lock && !FX.trail && FX.gflash <= 0 && FX.spPulse <= 0 && FX.frameT <= 0 && !FX.pop && !FX.special) return;

  ctx.beginPath(); ctx.rect(f.x-6, f.y-6, f.w+12, f.h+12); ctx.clip();

    for (var i0=0; i0<tr.segs.length; i0++){ var sg = tr.segs[i0];
      var ty0 = f.y + sg[1]*cs, ty1 = f.y + (sg[2]+1)*cs;
      var tg = ctx.createLinearGradient(0, ty0, 0, ty1);  // v25: much hotter (0.35 peak was invisible on device)
      tg.addColorStop(0, hexA(shade(tr.col, 0.5), 0.10*tr.t));
      tg.addColorStop(1, hexA(shade(tr.col, 0.5), 0.60*tr.t));
      ctx.fillStyle = tg; ctx.fillRect(f.x + sg[0]*cs + 2, ty0, cs - 4, ty1 - ty0);
      var tc = ctx.createLinearGradient(0, ty0, 0, ty1);  // and a white-hot core down the middle
      tc.addColorStop(0, 'rgba(255,255,255,0)');
      tc.addColorStop(1, 'rgba(255,255,255,' + (0.55*tr.t).toFixed(3) + ')');
      ctx.fillStyle = tc; ctx.fillRect(f.x + sg[0]*cs + Math.round(cs*0.33), ty0, Math.round(cs*0.34), ty1 - ty0);
    } }
  if (FX.gflash > 0 && FX.gn > 0){                        // garbage arrival: ember tint on the inserted rows
    ctx.fillStyle = hexA(EMBER, 0.22*FX.gflash);
    ctx.fillRect(f.x, f.y + (FIELD_H - FX.gn)*cs, f.w, FX.gn*cs);
  }
  if (FX.lock){                                           // lock pulse: a white thump on the landed cells
    ctx.fillStyle = 'rgba(255,255,255,' + (0.45*FX.lock.t).toFixed(3) + ')';
    for (var i1=0; i1<FX.lock.cells.length; i1++){ var lc = FX.lock.cells[i1];
      ctx.fillRect(f.x + lc[0]*cs, f.y + lc[1]*cs, cs, cs); }
  }
  for (var i2=0; i2<FX.clears.length; i2++){ var cl = FX.clears[i2], ry = f.y + cl.y*cs;
    if (cl.cols){                                         // v25: the row's own blocks shrink away as it dies
      for (var cx2 = 0; cx2 < FIELD_W; cx2++){ var cv2 = cl.cols[cx2]; if (!cv2) continue;
        var bw = cs * Math.max(0, cl.t), ins = (cs - bw) / 2;
        ctx.fillStyle = hexA(COLORS[cv2] || TEXT, 0.85 * cl.t);
        ctx.fillRect(f.x + cx2*cs + ins, ry + ins, Math.max(1, bw), Math.max(1, bw));
      }
    }
    var pw3 = cl.pow || 1;                                // v31: the tier drives the heat
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.min(0.95, (0.45 + 0.14*pw3))*cl.t*cl.t).toFixed(3) + ')';
    ctx.fillRect(f.x, ry, f.w, cs);
    var swx = f.x + (1 - cl.t) * (f.w + 60) - 30;         // the sweep races wall to wall
    var sg2 = ctx.createLinearGradient(swx - 46, 0, swx + 8, 0);
    sg2.addColorStop(0, 'rgba(255,255,255,0)'); sg2.addColorStop(1, 'rgba(255,255,255,' + (0.9*cl.t).toFixed(3) + ')');
    ctx.fillStyle = sg2; ctx.fillRect(swx - 46, ry - 3, 54, cs + 6);
    if (pw3 >= 3){                                        // v31: triple and up race a SECOND sweep the other way
      var swb = f.x + f.w - (1 - cl.t) * (f.w + 60) + 30;
      var sg3 = ctx.createLinearGradient(swb + 46, 0, swb - 8, 0);
      sg3.addColorStop(0, 'rgba(255,255,255,0)'); sg3.addColorStop(1, 'rgba(255,255,255,' + (0.9*cl.t).toFixed(3) + ')');
      ctx.fillStyle = sg3; ctx.fillRect(swb - 8, ry - 3, 54, cs + 6);
    }
  }
  if (FX.quadT > 0){                                     // v31: QUADRUPLE washes the whole field in slow-cycling colour
    var qh = Math.round((FX.t * 140) % 360);
    ctx.fillStyle = 'hsla(' + qh + ',70%,88%,' + (0.16*FX.quadT).toFixed(3) + ')';
    ctx.fillRect(f.x, f.y, f.w, f.h);

  if (FX.frameT > 0){                                    // v25: the frame blazes white-hot then ember on a clear

    ctx.shadowColor = FX.spCol; ctx.shadowBlur = 10*FX.spPulse;
    ctx.strokeStyle = hexA(FX.spCol, 0.6*FX.spPulse); ctx.lineWidth = 3;
    rrect(f.x+1.5, f.y+1.5, f.w-3, f.h-3, 6); ctx.stroke(); ctx.shadowBlur = 0;
  }
  for (var i3=0; i3<FX.parts.length; i3++){               // shards: crisp squares, white-hot while young
    var P = FX.parts[i3], al = Math.max(0, P.t / P.life);
    ctx.fillStyle = hexA(al > 0.6 ? shade(P.col, 0.6) : P.col, 0.9*al);
    var psz = P.sz * Math.max(2, Math.round(cs*0.14));
    ctx.fillRect(Math.round(f.x + P.x*cs - psz/2), Math.round(f.y + P.y*cs - psz/2), psz, psz);
  }
  if (FX.pop){                                            // v31: callouts escalate by tier; QUADRUPLE cycles hue
    var pt = FX.pop.t, pn = FX.pop.n || 1;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font = '900 ' + Math.round((pn === 1 ? 14 : 8 + 7*pn) + (4 + 2*pn)*(1-pt)) + 'px Impact, "Arial Narrow", sans-serif';
    ctx.shadowColor = pn >= 4 ? ('hsl(' + Math.round((FX.t*220)%360) + ',85%,60%)') : HEAL;
    ctx.shadowBlur = 4 + 3*pn;
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, pt*1.6).toFixed(3) + ')';
    ctx.fillText(FX.pop.txt, f.x + f.w/2, f.y + f.h*0.38 - (1-pt)*(18 + 5*pn));
    ctx.shadowBlur = 0;
  }
  } catch(e){ lastError = e; }
  finally { ctx.restore(); }
}

/* ================= audio (v32) =================
   WebAudio voice engine + SFX + music, ported from the audio lab and wired to
   real game events. Inits on the first user gesture (browser requirement);
   with no AudioContext it degrades to silence. Actions-as-music: horizontal
   moves and rotations play melodic steps up a pentatonic ladder (the lab
   experiment the Director approved). Music: NEON HOLD on the title, DEEP
   CURRENT in play. Mute lives on the pause menu and the M key. */
var AC = null, masterG = null, musicG = null, sfxG = null, NBUF = null, AUDIO_READY = false;

  if (AUDIO_READY || !HAS_DOM) return;
  try {
    var Au = window.AudioContext || window.webkitAudioContext; if (!Au) return;
    AC = new Au();
    masterG = AC.createGain(); masterG.gain.value = SND.muted ? 0 : 0.9; masterG.connect(AC.destination);
    musicG = AC.createGain(); musicG.gain.value = 0.5; musicG.connect(masterG);
    sfxG = AC.createGain(); sfxG.gain.value = 0.9; sfxG.connect(masterG);
    AUDIO_READY = true;
    musicSync();

}
function audioResume(){ if (AC && AC.state === 'suspended'){ try { AC.resume(); } catch (e){} } }

function sfxRotate(){ if (SND.muted || !AUDIO_READY) return; var t = AC.currentTime, m = SCALE[(mStep + 2) % SCALE.length]; osc(sfxG, 'square', mtof(m), t, 0.002, 0.10, 0.07); osc(sfxG, 'square', mtof(m + 7), t + 0.015, 0.002, 0.08, 0.07); mStep++; }

function sfxLock(){ if (SND.muted || !AUDIO_READY) return; var t = AC.currentTime; osc(sfxG, 'sine', 190, t, 0.001, 0.24, 0.09, 95); noise(sfxG, t, 0.001, 0.11, 0.05, 'lowpass', 1600, 400); }
function sfxHard(){ if (SND.muted || !AUDIO_READY) return; var t = AC.currentTime; noise(sfxG, t, 0.001, 0.5, 0.12, 'lowpass', 1400, 200); osc(sfxG, 'sine', 150, t, 0.001, 0.22, 0.14, 60); }
function sfxHold(){ if (SND.muted || !AUDIO_READY) return; var t = AC.currentTime; osc(sfxG, 'triangle', mtof(72), t, 0.003, 0.13, 0.1, mtof(79)); }

}
function musicStart(tr){
  if (!AUDIO_READY || SND.muted || !tr || MUS.track === tr) return;
  musicStop(); MUS.track = tr; MUS.step = 0; MUS.nextT = AC.currentTime + 0.1;
  if (HAS_DOM && typeof setInterval === 'function') MUS.timer = setInterval(musicTick, 25);
}
function musicStop(){ if (MUS.timer){ clearInterval(MUS.timer); MUS.timer = null; } MUS.track = null; }
function trackByName(nm){   // v50
  if (!nm) return null;
  if (MUSIC_TRACKS.menu && MUSIC_TRACKS.menu.name === nm) return MUSIC_TRACKS.menu;
  for (var i = 0; i < MUSIC_PLAY_POOL.length; i++){ if (MUSIC_PLAY_POOL[i].name === nm) return MUSIC_PLAY_POOL[i]; }
  return null;
}
function musicSync(){
  if (!AUDIO_READY) return;
  if (SND.muted){ musicStop(); return; }
  var tr;
  if (STATE.mode === 'play'){
    if (pendingResumeTrack){ tr = pendingResumeTrack; pendingResumeTrack = null; }   // v50: continue the same track across a fold/unfold reload
    else tr = MUSIC_PLAY_POOL[Math.floor(Math.random() * MUSIC_PLAY_POOL.length)];   // v45: otherwise a random in-match track
  } else { tr = MUSIC_TRACKS.menu; }
  musicStart(tr);
}
function setMuted(v){ SND.muted = !!v; if (masterG) masterG.gain.value = SND.muted ? 0 : 0.9; musicSync(); }
function audioHidden(){ try { musicStop(); if (AC && AC.suspend) AC.suspend(); } catch(e){} }   // v49: page hidden -> stop the scheduler and suspend the context (no audio while away)
function audioVisible(){ try { if (AC && AC.resume) AC.resume(); if (AUDIO_READY && !SND.muted && STATE.mode === 'play') musicSync(); } catch(e){} }   // v49: back in view -> resume
function audioUnload(){ try { musicStop(); if (AC && AC.close) AC.close(); AUDIO_READY = false; } catch(e){} }   // v49: tab closing / navigating -> tear the context down so audio cannot keep playing
/* ================= end audio ================= */

/* ---- input ---- */
function toLogical(clientX, clientY){
  var rect = canvas.getBoundingClientRect();
  return { x: (clientX - rect.left) / scale, y: (clientY - rect.top) / scale };
}
function inRect(p, r){ return r && p.x >= r.x && p.x <= r.x + (r.w||r.s) && p.y >= r.y && p.y <= r.y + (r.h||r.s); }
function dpadMoveRegion(p){
  var d = L.dpad; if (!inRect(p, d)) return null;
  var fy = (p.y - d.y) / d.h;                 // v21 (Director): one rectangle split in the
  if (fy < 0.53){                             // middle for LEFT | RIGHT, and a full-width
    return ((p.x - d.x) / d.w < 0.5) ? 'left' : 'right';
  }
  return 'down';                              // DOWN rectangle below. No UP. (v22: rect w/h)
}

var dpadTouch = null;   // identifier of the touch currently driving the D-pad
function handleStart(id, p){
  audioInit(); audioResume();   // v32: first-gesture audio unlock
  if (STATE.mode === 'title'){
    if (menuScreen){
      if (menuScreen==='mode'){
        if (inRect(p, L._m1)){ endVsCpu(); menuScreen=null; resetGame(); }
        else if (inRect(p, L._m2)) menuScreen='diff';
        else if (inRect(p, L._mback)) menuScreen=null;
      } else {
        var lv=['PEASY','EASY','MED','HARD'], hit=false;
        for (var i=0;i<4;i++){ if (L._d && L._d[i] && inRect(p, L._d[i])){ startVsCpu(lv[i]); hit=true; break; } }
        if (!hit && inRect(p, L._mback)) menuScreen='mode';
      }
      return;
    }
    if (inRect(p, L._start)) menuScreen='mode';
    else if (inRect(p, L._host)) netHost();
    else if (inRect(p, L._join)) netJoin(promptCode());
    else if (inRect(p, L._loop)) netLoopback();
    else if (inRect(p, L._fs)) toggleFs();
    return;
  }
  if (STATE.mode === 'over'){
    if (inRect(p, L._again)){ if (VSCPU){ cpuInit(cpuLevel); resetGame(); } else if (HAS_OPPONENT && NET.role==='host'){ var sd=(Math.random()*1e9)|0; netSend({ t:'start', seed:sd }); resetGame(sd); } else resetGame(); }
    else if (inRect(p, L._fsOver)) toggleFs();
    return;
  }
  if (STATE.paused){                                      // v30: menu taps only while the overlay is up
    if (inRect(p, L.pmResume)) STATE.paused = false;
    else if (inRect(p, L.pmFull)) toggleFs();
    else if (inRect(p, L.pmSound)) setMuted(!SND.muted);
    else if ((!HAS_OPPONENT || VSCPU) && inRect(p, L.pmRestart)){ if (VSCPU) cpuInit(cpuLevel); resetGame(); }
    else if ((!HAS_OPPONENT || VSCPU) && inRect(p, L.pmExit)){ STATE.paused = false; STATE.mode = 'title'; clearSolo(); endVsCpu(); menuScreen=null; }
    return;
  }
  if (STATE.infoOpen){ STATE.infoOpen = false; return; }   // any tap closes the info card; gameplay ignored
  if (inRect(p, L.menu)) { STATE.paused = true; return; }
  if (inRect(p, L.hold)) { hold(); return; }
  if (inRect(p, L.spFront)) { if (STATE.inv.length) openInfo(STATE.inv[0]); return; }
  if (inRect(p, L.spQueue)) { var qi = queueIndexAt(p.x); if (qi >= 0) openInfo(STATE.inv[qi+1]); return; }
  if (inRect(p, L.spTarget)) { toggleTarget(); return; }   // v23: flip who the front special hits
  if (inRect(p, L.spPrimary)) { usePrimary(); return; }
  if (inRect(p, L.spDrop)) { invDiscard(); return; }
  if (inRect(p, L.drop)) { hardDrop(); return; }
  if (inRect(p, L.rotateL)) { tapRotateCCW(); return; }
  if (inRect(p, L.rotateR)) { tapRotate(); return; }
  var reg = dpadMoveRegion(p);
  if (reg === 'left' || reg === 'right' || reg === 'down'){ dpadTouch = id; setHeld(reg); }
}
function handleMove(id, p){
  if (STATE.mode !== 'play') return;
  if (id !== dpadTouch) return;
  var reg = dpadMoveRegion(p);
  if (reg === 'left' || reg === 'right' || reg === 'down') setHeld(reg);
  else setHeld(null);
}
function handleEnd(id){
  if (id === dpadTouch){ dpadTouch = null; setHeld(null); }
}

function setupInput(){
  canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    for (var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; handleStart(t.identifier, toLogical(t.clientX,t.clientY)); }
  }, {passive:false});
  canvas.addEventListener('touchmove', function(e){
    e.preventDefault();
    for (var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; handleMove(t.identifier, toLogical(t.clientX,t.clientY)); }
  }, {passive:false});
  canvas.addEventListener('touchend', function(e){
    e.preventDefault();
    for (var i=0;i<e.changedTouches.length;i++){ handleEnd(e.changedTouches[i].identifier); }
  }, {passive:false});
  canvas.addEventListener('touchcancel', function(e){
    e.preventDefault();
    for (var i=0;i<e.changedTouches.length;i++){ handleEnd(e.changedTouches[i].identifier); }
  }, {passive:false});

  var mDown=false;
  canvas.addEventListener('mousedown', function(e){ mDown=true; handleStart('mouse', toLogical(e.clientX,e.clientY)); });
  canvas.addEventListener('mousemove', function(e){ if (mDown) handleMove('mouse', toLogical(e.clientX,e.clientY)); });
  window.addEventListener('mouseup', function(){ mDown=false; handleEnd('mouse'); });

  window.addEventListener('keydown', function(e){
    audioInit(); audioResume();   // v32: first-gesture audio unlock
    if (e.key === 'm' || e.key === 'M'){ setMuted(!SND.muted); e.preventDefault(); return; }   // v32: mute toggle
    if (STATE.mode === 'title' || STATE.mode === 'over'){ if (e.key === 'Enter' || e.key === ' ') { resetGame(); e.preventDefault(); } return; }
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P'){ STATE.paused = !STATE.paused; e.preventDefault(); return; }   // v30
    if (STATE.paused) return;                               // v30: frozen means frozen (keys too)
    if (e.repeat){ if (e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowDown') e.preventDefault(); return; }
    if (e.key === 'ArrowLeft')  { setHeld('left');  e.preventDefault(); }
    else if (e.key === 'ArrowRight') { setHeld('right'); e.preventDefault(); }
    else if (e.key === 'ArrowDown')  { setHeld('down');  e.preventDefault(); }
    else if (e.key === 'ArrowUp' || e.key === 'x' || e.key === 'X') { tapRotate(); e.preventDefault(); }
    else if (e.key === 'z' || e.key === 'Z') { tapRotateCCW(); e.preventDefault(); }
    else if (e.key === 'c' || e.key === 'C' || e.key === 'Shift') { hold(); e.preventDefault(); }
    else if (e.key === '1') { usePrimary(); e.preventDefault(); }
    // v31: keys 2 (target flip) and 3 (discard) retired with their buttons: targeting is automatic, the current special must be used
    else if (e.key === ' ') { hardDrop(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function(e){
    if (e.key === 'ArrowLeft' && STATE.heldDir==='left') setHeld(null);
    if (e.key === 'ArrowRight' && STATE.heldDir==='right') setHeld(null);
    if (e.key === 'ArrowDown' && STATE.heldDir==='down') setHeld(null);
  });
}

function toggleFs(){
  // v28 FIX: the old (obj.method||fn)() form calls the method DETACHED from
  // obj, so native this-checked methods like requestFullscreen throw
  // 'Illegal invocation', silently swallowed by the catch below. Calling
  // el.requestFullscreen() keeps the receiver bound. Vendor-prefixed
  // fallback covers older WebKit; iOS Safari has no Fullscreen API for
  // non-video elements at all, a platform limit no code fix can close.
  try {
    var el = document.documentElement;
    if (!document.fullscreenElement){
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  } catch(_){}
}

function frame(t){
  try {
    var dt = lastT ? (t - lastT) : 16; lastT = t;
    if (dt > 100) dt = 100;                 // clamp after tab-away
    step(dt);
    render();
  } catch(e){
    lastError = e;
    try { drawErr(e); } catch(_){}
  }
  requestAnimationFrame(frame);
}

if (HAS_DOM){
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  resize();
  if (!resumeSolo()) resetToTitle();   // v47: continue a solo match across an unfold reload
  setupInput();
  window.addEventListener('resize', resize);
  document.addEventListener('fullscreenchange', function(){ resize(); setTimeout(resize, 150); setTimeout(resize, 350); setTimeout(resize, 700); });        // v32/v34: refit repeatedly; foldable fullscreen + insets settle late
  document.addEventListener('webkitfullscreenchange', function(){ resize(); setTimeout(resize, 150); setTimeout(resize, 350); setTimeout(resize, 700); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 80); });
  document.addEventListener('visibilitychange', function(){ if (document.hidden) audioHidden(); else audioVisible(); });   // v49
  window.addEventListener('pagehide', audioUnload);      // v49: tab close / navigate away
  window.addEventListener('beforeunload', audioUnload);  // v49
  requestAnimationFrame(frame);
}

/*__HOOK__*/
})();
</script>
</body>
</html>
