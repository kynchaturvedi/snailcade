v1.08 (2026-07-12) LIVE BUTTONS

  #mpanel DOM exists (script block ends the line before the panel
  begins), so the one-shot lobby binder wired zero listeners; the panel
  still drew because visibility syncs every render, hence visible but
  inert. Fix: bindLobby is now idempotent and retried from mpPanelSync

  the first try, so no gate behavior changes. Trap recorded in the
  HANDOVER: DOM bindings in spliced builds must be lazy, never
  load-time.

/* ======================= STUDIO COMMONS BLOCK =============================

/* ============================================================================
   SNAIL AUDIO KIT v1.00 (core module) | Snail Attack Studios | 2026-07-06
   ----------------------------------------------------------------------------
   The studio's sound as a drop-in. NOT invented: two production synth
   primitives carried VERBATIM plus a recipe book of shipped, Director-heard
   sounds, each with provenance.
   - tone(f,dur,type,vol,slide): PATTY PANIC v217's engine. LINEAR pitch slide,
     exponential volume decay. Percussive, chunky, arcade-floor.
   - sweep(f,end,dur,type,vol): NEON SWARM v78's beep engine. EXPONENTIAL pitch
     ramp to a target. Lasers, charges, whooshes, anything that travels.
   - arp(notes,step,dur,type,vol): PATTY's arpeggiator for jingles and rewards.
   Boot is gesture-safe per the STUDIO SEED lesson: mobile contexts can be
   CREATED SUSPENDED, so boot() both creates AND resumes inside the gesture.
   Master gain ships at NEON SWARM's 0.16. Headless-inert: without an
   AudioContext every call is a silent no-op and cannot move a gate.
   ----------------------------------------------------------------------------
   WIRING: call AKIT.boot() inside EVERY input gesture handler (touchstart,
   keydown); it is idempotent. Then fire recipes: AKIT.sfx.hit(); or compose
   your own from the primitives and register them on AKIT.sfx.
   ============================================================================ */
var AKIT = (function(){
'use strict';
var VERSION = '1.02';   /* kit v1.02: ctx/bus accessors + the five-title merge */
var AC = null, master = null, VOL = 0.16;          // NEON SWARM shipped master

function boot(){                                    // call inside every gesture
  try{
    if(!AC){
      var C = (typeof AudioContext !== 'undefined') ? AudioContext :
              (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if(!C) return false;
      AC = new C();
      master = AC.createGain(); master.gain.value = VOL;
      master.connect(AC.destination);
    }
    if(AC.state === 'suspended' && AC.resume) AC.resume();   // the seed lesson
    return true;
  }catch(e){ AC = null; return false; }
}
function setVolume(v){ VOL = Math.max(0, Math.min(1, v)); if(master) master.gain.value = VOL; }
function ready(){ return !!AC; }

/* PATTY PANIC v217 tone(), verbatim shape: linear slide, exp decay */
function tone(f, dur, type, vol, slide){
  if(!AC) return;
  try{
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(vol || 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
/* NEON SWARM v78 beep(), verbatim shape: exponential ramp to a target pitch */
function sweep(freq, end, dur, type, vol){
  if(!AC) return;
  try{
    var o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, end), t + dur);
    gn.gain.setValueAtTime(vol || 0.5, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
/* PATTY PANIC arp(), verbatim shape */
function arp(notes, step, dur, type, vol){
  if(!AC) return;
  for(var i = 0; i < notes.length; i++)
    (function(nt, j){ setTimeout(function(){ tone(nt, dur, type, vol); }, j * step); })(notes[i], i);
}

/* THE RECIPE BOOK: shipped sounds, per-recipe provenance. Grade your game's
   events (UI < action < impact < big < fail) and pick within the grade. */
var sfx = {
  /* UI */
  press:      function(){ tone(660, 0.05, 'square', 0.3); },                    // PATTY press
  tick:       function(){ tone(880, 0.03, 'square', 0.2); },                    // PATTY idiom, lighter
  /* ACTION */
  jump:       function(){ tone(340, 0.11, 'square', 0.3, 620); },               // PATTY v195 CAP CHEF chirp
  spring:     function(){ tone(300, 0.13, 'triangle', 0.4, 520); },             // PATTY v75 boing
  web:        function(){ tone(520, 0.06, 'square', 0.28, -160); },             // PATTY v202 thwip
  shoot:      function(){ sweep(880, 220, 0.07, 'square', 0.22); },             // NEON SWARM shoot
  dive:       function(){ sweep(1200, 500, 0.25, 'square', 0.18); },            // NEON SWARM dive
  /* IMPACT */
  land:       function(){ tone(110, 0.09, 'square', 0.45); },                   // PATTY land
  hit:        function(){ sweep(300, 60, 0.18, 'sawtooth', 0.6); },             // NEON SWARM hit
  stun:       function(){ tone(1250, 0.08, 'square', 0.3, -300); },             // PATTY pepper
  crush:      function(){ tone(150, 0.16, 'sawtooth', 0.5, -90); },             // PATTY crush
  reflect:    function(){ sweep(1000, 1800, 0.1, 'square', 0.4); },             // NEON SWARM deflect ping
  /* BIG */
  big:        function(){ sweep(160, 30, 0.45, 'sawtooth', 0.9);
                          sweep(90, 25, 0.5, 'triangle', 0.7); },               // NEON SWARM layered boom
  nova:       function(){ sweep(70, 20, 1.0, 'sawtooth', 1.0);
                          sweep(900, 80, 0.7, 'triangle', 0.8); },              // NEON SWARM nova
  /* REWARD */
  pickup:     function(){ sweep(600, 1400, 0.12, 'sine', 0.5); },               // NEON SWARM absorb
  charge:     function(){ sweep(600, 1200, 0.25, 'sine', 0.6); },               // NEON SWARM nova-ready
  jingle:     function(){ arp([523, 659, 784, 1047], 70, 0.09, 'square', 0.35); }, // PATTY arp idiom, C major run
  waveclear:  function(){ sweep(440, 880, 0.3, 'triangle', 0.5); },             // NEON SWARM wave
  /* FAIL */
  death:      function(){ sweep(500, 40, 0.8, 'sawtooth', 1.0); },              // NEON SWARM death
  breakdown:  function(){ tone(220, 0.2, 'sawtooth', 0.45, 60); },              // PATTY v81 spring-break crunch
  overheat:   function(){ sweep(400, 70, 0.5, 'square', 0.6); }                 // NEON SWARM overheat
};

return { VERSION:VERSION, boot:boot, ready:ready, setVolume:setVolume,
         tone:tone, sweep:sweep, arp:arp, sfx:sfx,

      ctx.fillStyle = '#ffd8a0'; ctx.fillRect((x - 1) | 0, yTop | 0, 2, h);

      ctx.fillStyle = '#fff3b0'; ctx.fillRect((x - 1) | 0, yTop | 0, 2, h);

  /* ---------------------------------------------------------------------------
     RECIPE 3  FEEL.smokeRings(ctx, x, y, n, t)  -- the death smoke sweep
     Source: PATTY PANIC drawSala death sweep and drawDough puff.
       three rising bars, alpha eased out:  ctx.globalAlpha = 0.5 - t*0.2;
       R(cx-6-s*2, y-10-s*10 - t*14, 12+s*4, 3, '#b9c0d4')

     grows (t is seconds since the death, roughly 0..2). Reads as heat leaving.
  --------------------------------------------------------------------------- */

      var col = t < 1.2 ? '#b9c0d4' : '#e8ecf6';                        // greys toward white as it thins

  /* ---------------------------------------------------------------------------
     RECIPE 4 (optional)  FEEL.burstFlame()  -- the shelved burst-in flame
     Source: PATTY PANIC art lab shelved artifact card (thermostat flame,
       v119..v126, shelved at v127; codex design log v127 THERMOSTAT REVERTED,
       FLAME SHELVED). The art-lab file was not in this workspace, so this is
       RECONSTRUCTED from the documented v126 behavior (hidden until triggered;
       on trigger the flame snaps out PAST its steady size ~1.7x, then eases
       back to 1.0) using the shipped flame palette above. Honest provenance:
       the SIZE CURVE and behavior are faithful to the card; the exact pixel
       fills are the pack's to match against the card if it resurfaces.
     RENDER-only. Returns a handle {trigger, draw, done}. draw(ctx,x,y) scales a
     rounded flame blob by the current curve; hidden (scale 0) until triggered.
  --------------------------------------------------------------------------- */
  FEEL.burstFlame = function(steady){
    steady = steady || 7;                                              // steady radius in px
    var st = { scale: 0, phase: 'hidden', tt: 0 };                     // hidden -> burst -> settle -> steady
    var OVER = 1.7, BURST_T = 0.09, SETTLE_T = 0.22;
    return {
      trigger: function(){ st.phase = 'burst'; st.tt = 0; },
      done: function(){ st.phase = 'hidden'; st.scale = 0; },
      update: function(dt){
        if(st.phase === 'burst'){ st.tt += dt; var k = Math.min(1, st.tt / BURST_T);
          st.scale = OVER * k;                                         // snaps OUT to 1.7x fast
          if(k >= 1){ st.phase = 'settle'; st.tt = 0; } }
        else if(st.phase === 'settle'){ st.tt += dt; var e = Math.min(1, st.tt / SETTLE_T);
          st.scale = OVER + (1 - OVER) * (e * (2 - e));                // ease back to 1.0 (ease-out)
          if(e >= 1){ st.phase = 'steady'; st.scale = 1; } }

      scale: function(){ return st.scale; },
      draw: function(ctx, x, y){

        ctx.fillStyle = '#ffd23f'; ctx.fillRect((x - r * 0.33) | 0, (y - r * 1.5) | 0, (r * 0.66) | 0, (r * 1.7) | 0);
        ctx.fillStyle = '#fff3e0'; ctx.fillRect((x - 1) | 0, (y - r * 1.2) | 0, 2, (r * 1.1) | 0);
      }
    };
  };

  /* ---------------------------------------------------------------------------
     RECIPE 5 (exemplar)  FEEL.webHit(ctx, tgt, dir, api)  -- graded impact bundle
     Source: PATTY PANIC WEB CHEF web-hit, one shipped line of graded impact:
       f.stun = WEB_STUN(2.5); f.webbed = WEB_STUN; f.flash = 4;   // stun + wrap + hit flash
       f.x += dir * 2;                                             // 2px knockback
       shake = Math.max(shake, 4);                                 // 4-frame screen kick
       spark(f.x, feetY-8, 10, '#f4f6fb');                         // 10-particle splat
       sfx.webhit();

     assembled from pack primitives in one call, not five scattered effects. It
     is SIM-touching (it writes target state) but title-shaped, so it is offered
     as a documented exemplar rather than a core recipe. `api` supplies the pack
     hooks: api.shake(n), api.spark(x,y,n,col), api.sound('webhit'). Returns the
     status package to apply to the target, so the caller stays in control.
  --------------------------------------------------------------------------- */
  FEEL.webHit = function(ctx, tgt, dir, api){
    var STUN = 2.5, FLASH = 4, KNOCK = 2, SHAKE = 4, SPARKS = 10;
    if(tgt){ tgt.x += dir * KNOCK; }
    if(api){
      if(api.shake) api.shake(SHAKE);
      if(api.spark && tgt) api.spark(tgt.x, (tgt.y || 0) - 8, SPARKS, '#f4f6fb');
      if(api.sound) api.sound('webhit');
    }
    return { stun: STUN, webbed: STUN, flash: FLASH };                 // caller applies these to the target
  };

/* ===========================================================================
   SIM GATE (spec point 4). Lift these assertions into feelpack-test. They cover
   ONLY the sim-touching halves: emitter handles stop cleanly, the pool stays
   capped, and there is no leak after stop. Render halves are the Director's gate.
   Runs standalone:  node feelpack-fire-contrib-v1.00.js
   =========================================================================== */
if(typeof module !== 'undefined' && require.main === module){
  var A = require('assert');
  var FEEL = globalThis.FEEL;
  var P = 0; function ok(c, m){ A.ok(c, m); P++; console.log('  ok ' + P + ': ' + m); }

  // helper: age the pool one step and cull dead parts (stands in for the pack's own update)
  function agePool(dt){ for(var i = FEEL.parts.length - 1; i >= 0; i--){ var p = FEEL.parts[i]; p.t -= dt; if(p.t <= 0) FEEL.parts.splice(i, 1); } }

  FEEL.parts.length = 0; FEEL._emitters = [];
  FEEL.MAX_PARTS = 40;                                   // small cap to exercise the drop path

  // 1) an emitter spawns into the pool
  var h = FEEL.embers(100, 100, 8, 60, '#ff7a2a');
  for(var f = 0; f < 5; f++){ FEEL.tickEmbers(1 / 60); }
  ok(FEEL.parts.length > 0, 'a running emitter spawns embers into the pool');
  ok(FEEL._emitters.length === 1, 'the emitter is registered while live');

  // 2) the pool never exceeds MAX_PARTS, even under a hot emitter (drop, do not overflow)
  var overflowed = false;
  for(var f2 = 0; f2 < 600; f2++){ FEEL.tickEmbers(1 / 60); if(FEEL.parts.length > FEEL.MAX_PARTS) overflowed = true; }
  ok(!overflowed, 'the pool stays capped at MAX_PARTS (spawns drop when full)');

  // 3) move() retargets without spawning outside the cap
  h.move(180, 90);
  FEEL.tickEmbers(1 / 60);
  ok(FEEL.parts.length <= FEEL.MAX_PARTS, 'move() retargets the source, pool still capped');

  // 4) stop() cleanly ends the emitter: it frees from _emitters and spawns nothing further
  h.stop();
  FEEL.tickEmbers(1 / 60);
  ok(FEEL._emitters.length === 0, 'stop() frees the emitter from the pool list (no emitter leak)');
  var countAfterStop = FEEL.parts.length;
  for(var f3 = 0; f3 < 10; f3++){ FEEL.tickEmbers(1 / 60); }
  ok(FEEL.parts.length <= countAfterStop, 'no new embers spawn after stop()');

  // 5) no particle leak: with aging, the pool drains fully to zero after stop
  for(var f4 = 0; f4 < 200; f4++){ FEEL.tickEmbers(1 / 60); agePool(1 / 60); }
  ok(FEEL.parts.length === 0, 'the pool drains to zero after stop (no particle leak)');

  // 6) many concurrent emitters all free on stop (no accumulation across sources)
  var hs = []; for(var e = 0; e < 12; e++) hs.push(FEEL.embers(10 * e, 50, 8, 20));
  FEEL.tickEmbers(1 / 60);
  ok(FEEL._emitters.length === 12, 'twelve concurrent emitters register');
  for(var e2 = 0; e2 < hs.length; e2++) hs[e2].stop();
  FEEL.tickEmbers(1 / 60);
  ok(FEEL._emitters.length === 0, 'all emitters free on stop (no accumulation)');

  // 7) render halves are headless-inert: they only touch ctx, never throw on a stub
  var stub = new Proxy({}, { get: function(){ return function(){}; }, set: function(){ return true; } });
  FEEL.parts.push({ x:1, y:1, vx:0, vy:0, g:0, t:1, t0:1.3, col:'#ff7a2a', kind:'ember' });
  FEEL.drawEmbers(stub); FEEL.flamePillar(stub, 10, 0, 40, 0.3); FEEL.flamePillar(stub, 10, 0, 40, 0.8);
  FEEL.smokeRings(stub, 10, 40, 3, 0.5);
  var bf = FEEL.burstFlame(7); bf.trigger(); bf.update(0.05); bf.draw(stub, 10, 10);
  FEEL.webHit(stub, { x:10, y:10 }, 1, { shake:function(){}, spark:function(){}, sound:function(){} });
  ok(true, 'render halves run headless-inert against a stub ctx (no throw)');

  console.log('feelpack-fire-contrib sim gate OK (' + P + ' checks)');
}

(function(root){
  'use strict';
  var FEEL = root.FEEL;
  FEEL.parts = FEEL.parts || FEEL.state.parts;
  if (FEEL.MAX_PARTS == null) FEEL.MAX_PARTS = FEEL.state.MAX_PARTS;
  FEEL.texts = FEEL.texts || [];

/* ---- REEF RIOT contribution (BUILD 1, provenance inline per recipe) ---- */
  /* -----------------------------------------------------------------------
     RECIPE 1  FEEL.puffBurst(x,y,col,n,spd)  -- REEF RIOT's radial puff
     Source: reef-riot.html function puff(x,y,col,n,spd), line 291.
     Verbatim shape: n particles at a random angle, random speed in
     [12, spd||46], random lifetime in [0.3,0.7], random radius in [1.5,3.5].
     The shipped title caps its OWN local list at 220; this version defers
     to the pack's shared FEEL.MAX_PARTS instead, since a merged pack has one
     pool, not one per title.
  ----------------------------------------------------------------------- */
  FEEL.puffBurst = function(x, y, col, n, spd){
    for (var i = 0; i < n; i++){
      if (FEEL.parts.length >= FEEL.MAX_PARTS) break;   // honour the shared cap, never overflow
      var a = Math.random() * 6.283, v = 12 + Math.random() * ((spd || 46) - 12);
      FEEL.parts.push({ x:x, y:y, vx:Math.cos(a) * v, vy:Math.sin(a) * v,

    }
  };

     RECIPE 2  FEEL.ringPulse(x,y,col,r)  -- REEF RIOT's expanding ring
     Source: reef-riot.html function ringFX(x,y,col,r), line 296.
     A single non moving particle flagged ring:1, life 0.5s. The draw side
     below expands its stroke radius as it ages and fades alpha with
     remaining life, rather than moving the particle itself.
  ----------------------------------------------------------------------- */
  FEEL.ringPulse = function(x, y, col, r){
    if (FEEL.parts.length >= FEEL.MAX_PARTS) return;
    FEEL.parts.push({ x:x, y:y, vx:0, vy:0, t:0.5, t0:0.5, col:col, r:r || 8, ring:1, kind:'ring' });

     RECIPE 3  FEEL.boltStrike(x,y)  -- REEF RIOT's fixed edge lightning bolt
     Source: reef-riot.html function boltFX(x,y), line 297, drawn in
     drawFXAll, lines 2988 to 3014. A single 0.12s particle flagged bolt:1;
     the draw side below draws a three segment zigzag from a fixed edge down
     to (x,y), plus a small bright dot at the point of impact, both fading
     with t over 0.12. Any title with a fixed emitter edge (a turret rail, a
     beam origin, a ceiling) can reuse this for "something arrived from a

  /* -----------------------------------------------------------------------
     RECIPE 4  FEEL.drawBurstPool(ctx, edgeY)  -- RENDER ONLY
     Source: reef-riot.html function drawFXAll, line 2988. Draws every
     particle of kind puff/ring/bolt exactly the branching the shipped file
     uses. edgeY is the fixed edge boltStrike zigzags from (REEF RIOT passes
     TANK_TOP, 92px down from the canvas top); pass whatever edge fits the
     host title, or 0 for a screen top origin. Skips any particle kind other

  FEEL.drawBurstPool = function(ctx, edgeY){
    edgeY = edgeY || 0;
    for (var i = 0; i < FEEL.parts.length; i++){

        ctx.lineTo(p.x - 5, edgeY + (p.y - edgeY) * 0.72);
        ctx.lineTo(p.x, p.y); ctx.stroke();

  /* -----------------------------------------------------------------------
     RECIPE 5  FEEL.spotlightVeil(ctx, rect, holes, opacity)  -- RENDER ONLY
     Source: reef-riot.html function drawDark, line 3019. Even-odd fill of a
     rect minus a set of circular holes, so only the holes stay lit; each
     hole gets a faint warm rim stroke after the fill. REEF RIOT feeds this
     from the ANGLER KING boss fight: one hole on the boss's lure, one on
     each active finger, one on every bright FX particle in flight. rect:
     {x,y,w,h}. holes: array of [x,y,radius]. Generalizes past the aquarium

  FEEL.spotlightVeil = function(ctx, rect, holes, opacity){

    ctx.fillStyle = 'rgba(2,4,14,' + (opacity * 0.9) + ')';
    ctx.fill('evenodd');

      ctx.strokeStyle = 'rgba(255,240,190,0.10)'; ctx.lineWidth = 6;

     RECIPE 6  FEEL.risingLabel(x,y,text,col)  -- REEF RIOT's floating text
     Source: reef-riot.html function textUp, line 290. Kept in its own small

    for(var i = 0; i < 42; i++){
      var x = r() * 480, y = r() * 360, rad = 30 + r() * 90;
      var col = (r() < 0.6) ? PAL[colA] : PAL[colB];
      var grad = g.createRadialGradient(x, y, 0, x, y, rad);
      grad.addColorStop(0, col + '30');
      grad.addColorStop(1, col + '00');
      g.fillStyle = grad;
      g.fillRect(x - rad, y - rad, rad * 2, rad * 2);

    for(var k = 0; k < 14; k++){

/* ===================== THE PATROL BOARD (v1.06) =======================

var ORDER_ROTATION = ['PROSPECT', 'DECAPITATE', 'GHOST', 'SWEEP'];

  DECAPITATE: { pts: 2500, corium: 0, goal: 0,

  GHOST:      { pts: 2000, corium: 0, goal: 0,

function buildOrder(round){
  STATE.order = null;

  var type = ORDER_ROTATION[(round - 2) % ORDER_ROTATION.length];
  var def = ORDER_DEFS[type];
  STATE.order = { type: type, goal: def.goal, pts: def.pts, corium: def.corium,
                  announced: false, done: false, failed: false };

    ctx.strokeStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(Math.floor(VW/2 + dx), Math.floor(VH/2 + dy), BASE_R + 9, 0, 6.2832);
    ctx.stroke();
  }
}

/* ===================== THE SALVAGE ECONOMY (v1.04) ====================
   Mineral chunks, the fire-gated tractor, cargo, and the REFIT bay.
   Run-scoped by the Director's ruling: NOTHING survives a game over.
   Design provenance: the Starscape research codex (Moonpod, 2003): shared
   gun for mining and combat, a deliberate collection verb, fragile
   drifting loot, fill-the-hold then bank it, and one scarce resource
   gated behind the risky verb (the core shot). */
function resetEconomy(){
  STATE.cargo = { s: 0, c: 0 };
  STATE.wallet = { s: 0, c: 0 };
  STATE.gear = { gun: 0, coil: 0, tractor: 0, cargo: 0, plate: false, scanner: false };
}
function fireCadence(){ return [0.50, 0.44, 0.38][STATE.gear.gun]; }   /* v1.15: 0.5s base (FIRING LAB verdict), gun linkage still tightens it */
function shotSpeed(){ return [430, 480, 520][STATE.gear.coil]; }
function tractorR(){ return [90, 130, 170][STATE.gear.tractor]; }
function cargoCap(){ return [12, 18, 24][STATE.gear.cargo]; }
function cargoCount(){ return STATE.cargo.s + STATE.cargo.c; }
function spawnChunk(type, x, y, vx, vy){
  if(chunks.length >= CHUNK_CAP) chunks.shift();
  var a = rnd() * 6.2832, sp = 8 + rnd() * 18;
  chunks.push({ type: type, x: wrapX(x), y: wrapY(y),
                vx: (vx === undefined) ? Math.cos(a) * sp : vx,
                vy: (vy === undefined) ? Math.sin(a) * sp : vy, age: 0 });
}
function spawnChunks(x, y, nS, nC){
  for(var i = 0; i < nS; i++) spawnChunk('S', x, y);
  for(var j = 0; j < nC; j++) spawnChunk('C', x, y);
}
function collectChunk(idx){
  var c = chunks[idx];
  if(cargoCount() >= cargoCap()) return false;   /* hold is full: it stays adrift */
  if(c.type === 'S'){ STATE.cargo.s++; AKIT.sfx.pickup(); popAt(c.x, c.y, '+SCRAP', '#c9bfae'); }
  else { STATE.cargo.c++; AKIT.sfx.corium(); popAt(c.x, c.y, '+CORIUM', '#ff8c3b'); }
  chunks.splice(idx, 1);
  return true;
}
function stepChunks(dt){
  var tr2 = tractorR() * tractorR();
  var cps = pilots();
  for(var i = chunks.length - 1; i >= 0; i--){
    var c = chunks[i];
    c.age += dt;
    if(c.age > CHUNK_TTL){ chunks.splice(i, 1); continue; }
    /* the nearest resting pilot pulls; any pilot in the swallow ring keeps it */
    var puller = null, pd2 = Infinity, swallowed = false;
    for(var pc = 0; pc < cps.length; pc++){
      var cp = cps[pc]; if(!cp.alive) continue;
      var ddx = wrapDX(cp.x - c.x), ddy = wrapDY(cp.y - c.y);
      var dd2 = ddx*ddx + ddy*ddy;
      if(dd2 < COLLECT_R * COLLECT_R){ swallowed = true; break; }
      /* v1.13: passive salvage (autofire retired the fire-gate); nearest pilot in range pulls */
      if(dd2 < tr2 && dd2 < pd2){ pd2 = dd2; puller = cp; }
    }
    if(swallowed){ collectChunk(i); continue; }
    if(puller && pd2 > 1){
      var d = Math.sqrt(pd2);
      c.x = wrapX(c.x + (wrapDX(puller.x - c.x) / d) * TRACTOR_PULL * dt);
      c.y = wrapY(c.y + (wrapDY(puller.y - c.y) / d) * TRACTOR_PULL * dt);
      c.pullBy = puller;   /* v1.15: mark the active pickup so the beam can draw */
    } else {
      c.pullBy = null;
      c.x = wrapX(c.x + c.vx * dt);
      c.y = wrapY(c.y + c.vy * dt);
    }
  }
}
function bankCargo(){
  STATE.wallet.s += STATE.cargo.s;
  STATE.wallet.c += STATE.cargo.c;
  STATE.cargo.s = 0; STATE.cargo.c = 0;
}
/* --- the REFIT bay: six run-scoped items, all gone at game over --- */
var REFIT_CATALOG = [
  { id:'gun',     name:'GUN LINKAGE',  desc:'faster autofire',    tiers:[{s:6,c:0},{s:12,c:0}] },
  { id:'coil',    name:'COIL SHOTS',   desc:'hotter shot speed',  tiers:[{s:6,c:0},{s:12,c:0}] },
  { id:'tractor', name:'TRACTOR AMP',  desc:'wider salvage pull', tiers:[{s:5,c:0},{s:10,c:0}] },
  { id:'cargo',   name:'CARGO RACK',   desc:'bigger hold',        tiers:[{s:5,c:0},{s:10,c:0}] },
  { id:'plate',   name:'HULL PLATE',   desc:'absorbs one hit',    tiers:[{s:8,c:0}], consumable:true },
  { id:'scanner', name:'CORE SCANNER', desc:'hatch timers shown', tiers:[{s:0,c:2}] }
];
var REFIT_HITS = [];
function refitTier(item){
  var g = STATE.gear[item.id];
  if(item.id === 'plate') return g ? 1 : 0;
  if(item.id === 'scanner') return g ? 1 : 0;
  return g;
}
function refitBuy(id){
  if(mp.role === 'guest') return false;   /* the host fits the skiffs */
  var item = null;
  for(var i = 0; i < REFIT_CATALOG.length; i++) if(REFIT_CATALOG[i].id === id) item = REFIT_CATALOG[i];
  if(!item) return false;
  var tier = refitTier(item);
  if(tier >= item.tiers.length){ AKIT.sfx.reflect(); return false; }   /* maxed / owned */
  var cost = item.tiers[tier];
  if(STATE.wallet.s < cost.s || STATE.wallet.c < cost.c){ AKIT.sfx.reflect(); return false; }
  STATE.wallet.s -= cost.s; STATE.wallet.c -= cost.c;
  if(id === 'plate' || id === 'scanner') STATE.gear[id] = true;
  else STATE.gear[id]++;
  AKIT.sfx.jingle();
  return true;
}
function refitDeploy(){
  if(STATE.mode !== 'refit') return;
  if(mp.role === 'guest') return;   /* the host fits the skiffs */
  initRound(STATE.round + 1);
  STATE.mode = 'play';
  voiceBlastoff();
}
function drawSalvage(){
  /* v1.15: no idle ring. A subtle DIRECTED beam draws only while a chunk is
     being pulled, from the pulling ship to that chunk (that is the tractor at
     work). Drawn from the local ship's frame; the beam pulses gently. */
  for(var bi = 0; bi < chunks.length; bi++){
    var cb = chunks[bi];
    if(!cb.pullBy || cb.pullBy !== ship) continue;
    var bdx = wrapDX(cb.x - ship.x), bdy = wrapDY(cb.y - ship.y);
    if(Math.abs(bdx) > VW/2 + 8 || Math.abs(bdy) > VH/2 + 8) continue;
    var bpulse = 0.35 + 0.25 * Math.sin(STATE.t * 10);
    ctx.strokeStyle = 'rgba(186,255,201,' + bpulse.toFixed(3) + ')';   /* mint, subtle */
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(VW/2, VH/2);
    ctx.lineTo(Math.floor(VW/2 + bdx), Math.floor(VH/2 + bdy)); ctx.stroke();
    /* a faint nozzle glow at the ship end */
    ctx.fillStyle = 'rgba(186,255,201,' + (bpulse * 0.6).toFixed(3) + ')';
    ctx.fillRect(Math.floor(VW/2 - 1), Math.floor(VH/2 - 1), 2, 2);
  }
  for(var i = 0; i < chunks.length; i++){
    var c = chunks[i];
    if(c.age > CHUNK_TTL - CHUNK_BLINK && Math.floor(c.age * 8) % 2 === 0) continue;
    var dx = wrapDX(c.x - ship.x), dy = wrapDY(c.y - ship.y);
    if(Math.abs(dx) > VW/2 + 8 || Math.abs(dy) > VH/2 + 8) continue;
    var sx = Math.floor(VW/2 + dx), sy = Math.floor(VH/2 + dy);
    if(c.type === 'S'){
      ctx.fillStyle = '#8a8474'; ctx.fillRect(sx - 2, sy - 1, 4, 3);
      ctx.fillStyle = '#c9bfae'; ctx.fillRect(sx - 1, sy - 2, 2, 2);
    } else {
      var pulse = Math.floor(STATE.t * 6) % 2 === 0;
      ctx.fillStyle = pulse ? '#ffb066' : '#ff8c3b';
      ctx.fillRect(sx - 1, sy - 3, 2, 6); ctx.fillRect(sx - 3, sy - 1, 6, 2);
      ctx.fillStyle = '#fff0e0'; ctx.fillRect(sx - 1, sy - 1, 2, 2);
    }
  }
  /* the core scanner: hatch timers on every base in view */
  if(STATE.gear.scanner){
    for(var b = 0; b < bases.length; b++){
      var bb = bases[b];
      var bdx = wrapDX(bb.x - ship.x), bdy = wrapDY(bb.y - ship.y);
      if(Math.abs(bdx) > VW/2 + 60 || Math.abs(bdy) > VH/2 + 60) continue;
      var frac = bb.coreHold > 0 ? 1 : 1 - (bb.coreT / (bb.coreOpen ? D.coreOpen : D.coreClosed));
      ctx.strokeStyle = bb.coreOpen ? 'rgba(233,255,240,0.8)' : 'rgba(127,174,143,0.5)';
      ctx.beginPath();
      ctx.arc(Math.floor(VW/2 + bdx), Math.floor(VH/2 + bdy), CORE_R + 7,
              -Math.PI/2, -Math.PI/2 + frac * 6.2832);
      ctx.stroke();
    }
  }
}
function drawRefit(){
  ctx.fillStyle = 'rgba(5,7,14,0.88)'; ctx.fillRect(0, 0, VW, VH);
  centerText(mp.role === 'guest' ? 'REFIT BAY  (HOST IS FITTING)' : 'REFIT BAY', VH * 0.10, 13, '#ffd76b');
  centerText('SECTOR ' + STATE.round + ' SALVAGE BANKED', VH * 0.145, 8, '#8a8474');
  ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#c9bfae';
  ctx.fillText('SCRAP ' + STATE.wallet.s + '   CORIUM ' + STATE.wallet.c, VW/2, Math.floor(VH * 0.19));
  if(STATE.lastOrderResult){
    ctx.fillStyle = STATE.lastOrderResult.indexOf('COMPLETE') >= 0 ? '#2fae59' : '#8a8474';
    ctx.fillText(STATE.lastOrderResult, VW/2, Math.floor(VH * 0.215));
  }
  ctx.textAlign = 'left';
  REFIT_HITS.length = 0;
  var rw = Math.min(VW - 24, 320), rx = Math.floor((VW - rw) / 2);
  var y = Math.floor(VH * 0.23), rh = 30;
  for(var i = 0; i < REFIT_CATALOG.length; i++){
    var it = REFIT_CATALOG[i];
    var tier = refitTier(it), maxed = tier >= it.tiers.length;
    var cost = maxed ? null : it.tiers[tier];
    var afford = cost && STATE.wallet.s >= cost.s && STATE.wallet.c >= cost.c;
    ctx.strokeStyle = maxed ? '#2a3140' : (afford ? '#b98a2f' : '#3a3220');
    ctx.strokeRect(rx + 0.5, y + 0.5, rw - 1, rh - 1);
    ctx.font = '9px monospace';
    ctx.fillStyle = maxed ? '#8a8474' : '#e8e4d8';
    ctx.fillText((i + 1) + '. ' + it.name, rx + 6, y + 12);
    ctx.fillStyle = '#8a8474';
    ctx.fillText(it.desc, rx + 6, y + 24);
    var pips = '';
    for(var t = 0; t < it.tiers.length; t++) pips += (t < tier ? '\u25a0' : '\u25a1');
    ctx.fillStyle = '#ffd76b';
    ctx.fillText(pips, rx + rw - 70, y + 12);
    ctx.fillStyle = maxed ? '#2fae59' : (afford ? '#ffd76b' : '#5a5448');
    ctx.fillText(maxed ? (it.consumable ? 'ARMED' : 'OWNED')
                       : (cost.c ? cost.c + ' CORIUM' : cost.s + ' SCRAP'), rx + rw - 70, y + 24);
    REFIT_HITS.push({ x: rx, y: y, w: rw, h: rh, id: it.id });
    y += rh + 5;
  }
  y += 6;
  ctx.strokeStyle = '#ffd76b';
  ctx.strokeRect(rx + 0.5, y + 0.5, rw - 1, 27);
  ctx.font = '11px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd76b';
  ctx.fillText('DEPLOY \u25b6 SECTOR ' + (STATE.round + 1), VW/2, y + 18);
  ctx.textAlign = 'left';
  REFIT_HITS.push({ x: rx, y: y, w: rw, h: 28, id: '__deploy' });
}
function refitPointer(cx, cy){
  var rx = cx * (VW / win.innerWidth), ry = cy * (VH / win.innerHeight);
  for(var i = 0; i < REFIT_HITS.length; i++){
    var hzone = REFIT_HITS[i];
    if(rx >= hzone.x && rx <= hzone.x + hzone.w && ry >= hzone.y && ry <= hzone.y + hzone.h){
      if(hzone.id === '__deploy') refitDeploy();
      else refitBuy(hzone.id);
      return;
    }
  }
}

/* ===================== THE LIVING SECTOR (v1.01) ======================
   Fighters, formations, the spy ship, the Condition system, the voice
   callouts. One contiguous block (04: new subsystems land whole). */
function voice(name, text, col){
  STATE.banner.text = text; STATE.banner.t = 1.9; STATE.banner.col = col || '#ffd76b';
  var fn = AKIT.sfx['v_' + name]; if(fn) fn();
  if(hosting()) mp.evq.push(['v', name]);
}
function voiceBlastoff(){ voice('blastoff', 'BLAST OFF!', '#e8e4d8'); }
function triggerRed(src){
  if(STATE.redFlag) return;
  STATE.redFlag = true; STATE.condition = 'RED'; redVoiceT = RED_VOICE_T;
  voice('red', 'CONDITION RED!', '#ff5040');
}
function newFoe(type, x, y, heading){
  var spd = type === 'I' ? FOE_I_SPEED : (type === 'P' ? FOE_P_SPEED : FOE_E_SPEED);
  return { type: type, x: wrapX(x), y: wrapY(y),
           heading: (heading === undefined) ? rnd() * 6.2832 : heading,
           spd: spd, turn: type === 'I' ? FOE_I_TURN : FOE_P_TURN,
           leader: false, form: null, ox: 0, oy: 0,
           side: rnd() < 0.5 ? -1 : 1, age: 0 };
}
function spawnFoe(type, x, y, heading){ var f = newFoe(type, x, y, heading); foes.push(f); return f; }
function looseFighters(){
  var n = 0;
  for(var i = 0; i < foes.length; i++) if(!foes[i].form && foes[i].type !== 'E') n++;
  return n;
}
function spawnFighterChecked(){
  if(looseFighters() >= D.foeCap) return null;
  var a = rnd() * 6.2832;
  var t = (STATE.redFlag && rnd() < 0.25) ? 'E' : (rnd() < 0.6 ? 'I' : 'P');
  var anc = pilots()[Math.floor(rnd() * pilots().length)];
  var sd = spawnDistFor(SPAWN_DIST);
  var f = spawnFoe(t, anc.x + Math.cos(a) * sd, anc.y + Math.sin(a) * sd);
  f.heading = Math.atan2(wrapDY(anc.y - f.y), wrapDX(anc.x - f.x));
  return f;
}
var FORM_SHAPES = {
  V:    [[0,0], [-26,-22], [-26,22], [-52,-44], [-52,44]],
  PLUS: [[0,0], [30,0], [-30,0], [0,30], [0,-30]],
  X:    [[0,0], [26,-26], [26,26], [-26,-26], [-26,26]],
  LINE: [[0,0], [-28,0], [-56,0], [-84,0], [-112,0]]
};
function spawnFormation(type, shapeName, x, y){
  var shape = FORM_SHAPES[shapeName] || FORM_SHAPES.V;
  var fm = { type: type, members: [], bonusVoid: false, shape: shapeName, leader: null };
  for(var i = 0; i < 5; i++){
    var f = newFoe(type, x, y);
    f.form = fm; f.ox = shape[i][0]; f.oy = shape[i][1]; f.turn = FORM_TURN;
    if(i === 0){ f.leader = true; fm.leader = f; }
    foes.push(f); fm.members.push(f);
  }
  var fnp = nearestPilot(x, y);
  fm.leader.heading = Math.atan2(wrapDY(fnp.y - fm.leader.y), wrapDX(fnp.x - fm.leader.x));
  forms.push(fm);
  voice('battle', 'BATTLE STATIONS!', '#ffd76b');
  return fm;
}
function scatterFormation(fm){
  for(var i = 0; i < fm.members.length; i++){
    var m = fm.members[i];
    m.form = null; m.leader = false;
    m.turn = m.type === 'I' ? FOE_I_TURN : FOE_P_TURN;
  }
  fm.members.length = 0;
  var ix = forms.indexOf(fm); if(ix >= 0) forms.splice(ix, 1);
}
function onFoeDeath(f, pts){
  var i = foes.indexOf(f); if(i >= 0) foes.splice(i, 1);
  if(pts) addScore(pts, f.x, f.y);
  burstAt(f.x, f.y, '#ffb0a8', 12, 130); FEEL.shake(0.25);
  AKIT.sfx.hit();
  var fm = f.form;
  if(fm){
    var mi = fm.members.indexOf(f); if(mi >= 0) fm.members.splice(mi, 1);
    if(f.leader){
      if(fm.members.length === 0 && !fm.bonusVoid){
        addScore(FORM_BONUS[fm.type], f.x, f.y);   /* the whole squadron fell: full bonus */
        AKIT.sfx.jingle();
      } else if(fm.members.length > 0){
        fm.bonusVoid = true;
        scatterFormation(fm);                       /* the leader fell first: they scatter */
      }
      var ix = forms.indexOf(fm); if(ix >= 0) forms.splice(ix, 1);
    } else if(fm.members.length === 0){
      var ix2 = forms.indexOf(fm); if(ix2 >= 0) forms.splice(ix2, 1);
    }
  }
}
function foePts(f){ return FOE_PTS[f.type] * (f.leader ? 2 : 1); }
function spawnSpy(){
  var a = rnd() * 6.2832;
  var spySd = spawnDistFor(SPY_SPAWN_DIST);
  spy = { x: wrapX(ship.x + Math.cos(a) * spySd),
          y: wrapY(ship.y + Math.sin(a) * spySd),
          heading: 0, pass: 0, phase: 'approach', age: 0,
          side: rnd() < 0.5 ? -1 : 1 };
  spy.heading = Math.atan2(wrapDY(ship.y - spy.y), wrapDX(ship.x - spy.x));
  voice('spy', 'SPY SHIP SIGHTED!', '#d8e34d');
  return spy;
}
function killSpy(){
  if(!spy) return;
  var pts = SPY_PTS[Math.min(STATE.spyKills, SPY_PTS.length - 1)];
  STATE.spyKills++;
  addScore(pts, spy.x, spy.y);
  burstAt(spy.x, spy.y, '#d8e34d', 16, 150);
  AKIT.sfx.pickup();
  spy = null;
}
function turnToward(cur, target, maxDelta){
  var d = target - cur;
  while(d > Math.PI) d -= 6.2832;
  while(d < -Math.PI) d += 6.2832;
  if(d > maxDelta) d = maxDelta;
  if(d < -maxDelta) d = -maxDelta;
  return cur + d;
}
function updateCondition(dt){
  STATE.conditionT += dt;
  if(!STATE.redFlag && STATE.conditionT > D.redT) triggerRed('time');
  if(STATE.redFlag){
    STATE.condition = 'RED';
    redVoiceT -= dt;
    if(redVoiceT <= 0){ voice('red', 'CONDITION RED!', '#ff5040'); redVoiceT = RED_VOICE_T; }
  } else if(ebullets.length > 0 || foes.length >= 2 || forms.length > 0 ||
            (spy && STATE.conditionT > 3)){
    /* v1.13: YELLOW means genuine contact (incoming fire, a pack, a squadron,
       or a lingering spy), not the instant a single straggler spawns */
    STATE.condition = 'YELLOW';
    if(!STATE.alertDone){ STATE.alertDone = true; voice('alert', 'ALERT! ALERT!', '#ffd76b'); }
  } else STATE.condition = 'GREEN';
}
function stepFoes(dt){
  updateCondition(dt);
  /* the spawners */
  var interval = STATE.redFlag ? D.spawnRed : (STATE.condition === 'YELLOW' ? D.spawnYellow : D.spawnGreen);
  spawnT -= dt;
  if(spawnT <= 0){ spawnFighterChecked(); spawnT = interval * (0.8 + rnd() * 0.4); }
  formT -= dt;
  if(formT <= 0){
    if(bases.length > 0 && forms.length < D.formMax){
      var fb = bases[Math.floor(rnd() * bases.length)];
      var shapes = ['V', 'PLUS', 'X', 'LINE'];
      var types = STATE.redFlag ? ['I', 'P', 'E'] : D.formTypes;
      spawnFormation(types[Math.floor(rnd() * types.length)],
                     shapes[Math.floor(rnd() * shapes.length)], fb.x, fb.y);
    }
    formT = D.formInterval * (0.8 + rnd() * 0.4);
  }
  if(!spy){
    spyT -= dt;
    if(spyT <= 0){ spawnSpy(); spyT = D.spyInterval * (0.8 + rnd() * 0.4); }
  }
  var sMul = STATE.redFlag ? RED_SPEED_MUL : 1;
  /* fighters */
  for(var i = foes.length - 1; i >= 0; i--){
    var f = foes[i];
    f.age += dt;
    if(f.form && !f.leader){
      /* slaved: hold the shape around the leader */
      var L = f.form.leader;
      var c = Math.cos(L.heading), s = Math.sin(L.heading);
      f.x = wrapX(L.x + f.ox * c - f.oy * s);
      f.y = wrapY(L.y + f.ox * s + f.oy * c);
      f.heading = L.heading;
    } else {
      var want = f.heading;
      var tp = nearestPilot(f.x, f.y);
      if(f.type === 'I' || (f.form && f.leader)){
        if(f.age < I_STALE_T || f.form)
          want = Math.atan2(wrapDY(tp.y - f.y), wrapDX(tp.x - f.x));
        f.heading = turnToward(f.heading, want, f.turn * dt);
      } else if(f.type === 'P'){
        var px = tp.x + Math.cos(tp.heading + f.side * 1.5708) * P_FLANK;
        var py = tp.y + Math.sin(tp.heading + f.side * 1.5708) * P_FLANK;
        var close = wdist2(f.x, f.y, tp.x, tp.y) < P_COMMIT * P_COMMIT;
        want = close ? Math.atan2(wrapDY(tp.y - f.y), wrapDX(tp.x - f.x))
                     : Math.atan2(wrapDY(py - f.y), wrapDX(px - f.x));
        f.heading = turnToward(f.heading, want, f.turn * dt);
      } /* E-type: straight, never turns outside a formation */
      f.x = wrapX(f.x + Math.cos(f.heading) * f.spd * sMul * dt);
      f.y = wrapY(f.y + Math.sin(f.heading) * f.spd * sMul * dt);
    }
    if(f.type === 'E' && !f.form && f.age > E_TTL){ foes.splice(i, 1); continue; }
    /* debris kills fighters, and the kill still pays (the 1981 rule) */
    var died = false;
    for(var a = asteroids.length - 1; a >= 0; a--){
      var as = asteroids[a];
      if(wdist2(f.x, f.y, as.x, as.y) < (as.r + FOE_R) * (as.r + FOE_R)){
        onFoeDeath(f, foePts(f)); died = true; break;
      }
    }
    if(died) continue;
    var rps = pilots();
    for(var rp = 0; rp < rps.length; rp++){
      var rpp = rps[rp];
      if(rpp.alive && rpp.invuln <= 0 &&
         wdist2(f.x, f.y, rpp.x, rpp.y) < (FOE_R + SHIP_R) * (FOE_R + SHIP_R)){
        onFoeDeath(f, 0); killShip(rpp); break;
      }
    }
  }
  /* the spy: approach, flyby, depart, one more pass, then gone for good */
  if(spy){
    spy.age += dt;
    var snp = nearestPilot(spy.x, spy.y);
    if(spy.phase === 'approach'){
      var fx = snp.x + Math.cos(snp.heading + spy.side * 1.5708) * SPY_FLYBY;
      var fy = snp.y + Math.sin(snp.heading + spy.side * 1.5708) * SPY_FLYBY;
      spy.heading = turnToward(spy.heading,
        Math.atan2(wrapDY(fy - spy.y), wrapDX(fx - spy.x)), SPY_TURN * dt);
      if(wdist2(spy.x, spy.y, snp.x, snp.y) < SPY_FLYBY_R * SPY_FLYBY_R) spy.phase = 'depart';
    }
    spy.x = wrapX(spy.x + Math.cos(spy.heading) * SPY_SPEED * dt);
    spy.y = wrapY(spy.y + Math.sin(spy.heading) * SPY_SPEED * dt);
    var far = wdist2(spy.x, spy.y, snp.x, snp.y) > SPY_ESCAPE_D * SPY_ESCAPE_D;
    if((spy.phase === 'depart' && far) || spy.age > SPY_MAX_AGE){
      spy.pass++;
      if(spy.pass >= 2 || spy.age > SPY_MAX_AGE){ spy = null; failOrder('GHOST'); triggerRed('spy'); }
      else { spy.phase = 'approach'; spy.age = 0;
             spy.heading = Math.atan2(wrapDY(ship.y - spy.y), wrapDX(ship.x - spy.x)); }
    }
    if(spy){
      for(var a2 = asteroids.length - 1; a2 >= 0; a2--){
        var as2 = asteroids[a2];
        if(wdist2(spy.x, spy.y, as2.x, as2.y) < (as2.r + FOE_R) * (as2.r + FOE_R)){ killSpy(); break; }
      }
    }
    if(spy){
      var sps = pilots();
      for(var sq = 0; sq < sps.length; sq++){
        var sqp = sps[sq];
        if(sqp.alive && sqp.invuln <= 0 &&
           wdist2(spy.x, spy.y, sqp.x, sqp.y) < (FOE_R + SHIP_R) * (FOE_R + SHIP_R)){
          killSpy(); killShip(sqp); break;
        }
      }
    }
  }
}

function drawFoes(){

  drawSpy();
}

/* ---------------- the sim step ---------------- */
function stepSim(dt){
  STATE.t += dt;
  if(STATE.banner.t > 0) STATE.banner.t -= dt;
  netTick(dt);
  if(mp.role === 'guest'){ guestStep(dt); return; }   /* the host owns the world */
  if(STATE.paused) return;
  if(STATE.mode === 'clear'){
    clearT -= dt;
    if(clearT <= 0){
      if(STATE.lives <= 0 && !ship.alive){ STATE.mode = 'gameover'; }
      else { settleOrdersAtClear(); bankCargo(); STATE.mode = 'refit'; AKIT.sfx.press(); }
    }
    return;
  }
  if(STATE.mode !== 'play') return;

  /* ship: constant cruise with a spawn ramp; heading is instant (pivot on a dime) */
  if(ship.alive){
    /* local skiff motion: the ONLY pilot this device steers; a partner's
       position is guest-authoritative and arrives over the wire (v1.07) */
    ship.accelT = Math.min(SHIP_ACCEL_T, ship.accelT + dt);
    ship.spd = SHIP_SPEED * (0.3 + 0.7 * (ship.accelT / SHIP_ACCEL_T));
    var steer = readSteer();
    if(steer !== null) ship.heading = steer;
    ship.x = wrapX(ship.x + Math.cos(ship.heading) * ship.spd * dt);
    ship.y = wrapY(ship.y + Math.sin(ship.heading) * ship.spd * dt);
  }
  var pls = pilots();
  for(var pj = 0; pj < pls.length; pj++){
    var pw = pls[pj];
    if(pw.alive){
      if(pw.invuln > 0) pw.invuln -= dt;
      /* dual fire: one volley spawns a shot from the bow AND the stern */
      pw.fireT -= dt;
      /* v1.13: autofire drives a steady single FORWARD shot; the aft shot
         is preserved behind DUAL_FIRE for a later per-hull capability */
      if((AUTOFIRE || pilotFiring(pw)) && pw.fireT <= 0){
        var fCount = 0, rCount = 0;
        for(var s = 0; s < shots.length; s++){ if((shots[s].o || 0) !== pj) continue;
          if(shots[s].gun === 'F') fCount++; else rCount++; }
        var canF = fCount < SHOT_CAP, canR = DUAL_FIRE && rCount < SHOT_CAP;
        if(canF || canR){
          var c = Math.cos(pw.heading), sn = Math.sin(pw.heading);
          if(canF)
            shots.push({ x: wrapX(pw.x + c*10), y: wrapY(pw.y + sn*10),
                         vx: c*shotSpeed(), vy: sn*shotSpeed(), ttl: SHOT_TTL, gun: 'F', o: pj });
          if(canR)
            shots.push({ x: wrapX(pw.x - c*10), y: wrapY(pw.y - sn*10),
                         vx: -c*shotSpeed(), vy: -sn*shotSpeed(), ttl: SHOT_TTL, gun: 'R', o: pj });
          pw.fireT = fireCadence();
          AKIT.sfx.shoot();
        }
      }
    } else {
      pw.respT = (pw.respT === undefined ? RESPAWN_T : pw.respT) - dt;
      if(pw.respT <= 0){
        if(STATE.lives > 0){ pw.alive = true; pw.invuln = INVULN_T; pw.accelT = 0; pw.fireT = 0; voiceBlastoff(); }
        else {
          var anyAlive = false;
          for(var pq = 0; pq < pls.length; pq++) if(pls[pq].alive) anyAlive = true;
          if(!anyAlive) STATE.mode = 'gameover';
        }
      }
    }
  }

  stepFoes(dt);
  stepChunks(dt);
  stepOrder();

  /* player shots */
  for(var i = shots.length - 1; i >= 0; i--){
    var sh = shots[i];
    sh.x = wrapX(sh.x + sh.vx * dt); sh.y = wrapY(sh.y + sh.vy * dt);
    sh.ttl -= dt;
    var dead = sh.ttl <= 0;
    /* your own fire shreds adrift minerals (the Starscape fragility rule) */
    if(!dead){ for(var ck = chunks.length - 1; ck >= 0; ck--){
      var cc = chunks[ck];
      if(wdist2(sh.x, sh.y, cc.x, cc.y) < 36){
        chunks.splice(ck, 1);
        burstAt(cc.x, cc.y, '#8a8474', 4, 60); } } }
    /* asteroids */
    if(!dead){ for(var a = asteroids.length - 1; a >= 0; a--){
      var as = asteroids[a];
      if(wdist2(sh.x, sh.y, as.x, as.y) < (as.r + 2)*(as.r + 2)){
        asteroids.splice(a, 1); dead = true;
        addScore(AST_PTS, as.x, as.y);
        spawnChunks(as.x, as.y, 1 + (rnd() < 0.5 ? 1 : 0), 0);
        burstAt(as.x, as.y, '#c9bfae', 10, 110); FEEL.shake(0.2);
        AKIT.sfx.land();
        break; } } }
    /* fighters and the spy */
    if(!dead){ for(var fi = foes.length - 1; fi >= 0; fi--){
      var fo = foes[fi];
      if(wdist2(sh.x, sh.y, fo.x, fo.y) < (FOE_R + 2)*(FOE_R + 2)){
        onFoeDeath(fo, foePts(fo)); dead = true; break; } } }
    if(!dead && spy && wdist2(sh.x, sh.y, spy.x, spy.y) < (FOE_R + 3)*(FOE_R + 3)){
      killSpy(); dead = true; }
    /* bases: pods first, then the core or its armor */
    if(!dead){ for(var b = 0; b < bases.length; b++){
      var ba = bases[b], hit = false;
      for(var p = 0; p < ba.pods.length; p++){
        var pd = ba.pods[p]; if(pd.hp <= 0) continue;
        var pp = podPos(ba, pd);
        if(wdist2(sh.x, sh.y, pp.x, pp.y) < (POD_R + 2)*(POD_R + 2)){
          pd.hp = 0; hit = true;
          addScore(POD_PTS, pp.x, pp.y);
          if(rnd() < 0.5) spawnChunks(pp.x, pp.y, 1, 0);
          burstAt(pp.x, pp.y, '#baffc9', 14, 140); FEEL.shake(0.35);
          AKIT.sfx.hit();
          if(podsAlive(ba) === 0) destroyBase(ba, false);
          break; } }
      if(!hit && wdist2(sh.x, sh.y, ba.x, ba.y) < (CORE_R + 3)*(CORE_R + 3)){
        /* the core: open AND entered along the bay axis, or the armor eats it */
        var svl = Math.sqrt(sh.vx*sh.vx + sh.vy*sh.vy) || 1;
        var dot = (sh.vx * Math.cos(ba.facing) + sh.vy * Math.sin(ba.facing)) / svl;
        var aligned = dot < -Math.cos(CORE_ALIGN_DEG * Math.PI/180);
        if(ba.coreOpen && aligned){ destroyBase(ba, true); }
        else { burstAt(sh.x, sh.y, '#7fae8f', 6, 80); AKIT.sfx.reflect(); }
        hit = true;
      }
      if(hit){ dead = true; break; } } }
    if(dead) shots.splice(i, 1);
  }

  /* bases: core hatch cycle + pod fire */
  for(var b2 = 0; b2 < bases.length; b2++){
    var bb = bases[b2];
    if(bb.coreHold > 0){ bb.coreHold -= dt; }
    else {
      bb.coreT -= dt;
      if(bb.coreT <= 0){ bb.coreOpen = !bb.coreOpen; bb.coreT = bb.coreOpen ? D.coreOpen : D.coreClosed; }
    }
    /* core-launched E-missiles (v1.02, round 3+): an open bay that sees you, fires you */
    if(bb.launchT > 0) bb.launchT -= dt;
    var lpP = nearestPilot(bb.x, bb.y);
    if(D.coreLaunch && bb.coreOpen && bb.launchT <= 0 && lpP.alive && baseOnScreenOf(bb, lpP)){
      var bdx = wrapDX(lpP.x - bb.x), bdy = wrapDY(lpP.y - bb.y);
      if(bdx*bdx + bdy*bdy < CORE_LAUNCH_RANGE * CORE_LAUNCH_RANGE){
        var toShip = Math.atan2(bdy, bdx);
        var offAxis = toShip - bb.facing;
        while(offAxis > Math.PI) offAxis -= 6.2832;
        while(offAxis < -Math.PI) offAxis += 6.2832;
        if(Math.abs(offAxis) < CORE_LAUNCH_CONE){
          spawnFoe('E', wrapX(bb.x + Math.cos(bb.facing) * (BASE_R + 10)),
                        wrapY(bb.y + Math.sin(bb.facing) * (BASE_R + 10)), bb.facing);
          bb.launchT = D.coreLaunchCd * (0.85 + rnd() * 0.3);
          AKIT.sfx.shoot();
        }
      }
    }
    var tgtP = nearestPilot(bb.x, bb.y);
    if(tgtP.alive && baseOnScreenOf(bb, tgtP) && wdist2(tgtP.x, tgtP.y, bb.x, bb.y) < D.podRange*D.podRange){
      for(var p2 = 0; p2 < bb.pods.length; p2++){
        var pod = bb.pods[p2]; if(pod.hp <= 0) continue;
        pod.fireT -= dt;
        if(pod.fireT <= 0){
          /* v1.05, arcade-honest turrets (Director's verdict three): a pod
             only engages a ship IN FRONT of it, and the whole base holds
             to a curve-set count of bullets in flight. The far side of a
             base is silent; the approach line is the player's mercy. */
          var pp2 = podPos(bb, pod);
          var ang = Math.atan2(wrapDY(tgtP.y - pp2.y), wrapDX(tgtP.x - pp2.x));
          var off = ang - pod.a;
          while(off > Math.PI) off -= 6.2832;
          while(off < -Math.PI) off += 6.2832;
          if(Math.abs(off) > POD_ARC){ pod.fireT = 0.25; continue; }   /* dead side: hold */
          if(baseInFlight(bb) >= D.baseShots || ebullets.length >= EBULLET_MAX){
            pod.fireT = 0.25; continue;                                 /* magazine full: hold */
          }
          pod.fireT = podCadence() * (0.85 + rnd()*0.3);
          ebullets.push({ x: pp2.x, y: pp2.y, b: bb,
                          vx: Math.cos(ang)*EBULLET_SPEED, vy: Math.sin(ang)*EBULLET_SPEED, ttl: EBULLET_TTL });
        }
      }
    }
  }

  /* enemy bullets */
  for(var e = ebullets.length - 1; e >= 0; e--){
    var eb = ebullets[e];
    eb.x = wrapX(eb.x + eb.vx * dt); eb.y = wrapY(eb.y + eb.vy * dt);
    eb.ttl -= dt;
    if(eb.ttl <= 0){ ebullets.splice(e, 1); continue; }
    var eps = pilots();
    for(var ep = 0; ep < eps.length; ep++){
      var epp = eps[ep];
      if(epp.alive && epp.invuln <= 0 &&
         wdist2(eb.x, eb.y, epp.x, epp.y) < (SHIP_R + 3)*(SHIP_R + 3)){
        ebullets.splice(e, 1); killShip(epp); break; } }
  }

  /* blasts decay; a base's death is lethal up close */
  for(var bl = blasts.length - 1; bl >= 0; bl--){
    var z = blasts[bl]; z.t -= dt;
    if(z.t <= 0){ blasts.splice(bl, 1); continue; }
    var zps = pilots();
    for(var zp = 0; zp < zps.length; zp++){
      var zpp = zps[zp];
      if(zpp.alive && zpp.invuln <= 0 &&
         wdist2(z.x, z.y, zpp.x, zpp.y) < BASE_BLAST_R*BASE_BLAST_R) killShip(zpp); }
  }

  /* ramming: debris and base structure are fatal */
  var mps = pilots();
  for(var mi = 0; mi < mps.length; mi++){
    var mv = mps[mi];
    if(!mv.alive || mv.invuln > 0) continue;
    for(var a2 = 0; a2 < asteroids.length; a2++){
      var as2 = asteroids[a2];
      if(wdist2(mv.x, mv.y, as2.x, as2.y) < (as2.r + SHIP_R)*(as2.r + SHIP_R)){ killShip(mv); break; } }
    if(!mv.alive) continue;
    for(var b3 = 0; b3 < bases.length; b3++){
      var bc = bases[b3];
      if(wdist2(mv.x, mv.y, bc.x, bc.y) < (CORE_R + 8 + SHIP_R)*(CORE_R + 8 + SHIP_R)){ killShip(mv); break; }
      var done = false;
      for(var p3 = 0; p3 < bc.pods.length; p3++){
        var pd3 = bc.pods[p3]; if(pd3.hp <= 0) continue;
        var pq = podPos(bc, pd3);
        if(wdist2(mv.x, mv.y, pq.x, pq.y) < (POD_R + SHIP_R)*(POD_R + SHIP_R)){ killShip(mv); done = true; break; } }
      if(done) break;
    }
  }

  /* round clear */
  if(STATE.mode === 'play' && bases.length === 0){
    STATE.mode = 'clear'; clearT = 1.6;
    AKIT.sfx.waveclear();
  }
}

function killShip(pl){
  pl = pl || ship;
  if(!pl.alive) return;
  if(STATE.gear.plate){
    /* the hull plate takes the hit and shatters (v1.04, consumable; shared in co-op) */
    STATE.gear.plate = false;
    pl.invuln = 1.2;
    FEEL.flash(0.25, '#baf0ff'); FEEL.shake(0.5);
    burstAt(pl.x, pl.y, '#baf0ff', 18, 150);
    popAt(pl.x, pl.y, 'PLATE!', '#baf0ff');
    AKIT.sfx.reflect();
    return;
  }
  pl.alive = false;
  pl.respT = RESPAWN_T;
  STATE.lives--;
  failOrder('SWEEP');
  /* the death tax: half the unbanked hold spills into the void */
  STATE.cargo.s = Math.floor(STATE.cargo.s * DEATH_TAX);
  STATE.cargo.c = Math.floor(STATE.cargo.c * DEATH_TAX);
  FEEL.shake(0.9); FEEL.flash(0.45, '#ff6b5e');
  if(pl === ship) FEEL.burst(VW/2, VH/2, '#ffffff', 26, 170);
  else burstAt(pl.x, pl.y, '#ffffff', 26, 170);
  AKIT.sfx.death();
}

function readSteer(){
  if(input.steer !== null) return input.steer;
  var k = input.keys, dx = 0, dy = 0;
  if(k.ArrowLeft || k.a) dx -= 1;  if(k.ArrowRight || k.d) dx += 1;
  if(k.ArrowUp || k.w) dy -= 1;    if(k.ArrowDown || k.s) dy += 1;
  if(dx === 0 && dy === 0) return null;
  return Math.atan2(dy, dx);
}

/* ---------------- render ---------------- */
function fit(){
  var dpr = Math.min(win.devicePixelRatio || 1, DPR_CAP);
  cv.width  = Math.max(64, Math.floor(win.innerWidth  * dpr));
  cv.height = Math.max(64, Math.floor(win.innerHeight * dpr));
  var diag = Math.sqrt(cv.width * cv.width + cv.height * cv.height);
  SCALE = Math.max(2, Math.floor(diag / DIAG_TARGET)) * VIEW_ZOOM;   /* v1.15: fractional ease-out */
  VW = cv.width / SCALE; VH = cv.height / SCALE;
  if(ART.ok && ART.CRT && ART.CRT.build){ try { ART.CRT.build(cv.width, cv.height); } catch(e){} }
  if(cv.style){ cv.style.width = win.innerWidth + 'px'; cv.style.height = win.innerHeight + 'px'; }
}

var STAR_COLS = ['#ffffff', '#ffd76b', '#baffc9', '#ffd0c8', '#9aa4b8', '#d8e34d'];   /* the 32-family stars (v1.12) */
/* ============ ART INTEGRATION (v1.12) ============ */
var artFx = [];        /* explosion strip playbacks, world coords */
var artShocks = [];    /* starfield shockwaves, world coords */
var artWake = [];      /* local ship exhaust ribbon, screen coords */
var ART_VIEW = { shocks: [], lens: false, wake: false, wakePts: [], shipX: 0, shipY: 0 };
var artBg = { sector: -1, neb: null, plan: null };
var artComet = null;
var artPrevSX = null, artPrevSY = null;
function artSector(){ return ((STATE.round - 1) % 6 + 6) % 6; }
function buildArtView(dt){
  if(!ART.ok) return;
  for(var i = artShocks.length - 1; i >= 0; i--){
    artShocks[i].age += dt;
    if(artShocks[i].age > 1.7) artShocks.splice(i, 1);
  }
  ART_VIEW.shocks.length = 0;
  for(var s = 0; s < artShocks.length; s++){
    var sh2 = artShocks[s];
    ART_VIEW.shocks.push({ x: VW/2 + wrapDX(sh2.x - ship.x), y: VH/2 + wrapDY(sh2.y - ship.y), age: sh2.age });
  }
  /* the gravity lens rides the live tractor: any chunk being pulled by us */
  ART_VIEW.lens = !!(STATE.mode === 'play' && typeof chunks !== 'undefined' && chunks.some &&
    chunks.some(function(c){ return c.pulling === true; }));
  ART_VIEW.shipX = VW/2; ART_VIEW.shipY = VH/2;
  /* the wake: tail-anchored ribbon behind the LOCAL hull */
  ART_VIEW.wake = STATE.mode === 'play' && ship.alive !== false;
  if(ART_VIEW.wake){
    var hs2 = ART.SHIPS[Math.max(0, Math.min(ART.SHIPS.length - 1, ship.hull || 0))];
    var tOff = hs2.spr.height / 2 + 1;
    var mdx = artPrevSX === null ? 0 : wrapDX(ship.x - artPrevSX);
    var mdy = artPrevSY === null ? 0 : wrapDY(ship.y - artPrevSY);
    for(var w = 0; w < artWake.length; w++){ artWake[w].x -= mdx; artWake[w].y -= mdy; artWake[w].a *= 0.955; }
    artWake.unshift({ x: VW/2 - Math.cos(ship.heading) * tOff, y: VH/2 - Math.sin(ship.heading) * tOff, a: 1 });
    if(artWake.length > 36) artWake.pop();
  } else artWake.length = 0;
  ART_VIEW.wakePts = artWake;
  artPrevSX = ship.x; artPrevSY = ship.y;
}
function drawSpaceBg(){
  if(!ART.ok) return;
  var sec = artSector();
  if(artBg.sector !== sec){
    var sd = ART.SECTORS[sec];
    artBg.neb = ART.makeNebula(1000 + sec * 77, sd.nebA, sd.nebB);
    artBg.plan = ART.makePlanet(sd.planet);
    artBg.sector = sec;
  }
  /* nebula: deep parallax, wrapped so the seam never shows */
  var nw = Math.max(VW, VH) * 1.6, nh = nw * 0.75;
  var nx = -((wrapX(ship.x) * 0.08) % nw), ny = -((wrapY(ship.y) * 0.08) % nh);
  ctx.drawImage(artBg.neb, nx, ny, nw, nh);
  ctx.drawImage(artBg.neb, nx + nw, ny, nw, nh);
  ctx.drawImage(artBg.neb, nx, ny + nh, nw, nh);
  ctx.drawImage(artBg.neb, nx + nw, ny + nh, nw, nh);
  /* the sector's world: one landmark, deep parallax, periodic across space */
  var pfs = artBg.plan.frames;
  var pfi = pfs.length > 1 ? Math.floor(STATE.t * 4) % pfs.length : 0;
  var span = 1500;
  var plx = ((300 - wrapX(ship.x) * 0.18) % span + span) % span - artBg.plan.w;
  var ply = ((160 - wrapY(ship.y) * 0.18) % (span * 0.75) + span * 0.75) % (span * 0.75) - artBg.plan.h;
  if(plx > -artBg.plan.w && plx < VW && ply > -artBg.plan.h && ply < VH)
    ctx.drawImage(pfs[pfi], Math.floor(plx), Math.floor(ply));
  /* comets: the occasional streak */
  if(!artComet && Math.random() < 0.0022)
    artComet = { x: -30, y: 40 + Math.random() * (VH * 0.5), v: 130 + Math.random() * 90 };
  if(artComet){
    artComet.x += artComet.v / 60; artComet.y += artComet.v * 0.22 / 60;
    for(var ct = 0; ct < 9; ct++){
      ctx.globalAlpha = 0.5 * (1 - ct / 9);
      ctx.fillStyle = ct < 2 ? '#ffffff' : '#9aa4b8';
      ctx.fillRect(Math.floor(artComet.x - ct * 5), Math.floor(artComet.y - ct * 1.1), 2, 2);
    }
    ctx.globalAlpha = 1;
    if(artComet.x > VW + 60) artComet = null;
  }
  /* dust: streaming motes with velocity streaks, the speed layer */
  var r2s = 31337;
  function dr(){ r2s = (r2s * 1103515245 + 12345) & 0x7fffffff; return r2s / 0x7fffffff; }
  var ddx = artPrevSX === null ? 0 : wrapDX(ship.x - artPrevSX);
  var ddy = artPrevSY === null ? 0 : wrapDY(ship.y - artPrevSY);
  for(var dd = 0; dd < 46; dd++){
    var bx = dr() * STAR_TILE, by = dr() * STAR_TILE;
    var big2 = dr() > 0.7;
    var sx = ((bx - wrapX(ship.x) * 0.85) % STAR_TILE + STAR_TILE) % STAR_TILE;
    var sy = ((by - wrapY(ship.y) * 0.85) % STAR_TILE + STAR_TILE) % STAR_TILE;
    for(var tx2 = sx - STAR_TILE; tx2 < VW + STAR_TILE; tx2 += STAR_TILE)
      for(var ty2 = sy - STAR_TILE; ty2 < VH + STAR_TILE; ty2 += STAR_TILE){
        if(tx2 < -6 || ty2 < -6 || tx2 > VW + 6 || ty2 > VH + 6) continue;
        var dsp = ART.starDisplace(tx2, ty2, ART_VIEW);
        ctx.fillStyle = big2 ? '#c8c2b2' : '#9aa4b8';
        ctx.globalAlpha = big2 ? 0.8 : 0.55;
        var dpx = Math.floor(tx2 + dsp.x), dpy = Math.floor(ty2 + dsp.y);
        ctx.fillRect(dpx, dpy, big2 ? 2 : 1, big2 ? 2 : 1);
        for(var st2 = 1; st2 <= 3; st2++){
          ctx.globalAlpha = (big2 ? 0.5 : 0.3) * (1 - st2 / 4);
          ctx.fillRect(Math.floor(dpx - ddx * st2 * 2.6), Math.floor(dpy - ddy * st2 * 2.6), 1, 1);
        }
      }
  }
  ctx.globalAlpha = 1;
}
function drawArtFx(){
  if(!ART.ok) return;
  /* the wake ribbon: white-hot head cooling to steel */
  if(ART_VIEW.wake){
    for(var wv = 0; wv < artWake.length; wv++){
      var wp2 = artWake[wv];
      var jit = Math.sin(STATE.t * 22 + wv * 1.7) * (0.5 + wv * 0.10);
      var wc = wv < 2 ? '#ffffff' : (wv < 7 ? '#ffd76b' : (wv < 16 ? '#ff8c3b' : '#5f6a80'));
      ctx.fillStyle = wc; ctx.globalAlpha = Math.min(0.95, wp2.a * 0.95);
      var wsz = wv < 3 ? 3 : (wv < 9 ? 2 : 1);
      ctx.fillRect(Math.floor(wp2.x + jit), Math.floor(wp2.y), wsz, wsz);
    }
    ctx.globalAlpha = 1;
  }
  /* explosion strips at 2x on base kills */
  for(var i = artFx.length - 1; i >= 0; i--){
    var fx = artFx[i];
    fx.t += 1/60;
    var bf = Math.floor(fx.t / 0.09);
    if(bf > 5){ artFx.splice(i, 1); continue; }
    var ex = VW/2 + wrapDX(fx.x - ship.x), ey = VH/2 + wrapDY(fx.y - ship.y);
    var es = ART.EXPLO[bf];
    ctx.drawImage(es, 0, 0, es.width, es.height,
      Math.floor(ex - es.width), Math.floor(ey - es.height), es.width * 2, es.height * 2);
  }
  /* v1.13: the alert lives on the VIEWPORT BORDER, not the whole sky
     (Director: full-screen yellow/red is overwhelming; do it like NEON
     SWARM's overheat edge glow). Yellow holds a steady rim; red pulses. */
  if(STATE.mode === 'play' && STATE.condition !== 'GREEN'){
    var red = STATE.condition === 'RED';
    var col = red ? '255,80,64' : '255,215,107';
    var pk = red ? (0.55 + 0.45 * Math.sin(STATE.t * 6.2)) : 0.5;   /* red beats, yellow steady */
    var band = Math.max(10, Math.floor(Math.min(VW, VH) * 0.10));
    ctx.save();
    function edge(x, y, w2, hh, x0, y0, x1, y1){
      var gd = ctx.createLinearGradient(x0, y0, x1, y1);
      gd.addColorStop(0, 'rgba(' + col + ',' + (0.72 * pk).toFixed(3) + ')');
      gd.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = gd; ctx.fillRect(x, y, w2, hh);
    }
    edge(0, 0, VW, band, 0, 0, 0, band);                 /* top */
    edge(0, VH - band, VW, band, 0, VH, 0, VH - band);   /* bottom */
    edge(0, 0, band, VH, 0, 0, band, 0);                 /* left */
    edge(VW - band, 0, band, VH, VW, 0, VW - band, 0);   /* right */
    ctx.restore();
  }
}
