/* ============ END ART INTEGRATION ============ */

function starLayer(f, count, layerSeed){
  /* deterministic per layer: stars live on a wrapping STAR_TILE grid */
  var ox = wrapX(ship.x) * f, oy = wrapY(ship.y) * f;
  var setPhase = Math.floor(STATE.t / TWINKLE_T);
  var s = layerSeed;
  for(var i = 0; i < count; i++){
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    var sx = s % STAR_TILE;
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    var sy = s % STAR_TILE;
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    var col = STAR_COLS[s % STAR_COLS.length];
    var set = s % 4;
    /* two of four sets visible at a time; the pair rotates: the 05xx blink */
    var visA = setPhase % 4, visB = (setPhase + 1) % 4;
    if(set !== visA && set !== visB && (s % 3 === 0)) continue;  /* only a third of stars twinkle hard */
    var px = ((sx - ox) % STAR_TILE + STAR_TILE) % STAR_TILE;
    var py = ((sy - oy) % STAR_TILE + STAR_TILE) % STAR_TILE;
    for(var tx = px - STAR_TILE; tx < VW + STAR_TILE; tx += STAR_TILE)
      for(var ty = py - STAR_TILE; ty < VH + STAR_TILE; ty += STAR_TILE){
        if(tx < -2 || ty < -2 || tx > VW + 2 || ty > VH + 2) continue;
        ctx.fillStyle = col;
        ctx.globalAlpha = f * 0.9;
        if(ART.ok){
          var dsp2 = ART.starDisplace(tx, ty, ART_VIEW);
          ctx.fillRect(Math.floor(tx + dsp2.x), Math.floor(ty + dsp2.y), 1, 1);
        } else ctx.fillRect(Math.floor(tx), Math.floor(ty), 1, 1);
      }
  }
  ctx.globalAlpha = 1;
}

function drawShipSprite(x, y, heading, blink, hull){
  if(blink) return;
  if(ART.ok){
    var hs = ART.SHIPS[Math.max(0, Math.min(ART.SHIPS.length - 1, hull || 0))];
    var fr = ((Math.round(heading / (Math.PI * 2) * ART.ROT_STEPS + ART.ROT_STEPS / 4) % ART.ROT_STEPS) + ART.ROT_STEPS) % ART.ROT_STEPS;
    ctx.drawImage(hs.rot, fr * ART.ROT_BOX, 0, ART.ROT_BOX, ART.ROT_BOX,
      Math.floor(x - ART.ROT_BOX / 2), Math.floor(y - ART.ROT_BOX / 2), ART.ROT_BOX, ART.ROT_BOX);
    /* the plume: anchored to THIS hull's tail, a connected two-step flame */
    var pf = (Math.floor(STATE.t * 30) % 2) === 0;
    var pOff = hs.spr.height / 2 - 1;
    var pdx = -Math.cos(heading), pdy = -Math.sin(heading);
    ctx.fillStyle = pf ? '#ffd76b' : '#ff8c3b';
    ctx.fillRect(Math.floor(x + pdx * pOff - 1), Math.floor(y + pdy * pOff - 1), 3, 3);
    ctx.fillStyle = pf ? '#ff8c3b' : '#ffd76b';
    ctx.fillRect(Math.floor(x + pdx * (pOff + 3) - 1), Math.floor(y + pdy * (pOff + 3) - 1), pf ? 2 : 1, pf ? 2 : 1);
    return;
  }
  /* ART-less fallback: the retired primitive keeps headless harnesses honest */
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(y));
  ctx.rotate(heading + Math.PI/2);
  ctx.fillStyle = '#2a3140'; ctx.fillRect(-4, -9, 8, 18);
  ctx.fillStyle = '#e8e4d8'; ctx.fillRect(-3, -9, 6, 17);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(-1, -9, 2, 6);
  ctx.fillStyle = '#c8c2b2'; ctx.fillRect(-3, 3, 6, 5);
  ctx.fillStyle = '#ff8c3b'; ctx.fillRect(-5, -2, 2, 6); ctx.fillRect(3, -2, 2, 6);
  ctx.fillStyle = '#9aa4b8'; ctx.fillRect(-1, -11, 2, 3); ctx.fillRect(-1, 8, 2, 3);
  var fl = (Math.floor(STATE.t * 30) % 2) === 0;
  ctx.fillStyle = fl ? '#ffd76b' : '#ff8c3b';
  ctx.fillRect(-2, 8 + 3, 4, fl ? 3 : 2);
  ctx.restore();
}

function drawBase(b){
  var dx = wrapDX(b.x - ship.x), dy = wrapDY(b.y - ship.y);
  if(Math.abs(dx) > VW/2 + BASE_R + 24 || Math.abs(dy) > VH/2 + BASE_R + 24) return;
  var cx = Math.floor(VW/2 + dx), cy = Math.floor(VH/2 + dy);
  ctx.save(); ctx.translate(cx, cy);
  /* struts */
  ctx.strokeStyle = '#1f7a3d'; ctx.lineWidth = 3;
  for(var k = 0; k < 6; k++){
    var p = b.pods[k];
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(p.a) * (BASE_R - 6), Math.sin(p.a) * (BASE_R - 6)); ctx.stroke();
  }
  /* bay corridor marker along the facing axis */
  ctx.strokeStyle = '#2fae59'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(Math.cos(b.facing) * (CORE_R + 4), Math.sin(b.facing) * (CORE_R + 4));
  ctx.lineTo(Math.cos(b.facing) * (BASE_R + 10), Math.sin(b.facing) * (BASE_R + 10));
  ctx.stroke();
  /* pods: shaded green orbs; dead pods leave scorched sockets */
  for(var k2 = 0; k2 < 6; k2++){
    var pd = b.pods[k2];
    var px = Math.cos(pd.a) * BASE_R, py = Math.sin(pd.a) * BASE_R;
    if(ART.ok){
      var pspr = pd.hp > 0 ? ART.POD : ART.POD_DEAD;
      ctx.drawImage(pspr, Math.floor(px - pspr.width / 2), Math.floor(py - pspr.height / 2));
    } else if(pd.hp > 0){
      ctx.fillStyle = '#175c2f'; ctx.beginPath(); ctx.arc(px, py, POD_R, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#2fae59'; ctx.beginPath(); ctx.arc(px - 2, py - 2, POD_R - 3, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#baffc9'; ctx.beginPath(); ctx.arc(px - 4, py - 4, 2, 0, 6.2832); ctx.fill();
    } else {
      ctx.fillStyle = '#14251a'; ctx.beginPath(); ctx.arc(px, py, POD_R - 3, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = '#0c1810'; ctx.beginPath(); ctx.arc(px, py, POD_R - 1, 0, 6.2832); ctx.stroke();
    }
  }
  /* v1.14: the BIG EYE (ENEMY LAB verdict). A large pupil that TRACKS the
     nearest ship fills the core so center shots line up naturally. It is
     half-lidded/armored while closed, wide open with a pulsing halo when
     vulnerable; the closing frames still telegraph through a narrowing lid. */
  if(ART.ok){
    var P = ART.PAL, R = CORE_R;
    var tgtE = nearestPilot(b.x, b.y);
    var aimE = Math.atan2(wrapDY(tgtE.y - b.y), wrapDX(tgtE.x - b.x));
    /* the sclera dome */
    ctx.fillStyle = P.greenDp; ctx.beginPath(); ctx.arc(0, 0, R + 2, 0, 6.2832); ctx.fill();
    ctx.fillStyle = P.bone;    ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832); ctx.fill();
    ctx.fillStyle = P.boneSh;  ctx.beginPath(); ctx.arc(2, 2, R - 2, 0, 6.2832); ctx.fill();
    ctx.fillStyle = P.bone;    ctx.beginPath(); ctx.arc(-1, -1, R - 3, 0, 6.2832); ctx.fill();
    var pxE = Math.cos(aimE) * (R * 0.34), pyE = Math.sin(aimE) * (R * 0.34);
    /* the tracking pupil */
    ctx.fillStyle = P.blueDp; ctx.beginPath(); ctx.arc(pxE, pyE, R * 0.60, 0, 6.2832); ctx.fill();
    ctx.fillStyle = P.blue;   ctx.beginPath(); ctx.arc(pxE, pyE, R * 0.42, 0, 6.2832); ctx.fill();
    ctx.fillStyle = b.coreOpen ? P.red : P.redDp;
    ctx.beginPath(); ctx.arc(pxE, pyE, R * 0.20, 0, 6.2832); ctx.fill();
    ctx.fillStyle = P.white;  ctx.beginPath(); ctx.arc(pxE - 2, pyE - 2, 2, 0, 6.2832); ctx.fill();
    /* v1.15: the GREEN EYELID (Director). A smooth blink: the lid retracts to
       expose the eye when the hatch is open, and closes over it when armored,
       animating open/closed over ~0.3s at each toggle. openness 1 = eye bare,
       0 = lid shut. */
    var ANIM = 0.3;
    var openness;
    if(b.coreOpen) openness = Math.max(0, Math.min(1, (D.coreOpen - b.coreT) / ANIM));
    else openness = 1 - Math.max(0, Math.min(1, (D.coreClosed - b.coreT) / ANIM));
    var cover = (1 - openness) * (R + 1);   /* how far each lid reaches from its edge to center */
    if(cover > 0.5){
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, R + 1, 0, 6.2832); ctx.clip();
      /* upper and lower green lids meeting at center when shut */
      ctx.fillStyle = P.green;
      ctx.beginPath();
      ctx.moveTo(-R - 2, -R - 2); ctx.lineTo(R + 2, -R - 2);
      ctx.lineTo(R + 2, -R - 1 + cover);
      ctx.quadraticCurveTo(0, -R - 1 + cover + 4, -R - 2, -R - 1 + cover);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-R - 2, R + 2); ctx.lineTo(R + 2, R + 2);
      ctx.lineTo(R + 2, R + 1 - cover);
      ctx.quadraticCurveTo(0, R + 1 - cover - 4, -R - 2, R + 1 - cover);
      ctx.closePath(); ctx.fill();
      /* lid shading and crease lines */
      ctx.fillStyle = P.greenSh;
      ctx.fillRect(-R - 2, -R - 2, (R + 2) * 2, 2);
      ctx.fillRect(-R - 2, R, (R + 2) * 2, 2);
      ctx.strokeStyle = P.greenDp; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-R, -R - 1 + cover); ctx.quadraticCurveTo(0, -R - 1 + cover + 4, R, -R - 1 + cover); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-R, R + 1 - cover); ctx.quadraticCurveTo(0, R + 1 - cover - 4, R, R + 1 - cover); ctx.stroke();
      ctx.restore();
    }
    if(b.coreOpen && openness > 0.6){
      /* vulnerable and open: a pulsing mint halo and a hot pupil */
      var pulseE = 0.5 + 0.5 * Math.sin(STATE.t * 8);
      ctx.strokeStyle = P.mintHi; ctx.globalAlpha = 0.25 + pulseE * 0.4; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, R + 4, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  } else if(b.coreOpen){
    var pulse = 0.6 + 0.4 * Math.sin(STATE.t * 12);
    ctx.fillStyle = '#0d3a1f'; ctx.beginPath(); ctx.arc(0, 0, CORE_R + 3, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#e9fff0'; ctx.globalAlpha = pulse;
    ctx.beginPath(); ctx.arc(0, 0, CORE_R - 3, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, 6.2832); ctx.fill();
  } else {
    ctx.fillStyle = '#123f22'; ctx.beginPath(); ctx.arc(0, 0, CORE_R + 3, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = '#1f7a3d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-CORE_R + 2, 0); ctx.lineTo(CORE_R - 2, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -CORE_R + 2); ctx.lineTo(0, CORE_R - 2); ctx.stroke();
  }
  ctx.restore();
}

function drawAsteroid(a){
  var dx = wrapDX(a.x - ship.x), dy = wrapDY(a.y - ship.y);
  if(Math.abs(dx) > VW/2 + 24 || Math.abs(dy) > VH/2 + 24) return;
  var cx = Math.floor(VW/2 + dx), cy = Math.floor(VH/2 + dy);
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = '#4d4438';
  ctx.beginPath();
  for(var i = 0; i < 7; i++){
    var an = i / 7 * 6.2832;
    var rr = a.r * (0.75 + (((a.seed >> i) & 3) / 3) * 0.35);
    if(i === 0) ctx.moveTo(Math.cos(an)*rr, Math.sin(an)*rr);
    else ctx.lineTo(Math.cos(an)*rr, Math.sin(an)*rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6e6250'; ctx.beginPath(); ctx.arc(-a.r*0.25, -a.r*0.25, a.r*0.42, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#8a7d66'; ctx.fillRect(-a.r*0.4, -a.r*0.4, 2, 2);
  ctx.restore();
}

function drawRadar(){
  var rw = Math.floor(Math.min(120, VW * 0.30));
  var rh = Math.floor(rw * (WORLD_H / WORLD_W));
  var rx = VW - rw - 6, ry = 6;
  ctx.fillStyle = 'rgba(8,12,10,0.82)'; ctx.fillRect(rx, ry, rw, rh);
  ctx.strokeStyle = '#b98a2f'; ctx.lineWidth = 1; ctx.strokeRect(rx + 0.5, ry + 0.5, rw - 1, rh - 1);
  for(var i = 0; i < bases.length; i++){
    var q = radarProject(bases[i].x, bases[i].y);
    ctx.fillStyle = '#2fae59';
    ctx.fillRect(rx + Math.floor(q.x * rw) - 1, ry + Math.floor(q.y * rh) - 1, 3, 3);
  }
  if(STATE.order && STATE.order.type === 'DECAPITATE' && !STATE.order.done && !STATE.order.failed){
    for(var cb2 = 0; cb2 < bases.length; cb2++){
      if(!bases[cb2].command) continue;
      if(Math.floor(STATE.t * 4) % 2 === 0) break;
      var cq = radarProject(bases[cb2].x, bases[cb2].y);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(rx + Math.floor(cq.x * rw) - 2, ry + Math.floor(cq.y * rh) - 2, 5, 5);
    }
  }
  for(var fj = 0; fj < forms.length; fj++){
    if(!forms[fj].leader) continue;
    var Lq = radarProject(forms[fj].leader.x, forms[fj].leader.y);
    ctx.fillStyle = '#ff5040';
    ctx.fillRect(rx + Math.floor(Lq.x * rw) - 1, ry + Math.floor(Lq.y * rh) - 1, 3, 3);
  }
  if(ship2 && ship2.alive){
    var q2 = radarProject(ship2.x, ship2.y);
    ctx.fillStyle = '#e8e4d8';
    ctx.fillRect(rx + Math.floor(q2.x * rw) - 1, ry + Math.floor(q2.y * rh) - 1, 2, 2);
  }
  if(Math.floor(STATE.t * 6) % 2 === 0){
    var pq = radarProject(ship.x, ship.y);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(rx + Math.floor(pq.x * rw) - 1, ry + Math.floor(pq.y * rh) - 1, 2, 2);
  }
  /* condition chip under the radar */
  var cond = STATE.condition;
  ctx.fillStyle = 'rgba(8,12,10,0.82)'; ctx.fillRect(rx, ry + rh + 3, rw, 12);
  ctx.strokeStyle = '#b98a2f'; ctx.strokeRect(rx + 0.5, ry + rh + 3.5, rw - 1, 11);
  ctx.fillStyle = cond === 'RED' ? '#ff5040' : (cond === 'YELLOW' ? '#ffd76b' : '#2fae59');
  ctx.font = '8px monospace'; ctx.textAlign = 'center';
  ctx.fillText('CONDITION ' + cond, rx + rw/2, ry + rh + 12);
  ctx.textAlign = 'left';
}

function drawHUD(){
  ctx.font = '9px monospace';
  ctx.fillStyle = '#ffd76b';
  ctx.fillText('SCORE ' + STATE.score, 6, 14);
  ctx.fillStyle = '#b98a2f';
  ctx.fillText('HI ' + STATE.hi, 6, 25);
  ctx.fillText('ROUND ' + STATE.round + '  BASES ' + STATE.basesLeft, 6, 36);
  ctx.fillStyle = '#c9bfae';
  ctx.fillText('HOLD ' + cargoCount() + '/' + cargoCap() +
               (STATE.cargo.c ? '  \u2666' + STATE.cargo.c : ''), 6, 47);
  if(STATE.order){
    var oo = STATE.order;
    ctx.fillStyle = oo.done ? '#2fae59' : (oo.failed ? '#5a5448' : '#ffd76b');
    var otxt = oo.done ? 'ORDER COMPLETE' : (oo.failed ? 'ORDER FAILED' : 'ORDER ' + oo.type +
               (oo.type === 'PROSPECT' ? ' ' + cargoCount() + '/' + oo.goal : ''));
    ctx.fillText(otxt, 6, 58);
  }
  for(var i = 0; i < STATE.lives; i++){
    ctx.fillStyle = '#e8e4d8'; ctx.fillRect(6 + i * 10, VH - 16, 5, 9);
    ctx.fillStyle = '#ff8c3b'; ctx.fillRect(6 + i * 10 + 1, VH - 9, 3, 2);
  }
  drawRadar();
}

function centerText(txt, y, size, col){
  ctx.font = size + 'px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = col; ctx.fillText(txt, VW/2, y);
  ctx.textAlign = 'left';
}

function render(){
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  if(ctx.imageSmoothingEnabled !== undefined) ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#05070e'; ctx.fillRect(0, 0, VW, VH);
  if(STATE.mode === 'shipsel'){ drawShipSelect(); drawCrtOverlay(); return; }
  buildArtView(1/60);
  FEEL.preWorld(ctx);
  drawSpaceBg();
  starLayer(0.35, 90, 1337);
  starLayer(0.7, 70, 9001);
  for(var a = 0; a < asteroids.length; a++) drawAsteroid(asteroids[a]);
  for(var b = 0; b < bases.length; b++) drawBase(bases[b]);
  drawFoes();
  drawSalvage();
  drawOrderMarks();
  drawArtFx();
  /* blast rings */
  for(var z = 0; z < blasts.length; z++){
    var bz = blasts[z];
    var dx = wrapDX(bz.x - ship.x), dy = wrapDY(bz.y - ship.y);
    var k = 1 - bz.t / bz.max;
    ctx.strokeStyle = '#e9fff0'; ctx.globalAlpha = 1 - k; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(VW/2 + dx, VH/2 + dy, BASE_BLAST_R * (0.3 + 0.7*k), 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* shots */
  for(var s = 0; s < shots.length; s++){
    var sh = shots[s];
    var sdx = wrapDX(sh.x - ship.x), sdy = wrapDY(sh.y - ship.y);
    var vl = Math.sqrt(sh.vx*sh.vx + sh.vy*sh.vy) || 1;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(VW/2 + sdx, VH/2 + sdy);
    ctx.lineTo(VW/2 + sdx - sh.vx/vl*6, VH/2 + sdy - sh.vy/vl*6);
    ctx.stroke();
  }
  /* enemy bullets */
  for(var e = 0; e < ebullets.length; e++){
    var eb = ebullets[e];
    var edx = wrapDX(eb.x - ship.x), edy = wrapDY(eb.y - ship.y);
    ctx.fillStyle = '#ff5040';
    ctx.beginPath(); ctx.arc(VW/2 + edx, VH/2 + edy, 2.5, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#ffb0a8'; ctx.fillRect(Math.floor(VW/2 + edx) - 1, Math.floor(VH/2 + edy) - 1, 1, 1);
  }
  /* the ship, center-locked */
  if(STATE.mode === 'play' || STATE.mode === 'clear'){
    if(ship2 && ship2.alive){
      var pdx = wrapDX(ship2.x - ship.x), pdy = wrapDY(ship2.y - ship.y);
      if(Math.abs(pdx) <= VW/2 + 12 && Math.abs(pdy) <= VH/2 + 12){
        var blink2 = ship2.invuln > 0 && (Math.floor(STATE.t * 10) % 2 === 0);
        drawShipSprite(Math.floor(VW/2 + pdx), Math.floor(VH/2 + pdy), ship2.heading, blink2, ship2.hull);
      }
    }
    if(ship.alive){
      var blink = ship.invuln > 0 && (Math.floor(STATE.t * 10) % 2 === 0);
      drawShipSprite(VW/2, VH/2, ship.heading, blink, ship.hull);
    }
  }
  mpPanelSync();
  FEEL.postWorld(ctx);
  /* HUD and screens */
  if(STATE.mode === 'title'){
    centerText('HI ' + STATE.hi, VH * 0.11, 8, '#b98a2f');
    centerText('SECTOR SIEGE', VH * 0.21, 22, '#e8e4d8');
    centerText('BUILD v' + BUILD, VH * 0.21 + 14, 8, '#b98a2f');
    centerText('green bases hold this sector', VH * 0.32, 9, '#2fae59');
    centerText('crack every core', VH * 0.32 + 12, 9, '#2fae59');
    centerText('LEFT drag: steer   autofire is on', VH * 0.40, 8, '#ffd76b');   /* v1.17: autofire since v1.13; a right hold changes nothing */
    centerText('guns fire BOTH ends, always', VH * 0.40 + 11, 8, '#ffd76b');
    /* the mode buttons live in the DOM panel below (its own band, v1.09) */
  } else {
    drawHUD();
    if(STATE.banner.t > 0) centerText(STATE.banner.text, VH * 0.16, 11, STATE.banner.col);
    if(STATE.mode === 'clear') centerText('SECTOR CLEAR', VH * 0.4, 16, '#ffd76b');
    if(STATE.mode === 'refit') drawRefit();
    if(STATE.mode === 'gameover'){
      centerText('SIGNAL LOST', VH * 0.4, 18, '#ff5040');
      centerText('score ' + STATE.score, VH * 0.4 + 16, 10, '#ffd76b');
      centerText('TAP TO RETURN', VH * 0.4 + 34, 9, '#ffffff');
    }
    if(STATE.paused){
      centerText('PAUSED', VH * 0.5, 14, '#e8e4d8');
      centerText('CRT: ' + (STATE.crt ? 'ON' : 'OFF') + '  (tap here)', VH * 0.5 + 18, 8, '#8a8474');
    }
  }
  FEEL.overlay(ctx, VW, VH);
  /* the on-screen error reporter: ALWAYS last (07 build order item 1) */
  if(lastError){
    ctx.fillStyle = '#ff5040'; ctx.font = '8px monospace';
    ctx.fillText('ERR: ' + lastError, 4, VH - 4);
  }
}

/* ---------------- the clock (doc 11 law: drop the lost time, never sprint) - */
var last = 0, acc = 0;
var STEP_MS = 1000/60;      /* fixed sim step */
var TICK_CAP = 5;           /* hard per-frame tick cap (doc 11: both defenses, not either) */
var raf = (typeof requestAnimationFrame !== 'undefined') ? requestAnimationFrame : function(){};
function frameStep(now){
  try{
    if(!last) last = now;
    var d = now - last; last = now; acc += d;
    if(acc > 250){ last = now - STEP_MS; acc = STEP_MS; }  // drop the lost time, never sprint
    var ticks = 0;
    while(acc >= STEP_MS && ticks < TICK_CAP){
      if(FEEL.tick(STEP_MS / 1000)){ stepSim(STEP_MS / 1000); }
      acc -= STEP_MS; ticks++;
    }
    if(ticks === TICK_CAP && acc > STEP_MS) acc = STEP_MS;
    render();
    drawCrtOverlay();
  }catch(err){
    lastError = (err && err.message) ? err.message : String(err);
    try{ render(); }catch(e2){}
  }
  raf(frameStep);
}
function clockReset(){ last = 0; acc = 0; }
if(doc && doc.addEventListener) doc.addEventListener('visibilitychange', function(){
  if(doc.visibilityState === 'visible') clockReset();   /* covers solo AND every future networked mode */
});

/* ---------------- input ---------------- */
function press(){
  AKIT.boot();
  if(STATE.mode === 'title'){ return titleSolo(); }
  if(STATE.mode === 'gameover'){ resetGame(); AKIT.sfx.press(); return true; }
  if(STATE.mode === 'refit'){ refitDeploy(); AKIT.sfx.press(); return true; }
  return false;
}
var steerTouch = null, fireTouch = null;
function bindInput(){
  if(!cv.addEventListener) return;
  cv.addEventListener('pointerdown', function(ev){
    if(ev.preventDefault) ev.preventDefault();
    if(STATE.mode === 'refit'){ AKIT.boot(); refitPointer(ev.clientX, ev.clientY); return; }
    if(STATE.mode === 'shipsel'){ AKIT.boot(); shipSelectTap(ev.clientX); return; }
    if(STATE.mode === 'play' && STATE.paused){
      var fy = ev.clientY / Math.max(1, win.innerHeight);
      if(fy > 0.45 && fy < 0.62){ STATE.crt = !STATE.crt; return; }
    }
    if(press()) return;
    if(ev.clientX < win.innerWidth / 2){
      steerTouch = { id: ev.pointerId, ox: ev.clientX, oy: ev.clientY };
    } else { fireTouch = ev.pointerId; input.fire = true; }
  });
  cv.addEventListener('pointermove', function(ev){
    if(steerTouch && ev.pointerId === steerTouch.id){
      var dx = ev.clientX - steerTouch.ox, dy = ev.clientY - steerTouch.oy;
      if(dx*dx + dy*dy > 100) input.steer = Math.atan2(dy, dx);   /* 10px deadzone */
    }
  });
  function up(ev){
    if(steerTouch && ev.pointerId === steerTouch.id){ steerTouch = null; input.steer = null; }
    if(ev.pointerId === fireTouch){ fireTouch = null; input.fire = false; }
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  if(doc && doc.addEventListener){
    doc.addEventListener('keydown', function(ev){
      AKIT.boot();
      input.keys[ev.key] = true;
      if(ev.key === ' '){ input.fire = true; if(press()){} if(ev.preventDefault) ev.preventDefault(); }
      if(ev.key === 'p' || ev.key === 'P'){ if(STATE.mode === 'play') STATE.paused = !STATE.paused; }
      if(ev.key === 'c' || ev.key === 'C'){ STATE.crt = !STATE.crt; }
      if(STATE.mode === 'refit' && ev.key >= '1' && ev.key <= '6')
        refitBuy(REFIT_CATALOG[+ev.key - 1].id);
      if(ev.key === 'Enter') press();
    });
    doc.addEventListener('keyup', function(ev){
      input.keys[ev.key] = false;
      if(ev.key === ' ') input.fire = false;
    });
  }
  var fsBtn = $('fsbtn');
  fsBtn.addEventListener('click', function(){
    AKIT.boot();
    try{
      var el = doc.documentElement;
      if(doc.fullscreenElement){ if(doc.exitFullscreen) doc.exitFullscreen(); }
      else if(el.requestFullscreen){ el.requestFullscreen(); }
    }catch(e){}
  });
  var psBtn = $('psbtn');
  psBtn.addEventListener('click', function(){ if(STATE.mode === 'play') STATE.paused = !STATE.paused; });
  win.addEventListener('resize', fit);
  win.addEventListener('orientationchange', fit);
  if(win.addEventListener) win.addEventListener('pagehide', function(){
    try{ var c = AKIT.ctx(); if(c && c.close) c.close(); }catch(e){}   /* audio never outlives the page */
  });
}

/* ---------------- boot ---------------- */
fit();
resetGame();
bindInput();
raf(frameStep);

/*__HOOK_SPLICE__*/
})();

</script>
