<!--
CANNONBALL CLASH  |  SNAIL ATTACK STUDIOS  |  EMBEDDED CHANGELOG (append only)

v1  FIRST LIGHT. SSE super scaler engine core: segment road, curve and hill
    projection, exponential fog buckets, parallax mountain ranges, procedural
    sprite scaler with crest clipping. Drive model: LO/HI gears (caps 7200 and
    12000 units/s, displayed 176 and 293 kmh), approach accel (LO 5600, HI
    3000), brake 16000, coast 2600, off road ceiling 3200 with pull 4.0,
    centrifugal 0.33, steer rate 2.3. One looped stage cycling three palettes
    (SUNRISE COAST, BIG BLUE BAY, VIOLET RIDGE). Checkpoint time economy:
    start 65s, bonus 45s per lap. Roadside collisions keep 18 percent of
    speed with 0.7s immunity. Title attract with auto drive, GO banner, TIME
    UP flow. WebAudio behind first gesture: twin osc engine with lowpass,
    skid noise, gear blip, crash noise, checkpoint jingle, and STATION 1
    sequencer loop MAGENTA SUNSET at 128 bpm. On screen error reporter is the
    first feature per studio law. Hook built by build-hook.js; gate chain:
    node build-hook.js, node check on check.js and test-game.js, roadtest
    (6 scenarios with control cases), harness (4 suites), codexcheck.

v2  THE SPRITE PASS. Full art overhaul to studio pixel art fidelity: the car
    rebuilt at 84x48 with 5 steer frames, 2 wheel spin phases, brake light
    frames, a dark outline dilate pass, chrome bumper, glass glint, and the
    driver and passenger duo with steer lean and hair flutter. Roadside set
    redrawn: palm 48x80 with curved trunk, bush 36x22, billboard 64x52 with
    a painted scene, faceted rock 30x18, plus a new non solid START arch
    spanning the road every lap. Engine: sprites gain scale, solid and
    nearCull fields; the collision loop skips non solid decor; the sprite
    pass honors per sprite scale and near cull. Gate growth: roadtest gains
    the non solid pass through scenario (S6) and renumbers collision to S7.
    New tool: build-spritelab.js publishes the sprite lab from the ART block
    verbatim, per studio art mockup law.

v3  RIVAL SPLIT. The OutRunners signature lands: play is always split screen,
    DIABLO's chase view on top, the player's below, title screen full canvas.
    One shared stepCar physics routine drives two car structs; the renderer
    becomes renderWorld with viewport parameters and per view scratch reuse;
    each view projects the other car onto the road at its true position with
    steer frame, spin phase and crest clipping. DIABLO drives an inside line
    with 1800 unit lookahead, solid sprite avoidance, centrifugal feed
    forward steering, a 94 percent shift point, and an arcade rubber band on
    his speed cap (x0.9 leading, x1.12 chasing). Checkpoint bonus is rank
    scaled: 45s leading, 40s trailing. Side contact shoves the cars apart
    without stealing speed. Gate driven fix: the leading side rubber band
    starved DIABLO's shift point (LO cap x0.9 sits below the raw 94 percent
    threshold); the shift now keys to the effective cap. New gate rivaltest.js (5 scenarios) joins the
    chain before harness; harness grows a race sanity suite. Named levers:
    solo mode menu, car to car impact physics, passing whoosh sfx.

v4  FULL WINDSHIELD. The forced split is retired after one build, the
    Director's call with history on its side: the Genesis OutRunners forced
    the same split on solo players and it became that port's most criticized
    trait. Play returns to the full canvas; DIABLO's presence moves into a
    rear view mirror widget (new 44x26 front view frame, MIRROR_RANGE 6000
    units, scale and lateral offset from the true gap) and a gap timer
    beside the rank badge (gap distance over MAX_HI, a constant divisor so
    the readout is steady). renderWorld keeps its viewport parameters on
    purpose: the mirror can become a true rendered viewport later, and
    PeerJS one on one is the named next workstream, for which the rival
    already runs entirely through the rinput channel. mirrorView() is pure
    logic so gates can see it. Gates grow: rivaltest S3 gains gap sign
    asserts, new S6 proves mirror logic (ahead empty, in range shown,
    closer bigger, beyond range empty). Sprite lab republished as v2 with
    the front view frame.

v5  THE POLISH SET. DIABLO enters the mix: a proximity hum (sawtooth keyed
    to his speed, gain by squared proximity inside HUM_RANGE 4000, panned by
    lateral offset where StereoPanner exists, pitch bent by a doppler factor
    from the closing rate) and a bandpass noise whoosh (1700 to 320 Hz) on
    lead changes when the cars are laterally close. Lead changes are a real
    tracked event now: passCount with PASS_HYST 120 unit hysteresis against
    side by side flapping, and a TAKES THE LEAD banner both ways. Per stage
    nature skins: palm, bush and rock painters are parameterized and baked
    three ways (warm dawn, lush day, dusk violet), resolved by name at draw
    time; skin dimensions are identical so hitboxes never move with the
    palette. Gate growth: rivaltest S7 proves lead change detection and its
    hysteresis. Sprite lab republished as v3 with per stage skin rows.

v6  CANNONBALL LINK. PeerJS one on one duels. Model: symmetric state
    exchange, no host authority. Each peer runs its own car with full local
    physics and owns its own clock (the OutRunners contract); the remote
    car is written from 15 Hz state packets (pos, x, speed, gear, steer,
    brake, lap, crashes) and dead reckoned between them by its own speed.
    The transport is injected (netStart(sendFn)), so the new loopback gate
    nettest.js drives the exact shipping code with two vm instances joined
    by an in memory channel: state tracking within tolerance, lap
    propagation, AI takeover on link loss (DIABLO takes the remote wheel),
    and garbage packet resilience. PeerJS itself is browser only glue: a
    DUEL button on the title opens host or join by 4 letter code, and the
    CDN script degrades to NET OFFLINE when absent. Side bump pushes only
    the local car in net mode; the rubber band never applies to a human.
    HUD shows RIVAL instead of DIABLO on a live link. Standing flag per
    studio law: loopback proven only, real two device play unverified.

v7  THE LOOKING GLASS. Two reality fixes from the Director's play. One: the
    Director asked whether DIABLO exists. Instrumented answer: he existed
    but was unwatchable. Against a mediocre 8500 u/s pace he finished three
    minutes 400252 units ahead and was on screen 7.2 percent of frames,
    because the leading side rubber band floor (0.9) left him a 10800 cap.
    The band is now piecewise: gentle while chasing (RB_GAIN 0.000012 up to
    x1.12), a steep leash while leading (RB_GAIN_LEAD 0.00003 down to
    RB_MIN 0.6), so his lead reaches a pace scaled equilibrium and the race
    stays on screen at any skill level. Permanent gate rivaltest S8 holds
    the leash; S1 rewritten to pin the gap near zero so competence is
    measured leash neutral. Two: the mirror is no longer a static cartoon.
    It is a true rendered rear view: the same track segments projected
    backward through wide mirror optics, curvature mirrored (MIR_CURVE is
    the sign knob if the eye disagrees), roadside sprites in their stage
    skins, and the rival drawn at his true depth on that road.

v8  RUSH HOUR. Civilian traffic and Burnout rules. Ten cruisers loop the
    track (two body styles, three tints, lane keeping with gentle wander,
    deterministic fleet, zero traffic in net duels to keep peers in sync).
    Contact rules: rear ending a slower car is YOUR crash and their shunt;
    side contact imparts careening lateral momentum scaled by your speed,
    lane seeking suppressed while recently touched; a car that leaves the
    road or
    meets a solid sprite crashes in full pixel ceremony (three frame
    explosion, tumbling rotation frames, smoke ring). If it crashes within
    0.8s of your touch it is a TAKEDOWN: +2s clock, +500 score, and a 1.5s
    overboost surge (cap x1.22) with exhaust flames. DIABLO's brain scans
    traffic into his avoidance line; he does not yet trade paint with them
    (known limitation, recorded). The renderer's single other car pass
    became a sorted world entity pass (rival, fleet, explosions); the
    mirror shows following traffic. New gate trafftest.js (6 scenarios)
    joins the chain; the race sanity harness bar held unchanged even with
    traffic in play. Gate driven fixes: a position based shove capped out
    at the 0.34 contact window edge (0.98) and could never reach the 1.15
    crash line far from scenery, hence the imparted momentum model; and
    respawn left a negative crash timer residual, now zeroed.

v9  THE GAUNTLET. The route and the road learn new tricks. New layout: the
    sacred clean straight is preserved for the gates, then four esses, a
    5.6 curve hairpin pair, a triple chicane, and two fords, 2802 segments
    (560400 units, up 26 percent). Road features: boost pads (2s surge on
    the shared SURGE_MUL 1.22 cap, same channel takedowns feed), jump pads
    (vy 900, gravity 2400, 0.75s airtime; airborne cars skip ALL collision,
    offroad drag, and traffic contact, so you jump water, scenery and cars),
    and water fords that drag grounded cars toward 4200 with spray. The
    first ford has a jump pad 8 segments ahead (speed is the toll); the
    second is bare and always costs. Flight is generic in stepCar, so
    DIABLO jumps and boosts too, and surge moved from a player global into
    the car struct. Net packets carry altitude (c[8]). Rendering: blinking
    chevron pad strips, animated water bands, shadow separation and lift
    for any airborne car, splash spray. Gate growth: roadtest S8 boost pad
    with control, S9 jump clears the ford with drag control, S10 airborne
    skips a planted collision with grounded control. Registered workstream
    per the Director: LIFTOFF, brief plane flight; the alt/vy system built
    this build is deliberately its foundation.

v10 THE TAKEDOWN. Takedown feel pass on the Director's verdict (not fun
    enough, too hard). Three changes. One, the contact model splits in two:
    steering INTO a car or riding hard against it is a committed slam that
    careens it off the road, while a looser brush is now a minor conflict
    that only jostles and wobbles and can never careen a car off by
    construction (gentle lateral impulse is capped below the width needed to
    leave the road from any lane). So casual traffic bumping finally exists
    as its own thing, distinct from a kill. Two, takedowns are more
    forgiving: the credit window widened from 0.8s to 1.3s and the slam
    impulse is much stronger, so a committed hit reliably completes. Three,
    the impact: a landed takedown triggers real time slow motion (0.5s at
    0.35x physics, clock stays real), a white impact flash, heavy
    magnitude scaled screen shake now on both axes, radial speed lines, a
    bigger flashing TAKEDOWN banner, and a triple vibration pulse. Rear
    ending stays your own crash but is a touch less punishing (closing
    threshold 300 to 400, tighter alignment). Gate growth: trafftest T7
    proves a gentle rub is a minor conflict, not a takedown or a player
    crash; T8 proves a takedown actually arms the slow motion.

v11 THE REAR VIEW. Mirror fix on the Director's verdict (garbled, not
    really road). Root cause: the v7 projector divided road width and center
    offset by a stray 160 the forward renderer never used, and accumulated
    curve in raw units while offsetting by world units, so the road became a
    thin wandering sliver. The projector is rewritten to parallel the
    forward renderer exactly: world x curve accumulation, road half width
    s*ROAD_HW*scale, one shared boundary table (world centerline, screen
    center, screen y, half width) that scenery and cars also project onto so
    they sit on the actual road. The glass is larger (130x44, was 116x32)
    and the view reaches further back (MIRROR_RANGE 6000 to 10000). MIR_CURVE
    stays the bend sign knob. No gameplay or gate logic changed; mirrorView
    (rivaltest S6) adapts to the new range through the shared constant.

v12 CONTACT AND CROWD. A batch of Director asks. Takedowns now REQUIRE
    deliberately angling into a car at speed (steer committed toward it),
    so they take intent to pull off. Every other side touch is a minor
    conflict: the sides shove each other, both cars feel it, and the push
    is capped on the road so a rub can never careen a car off (that is the
    takedown's job alone). Traffic cars also push each other side to side
    now, gently and on-road, so the road jostles with life. Traffic is
    faster (cruise 5000 to 7080, was 3600 to 5000) and denser (14 cars, was
    10), so you no longer blow past instantly and they come by more often.
    Route gained turns throughout (a five ess chain, extra sweepers and
    link corners) while the clean straight stays sacred. Pads and water no
    longer flash past unread: the pads are wider (6 segments, was 3), draw
    from much further away, and every pad and ford now has a scrolling
    colored approach cue painted on the road for 14 segments ahead so you
    see it coming. Gate growth: trafftest T3 updated to steer into the
    slam; T9 proves a non-angled side touch pushes both cars without a
    takedown.

v13 THE RAISED GLASS. Mirror framing fix on the Director's verdict (too
    close to road level, nothing of value visible). The v11 rewrite fixed
    the road being garbled but framed it edge-on: the vertical mapping
    normalized the whole depth range across the glass, bunching almost all
    the road into a thin band at the horizon and leaving a flat near wedge.
    The mapping is now a real look-down projection (screen y = horizon +
    s * MIR_VSPREAD), so the near road pushes off the bottom of the glass
    and the road surface spreads down it, as if looking down at the road
    behind. Backward field of view narrowed (MIR_FOV 1.7, was 2.2) for less
    foreshortening, the glass is taller (MIR_H 54, was 44), and cars back
    there draw larger (divisor 1.35, was 1.8) so opponents and traffic are
    readable. All three are single knobs. No gameplay or gate logic changed.

v14 THE DRIFT. Control overhaul on the Director's asks. Gears now shift
    LO to HI and back automatically by speed (SHIFT_UP 6480, SHIFT_DOWN
    3600, hysteresis between), so the gear button is gone. Brake moved to
    the RIGHT pad (easier thumb). Holding brake at speed (over DRIFT_MIN
    6000) now drifts: a gentler decel that carries speed, plus extra
    steering authority to swing the car, shown by a full lean pose, tire
    smoke, and a DRIFT indicator. Takedowns now REQUIRE a drift into the
    target while angling in (drift + steer toward a car you are beside or
    ahead of); a straight ram without a drift is still your own crash, and a
    plain side touch is still a mutual shove. And the takedown impact (slow
    motion, flash, shake, haptics) now fires AT the moment of contact while
    the victim is on screen ahead, not later when it leaves the road behind,
    which is why the animation was playing behind and after the fact. The
    off-road credit (points, clock, surge, banner) still lands when the car
    actually wrecks. Gate growth: roadtest S1 rewritten for auto shifting;
    trafftest T3 and T8 now drift into the kill and assert it happens ahead
    and arms slow motion at contact; T10 proves angling in WITHOUT a drift
    is not a takedown.

v15 THE LONG VIEW. Sight-line and turns pass. The forward road now reaches
    much further to the horizon: draw depth up (DRAW_DIST 200, was 140) and
    fog gentled (FOG_DENS 2.4, was 4.2) so distant road stays visible instead
    of dissolving early, which also lets corners be read from far further
    down the road. The route gained turns (a sixth ess, two more link
    corners) with length held net-neutral by trimming straights, so a lap
    still fits under the 65s clock (trackLen 583200, min lap 48.6s). The rear
    mirror was raised: MIR_VSPREAD 8000 (was 11500) pulls the road up the
    glass so it shows less foreground and sits higher, per the Director's
    note that it sat too low showing too much road. All render tweaks plus
    route; gates unaffected.

v16 THE RIVAL. Combat and rival pass answering four Director asks. The
    takedown wreck is now seen: instead of braking to a stop and dropping
    behind the faster player, a wrecked car careens forward (speed eased
    toward 2600, not 0), tumbles fast, slides out onto the shoulder and
    sheds debris, so it busts up on screen ahead. Root cause of the old
    problem: the wreck decelerated hard at 9000/s while the player kept
    speed, so the ceremony played out behind. The rival DIABLO can now be
    taken down: a drift into him spins him out to the side (spinT 1.5s,
    speed bled to a crawl) and then he recovers and races on, so it costs
    him time and position rather than removing him. It is single-player
    only (netActive guard): in a duel the peer car is authoritative over
    its own state, so a networked rival takedown is deliberately out of
    scope. Rival takedown pays score and overboost but no clock time (the
    reward is slowing him). And DIABLO now looks nothing like the player:
    a dark, near-black car with ice-cyan accents, a smoked canopy, a big
    rear wing and a lone helmeted driver, versus the red convertible duo.
    Gate growth: rivaltest S9 drifts into the rival and proves he spins
    out, bleeds speed and then recovers; trafftest T11 proves the wreck
    careens forward and stays in view rather than braking to a stop.

v17 FEEL FIXES. Four Director regressions, taken at his word over the
    gates. (1) The wreck still went off screen: careening at only 2600 while
    the player ran at 8000 to 12000, it fell behind within a few frames. Now
    a wrecked car LURCHES forward to just faster than the player (P.speed +
    1400) and eases down slowly, so it careens AHEAD and stays on screen,
    tumbling and shedding debris; takedown slow motion also lengthened
    (SLOWMO_T 0.8, was 0.5) to watch it. Gate: trafftest T11 now asserts the
    wreck is ahead of the player for the whole window. (2) The rival felt
    like clipping through: contact only pushed weakly and a takedown demanded
    a full drift while strictly ahead, which is hard against a same-pace
    rival. Now a rear ram shunts DIABLO forward and costs the player speed
    (solid, no clip), and his takedown fires on a committed swerve (a drift
    OR a hard steer) while alongside or just behind. (3) The turns were not
    steep: curvatures were roughly doubled with a bold S right off the line,
    segment counts unchanged so the lap and clock are untouched, and CENTRIF
    softened (0.23, was 0.33) so the steeper bends stay drivable at speed
    (the first pass over-shoved and dropped the field below lap pace, caught
    by rivaltest and harness). (4) The mirror still showed mostly near road:
    the backward FOV widened (MIR_FOV 1.1, was 1.7), the near clip pushed
    back (MIR_NEAR 240, skipping the tarmac on the bumper), and the horizon
    raised for more sky. A standalone mirror lab ships alongside for dialing
    it on the phone.

v18 LIFTOFF. The big one: a flight set piece. Crossing a marked stretch
    on the ground at speed (liftZ) transforms the car into an After Burner
    style craft: it rises, wings deploy, guns come out of the hood, and the
    whole view becomes open sea and sky. The joystick now flies the craft up,
    down, left and right (input.steerY was added, read from vertical drag);
    the brake button is the vulcan. Enemy craft scale up out of the horizon
    and either get shot down (line the craft under them and fire) or, if you
    do not dodge, ram you: a hit flashes damage, drops the hull bar and
    stalls control for a moment before you fly on. A few enemies loose a shot
    at you too. The flight lasts a fixed duration (FLY_DUR) and then the craft
    descends, retracts and lands, resuming the road race centred on the
    tarmac. Design choices worth recording: the sub mode is single player
    only (a net duel never enters it, since the peer car is authoritative
    over its own state), and while flying, DIABLO advances by the same
    distance as the player so the set piece never silently decides the race
    (the gap is preserved and flight runs at top pace). Gate growth: a whole
    new functional gate, flighttest, drives the trigger, the rise to fly
    transition, a vulcan kill, a control case (an unaligned enemy is NOT a
    kill), a collision that damages and stalls, the landing back to car, and
    the net guard. The chaos harness gained frames to cover the slightly
    longer lap. This is a first flyable slice; enemy variety, formations and
    a proper boss pass are open follow ups.

v19 SEAMLESS LIFTOFF. The Director flew v18 and it felt like being
    teleported into another game: the whole scene cut to a separate sky and
    sea renderer. Fixed by making flight an OVERLAY on the real game instead
    of a replacement. Now the same super scaler track keeps rendering beneath
    (renderWorld, with the road car hidden), and the actual car sprite you
    drive lifts up off the road, grows wings and sprouts guns, then flies,
    with a shrinking shadow on the surface selling the takeoff and a smooth
    rise and descent. The takeoff stretch became a real sea causeway (a new
    seg.sea flag: it renders as water but does NOT drag cars, so the AI is
    never slowed on it), so you lift off over water exactly as described.
    Enemy craft are now the actual rival car flying at you (SPR.rivalFront
    with small wings), not an abstract shape. Nothing about the flight rules
    changed (2D control, vulcan, dodge or shoot, damage and stall, timed
    landing, net guard, gap preserved), so flighttest passes unchanged; a new
    render smoke harness was used to prove the whole flight draws without
    error since rendering is the Director's gate. The causeway shifted the
    lap length slightly; all gates green.

v20 (2026-10-05): THE FRAME LAW (doc 11 v1.04 section 5). The sim steps once
    per drawn frame, and three things counted drawn frames: a flight foe's
    5 percent fire roll (87 percent fired at 60 Hz, 98 at 120, 99 at 144),
    the wreck smoke roll and the duel's every 4th frame send. The two rolls
    now scale by frameDt, the frame's wall clock dt (slow motion never
    slows it, as the old per-frame rolls ran in slow motion too), and the
    duel sends 15 a second of wall clock (NET_HZ, netPace). At 60 Hz
    nothing moved: the seeded harness report and the bots' fast suite match
    v19. frame() draws at most 60 a second (the doc's deadline snippet,
    capReady) and counts what it draws; ?debug on the address shows the FPS
    readout (createFpsMeter, ported). Gate: frametest R1 to R4, red first on
    the pre-fix build (24 FAIL lines); redproof v1.02, 21 of 21. The
    Director's mirror numbers, LIFTOFF calls and clock ruling go to BUILD 21.
    Before it, the clear prep cut while BUILD 20 waited. One error wrapper
    (doc 08 v1.03 section 9): frame() and the test hook both step the sim
    through stepSim(), so a fault inside update() lands in lastError in the
    browser and in every gate alike (redproof v1.01: 16 of 16 caught). The
    dead gear tap is gone (nothing read it since the v14 automatic box;
    DIABLO's v3 94 percent rule and the Z key went with it). The mirror's
    two hardcoded constants are tunables, MIR_HOR 14 and MIR_CAR 1.35,
    beside MIR_FOV, MIR_VSPREAD, MIR_NEAR and MIR_H, so the six mirror lab
    numbers land as six var lines. The lap's hills net zero again (the two
    long descents give back 25 each): since v15 a one-segment 50 unit rise
    at the start line jolted the camera 41 units in one frame at top speed;
    now 0.3. Physics unchanged: the seeded harness report is byte-identical
    to v19.
-->

<style>
  html,body{margin:0;padding:0;background:#05060f;height:100%;overflow:hidden}

<script>
(function(){
'use strict';
var BUILD = 20;

/* ================= TUNABLES (single knob doctrine: name plus intent) ================= */
var W = 320, H = 440;            /* logical canvas, portrait, integer scaled            */
var CY = 176;                    /* projection center Y: where the horizon sits         */
var SEG_LEN = 200;               /* world units per road segment                        */
var ROAD_HW = 1000;              /* road half width; road edges sit at playerX +-1      */
var CAM_H = 520;                 /* camera height: lower feels closer to the tarmac     */
var FOV = 100;                   /* degrees; wider exaggerates speed at screen edges    */
var CAM_DEPTH = 1/Math.tan((FOV/2)*Math.PI/180);
var DRAW_DIST = 200;             /* v15: was 140. segments drawn: reach further to horizon */
var FOG_DENS = 2.4;              /* v15: was 4.2. gentler fog so the road stays visible far */
var MAX_HI = 12000;              /* units/sec top speed in HI gear (shows 293 kmh)      */
var MAX_LO = 7200;               /* LO gear cap: the launch gear                        */
var ACCEL_LO = 5600;             /* approach rate accel in LO: hard launch              */
var ACCEL_HI = 3000;             /* approach rate accel in HI: long pull to the top     */
var BRAKE_DEC = 16000;           /* brake deceleration, units/s^2                       */
var COAST_DEC = 2600;            /* engine braking when off throttle                    */
var OFFROAD_MAX = 3200;          /* speed ceiling while off road: grass is slow, law    */
var OFFROAD_PULL = 4.0;          /* how hard off road drags speed to its ceiling        */

   Portable module: everything between the SSE markers is engine, not game

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function easeIn(a,b,t){return a+(b-a)*t*t;}
function easeInOut(a,b,t){return a+(b-a)*((-Math.cos(t*Math.PI)/2)+0.5);}
function hexRGB(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function mix(h1,h2,t){var a=hexRGB(h1),b=hexRGB(h2);return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';}

var segments=[], trackLen=0;
function segY(i){var n=segments.length;return segments[((i%n)+n)%n].y;}
function lastY(){return segments.length?segments[segments.length-1].y:0;}
function addSeg(curve,y){segments.push({i:segments.length,curve:curve,y:y,sprites:[],clip:0,
 x1:0,y1:0,w1:0,s1:0,z1:0,x2:0,y2:0,w2:0});}
function addStraight(n){var y=lastY(),k;for(k=0;k<n;k++)addSeg(0,y);}
function addRoad(enter,hold,leave,curve,dy){
 var startY=lastY(), endY=startY+dy, total=enter+hold+leave, n;
 for(n=0;n<enter;n++) addSeg(easeIn(0,curve,n/enter), easeInOut(startY,endY,n/total));
 for(n=0;n<hold;n++)  addSeg(curve, easeInOut(startY,endY,(enter+n)/total));
 for(n=0;n<leave;n++) addSeg(easeInOut(curve,0,n/leave), easeInOut(startY,endY,(enter+hold+n)/total));
}
function addSprite(i,name,off,opts){
 opts=opts||{};
 var img=SPR[name],sc=opts.scale||1;
 segments[i].sprites.push({img:img,off:off,name:name,scale:sc,
  solid:(opts.solid===undefined)?true:opts.solid,
  nearCull:opts.nearCull||0,
  hw:(img.width*SPR_UNIT*sc)/(2*ROAD_HW)});
}
var FOGPAL=[];
function buildFog(p){
 FOGPAL.length=0;
 var b,t,f;
 for(b=0;b<32;b++){
  t=b/31; f=1-Math.exp(-t*t*FOG_DENS);
  FOGPAL.push({
   gl:mix(p.grassL,p.fog,f), gd:mix(p.grassD,p.fog,f),
   rl:mix(p.roadL,p.fog,f),  rd:mix(p.roadD,p.fog,f),
   ml:mix(p.rumL,p.fog,f),   md:mix(p.rumD,p.fog,f),
   ln:mix(p.lane,p.fog,f)
  });
 }
}
function trap(g,x1,y1,w1,x2,y2,w2,col){
 g.fillStyle=col; g.beginPath();
 g.moveTo(x1-w1,y1); g.lineTo(x2-w2,y2); g.lineTo(x2+w2,y2); g.lineTo(x1+w1,y1);

var SPR={};
function mkCanvas(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function px(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function dith(g,x,y,w,h,a,b){
 var i,j;
 for(j=0;j<h;j++)for(i=0;i<w;i++){g.fillStyle=((i+j)%2)?a:b;g.fillRect(x+i,y+j,1,1);}
}
function disc(g,cx,cy,r,c){
 g.fillStyle=c;var x,y;
 for(y=-r;y<=r;y++)for(x=-r;x<=r;x++)if(x*x+y*y<=r*r+0.3)g.fillRect(cx+x,cy+y,1,1);
}
function outline(src,col){

 }
 SPR.car=[];SPR.rival=[];

function padSpan(s0,len,kind){var i;for(i=0;i<len;i++)if(segments[s0+i])segments[s0+i].pad=kind;}
function waterSpan(s0,len){var i;for(i=0;i<len;i++)if(segments[s0+i])segments[s0+i].water=true;}

function padCueLead(s0,kind){var i;for(i=1;i<=14;i++)if(segments[s0-i])segments[s0-i].padCue=kind;}
function waterCueLead(s0){var i;for(i=1;i<=14;i++)if(segments[s0-i])segments[s0-i].padCue='water';}
function buildTrack(){
 segments.length=0;
 var R=mulberry32(1337);
 /* THE GAUNTLET (v9): the clean straight stays sacred (no pads, no water,
    no curves: gates plant there), then esses, a hairpin pair, chicanes,
    two fords and two flights. marks.* are gate anchors; keep them honest. */
 /* v12: more and sharper turns, but net length held near the old track so a
    lap still fits under the 65s clock. Straights converted to curves where
    possible; the clean straight stays sacred; marks and pads/fords honest. */
 /* v15: more turns, net length still held near the old track (lap under the
    65s clock). Extra esses and link corners; straights trimmed to pay for
    them. Clean straight sacred; marks and pads/fords honest. */
 /* v17: curvatures roughly doubled so turns read as steep, with a bold S
    right off the line. Segment counts unchanged so lap length (and the 65s
    clock) is untouched; only the bend strength moved. */
 addStraight(30);
 addRoad(40,60,40,-6,0);
 addRoad(40,60,40,6,0);
 addRoad(20,10,20,-8,25);
 var cleanA=segments.length;
 marks.straightZ=(segments.length+12)*SEG_LEN;
 addStraight(140);
 var cleanB=segments.length;
 marks.curveZ=(segments.length+80)*SEG_LEN;
 addRoad(70,110,70,7,0);
 addRoad(30,40,30,-9,40);
 addRoad(30,40,30,9,-40);
 var k;
 for(k=0;k<6;k++) addRoad(20,20,20,(k%2?-8.5:8.5),(k%2?-42:42));
 var fb=segments.length+6;
 addStraight(40);
 marks.boostZ=fb*SEG_LEN;padSpan(fb,6,'boost');padCueLead(fb,'boost');
 addRoad(20,10,20,6,-28);
 addRoad(26,20,26,11,-30);
 addRoad(20,16,20,-4,0);
 addRoad(26,20,26,-11,30);
 addRoad(16,14,16,-6,20);
 addRoad(18,14,18,7,-22);
 var fj=segments.length+8,fw=segments.length+16;
 addStraight(58);
 marks.jumpZ=fj*SEG_LEN;padSpan(fj,6,'jump');padCueLead(fj,'jump');
 marks.waterZ=fw*SEG_LEN;waterSpan(fw,22);
 marks.waterEndZ=(fw+22)*SEG_LEN;waterCueLead(fw);
 for(k=0;k<4;k++) addRoad(14,10,14,(k%2?-8:8),0);
 addRoad(60,80,60,-7,60);
 addRoad(10,10,10,7,-20);
 var ff=segments.length+8;
 addStraight(48);
 waterSpan(ff,18);waterCueLead(ff);
 /* v18: the LIFTOFF stretch. A long marked run the player flies over as open
    sea; the AI just drives it. liftZ..liftEndZ bound the flight. */
 /* v19: the LIFTOFF causeway, a long sea bridge (visual water, no drag so
    the AI is never slowed) that the player lifts OFF of into flight. */
 var flz=segments.length;
 addStraight(60);
 causewaySpan(flz,60);
 marks.liftZ=(flz+8)*SEG_LEN;
 marks.liftEndZ=(flz+52)*SEG_LEN;
 /* v20: the two long descents give back 25 each (-85 to -60 here, -60 to -35 on the run home) so the
    lap's hills net 0 again: since v15 they netted -50, a one-segment 50 unit rise at the start line that
    jolted the camera 41 units in one frame at top speed (the wrap seam law, codex STAGE AND TIME ECONOMY). */
 addRoad(40,70,40,5,-60);
 addRoad(24,18,24,-9,30);
 var fb2=segments.length+8;
 addStraight(40);
 marks.boost2Z=fb2*SEG_LEN;padSpan(fb2,6,'boost');padCueLead(fb2,'boost');
 addRoad(30,36,30,-7,45);
 addRoad(30,36,30,7,-45);
 var fj2=segments.length+8;
 addStraight(52);
 marks.jump2Z=fj2*SEG_LEN;padSpan(fj2,6,'jump');padCueLead(fj2,'jump');
 addRoad(50,80,50,-6,-35);   /* v20: was -60 (the hill ledger, above) */
 addStraight(12);
 addRoad(15,10,15,6,30);
 trackLen=segments.length*SEG_LEN;
 var i,side,off;
 for(i=20;i<segments.length-4;i+=3){
  if(i>=cleanA&&i<cleanB) continue;
  if(R()<0.5){side=R()<0.5?-1:1;off=1.15+R()*1.0;addSprite(i,R()<0.3?'bush':'palm',side*off);}
 }
 for(i=110;i<segments.length-4;i+=110){
  if(i>=cleanA&&i<cleanB) continue;
  addSprite(i,'bill',((i/110)%2?1:-1)*1.35);
 }
 for(i=0;i<8;i++) addSprite(cleanB+90+i*22,'rock',(i%2?-1:1)*(1.6+R()*0.5));
 addSprite(2,'arch',0,{scale:7,solid:false,nearCull:1100});
}

}

function startMusic(){

function schedMusic(){
 if(!audio.ok)return;
 var SPB=60/128/4,s,t,o,g,hs,hp,hg,bo,bg2,lo,lpp,lg;
 while(mus.next<AC.currentTime+0.14){
  s=mus.step%32;t=mus.next;
  if(s%4===0){
   o=AC.createOscillator();g=AC.createGain();
   o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.1);
   g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
   o.connect(g);g.connect(master);o.start(t);o.stop(t+0.13);
  }
  if(HATP[s]){
   hs=AC.createBufferSource();hs.buffer=noiseBuf;
   hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=6500;
   hg=AC.createGain();hg.gain.setValueAtTime(0.07,t);hg.gain.exponentialRampToValueAtTime(0.001,t+0.04);
   hs.connect(hp);hp.connect(hg);hg.connect(master);hs.start(t);hs.stop(t+0.05);
  }
  if(BASSP[s]){
   bo=AC.createOscillator();bg2=AC.createGain();
   bo.type='square';bo.frequency.value=mf(BASSP[s]);
   bg2.gain.setValueAtTime(0.12,t);bg2.gain.exponentialRampToValueAtTime(0.001,t+SPB*0.9);
   bo.connect(bg2);bg2.connect(master);bo.start(t);bo.stop(t+SPB);
  }
  if(LEADP[s]){
   lo=AC.createOscillator();lg=AC.createGain();
   lo.type='square';lo.frequency.value=mf(LEADP[s]);
   lpp=AC.createBiquadFilter();lpp.type='lowpass';lpp.frequency.value=3200;
   lg.gain.setValueAtTime(0.085,t);lg.gain.exponentialRampToValueAtTime(0.001,t+SPB*1.8);
   lo.connect(lpp);lpp.connect(lg);lg.connect(master);lo.start(t);lo.stop(t+SPB*2);
  }
  mus.next+=SPB;mus.step++;

}

/* ================= NET LINK (v6): symmetric state exchange ================= */
/* Both peers run their own car with full local physics and OWN their clock;
   the remote car is written from received state and dead-reckoned between
   packets. The transport is INJECTED (netStart(sendFn)), so the loopback
   gate drives this exact code with an in-memory channel and PeerJS is glue.
   On link loss, DIABLO's brain takes the wheel of the remote car. */
var netActive=false,netSendFn=null,netSendT=0,netUISync=null;
var NET_HZ=15;                   /* v20, THE FRAME LAW (doc 11 section 5): DUEL sends its state 15 times a second of wall clock, at any refresh rate */
function netPace(dt){
 netSendT+=dt;
 if(netSendT>=1/NET_HZ-1e-6){netSendT=Math.min(netSendT-1/NET_HZ,1/NET_HZ);netSendState();}
}
function vName(){return netActive?'RIVAL':RIVAL_NAME;}
function netStart(sendFn){netSendFn=sendFn;netActive=true;netSendT=0;}
function netStop(msg){
 if(!netActive)return;

 if(msg)show(msg,2.0);
}
function netRaceBegin(){if(state!=='GAME')startGame();}
function netSendState(){
 if(!netSendFn)return;
 try{netSendFn({c:[P.pos,P.x,P.speed,P.gear,P.vsteer,P.vbrake?1:0,P.lap,P.crashes,P.alt]});}catch(e){}
}
function netReceive(m){
 if(!netActive)return;
 if(!m||typeof m!=='object')return;
 if(m.go&&state==='TITLE'){startGame();return;}
 var c=m.c;
 if(c&&c.length>=8){
  V.pos=+c[0]||0;V.x=+c[1]||0;V.speed=+c[2]||0;V.gear=c[3]?1:0;
  V.vsteer=+c[4]||0;V.vbrake=!!c[5];V.lap=(+c[6])|0;V.crashes=(+c[7])|0;V.alt=+c[8]||0;
 }
}
function netDrift(dt){
 V.pos+=V.speed*dt;
 if(V.pos>=trackLen){V.pos-=trackLen;V.lap++;}
}

/* One physics routine, two cars. Identical to the v1 player model, operating
   on a car struct; player-only side effects (sfx, flash, shake, vibration)
   are gated on isP. Returns true on a lap wrap. */
function stepCar(c,inp,dt,isP){
 if(c.spinT>0){
  c.spinT-=dt;
  c.spin+=dt*13;
  c.speed+=(1300-c.speed)*Math.min(1,dt*1.1);          /* bleed speed: he loses ground */
  c.x+=(c.spinVx||0)*dt;c.spinVx=(c.spinVx||0)*(1-Math.min(1,dt*1.0));
  c.x=clamp(c.x,-1.35,1.35);        /* spins out to the shoulder, not deep grass */
  c.pos+=c.speed*dt;if(c.pos>=trackLen){c.pos-=trackLen;c.lap++;}
  if(c.spinT<=0)c.spin=0;
  return false;
 }
 var ng=c.speed>SHIFT_UP?1:(c.speed<SHIFT_DOWN?0:c.gear);
 if(ng!==c.gear){c.gear=ng;if(isP)sfxShift();}
 var bs=baseSegOf(c.pos);
 var wantDrift=inp.brake&&c.speed>DRIFT_MIN;
 c.drift+=((wantDrift?1:0)-c.drift)*Math.min(1,dt*DRIFT_RAMP);
 if(c.surgeT>0)c.surgeT-=dt;
 var cap=(c.gear?MAX_HI:MAX_LO)*(inp.capMul||1)*(c.surgeT>0?SURGE_MUL:1),acc=c.gear?ACCEL_HI:ACCEL_LO;
 var offFast=c.alt<=0&&Math.abs(c.x)>1.02&&c.speed>OFFROAD_MAX;
 if(inp.throttle&&!offFast)c.speed+=acc*(1-c.speed/cap)*dt;
 else if(inp.brake)c.speed-=((c.drift>0.15&&c.speed>DRIFT_MIN)?DRIFT_DEC:BRAKE_DEC)*dt;
 else if(!inp.throttle)c.speed-=COAST_DEC*dt;
 if(c.speed<0)c.speed=0;
 if(offFast){
  c.speed+=(OFFROAD_MAX-c.speed)*Math.min(1,dt*OFFROAD_PULL);
  if(isP)shake=0.1;
 }
 var sp=c.speed/MAX_HI;
 c.x+=inp.steer*dt*STEER_RATE*(0.35+0.65*sp)*(1+c.drift*DRIFT_STEER);
 c.x-=dt*sp*bs.curve*CENTRIF;
 c.x=clamp(c.x,-2.4,2.4);
 c.pos+=c.speed*dt;
 var wrapped=false;
 if(c.pos>=trackLen){c.pos-=trackLen;c.lap++;wrapped=true;}
 if(c.alt>0||c.vy>0){
  c.vy-=GRAV*dt;
  c.alt+=c.vy*dt;
  if(c.alt<=0){c.alt=0;c.vy=0;if(isP&&c.speed>1200)shake=Math.max(shake,0.12);}
 }else{
  var fseg=baseSegOf(c.pos+PLAYER_Z);
  if(fseg.pad!=='boost')c.onBoost=false;
  if(fseg.pad==='jump'&&c.speed>1500){
   c.vy=JUMP_VY;c.alt=0.001;
   if(isP)sfxTone(300,0.3,'square',0.12,900);
  }else if(fseg.pad==='boost'){
   if(!c.onBoost){
    c.onBoost=true;
    c.speed=Math.min((c.gear?MAX_HI:MAX_LO)*SURGE_MUL,c.speed+1800);
    if(isP)sfxTone(520,0.25,'sawtooth',0.12,1200);
   }
   c.surgeT=BOOST_T;
  }else if(fseg.water){
   if(c.speed>WATER_MAX)c.speed+=(WATER_MAX-c.speed)*Math.min(1,dt*2.5);
   if(isP)shake=Math.max(shake,0.05);
  }
 }
 if(c.collideT>0)c.collideT-=dt;
 else if(c.alt<=0){
  var pseg=baseSegOf(c.pos+PLAYER_Z),j,spr;
  for(j=0;j<pseg.sprites.length;j++){
   spr=pseg.sprites[j];
   if(!spr.solid)continue;
   if(Math.abs(c.x-spr.off)<spr.hw+CAR_HW){
    if(c.speed>900){
     c.speed=Math.max(700,c.speed*CRASH_KEEP);c.crashes++;c.collideT=CRASH_COOLDOWN;
     c.x+=(c.x<spr.off?-0.07:0.07);
     if(isP){
      crashFlash=0.55;shake=0.3;sfxCrash();
      if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate(60);
     }
    }
    break;
   }
  }
 }
 c.bgShift+=bs.curve*sp*dt*30;
 c.vsteer=inp.steer;c.vbrake=!!inp.brake;
 return wrapped;
}
/* DIABLO's brain: inside racing line via lookahead, solid-sprite avoidance,
   centrifugal feed-forward steering, one upshift near the LO cap, and an
   arcade rubber band on the speed cap keyed to the gap to the player. */
function rivalAI(){
 var here=baseSegOf(V.pos+PLAYER_Z);
 var look=baseSegOf(V.pos+PLAYER_Z+1800);
 var sp=V.speed/MAX_HI;
 var target=clamp(-look.curve*0.16,-0.75,0.75);
 var ci=Math.floor((((V.pos+PLAYER_Z)%trackLen)+trackLen)%trackLen/SEG_LEN),n=segments.length,k,sgm,j,spr;
 for(k=2;k<=14;k++){
  sgm=segments[(ci+k)%n];
  for(j=0;j<sgm.sprites.length;j++){
   spr=sgm.sprites[j];
   if(!spr.solid)continue;
   if(Math.abs(spr.off-target)<spr.hw+0.35){
    target=clamp(spr.off+(target<=spr.off?-1:1)*(spr.hw+0.5),-0.9,0.9);
   }
  }
 }
 var ti,tt,td;
 for(ti=0;ti<traffic.length;ti++){
  tt=traffic[ti];if(tt.crashed>0)continue;
  td=((tt.pos-V.pos)%trackLen+trackLen)%trackLen;
  if(td>300&&td<2600&&Math.abs(tt.x-target)<0.45){
   target=clamp(tt.x+(target<=tt.x?-0.75:0.75),-0.9,0.9);
  }
 }
 var ff=here.curve*sp*CENTRIF/(STEER_RATE*(0.35+0.65*sp));
 rinput.steer=clamp(ff+(target-V.x)*2.5,-1,1);
 var dz=progress(P)-progress(V);
 /* piecewise band (v7): gentle slope while chasing, steep leash while
    leading, so the race stays on the player's screen at any skill level */
 rinput.capMul=dz>=0?clamp(1+dz*RB_GAIN,1,RB_MAX):clamp(1+dz*RB_GAIN_LEAD,RB_MIN,1);
 /* v20: the v3 gear tap (94 percent of his effective LO cap) is gone. Since v14
    every car shifts itself in stepCar (SHIFT_UP / SHIFT_DOWN) and nothing read it. */
}

  P.x-=dt*sp*bs.curve*CENTRIF*0.5;

  if(fly.active){ stepFlight(sdt); }

function crashTraffic(t){
 t.crashed=2.4;t.spin=0;
 t.wreckVx=(t.x>=0?1:-1)*2.4;                           /* keep sliding off to that side */
 t.speed=Math.max(t.speed,P.speed+1400);               /* v17: lurch forward, careen AHEAD of the player (stay on screen) */
 fx.push({pos:t.pos,x:t.x,t:0});
 fx.push({pos:t.pos+30,x:t.x+(t.x>=0?0.18:-0.18),t:0});
 if(t.touchT<TD_WINDOW){
  takedowns++;time+=TD_BONUS;score+=500;P.surgeT=Math.max(P.surgeT,TD_SURGE);
  show('TAKEDOWN!  +'+TD_BONUS+'s',1.5);
  sfxCrash();sfxWhoosh();
 }
}
function stepTraffic(dt){
 var i,t,pseg,j,spr;
 for(i=0;i<fx.length;i++)fx[i].t+=dt;
 fx=fx.filter(function(b){return b.t<0.6;});
 for(i=0;i<traffic.length;i++){
  t=traffic[i];
  t.touchT+=dt;
  if(t.crashed>0){
   t.crashed-=dt;
   t.spin+=dt*15;                                       /* fast tumble */
   t.speed+=(2200-t.speed)*Math.min(1,dt*0.5);          /* ease down slowly so it holds ahead while it tumbles */
   t.x+=(t.wreckVx||0)*dt;t.wreckVx=(t.wreckVx||0)*(1-Math.min(1,dt*0.9));
   t.x=clamp(t.x,-2.6,2.6);                              /* spun out on the shoulder */
   t.pos+=t.speed*dt;if(t.pos>=trackLen)t.pos-=trackLen;
   if(Math.random()<0.18*frameDt*60)fx.push({pos:t.pos,x:t.x+(Math.random()-0.5)*0.25,t:0});  /* v20: 10.8 puffs a second at any refresh rate */
   if(t.crashed<=0){
    t.pos=(P.pos+30000+i*900)%trackLen;if(t.pos<0)t.pos+=trackLen;
    t.lane=clamp(t.lane,-0.55,0.55);
    t.x=t.lane;t.speed=t.cruise;t.touchT=99;t.crashed=0;t.vx=0;t.wreckVx=0;
   }
   continue;
  }
  if(t.touchT<0.5){
   t.x+=t.vx*dt;
   t.vx*=Math.max(0,1-dt*1.6);
  }else{
   t.vx=0;
   t.x+=(t.lane+Math.sin(tGlobal*0.5+t.seed*2.1)*0.06-t.x)*Math.min(1,dt*2.0);
  }
  if(Math.abs(t.x)>1.02)t.speed+=(1500-t.speed)*Math.min(1,dt*3);
  else t.speed+=(t.cruise-t.speed)*Math.min(1,dt*0.8);
  t.pos+=t.speed*dt;if(t.pos>=trackLen)t.pos-=trackLen;
  if(Math.abs(t.x)>1.15){crashTraffic(t);continue;}
  var q,o,od,odx,op;
  for(q=i+1;q<traffic.length;q++){
   o=traffic[q];if(o.crashed>0)continue;
   od=((o.pos-t.pos)%trackLen+trackLen)%trackLen;if(od>trackLen/2)od-=trackLen;
   if(Math.abs(od)>=240)continue;
   odx=t.x-o.x;if(Math.abs(odx)>=0.34)continue;
   op=(odx>=0?1:-1)*(0.34-Math.abs(odx))*2.4*dt;
   t.x=clamp(t.x+op,-0.95,0.95);
   o.x=clamp(o.x-op,-0.95,0.95);
  }
  pseg=baseSegOf(t.pos+PLAYER_Z);
  for(j=0;j<pseg.sprites.length;j++){
   spr=pseg.sprites[j];
   if(!spr.solid)continue;
   if(Math.abs(t.x-spr.off)<spr.hw+CAR_HW){crashTraffic(t);break;}
  }
 }
}
function playerVsTraffic(dt){
 var i,t,d,dx,dir,rel,into,drifting,ahead,pushT,pushP;
 if(P.alt>0)return;
 for(i=0;i<traffic.length;i++){
  t=traffic[i];
  if(t.crashed>0)continue;
  d=((t.pos-P.pos)%trackLen+trackLen)%trackLen;
  if(d>trackLen/2)d-=trackLen;
  dx=P.x-t.x;
  if(Math.abs(d)>=270||Math.abs(dx)>=0.46)continue;
  dir=(t.x>=P.x)?1:-1;
  rel=P.speed/MAX_HI;
  into=(input.steer*dir)>0.35;
  drifting=P.drift>0.35;
  ahead=d>-20;
  /* v14: a takedown REQUIRES a drift into a car you are beside or ahead of
     (drift + angle in). The impact fires HERE, at contact, while the victim
     is on screen ahead, not later when it finally leaves the road behind. */
  if(drifting&&into&&ahead&&rel>0.3){
   t.vx=dir*(4.2+3.6*rel);
   t.x+=dir*3.4*dt*(rel+0.3);
   P.x=clamp(P.x-dir*0.4*dt,-2.4,2.4);
   t.touchT=0;
   slowmoT=SLOWMO_T;tdFlash=0.35;shake=0.7;
   if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate([40,30,90]);
  }else if(d>50&&P.speed>t.speed+400&&Math.abs(dx)<0.20&&P.collideT<=0){
   /* straight ram into a slower car with no drift: your crash. drift, do not ram. */
   P.speed=Math.max(700,P.speed*CRASH_KEEP);P.collideT=CRASH_COOLDOWN;P.crashes++;
   crashFlash=0.55;shake=0.3;sfxCrash();
   if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate(60);
   t.speed+=1500;t.touchT=0;
  }else{
   /* any other side touch: mutual shove, capped on the road, never a kill. */
   pushT=1.7+1.5*rel;pushP=1.0+0.7*rel;
   t.vx=0;
   t.x=clamp(t.x+dir*pushT*dt,-0.85,0.85);
   P.x=clamp(P.x-dir*pushP*dt,-2.4,2.4);
   t.touchT=0;
   if(shake<0.07)shake=0.07;
  }
 }
}
function playerVsRival(dt){
 /* single-player only: the AI rival can be taken down. In a duel the peer car
    is authoritative over its own state, so this stays off (netActive guard). */
 if(netActive||P.alt>0||V.spinT>0)return;
 var d=((V.pos-P.pos)%trackLen+trackLen)%trackLen;if(d>trackLen/2)d-=trackLen;
 var dx=P.x-V.x;
 if(Math.abs(d)>=270||Math.abs(dx)>=0.5)return;
 var dir=(V.x>=P.x)?1:-1,rel=P.speed/MAX_HI;
 /* a takedown of the rival needs a committed swerve into him (a drift, or a
    hard steer) while alongside or just behind, at speed. He is your pace, so
    the strict "must be ahead" rule is relaxed to catch him. */
 var into=(input.steer*dir)>0.35,committed=P.drift>0.3||Math.abs(input.steer)>0.6,alongside=d>-160;
 if(into&&committed&&alongside&&rel>0.4){
  V.spinT=1.5;V.spin=0;V.spinVx=dir*2.2;
  V.x=clamp(V.x+dir*0.12,-2.4,2.4);
  P.x=clamp(P.x-dir*0.4*dt,-2.4,2.4);
  slowmoT=SLOWMO_T;tdFlash=0.35;shake=0.7;
  takedowns++;score+=500;P.surgeT=Math.max(P.surgeT,TD_SURGE);
  show('RIVAL WRECKED!',1.6);sfxCrash();sfxWhoosh();
  if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate([40,30,90]);
 }else if(d>40&&P.speed>V.speed+300&&Math.abs(dx)<0.24){
  /* solid rear contact: you shunt him forward and lose some speed (no clip-through) */
  V.speed+=900;V.x=clamp(V.x+dir*0.4*dt,-2.4,2.4);
  P.speed=Math.max(700,P.speed*0.78);
  if(shake<0.2)shake=0.2;sfxCrash();
  if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate(40);
 }else{
  V.x=clamp(V.x+dir*(1.6+1.3*rel)*dt,-1.05,1.05);
  P.x=clamp(P.x-dir*(1.1+0.7*rel)*dt,-2.4,2.4);
  if(shake<0.08)shake=0.08;
 }
}
/* Rear mirror model: pure logic so the gate chain can see it. Returns null
   when DIABLO is not visible behind the player, else his mirror placement:
   t (0 on the bumper, 1 at range edge), scale, and signed lateral offset. */

 return {t:t,scale:1-0.82*t,dx:V.x-P.x};
}

/* True rendered rear view (v11 rewrite): a compact backward projector that
   parallels the forward renderer EXACTLY (world x curve accumulation, road
   half width s*ROAD_HW*scale, no stray divisors), so the strip reads as real
   road. MIR_CURVE flips the perceived bend direction if the eye disagrees. */
var MIR_CURVE=-1;      /* bend sign knob */
var MIR_FOV=1.1;       /* v17: wider backward FOV so it shows distance, not a magnified near slab */
var MIR_VSPREAD=11500; /* look-down / foreground amount */
var MIR_NEAR=240;      /* v17: nearest road shown, units behind (skips the tarmac on your bumper) */
var MIR_H=54;          /* mirror glass height */
var MIR_HOR=14;        /* v20: horizon drop inside the glass, px below its top (was the hardcoded MY+14) */
var MIR_CAR=1.35;      /* v20: car size divisor in the glass (was the hardcoded /1.35) */
function drawMirror(g){
 var MW=130,MH=MIR_H,MX=Math.round(W/2-MW/2),MY=4,PL=pal();
 g.fillStyle='#8f97a4';g.fillRect(MX-2,MY-2,MW+4,MH+4);
 g.fillStyle='#10121a';g.fillRect(MX-1,MY-1,MW+2,MH+2);
 g.save();g.beginPath();g.rect(MX,MY,MW,MH);g.clip();
 var n=segments.length;
 var mbase=Math.floor(P.pos/SEG_LEN),mfrac=(P.pos%SEG_LEN)/SEG_LEN;
 var camXm=P.x*ROAD_HW,MD=CAM_DEPTH*MIR_FOV,MSC=MW/2;
 var horizonY=MY+MIR_HOR,bottomY=MY+MH,MSEG=Math.floor(MIRROR_RANGE/SEG_LEN);
 var skn=SPR.skins[(stage-1)%SPR.skins.length];
 /* sky and a distant ridge behind the horizon line */
 var sg=g.createLinearGradient(0,MY,0,horizonY+6);
 sg.addColorStop(0,PL.skyT);sg.addColorStop(1,PL.skyB);
 g.fillStyle=sg;g.fillRect(MX,MY,MW,horizonY-MY+6);
 g.fillStyle=PL.mtn;g.fillRect(MX,horizonY-2,MW,3);
 /* boundary tables: world centerline (xw), screen center (cx), screen y
    (cy), road half width (cw), built once, far tables reused for objects */
 var k,seg,z,s,xw=[],cx=[],cy=[],cw=[],xacc=0,dxacc=0;
 for(k=0;k<=MSEG;k++){
  z=(k+mfrac)*SEG_LEN+MIR_NEAR;s=MD/z;
  xw[k]=xacc;
  cx[k]=MX+MW/2+s*(xacc-camXm)*MSC;
  cy[k]=horizonY+s*MIR_VSPREAD;
  cw[k]=s*ROAD_HW*MSC;
  seg=segments[((mbase-k-1)%n+n)%n];
  dxacc+=seg.curve*MIR_CURVE;xacc+=dxacc;
 }
 /* ground and road, far to near */
 for(k=MSEG;k>=1;k--){
  seg=segments[((mbase-k)%n+n)%n];
  if(cy[k-1]<=cy[k])continue;
  g.fillStyle=(seg.i%8)<4?PL.grassL:PL.grassD;
  g.fillRect(MX,Math.round(cy[k]),MW,Math.max(1,Math.round(cy[k-1]-cy[k])+1));
  trap(g,cx[k],cy[k],cw[k],cx[k-1],cy[k-1],cw[k-1],(seg.i%8)<4?PL.roadL:PL.roadD);
  if((seg.i%8)<4&&cw[k]>3){
   trap(g,cx[k],cy[k],Math.max(1,cw[k]*0.03),cx[k-1],cy[k-1],Math.max(1,cw[k-1]*0.03),PL.lane);
  }
  if(seg.pad){
   trap(g,cx[k],cy[k],cw[k]*0.7,cx[k-1],cy[k-1],cw[k-1]*0.7,seg.pad==='boost'?'#37e0ff':'#ffd23d');
  }else if(seg.water){
   trap(g,cx[k],cy[k],cw[k],cx[k-1],cy[k-1],cw[k-1],'#2e78dc');
  }
 }
 /* project an object at distance zb behind, lateral ox, onto the road */
 function proj(zb,ox){
  if(zb<=MIR_NEAR||zb>=MIRROR_RANGE)return null;
  var kf=clamp((zb-MIR_NEAR)/SEG_LEN-mfrac,0,MSEG-0.001);
  var k0=Math.floor(kf),tf=kf-k0,ss=MD/zb;
  var xwAt=lerp(xw[k0],xw[k0+1],tf);
  return {sx:MX+MW/2+ss*(xwAt+ox*ROAD_HW-camXm)*MSC,sy:lerp(cy[k0],cy[k0+1],tf),s:ss};
 }
 /* roadside scenery behind, mid range only to keep the strip legible */
 var i,j,spr,im,pr,dw,dh;
 for(k=MSEG;k>=2;k--){
  seg=segments[((mbase-k)%n+n)%n];
  if(!seg.sprites.length)continue;
  pr=proj((k+mfrac)*SEG_LEN+40,0);
  if(!pr)continue;
  for(j=0;j<seg.sprites.length;j++){
   spr=seg.sprites[j];
   im=(skn&&skn[spr.name])?skn[spr.name]:spr.img;
   dw=im.width*SPR_UNIT*(spr.scale||1)*pr.s*MSC/1.8;
   if(dw<2||dw>MW*0.6)continue;
   dh=im.height*SPR_UNIT*(spr.scale||1)*pr.s*MSC/1.8;
   var spx=cx[k]+pr.s*(spr.off*ROAD_HW)*MSC;
   g.drawImage(im,Math.round(spx-dw/2),Math.round(pr.sy-dh),Math.round(dw),Math.round(dh));
  }
 }
 /* traffic behind, then the rival, on the road at true depth */
 var t,tmd,tp,tim,tw,th;
 for(i=0;i<traffic.length;i++){
  t=traffic[i];
  tmd=((P.pos-t.pos)%trackLen+trackLen)%trackLen;if(tmd>trackLen/2)tmd-=trackLen;
  tp=proj(tmd,t.x);if(!tp)continue;
  tim=SPR.traffic[t.type][t.tint].rear;
  tw=tim.width*SPR_UNIT*tp.s*MSC/MIR_CAR;th=tim.height*SPR_UNIT*tp.s*MSC/MIR_CAR;
  if(tw>2)g.drawImage(tim,Math.round(tp.sx-tw/2),Math.round(tp.sy-th),Math.round(tw),Math.round(th));
 }
 var mv=mirrorView();
 if(mv){
  var rp=proj(progress(P)-progress(V),V.x);
  if(rp){
   var rf=SPR.rivalFront,rw2=rf.width*SPR_UNIT*rp.s*MSC/MIR_CAR,rh2=rf.height*SPR_UNIT*rp.s*MSC/MIR_CAR;
   if(rw2>2)g.drawImage(rf,Math.round(rp.sx-rw2/2),Math.round(rp.sy-rh2),Math.round(rw2),Math.round(rh2));
  }
 }
 g.restore();
 g.fillStyle='rgba(255,255,255,0.10)';g.fillRect(MX,MY,MW,3);
}

function startFlight(){
  fly.active=true;fly.phase='RISE';fly.t=0;
  fly.cx=W/2;fly.cy=H*0.55;fly.vx=0;fly.vy=0;
  fly.hp=FLY_HP;fly.stall=0;fly.gun=0;fly.fireCd=0;fly.spawnCd=0.7;
  fly.foes.length=0;fly.bul.length=0;fly.ebul.length=0;fly.boom.length=0;
  fly.kills=0;fly.banner=2.2;
  fly.posRate=MAX_HI;                    /* fly at top pace so the set piece is never a pace penalty (gap preserved) */
  P.alt=0;P.vy=0;shake=0.5;sfxLift();
}
function foeScale(fo){ return lerp(0.25,2.7,1-fo.z); }
function spawnFoe(){ fly.foes.push({z:1,lane:(Math.random()*2-1)*0.85,hp:2,fired:false,sx:W/2,sy:H*FLY_HORIZON,dead:false}); }
function fireVulcan(){
  fly.bul.push({x:fly.cx-9,y:fly.cy-8,vx:fly.vx*0.25,vy:-FLY_BULLET_V});
  fly.bul.push({x:fly.cx+9,y:fly.cy-8,vx:fly.vx*0.25,vy:-FLY_BULLET_V});
  sfxShot();
}
function hitCraft(){
  if(fly.stall>0)return;
  fly.hp=Math.max(1,fly.hp-FLY_HIT_DMG);
  fly.stall=FLY_STALL;tdFlash=0.4;shake=0.7;fly.vx*=0.3;fly.vy*=0.3;sfxCrash();
  if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate([60,40,60]);
}
function flightBullets(dt){
  var i,b,jj,fo;
  for(i=fly.bul.length-1;i>=0;i--){ b=fly.bul[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-12){ fly.bul.splice(i,1);continue; }
    for(jj=fly.foes.length-1;jj>=0;jj--){ fo=fly.foes[jj];if(fo.dead)continue;
      var rw=22*foeScale(fo);
      if(Math.abs(b.x-fo.sx)<rw*0.6&&Math.abs(b.y-fo.sy)<rw*0.6){
        fo.hp--;fly.bul.splice(i,1);
        if(fo.hp<=0){ fo.dead=true;fly.boom.push({x:fo.sx,y:fo.sy,t:0,s:foeScale(fo)});fly.kills++;sfxBoom(); }
        break;
      }
    }
  }
  for(i=fly.ebul.length-1;i>=0;i--){ b=fly.ebul[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y>H+12||b.x<-12||b.x>W+12){ fly.ebul.splice(i,1);continue; }
    if(Math.abs(b.x-fly.cx)<12&&Math.abs(b.y-fly.cy)<12){ hitCraft();fly.ebul.splice(i,1); }
  }
  for(i=fly.boom.length-1;i>=0;i--){ fly.boom[i].t+=dt;if(fly.boom[i].t>0.5)fly.boom.splice(i,1); }
}
function flightFoes(dt,landing){
  var HZ=H*FLY_HORIZON;
  for(var i=fly.foes.length-1;i>=0;i--){ var fo=fly.foes[i];
    if(fo.dead){ fly.foes.splice(i,1);continue; }
    fo.z-=FLY_FOE_V*dt*(landing?1.8:1);
    var t=1-fo.z;
    fo.sx=W/2+fo.lane*(W*0.52)*t;
    fo.sy=HZ-6+t*(H*0.58);
    var sc=foeScale(fo);
    if(!landing&&!fo.fired&&fo.z<0.55&&fo.z>0.32&&Math.random()<1-Math.pow(0.95,frameDt*60)){  /* v20: the 60 Hz odds (5% a 60th) at any refresh rate */
      fo.fired=true;var ang=Math.atan2(fly.cy-fo.sy,fly.cx-fo.sx);
      fly.ebul.push({x:fo.sx,y:fo.sy,vx:Math.cos(ang)*270,vy:Math.sin(ang)*270});sfxEShot();
    }
    if(!landing&&sc>1.15&&Math.abs(fo.sx-fly.cx)<18*sc&&Math.abs(fo.sy-fly.cy)<14*sc){
      hitCraft();fo.dead=true;fly.boom.push({x:fo.sx,y:fo.sy,t:0,s:sc});continue;
    }
    if(fo.z<=0){ fly.foes.splice(i,1); }
  }
}
function stepFlight(dt){
  fly.t+=dt;
  var dpos=(fly.posRate||6000)*dt;
  P.pos+=dpos;if(P.pos>=trackLen){P.pos-=trackLen;P.lap++;}
  V.pos+=dpos;if(V.pos>=trackLen){V.pos-=trackLen;V.lap++;}  /* DIABLO flies alongside: the set piece stays fair */
  distance+=dpos;score+=dpos*0.005;
  if(fly.banner>0)fly.banner-=dt;
  var HZ=H*FLY_HORIZON;
  if(fly.phase==='RISE'){
    fly.gun=Math.min(1,fly.gun+dt/FLY_RISE_T);
    if(fly.t>=FLY_RISE_T){ fly.phase='FLY';fly.t=0; }
    return;
  }
  if(fly.phase==='LAND'){
    fly.gun=Math.max(0,fly.gun-dt/FLY_LAND_T);
    flightBullets(dt);flightFoes(dt,true);
    if(fly.t>=FLY_LAND_T){ fly.active=false;P.x=0;P.speed=Math.max(P.speed,MAX_LO);sfxLand(); }
    return;
  }
  if(fly.t>=FLY_DUR){ fly.phase='LAND';fly.t=0; return; }
  if(fly.stall>0){ fly.stall-=dt; }
  else {
    fly.vx+=(input.steer||0)*FLY_ACCEL*dt;
    fly.vy+=(input.steerY||0)*FLY_ACCEL*dt;
    if(input.brake&&fly.fireCd<=0){ fireVulcan();fly.fireCd=FLY_FIRE_CD; }
  }
  fly.fireCd-=dt;
  var damp=Math.pow(FLY_DAMP,dt*60);
  fly.vx*=damp;fly.vy*=damp;
  fly.cx+=fly.vx*dt;fly.cy+=fly.vy*dt;
  fly.cx=clamp(fly.cx,20,W-20);fly.cy=clamp(fly.cy,H*0.40,H-46);
  fly.spawnCd-=dt;
  if(fly.spawnCd<=0){ spawnFoe();fly.spawnCd=FLY_SPAWN*(0.7+Math.random()*0.7); }
  flightBullets(dt);flightFoes(dt,false);
}

    }
  }
  if(img) g.drawImage(img,Math.round(x-cw/2),Math.round(y-ch/2),Math.round(cw),Math.round(ch));
  else { g.fillStyle='#e42a2a';g.fillRect(Math.round(x-11),Math.round(y-9),22,18); }
  if(stalled&&(Math.floor(tGlobal*20)%2===0)){ g.fillStyle='rgba(255,120,120,0.5)';g.fillRect(Math.round(x-cw/2),Math.round(y-ch/2),Math.round(cw),Math.round(ch)); }
}
function renderFlight(g){
  /* OVERLAY only: renderWorld has already drawn the real track (the sea
     causeway) beneath with the player hidden. Here we lift the actual car
     off it, fly it, and draw the enemies and HUD on top. No separate scene. */
  var j;
  var roadX=W/2, roadY=H-100;                 /* where the car sits on the road */
  var cx=fly.cx, cy=fly.cy, wing=fly.gun;
  var dx=cx, dy=cy;
  if(fly.phase==='RISE'){ var tr=Math.max(0,Math.min(1,fly.t/FLY_RISE_T)); var e=tr*tr*(3-2*tr);
    dx=roadX+(cx-roadX)*e; dy=roadY+(cy-roadY)*e; }
  else if(fly.phase==='LAND'){ var tl=Math.max(0,Math.min(1,fly.t/FLY_LAND_T)); var e2=tl*tl*(3-2*tl);
    dx=cx+(roadX-cx)*e2; dy=cy+(roadY-cy)*e2; }
  var lift=Math.max(0,Math.min(1,(roadY-dy)/150));
  if(lift>0.03){                              /* a shrinking shadow on the water sells the takeoff */
    g.save();g.globalAlpha=0.30*(1-lift*0.5);g.fillStyle='#04060c';
    var shw=Math.max(6,20*(1-lift*0.55));
    g.beginPath();g.ellipse(roadX+(dx-roadX)*0.35, roadY+16, shw, shw*0.34, 0,0,6.283);g.fill();g.restore();
  }
  for(j=0;j<fly.foes.length;j++){ drawFoe(g,fly.foes[j].sx,fly.foes[j].sy,foeScale(fly.foes[j])); }
  g.fillStyle='#ff5a4a';
  for(j=0;j<fly.ebul.length;j++){ g.fillRect(fly.ebul[j].x-2,fly.ebul[j].y-2,4,4); }
  g.fillStyle='#ffe24a';
  for(j=0;j<fly.bul.length;j++){ g.fillRect(fly.bul[j].x-1,fly.bul[j].y-6,3,8); }
  drawCraft(g,dx,dy,wing,fly.stall>0);
  for(j=0;j<fly.boom.length;j++){ drawBoom(g,fly.boom[j].x,fly.boom[j].y,fly.boom[j].t,fly.boom[j].s); }
  /* flight HUD */
  g.fillStyle='#20242c';g.fillRect(8,H-16,92,8);
  g.fillStyle=fly.hp>40?'#4aff7a':'#ff5a4a';g.fillRect(8,H-16,92*(fly.hp/FLY_HP),8);
  g.fillStyle='#cfe0f5';g.font='7px monospace';g.textAlign='left';g.fillText('HULL',10,H-20);
  g.textAlign='right';g.fillStyle='#ffd23d';g.font='bold 10px monospace';g.fillText('SHOT DOWN '+fly.kills,W-8,16);
  g.textAlign='center';g.fillStyle=time<10?'#ff5a4a':'#ffffff';g.font='bold 16px monospace';g.fillText(Math.ceil(time),W/2,18);
  var msgY=H*0.30;
  if(fly.banner>0){ g.fillStyle='#3ce0ff';g.font='bold 22px monospace';g.globalAlpha=Math.min(1,fly.banner);g.fillText('LIFTOFF',W/2,msgY);g.globalAlpha=1; }
  else if(fly.phase==='LAND'){ g.fillStyle='#ffd23d';g.font='bold 14px monospace';g.fillText('LANDING',W/2,msgY); }
  else if(fly.stall>0){ g.fillStyle='#ff5a4a';g.font='bold 14px monospace';g.fillText('HIT!  STALLING',W/2,msgY); }
}

function render(){
 if(!ctx)return;
 var g=ctx;
 var samp=Math.min(1,shake*2.4);
 var shx=shake>0?Math.round((Math.random()*2-1)*6*samp):0;
 var shy=shake>0?Math.round((Math.random()*2-1)*4*samp):0;
 g.save();g.translate(shx,shy);
 var pBlink=crashFlash>0&&(Math.floor(tGlobal*18)%2===0);
 if(state==='TITLE'){
  renderWorld(g,0,0,W,H,{pos:P.pos,x:P.x,bgShift:P.bgShift,prog:progress(P)},P,null,input.steer,false,false);
 } else if(fly.active){
  renderWorld(g,0,0,W,H,{pos:P.pos,x:P.x,bgShift:P.bgShift,prog:progress(P)},P,null,0,false,true);
  renderFlight(g);
 } else {
  renderWorld(g,0,0,W,H,{pos:P.pos,x:P.x,bgShift:P.bgShift,prog:progress(P)},P,worldEnts(),input.steer,input.brake&&state==='GAME',pBlink);
 }
 g.restore();
 if(slowmoT>0){
  var sa=Math.min(0.6,slowmoT*1.3),cx=W/2,cy=H*0.52,k,ang,r0,r1;
  g.strokeStyle='rgba(255,255,255,'+(sa*0.6)+')';g.lineWidth=2;
  for(k=0;k<18;k++){
   ang=k/18*6.283+tGlobal*0.6;
   r0=70+((tGlobal*260+k*47)%150);
   r1=r0+46;
   g.beginPath();
   g.moveTo(cx+Math.cos(ang)*r0,cy+Math.sin(ang)*r0);
   g.lineTo(cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1);
   g.stroke();
  }
  g.fillStyle='rgba(6,8,18,'+(sa*0.35)+')';
  g.fillRect(0,0,W,26);g.fillRect(0,H-26,W,26);
 }
 if(tdFlash>0){
  g.fillStyle='rgba(255,255,255,'+Math.min(0.85,tdFlash*2.4)+')';
  g.fillRect(0,0,W,H);
 }
 drawHUD(g);
}

/* ================= DOM, INPUT, BOOT ================= */
function fit(){
 if(typeof window==='undefined'||!cv)return;
 var iw=window.innerWidth,ih=window.innerHeight;
 var s=Math.min(iw/W,ih/H);
 if(s>=1)s=Math.max(1,Math.floor(s*4)/4);
 scale=s;
 cv.style.width=Math.floor(W*s)+'px';
 cv.style.height=Math.floor(H*s)+'px';
}
function inRect(x,y,rx,ry,rw,rh){return x>=rx&&x<=rx+rw&&y>=ry&&y<=ry+rh;}
var steerId=-1,steerX0=0,steerY0=0,brakeId=-1;
function ptXY(e){
 var r=cv.getBoundingClientRect();
 return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
}
function onDown(e){
 initAudio();
 var p=ptXY(e);
 if(state!=='GAME'){input.startTap=true;return;}
 if(inRect(p.x,p.y,W-92,H-58,86,52)){brakeId=e.pointerId;input.brake=true;return;}
 steerId=e.pointerId;steerX0=p.x;steerY0=p.y;input.throttle=true;input.steer=0;input.steerY=0;
}
function onMove(e){
 if(e.pointerId===steerId){var p=ptXY(e);input.steer=clamp((p.x-steerX0)/38,-1,1);input.steerY=clamp((p.y-steerY0)/38,-1,1);}
}
function onUp(e){
 if(e.pointerId===steerId){steerId=-1;input.steer=0;input.steerY=0;input.throttle=false;}
 if(e.pointerId===brakeId){brakeId=-1;input.brake=false;}
}
/* PeerJS duel glue: browser only, never touched by gates (the transport is
   injected into the NET layer; gates inject an in-memory loopback channel). */
var peer=null,conn=null,netCode='';
function netLetters(){var s='',i;for(i=0;i<4;i++)s+=String.fromCharCode(65+Math.floor(Math.random()*26));return s;}
function wireConn(isHost,dmsg){
 conn.on('open',function(){
  netStart(function(m){try{conn.send(m);}catch(e){}});
  dmsg('LINKED');
  if(isHost){try{conn.send({go:1});}catch(e){}}
  netRaceBegin();
 });
 conn.on('data',function(m){netReceive(m);});
 conn.on('close',function(){netStop('LINK LOST');});
 conn.on('error',function(){netStop('LINK ERROR');});
}
function netHost(dmsg){
 if(typeof Peer==='undefined'){dmsg('NET OFFLINE');return;}
 netCode=netLetters();
 try{peer=new Peer('cbclash-'+netCode);}catch(e){dmsg('NET ERROR');return;}
 dmsg('OPENING...');
 peer.on('open',function(){dmsg('CODE: '+netCode+'  (share it, keep this open)');});
 peer.on('connection',function(c){conn=c;wireConn(true,dmsg);});
 peer.on('error',function(e){dmsg('NET ERR: '+((e&&e.type)||''));});
}
function netJoin(code,dmsg){
 code=(code||'').trim().toUpperCase();
 if(typeof Peer==='undefined'){dmsg('NET OFFLINE');return;}
 if(code.length!==4){dmsg('ENTER THE 4 LETTER CODE');return;}
 try{peer=new Peer();}catch(e){dmsg('NET ERROR');return;}
 dmsg('OPENING...');
 peer.on('open',function(){conn=peer.connect('cbclash-'+code);wireConn(false,dmsg);dmsg('JOINING '+code+'...');});
 peer.on('error',function(e){dmsg('NET ERR: '+((e&&e.type)||''));});
}
function boot(){
 buildSprites();buildTrack();buildFog(pal());
 if(typeof document!=='undefined'){
  cv=document.getElementById('cv');
  if(cv&&cv.getContext)ctx=cv.getContext('2d');
  if(ctx)ctx.imageSmoothingEnabled=false;
  var fsb=document.getElementById('fsBtn'),mb=document.getElementById('muteBtn'),wrap=document.getElementById('wrap');
  if(fsb)fsb.onclick=function(){
   initAudio();
   var el=wrap||document.documentElement;
   if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen();}
   else if(el.requestFullscreen)el.requestFullscreen();
   setTimeout(fit,300);
  };
  if(mb)mb.onclick=function(){
   initAudio();muted=!muted;
   if(master)master.gain.value=muted?0:0.8;
   mb.textContent=muted?'SND OFF':'SND ON';
  };
  var db=document.getElementById('duelBtn'),dp=document.getElementById('duelPanel'),
      dhb=document.getElementById('duelHost'),djb=document.getElementById('duelJoin'),
      dci=document.getElementById('duelCode'),dxb=document.getElementById('duelClose'),
      dmge=document.getElementById('duelMsg');
  function dmsg(s){if(dmge)dmge.textContent=s;}
  netUISync=function(){
   if(db)db.style.display=(state==='TITLE')?'block':'none';
   if(dp&&state!=='TITLE')dp.style.display='none';
  };
  if(db)db.onclick=function(){
   initAudio();
   if(dp)dp.style.display='block';
   dmsg(typeof Peer==='undefined'?'NET OFFLINE (PeerJS not loaded)':'RACE A FRIEND, ONE ON ONE');
  };
  if(dxb)dxb.onclick=function(){if(dp)dp.style.display='none';};
  if(dhb)dhb.onclick=function(){netHost(dmsg);};
  if(djb)djb.onclick=function(){netJoin(dci?dci.value:'',dmsg);};
  if(cv){
   cv.addEventListener('pointerdown',function(e){e.preventDefault();onDown(e);});
   cv.addEventListener('pointermove',function(e){e.preventDefault();onMove(e);});
   cv.addEventListener('pointerup',function(e){e.preventDefault();onUp(e);});
   cv.addEventListener('pointercancel',function(e){onUp(e);});
  }
 }
 if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,250);});
  window.addEventListener('keydown',function(e){
   if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(e.key)>=0)e.preventDefault();
   initAudio();
   if(e.key==='ArrowLeft')input.steer=-1;
   if(e.key==='ArrowRight')input.steer=1;
   if(e.key==='ArrowUp')input.throttle=true;
   if(e.key==='ArrowDown')input.brake=true;
   if(e.key==='Enter'||e.key===' ')input.startTap=true;
  });
  window.addEventListener('keyup',function(e){
   if(e.key==='ArrowLeft'&&input.steer<0)input.steer=0;
   if(e.key==='ArrowRight'&&input.steer>0)input.steer=0;
   if(e.key==='ArrowUp')input.throttle=false;
   if(e.key==='ArrowDown')input.brake=false;
  });
 }
 fit();
}
var lastTs=0,uiState='';
/* v20: the one error wrapper (doc 08 v1.03 section 9). frame() steps the sim through stepSim(), and so does the
   test hook, so a fault inside update() lands in lastError the same way in the browser and in every gate. */
function catchError(e){
  lastError=(e&&e.message?e.message:''+e);
  try{if(e&&e.stack)lastError=lastError+' @'+(e.stack.split('\n')[1]||'').trim().slice(0,26);}catch(e2){}
}
function stepSim(dt){
 try{update(dt);return true;}catch(e){catchError(e);return false;}
}
/* v20, THE FRAME LAW (doc 11 v1.04 section 5): the frame cap draws at most 60 a second on any screen (the doc's
   deadline snippet, on the rAF timestamp), drawnFrames counts what it draws (frametest R4), and the FPS meter (the port
   runtime's createFpsMeter) feeds the debug readout, shown with ?debug on the page's address. No FRAME RATE setting
   yet: SCREEN is offered only once the full refresh test passes. */
var CAP_MS=1000/60,capNext=-1,drawnFrames=0;
function capReady(ts){
 if(capNext<0)capNext=ts;
 if(ts<capNext-2)return false;
 capNext+=CAP_MS;
 if(capNext<ts-CAP_MS)capNext=ts;
 return true;
}
var fpsM={t0:0,frames:0,worst:0,prev:0,text:''},SHOW_FPS=false;
try{SHOW_FPS=/[?&]debug\b/.test(location.search);}catch(e){}
function fpsFrame(now){
 if(!fpsM.t0){fpsM.t0=fpsM.prev=now;fpsM.frames=fpsM.worst=0;return;}
 fpsM.frames++;fpsM.worst=Math.max(fpsM.worst,now-fpsM.prev);fpsM.prev=now;
 var span=now-fpsM.t0;
 if(span<500)return;
 fpsM.text=(fpsM.frames*1000/span).toFixed(1)+' FPS  '+(span/fpsM.frames).toFixed(1)+' ms (worst '+fpsM.worst.toFixed(1)+')';
 fpsM.t0=now;fpsM.frames=fpsM.worst=0;
}
function drawFps(g){
 if(!SHOW_FPS||!fpsM.text)return;
 g.fillStyle='rgba(6,8,22,0.7)';g.fillRect(W/2-74,0,148,12);
 g.fillStyle='#9fffa8';g.font='8px monospace';g.textAlign='center';g.textBaseline='middle';
 g.fillText(fpsM.text,W/2,6);
}
function frame(ts){
 if(typeof requestAnimationFrame==='function')requestAnimationFrame(frame);
 if(!capReady(ts))return;
 try{
  var dt=lastTs?Math.min(0.05,(ts-lastTs)/1000):1/60;
  lastTs=ts;
  drawnFrames++;fpsFrame(ts);
  if(stepSim(dt)){render();drawFps(ctx);
  if(state!==uiState){uiState=state;if(netUISync)netUISync();}}
 }catch(e){catchError(e);}
}
boot();
if(typeof requestAnimationFrame==='function')requestAnimationFrame(frame);
})();
</script>
