(function(){
'use strict';
var BUILD=9;                              // integer line for the hook; VER is the stamp of record
var VER='1.08';                           // Director's law: v + x.yz in notes and filename

/* ---- 1. ERROR REPORTER (always first; doctrine 07). Crashes become
        photographable: the ERR line draws LAST, above everything. ---- */
var lastError=null, ERRMSG='';
function reportErr(site,e){ lastError=String(site)+': '+(e&&e.message?e.message:String(e)); ERRMSG='ERR: '+lastError; }

/* ---- 2. SHELL: canvas, integer scaler, fullscreen (seed v1.04, verbatim) ---- */
var W=640,H=880;                              // RESOLUTION LAW (doc 11 s3): 16/32-bit class grid
var cv=(typeof document!=='undefined')?document.getElementById('cv'):null;
var ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;
var DPR=1;
function applyBacking(){
  var d=(typeof window!=='undefined'&&window.devicePixelRatio)?window.devicePixelRatio:1;
  DPR=Math.max(1,Math.min(3,d));
  if(cv){ cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); }
  if(ctx){ if(ctx.setTransform)ctx.setTransform(DPR,0,0,DPR,0,0);
           ctx.imageSmoothingEnabled=false; }
}
applyBacking();
function viewSize(){
  var vw=window.innerWidth, vh=window.innerHeight;
  try{ if(window.visualViewport){
    vw=Math.min(vw,window.visualViewport.width);
    vh=Math.min(vh,window.visualViewport.height); }
  }catch(e){}
  try{ if(document.body&&document.body.clientWidth){
    vw=Math.min(vw,document.body.clientWidth);
    if(document.body.clientHeight)vh=Math.min(vh,document.body.clientHeight); }
  }catch(e){}
  return {w:vw,h:vh};
}
function computeScale(vw,vh){
  var s=Math.min(vw/W,vh/H);
  if(s>=2)s=Math.floor(s); if(s<0.25)s=0.25;
  return s;
}
function fitScale(){
  if(!cv||!cv.style||typeof window==='undefined')return;
  var v=viewSize(), s=computeScale(v.w,v.h);
  for(var i=0;i<8;i++){
    cv.style.width=Math.floor(W*s)+'px';
    cv.style.height=Math.floor(H*s)+'px';
    var r=cv.getBoundingClientRect?cv.getBoundingClientRect():null;
    if(!r||!r.width||r.bottom===undefined)break;
    var vw=window.innerWidth, vh=window.innerHeight;
    try{ if(window.visualViewport){ vw=Math.min(vw,window.visualViewport.width);
         vh=Math.min(vh,window.visualViewport.height); } }catch(e){}
    if(r.bottom<=vh+0.5&&r.right<=vw+0.5)break;
    if(s<=0.25)break;
    s=(s>2)?(s-1):(s*0.9); if(s<0.25)s=0.25;
  }
  applyBacking();
  placeUI();
}
function placeUI(){                            // the results panel hugs the canvas bottom, not the viewport's
  try{ if(!UI||!UI.style||!cv||!cv.getBoundingClientRect)return; var r=cv.getBoundingClientRect();
    var gap=window.innerHeight-r.bottom; UI.style.bottom=Math.max(10,Math.round(gap)+10)+'px'; }catch(e){}
}
function settleFit(){
  fitScale();
  setTimeout(fitScale,150); setTimeout(fitScale,450); setTimeout(fitScale,1000);
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('resize',fitScale);
  window.addEventListener('orientationchange',function(){ settleFit(); });
  window.addEventListener('pageshow',function(){ settleFit(); });
  try{ if(window.visualViewport&&window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize',fitScale); }catch(e){}
}
if(typeof document!=='undefined'&&document.addEventListener)
  document.addEventListener('fullscreenchange',function(){ settleFit(); });
settleFit();
var fsBtn=(typeof document!=='undefined')?document.getElementById('fs'):null;
if(fsBtn&&fsBtn.addEventListener)fsBtn.addEventListener('click',function(){
  try{ var el=document.documentElement;
    if(document.fullscreenElement){ if(document.exitFullscreen)document.exitFullscreen(); }
    else if(el.requestFullscreen)el.requestFullscreen();
  }catch(e){}
  settleFit();
});

/* ---- 3. INPUT: two verbs. TAP (pointer down, Space, Z, Enter) signs.
        SWIPE (drag past SWIPE_MIN, or an arrow key) shakes off a distraction.
        setInput(l,r,u,d,a) is the harness shim: rising edges become the same
        two events. touch-action none lives on the CANVAS only (07). ---- */
var SWIPE_MIN=32;                                    // logical px of drag before a gesture is a swipe (v1.02: 40 to 32, easier on a thumb)
var inp={l:false,r:false,u:false,d:false,a:false};   // held state (edge detection + gate compatibility)
var ev={tap:false,swipe:null,tx:W/2,ty:H/2,sx:-1,sy:-1};   // one-frame events consumed by update(); tx,ty = the tap; sx,sy = where a swipe STARTED (-1: keyboard)
function setInput(l,r,u,d,a){
  if(a&&!inp.a){ ev.tap=true; ev.tx=W/2; ev.ty=H/2; }   // shim taps land center (never on the title pill)
  if(l&&!inp.l)ev.swipe='l'; else if(r&&!inp.r)ev.swipe='r';
  else if(u&&!inp.u)ev.swipe='u'; else if(d&&!inp.d)ev.swipe='d';
  if(ev.swipe&&(l&&!inp.l||r&&!inp.r||u&&!inp.u||d&&!inp.d)){ ev.sx=-1; ev.sy=-1; }   // keyboard: no start point
  inp.l=!!l; inp.r=!!r; inp.u=!!u; inp.d=!!d; inp.a=!!a;
}
function keyIn(e,on){
  try{ if(e.target&&e.target.tagName==='INPUT')return; }catch(x){}   // the name box owns its keys
  var k=e.key, n={l:inp.l,r:inp.r,u:inp.u,d:inp.d,a:inp.a};
  if(k==='ArrowLeft')n.l=on; else if(k==='ArrowRight')n.r=on;
  else if(k==='ArrowUp')n.u=on; else if(k==='ArrowDown')n.d=on;
  else if(k===' '||k==='z'||k==='Z'||k==='Enter'){n.a=on; if(on)firstGesture();}
  else if(k==='t'||k==='T'){ if(on&&STATE==='title'){ tutSet(!tutOn()); SFX.clear(); } if(e.preventDefault)e.preventDefault(); return; }   // v1.01 desktop toggle
  else return;
  setInput(n.l,n.r,n.u,n.d,n.a);
  if(e.preventDefault)e.preventDefault();
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('keydown',function(e){ keyIn(e,true); });
  window.addEventListener('keyup',function(e){ keyIn(e,false); });
}
var ptr={on:false,x:0,y:0,swiped:false};
function ptrXY(cx,cy){ var r=cv.getBoundingClientRect(), sx=W/r.width, sy=H/r.height;
  return {x:(cx-r.left)*sx, y:(cy-r.top)*sy}; }
function ptrDown(cx,cy){ firstGesture(); var p=ptrXY(cx,cy); ptr.on=true; ptr.x=p.x; ptr.y=p.y; ptr.swiped=false; ev.tap=true; ev.tx=p.x; ev.ty=p.y; }
function ptrMove(cx,cy){
  if(!ptr.on||ptr.swiped)return;
  var p=ptrXY(cx,cy), dx=p.x-ptr.x, dy=p.y-ptr.y;
  if(Math.abs(dx)<SWIPE_MIN&&Math.abs(dy)<SWIPE_MIN)return;
  ptr.swiped=true;
  ev.swipe=(Math.abs(dx)>Math.abs(dy))?(dx<0?'l':'r'):(dy<0?'u':'d'); ev.sx=ptr.x; ev.sy=ptr.y;
}
function ptrUp(){ ptr.on=false; }
if(cv&&cv.addEventListener){
  if(typeof window!=='undefined'&&'onpointerdown' in window){
    cv.addEventListener('pointerdown',function(e){ ptrDown(e.clientX,e.clientY); if(e.preventDefault)e.preventDefault(); });
    cv.addEventListener('pointermove',function(e){ ptrMove(e.clientX,e.clientY); });
    cv.addEventListener('pointerup',ptrUp); cv.addEventListener('pointercancel',ptrUp);
  }else{
    cv.addEventListener('touchstart',function(e){ var t=e.touches[0]; if(t)ptrDown(t.clientX,t.clientY); if(e.preventDefault)e.preventDefault(); },{passive:false});
    cv.addEventListener('touchmove',function(e){ var t=e.touches[0]; if(t)ptrMove(t.clientX,t.clientY); if(e.preventDefault)e.preventDefault(); },{passive:false});
    cv.addEventListener('touchend',ptrUp,{passive:false});
    cv.addEventListener('mousedown',function(e){ ptrDown(e.clientX,e.clientY); });
    cv.addEventListener('mousemove',function(e){ ptrMove(e.clientX,e.clientY); });
    cv.addEventListener('mouseup',ptrUp);
  }
}

/* ---- 4. AUDIO behind a first gesture; degrades silently (07) ---- */
var AC=null;
function firstGesture(){
  try{
    if(!AC){ var C=(typeof AudioContext!=='undefined')?AudioContext:
                   (typeof webkitAudioContext!=='undefined'?webkitAudioContext:null);
             if(C)AC=new C(); }
    if(AC&&AC.state==='suspended'&&AC.resume)AC.resume();
  }catch(e){}
}
function tone(f1,f2,dur,type,vol){          // a short glide; every cue in the game is one of these
  if(!AC)return;
  try{ var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square'; o.frequency.setValueAtTime(f1||440,t);
    if(f2&&o.frequency.linearRampToValueAtTime)o.frequency.linearRampToValueAtTime(f2,t+(dur||0.08));
    g.gain.setValueAtTime(vol||0.07,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.08));
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+(dur||0.08)+0.02);
  }catch(e){}
}
var SFX={
  start:function(){ tone(440,880,0.12); },
  sign:function(){ tone(700,1000,0.07,'square'); },
  perfect:function(){ tone(880,1320,0.09,'square'); tone(1320,1760,0.12,'triangle',0.05); },
  sloppy:function(){ tone(520,380,0.1,'square'); },
  miss:function(){ tone(220,110,0.18,'sawtooth',0.06); },
  decoy:function(){ tone(160,90,0.25,'sawtooth',0.07); },
  buzz:function(){ tone(300,300,0.06,'square',0.05); },
  alarm:function(){ tone(980,320,0.32,'sawtooth',0.07); tone(620,620,0.12,'square',0.05); },
  clear:function(){ tone(520,900,0.1,'triangle'); },
  over:function(){ tone(660,330,0.35,'square',0.06); }
};

/* ---- 5. GAME STATE ---- */
/* Difficulty topology (07: every constant named and intent-commented so a
   single knob tunes a feel). The run is one minute; every curve is linear
   in p = elapsed / RUN_SECONDS.                                              */
var RUN_SECONDS=60;                 // the OCTOBER clock; a daily game is one minute long
var STRIKES_MAX=6;                  // unsigned real checks allowed on the floor (or decoys signed); 5 until v1.07
var BELT_V0=150, BELT_V1=420;       // belt px/s at p=0 and p=1
var SPACING=236;                    // px between check spawns (constant rhythm as the belt speeds up)
var SPACING_JIT=0.22;               // fractional jitter on spacing (0.22 = 0.78x to 1.22x; v1.05: was 0.45, which let checks touch)
var FIRST_X=380;                    // v1.05: the first check starts ON the belt (arrives in ~1.5s, no dead air)
var DIS_GAP0=7.0, DIS_GAP1=3.6;     // seconds between distractions at p=0 and p=1 (v1.04: a failed one costs a check, so a little wider)
var DIS_FIRST=7.5;                  // seconds before the first distraction (the first check lands at ~4.3s; sign two first)
var DECOY_P0=0.12, DECOY_P1=0.30;   // probability a spawned check is a decoy, ramping by CHECK INDEX (v1.05, the daily law)
var DECOY_FROM=6, DECOY_RAMP_N=70;  // no decoy among the first 6 checks; full rate by check 70 (about the end of the minute)
var ZONE_X=214, ZONE_HALF=64;       // SIGN ZONE center and half width (belt x)
var PERFECT=16, GOOD=38;            // |dx| from center: PERFECT, GOOD, else SLOPPY
var CHECK_W=128, CHECK_H=60;        // paper size
var BELT_Y=470, BELT_H=62;          // conveyor strip on the desk
var HAND_BASE_Y=386, HAND_DROP=34;  // hand rest height and the tap drop
var REACH0=2.0, REACH1=1.3;         // seconds from a distraction's onset to his hand closing on it, p=0 to p=1 (v1.05: was 1.7 to 1.1; the bots lost 1.6 a run at average skill, now 0.6)
var BUSY_MIN=0.9, BUSY_MAX=2.6;     // v1.05 ONE CHECK LAW: the vice lasts until the check he was due to sign has passed (at least BUSY_MIN so the gag reads, never past BUSY_MAX)
var RAMP_T=1.0;                     // seconds of belt ease-in after a tutorial card releases (the thumb needs to come back)
var FLASH_T=0.18, SHAKE_T=0.35;     // onset drama: white flash and scene shake
var FLASH_MAX=0.5;                  // v1.05 FLASH LAW: peak alpha of the onset flash (was 0.75)
function blinkOn(t){ return (Math.floor(t*4)%2)===0; }   // v1.05 FLASH LAW: 4 toggles a second = 2 flashes a second, under the 3 a second guideline
var BANNER_T=1.5;                   // seconds the onset banner crosses the room

var DAY_ONE=Date.UTC(2026,8,15);    // SNAIL DAILY #1 is 2026-09-15 (month index 8)
function todayUTC(){ var d=new Date(); return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()); }
function dayNumber(){ return Math.max(1,Math.floor((todayUTC()-DAY_ONE)/86400000)+1); }
function dayLabel(){ var d=new Date(todayUTC()); var M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return M[d.getUTCMonth()]+' '+d.getUTCDate(); }
function rngMake(seed){ return {a:(seed>>>0), next:function(){ this.a=(this.a+0x6D2B79F5)>>>0; var t=this.a;
  t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }}; }
function daySeed(n){ return (Math.imul(n,2654435761)^0x5EED)>>>0; }

var DIS={                            // v1.04: three THINGS AT HIS DESK; v1.05: generous hit boxes and a RESERVE region a pointerdown there never signs

 phone:{name:'TRUTH SHOUT',banner:'TRUTH SHOUT!',   label:'SWIPE DOWN ON DISMISS', busyName:'TYPING',    busyLine:'He is typing in all caps.',     tag:'P',
        obj:{x:50,y:392,w:64,h:48},   btn:{x:16,y:318,w:132,h:56}, hit:{x:0,y:220,w:190,h:230},   eye:'look', snap:'Swipe down on DISMISS to snap him out.'},
 tv:   {name:'FAUX NEWS',  banner:'BREAKING NEWS!', label:'TAP THE TV',            busyName:'WATCHING',  busyLine:'He cannot look away.',          tag:'T',
        obj:{x:40,y:150,w:150,h:110}, hit:{x:20,y:130,w:190,h:180}, eye:'look', snap:'Tap the TV to snap him out.'}

var STATE='title';
var player={x:ZONE_X-36,y:HAND_BASE_Y,pulse:0,vx:0,vy:0};   // the HAND (the hook's player accessor)
var G=null;                                                  // the run
function newRun(){
  var n=dayNumber();
  return {day:n,seed:daySeed(n),rng:rngMake(daySeed(n)),rngD:rngMake(daySeed(n)^0xD15C0),elapsed:0,tleft:RUN_SECONDS,   // v1.05: two streams, checks and distractions
    signed:0,perfects:0,missed:0,decoys:0,strikes:0,combo:0,bestCombo:0,
    checks:[],nextGap:0,belt:0,beltOff:0,spawned:0,zoneFlash:0,
    dis:null,disTimer:DIS_FIRST,disTime:0,lastDis:-1,saved:0,lost:0,debris:[],ramp:0,flash:0,banner:'',bannerT:0,hudPulse:0,shake:0,log:[],
    face:'idle',faceT:0,call:'',callT:0,callCol:'#fff',reason:'',seenDecoy:false,hintT:0,
    floats:[],fx:rngMake(99),overT:0,toast:'',toastT:0,tut:null,tutSeen:{}};
}
function resetGame(){ STATE='title'; G=newRun(); player.x=ZONE_X-36; player.y=HAND_BASE_Y; player.pulse=0;
  ev.tap=false; ev.swipe=null; ERRMSG=''; lastError=null; uiShow(false); }
function lerp(a,b,t){ return a+(b-a)*t; }
function prog(){ return Math.max(0,Math.min(1,G.elapsed/RUN_SECONDS)); }
function beltSpeed(){ return lerp(BELT_V0,BELT_V1,prog()); }
function addFloat(t,x,y,col,size){ G.floats.push({t:t,x:x,y:y,col:col||'#fff',size:size||18,life:1}); if(G.floats.length>12)G.floats.shift(); }
function callout(t,col){ G.call=t; G.callT=0.9; G.callCol=col||'#fff'; }
function setFace(f,t){ G.face=f; G.faceT=t||0.5; }
function logEv(c){ G.log.push(c); if(G.log.length>200)G.log.shift(); }
function fmt(n){ var s=String(Math.floor(n)); var o=''; while(s.length>3){ o=','+s.slice(-3)+o; s=s.slice(0,-3); } return s+o; }
/* v1.01 TUTORIAL: four beats, once per run, each a card that FREEZES the sim until a tap.
   Toggle lives on the title (TOG pill) and in localStorage; default ON. */
var TUT_KEY='signhere-tut';
var TOG={x:140,y:642,w:360,h:44};                    // the title pill (logical rect)
var TUT_GUARD=0.3;                                    // seconds before a tap may dismiss (the tap in flight cannot)
function tutOn(){ var v=lsGet(TUT_KEY); return (v===null)?true:(v==='1'); }
function tutSet(on){ lsSet(TUT_KEY,on?'1':'0'); }
var TUT={                            // v1.05: one beat per distraction type, each names its own counter; PAUSED and RESUME are system cards
  zone:{title:'A CHECK IS IN THE ZONE',lines:['TAP anywhere to sign it while it is green.','Dead center = a big beautiful signature.']},
  dis_cola:{title:'DIET COLA INCOMING',lines:['The machine dropped a can. He is reaching.','SWIPE THE CAN AWAY before he gets there.','Miss it and one check slides past him.']},
  dis_phone:{title:'TRUTH SHOUT ALERT',lines:['His phone lit up. He is reaching for it.','SWIPE DOWN through the red DISMISS button.','Miss it and one check slides past him.']},
  dis_tv:{title:'BREAKING NEWS',lines:['The TV came on. He cannot look away.','TAP THE TV to switch it off.','Miss it and one check slides past him.']},
  decoy:{title:'THAT IS NOT TODAY\'S CHECK',lines:['Yellow $2,000 and pink $5,000 are IOUs.','Let them ride past. Signing one is a strike.']},
  floor:{title:'ONE ON THE FLOOR',lines:['An unsigned $500 check fell off the desk.','That is a strike. Six strikes ends the run.']},
  paused:{title:'PAUSED',lines:['The checks will wait. October will too.']},
  resume:{title:'WELCOME BACK',lines:['Your run was saved where you left it.']}
};
function sysPause(id){ if(STATE==='play'&&G&&!G.tut){ G.tut={id:id||'paused',t:0,sys:true}; return true; } return false; }   // v1.05: not a tutorial; shows with tutorials off
function tutShow(id){ if(G.tutSeen[id])return false; G.tutSeen[id]=1; if(!tutOn())return false; G.tut={id:id,t:0}; tone(520,780,0.12,'triangle',0.05); return true; }
function inRect(x,y,r){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }

function spawnCheck(x){                               // v1.05: placed at x; kind and the gap AFTER it come from the check stream, by index
  var idx=G.spawned, r=G.rng.next(), kind='real', pr=Math.min(1,idx/DECOY_RAMP_N);
  if(idx>=DECOY_FROM&&r<lerp(DECOY_P0,DECOY_P1,pr)) kind=(G.rng.next()<0.5)?'tariff':'dividend';
  var c={x:x,kind:kind,signed:false,q:null,sig:null,id:G.spawned++,lostTo:null}; G.checks.push(c);
  if(kind!=='real'&&!G.seenDecoy){ G.seenDecoy=true; if(!tutOn())G.hintT=3.2; }   // 07: new content classes announce themselves once
  G.nextGap=SPACING*(1+(G.rng.next()*2-1)*SPACING_JIT);
  return c;
}
function fillBelt(){                                  // v1.05: SPATIAL spawner: exact spacing whatever the belt speed, ramp or hold
  var last=null, i; for(i=0;i<G.checks.length;i++)if(!last||G.checks[i].x>last.x)last=G.checks[i];
  for(i=0;i<6;i++){ var x=last?last.x+G.nextGap:FIRST_X; if(last&&x>W+CHECK_W)break; last=spawnCheck(x); }
}
function spawnDis(){
  var n=DIS_ORDER.length, i=Math.floor(G.rngD.next()*(G.lastDis>=0?n-1:n)); if(G.lastDis>=0&&i>=G.lastDis)i++;   // v1.05: its own stream, one draw, never the same twice in a row (no retry loop)
  G.lastDis=i; var id=DIS_ORDER[i], d=DIS[id];
  G.dis={id:id,d:d,t:0,phase:'reach',reach:lerp(REACH0,REACH1,prog()),busyT:0,target:null,gone:false};
  G.disTimer=lerp(DIS_GAP0,DIS_GAP1,prog());
  drama(d.banner); setFace(d.eye,99); SFX.alarm(); logEv(d.tag);
  tutShow('dis_'+id);                                      // v1.05: the first of EACH type explains its own counter, under the hold law
}
function drama(text){ G.flash=FLASH_T; G.shake=SHAKE_T; G.banner=text; G.bannerT=BANNER_T; }
function counterMatches(d,tap,tx,ty,sw,sx,sy){            // did the gesture answer THIS distraction
  var kb=!!(sw&&sx<0);                                     // a keyboard arrow answers any of them (desktop fallback)
  if(d.id==='cola') return kb||!!(sw&&(inRect(sx,sy,d.d.hit)||(d.phase==='busy'&&inRect(sx,sy,d.d.busyHit))));   // v1.05: during the swig the can is at his mouth
  if(d.id==='phone'){ var b=d.d.btn; return kb||!!(sw==='d'&&sx>=b.x-40&&sx<=b.x+b.w+40&&sy>=100&&sy<=450); }   // v1.05: a down swipe anywhere in the phone column, button or phone
  if(d.id==='tv') return kb||!!(tap&&inRect(tx,ty,d.d.hit));
  return false;
}
function reserveHit(d,x,y){ return inRect(x,y,d.d.hit)||(d.phase==='busy'&&!!d.d.busyHit&&inRect(x,y,d.d.busyHit)); }   // v1.05 GESTURE LAW: a pointerdown here is aimed at the distraction, never a sign
function counterDis(){                                    // the player did the thing: saved during the reach, or cut the vice short
  var d=G.dis, early=(d.phase==='reach');
  if(d.id==='cola')G.debris.push({x:d.d.can.x,y:d.d.can.y,vx:-300,vy:-260,t:0});
  if(d.target&&!d.target.signed&&d.target.x+CHECK_W/2>=ZONE_X-ZONE_HALF)d.target.lostTo=null;   // snapped out in time: that check is his again
  G.dis=null; G.face='grump'; G.faceT=0.5; SFX.clear(); logEv(early?'K':'k'); if(G.bannerT>0.18)G.bannerT=0.18;   // v1.05: an answered alarm slides its banner out
  if(early){ G.saved++; callout('SAVED: '+d.d.name,'#57ff7a'); addFloat('NOT TODAY',d.d.obj.x+d.d.obj.w/2,d.d.obj.y-18,'#57ff7a',22); }
  else { callout('SNAPPED OUT OF IT','#9ecbff'); }
}
function failDis(){                                       // his hand closed on it: the check he was due to sign is lost (ONE CHECK LAW)
  var d=G.dis, best=null; d.phase='busy'; d.busyT=0; G.lost++; SFX.decoy(); drama(d.d.busyName+'!');
  for(var i=0;i<G.checks.length;i++){ var c=G.checks[i]; if(c.signed||c.kind!=='real')continue;
    if(c.x+CHECK_W/2>=ZONE_X-ZONE_HALF&&(!best||c.x<best.x))best=c; }
  d.target=best; if(best)best.lostTo=d.id;
  setFace(d.id==='cola'?'swig':(d.id==='tv'?'look':'type'),99);
}
function busyStep(dt){
  var d=G.dis, t=d.target; d.busyT+=dt; G.disTime+=dt; player.y=HAND_BASE_Y-70+Math.sin(d.busyT*9)*4;
  var gone=!t||t.signed||G.checks.indexOf(t)<0||(t.x+CHECK_W/2<ZONE_X-ZONE_HALF);
  if(gone&&!d.gone){ d.gone=true; if(t&&!t.signed)addFloat('HE MISSED IT',ZONE_X-40,BELT_Y-16,'#ff7b7b',18); }
  var nextIn=false; for(var i=0;i<G.checks.length;i++){ var c=G.checks[i];
    if(c!==t&&!c.signed&&c.kind==='real'&&Math.abs(c.x+CHECK_W/2-ZONE_X)<=ZONE_HALF+10){ nextIn=true; break; } }
  if((gone&&(d.busyT>=BUSY_MIN||nextIn))||d.busyT>=BUSY_MAX)endBusy();
}
function endBusy(){
  var d=G.dis; if(d.id==='cola')G.debris.push({x:d.d.obj.x-30,y:392,vx:-80,vy:-80,t:0});   // he drops the can beside the desk
  G.dis=null; G.face='idle'; G.faceT=0; callout('BACK TO WORK','#8fa3c4');
}
function fadeCosmetics(dt){                               // v1.05: cosmetic timers run even under a hold (a card never whites out what it explains)
  if(G.flash>0)G.flash-=dt; if(G.shake>0)G.shake-=dt; if(G.bannerT>0)G.bannerT-=dt; if(G.hudPulse>0)G.hudPulse-=dt; if(G.zoneFlash>0)G.zoneFlash-=dt; if(G.callT>0)G.callT-=dt;
}
function held(){ return STATE==='play'&&!!(G&&G.tut); }   // THE HOLD LAW: one predicate; while true nothing in the sim moves and nothing ends
function makeSig(q){                                  // the signature reads DJT: three marker strokes and the spiky underline, sized by quality
  var h=(q==='PERFECT')?30:(q==='GOOD'?22:15), j=(q==='PERFECT')?1.5:(q==='GOOD'?3:6), w=h*0.72, x=28, y=CHECK_H*0.26, k, i;
  function J(){ return (G.fx.next()-0.5)*j; }
  var D=[[0,0],[0,h],[0,0],[w*0.7,h*0.12],[w*0.95,h*0.5],[w*0.7,h*0.88],[0,h]];
  var jx=w*1.2, JJ=[[jx,0],[jx+w*0.8,0],[jx+w*0.45,0],[jx+w*0.45,h*0.75],[jx+w*0.25,h],[jx,h*0.8]];
  var tx=w*2.25, T=[[tx,0],[tx+w*0.9,0],[tx+w*0.45,0],[tx+w*0.45,h]];
  var n=(q==='SLOPPY')?4:7, U=[]; for(k=0;k<=n;k++)U.push([w*3.25*k/n, h+5+((k%2)?-h*0.4:h*0.15)]);
  var strokes=[D,JJ,T,U], out=[];
  for(k=0;k<strokes.length;k++){ var st=[]; for(i=0;i<strokes[k].length;i++)st.push({x:x+strokes[k][i][0]+J(),y:y+strokes[k][i][1]+J()}); out.push(st); }
  return out;
}
function strike(why){
  G.strikes++; SFX.miss();
  if(G.strikes>=STRIKES_MAX) endRun(why||'SIX CHECKS ON THE FLOOR');
}
function trySign(){
  var best=null,bd=1e9;
  for(var i=0;i<G.checks.length;i++){ var c=G.checks[i]; if(c.signed)continue;
    var d=Math.abs((c.x+CHECK_W/2)-ZONE_X); if(d<=ZONE_HALF&&d<bd){bd=d;best=c;} }
  player.pulse=0.22; player.y=HAND_BASE_Y+HAND_DROP;
  if(!best){ callout('SCRIBBLE','#c8c8c8'); G.combo=0; SFX.sloppy(); addFloat('~',ZONE_X,BELT_Y-10,'#aaa',22); return; }
  best.signed=true;
  if(best.kind!=='real'){ best.q='VOID'; G.decoys++; G.combo=0; logEv('X'); setFace('grump',0.8);
    callout('NOT THAT ONE','#ff5a5a'); addFloat(best.kind==='tariff'?'THAT IS THE $2,000 ONE':'THAT IS THE $5,000 ONE',W/2,BELT_Y-24,'#ff7b7b',16);
    SFX.decoy(); strike('SIGNED THE WRONG CHECKS'); return; }
  var q=(bd<=PERFECT)?'PERFECT':(bd<=GOOD?'GOOD':'SLOPPY');
  best.q=q; best.sig=makeSig(q); G.signed++; G.combo++; if(G.combo>G.bestCombo)G.bestCombo=G.combo; G.hudPulse=0.3;
  if(q==='PERFECT'){ G.zoneFlash=0.16; G.shake=0.12; }   // v1.05 FLASH LAW: a zone glow, not a scene flash
  logEv(q==='PERFECT'?'P':'V');
  if(q==='PERFECT'){ G.perfects++; setFace('happy',0.6); callout('BIG BEAUTIFUL SIGNATURE','#ffd23f'); SFX.perfect(); addFloat('+1 PERFECT',ZONE_X,BELT_Y-14,'#ffd23f',20); }
  else if(q==='GOOD'){ setFace('sign',0.3); callout('SIGNED','#57ff7a'); SFX.sign(); addFloat('+1',ZONE_X,BELT_Y-14,'#57ff7a',20); }
  else { setFace('sign',0.3); callout('SLOPPY, STILL COUNTS','#bfe8c9'); SFX.sloppy(); addFloat('+1',ZONE_X,BELT_Y-14,'#bfe8c9',18); }
}
function endRun(reason){
  if(STATE!=='play')return;
  if(G.tut){ reportErr('endRun','called while held ('+reason+')'); return; }   // THE HOLD LAW: a held run cannot end; if this ever prints, it is a bug
  STATE='over'; G.reason=reason; G.overT=0; G.dis=null; SFX.over(); setFace('grump',99);
  PORTAL.gameplayStop(); clearSave(); boardRecord(); uiShow(true);
}
function startRun(){
  G=newRun(); STATE='play'; fillBelt(); SFX.start(); PORTAL.gameplayStart(); uiShow(false);   // v1.05: the belt is loaded on the first frame
}
function update(dt){
  var tap=ev.tap, sw=ev.swipe, tx=ev.tx, ty=ev.ty, sx=ev.sx, sy=ev.sy; ev.tap=false; ev.swipe=null;
  if(player.pulse>0){ player.pulse-=dt; if(player.pulse<0)player.pulse=0; }
  player.y+=(HAND_BASE_Y-player.y)*Math.min(1,dt*14);          // hand springs back to rest
  if(STATE==='title'){ if(tap){ if(inRect(tx,ty,TOG)){ tutSet(!tutOn()); SFX.clear(); } else startRun(); } return; }
  if(STATE==='over'){ G.overT+=dt; if(G.toastT>0)G.toastT-=dt; if(tap&&G.overT>1.5)resetGame(); return; }
  /* play: THE HOLD FIRST (held()). Only the card's own clock and cosmetic fades move. */
  if(G.tut){ G.tut.t+=dt; fadeCosmetics(dt); if(tap&&G.tut.t>=TUT_GUARD){ G.tut=null; G.ramp=RAMP_T; SFX.sign(); } return; }
  /* the open world */
  G.elapsed+=dt; G.tleft=RUN_SECONDS-G.elapsed;
  if(G.tleft<=0){ G.tleft=0; endRun('OCTOBER ARRIVED'); return; }
  var vf=1; if(G.ramp>0){ G.ramp-=dt; if(G.ramp<0)G.ramp=0; vf=1-G.ramp/RAMP_T; }   // the belt eases in after a card
  var v=beltSpeed()*vf; G.belt+=v*dt; G.beltOff=(G.beltOff+v*dt)%40;
  if(G.faceT>0&&!G.dis){ G.faceT-=dt; if(G.faceT<=0)G.face='idle'; }
  fadeCosmetics(dt); if(G.hintT>0)G.hintT-=dt;
  for(var i=G.checks.length-1;i>=0;i--){ var c=G.checks[i]; c.x-=v*dt;
    if(c.x+CHECK_W<-10){ G.checks.splice(i,1);
      if(!c.signed&&c.kind==='real'){ G.missed++; G.combo=0; logEv('M'); var bz=!!c.lostTo;
        callout(bz?'PASSED HIM BY':'MISSED ONE','#ff7b7b'); addFloat(bz?'HE WAS BUSY':'UNSIGNED',70,BELT_Y-14,'#ff7b7b',18); strike(); if(STATE!=='play')return; tutShow('floor'); }
      else if(!c.signed) { addFloat('good, not that one',80,BELT_Y-14,'#8fa3c4',15); } } }
  fillBelt();
  for(i=G.debris.length-1;i>=0;i--){ var db=G.debris[i]; db.t+=dt; db.x+=db.vx*dt; db.y+=db.vy*dt; db.vy+=900*dt; if(db.y>H+40||db.t>2.5)G.debris.splice(i,1); }
  for(i=G.floats.length-1;i>=0;i--){ var f=G.floats[i]; f.y-=40*dt; f.life-=dt*0.9; if(f.life<=0)G.floats.splice(i,1); }
  if(!G.tutSeen.zone||!G.tutSeen.decoy){ for(i=0;i<G.checks.length;i++){ var tc=G.checks[i];
    if(!G.tutSeen.decoy&&tc.kind!=='real'&&!tc.signed&&tc.x+CHECK_W<=W-6){ tutShow('decoy'); break; }
    if(!G.tutSeen.zone&&!G.dis&&tc.kind==='real'&&!tc.signed&&Math.abs(tc.x+CHECK_W/2-ZONE_X)<=ZONE_HALF){ tutShow('zone'); break; } } }
  if(G.tut)return;                                                   // a beat just opened: hold this frame too
  if(!G.dis&&G.ramp<=0){ G.disTimer-=dt; if(G.disTimer<=0){ spawnDis(); if(G.tut)return; } }   // no onset during a ramp
  /* the distraction clock */
  if(G.dis){ var d=G.dis; d.t+=dt;
    if(counterMatches(d,tap,tx,ty,sw,sx,sy)){ counterDis(); tap=false; }
    else {
      if(tap&&reserveHit(d,tx,ty)){ tap=false; if(d.phase==='reach'&&d.id!=='tv')callout(d.d.label,'#ffd23f'); }   // GESTURE LAW
      if(sw){ G.shake=Math.max(G.shake,0.12); callout('WRONG MOVE: '+d.d.label,'#ffd23f'); }
      if(d.phase==='reach'){ if(d.t>=d.reach)failDis(); } else busyStep(dt);
    } }

function drawArrow(ax,ay,dir,s,col){                     // pixel arrow, pulsing along its direction

  ctx.fillStyle='#000'; ctx.beginPath(); arrowPath(ax+2,ay+2,dir,s); ctx.closePath(); ctx.fill();

}
function arrowPath(ax,ay,dir,s){
  if(dir==='l'){ ctx.moveTo(ax-s,ay); ctx.lineTo(ax,ay-s*0.8); ctx.lineTo(ax,ay-s*0.3); ctx.lineTo(ax+s,ay-s*0.3); ctx.lineTo(ax+s,ay+s*0.3); ctx.lineTo(ax,ay+s*0.3); ctx.lineTo(ax,ay+s*0.8); }
  else if(dir==='r'){ ctx.moveTo(ax+s,ay); ctx.lineTo(ax,ay-s*0.8); ctx.lineTo(ax,ay-s*0.3); ctx.lineTo(ax-s,ay-s*0.3); ctx.lineTo(ax-s,ay+s*0.3); ctx.lineTo(ax,ay+s*0.3); ctx.lineTo(ax,ay+s*0.8); }
  else if(dir==='u'){ ctx.moveTo(ax,ay-s); ctx.lineTo(ax+s*0.8,ay); ctx.lineTo(ax+s*0.3,ay); ctx.lineTo(ax+s*0.3,ay+s); ctx.lineTo(ax-s*0.3,ay+s); ctx.lineTo(ax-s*0.3,ay); ctx.lineTo(ax-s*0.8,ay); }
  else { ctx.moveTo(ax,ay+s); ctx.lineTo(ax+s*0.8,ay); ctx.lineTo(ax+s*0.3,ay); ctx.lineTo(ax+s*0.3,ay-s); ctx.lineTo(ax-s*0.3,ay-s); ctx.lineTo(ax-s*0.3,ay); ctx.lineTo(ax-s*0.8,ay); }

/* ---- 7. FRAME PACING: the catch-up defenses (seed, verbatim) ---- */
var STEP_CAP=5;
var STEP_MS=16.6667;
function frameStep(prevLast,now){
  var acc=now-prevLast;
  if(acc>200)return {steps:1,last:now,resync:true};
  var steps=Math.floor(acc/STEP_MS);
  if(steps>STEP_CAP)steps=STEP_CAP;
  return {steps:steps,last:prevLast+steps*STEP_MS,resync:false};
}
var tick={last:0}; var lastSaveAt=0;
function frameTick(){
  try{
    var now=performance.now();
    if(!tick.last)tick.last=now;
    var fs=frameStep(tick.last,now);
    tick.last=fs.last;
    for(var i=0;i<fs.steps;i++)update(1/60);
    render();
    if(now-lastSaveAt>5000){ saveState(); lastSaveAt=now; }
  }catch(e){ reportErr('frameTick',e); }
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(frameTick);
}

/* ---- 8. PAGE VISIBILITY: pause hidden; resync on a long return (seed) ---- */
var hiddenAt=0;
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('visibilitychange',function(){
    var now=(typeof performance!=='undefined')?performance.now():Date.now();
    if(document.hidden){ hiddenAt=now; saveState(); sysPause('paused'); }   // v1.05: coming back never drops you onto a moving belt
    else { if(hiddenAt&&now-hiddenAt>1000){ tick.last=now; } hiddenAt=0; }
  });
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('pagehide',function(){
    saveState();
    try{ if(AC&&AC.close)AC.close(); }catch(e){}
  });
}
