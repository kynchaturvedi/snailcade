/* SNAIL AUDIO KIT v1.02: the whole module, byte for byte from commons/audio/snail-audio-kit-v1.02.js (BUILD 11) */
/* ============================================================================
   SNAIL AUDIO KIT v1.02 (core module) | Snail Attack Studios | 2026-09-30
   v1.02: the module caught up with the lab (see the v1.02 note at the foot):
   the ctx/bus accessors and the five-title merge (REEF RIOT, AETHER RUSH,
   NEON SWARM, FRENZY FLEET, CANNONBALL CLASH), which since 2026-07-07 lived
   only inside snail-audio-lab-v1.04 to v1.06.
   ----------------------------------------------------------------------------
   The studio's sound as a drop-in. NOT invented: two production synth
   primitives carried VERBATIM plus a recipe book of shipped, Director-heard
   sounds, each with provenance.
   - tone(f,dur,type,vol,slide): PATTY PANIC v217's engine. LINEAR pitch slide,
     exponential volume decay. Percussive, chunky, arcade-floor.
   - sweep(f,end,dur,type,vol): NEON SWARM v78's beep engine. EXPONENTIAL pitch
     ramp to a target. Lasers, charges, whooshes, anything that travels.
   - arp(notes,step,dur,type,vol): PATTY's arpeggiator for jingles and rewards.
   Boot is gesture-safe per the STUDIO SEED lesson: mobile contexts can be
   CREATED SUSPENDED, so boot() both creates AND resumes inside the gesture.
   Master gain ships at NEON SWARM's 0.16. Headless-inert: without an
   AudioContext every call is a silent no-op and cannot move a gate.
   ----------------------------------------------------------------------------
   v1.01 MERGE (2026-07-07): GRID GRUDGE contribution folded in with credit:
   AKIT.music (the v55 step-sequencer engine with the v48/v49/v50 lifecycle
   lessons as code), AKIT.noise (their shipped noise primitive; corrects the
   v1.00 claim that no title needed noise), and AKIT.scaleWalk (the melodic
   scale-walking SFX technique with their move/rotate exemplars).
   WIRING: call AKIT.boot() inside EVERY input gesture handler (touchstart,
   keydown); it is idempotent. Then fire recipes: AKIT.sfx.hit(); or compose
   your own from the primitives and register them on AKIT.sfx.
   ============================================================================ */
var AKIT = (function(){
'use strict';
var VERSION = '1.02';   /* kit v1.02: ctx/bus accessors + the five-title merge */
var AC = null, master = null, VOL = 0.16;          // NEON SWARM shipped master

function boot(){                                    // call inside every gesture
  try{
    if(!AC){
      var C = (typeof AudioContext !== 'undefined') ? AudioContext :
              (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if(!C) return false;
      AC = new C();
      master = AC.createGain(); master.gain.value = VOL;
      master.connect(AC.destination);
    }
    if(AC.state === 'suspended' && AC.resume) AC.resume();   // the seed lesson
    return true;
  }catch(e){ AC = null; return false; }
}
function setVolume(v){ VOL = Math.max(0, Math.min(1, v)); if(master) master.gain.value = VOL; }
function ready(){ return !!AC; }

/* PATTY PANIC v217 tone(), verbatim shape: linear slide, exp decay */
function tone(f, dur, type, vol, slide){
  if(!AC) return;
  try{
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(vol || 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
/* NEON SWARM v78 beep(), verbatim shape: exponential ramp to a target pitch */
function sweep(freq, end, dur, type, vol){
  if(!AC) return;
  try{
    var o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, end), t + dur);
    gn.gain.setValueAtTime(vol || 0.5, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
/* PATTY PANIC arp(), verbatim shape */
function arp(notes, step, dur, type, vol){
  if(!AC) return;
  for(var i = 0; i < notes.length; i++)
    (function(nt, j){ setTimeout(function(){ tone(nt, dur, type, vol); }, j * step); })(notes[i], i);
}

/* THE RECIPE BOOK: shipped sounds, per-recipe provenance. Grade your game's
   events (UI < action < impact < big < fail) and pick within the grade. */
var sfx = {
  /* UI */
  press:      function(){ tone(660, 0.05, 'square', 0.3); },                    // PATTY press
  tick:       function(){ tone(880, 0.03, 'square', 0.2); },                    // PATTY idiom, lighter
  /* ACTION */
  jump:       function(){ tone(340, 0.11, 'square', 0.3, 620); },               // PATTY v195 CAP CHEF chirp
  spring:     function(){ tone(300, 0.13, 'triangle', 0.4, 520); },             // PATTY v75 boing
  web:        function(){ tone(520, 0.06, 'square', 0.28, -160); },             // PATTY v202 thwip
  shoot:      function(){ sweep(880, 220, 0.07, 'square', 0.22); },             // NEON SWARM shoot
  dive:       function(){ sweep(1200, 500, 0.25, 'square', 0.18); },            // NEON SWARM dive
  /* IMPACT */
  land:       function(){ tone(110, 0.09, 'square', 0.45); },                   // PATTY land
  hit:        function(){ sweep(300, 60, 0.18, 'sawtooth', 0.6); },             // NEON SWARM hit
  stun:       function(){ tone(1250, 0.08, 'square', 0.3, -300); },             // PATTY pepper
  crush:      function(){ tone(150, 0.16, 'sawtooth', 0.5, -90); },             // PATTY crush
  reflect:    function(){ sweep(1000, 1800, 0.1, 'square', 0.4); },             // NEON SWARM deflect ping
  /* BIG */
  big:        function(){ sweep(160, 30, 0.45, 'sawtooth', 0.9);
                          sweep(90, 25, 0.5, 'triangle', 0.7); },               // NEON SWARM layered boom
  nova:       function(){ sweep(70, 20, 1.0, 'sawtooth', 1.0);
                          sweep(900, 80, 0.7, 'triangle', 0.8); },              // NEON SWARM nova
  /* REWARD */
  pickup:     function(){ sweep(600, 1400, 0.12, 'sine', 0.5); },               // NEON SWARM absorb
  charge:     function(){ sweep(600, 1200, 0.25, 'sine', 0.6); },               // NEON SWARM nova-ready
  jingle:     function(){ arp([523, 659, 784, 1047], 70, 0.09, 'square', 0.35); }, // PATTY arp idiom, C major run
  waveclear:  function(){ sweep(440, 880, 0.3, 'triangle', 0.5); },             // NEON SWARM wave
  /* FAIL */
  death:      function(){ sweep(500, 40, 0.8, 'sawtooth', 1.0); },              // NEON SWARM death
  breakdown:  function(){ tone(220, 0.2, 'sawtooth', 0.45, 60); },              // PATTY v81 spring-break crunch
  overheat:   function(){ sweep(400, 70, 0.5, 'square', 0.6); }                 // NEON SWARM overheat
};

return { VERSION:VERSION, boot:boot, ready:ready, setVolume:setVolume,
         tone:tone, sweep:sweep, arp:arp, sfx:sfx,
         ctx:function(){return AC;}, bus:function(){return master;} };   /* kit v1.02: the shared context and master, exposed so contributions bind to THE kit instead of guessing internals (FRENZY FLEET's noiseFlat asked for exactly this) */
})();
/* ============================================================================
   grid-grudge-audiokit-music-contrib-v1.00.js
   Contribution to SNAIL-AUDIO-KIT  (target pack cut: AUDIO-KIT v1.1).
   Source: GRID GRUDGE, BUILD 55 (verified v55 bundle), audio engine v32 to v50.
   First delivery under the commons CONTRIBUTION model.

   Contributes, all sliced from shipped, gate-proven GRID GRUDGE code:
     1. AKIT.music      the step-sequencer music layer (musicPlayStep verbatim)
     2. AKIT.noise      the noise primitive (noiseBuf + filtered noise voice)   [addendum]
     3. AKIT.scaleWalk  the scale-walking SFX technique + move/rotate exemplars [addendum]
     4. one purpose-written demo track for the pack lab

   The GRID GRUDGE songs (NEON HOLD, DEEP CURRENT, and the in-match rotation)
   stay with the title. Only the ENGINE, the PRIMITIVE, and the TECHNIQUE are
   commons; the songs are the title's.

   Lifecycle lessons carried as code, not comments:
     v48  suppress exactly one sync after a resume  -> AKIT.music.suppressNextSync()

function inRect(x,y,r){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }

function spawnCheck(x){                               // v1.05: placed at x; kind and the gap AFTER it come from the check stream, by index
  var idx=G.spawned, r=G.rng.next(), kind='real', pr=Math.min(1,idx/DECOY_RAMP_N);

}

}

function busyStep(dt){

function held(){ return STATE==='play'&&!!(G&&G.tut); }   // THE HOLD LAW: one predicate; while true nothing in the sim moves and nothing ends
function makeSig(q){                                  // the signature reads DJT: three marker strokes and the spiky underline, sized by quality
  var h=(q==='PERFECT')?30:(q==='GOOD'?22:15), j=(q==='PERFECT')?1.5:(q==='GOOD'?3:6), w=h*0.72, x=28, y=CHECK_H*0.26, k, i;
  function J(){ return (G.fx.next()-0.5)*j; }
  var D=[[0,0],[0,h],[0,0],[w*0.7,h*0.12],[w*0.95,h*0.5],[w*0.7,h*0.88],[0,h]];
  var jx=w*1.2, JJ=[[jx,0],[jx+w*0.8,0],[jx+w*0.45,0],[jx+w*0.45,h*0.75],[jx+w*0.25,h],[jx,h*0.8]];

}

function trySign(){
  var best=null,bd=1e9;
  for(var i=0;i<G.checks.length;i++){ var c=G.checks[i]; if(c.signed)continue;
    var d=Math.abs((c.x+CHECK_W/2)-ZONE_X); if(d<=ZONE_HALF&&d<bd){bd=d;best=c;} }
  player.pulse=0.22; player.y=HAND_BASE_Y+HAND_DROP;
  if(!best){ callout('SCRIBBLE','#c8c8c8'); G.combo=0; SFX.sloppy(); addFloat('~',ZONE_X,BELT_Y-10,'#aaa',22); return; }
  best.signed=true;

    callout('NOT THAT ONE','#ff5a5a'); addFloat(best.kind==='tariff'?'THAT IS THE $2,000 ONE':'THAT IS THE $5,000 ONE',W/2,BELT_Y-24,'#ff7b7b',16);
    SFX.decoy(); strike('SIGNED THE WRONG CHECKS'); return; }

  else if(q==='GOOD'){ setFace('sign',0.3); callout('SIGNED','#57ff7a'); SFX.sign(); addFloat('+1',ZONE_X,BELT_Y-14,'#57ff7a',20); }
  else { setFace('sign',0.3); callout('SLOPPY, STILL COUNTS','#bfe8c9'); SFX.sloppy(); addFloat('+1',ZONE_X,BELT_Y-14,'#bfe8c9',18); }
}
function endRun(reason){
  if(STATE!=='play')return;

function update(dt){

  player.y+=(HAND_BASE_Y-player.y)*Math.min(1,dt*14);          // hand springs back to rest
  if(STATE==='title'){ if(tap){ if(inRect(tx,ty,TOG)){ tutSet(!tutOn()); SFX.ui(); } else if(inRect(tx,ty,FRB)){ setFrameRate(FRAME_RATE==='screen'?'60':'screen'); SFX.ui(); } else startRun(); } return; }   // v1.09: the FRAME RATE pill
  if(STATE==='over'){ G.overT+=dt; if(G.toastT>0)G.toastT-=dt; if(tap&&G.overT>1.5)resetGame(); return; }
  /* play: THE HOLD FIRST (held()). Only the card's own clock and cosmetic fades move. */
  if(G.tut){ G.tut.t+=dt; fadeCosmetics(dt); if(tap&&G.tut.t>=TUT_GUARD){ G.tut=null; G.ramp=RAMP_T; SFX.ui(); } return; }

        callout(bz?'PASSED HIM BY':'MISSED ONE','#ff7b7b'); addFloat(bz?'HE WAS BUSY':'UNSIGNED',70,BELT_Y-14,'#ff7b7b',18); strike(); if(STATE!=='play')return; tutShow('floor'); }
      else if(!c.signed) { addFloat('good, not that one',80,BELT_Y-14,'#8fa3c4',15); } } }
  fillBelt();
  for(i=G.debris.length-1;i>=0;i--){ var db=G.debris[i]; db.t+=dt; db.x+=db.vx*dt; db.y+=db.vy*dt; db.vy+=900*dt; if(db.y>H+40||db.t>2.5)G.debris.splice(i,1); }

        day:G.day,rng:G.rng.a,el:G.elapsed,sg:G.signed,pf:G.perfects,ms:G.missed,dc:G.decoys,sk:G.strikes,

/* ---- 7. FRAME PACING: the catch-up defenses and THE FRAME LAW (seed v1.07
        section 7, verbatim but for this title's own update and render).
        frameStep: pure, DOM-free, gated (frametest). Ceiling 200ms drops a
        background backlog and resyncs (face 1); STEP_CAP hard-limits ticks
        per frame (face 3). v1.09, THE FRAME LAW (doc 11 v1.04 section 5): the
        loop runs on the timestamp requestAnimationFrame hands it, never
        performance.now() inside the callback; its clock starts half a step
        in, so a steady screen runs one step a frame (never 0, then 2); it
        draws at most 60 a second by the cap snippet, verbatim, unless FRAME
        RATE is SCREEN (the pill on the title, or F); the FPS readout is the
        debug view (D, or ?debug in the address); a step feed, when set, is
        called before each step with its number (the refresh test).
        v1.12, SMOOTH STEPS (rule 4, a should): at SCREEN, drawAlpha is the
        unspent fraction of a step and the draw blends the belt, the checks,
        the hand, the floats and the cans between their last two steps
        (ipo, beltDraw), from the positions drawSnap keeps in the step loop;
        at 60 drawAlpha is 1 and the draw reads the newest step, as v1.11.
        Gated by refreshtest, captest and smoothtest. ---- */
var STEP_CAP=5;             // hard ceiling on sim ticks per animation frame
var STEP_MS=16.6667;
function frameStep(prevLast,now){
  var acc=now-prevLast;
  if(acc>200)return {steps:1,last:now,resync:true};   // drop the backlog, never sprint
  var steps=Math.floor(acc/STEP_MS);
  if(steps>STEP_CAP)steps=STEP_CAP;                    // the belt: cap regardless
  return {steps:steps,last:prevLast+steps*STEP_MS,resync:false};
}
var CAP_MS = 1000 / 60, capNext = -1;          // THE FRAME CAP (doc 11 section 5)
function capReady(ts) {                        // ts: the rAF timestamp
  if (capNext < 0) capNext = ts;
  if (ts < capNext - 2) return false;          // too soon on a fast screen: skip this refresh
  capNext += CAP_MS;
  if (capNext < ts - CAP_MS) capNext = ts;     // after a stall, count again from now
  return true;
}
var GAME_ID='signhere';     // v1.09: this title's storage prefix since v1.00 (signhere-tut, -board, -name); the fold key keeps its v1.06 form, sign-here-resume
var FRAME_RATE='60', FR_KEY=GAME_ID+'-framerate';   // v1.09: FRAME RATE: 60 or SCREEN, under the title's own key
var FRB={x:180,y:768,w:280,h:38};                   // v1.09: the FRAME RATE pill on the title (logical rect), clear of (320,440), (320,480) and the pen (320,760)
function setFrameRate(v){ FRAME_RATE=(v==='screen')?'screen':'60'; capNext=-1;
  try{ if(typeof localStorage!=='undefined')localStorage.setItem(FR_KEY,FRAME_RATE); }catch(e){} }
try{ if(typeof localStorage!=='undefined'&&localStorage.getItem(FR_KEY)==='screen')FRAME_RATE='screen'; }catch(e){}
var DEBUG=false; try{ DEBUG=typeof location!=='undefined'&&/[?&]debug\b/.test(location.search||''); }catch(e){}
var fps={last:-1,t0:-1,n:0,sum:0,worst:0,fps:0,mean:0,max:0};   // v1.09: the FPS readout, drawn frames only
function fpsMark(ts){
  if(fps.last>=0){ var d=ts-fps.last; fps.n++; fps.sum+=d; if(d>fps.worst)fps.worst=d; }
  fps.last=ts; if(fps.t0<0)fps.t0=ts;
  if(ts-fps.t0>=1000){ fps.fps=fps.n*1000/(ts-fps.t0); fps.mean=fps.n?fps.sum/fps.n:0; fps.max=fps.worst;
    fps.t0=ts; fps.n=0; fps.sum=0; fps.worst=0; }
}
var tick={on:false,last:0}; var lastSaveAt=0, stepN=0, stepFeed=null, drawAlpha=1;
var lerpG=null, lerpHand=0, lerpBelt=0;             // v1.12 SMOOTH STEPS: the run and the hand and belt as the last step began
function drawSnap(){                                 // v1.12: in the step loop, before each update: where things stood (drawing reads it, play never)
  lerpG=G; lerpHand=player.y; if(!G)return; lerpBelt=G.beltOff; var i, o;
  for(i=0;i<G.checks.length;i++){ o=G.checks[i]; o.px=o.x; }
  for(i=0;i<G.floats.length;i++){ o=G.floats[i]; o.py=o.y; }
  for(i=0;i<G.debris.length;i++){ o=G.debris[i]; o.px=o.x; o.py=o.y; }
}
function ipo(p,c){                                   // v1.12: the blend, drawing only; at drawAlpha 1 (FRAME RATE 60) the newest step itself
  return (drawAlpha>=1||lerpG!==G||typeof p!=='number')?c:p+(c-p)*drawAlpha; }
function beltDraw(){                                 // v1.12: the belt's stripe offset, blended across its wrap at 40
  if(drawAlpha>=1||lerpG!==G)return G.beltOff;
  var d=G.beltOff-lerpBelt; if(d<0)d+=40; return (lerpBelt+d*drawAlpha)%40; }
function resetLoop(){ tick.on=false; tick.last=0; capNext=-1; stepN=0; drawAlpha=1;
  fps.last=-1; fps.t0=-1; fps.n=0; fps.sum=0; fps.worst=0; fps.fps=0; fps.mean=0; fps.max=0; }
function frameTick(ts){
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(frameTick);   // first, as doc 11's snippet does
  try{
    if(typeof ts!=='number')ts=(typeof performance!=='undefined')?performance.now():Date.now();   // a direct call only: rAF always hands one
    if(FRAME_RATE!=='screen'&&!capReady(ts))return;
    fpsMark(ts);
    if(!tick.on){ tick.on=true; tick.last=ts-STEP_MS/2; }   // half a step in: one step a frame on a steady screen
    var fs=frameStep(tick.last,ts);
    tick.last=fs.resync?ts-STEP_MS/2:fs.last;
    for(var i=0;i<fs.steps;i++){
      if(stepFeed)stepFeed(stepN);
      stepN++;
      drawSnap();                                    // v1.12: where things stood, for the draw between steps
      update(1/60);
    }
    drawAlpha=(FRAME_RATE==='screen')?Math.max(0,Math.min(1,(ts-tick.last)/STEP_MS)):1;   // v1.12: blend only at SCREEN; at 60 every drawn frame is one step
    render();
    if(ts-lastSaveAt>5000){ saveState(); lastSaveAt=ts; }
  }catch(e){ reportErr('frameTick',e); }
}

/* ---- 8. PAGE VISIBILITY: pause hidden; resync on a long return (seed) ---- */
var hiddenAt=0;
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('visibilitychange',function(){
    var now=(typeof performance!=='undefined')?performance.now():Date.now();
    if(document.hidden){ hiddenAt=now; saveState(); sysPause('paused'); }   // v1.05: coming back never drops you onto a moving belt
    else { if(hiddenAt&&now-hiddenAt>1000){ tick.last=now-STEP_MS/2; } hiddenAt=0; }   // v1.09: half a step in (seed v1.07)
  });
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('pagehide',function(){
    saveState();
    try{ var ac=AKIT.ctx(); if(ac&&ac.close)ac.close(); }catch(e){}
  });
}

/* ==================== PORTAL ADAPTER FENCE : BEGIN ====================
   Platform SDK wiring lives here ONLY. Every hook is feature-detected and a
   silent no-op without a portal. gameplayStart fires at title->play,
   gameplayStop at the end of a run; adBreak is unused in a 60 second game. */
var PORTAL={
  init:function(){},
  gameplayStart:function(){},
  gameplayStop:function(){},
  adBreak:function(resume){ if(resume)resume(); }
};
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('blur',function(){ hiddenAt=(typeof performance!=='undefined')?performance.now():Date.now(); sysPause('paused'); });   // pause-on-blur (portal QA)
}
PORTAL.init();
/* ==================== PORTAL ADAPTER FENCE : END   ==================== */

/* ==================== SNAILNET SLOT : BEGIN ====================
   Solo title; the slot stays empty. A versus mode (two desks, same seed)
   would paste snail-netcode-vX.YZ.js here per SNAIL-NETCODE-PACK.
   ==================== SNAILNET SLOT : END   ==================== */

/* ---- 9. BOOT ---- */
resetGame();
loadState();
if(typeof requestAnimationFrame==='function')requestAnimationFrame(frameTick);

/*HOOK*/
})();
</script>
