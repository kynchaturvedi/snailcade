<script>
/* =============================================================================
   TAP ATTACK v1.00 | Snail Attack Studios | 2026-09-25 | var BUILD=1
   -----------------------------------------------------------------------------
   An homage to Bally Midway's TAPPER (1983) in the studio's arcade style: four
   bars, patrons pushing toward the taps, full mugs sliding out, empties sliding
   back. Up and down move between bars (wrapping, like the original); ONE
   button pours (hold) and slides (release). Six venues of three rounds and a
   SHAKE UP bonus game, seven patron types, six hazards, five bartenders with
   their own stats and perks, a local high score board, and two player online
   co-op over SNAIL-NETCODE (host authority, queue mode).
   -----------------------------------------------------------------------------
   CHANGELOG (embedded; append-only; one entry per build, written for a future
   developer):
   v1.00 (2026-09-25) FIRST LIGHT. Copied from studio-seed-v1.05 per doctrine
        07 (error reporter first, 640x880 logical grid per doc 11, device-sized
        backing store, closed-loop fit, fullscreen, audio behind a gesture,
        catch-up ceiling, fold survival, portal fence, SNAILNET slot, HOOK).
        Not a grid-arcade family title (no walk graph, no ladders: four lanes
        and a fixed tap end), so it starts from the SEED per 09 section 7.
        Seed section 3 replaced by the verb map: MOVE UP / MOVE DOWN edges and
        ONE held BUTTON; touch through a drawn control deck (UP, DOWN, POUR)
        plus vertical swipes; setInput(l,r,u,d,a) kept as the harness shim.
        Seed section 5 replaced by the game. THE ONE PRIMARY ECONOMY: THE TAB
        (score). Pour law: hold fills the mug under that bar's tap; release at
        or past the FULL line slides it; release inside the gold HEAD band is
        a PERFECT pour; holding into the foam past the band is SLOPPY; release
        below FULL keeps the half mug under that tap (TOP OFF). Lives go on a
        full mug hitting the door, an empty falling off the tap end, or a
        patron reaching the taps. Commons adopted verbatim: SNAIL AUDIO KIT
        core and the GRID GRUDGE music engine (bound to the kit instance), the
        FEEL PACK core, SNAIL-NETCODE v1.00. Gates: the seed chain adapted to
        these verbs plus pourtest, bartest, stagetest, boardtest, looptest.
   ============================================================================= */
(function(){
'use strict';
var BUILD=1;                              // integer line for the hook; VER is the stamp of record
var VER='1.00';                           // Director's law: v + x.yz in notes and filename

/* ---- 1. ERROR REPORTER (always first; doctrine 07). Crashes become
        photographable: the ERR line draws LAST, above everything. ---- */
var lastError=null, ERRMSG='';
function reportErr(site,e){ lastError=String(site)+': '+(e&&e.message?e.message:String(e)); ERRMSG='ERR: '+lastError; }

/* ---- 2. SHELL: canvas, integer scaler, fullscreen (seed v1.05, verbatim) ---- */
var W=640,H=880;                              // RESOLUTION LAW (doc 11 s3): 16/32-bit class grid
var cv=(typeof document!=='undefined')?document.getElementById('cv'):null;
var ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;
var DPR=1;
function applyBacking(){
  var d=(typeof window!=='undefined'&&window.devicePixelRatio)?window.devicePixelRatio:1;
  DPR=Math.max(1,Math.min(3,d));
  if(cv){ cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); }
  if(ctx){ if(ctx.setTransform)ctx.setTransform(DPR,0,0,DPR,0,0);
           ctx.imageSmoothingEnabled=false; }
}
applyBacking();
function viewSize(){
  var vw=window.innerWidth, vh=window.innerHeight;
  try{ if(window.visualViewport){
    vw=Math.min(vw,window.visualViewport.width);
    vh=Math.min(vh,window.visualViewport.height); }
  }catch(e){}
  try{ if(document.body&&document.body.clientWidth){
    vw=Math.min(vw,document.body.clientWidth);
    if(document.body.clientHeight)vh=Math.min(vh,document.body.clientHeight); }
  }catch(e){}
  return {w:vw,h:vh};
}
function computeScale(vw,vh){
  var s=Math.min(vw/W,vh/H);
  if(s>=2)s=Math.floor(s); if(s<0.25)s=0.25;
  return s;
}
function fitScale(){
  if(!cv||!cv.style||typeof window==='undefined')return;
  var v=viewSize(), s=computeScale(v.w,v.h);
  for(var i=0;i<8;i++){
    cv.style.width=Math.floor(W*s)+'px';
    cv.style.height=Math.floor(H*s)+'px';
    var r=cv.getBoundingClientRect?cv.getBoundingClientRect():null;
    if(!r||!r.width||r.bottom===undefined)break;
    var vw=window.innerWidth, vh=window.innerHeight;
    try{ if(window.visualViewport){ vw=Math.min(vw,window.visualViewport.width);
         vh=Math.min(vh,window.visualViewport.height); } }catch(e){}
    if(r.bottom<=vh+0.5&&r.right<=vw+0.5)break;
    if(s<=0.25)break;
    s=(s>2)?(s-1):(s*0.9); if(s<0.25)s=0.25;
  }
  applyBacking();
}
function settleFit(){
  fitScale();
  setTimeout(fitScale,150); setTimeout(fitScale,450); setTimeout(fitScale,1000);
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('resize',fitScale);
  window.addEventListener('orientationchange',function(){ settleFit(); });
  window.addEventListener('pageshow',function(){ settleFit(); });
  try{ if(window.visualViewport&&window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize',fitScale); }catch(e){}
}
if(typeof document!=='undefined'&&document.addEventListener)
  document.addEventListener('fullscreenchange',function(){ settleFit(); });
settleFit();
var fsBtn=(typeof document!=='undefined')?document.getElementById('fs'):null;
if(fsBtn&&fsBtn.addEventListener)fsBtn.addEventListener('click',function(){
  try{ var el=document.documentElement;
    if(document.fullscreenElement){ if(document.exitFullscreen)document.exitFullscreen(); }
    else if(el.requestFullscreen)el.requestFullscreen();
  }catch(e){}
  settleFit();
});

/* ---- 3. INPUT: THE VERB MAP. MOVE UP and MOVE DOWN are EDGES (one bar per
        press, wrapping top to bottom like the original); the ONE BUTTON is a
        HELD state (hold to pour, release to slide). Touch arrives through the
        drawn CONTROL DECK (UP, DOWN, POUR, PAUSE) plus vertical swipes on the
        bars; menus also take taps on their items. setInput(l,r,u,d,a) is the
        harness shim: rising edges become moves and presses, a is the button.
        touch-action none lives on the CANVAS only (07). ---- */
var SWIPE_MIN=34;                                  // logical px of vertical drag per bar step
var DECK_Y=684;                                    // the control deck owns y >= DECK_Y
var UPB={x:14,y:696,w:178,h:86}, DNB={x:14,y:786,w:178,h:86};
var PAUSEB={x:212,y:830,w:96,h:40}, POUR_X0=320, POURB={cx:500,cy:784,r:92};
var inp={l:false,r:false,u:false,d:false,a:false};   // held state for the shim and edge detection
var EV={u:0,d:0,l:0,r:0,press:0,back:0,bk:0,tap:null};   // edges waiting for update() to consume
var HOLD={kb:false,shim:false,touch:{}};           // every source of the ONE button
var hasTouch=false;                                // deck hints: finger words or key words
var DF={u:0,d:0};                                  // deck button flash timers (render only)
function btnHeld(){ if(HOLD.kb||HOLD.shim)return true; for(var k in HOLD.touch){ if(HOLD.touch[k])return true; } return false; }
function setInput(l,r,u,d,a){
  if(u&&!inp.u)EV.u++; if(d&&!inp.d)EV.d++; if(l&&!inp.l)EV.l++; if(r&&!inp.r)EV.r++;
  if(a&&!inp.a)EV.press++;
  HOLD.shim=!!a;
  inp.l=!!l; inp.r=!!r; inp.u=!!u; inp.d=!!d; inp.a=!!a;
}
var KEYMAP={ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',
  ' ':'a',z:'a',Z:'a',Enter:'a',j:'a',J:'a',Escape:'esc',p:'esc',P:'esc',Backspace:'bk'};
var kdown={};
function keyIn(e,on){
  var typing=(STATE==='initials')||(STATE==='lobby'&&NET.phase==='code');
  if(typing&&on&&/^[a-zA-Z.]$/.test(e.key)){ EV.typed=e.key.toUpperCase(); if(e.preventDefault)e.preventDefault(); return; }
  if(typing&&/^[a-zA-Z.]$/.test(e.key))return;
  var k=KEYMAP[e.key]; if(!k)return;
  if(on)firstGesture();
  if(on&&!kdown[k]){
    if(k==='u'){ EV.u++; DF.u=0.14; } else if(k==='d'){ EV.d++; DF.d=0.14; } else if(k==='l')EV.l++; else if(k==='r')EV.r++;
    else if(k==='a')EV.press++; else if(k==='esc')EV.back++; else if(k==='bk')EV.bk++;
  }
  kdown[k]=on;
  if(k==='a')HOLD.kb=on;
  if(e.preventDefault)e.preventDefault();
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('keydown',function(e){ if(e.repeat&&KEYMAP[e.key]){ if(e.preventDefault)e.preventDefault(); return; } keyIn(e,true); });
  window.addEventListener('keyup',function(e){ keyIn(e,false); });
  window.addEventListener('blur',function(){ kdown={}; HOLD.kb=false; HOLD.touch={}; PT={}; });
}
function inR(x,y,r){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }
function zoneAt(x,y){
  if(y>=DECK_Y){ if(inR(x,y,UPB))return 'up'; if(inR(x,y,DNB))return 'dn'; if(inR(x,y,PAUSEB))return 'pause';
    if(x>=POUR_X0)return 'pour'; return 'deck'; }
  return 'field';
}
var PT={};                                         // pointerId -> a live touch
function toLogical(cx,cy){ var r=cv.getBoundingClientRect(); return {x:(cx-r.left)*W/r.width, y:(cy-r.top)*H/r.height}; }
function ptrDown(id,cx,cy,touch){
  firstGesture(); if(touch)hasTouch=true;
  var p=toLogical(cx,cy), z=zoneAt(p.x,p.y);
  PT[id]={x0:p.x,y0:p.y,x:p.x,y:p.y,zone:z,swiped:false,sy:p.y};
  if(z==='up'){ EV.u++; DF.u=0.14; } else if(z==='dn'){ EV.d++; DF.d=0.14; } else if(z==='pause')EV.back++;
  else if(z==='pour'){ HOLD.touch[id]=true; EV.press++; }
}
function ptrMove(id,cx,cy){
  var t=PT[id]; if(!t)return; var p=toLogical(cx,cy); t.x=p.x; t.y=p.y;
  if(t.zone!=='field')return;
  var dy=p.y-t.sy;                                  // a long drag steps several bars: re-anchor per step
  if(Math.abs(dy)>=SWIPE_MIN&&Math.abs(dy)>=Math.abs(p.x-t.x0)*0.8){ t.swiped=true; t.sy=p.y; if(dy<0)EV.u++; else EV.d++; }
}
function ptrUp(id){
  var t=PT[id]; if(!t)return;
  if(t.zone==='field'&&!t.swiped&&Math.abs(t.x-t.x0)<24&&Math.abs(t.y-t.y0)<24)EV.tap={x:t.x0,y:t.y0};
  else if(t.zone==='deck')EV.tap={x:t.x0,y:t.y0};
  delete PT[id]; delete HOLD.touch[id];
}
if(cv&&cv.addEventListener){
  if(typeof window!=='undefined'&&'onpointerdown' in window){
    cv.addEventListener('pointerdown',function(e){ ptrDown(e.pointerId,e.clientX,e.clientY,e.pointerType==='touch'); try{ cv.setPointerCapture(e.pointerId); }catch(x){} if(e.preventDefault)e.preventDefault(); });
    cv.addEventListener('pointermove',function(e){ ptrMove(e.pointerId,e.clientX,e.clientY); });
    cv.addEventListener('pointerup',function(e){ ptrUp(e.pointerId); });
    cv.addEventListener('pointercancel',function(e){ ptrUp(e.pointerId); });
  }else{
    cv.addEventListener('touchstart',function(e){ for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; ptrDown('t'+t.identifier,t.clientX,t.clientY,true); } if(e.preventDefault)e.preventDefault(); },{passive:false});
    cv.addEventListener('touchmove',function(e){ for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; ptrMove('t'+t.identifier,t.clientX,t.clientY); } if(e.preventDefault)e.preventDefault(); },{passive:false});
    cv.addEventListener('touchend',function(e){ for(var i=0;i<e.changedTouches.length;i++)ptrUp('t'+e.changedTouches[i].identifier); if(e.preventDefault)e.preventDefault(); },{passive:false});
    cv.addEventListener('touchcancel',function(e){ for(var i=0;i<e.changedTouches.length;i++)ptrUp('t'+e.changedTouches[i].identifier); },{passive:false});
    cv.addEventListener('mousedown',function(e){ ptrDown('m',e.clientX,e.clientY,false); });
    cv.addEventListener('mousemove',function(e){ ptrMove('m',e.clientX,e.clientY); });
    if(typeof window!=='undefined')window.addEventListener('mouseup',function(){ ptrUp('m'); });
  }
  cv.addEventListener('contextmenu',function(e){ if(e.preventDefault)e.preventDefault(); });
}

/* ---- 4. AUDIO: the SNAIL AUDIO KIT (commons, 08 reuse rule). The core
        module below is spliced VERBATIM from snail-audio-lab-v1.06 (kit
        v1.02); the GRID GRUDGE music engine follows, bound to THE kit
        instance per the integration law (its two binding lines are marked).
        Compositions after the engine are this title's own. AKIT.boot() runs
        inside every gesture (firstGesture); headless every call is a silent
        no-op and cannot move a gate. ---- */
/* ---- SNAIL AUDIO KIT v1.00 core (spliced verbatim from the lab) ---- */
var AKIT = (function(){
'use strict';
var VERSION = '1.02';   /* kit v1.02: ctx/bus accessors + the five-title merge */
var AC = null, master = null, VOL = 0.16;          // NEON SWARM shipped master

function boot(){                                    // call inside every gesture
  try{
    if(!AC){
      var C = (typeof AudioContext !== 'undefined') ? AudioContext :
              (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if(!C) return false;
      AC = new C();
      master = AC.createGain(); master.gain.value = VOL;
      master.connect(AC.destination);
    }
    if(AC.state === 'suspended' && AC.resume) AC.resume();   // the seed lesson
    return true;
  }catch(e){ AC = null; return false; }
}
function setVolume(v){ VOL = Math.max(0, Math.min(1, v)); if(master) master.gain.value = VOL; }
function ready(){ return !!AC; }

/* PATTY PANIC v217 tone(), verbatim shape: linear slide, exp decay */
function tone(f, dur, type, vol, slide){
  if(!AC) return;
  try{
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(vol || 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
/* NEON SWARM v78 beep(), verbatim shape: exponential ramp to a target pitch */
function sweep(freq, end, dur, type, vol){
  if(!AC) return;
  try{
    var o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, end), t + dur);
    gn.gain.setValueAtTime(vol || 0.5, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
/* PATTY PANIC arp(), verbatim shape */
function arp(notes, step, dur, type, vol){
  if(!AC) return;
  for(var i = 0; i < notes.length; i++)
    (function(nt, j){ setTimeout(function(){ tone(nt, dur, type, vol); }, j * step); })(notes[i], i);
}

/* THE RECIPE BOOK: shipped sounds, per-recipe provenance. Grade your game's
   events (UI < action < impact < big < fail) and pick within the grade. */
var sfx = {
  /* UI */
  press:      function(){ tone(660, 0.05, 'square', 0.3); },                    // PATTY press
  tick:       function(){ tone(880, 0.03, 'square', 0.2); },                    // PATTY idiom, lighter
  /* ACTION */
  jump:       function(){ tone(340, 0.11, 'square', 0.3, 620); },               // PATTY v195 CAP CHEF chirp
  spring:     function(){ tone(300, 0.13, 'triangle', 0.4, 520); },             // PATTY v75 boing
  web:        function(){ tone(520, 0.06, 'square', 0.28, -160); },             // PATTY v202 thwip
  shoot:      function(){ sweep(880, 220, 0.07, 'square', 0.22); },             // NEON SWARM shoot
  dive:       function(){ sweep(1200, 500, 0.25, 'square', 0.18); },            // NEON SWARM dive
  /* IMPACT */
  land:       function(){ tone(110, 0.09, 'square', 0.45); },                   // PATTY land
  hit:        function(){ sweep(300, 60, 0.18, 'sawtooth', 0.6); },             // NEON SWARM hit
  stun:       function(){ tone(1250, 0.08, 'square', 0.3, -300); },             // PATTY pepper
  crush:      function(){ tone(150, 0.16, 'sawtooth', 0.5, -90); },             // PATTY crush
  reflect:    function(){ sweep(1000, 1800, 0.1, 'square', 0.4); },             // NEON SWARM deflect ping
  /* BIG */
  big:        function(){ sweep(160, 30, 0.45, 'sawtooth', 0.9);
                          sweep(90, 25, 0.5, 'triangle', 0.7); },               // NEON SWARM layered boom
  nova:       function(){ sweep(70, 20, 1.0, 'sawtooth', 1.0);
                          sweep(900, 80, 0.7, 'triangle', 0.8); },              // NEON SWARM nova
  /* REWARD */
  pickup:     function(){ sweep(600, 1400, 0.12, 'sine', 0.5); },               // NEON SWARM absorb
  charge:     function(){ sweep(600, 1200, 0.25, 'sine', 0.6); },               // NEON SWARM nova-ready
  jingle:     function(){ arp([523, 659, 784, 1047], 70, 0.09, 'square', 0.35); }, // PATTY arp idiom, C major run
  waveclear:  function(){ sweep(440, 880, 0.3, 'triangle', 0.5); },             // NEON SWARM wave
  /* FAIL */
  death:      function(){ sweep(500, 40, 0.8, 'sawtooth', 1.0); },              // NEON SWARM death
  breakdown:  function(){ tone(220, 0.2, 'sawtooth', 0.45, 60); },              // PATTY v81 spring-break crunch
  overheat:   function(){ sweep(400, 70, 0.5, 'square', 0.6); }                 // NEON SWARM overheat
};

return { VERSION:VERSION, boot:boot, ready:ready, setVolume:setVolume,
         tone:tone, sweep:sweep, arp:arp, sfx:sfx,
         ctx:function(){return AC;}, bus:function(){return master;} };   /* kit v1.02: the shared context and master, exposed so contributions bind to THE kit instead of guessing internals (FRENZY FLEET's noiseFlat asked for exactly this) */
})();

/* ---- GRID GRUDGE CONTRIBUTION (music engine + noise voice), TRIMMED to the
        parts this title uses (define, start, stop, mute, the step sequencer,
        the voices, the noise primitive). Every retained line is verbatim from
        the lab except those marked MERGE: the binding lines (integration law:
        wrappers bind to THE kit instance; the lab copy fell back to its own
        context because AKIT.ac never existed) and boot, which no longer makes
        a second context. Omitted as unused: pool, sync, suppressNextSync,
        resumeSameTrack, scale walk, the demo loop. The v49 hidden-tab stop
        lives in this title's visibility handler (section 8). ---- */
(function (AKIT) {
  'use strict';
  AKIT.music = AKIT.music || {};
  var _ac = null, _master = null, _musicBus = null, _sfxBus = null, _nbuf = null;
  function ac(){ return AKIT.ctx() || _ac; }                                        /* MERGE: bound to THE kit */
  function masterOf(A){ return AKIT.bus() || _master || (A ? A.destination : null); } /* MERGE: bound to THE kit */
  function ensureBuses(){
    var A = ac(); if (!A) return;
    if (!_musicBus){ _musicBus = A.createGain(); _musicBus.gain.value = 0.5; _musicBus.connect(masterOf(A)); }
    if (!_sfxBus){ _sfxBus = A.createGain(); _sfxBus.gain.value = 0.9; _sfxBus.connect(masterOf(A)); }
  }
  function musicBus(){ ensureBuses(); return _musicBus; }
  function sfxBus(){ ensureBuses(); return _sfxBus; }
  AKIT.music.boot = function (){
    if (ac()){ ensureBuses(); return true; }
    return false;                                                                   /* MERGE: never a second context; AKIT.boot() owns it */
  };
  function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function aenv(g, t, a, peak, d){ g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }

      p.vy += (p.g||0)*60*dt;                       // aged here, DRAWN by drawEmbers

function roundSpec(vi,ri,loop,np){
  var L=loop||0, k=Math.min(30,vi*3+ri+L*18);            // one progression index; LAST CALL x2 continues it (stagetest caught the reset)
  return {
    quota: Math.round((8+ri*3+vi*2+L*4)*(np>1?1.4:1)),   // patrons to serve out this round
    maxPer: Math.min(4, 1+Math.floor((k+1)/2.5)),        // patrons allowed on one bar at once
    walk: 24*(1+0.05*k),                                  // px/s during a walk phase (v1.00 probe: 0.06 made ORBIT 9 a wall)
    gap: Math.max(0.85, 2.9-0.1*k)*(np>1?0.8:1),          // seconds between arrivals
    push: Math.max(115, 215-5*k),                         // px a caught mug shoves (before modifiers)
    drink: Math.max(0.75, 1.7-0.05*k),                    // seconds a patron drinks
    empty: Math.min(240, 150+4*k),                        // px/s an empty slides home
    walkT:[0.55,1.1], waitT:[0.45,1.2]                    // walk and pause phase lengths
  };
}
function hazardsFor(vi,ri,loop){
  var s={}, v=VENUES[vi], i;
  for(i=0;i<v.hz[ri].length;i++)s[v.hz[ri][i]]=1;
  if(loop>0){ s.cat=1; for(i=0;i<v.hz[2].length;i++)s[v.hz[2][i]]=1; }
  return s;
}
function kegCap(vi,ri,loop){ return loop>0?5:(ri>=2?6:7); }

function countOn(b){ var n=0; for(var i=0;i<G.pts.length;i++){ var p=G.pts[i]; if(p.b===b&&p.st!=='exit')n++; } return n; }
function countType(t){ var n=0; for(var i=0;i<G.pts.length;i++)if(G.pts[i].type===t&&G.pts[i].st!=='exit')n++; return n; }
function pickType(){
  if(G.firstNew){ var f=G.firstNew; G.firstNew=null; return f; }
  var r=(G.loop>0)?VENUES[5].roster:VENUES[G.vi].roster, tot=0, k, last='regular';
  for(k in r)tot+=r[k];
  var x=rnd()*tot;
  for(k in r){ last=k; x-=r[k]; if(x<=0)break; }
  if(last==='snail'&&countType('snail')>=1)last='regular';
  return last;
}
function trySpawn(){
  var spec=G.spec, cnt=[0,0,0,0], near=[false,false,false,false], i, b;
  for(i=0;i<G.pts.length;i++){ var p=G.pts[i]; if(p.st==='exit')continue; cnt[p.b]++; if(p.x<SPAWN_X+46)near[p.b]=true; }
  var type=pickType(), beam=!!(G.hz.beam&&type!=='snail'&&rnd()<BEAM_P);
  var cand=[], wsum=0;
  for(b=0;b<NBARS;b++){ if(cnt[b]>=spec.maxPer)continue; if(!beam&&near[b])continue; cand.push(b); wsum+=spec.maxPer-cnt[b]; }
  if(!cand.length){ G.firstNew=G.firstNew||((type!=='regular')?type:null); return false; }
  var x=rnd()*wsum, pick=cand[0];
  for(i=0;i<cand.length;i++){ x-=spec.maxPer-cnt[cand[i]]; if(x<=0){ pick=cand[i]; break; } }
  spawnPatron(pick,type,beam?rr(BEAM_X):SPAWN_X,beam?'beam':'enter');
  G.spawned++;
  return true;
}
function spawnPatron(b,type,x,st){
  var p={id:G.pid++,b:b,x:x,vx:0,type:type,st:st,t:(st==='beam')?BEAM_T:0.35,hp:TYPES[type].hp,watch:false,
    mug:false,mq:'',by:0,look:(rnd()*1e6)|0,wk:0,pushLeft:0,drinkT:0,ang:0};
  G.pts.push(p);
  fx('s',st==='beam'?'beam':'step');
  return p;
}
function shellyOn(b){ for(var i=0;i<G.bts.length;i++){ var t=G.bts[i]; if(!t.gone&&t.bar===b&&CHARS[t.c].id==='shelly')return true; } return false; }

function updPatrons(dt){
  var spec=G.spec, hh=G.hhT>0;
  for(var i=G.pts.length-1;i>=0;i--){
    var p=G.pts[i], T=TYPES[p.type]; p.vx=0; p.wk+=dt;
    if(p.st==='beam'){ p.t-=dt; if(p.t<=0){ p.st='wait'; p.t=0.4; } continue; }
    if(p.st==='enter'){ p.t-=dt; if(p.t<=0){ p.st='walk'; p.t=rr(T.walkT||spec.walkT); } continue; }
    if(p.st==='exit'){ p.vx=-PUSH_V; p.x+=p.vx*dt; if(p.x<-40)G.pts.splice(i,1); continue; }
    if(p.st==='push'){ var d=PUSH_V*dt; p.vx=-PUSH_V; p.x-=d; p.pushLeft-=d;
      if(p.x<=EXIT_X)serveOut(p); else if(p.pushLeft<=0){ p.st='drink'; p.t=p.drinkT; }
      continue; }
    if(p.st==='drink'){ p.t-=dt; if(p.t<=0)finishDrink(p,i); continue; }
    if(p.st==='sulk'){ p.t-=dt; if(p.t<=0){ p.st='wait'; p.t=0.3; } continue; }
    if(p.watch)continue;
    if(p.st==='walk'){
      var v=spec.walk*T.spd*(hh?HH_WALK:1)*(shellyOn(p.b)?SHELLY_CALM:1);
      p.vx=v; p.x+=v*dt; p.t-=dt;
      if(p.x>=END_X){ p.x=END_X; mishap('reach',p.b,p.x); return; }
      if(p.t<=0){ p.st='wait'; p.t=rr(T.waitT||spec.waitT); }
    } else if(p.st==='wait'){ p.t-=dt; if(p.t<=0){ p.st='walk'; p.t=rr(T.walkT||spec.walkT); } }
    p.ang=(p.x>END_X-120)?1:0;
  }
}
function serveOut(p){
  p.st='exit'; p.mug=false; G.served++; G.stats.served++;
  var pts=Math.round(VENUES[G.vi].pts*TYPES[p.type].pts*(G.loop>0?1.5:1)/5)*5;
  addScore(pts,Math.max(40,p.x+30),laneY(p.b)+26,'#9ecbff');
  fx('s','serve');
}
function tipChance(p){ var t=TYPES[p.type].tip*TIP_BASE; var bt=G.bts[p.by]; if(bt&&CHARS[bt.c].id==='pearl')t*=PEARL_TIP; return t; }
function finishDrink(p,i){
  p.mug=false;
  var tip=rnd()<tipChance(p);
  spawnMug(p.b,p.x+HAND_DX+4,G.spec.empty*(G.hz.lowg?LOWG_MUG:1),'empty','',tip,p.by,1);
  if(TYPES[p.type].split){
    G.pts.splice(i,1);
    var a=spawnPatron(p.b,'mini',Math.min(END_X-40,p.x+16),'wait'), c=spawnPatron(p.b,'mini',Math.max(SPAWN_X,p.x-24),'wait');
    a.t=0.5; c.t=0.9; G.quota++; G.spawned++;
    fx('s','split'); fx('b',p.x,laneY(p.b)+50,'#b58bff',16,160);
    floatTxt('SPLIT!',p.x,laneY(p.b)+16,'#b58bff');
    return;
  }
  p.st='wait'; p.t=0.35;
}

/* ---- 7c. mugs ---- */
function spawnMug(b,x,v,k,q,tip,by,push){ var m={id:G.pid++,b:b,x:x,vx:(k==='full')?-v:v,k:k,q:q||'',tip:!!tip,hang:0,by:by||0,push:push||1}; G.mugs.push(m); return m; }
function mugFactor(b,x){ var f=1, u=G.bars[b].pud; for(var i=0;i<u.length;i++){ if(x>=u[i].x0&&x<=u[i].x1)f*=(u[i].k==='slick')?SLICK_K:STICKY_K; } return f; }
function catOn(b){ for(var i=0;i<G.cats.length;i++)if(G.cats[i].b===b)return G.cats[i]; return null; }
function findCatcher(m,prev){
  var best=null, bh=-1e9;
  for(var i=0;i<G.pts.length;i++){ var p=G.pts[i];
    if(p.b!==m.b||p.watch||p.mug)continue;
    if(p.st!=='walk'&&p.st!=='wait'&&p.st!=='enter')continue;
    var hand=p.x+HAND_DX;
    if(hand>=m.x-2&&hand<=prev+8&&hand>bh){ bh=hand; best=p; } }
  return best;
}
function btAt(b,catching){
  for(var i=0;i<G.bts.length;i++){ var t=G.bts[i]; if(t.gone)continue;
    if(t.bar===b)return t;
    if(catching&&t.md>0&&CHARS[t.c].id==='zip'&&(t.from===b||t.to===b))return t; }
  return null;
}
function graceTime(){ var g=0; for(var i=0;i<G.bts.length;i++){ if(G.bts[i].gone)continue; g=Math.max(g,CATCH_T[cstat(G.bts[i].c,'catch')]); } return g; }
function updMugs(dt){
  for(var i=G.mugs.length-1;i>=0;i--){
    var m=G.mugs[i], prev=m.x; m.x+=m.vx*mugFactor(m.b,m.x)*dt;
    if(m.k==='full'){
      var cat=catOn(m.b);
      if(cat&&cat.st==='walk'&&m.x<=cat.x+12&&prev>=cat.x-12){
        G.mugs.splice(i,1); cat.st='lap'; cat.t=CAT_LAP; fx('s','slurp'); fx('s','meow');
        floatTxt('SLURP!',cat.x,laneY(m.b)+60,'#c9ccd2'); continue; }
      var p=findCatcher(m,prev);
      if(p){ G.mugs.splice(i,1); catchMug(p,m); continue; }
      if(m.x<BREAK_X){ mishap('door',m.b,DOOR_X); return; }
    } else {
      if(m.x>=MUG_END){ m.x=MUG_END;
        var bt=btAt(m.b,true);
        if(bt){ G.mugs.splice(i,1); catchEmpty(bt,m); continue; }
        m.hang+=dt; if(m.hang>graceTime()){ mishap('drop',m.b,MUG_END); return; } }
    }
  }
}
function catchMug(p,m){
  var T=TYPES[p.type];
  if(T.perfectOnly&&m.q!=='perfect'){
    spawnMug(p.b,p.x+HAND_DX+6,G.spec.empty*1.15,'back',m.q,false,m.by,1);
    p.st='sulk'; p.t=0.8; fx('s','sendback'); floatTxt('SENT BACK!',p.x+10,laneY(p.b)+14,'#ff7b7b'); return; }
  var first=(p.hp>1); if(first)p.hp--;
  p.mug=true; p.mq=m.q; p.by=m.by; p.watch=false;
  p.pushLeft=G.spec.push*T.push*m.push*(first?(T.firstPush||1):1)*(G.hz.lowg?LOWG_PUSH:1);
  p.drinkT=G.spec.drink*(first?(T.firstDrink||T.drink):T.drink);
  p.st='push';
  fx('s','catch');
  if(m.q==='perfect'){ G.stats.perfect++; addScore(PTS_PERFECT,p.x+20,laneY(p.b)+8,'#ffd23f');
    if(G.hhT<=0){ G.happy++; if(G.happy>=HAPPY_MAX)startHappy(); } }
}
function catchEmpty(bt,m){
  bt.pose='catch'; bt.poseT=0.25;
  if(m.k==='back'){ floatTxt('SAVED',MUG_END-24,laneY(m.b)+44,'#9ecbff'); fx('s','clink'); return; }
  G.stats.empties++; addScore(PTS_EMPTY,MUG_END-26,laneY(m.b)+46,'#dfe8ff'); fx('s','clink');
  if(m.tip){ G.stats.tips++; addScore(PTS_TIP,MUG_END-60,laneY(m.b)+16,'#ffd23f',true); fx('s','tip');
    fx('b',MUG_END,laneY(m.b)+TOP_Y-20,'#ffd23f',18,160); startShow(m.b); }
}

/* ---- 7d. the bartenders ---- */
function reqMove(bt,dir){
  if(bt.md>0){ bt.q=dir; return; }
  var t=wrapBar(bt.bar+dir);
  if(G.np>1){ var o=G.bts[1-bt.p]; if(o&&!o.gone){ var ob=(o.md>0)?o.to:o.bar; if(t===ob)t=wrapBar(t+dir); } }
  bt.from=bt.bar; bt.to=t; bt.mt=0; bt.md=MOVE_T[cstat(bt.c,'move')];
}
function updBartender(bt,dt){
  var P=pin[bt.p];
  if(bt.gone){ clearEdges(P); return; }
  while(P.u>0){ P.u--; reqMove(bt,-1); }
  while(P.d>0){ P.d--; reqMove(bt,1); }
  if(bt.md>0){ bt.mt+=dt; if(bt.mt>=bt.md*0.5)bt.bar=bt.to;
    if(bt.mt>=bt.md){ bt.md=0; bt.mt=0; bt.bar=bt.to; bt.from=bt.to; if(bt.q){ var d=bt.q; bt.q=0; reqMove(bt,d); } } }
  if(bt.poseT>0){ bt.poseT-=dt; if(bt.poseT<=0)bt.pose='idle'; }
  var held=!!P.btn, settled=bt.md<=0, br=G.bars[bt.bar];
  if(held&&settled){
    if(br.keg===0){ br.chg+=dt/KEG_T; bt.pose='keg'; bt.poseT=0.12; bt.pourBar=-1;
      if(br.chg>=1){ br.keg=br.kegMax; br.chg=0; fx('s','keg'); floatTxt('FRESH KEG',BT_X-40,laneY(bt.bar)+22,'#9ad94b'); } }
    else { var rate=1/POUR_T[cstat(bt.c,'pour')]; if(br.fill>=1)rate*=FOAM_SLOW;
      br.fill=Math.min(FILL_MAX,br.fill+rate*dt); bt.pourBar=bt.bar; bt.pose='pour'; bt.poseT=0.12; }
  }
  if(!held&&bt.wasHeld&&bt.pourBar>=0){
    var pb=G.bars[bt.pourBar];
    if(P.relFill!=null&&Math.abs(P.relFill-pb.fill)<=NET_TRUST)pb.fill=Math.min(FILL_MAX,Math.max(0,P.relFill));   // online guest: the fill the guest SAW when letting go (its own pour, predicted)
    if(settled&&bt.bar===bt.pourBar&&pb.fill>=1)throwMug(bt,pb);
    else if(pb.fill>0.12&&pb.fill<1&&G.hintTop<4){ G.hintTop++; floatTxt('TOP IT OFF',BT_X-44,laneY(bt.pourBar)+30,'#9ecbff'); fx('s','topoff'); }
    bt.pourBar=-1;
  }
  if(!held)P.relFill=null;
  bt.wasHeld=held;
}
function pourQuality(c,f){
  var hw=HEAD_W[cstat(c,'head')];
  if(f<1)return 'none';
  if(G&&G.hhT>0)return 'perfect';
  if(f<=1+hw)return 'perfect';
  if(f<=1+hw+OVER_PAD)return 'clean';
  return 'sloppy';
}
function throwMug(bt,br){
  var c=bt.c, q=pourQuality(c,br.fill);
  var v=SLIDE_V[cstat(c,'slide')]*(G.hz.lowg?LOWG_MUG:1);
  var push=SLIDE_PUSH[cstat(c,'slide')]*(CHARS[c].id==='tank'?TANK_PUSH:1);
  spawnMug(bt.bar,MUG_X0,v,'full',q,false,bt.p,push);
  br.fill=(q==='perfect'&&CHARS[c].id==='fizz')?FIZZ_TOPUP:0;
  if(br.keg>0)br.keg--;
  bt.pose='throw'; bt.poseT=0.22; G.stats.pours++;
  fx('s','slide');
  if(q==='perfect'){ fx('s','perfect'); floatTxt('PERFECT',MUG_X0-30,laneY(bt.bar)+64,'#ffd23f'); }
  else if(q==='sloppy'){ G.stats.sloppy++; G.happy=0; fx('s','sloppy'); floatTxt('SLOPPY',MUG_X0-30,laneY(bt.bar)+64,'#ff9a5a'); }
}

/* ---- 7e. hazards, the show, happy hour, the tab ---- */
function updHazards(dt){
  var i;
  if(G.hz.cat){ G.catT-=dt; if(G.catT<=0){ G.catT=rr(CAT_GAP); var b=(rnd()*NBARS)|0; if(!catOn(b)){ G.cats.push({b:b,x:DOOR_X+22,st:'walk',t:0}); fx('s','meow'); } } }
  for(i=G.cats.length-1;i>=0;i--){ var c=G.cats[i];
    if(c.st==='walk'){ c.x+=CAT_V*dt; if(c.x>=END_X-40){ c.st='hop'; c.t=0.45; } }
    else if(c.st==='lap'){ c.t-=dt; if(c.t<=0)c.st='walk'; }
    else { c.t-=dt; c.x+=90*dt; if(c.t<=0)G.cats.splice(i,1); } }
  if(G.hz.blackout){ G.blackT-=dt; if(G.blackT<=0){ G.blackT=rr(BLACK_GAP)+BLACK_WARN+BLACK_T; var bb=(rnd()*NBARS)|0; G.bars[bb].warn=BLACK_WARN; fx('s','buzz'); } }
  for(i=0;i<NBARS;i++){ var br=G.bars[i];
    if(br.warn>0){ br.warn-=dt; if(br.warn<=0){ br.warn=0; br.dark=BLACK_T; } }
    else if(br.dark>0){ br.dark-=dt; if(br.dark<0)br.dark=0; } }
}
function startShow(b){
  G.show={t:SHOW_T,b:b};
  for(var i=0;i<G.pts.length;i++){ var p=G.pts[i]; if((p.st==='walk'||p.st==='wait'||p.st==='enter')&&rnd()<SHOW_WATCH)p.watch=true; }
  fx('s','show'); var s=VENUES[G.vi].show; banner(s.name,s.col,1.6);
}
function endShow(){ G.show=null; for(var i=0;i<G.pts.length;i++)G.pts[i].watch=false; }
function startHappy(){ G.happy=0; G.hhT=HH_T; fx('s','happy'); fx('f',0.3,'#ffd23f'); banner('HAPPY HOUR!','#ffd23f',1.8); }
function addScore(n,x,y,col,big){
  n=n*((G.hhT>0)?2:1); G.score+=n;
  if(x!=null)floatTxt('+'+n,x,y,col,big);
  while(G.score>=G.nextLife){ G.nextLife+=EXTRA_EVERY; if(G.lives<LIVES_MAX){ G.lives++; fx('s','oneup'); banner('EXTRA MUG!','#57ff7a',1.4); } }
}
var MISHAP_TXT={door:'A MUG HIT THE DOOR!', drop:'AN EMPTY HIT THE FLOOR!', reach:'THEY REACHED THE TAPS!'};
function mishap(why,b,x){
  if(STATE!=='play')return;
  STATE='mishap'; G.mishap={why:why,b:b,x:x,t:0}; G.lives--; G.happy=0; G.hhT=0; G.roundClean=false;
  if(G.show)endShow();
  fx('s',why==='reach'?'crush':'shatter'); fx('s','mishap'); fx('k',0.5,6); fx('f',0.25,'#ff3030');
  fx('b',x,laneY(b)+TOP_Y-8,'#dfefff',26,220); fx('v',[60,40,120]);
}
function resumeRound(){
  G.pts=[]; G.mugs=[]; G.cats=[]; G.show=null; G.spawned=G.served; G.spawnT=1.0; G.mishap=null;
  for(var b=0;b<NBARS;b++){ G.bars[b].fill=0; G.bars[b].dark=0; G.bars[b].warn=0; }
  for(var i=0;i<G.bts.length;i++)G.bts[i].pourBar=-1;
  STATE='play'; banner('READY?','#ffd23f',1.2);
}
function roundClear(){
  STATE='clear'; G.clearT=0; G.cats=[]; G.clearClean=G.roundClean;
  addScore(PTS_CLEAR); if(G.roundClean)addScore(PTS_CLEAN);
  fx('s','clear');
}
function gameOver(){
  STATE='over'; G.overT=0; fx('s','over'); PORTAL.gameplayStop(); clearSave();
  G.stats.reached=VENUES[G.vi].name+' '+(G.loop>0?('x'+(G.loop+1)+' '):'')+(G.ri+1);
}

/* ---- 7f. the per-state updates ---- */
function updPlay(dt){
  G.t+=dt;
  if(G.hhT>0){ G.hhT-=dt; if(G.hhT<=0)G.hhT=0; }
  if(G.show){ G.show.t-=dt; if(G.show.t<=0)endShow(); }
  for(var i=0;i<G.bts.length;i++)updBartender(G.bts[i],dt);
  if(G.spawned<G.quota){ G.spawnT-=dt; if(G.spawnT<=0){ trySpawn(); G.spawnT=G.spec.gap*(0.7+rnd()*0.6); } }
  updHazards(dt);
  updPatrons(dt); if(STATE!=='play')return;
  updMugs(dt); if(STATE!=='play')return;
  if(G.spawned>=G.quota&&!G.pts.length&&!G.mugs.length)roundClear();
}
function updCard(dt){
  G.card.t+=dt;
  if(G.card.t<CARD_GUARD)return;
  for(var p=0;p<G.np;p++){ if(pin[p].press>0){ fx('s','sel'); startRound(); return; } }
}
function updSelect(dt){
  var S=G.sel; S.t+=dt;
  for(var p=0;p<G.np;p++){ var P=pin[p];
    if(!S.lock[p]){
      var d=(P.d+P.r)-(P.u+P.l);
      if(d){ S.c[p]=(S.c[p]+d+CHARS.length*20)%CHARS.length; fx('s','move'); }
      if(P.pick>=0){ if(S.c[p]===P.pick&&S.t>0.3){ S.lock[p]=true; fx('s','lock'); } else { S.c[p]=P.pick; fx('s','move'); } }
      else if(P.press>0&&S.t>0.3){ S.lock[p]=true; fx('s','lock'); }
    } else if(P.u+P.d+P.l+P.r>0||P.pick>=0){ S.lock[p]=false; fx('s','back'); }
  }
  var all=true; for(p=0;p<G.np;p++)if(!S.lock[p])all=false;
  if(all){ S.go+=dt; if(S.go>0.6)startMatch(); } else S.go=0;
}
function startBonus(){
  G.bonus={ph:'show',t:0,slots:[0,1,2,3,4,5],calm:(rnd()*6)|0,swaps:6+G.vi*2+G.loop*3,
    dur:Math.max(0.15,0.36-G.vi*0.035-G.loop*0.05),sw:null,n:0,cur:[1,4],lock:[false,false],win:[false,false],rat:0};
  STATE='bonus'; G.banner=null;
}
function nextSwap(){ var B=G.bonus, a=(rnd()*6)|0, b=(a+1+((rnd()*5)|0))%6; B.sw={a:a,b:b,t:0}; fx('s','rattle'); }
function updBonus(dt){
  var B=G.bonus; B.t+=dt;
  if(B.ph==='show'){ B.rat-=dt; if(B.rat<=0){ B.rat=0.16; fx('s','rattle'); } if(B.t>=2.2){ B.ph='shuffle'; B.t=0; B.n=0; nextSwap(); } }
  else if(B.ph==='shuffle'){ B.sw.t+=dt; if(B.sw.t>=B.dur){ var s=B.sw, tmp=B.slots[s.a]; B.slots[s.a]=B.slots[s.b]; B.slots[s.b]=tmp; B.n++;
      if(B.n>=B.swaps){ B.ph='pick'; B.t=0; B.sw=null; } else nextSwap(); } }
  else if(B.ph==='pick'){
    var all=true;
    for(var p=0;p<G.np;p++){ var P=pin[p];
      if(!B.lock[p]){ var d=(P.d+P.r)-(P.u+P.l); if(d){ B.cur[p]=(B.cur[p]+d+60)%6; fx('s','move'); }
        if(P.pick>=0){ if(B.cur[p]===P.pick&&B.t>0.3){ B.lock[p]=true; fx('s','sel'); } else { B.cur[p]=P.pick; fx('s','move'); } }
        else if(P.press>0&&B.t>0.3){ B.lock[p]=true; fx('s','sel'); } }
      if(!B.lock[p])all=false; }
    if(all){ B.ph='reveal'; B.t=0; var any=false;
      for(p=0;p<G.np;p++){ B.win[p]=(B.slots[B.cur[p]]===B.calm); if(B.win[p]){ any=true; addScore(Math.round(PTS_BONUS*(1+G.loop*0.5)),120+B.cur[p]*80,360,'#ffd23f',true); } }
      fx('s',any?'win':'spray'); if(!any)fx('f',0.2,'#fff3d0'); }
  }
  else if(B.ph==='reveal'){ if(B.t>=2.8){ G.bonus=null; G.vi++; if(G.vi>=VENUES.length){ G.vi=0; G.loop++; } startVenue(G.vi); } }
}
function updCosmetic(dt){
  if(!G)return;
  for(var i=G.fl.length-1;i>=0;i--){ var f=G.fl[i]; f.y-=36*dt; f.l-=dt*0.85; if(f.l<=0)G.fl.splice(i,1); }
  if(G.banner){ G.banner.t-=dt; if(G.banner.t<=0)G.banner=null; }
}
function simStep(dt){
  if(STATE==='select')updSelect(dt);
  else if(STATE==='intro')updCard(dt);
  else if(STATE==='play')updPlay(dt);
  else if(STATE==='mishap'){ G.mishap.t+=dt; if(G.mishap.t>=MISHAP_T){ if(G.lives<=0)gameOver(); else resumeRound(); } }
  else if(STATE==='clear'){ G.clearT+=dt; if(G.clearT>=CLEAR_T){ G.ri++; if(G.ri>=3)startBonus(); else startRound(); } }
  else if(STATE==='bonus')updBonus(dt);
  else if(STATE==='over')G.overT+=dt;
  updCosmetic(dt);
}
function quickStart(mode,chars,vi,ri,loop){
  newMatch(mode||'solo'); if(chars)G.sel.c=chars.slice(0,2).concat(chars.length<2?[1]:[]);
  startMatch(); G.vi=vi||0; G.ri=ri||0; G.loop=loop||0; startRound();
}

var LETTERS='ABCDEFGHJKLMNPQRSTUVWXYZ';           // room codes: no I or O

function hitMenu(n,tap,y0,h){ if(!tap)return -1; for(var i=0;i<n;i++){ if(inR(tap.x,tap.y,menuRect(i,n,y0,h)))return i; } return -1; }
function navMenu(L,n){ var d=L.d-L.u; if(d){ UI.menu=(UI.menu+d+n*10)%n; playSfx('move'); } }
function titleItems(){ return ['1 PLAYER','2 PLAYERS ONLINE','HIGH SCORES','HOW TO PLAY','SOUND: '+(SND.on?'ON':'OFF'),'MUSIC: '+(SND.mus?'ON':'OFF')]; }
function onlineItems(){ return ['HOST A GAME','JOIN A GAME','BACK']; }

function goTitle(){ STATE='title'; UI.menu=0; UI.pause=false; G=null; pin=[mkPin(),mkPin()]; }
function stTitle(L,dt){
  var it=titleItems(), n=it.length; UI.t+=dt;
  navMenu(L,n);
  var h=hitMenu(n,L.tap,318,46); if(h>=0){ UI.menu=h; L.press++; }
  if(L.press){ var k=UI.menu; playSfx('sel');
    if(k===0){ netClose(); newMatch('solo'); }
    else if(k===1){ STATE='online'; UI.menu=0; }
    else if(k===2){ STATE='board'; UI.board=0; UI.entry=null; UI.from='title'; }
    else if(k===3){ STATE='howto'; UI.how=0; }
    else if(k===4)toggleSound();
    else if(k===5)toggleMusic(); }
}
function stOnline(L){
  var n=3; navMenu(L,n);
  var h=hitMenu(n,L.tap,420,56); if(h>=0){ UI.menu=h; L.press++; }
  if(L.back){ playSfx('back'); goTitle(); UI.menu=1; return; }
  if(L.press){ playSfx('sel');
    if(UI.menu===0)startHost();
    else if(UI.menu===1){ STATE='lobby'; NET.phase='code'; UI.cslot=0; }
    else { goTitle(); UI.menu=1; } }
}
function stLobby(L,dt){
  if(NET.phase==='code'){
    if(L.u){ UI.code[UI.cslot]=(UI.code[UI.cslot]+1)%LETTERS.length; playSfx('move'); }
    if(L.d){ UI.code[UI.cslot]=(UI.code[UI.cslot]+LETTERS.length-1)%LETTERS.length; playSfx('move'); }
    if(L.typed){ var ix=LETTERS.indexOf(L.typed); if(ix>=0){ UI.code[UI.cslot]=ix; L.r++; } }
    if(L.tap){ for(var s=0;s<4;s++){ if(inR(L.tap.x,L.tap.y,codeSlot(s))){ UI.cslot=s; playSfx('move'); } }
      if(inR(L.tap.x,L.tap.y,{x:170,y:560,w:300,h:56}))L.press++; }
    if(L.l||L.bk){ if(UI.cslot>0){ UI.cslot--; playSfx('back'); } }
    if(L.r&&UI.cslot<3){ UI.cslot++; playSfx('move'); }
    if(L.press){ if(UI.cslot<3){ UI.cslot++; playSfx('sel'); } else { var c=''; for(var i=0;i<4;i++)c+=LETTERS.charAt(UI.code[i]); playSfx('sel'); startJoin(c); } }
    if(L.back){ playSfx('back'); STATE='online'; UI.menu=1; }
    return;
  }
  if(NET.phase==='hosting'){
    var hn=2; navMenu(L,hn);
    var h=hitMenu(hn,L.tap,560,52); if(h>=0){ UI.menu=h; L.press++; }
    if(L.back||(L.press&&UI.menu===1)){ playSfx('back'); netClose(); STATE='online'; UI.menu=0; return; }
    if(L.press&&UI.menu===0){ playSfx('sel'); shareInvite(); }
    return;
  }
  if(L.back||L.press||L.tap){ if(NET.phase!=='connecting'||L.back){ playSfx('back'); netClose(); STATE='online'; UI.menu=0; } }
}
function codeSlot(s){ return {x:152+s*88,y:420,w:72,h:92}; }
function shareInvite(){
  var url='';
  try{ if(typeof location!=='undefined'&&/^https?:/.test(location.protocol))url=location.origin+location.pathname+'?join='+NET.code; }catch(e){}
  var text='Join my bar in TAP ATTACK. Room code '+NET.code+(url?(': '+url):'');
  try{ if(typeof navigator!=='undefined'&&navigator.share){ navigator.share({title:'TAP ATTACK',text:text,url:url||undefined}).then(function(){ msg('INVITE SENT'); },function(){ copyInvite(text); }); return; } }catch(e){}
  copyInvite(text);
}
function copyInvite(t){ try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ msg('INVITE COPIED'); },function(){ msg('CODE: '+NET.code); }); return; } }catch(e){} msg('CODE: '+NET.code); }
function stHowto(L){
  if(L.tap||L.press||L.r||L.d){ UI.how++; playSfx('move'); if(UI.how>=3){ goTitle(); UI.menu=3; } }
  else if((L.l||L.u)&&UI.how>0){ UI.how--; playSfx('move'); }
  if(L.back){ playSfx('back'); goTitle(); UI.menu=3; }
}
function stBoard(L){
  if(L.l||L.r){ UI.board=1-UI.board; playSfx('move'); }
  if(L.tap&&L.tap.y<200){ UI.board=1-UI.board; playSfx('move'); return; }
  if(L.press||L.back||L.tap){ playSfx('back'); netClose(); goTitle(); UI.menu=2; }
}
/* ---- initials: classic three letters; up and down turn the wheel, the
        button stamps a letter, left steps back ---- */
function toInitials(){
  var mode=G.mode, score=G.score;
  UI.final={mode:mode,score:score,reached:G.stats.reached,c:(G.bts[LOCALP()]?G.bts[LOCALP()].c:0),partner:(G.np>1&&G.bts[1-LOCALP()])?G.bts[1-LOCALP()].c:-1};
  NET.live=false;
  if(boardQualifies(mode,score)){ STATE='initials'; UI.slot=0; UI.t=0; }
  else { STATE='board'; UI.board=(mode==='duo')?1:0; UI.entry=null; UI.from='over'; msg('NO NEW RECORD THIS TIME',3); }
}
function stInitials(L,dt){
  UI.t+=dt; var n=INI_ABC.length;
  if(L.u){ UI.ini[UI.slot]=(UI.ini[UI.slot]+1)%n; playSfx('move'); }
  if(L.d){ UI.ini[UI.slot]=(UI.ini[UI.slot]+n-1)%n; playSfx('move'); }
  if(L.typed){ var ix=INI_ABC.indexOf(L.typed); if(ix>=0){ UI.ini[UI.slot]=ix; L.press++; } }
  if((L.l||L.bk)&&UI.slot>0){ UI.slot--; playSfx('back'); }
  if(L.tap){ for(var s=0;s<3;s++)if(inR(L.tap.x,L.tap.y,iniSlot(s))){ UI.slot=s; playSfx('move'); } }
  if(L.press&&UI.t>0.25){ playSfx('sel'); if(UI.slot<2)UI.slot++; else finishInitials(); }
}
function iniSlot(s){ return {x:200+s*84,y:440,w:72,h:96}; }
function iniString(){ var s=''; for(var i=0;i<3;i++)s+=INI_ABC.charAt(UI.ini[i]); return s; }
function finishInitials(){
  var n=iniString(), F=UI.final; lsSet('tapattack-ini',n);
  UI.entry=boardAdd(F.mode,{n:n,s:F.score,r:F.reached,c:F.c,p:(F.mode==='duo')?(NET.partnerIni||'???'):'',t:Date.now()});
  if(F.mode==='duo'&&NET.net)NET.net.send('ini',{n:n});
  reportScore(F.score,n);
  STATE='board'; UI.board=(F.mode==='duo')?1:0; UI.from='over';
}
function reportScore(s,n){ try{ if(typeof window!=='undefined'&&window.parent&&window.parent!==window)window.parent.postMessage({snailcade:'score',score:s,initials:n},'*'); }catch(e){} }

/* ---- the board: local, top ten per mode ---- */
var BOARD_KEY='tapattack-board-v1';
function boardLoad(){ try{ var b=JSON.parse(lsGet(BOARD_KEY)||'{}'); if(!b||typeof b!=='object')b={}; if(!Array.isArray(b.solo))b.solo=[]; if(!Array.isArray(b.duo))b.duo=[]; return b; }catch(e){ return {solo:[],duo:[]}; } }
function boardList(mode){ return boardLoad()[mode==='duo'?'duo':'solo']; }
function boardQualifies(mode,score){ if(score<=0)return false; var l=boardList(mode); return l.length<10||score>l[l.length-1].s; }
function boardAdd(mode,e){ var b=boardLoad(), k=(mode==='duo')?'duo':'solo'; b[k].push(e); b[k].sort(function(p,q){ return q.s-p.s||p.t-q.t; }); if(b[k].length>10)b[k].length=10; lsSet(BOARD_KEY,JSON.stringify(b)); return e.t; }
function hiScore(mode){ var l=boardList(mode||'solo'); return l.length?l[0].s:0; }

/* ---- pause (local): solo freezes the sim, online keeps the bar open ---- */
function pauseItems(){ return ['RESUME','SOUND: '+(SND.on?'ON':'OFF'),'MUSIC: '+(SND.mus?'ON':'OFF'),NET.role?'LEAVE GAME':'QUIT TO TITLE']; }
function stPause(L){
  var n=4; if(L.d-L.u){ UI.pmenu=(UI.pmenu+L.d-L.u+40)%n; playSfx('move'); }
  var h=hitMenu(n,L.tap,300,54); if(h>=0){ UI.pmenu=h; L.press++; }
  if(L.back){ UI.pause=false; playSfx('back'); return; }
  if(L.press){ playSfx('sel');
    if(UI.pmenu===0)UI.pause=false; else if(UI.pmenu===1)toggleSound(); else if(UI.pmenu===2)toggleMusic();
    else { UI.pause=false; if(NET.net)NET.net.send('bye',null); netClose(); clearSave(); PORTAL.gameplayStop(); goTitle(); } }
}

/* ---- 8b. FOLD SURVIVAL (seed v1.02 shape: localStorage, play-state only,
        15 minute expiry, clearSave for return-to-title). The whole match G
        is plain JSON, so a folded solo run resumes exactly; online matches
        are never saved (the partner cannot wait). ---- */
var SAVE_KEY='tapattack-resume';
var SAVE_FRESH_MS=15*60*1000;
var SAVE_STATES={intro:1,play:1,mishap:1,clear:1,bonus:1};
function saveState(){
  if(!G||!SAVE_STATES[STATE]||NET.role)return false;
  if(typeof localStorage==='undefined')return false;
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,t:Date.now(),st:STATE,g:G})); return true; }catch(e){ return false; }
}
function loadState(){
  if(typeof localStorage==='undefined')return false;
  try{
    var raw=localStorage.getItem(SAVE_KEY); if(!raw)return false;
    var s=JSON.parse(raw); if(!s||s.v!==1||!SAVE_STATES[s.st]||!s.g)return false;
    if(Date.now()-s.t>SAVE_FRESH_MS)return false;
    G=s.g; G.evq=[]; STATE=s.st; pin=[mkPin(),mkPin()]; UI.pause=(STATE==='play');
    for(var i=0;i<G.bts.length;i++){ G.bts[i].wasHeld=false; G.bts[i].pourBar=-1; }
    return true;
  }catch(e){ return false; }
}
function clearSave(){
  if(typeof localStorage==='undefined')return false;
  try{ localStorage.removeItem(SAVE_KEY); return true; }catch(e){ return false; }
}

/* ---- 8c. the orchestrator ---- */
function takeEdges(){
  var L={u:EV.u,d:EV.d,l:EV.l,r:EV.r,press:EV.press,back:EV.back,bk:EV.bk,tap:EV.tap,typed:EV.typed||null};
  EV.u=EV.d=EV.l=EV.r=EV.press=EV.back=EV.bk=0; EV.tap=null; EV.typed=null;
  return L;
}
function LOCALP(){ return NET.role==='guest'?1:0; }
function tapPick(tap){                           // a tap on a character tile or a can becomes a pick
  if(!tap||!G)return -1;
  if(STATE==='select'){ for(var i=0;i<CHARS.length;i++)if(inR(tap.x,tap.y,charTile(i)))return i; }
  if(STATE==='bonus'&&G.bonus&&G.bonus.ph==='pick'){ for(var j=0;j<6;j++)if(inR(tap.x,tap.y,canRect(j)))return j; }
  return -1;
}
function charTile(i){ return {x:24+i*120,y:560,w:112,h:110}; }
function canRect(j){ return {x:62+j*88,y:370,w:76,h:120}; }
function feedLocal(P,L,held){
  P.u+=L.u; P.d+=L.d; P.l+=L.l; P.r+=L.r; P.press+=L.press; P.btn=held;
  var pk=tapPick(L.tap); if(pk>=0)P.pick=pk;
  else if(L.tap&&(STATE==='intro'||STATE==='select'))P.press++;
}
var pourWatch=[0,0,0,0], pourTick=0;
function audioWatch(dt){
  if(!G||!G.bars||(STATE!=='play'))return;
  pourTick-=dt;
  for(var b=0;b<NBARS;b++){ var f=G.bars[b].fill;
    if(f>pourWatch[b]+0.0005&&pourTick<=0){ pourTick=0.075; var bt=null;
      for(var i=0;i<G.bts.length;i++)if(G.bts[i].bar===b)bt=G.bts[i];
      var q=bt?pourQuality(bt.c,f):'none';
      if(q==='sloppy'||q==='clean')playSfx('foam'); else playSfx('pour',f); }
    pourWatch[b]=f; }
}
function update(dt){
  var L=takeEdges(), held=btnHeld();
  FEEL.tick(dt);
  netPoll();
  if(UI.msgT>0)UI.msgT-=dt;
  if(NET.role==='guest'&&NET.live&&SIM_STATES[STATE]){
    if(UI.pause){ stPause(L); guestSendInput(mkPin(),false); }
    else if(L.back){ UI.pause=true; UI.pmenu=0; }
    else if(STATE==='over'&&G&&G.overT>=OVER_GUARD&&(L.press||L.tap)){ toInitials(); }
    else { guestFeed(L,held); }
    guestTick(dt); audioWatch(dt); music(trackFor()); return;
  }
  if(SIM_STATES[STATE]&&G){
    if(UI.pause){ stPause(L); if(!NET.role){ music(trackFor()); return; } L={u:0,d:0,l:0,r:0,press:0,back:0,bk:0,tap:null}; held=false; }
    else if(L.back&&STATE!=='over'){ UI.pause=true; UI.pmenu=0; playSfx('sel'); if(!NET.role){ music(trackFor()); return; } L.back=0; }
    if(STATE==='over'&&G.overT>=OVER_GUARD&&(L.press||L.tap)&&!UI.pause){ toInitials(); music(trackFor()); return; }
    feedLocal(pin[0],L,held);
    if(NET.role==='host')hostFeed();
    simStep(dt);
    clearEdges(pin[0]); clearEdges(pin[1]);
    audioWatch(dt);
    if(NET.role==='host')hostSend();
  } else {
    if(STATE==='title')stTitle(L,dt);
    else if(STATE==='online')stOnline(L);
    else if(STATE==='lobby')stLobby(L,dt);
    else if(STATE==='howto')stHowto(L);
    else if(STATE==='board')stBoard(L);
    else if(STATE==='initials')stInitials(L,dt);
    else goTitle();
  }
  music(trackFor());
}
function trackFor(){
  if(!G||!SIM_STATES[STATE]||STATE==='select')return 'LAST CALL';
  if(STATE==='over')return null;
  if(STATE==='bonus')return 'SHAKE UP';
  if(G.hhT>0)return 'HAPPY HOUR';
  return VENUES[G.vi].track;
}
function resetGame(){ netClose(); goTitle(); ERRMSG=''; lastError=null; UI.pause=false; UI.msgT=0; }

/* ---- 11. FRAME PACING: the catch-up defenses (seed, verbatim) ---- */
var STEP_CAP=5;
var STEP_MS=16.6667;
function frameStep(prevLast,now){
  var acc=now-prevLast;
  if(acc>200)return {steps:1,last:now,resync:true};
  var steps=Math.floor(acc/STEP_MS);
  if(steps>STEP_CAP)steps=STEP_CAP;
  return {steps:steps,last:prevLast+steps*STEP_MS,resync:false};
}
var tick={last:0}; var lastSaveAt=0;
function frameTick(){
  try{
    var now=performance.now();
    if(!tick.last)tick.last=now;
    var fs=frameStep(tick.last,now);
    tick.last=fs.last;
    for(var i=0;i<fs.steps;i++){ update(1/60); DF.u-=1/60; DF.d-=1/60; }
    render();
    if(now-lastSaveAt>5000){ saveState(); lastSaveAt=now; }
  }catch(e){ reportErr('frameTick',e); }
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(frameTick);
}

     from the background drops its stale backlog to the single newest message and
     resets its derived clocks, so the sim never sprints to catch up.

  var w=wire||devWire();
  if(w){ opts.wire=w; NET.net.init(opts); return true; }
  var mine=NET.net;
  loadPeer(function(ok){ if(NET.net!==mine)return; if(!ok){ netError({type:'peerjs'}); return; } NET.net.init(opts); });
  return true;
}
function startHost(wire){
  netClose(); NET.role='host'; NET.phase='hosting'; NET.code=makeCode(); STATE='lobby'; UI.menu=0;
  NET.status='WAITING FOR PLAYER 2...'; netConnect('host',wire);
}
function startJoin(code,wire){
  netClose(); NET.role='guest'; NET.phase='connecting'; NET.code=code; STATE='lobby';
  NET.status='KNOCKING ON '+code+'...'; netConnect('guest',wire);
}
function netOpened(r){
  if(r==='guest'){ NET.status='CONNECTED. WAITING FOR THE HOST...'; NET.net.send('hello',{v:VER}); }
  else NET.status=NET.bc?'WAITING FOR PLAYER 2...':'PLAYER 2 IS AT THE DOOR...';
}
function netClosed(){
  if(!NET.role)return;
  if(NET.role==='guest'){ var inMatch=SIM_STATES[STATE]&&NET.live; netClose(); if(inMatch||STATE==='lobby'){ goTitle(); } msg('THE HOST CLOSED THE BAR',3); return; }
  if(G&&SIM_STATES[STATE]&&NET.live){
    if(STATE==='select'){ netClose(); goTitle(); msg('PLAYER 2 LEFT',3); return; }
    if(G.bts[1])G.bts[1].gone=true; NET.live=false; msg('PLAYER 2 LEFT. THE BAR STAYS OPEN',3); }
  else if(STATE==='lobby'){ NET.status='WAITING FOR PLAYER 2...'; }
}
function netError(e){
  var t=(e&&e.type)||'';
  if(NET.role==='host'&&t==='unavailable-id'){ var w=null; netClose(); startHost(w); return; }
  var why={'peer-unavailable':'NO BAR WITH THAT CODE. CHECK THE LETTERS.','peerjs':'COULD NOT LOAD THE NETWORK LIBRARY.',
    'browser-incompatible':'THIS BROWSER CANNOT PLAY ONLINE.','network':'NETWORK TROUBLE. TRY AGAIN.','server-error':'THE MATCHMAKER IS DOWN. TRY AGAIN.',
    'socket-error':'NETWORK TROUBLE. TRY AGAIN.','disconnected':'LOST THE MATCHMAKER. TRY AGAIN.'}[t]||('NETWORK ERROR '+t.toUpperCase());
  if(SIM_STATES[STATE]&&NET.live){ netClosed(); return; }
  NET.phase='error'; NET.err=why; STATE='lobby';
}
function netClose(){
  try{ if(NET.net&&NET.net.state.peer&&NET.net.state.peer.destroy)NET.net.state.peer.destroy(); }catch(e){}
  try{ if(NET.bc)NET.bc.close(); }catch(e){}
  NET.role=null; NET.phase=''; NET.net=null; NET.live=false; NET.bc=null; NET.rx=null; NET.sent=''; NET.frame=0;
  NET.cnt={u:0,d:0,l:0,r:0,p:0,k:-1,ks:0,rf:null,rs:0}; NET.ap={u:0,d:0,l:0,r:0,p:0,ks:0,rs:0}; NET.pred={on:false,bar:-1,fill:0};
}
function netPoll(){ if(NET.net)NET.net.drain(onNetMsg); }
function onNetMsg(m){
  var p=m.p||{};
  if(m.t==='hello'&&NET.role==='host'){
    if(p.v!==VER){ NET.net.send('bye',{why:'ver',v:VER}); NET.phase='error'; NET.err='VERSION MISMATCH: HOST v'+VER+', GUEST v'+p.v; return; }
    NET.net.send('welcome',{v:VER}); newMatch('duo'); NET.live=true; NET.partnerIni=null; msg('PLAYER 2 JOINED'); playSfx('lock');
  } else if(m.t==='welcome'&&NET.role==='guest'){
    if(p.v!==VER){ NET.phase='error'; NET.err='VERSION MISMATCH: HOST v'+p.v+', YOU v'+VER; return; }
    NET.status='IN THE BAR. WAITING FOR THE HOST...';
  } else if(m.t==='inp'&&NET.role==='host'){ NET.rx=p; }
  else if(m.t==='snap'&&NET.role==='guest'){ applySnap(p); }
  else if(m.t==='ini'){ NET.partnerIni=p.n; boardPatchPartner(p.n); }
  else if(m.t==='bye'){ if(p&&p.why==='ver'){ NET.phase='error'; NET.err='VERSION MISMATCH: HOST v'+p.v+', YOU v'+VER; STATE='lobby'; return; } netClosed(); }
}
function boardPatchPartner(n){
  if(!UI.entry)return; var b=boardLoad();
  for(var i=0;i<b.duo.length;i++)if(b.duo[i].t===UI.entry&&b.duo[i].p==='???'){ b.duo[i].p=n; lsSet(BOARD_KEY,JSON.stringify(b)); }
}
function hostFeed(){
  var r=NET.rx; if(!r||!NET.live)return; var P=pin[1], a=NET.ap;
  P.u+=Math.max(0,r.u-a.u); P.d+=Math.max(0,r.d-a.d); P.l+=Math.max(0,r.l-a.l); P.r+=Math.max(0,r.r-a.r); P.press+=Math.max(0,r.p-a.p);
  P.btn=!!r.b; if(r.ks!==a.ks&&r.k>=0)P.pick=r.k;
  if(r.rs!==a.rs&&typeof r.rf==='number')P.relFill=r.rf;
  a.u=r.u; a.d=r.d; a.l=r.l; a.r=r.r; a.p=r.p; a.ks=r.ks; a.rs=r.rs;
}
function roundNum(k,v){ return (typeof v==='number'&&v%1!==0)?Math.round(v*100)/100:v; }
function hostSend(){
  if(!NET.live||!G||!NET.net)return;
  NET.frame++; if(NET.frame%NET.SNAP_EVERY)return;
  var g=JSON.parse(JSON.stringify(G,roundNum));
  NET.net.send('snap',{st:STATE,g:g});
  G.evq=[];
}
function applySnap(p){
  if(!p||!p.g)return;
  if(!(NET.live||STATE==='lobby'))return;          // after the match the guest keeps its own screens
  G=p.g; STATE=p.st; NET.live=true; NET.phase='';
  var q=G.evq||[]; for(var i=0;i<q.length;i++)playFx(q[i][0],q[i][1],q[i][2],q[i][3],q[i][4],q[i][5]);
  G.evq=[];
  if(NET.pred.on&&G.bars&&G.bars[NET.pred.bar])G.bars[NET.pred.bar].fill=NET.pred.fill;   // my own pour shows what I am pouring
}
function guestFeed(L,held){
  var C=NET.cnt, pr=NET.pred, me=(G&&G.bts)?G.bts[1]:null;
  C.u+=L.u; C.d+=L.d; C.l+=L.l; C.r+=L.r; C.p+=L.press;
  if(STATE==='play'&&me&&!me.gone){
    if(held&&me.md<=0&&(L.u+L.d)===0&&G.bars[me.bar].keg!==0){ if(!pr.on||pr.bar!==me.bar){ pr.on=true; pr.bar=me.bar; pr.fill=G.bars[me.bar].fill; } }
    else if(pr.on&&!held){ C.rf=Math.round(pr.fill*1000)/1000; C.rs++; pr.on=false; }
    else if(pr.on&&(me.md>0||(L.u+L.d)>0)){ pr.on=false; }
  } else pr.on=false;
  var pk=tapPick(L.tap); if(pk>=0){ C.k=pk; C.ks++; } else if(L.tap&&(STATE==='intro'||STATE==='select'))C.p++;
  guestSendInput(null,held);
}
function guestSendInput(_,held){
  if(!NET.net)return; var C=NET.cnt, pl={u:C.u,d:C.d,l:C.l,r:C.r,p:C.p,b:!!held,k:C.k,ks:C.ks,rf:C.rf,rs:C.rs}, s=JSON.stringify(pl);
  NET.sendT++;
  if(s!==NET.sent||NET.sendT>=10){ NET.net.send('inp',pl); NET.sent=s; NET.sendT=0; }
}
function guestTick(dt){                           // dead reckoning between snapshots, cosmetic only
  if(!G)return;
  var i;
  if(G.mugs)for(i=0;i<G.mugs.length;i++){ var m=G.mugs[i]; m.x+=m.vx*mugFactor(m.b,m.x)*dt; if(m.k!=='full'&&m.x>MUG_END)m.x=MUG_END; }
  if(G.pts)for(i=0;i<G.pts.length;i++){ var p=G.pts[i]; p.x+=(p.vx||0)*dt; p.wk=(p.wk||0)+dt; }
  if(G.bts)for(i=0;i<G.bts.length;i++){ var t=G.bts[i]; if(t.md>0)t.mt=Math.min(t.md,t.mt+dt); }
  if(G.bonus&&G.bonus.sw)G.bonus.sw.t=Math.min(G.bonus.dur,G.bonus.sw.t+dt);
  if(typeof G.t==='number')G.t+=dt;
  var pr=NET.pred, me=G.bts?G.bts[1]:null;
  if(pr.on&&me&&G.bars&&G.bars[pr.bar]){ var rate=1/POUR_T[cstat(me.c,'pour')]; if(pr.fill>=1)rate*=FOAM_SLOW; pr.fill=Math.min(FILL_MAX,pr.fill+rate*dt); G.bars[pr.bar].fill=pr.fill; }
  updCosmetic(dt);
}
/* ==================== SNAILNET SLOT : END   ==================== */

loadPrefs();
resetGame();
if(!loadState()){
  var jc=(urlParam('join')||'').toUpperCase();
  if(/^[A-Z]{4}$/.test(jc)){ var ok=true; for(var ji=0;ji<4;ji++)if(LETTERS.indexOf(jc.charAt(ji))<0)ok=false;
    if(ok){ for(ji=0;ji<4;ji++)UI.code[ji]=LETTERS.indexOf(jc.charAt(ji)); startJoin(jc); } }
  else if(urlParam('host')==='1')startHost();
}
if(urlParam('debug')==='1'&&typeof window!=='undefined')window.__TAP={G:function(){ return G; },state:function(){ return STATE; },setState:function(s){ STATE=s; },
  quickStart:quickStart,startBonus:startBonus,spawnPatron:spawnPatron,spawnMug:spawnMug,startShow:startShow,UI:UI,NET:function(){ return NET; }};   // dev handle for screenshot scenarios, only with ?debug=1
if(typeof requestAnimationFrame==='function')requestAnimationFrame(frameTick);

/*HOOK*/
})();
