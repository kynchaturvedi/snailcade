=============================================================
FRENZY FLEET : EMBEDDED CHANGELOG (append-only, newest first)
=============================================================
v6 - THROUGH ITS AIM (2026-10-03)
  The Director's answer B on the swoop (issue 534): a diving
  invader now crosses the cannon's row exactly where the cannon
  stood when it launched. Before, its wobble carried it 25 to 36
  px to the right, so the left of the rail was never rammed and
  the centre and right often were. Now a cannon that stays put is
  rammed wherever it stands, and one that steps away is missed:
  the same swoop, bent back by the row. Nothing else changed.
v5 - THE COMMONS (2026-10-03)
  No tuning: the game now runs on the studio's commons it helped
  build. Its explosion debris is the FEEL PACK v1.06 chunk burst
  (this game's own recipe, contributed at BUILD 1; the pack's core
  plus that one slice, byte for byte, drawing from the cosmetic
  generator), and its sounds and robot voice are the AUDIO KIT
  v1.02 FRENZY FLEET section (the same recipes, the march step, the
  flat noise, the voice), at the game's shipped volume. The menu
  music stays the game's own, on the kit's audio context. Every
  seeded number in the gates and the bot report is unchanged.
v4 - DIVERS BITE (2026-09-29)
  The Director's ruling: a diving invader that touches a cannon
  now costs a ship, as a bolt does. A shield absorbs it; a cannon
  still blinking from its respawn is spared; the rammer is
  destroyed and pays nothing (no points, no chain link). Divers
  already aim at a cannon, so dodging them now matters. Also:
  cosmetic randomness (particles, stars, screen shake, bolt
  wobble, the noise buffer) has its own generator, so a visual
  change never moves the game's dice again; every seeded number
  in the gates and the bot reports moved once, here. Held by
  wavetest scenario 18, red on BUILD 3. The feel verdict is
  still open; no other tuning.
v3 - THE FLEET COMES HOME (2026-09-29)
  A bug fix, no tuning. The march bounded the fleet by its alive
  columns in formation, so while a column's last invader dived
  the fleet could drift past that column's slot; the diver then
  came home off screen, out of the cannon's reach, and the fleet,
  out of bounds whichever way it stepped, reversed in place and
  dropped a row every step: INVADED every two seconds until the
  run was lost. The bounds now count every alive invader, diving
  or not, so every slot stays on screen. Found by the doc 14 bot
  suite (every one of the skilled bot's lost runs at BUILD 2);
  held by a new wavetest scenario, red on BUILD 2. In BUILD 1
  and 2 alike. The Director's feel verdict and diver call are
  still open; tuning is untouched.
v2 - TWO CANNONS (2026-09-28)
  Two player co-op over SNAIL-NETCODE v1.00 (pasted verbatim at
  the SNAILNET slot; PeerJS 1.5.2 from cdnjs). Queue mode, host
  authority: the host runs the one world; the guest sends its
  cannon x, its fire hold and a tap counter ('inp') and draws
  the host's 30 Hz snapshots ('snap'), the host's sounds, voice
  and particles replayed. The title gains 2P: HOST shows a four
  letter room code, JOIN types it. One fleet, two cannons (P1
  cyan, P2 violet), one team score and shared ships; each cannon
  keeps its own combo chain and its own powerups; a BOMB pays at
  its catcher's multiplier. A partner who leaves is dropped and
  the host plays on. Solo play is unchanged (a seeded solo trace
  of v1 and v2 is identical). Tuning untouched: the Director's
  BUILD 1 feel verdict and diver call are still open.
  Gates: looptest (the SNAIL-NETCODE template 1..6 verbatim plus
  game scenarios on two real game instances), harness2 (co-op
  random walk).
v1 - FIRST LIGHT (2026-07-02)
  Bootstrap build per studio doctrine 07. Shipped in one build:
  - Shell: 320x440 portrait logical canvas, integer scaling,
    pixelated rendering, fullscreen button, on-screen error
    reporter wrapped around the main loop (ERR line, bottom).
  - Full single player arcade game: SPLASH (Snail Attack
    Studios), TITLE with animated logo and demo march, PLAY
    with 8x5 chunky invader formation (squid 30 / crab 20 /
    octo 10), classic march that accelerates as the fleet
    thins (stepInterval 0.675s at 40 alive down to ~0.06s at
    1, wave speed factor -5%/wave floor 0.55), edge drop 10px.
  - Scale and rotate showpieces: wave fly-in intro (rotate x2,
    scale 0 to 1, staggered), formation breathing pulse,
    frenzy wobble when 8 or fewer remain, chunk particles with
    spin on every kill, rotating powerup pickups, wobbling
    saucer, divers that peel off and swoop (2x points).
  - Combo economy: consecutive shot hits build COMBO, mult =
    1+floor(combo/5) capped x8. A shot leaving the top empty
    handed or taking a hit resets combo. Kill pays base x mult
    BEFORE the increment. Voice: x4 SUPER, x8 MAXIMUM.
  - LAST FIVE bounty: final five kills of a wave pay +100..
    +500 flat. Wave clear bonus 300+200*wave.
  - Powerups (8% drop, saucer always drops): RAPID (0.26s to
    0.11s cadence, 5 shots aloft), SPREAD (3-shot fan), SHIELD
    (one hit), BOMB (wipes enemy shots + 12 lowest invaders,
    cascading blasts, no combo growth). 8s timers on R/S.
  - Enemy fire scales with wave and thinning fleet; 4
    destructible bunkers (5x3 cells, 2hp each, corners cut);
    formation reaching the floor costs a life and resets the
    fleet height.
  - Continues: 9s countdown, unlimited, score kept, tracked
    and shown on the board as +N.
  - Local top-10 leaderboard (localStorage 'ff_scores', the
    only persistence in the file, try/catch guarded), 3-letter
    arcade initials entry.
  - Audio: WebAudio behind first gesture. March bass locked to
    the actual step interval (the music IS the pace), title
    synth beat, full retro SFX set. Robotic voice via
    speechSynthesis (pitch 0.4): WAVE n, WAVE CLEAR, SUPER,
    MAXIMUM, RAPID FIRE, SPREAD SHOT, SHIELD, SHIELD DOWN,
    BOOM, BONUS, GAME OVER, ONE UP, NEW HIGH SCORE.
  - Input: single floating stick (lower playfield, horizontal
    axis) + one FIRE button (hold = autofire). Keyboard
    fallback arrows/AD + space.
  - Test hook scaffold: stable internal names for makehook.js
    splice; TEST flags (frozenMarch, noEnemyFire, noDrops,
    noDivers, noSaucer) for gate scenario isolation.
  Numbers of record: player speed 230, shot 430, cadence 0.26
  (rapid 0.11), cap 3 aloft (rapid 5), eshot 120+7*wave cap
  250, max eshots 3+min(4,floor(wave/2)), extra ship at 10000
  then +25000, lives cap 6.
  Netplay (PeerJS 2P) is deliberately NOT in v1; lands BUILD 2
  with its loopback gate per studio pattern.
=============================================================
-->

/* SNAIL FEEL PACK v1.06: core + slices [FRENZY FLEET chunk burst] (byte for byte; doc v1.09 section 5b) */
/* range 1 of 3: the core, pack lines 38 to 134 */
var FEEL = (function(){
'use strict';
var VERSION = '1.00';
var S = {
  shakeT:0, shakeMag:4,        // FRENZY FLEET: jitter = shakeMag * shakeT
  flashT:0, flashCol:'#ffffff',
  hitstop:0,                   // sim frames still frozen
  parts:[], pops:[],
  MAX_PARTS:240,               // pool cap; oldest are recycled, never unbounded
  _shook:false, _rnd:Math.random
};
function shake(t, mag){ S.shakeT = Math.max(S.shakeT, t||0.5); if(mag)S.shakeMag = mag; }
function flash(t, col){ S.flashT = Math.max(S.flashT, t||0.3); if(col)S.flashCol = col; }
function hitstop(frames){ S.hitstop = Math.max(S.hitstop, frames|0); }
function burst(x, y, col, n, spd){
  n = n||14; spd = spd||120;
  for(var i=0;i<n;i++){
    if(S.parts.length >= S.MAX_PARTS) S.parts.shift();
    var a = S._rnd()*6.28318, v = spd*(0.35+S._rnd()*0.65);
    S.parts.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
                  life:0.35+S._rnd()*0.3, max:0.65, col:col||'#eaffff',
                  sz:(S._rnd()<0.3)?3:2});
  }
}
function pop(x, y, text, col){
  S.pops.push({x:x, y:y, t:0.8, text:String(text), col:col||'#ffe34d'});
}
function tick(dt){
  if(S.hitstop > 0){ S.hitstop--; return false; }   // freeze the SIM, not the show
  S.shakeT = Math.max(0, S.shakeT - dt*3);          // FRENZY FLEET decay
  S.flashT = Math.max(0, S.flashT - dt*3);
  var i, p, w=0;
  for(i=0;i<S.parts.length;i++){ p=S.parts[i];
    if(p.kind==='ember'){                           // contributed ember contract:
      p.t -= dt; if(p.t <= 0) continue;             // per-frame velocity units,
      p.vy += (p.g||0)*60*dt;                       // aged here, DRAWN by drawEmbers
      p.x += p.vx*60*dt; p.y += p.vy*60*dt;
    } else {
      p.life -= dt; if(p.life <= 0) continue;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= (1 - 2.2*dt); p.vy *= (1 - 2.2*dt);   // drag so sparks settle
    }
    S.parts[w++]=p;
  }
  S.parts.length = w;      // compact IN PLACE: external aliases MUST survive (integration law)
  var w2=0;
  for(i=0;i<S.pops.length;i++){ p=S.pops[i];
    p.t -= dt; if(p.t <= 0) continue;
    p.y -= 30*dt; S.pops[w2++]=p;
  }
  S.pops.length = w2;
  return true;
}
function preWorld(ctx){
  if(!ctx || !ctx.save) return;
  if(S.shakeT > 0){
    ctx.save(); S._shook = true;
    var j = S.shakeMag * S.shakeT;                  // the shipped formula
    ctx.translate((S._rnd()*2-1)*j, (S._rnd()*2-1)*j);
  }
}
function postWorld(ctx){
  if(ctx && ctx.fillRect){
    var i, p;
    for(i=0;i<S.parts.length;i++){ p=S.parts[i];
      if(p.kind==='ember') continue;                // drawEmbers owns these; never double-draw
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life/p.max));
      ctx.fillStyle = (p.life < 0.12) ? '#eaffff' : p.col;   // die toward white, never brighter
      ctx.fillRect((p.x|0), (p.y|0), p.sz, p.sz);
    }
    ctx.globalAlpha = 1;
    if(ctx.fillText){
      for(i=0;i<S.pops.length;i++){ p=S.pops[i];
        ctx.globalAlpha = Math.max(0, Math.min(1, p.t/0.8));
        ctx.font = 'bold 10px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#000'; ctx.fillText(p.text, p.x+1, p.y+1);
        ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y);
      }
      ctx.globalAlpha = 1;
    }
  }
  if(S._shook && ctx && ctx.restore){ ctx.restore(); }
  S._shook = false;
}
function overlay(ctx, W, H){
  if(!ctx || !ctx.fillRect) return;
  if(S.flashT > 0){
    ctx.globalAlpha = Math.min(0.8, S.flashT*2.5);  // the shipped alpha curve
    ctx.fillStyle = S.flashCol;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
}
return { VERSION:VERSION, shake:shake, flash:flash, hitstop:hitstop,
         burst:burst, pop:pop, tick:tick,
         preWorld:preWorld, postWorld:postWorld, overlay:overlay, state:S };
})();

      ctx.globalAlpha = al;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(1 + p.t * 2, 1 + p.t * 2);              // source's grow-as-it-fades
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  };

/* SNAIL AUDIO KIT v1.02: the whole module, byte for byte from commons/audio/snail-audio-kit-v1.02.js (BUILD 5) */
/* ============================================================================
   SNAIL AUDIO KIT v1.02 (core module) | Snail Attack Studios | 2026-09-30
   v1.02: the module caught up with the lab (see the v1.02 note at the foot):
   the ctx/bus accessors and the five-title merge (REEF RIOT, AETHER RUSH,
   NEON SWARM, FRENZY FLEET, CANNONBALL CLASH), which since 2026-07-07 lived
   only inside snail-audio-lab-v1.04 to v1.06.
   ----------------------------------------------------------------------------
   The studio's sound as a drop-in. NOT invented: two production synth
   primitives carried VERBATIM plus a recipe book of shipped, Director-heard
   sounds, each with provenance.
   - tone(f,dur,type,vol,slide): PATTY PANIC v217's engine. LINEAR pitch slide,
     exponential volume decay. Percussive, chunky, arcade-floor.
   - sweep(f,end,dur,type,vol): NEON SWARM v78's beep engine. EXPONENTIAL pitch
     ramp to a target. Lasers, charges, whooshes, anything that travels.
   - arp(notes,step,dur,type,vol): PATTY's arpeggiator for jingles and rewards.
   Boot is gesture-safe per the STUDIO SEED lesson: mobile contexts can be
   CREATED SUSPENDED, so boot() both creates AND resumes inside the gesture.
   Master gain ships at NEON SWARM's 0.16. Headless-inert: without an
   AudioContext every call is a silent no-op and cannot move a gate.
   ----------------------------------------------------------------------------
   v1.01 MERGE (2026-07-07): GRID GRUDGE contribution folded in with credit:
   AKIT.music (the v55 step-sequencer engine with the v48/v49/v50 lifecycle
   lessons as code), AKIT.noise (their shipped noise primitive; corrects the
   v1.00 claim that no title needed noise), and AKIT.scaleWalk (the melodic
   scale-walking SFX technique with their move/rotate exemplars).
   WIRING: call AKIT.boot() inside EVERY input gesture handler (touchstart,
   keydown); it is idempotent. Then fire recipes: AKIT.sfx.hit(); or compose
   your own from the primitives and register them on AKIT.sfx.
   ============================================================================ */
var AKIT = (function(){
'use strict';
var VERSION = '1.02';   /* kit v1.02: ctx/bus accessors + the five-title merge */
var AC = null, master = null, VOL = 0.16;          // NEON SWARM shipped master

function boot(){                                    // call inside every gesture
  try{
    if(!AC){
      var C = (typeof AudioContext !== 'undefined') ? AudioContext :
              (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if(!C) return false;
      AC = new C();
      master = AC.createGain(); master.gain.value = VOL;

/* ---------- input mapping ---------- */
var FIREBTN={x:276,y:392,r:32};
function canvasXY(e){
  var r=cv.getBoundingClientRect();

  return {x:(e.clientX-r.left)/sx, y:(e.clientY-r.top)/sy, id:(e.pointerId!==undefined?e.pointerId:1)};

function pDown(x,y,id){
  initAudio();
  if(paused){paused=false;return;}
  if(STATE==='SPLASH'){gotoTitle();return;}
  if(NET.role==='guest'&&NET.live&&STATE!=='PLAY'){guestTap();return;}
  if(STATE==='TITLE'||STATE==='BOARD'||STATE==='ENTRY'||STATE==='LOBBY'){btnHit(x,y);return;}
  if(STATE==='CONTINUE'){continueGame();return;}
  if(STATE!=='PLAY')return;
  var dx=x-FIREBTN.x, dy=y-FIREBTN.y;
  if(dx*dx+dy*dy<=FIREBTN.r*FIREBTN.r){fireHeld=true;fireId=id;return;}
  if(y>60){stick.active=true;stick.id=id;stick.ox=x;stick.oy=y;stick.dx=0;}
}
function pMove(x,y,id){
  if(stick.active&&id===stick.id){
    var d=x-stick.ox;
    if(d>40){stick.ox=x-40;d=40;}
    if(d<-40){stick.ox=x+40;d=-40;}
    stick.dx=d;
  }
}
function pUp(id){
  if(stick.active&&id===stick.id){stick.active=false;stick.dx=0;stick.id=-1;}

function onKey(e,down){
  var k=e.key;
  if(STATE==='LOBBY'&&NET.phase==='code'){
    if(down){
      if(/^[a-zA-Z]$/.test(k))codeKey(k.toUpperCase());
      else if(k==='ArrowLeft')codeMove(-1);
      else if(k==='ArrowRight')codeMove(1);
      else if(k==='Enter'||k===' ')codeLock();
      else if(k==='Backspace'&&NET.codeSlot>0)NET.codeSlot--;
    }
    if(e.preventDefault)e.preventDefault();
    return;
  }
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=down;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.r=down;
  else if(k===' '||k==='z'||k==='Z'||k==='x'||k==='X'){keys.f=down;
    if(down){
      initAudio();
      if(NET.role==='guest'&&NET.live){if(STATE!=='PLAY')guestTap();}
      else if(STATE==='TITLE')startGame();
      else if(STATE==='CONTINUE')continueGame();
      else if(STATE==='ENTRY')entryLock();
      else if(STATE==='BOARD')gotoTitle();
      else if(STATE==='SPLASH')gotoTitle();
    }
  }
  else if(down&&STATE==='ENTRY'&&NET.role!=='guest'){
    if(k==='ArrowLeft')entryMove(-1);
    if(k==='ArrowRight')entryMove(1);
    if(k==='Enter')entryLock();
  }
  else if(down&&k==='Enter'){
    if(STATE==='TITLE')startGame();
    else if(STATE==='CONTINUE')continueGame();
  }
  if(k===' ')e.preventDefault&&e.preventDefault();
}

/* ---------- boot and loop (error reporter wraps everything) ---------- */
function frame(ts){
  var dt=(ts-lastTs)/1000; lastTs=ts;
  if(!(dt>0)||dt>0.05)dt=0.05;
  try{
    if(!paused)update(dt);
    render();
  }catch(e){
    lastError=e;
    ERRMSG='ERR: '+(e&&e.message?e.message:String(e));
    try{render();}catch(e2){}
  }
  requestAnimationFrame(frame);
}
function boot(){
  cv=document.getElementById('cv');
  ctx=cv.getContext('2d');
  cv.width=W; cv.height=H;
  ctx.imageSmoothingEnabled=false;
  fsb=document.getElementById('fsb');
  buildSprites(); buildStars();
  hiScore=topScore();
  fitScale();
  window.addEventListener('resize',fitScale);
  cv.addEventListener('pointerdown',function(e){var p=canvasXY(e);pDown(p.x,p.y,p.id);e.preventDefault&&e.preventDefault();});
  cv.addEventListener('pointermove',function(e){var p=canvasXY(e);pMove(p.x,p.y,p.id);e.preventDefault&&e.preventDefault();});
  cv.addEventListener('pointerup',function(e){var p=canvasXY(e);pUp(p.id);});
  cv.addEventListener('pointercancel',function(e){var p=canvasXY(e);pUp(p.id);});
  window.addEventListener('keydown',function(e){onKey(e,true);});
  window.addEventListener('keyup',function(e){onKey(e,false);});
  document.addEventListener('visibilitychange',function(){
    var t=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
    if(document.hidden){hiddenAt=t;if(STATE==='PLAY'&&!NET.role)paused=true;}
    else{if(NET.net&&hiddenAt&&t-hiddenAt>1000)NET.net.netResync(t);hiddenAt=0;}
  });
  if(fsb&&fsb.addEventListener)fsb.addEventListener('pointerdown',function(e){toggleFS();e.preventDefault&&e.preventDefault();});
  requestAnimationFrame(frame);
}

function buildFormation(n){

      landT:c*0.05+r*0.12,landed:false,x:0,y:0,sx:0,sy:0,tx:0,divT:0,
      dOff:((r*COLS+c)*37)%100});

function buildBunkers(){
  bunkers=[];
  var cxs=[40,120,200,280];
  for(var b=0;b<4;b++){
    var cells=[];
    for(var r=0;r<3;r++){
      var row=[];
      for(var c=0;c<5;c++){
        var hp=2;
        if(r===0&&(c===0||c===4))hp=0;
        row.push(hp);
      }
      cells.push(row);
    }
    bunkers.push({x:cxs[b]-15,y:344,cells:cells});

}
function invPos(inv){
  if(inv.mode==='form')return {x:fx+inv.c*CW+12,y:fy+inv.r*RH+8};
  return {x:inv.x,y:inv.y};
}
function baseVal(t){return t==='O'?10:(t==='C'?20:30);}
function skipIntro(){
  for(var i=0;i<invaders.length;i++)invaders[i].landed=true;
  playPhase='play';phaseT=0;
}
function introUpd(dt){
  phaseT+=dt;
  var all=true;
  for(var i=0;i<invaders.length;i++){
    var inv=invaders[i];
    if(!inv.alive)continue;
    if(!inv.landed){
      if(phaseT>=inv.landT+0.9)inv.landed=true;
      else all=false;
    }
  }
  if(all&&phaseT>0.3){playPhase='play';phaseT=0;}
}
function stepInterval(){
  return (0.055+0.62*Math.pow(aliveN/40,1.25))*Math.max(0.55,1-(wave-1)*0.05);
}
function aliveColRange(){
  var mn=COLS,mx=-1;
  for(var i=0;i<invaders.length;i++){var v=invaders[i];
    if(v.alive){if(v.c<mn)mn=v.c;if(v.c>mx)mx=v.c;}}   /* BUILD 3: every alive invader, diving or not, so no slot leaves the screen */
  return {mn:mn,mx:mx};
}
function march(dt){
  if(playPhase!=='play'||TEST.frozenMarch)return;
  marchAcc+=dt;
  var si=stepInterval();
  if(marchAcc<si)return;
  marchAcc-=si;
  var cr=aliveColRange();
  if(cr.mx<0)return;
  var nx=fx+fdir*6;
  var left=nx+cr.mn*CW, right=nx+cr.mx*CW+24;
  if(right>314||left<6){fy+=10;fdir=-fdir;}
  else fx=nx;
  marchFrame=marchFrame?0:1;
  sfxMarch(marchNote); marchNote=(marchNote+1)%4;
  eatBunkers();
  var lowest=lowestRowY();
  if(lowest>=386)breach();
}
function lowestRowY(){
  var mx=-999;
  for(var i=0;i<invaders.length;i++){var v=invaders[i];
    if(v.alive&&v.mode==='form'){var y=fy+v.r*RH+8;if(y>mx)mx=y;}}
  return mx;
}
function eatBunkers(){
  for(var i=0;i<invaders.length;i++){
    var v=invaders[i];
    if(!v.alive||v.mode!=='form')continue;
    var p=invPos(v);
    if(p.y+8<340)continue;
    for(var b=0;b<bunkers.length;b++){
      var bk=bunkers[b];
      if(p.x+12<bk.x||p.x-12>bk.x+30)continue;
      for(var r=0;r<3;r++)for(var c=0;c<5;c++){
        if(bk.cells[r][c]>0){
          var cx=bk.x+c*6+3, cy=bk.y+r*6+3;
          if(Math.abs(cx-p.x)<15&&Math.abs(cy-p.y)<14){bk.cells[r][c]=0;}
        }
      }
    }
  }
}
function breach(){
  addFloat(160,220,'INVADED!','#ff4646',true);

  loseLife();
}
function maxEshots(){return 3+Math.min(4,Math.floor(wave/2));}
function rollFire(){
  var v=rnd(0.55,1.35)*(0.5+0.5*aliveN/40)*Math.max(0.5,1-(wave-1)*0.04);
  return Math.max(0.22,v);
}
function enemyFire(dt){
  if(playPhase!=='play'||TEST.noEnemyFire)return;
  eFireT-=dt;
  if(eFireT>0)return;
  eFireT=rollFire();
  if(eshots.length>=maxEshots())return;
  var cols=[];
  for(var c=0;c<COLS;c++){
    var low=null;
    for(var i=0;i<invaders.length;i++){var v=invaders[i];
      if(v.alive&&v.landed&&v.mode==='form'&&v.c===c){if(!low||v.r>low.r)low=v;}}
    if(low)cols.push(low);
  }
  if(!cols.length)return;
  var src=cols[Math.floor(Math.random()*cols.length)];
  var p=invPos(src);
  eshots.push({x:p.x,y:p.y+10,vy:Math.min(250,120+wave*7),ph:fxr()*6.28});

function countDivers(){
  var n=0;
  for(var i=0;i<invaders.length;i++)if(invaders[i].alive&&invaders[i].mode!=='form')n++;
  return n;
}
function startDiveAt(idx){
  var inv=invaders[idx];
  if(!inv||!inv.alive||inv.mode!=='form'||!inv.landed)return;
  var p=invPos(inv);
  inv.mode='dive';inv.divT=0;
  var tl=PL(),tp=tl[(diveTurn++)%tl.length];
  inv.sx=p.x;inv.sy=p.y;inv.tx=clamp(tp.x,30,290);
  inv.x=p.x;inv.y=p.y;
}
function divers(dt){
  if(playPhase!=='play'||TEST.noDivers||wave<2)return;
  diverT-=dt;
  var cap=wave>=6?2:1;
  if(diverT<=0&&aliveN>6&&countDivers()<cap){
    var pool=[];
    for(var i=0;i<invaders.length;i++){var v=invaders[i];
      if(v.alive&&v.landed&&v.mode==='form')pool.push(i);}
    if(pool.length)startDiveAt(pool[Math.floor(Math.random()*pool.length)]);
    diverT=rnd(6,10);
  }
}
function updDivers(dt){
  for(var i=0;i<invaders.length;i++){
    var inv=invaders[i];
    if(!inv.alive)continue;
    if(inv.mode==='dive'){
      inv.divT+=dt;
      var u=inv.divT/2.6;
      if(u>=1){inv.mode='return';inv.y=-24;continue;}
      var uc=Math.max(0.05,(402-inv.sy)/(470-inv.sy));                                  /* BUILD 6, B: u at the cannon's row */
      var off=lerp(inv.sx,inv.tx,uc)+Math.sin(uc*9.42)*36-inv.tx;                        /* how far the old path misses its aim there */
      inv.x=lerp(inv.sx,inv.tx,u)+Math.sin(u*9.42)*36-off*Math.min(1,u/uc);              /* taken out by the row: the swoop passes through its aim */
      inv.y=inv.sy+u*(470-inv.sy);
    }else if(inv.mode==='return'){
      var slotX=fx+inv.c*CW+12, slotY=fy+inv.r*RH+8;
      inv.x=slotX;
      inv.y+=150*dt;
      if(inv.y>=slotY){inv.mode='form';}
    }
  }
}
/* BUILD 4, the Director's ruling (2026-09-29): a diving invader that touches a cannon costs a ship, as a bolt does; a
   shield absorbs it; a cannon still blinking from its respawn is spared. The rammer is destroyed and pays nothing. */
function diverRams(){

/* ---------- shooting ---------- */
function ownShots(p){var n=0;for(var i=0;i<shots.length;i++)if(shots[i].o===p.id)n++;return n;}
function fireShot(p){
  p=p||player;
  if(!p.alive||playPhase==='intro')return;
  if(p.fireT>0)return;
  var maxS=p.rapidT>0?5:3;

function extraLifeCheck(){

  }

function killInvader(inv,byBomb,who){
  who=who||player;
  if(!inv.alive)return;
  var aliveBefore=aliveN;
  inv.alive=false;aliveN--;
  var p=invPos(inv);
  var base=baseVal(inv.type);
  if(inv.mode!=='form')base*=2;
  var gain=base*who.mult;
  score+=gain;
  addFloat(p.x,p.y,'+'+gain,COLTYPE[inv.type]);
  if(!byBomb)addCombo(who);
  if(aliveBefore<=5){
    var b=(6-aliveBefore)*100;
    score+=b;
    addFloat(p.x,p.y-14,'BONUS +'+b,'#ffd24a',true);
    if(aliveBefore===5)speak('BONUS');
  }
  burst(p.x,p.y,COLTYPE[inv.type],10,140);
  sfxInvHit();
  if(!byBomb&&!TEST.noDrops&&Math.random()<0.08)spawnPowerup(randPupType(),p.x,p.y);
  extraLifeCheck();

function forceClearWave(){
  for(var i=0;i<invaders.length;i++)invaders[i].alive=false;
  aliveN=0;
  waveClear();
}
function removeInvaderSilent(i){
  var inv=invaders[i];
  if(inv&&inv.alive){inv.alive=false;aliveN--;}
}
function cullTo(n){
  for(var i=invaders.length-1;i>=0&&aliveN>n;i--)removeInvaderSilent(i);
}

/* ---------- powerups and bomb ---------- */
function spawnPowerup(type,x,y){pups.push({type:type,x:x,y:y,vy:62,rot:0});}
var PUPCOL={RAPID:'#5ad2ff',SPREAD:'#ff5aa5',SHIELD:'#57ff7a',BOMB:'#ffd24a'};
function applyPup(t,who){
  who=who||player;
  if(t==='RAPID'){who.rapidT=8;speak('RAPID FIRE');}
  else if(t==='SPREAD'){who.spreadT=8;speak('SPREAD SHOT');}
  else if(t==='SHIELD'){who.shield=true;speak('SHIELD');}
  else if(t==='BOMB'){doBomb(who);}
  addFloat(who.x,378,t,PUPCOL[t],true);
  sfxPupCatch();
}
function updPups(dt){
  for(var i=pups.length-1;i>=0;i--){
    var p=pups[i];
    p.y+=p.vy*dt;p.rot+=3*dt;
    if(p.y>434){pups.splice(i,1);continue;}
    var pl=PL(),got=null;
    for(var k=0;k<pl.length;k++){var q=pl[k];if(q.alive&&Math.abs(p.x-q.x)<20&&p.y>390&&p.y<418){got=q;break;}}
    if(got){applyPup(p.type,got);pups.splice(i,1);}
  }
}
function doBomb(who){
  sfxBomb();speak('BOOM',true);
  shakeT=0.5;flashT=0.25;
  eshots=[];
  var targets=[];
  for(var i=0;i<invaders.length;i++){
    var v=invaders[i];
    if(v.alive&&(v.landed||v.mode!=='form'))targets.push(v);
  }
  targets.sort(function(a,b){return invPos(b).y-invPos(a).y;});
  var n=Math.min(12,targets.length);
  for(var k=0;k<n;k++)bombQ.push({inv:targets[k],t:k*0.045,who:who||player});
}
function updBombQ(dt){
  for(var i=bombQ.length-1;i>=0;i--){
    var q=bombQ[i];
    q.t-=dt;
    if(q.t<=0){
      if(q.inv.alive)killInvader(q.inv,true,q.who);
      bombQ.splice(i,1);
    }
  }
}
/* ---------- projectile updates ---------- */
function hitBunker(x,y){
  for(var b=0;b<bunkers.length;b++){
    var bk=bunkers[b];
    if(x<bk.x||x>bk.x+30||y<bk.y||y>bk.y+18)continue;
    var c=Math.floor((x-bk.x)/6), r=Math.floor((y-bk.y)/6);
    if(c<0||c>4||r<0||r>2)continue;
    if(bk.cells[r][c]>0){
      bk.cells[r][c]--;
      burst(x,y,'#3aff5e',4,60);
      return true;
    }
  }
  return false;
}
function updShots(dt){
  for(var i=shots.length-1;i>=0;i--){
    var s=shots[i];
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    var ow=players[s.o]||player;
    if(s.y<-8){shots.splice(i,1);comboReset(ow);continue;}
    if(s.x<-4||s.x>324){shots.splice(i,1);comboReset(ow);continue;}
    if(s.y<380&&s.y>336&&hitBunker(s.x,s.y)){shots.splice(i,1);continue;}
    var hit=false;
    if(saucer&&Math.abs(s.x-saucer.x)<16&&Math.abs(s.y-saucer.y)<8){
      var sv=saucer.val*ow.mult;
      score+=sv;addCombo(ow);
      addFloat(saucer.x,saucer.y,'+'+sv,'#ff4646',true);
      burst(saucer.x,saucer.y,'#ff4646',14,160);
      sfxSaucerHit();speak('BONUS');
      spawnPowerup(randPupType(),saucer.x,saucer.y);
      extraLifeCheck();
      saucer=null;hit=true;
    }
    if(!hit)for(var j=0;j<invaders.length;j++){
      var inv=invaders[j];
      if(!inv.alive)continue;
      if(inv.mode==='form'&&!inv.landed)continue;
      var p=invPos(inv);
      if(Math.abs(s.x-p.x)<13&&Math.abs(s.y-p.y)<10){
        killInvader(inv,false,ow);hit=true;break;
      }
    }
    if(hit)shots.splice(i,1);
  }
}
function playerHit(p){
  p=p||player;
  p.alive=false;
  burst(p.x,402,p.id?'#b48cff':'#5ad2ff',22,180);
  sfxPlayerBoom();
  comboReset(p);
  shakeT=0.4;
  lives--;
  if(p===player&&typeof navigator!=='undefined'&&navigator.vibrate){try{navigator.vibrate(80);}catch(e){}}
  if(lives<=0)gameOver();
  else p.respT=1.2;
}
function updEshots(dt){
  for(var i=eshots.length-1;i>=0;i--){
    var s=eshots[i];
    s.y+=s.vy*dt;s.ph+=10*dt;
    var hp=null;
    if(s.y>386&&s.y<406){var pl=PL();for(var k=0;k<pl.length;k++){var q=pl[k];
      if(q.alive&&q.invT<=0&&Math.abs(s.x-q.x)<14){hp=q;break;}}}
    if(hp){
      if(hp.shield){
        hp.shield=false;
        addFloat(hp.x,378,'SHIELD DOWN','#57ff7a');
        sfxShieldPop();speak('SHIELD DOWN');
      }else{
        playerHit(hp);
      }
      eshots.splice(i,1);continue;
    }
    if(s.y>336&&s.y<376&&hitBunker(s.x,s.y)){eshots.splice(i,1);continue;}
    if(s.y>430){burst(s.x,432,'#ff4646',3,50);eshots.splice(i,1);}
  }
}
/* ---------- lives, continue, entry ---------- */
function loseLife(){
  var pl=PL();for(var k=0;k<pl.length;k++)comboReset(pl[k]);
  lives--;
  shakeT=0.4;
  if(lives<=0)gameOver();
}
function gameOver(){
  STATE='CONTINUE';stateT=0;contT=9.99;btns=[];
  stick.active=false;stick.dx=0;fireHeld=false;
  sfxGameOver();
  speak('GAME OVER',true);
}
function continueGame(){
  continuesUsed++;
  lives=3;
  var pl=PL();
  for(var k=0;k<pl.length;k++){var p=pl[k];
    p.combo=0;p.mult=1;p.alive=true;p.respT=0;p.invT=2;p.x=p.home;
    p.shield=false;p.rapidT=0;p.spreadT=0;}
  eshots=[];bombQ=[];
  STATE='PLAY';stateT=0;
  if(playPhase==='intro')skipIntro();
  speak('GO');
}
function expireContinue(){finishRun();}
function finishRun(){
  if(score>hiScore)hiScore=score;
  if(qualifies(score)){
    STATE='ENTRY';stateT=0;
    entryChars=[0,0,0];entrySlot=0;entryRank=-1;
    buildEntryBtns();
    speak('ENTER YOUR NAME');
  }else{
    gotoBoard();
  }
}
function entryMove(d){
  if(entrySlot>2)return;
  entryChars[entrySlot]=(entryChars[entrySlot]+d+36)%36;
  sfxUi();
}
function entryLock(){
  if(STATE!=='ENTRY')return;
  entrySlot++;
  sfxUi();
  if(entrySlot>=3)saveEntry();
}
function saveEntry(){
  var ini=CHARS.charAt(entryChars[0])+CHARS.charAt(entryChars[1])+CHARS.charAt(entryChars[2]);
  var b=getBoard();
  b.push(player2.on?{i:ini,s:score,w:wave,c:continuesUsed,p:2}:{i:ini,s:score,w:wave,c:continuesUsed});
  b.sort(function(a,x){return x.s-a.s;});
  b=b.slice(0,10);
  saveBoard(b);
  entryRank=-1;
  for(var k=0;k<b.length;k++)if(b[k].s===score&&b[k].i===ini){entryRank=k;break;}
  hiScore=b[0].s;
  if(entryRank===0)speak('NEW HIGH SCORE',true);
  gotoBoard();
}
/* ---------- update dispatch ---------- */
function update(dt){
  tGlobal+=dt;stateT+=dt;
  updFx(dt);
  if(toastT>0)toastT-=dt;
  if(NET.role)netTick(dt);
  if(!(NET.role==='guest'&&NET.live))simUpdate(dt);
  if(NET.role==='host'&&NET.live)hostSend();
}
function updCannon(p,dir,fire,dt){
  if(p.alive){
    p.x=clamp(p.x+dir*230*dt,20,300);
    p.fireT-=dt;
    if(p.rapidT>0)p.rapidT-=dt;
    if(p.spreadT>0)p.spreadT-=dt;
    if(p.invT>0)p.invT-=dt;
    if(fire)fireShot(p);
  }else if(p.respT>0){
    p.respT-=dt;
    if(p.respT<=0){p.alive=true;p.invT=2;p.x=p.home;}
  }
}
function simUpdate(dt){
  if(STATE==='SPLASH'){
    if(stateT>2.6)gotoTitle();
  }
  else if(STATE==='PLAY'){
    var dir=(keys.r?1:0)-(keys.l?1:0);
    if(stick.active)dir=stick.dx/40;
    updCannon(player,dir,fireHeld||keys.f,dt);
    if(player2.on&&!player2.gone){
      if(player2.alive)player2.x=clamp(+NET.rin.x||player2.home,20,300);
      updCannon(player2,0,!!NET.rin.f,dt);
    }
    if(playPhase==='intro')introUpd(dt);
    else if(playPhase==='clear'){
      phaseT+=dt;
      if(phaseT>1.6)startWave(wave+1);
    }
    march(dt);
    updDivers(dt);
    diverRams();
    divers(dt);
    enemyFire(dt);
    updSaucer(dt);
    updShots(dt);
    updEshots(dt);
    updPups(dt);
    updBombQ(dt);
  }
  else if(STATE==='CONTINUE'){
    contT-=dt;
    if(contT<=0)expireContinue();
  }
  else if(STATE==='BOARD'){
    boardT+=dt;
    if(boardT>12)gotoTitle();
  }
  else if(STATE==='LOBBY')lobbyUpd(dt);
}

var scanCv=null;
function buildScan(){
  scanCv=document.createElement('canvas');
  scanCv.width=W;scanCv.height=H;
  var g=scanCv.getContext('2d');
  g.fillStyle='#000';
  for(var y=0;y<H;y+=2)g.fillRect(0,y,W,1);
}
function drawSpr(c,x,y,scl,rot){
  ctx.save();
  ctx.translate(x,y);
  if(rot)ctx.rotate(rot);
  ctx.scale(scl*2,scl*2);
  ctx.drawImage(c,-c.width/2,-c.height/2);
  ctx.restore();
}
function drawStars(){
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    s.y+=s.sp/60;
    if(s.y>H)s.y-=H;
    var a=0.35+0.35*Math.sin(tGlobal*2+s.tw);
    ctx.globalAlpha=a;
    ctx.fillStyle=s.s>1?'#9fd8ff':'#557';
    ctx.fillRect(s.x|0,s.y|0,s.s,s.s);
  }
  ctx.globalAlpha=1;
}
function drawBtns(){
  for(var i=0;i<btns.length;i++){
    var b=btns[i];
    if(!b.label)continue;
    ctx.fillStyle='rgba(10,30,45,0.85)';
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='#5ad2ff';ctx.lineWidth=2;
    ctx.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2);
    text(b.label,b.x+b.w/2,b.y+b.h/2+1,16,'#cfefff');
  }
}
function invFrameKey(inv){
  var fr=(inv.mode==='form')?marchFrame:((tGlobal*8|0)%2);
  return inv.type+(fr?'B':'A');
}
function drawInvaders(){
  for(var i=0;i<invaders.length;i++){
    var inv=invaders[i];
    if(!inv.alive)continue;
    var spr=SPRC[invFrameKey(inv)];
    var x,y,rot=0,scl=1;
    if(inv.mode==='form'){
      var tx=fx+inv.c*CW+12, ty=fy+inv.r*RH+8;
      if(!inv.landed){
        var idx=inv.r*COLS+inv.c;
        var u=clamp((phaseT-inv.landT)/0.9,0,1);
        if(u<=0)continue;
        var e=1-(1-u)*(1-u)*(1-u);
        x=lerp(tx+Math.sin(idx*2.7)*220,tx,e);
        y=lerp(-40-idx*3,ty,e);
        rot=(1-e)*12.56;
        scl=0.2+0.8*e;
      }else{
        x=tx;y=ty;
        scl=1+0.06*Math.sin(tGlobal*3+inv.dOff);
        if(aliveN<=8)rot=Math.sin(tGlobal*7+inv.dOff)*0.14;
      }
    }else if(inv.mode==='dive'){
      x=inv.x;y=inv.y;rot=Math.sin(inv.divT*8)*0.5;scl=1.1;
    }else{
      x=inv.x;y=inv.y;
    }
    drawSpr(spr,x,y,scl,rot);
  }
}
function drawBunkers(){
  for(var b=0;b<bunkers.length;b++){
    var bk=bunkers[b];
    for(var r=0;r<3;r++)for(var c=0;c<5;c++){
      var hp=bk.cells[r][c];
      if(hp<=0)continue;
      ctx.fillStyle=hp===2?'#3aff5e':'#1e9440';
      ctx.fillRect(bk.x+c*6,bk.y+r*6,6,6);
    }
  }
}
function drawShots(){
  var i;
  for(i=0;i<shots.length;i++){
    var s=shots[i];
    ctx.fillStyle=s.o?'#d9c4ff':'#aef7ff';ctx.fillRect(s.x-1,s.y-4,2,8);
    ctx.fillStyle='#fff';ctx.fillRect(s.x-1,s.y-5,2,2);
  }
  for(i=0;i<eshots.length;i++){
    var e=eshots[i];
    ctx.fillStyle='#ff4646';
    for(var k=0;k<3;k++){
      var xo=Math.sin(e.ph+k*2.1)*3;
      ctx.fillRect(e.x-1.5+xo,e.y-6+k*4,3,4);
    }
  }
}
function drawPups(){
  for(var i=0;i<pups.length;i++){
    var p=pups[i];
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle='#08131c';
    ctx.fillRect(-9,-9,18,18);
    ctx.strokeStyle=PUPCOL[p.type];ctx.lineWidth=2;
    ctx.strokeRect(-8,-8,16,16);
    ctx.restore();
    text(p.type.charAt(0),p.x,p.y+1,12,PUPCOL[p.type]);
  }
}

/* ============================================================================
   SNAIL-NETCODE v1.00 (core module) | Snail Attack Studios | 2026-07-06
   ----------------------------------------------------------------------------
   Provenance: extracted from proven, gate-verified production code.
   - PATTY PANIC v217: PeerJS transport (host claims a room id, guest connects),
     snapshot cadence knob (SNAP_EVERY, PATTY ships 1 = 60Hz since v146; 2 = 30Hz
     is the bandwidth-friendly setting), and netResync (v210): a peer returning
     from the background drops its stale backlog to the single newest message and
     resets its derived clocks, so the sim never sprints to catch up.
   - GRID GRUDGE v55: local-field-authority pattern: events apply immediately,
     field snapshots overwrite latest-wins, no interpolation, no prediction, and
     therefore no backlog machinery. Mode 'latest' encodes it.
   Version lives here AND in the filename (studio law, 2026-07-06).
   ----------------------------------------------------------------------------
   TWO MODES (pick per title; see SNAIL-NETCODE-PACK-v1.00.md):
   - 'queue'  : shared-world host authority (PATTY topology). Inbound messages
                queue; the game drains them each frame; a background return
                calls netResync() which collapses the backlog.
   - 'latest' : local field authority with arbitrated events (GRID GRUDGE
                topology). Types named in latestTypes overwrite per type (only
                the newest matters); everything else queues and is drained next
                frame. No backlog can build by construction.
   WHAT THIS CORE DOES NOT DO: game-side prediction/reconcile. That is game
   code by nature (PATTY's predicting/predGuard fence). The pack documents the
   fence rule; do not fake it here.
   ----------------------------------------------------------------------------
   HEADLESS: with an injected wire ({send, onmessage}) this runs under Node with
   zero dependencies; that is how the loopback gate template drives it. Without
   a wire it looks for the global PeerJS Peer and degrades gracefully to
   disabled when absent (solo play unaffected; send() returns false).

var SNAILNET = (function(){

var VERSION = '1.00';

function create(){
  var net = {
    enabled:false, open:false, role:null,
    mode:'queue',

    controlTypes:{start:1, bye:1},   // never dropped by a resync
    inbox:[], latest:{}, lastSeen:{},

    peer:null, conn:null, wire:null,
    onOpen:null, onClose:null, onError:null, onResync:null

  function init(opts){
    opts = opts || {};
    if(opts.mode) net.mode = opts.mode;
    if(opts.latestTypes) net.latestTypes = opts.latestTypes;
    if(opts.controlTypes) net.controlTypes = opts.controlTypes;
    net.onOpen = opts.onOpen || null;  net.onClose = opts.onClose || null;
    net.onError = opts.onError || null; net.onResync = opts.onResync || null;

    if(opts.wire){                                   // injected transport (gates)

      if(net.onOpen) net.onOpen(net.role);

    if(typeof Peer === 'undefined'){                 // graceful offline degradation

    }

    var id = (opts.idPrefix || 'snail-') + room;

    net.enabled = true;

    else if(opts.role === 'host'){ becomeHost(id, popts); }
    else {                                           // claim election: try the room id
      try{

        p.on('error', function(e){

  function recv(raw){
    var m; try{ m = (typeof raw === 'string') ? JSON.parse(raw) : raw; }catch(e){ return; }
    if(!m || !m.t) return;
    if(net.mode === 'latest' && net.latestTypes[m.t]){
      var seen = net.lastSeen[m.t] || 0;
      if(m.s && m.s <= seen) return;                 // never process a stale one when newer was seen
      net.lastSeen[m.t] = m.s || seen;
      net.latest[m.t] = m;                           // newest wins; no backlog by construction
      return;
    }
    net.inbox.push(m);
  }

  function drain(fn){                                // the game calls this once per frame
    if(net.mode === 'latest'){
      for(var t in net.latest){ if(net.latest[t]){ var m = net.latest[t]; net.latest[t] = null; fn(m); } }
    }
    while(net.inbox.length) fn(net.inbox.shift());
  }

  /* netResync: the generalized PATTY v210 shape. Collect survivors in SIDE
     LISTS, never re-push into the queue being drained (that is an infinite
     loop). Controls survive in order; latestTypes collapse to their newest;
     everything else is stale backlog and is dropped. The game's onResync
     callback resets its derived clocks (interpolation, prediction, frame
     clock); a half reset leaves a stale cadence. */
  function netResync(nowMs){
    var keep = [], newest = {};
    while(net.inbox.length){
      var m = net.inbox.shift();
      if(!m) continue;
      if(net.controlTypes[m.t]) keep.push(m);
      else if(net.latestTypes[m.t]){
        if(!newest[m.t] || (m.s || 0) >= (newest[m.t].s || 0)) newest[m.t] = m;
      }
      /* else: dropped */
    }
    for(var k = 0; k < keep.length; k++) net.inbox.push(keep[k]);
    for(var t in newest) if(newest[t]) net.inbox.push(newest[t]);
    for(var lt in net.latest) net.latest[lt] = null;
    if(net.onResync) net.onResync(nowMs || 0);
  }

  function wireVisibility(doc, nowFn){               // call once at boot in the browser
    if(!doc || !doc.addEventListener) return false;
    doc.addEventListener('visibilitychange', function(){
      var now = nowFn ? nowFn() : Date.now();
      if(doc.hidden){ net.hiddenAt = now; }
      else if(net.hiddenAt && (now - net.hiddenAt) > RESYNC_GAP_MS){ netResync(now); net.hiddenAt = 0; }
      else { net.hiddenAt = 0; }
    });
    return true;
  }

  return { VERSION:VERSION, init:init, send:send, recv:recv, drain:drain,
           netResync:netResync, wireVisibility:wireVisibility, state:net };
}

return { VERSION:VERSION, RESYNC_GAP_MS:RESYNC_GAP_MS, create:create };
})();
if(typeof module !== 'undefined') module.exports = SNAILNET;
/* ==================== SNAILNET SLOT : END ==================== */
boot();
buildScan();
})();
