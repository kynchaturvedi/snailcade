<!DOCTYPE html>
<!--
REEF RIOT - Snail Attack Studios
Single-file HTML5 aquarium defense game. Mobile-first portrait, no external
dependencies except optional PeerJS CDN (degrades gracefully offline).

CHANGELOG (append-only, newest first)
=====================================
v1 (2026-07-03) FIRST LIGHT
- Complete first playable: Insaniquarium-inspired feed/collect/defend loop.
- 16-level adventure across 4 zones (SUNLIT SHALLOWS, KELP FOREST, TWILIGHT
  REEF, ABYSSAL TRENCH), each zone with its own procedural backdrop painter
  and its own boss on the 4th level (KRAKEN WHELP, ANGLER KING, REEF WRECKER,
  LEVIATHAN PRIME).
- Fish roster: GUPPY (4 growth stages: small/med/large/KING, coin tier per
  stage silver 15 / gold 35 / diamond 200) and CARNIVORE (eats small guppies,
  drops diamond 200 on its own timer). Starvation warn at hunger 0.7, death
  at 1.0 (guppy 26s full-to-dead, carnivore 34s).
- 8 unlockable abilities, one earned per non-boss level cleared (levels
  1,2,3,5,6,7,9,10): SHELLY snail (floor coin pickup), SPARKY turret
  (auto-zap 10 dmg / 2.5s), GULP feeder eel (free food / 7s), MAG jelly
  (coin magnet + tap-to-cash cluster), PRONG urchin (8 dps contact),
  FROSTINA (slow pulse x0.55 for 3.5s / 8s), NIMBUS oyster (pearl 600 / 25s),
  BOOM bubble whale (fish in radius 64 cannot be eaten). Loadout cap 2,
  rises to 3 at zone 3.
- Aliens: GRABBER, WRAITH (phase cycle solid 2.2s / phased 1.6s, only solid
  is hittable), COINSNATCHER (steals coins, bag 5 then escapes, killing it
  spills the bag), SPLITTER (splits into 2 minis on death). HP scales
  1 + 0.12*(level-1). Tap-zap dmg 6 + 6 per LASER tier (max 3).
- Per-level fresh economy (Insaniquarium doctrine): each level starts with
  240 coins (400 on boss levels), 1 guppy (2 on boss), upgrades reset.
  Level clears on 3rd EGG piece (cost 400 + 150*(level-1) each). Mercy
  guppy after 3s when tank is empty and money short.
- Co-op: host-authoritative PeerJS (room code rrt-XXXX). Guest sends taps +
  cursor, host broadcasts 10 Hz compact snapshots + event stream; guest
  interpolates. Transport abstracted so harness2 runs a full host+guest
  loopback in one process (two vm contexts).
- WebAudio synth SFX (coins, chomp, grow, alarm, zap, boss roar, jingles),
  per-zone ambient pad + bubble ticks, first-gesture init, degrades silent.
- On-screen error reporter (ERR line) wired before anything else.
- Test hook shipped from frame one (built by buildhook.js into test-game.js).
-->

function tone(f,d,type,vol,f2,dl){
 if(!AU.ctx||!S.sfx)return;
 var t=AU.ctx.currentTime+(dl||0);
 var o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
 g.gain.setValueAtTime(vol||0.15,t);
 g.gain.exponentialRampToValueAtTime(0.001,t+d);
 o.connect(g);g.connect(AU.mg);o.start(t);o.stop(t+d+0.02);
}
function nois(d,vol,fq,dl){
 if(!AU.ctx||!S.sfx)return;
 var t=AU.ctx.currentTime+(dl||0);
 var n=Math.floor(AU.ctx.sampleRate*d);
 var b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),ch=b.getChannelData(0);
 for(var i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
 var s=AU.ctx.createBufferSource();s.buffer=b;
 var f=AU.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||900;f.Q.value=0.8;
 var g=AU.ctx.createGain();g.gain.setValueAtTime(vol||0.2,t);
 g.gain.exponentialRampToValueAtTime(0.001,t+d);
 s.connect(f);f.connect(g);g.connect(AU.mg);s.start(t);s.stop(t+d);
}

function dist(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function nearestFood(x,y){var b=null,bd=1e9;
 for(var i=0;i<G.foods.length;i++){var d=dist(x,y,G.foods[i].x,G.foods[i].y);
  if(d<bd){bd=d;b=G.foods[i];}}return b;}
function nearestSmallGuppy(x,y){var b=null,bd=1e9;
 for(var i=0;i<G.fishes.length;i++){var f=G.fishes[i];
  if(f.k!==0||f.stage!==0)continue;
  var d=dist(x,y,f.x,f.y);if(d<bd){bd=d;b=f;}}return b;}
function nearestFish(x,y,exSh){var b=null,bd=1e9;
 for(var i=0;i<G.fishes.length;i++){var f=G.fishes[i];
  var d=dist(x,y,f.x,f.y);if(d<bd){bd=d;b=f;}}return b;}
function nearestAlien(x,y){var b=null,bd=1e9;
 for(var i=0;i<G.aliens.length;i++){var a=G.aliens[i];
  var d=dist(x,y,a.x,a.y);if(d<bd){bd=d;b=a;}}return b;}
function killFish(f,code){

/* ============================ FISH ============================ */
function fishSize(f){return f.k===1?19:[7,10,14,18][f.stage];}
function updFish(f,dt){
 var starve=f.k===1?C.CARN_STARVE:C.GUPPY_STARVE;
 f.hunger+=dt/starve;
 if(f.hunger>=1){killFish(f,EVC.FISHDIE);return;}
 f.warn=f.hunger>C.HUNGER_WARN;
 f.blink-=dt;if(f.blink<-0.15)f.blink=RR(2,6);
 if(f.stun>0)f.stun-=dt;
 if(f.eatCd>0)f.eatCd-=dt;
 // panic when an invader is close
 var na=nearestAlien(f.x,f.y);
 if(na&&dist(f.x,f.y,na.x,na.y)<70)f.panic=0.6;else if(f.panic>0)f.panic-=dt;
 f.wob+= (f.wob===undefined?0:0);
 var spd=(f.k===1?42:48)*(f.panic>0?1.7:1)*(f.stun>0?0.35:1);
 var target=null;
 if(f.hunger>C.HUNGER_SEEK&&f.eatCd<=0){
  target=f.k===1?nearestSmallGuppy(f.x,f.y):nearestFood(f.x,f.y);
 }
 if(f.panic>0&&na){ // flee vector
  var fx=f.x-na.x,fy=f.y-na.y,fl=Math.max(1,Math.sqrt(fx*fx+fy*fy));
  f.vx=fx/fl*spd;f.vy=fy/fl*spd*0.8;
 } else if(target){
  var tx=target.x-f.x,ty=target.y-f.y,tl=Math.max(1,Math.sqrt(tx*tx+ty*ty));
  f.vx=tx/tl*spd;f.vy=ty/tl*spd;
  var reach=fishSize(f)*0.7+5;
  if(tl<reach){
   if(f.k===1){ // carnivore eats a small guppy
    killFish(target,EVC.GULP);
    f.hunger=0;f.fed++;f.eatCd=1.2;
   } else {
    var fi=G.foods.indexOf(target);
    if(fi>=0){
     G.foods.splice(fi,1);
     f.hunger=Math.max(0,f.hunger-C.FOOD_SAT[target.tier]);
     f.fed+=C.FOOD_VAL[target.tier];
     f.eatCd=0.35;
     EV(EVC.CHOMP,f.x,f.y);
     var os=f.stage;
     if(f.fed>=C.GROW3)f.stage=3;else if(f.fed>=C.GROW2)f.stage=2;
     else if(f.fed>=C.GROW1)f.stage=1;
     if(f.stage!==os)EV(f.stage===3?EVC.KING:EVC.GROW,f.x,f.y);
    }
   }
  }
 } else { // wander
  f.h+=RR(-1,1)*dt*2.2;
  f.vx=Math.cos(f.h)*spd*0.42;
  f.vy=Math.sin(f.h)*spd*0.2+Math.sin(S.t*2+f.uid)*4;
 }
 f.x+=f.vx*dt;f.y+=f.vy*dt;
 var sz=fishSize(f);
 if(f.x<sz+4){f.x=sz+4;f.h=Math.PI-f.h;}
 if(f.x>W-sz-4){f.x=W-sz-4;f.h=Math.PI-f.h;}
 if(f.y<TANK_TOP+sz+6){f.y=TANK_TOP+sz+6;f.h=-f.h;}
 if(f.y>FLOOR-sz-2){f.y=FLOOR-sz-2;f.h=-f.h;}
 if(f.vx>3)f.dir=1;else if(f.vx<-3)f.dir=-1;
 // coin production
 if(f.stun<=0){
  if(f.k===0&&f.stage>=1){
   f.coinT-=dt;
   if(f.coinT<=0){
    f.coinT=C.GUPPY_COIN_T+RR(-2,2);
    dropCoin(f.x,f.y+2,f.stage===1?CT_SILVER:(f.stage===2?CT_GOLD:CT_DIAMOND));
   }
  } else if(f.k===1&&f.hunger<0.85){
   f.coinT-=dt;
   if(f.coinT<=0){f.coinT=C.CARN_COIN_T+RR(-3,3);dropCoin(f.x,f.y+2,CT_DIAMOND);}
  }
 }
}

 fd.wob+=dt*5;
 fd.y+=fd.vy*dt;fd.x+=Math.sin(fd.wob)*8*dt;

function coinVal(tv){return C.CV[tv];}
function collectCoin(cn,x,y,ev){

 if(i<0)return 0;
 G.coins.splice(i,1);
 var v=coinVal(cn.tv);
 G.money+=v;G.stats.earned+=v;
 EV(ev||EVC.COINGET,x!==undefined?x:cn.x,y!==undefined?y:cn.y,v);

function updCoin(cn,dt,idx){
 if(cn.ob){ // orbiting the jelly
  var j=G.ab.jelly;
  if(!j){cn.ob=0;return;}
  cn.spin+=dt*2.2;
  cn.x+= (j.x+Math.cos(cn.spin+cn.uid)*16-cn.x)*Math.min(1,dt*6);
  cn.y+= (j.y+Math.sin(cn.spin+cn.uid)*12-cn.y)*Math.min(1,dt*6);
  return; // orbiting coins do not expire
 }
 cn.spin+=dt*6;
 cn.life-=dt;
 if(cn.life<=0){G.coins.splice(idx,1);return;}
 if(cn.y<FLOOR-7){cn.y+=cn.vy*dt;}
 else {cn.y=FLOOR-7;cn.rest+=dt;}
 // jelly attraction
 var j=G.ab.jelly;
 if(j&&dist(cn.x,cn.y,j.x,j.y)<C.JELLY_R&&j.orb<C.JELLY_ORB_MAX){
  var dx=j.x-cn.x,dy=j.y-cn.y,dl=Math.max(1,Math.sqrt(dx*dx+dy*dy));
  cn.x+=dx/dl*46*dt;cn.y+=dy/dl*46*dt;
  if(dl<16){cn.ob=1;j.orb++;}
 }
}

/* ============================ ALIENS ============================ */
function alienSpd(a){return ADEF[a.type].spd*(a.slow>0?C.FROST_MUL:1);}
function tryEat(a,f){
 if(f.sh){ // whale bubble: bounce off
  var dx=a.x-f.x,dy=a.y-f.y,dl=Math.max(1,Math.sqrt(dx*dx+dy*dy));
  a.x+=dx/dl*26;a.y+=dy/dl*18;a.chew=1.4;
  EV(EVC.BOING,f.x,f.y);
  return false;
 }
 killFish(f,EVC.EATEN);
 a.chew=1.1;
 return true;
}
function updAlien(a,dt,idx){
 if(a.slow>0)a.slow-=dt;
 a.wob+=dt*4;
 if(a.flash>0)a.flash-=dt;
 if(a.kbx||a.kby){ // BUILD 2 pushback ride-out
  a.x+=a.kbx*dt;a.y+=a.kby*dt;
  a.kbx*=Math.pow(0.001,dt);a.kby*=Math.pow(0.001,dt);
  if(Math.abs(a.kbx)<2&&Math.abs(a.kby)<2){a.kbx=0;a.kby=0;}
  a.x=Math.max(-20,Math.min(W+20,a.x));
  a.y=Math.max(TANK_TOP+14,Math.min(FLOOR-6,a.y));
 }
 if(a.chew>0){a.chew-=dt;return;}
 var spd=alienSpd(a);
 if(a.type==='diver'){ // BUILD 5: telegraphed vertical strikes
  if(a.mode===0){ // lurk along the surface, shadowing the nearest fish
   var lt=nearestFish(a.x,a.y);
   a.y+=((TANK_TOP+28)-a.y)*Math.min(1,dt*3);
   if(lt){a.x+=(lt.x>a.x?1:-1)*spd*dt;
    if(Math.abs(lt.x-a.x)<10&&lt.y>a.y+30){a.mode=1;a.ph=1;a.st=ADEF.diver.tel;}}
   else a.x+=Math.cos(a.wob*0.5)*spd*0.5*dt;
  } else if(a.mode===1){ // wind up: the shiver is the tell
   a.st-=dt;a.x+=Math.sin(S.t*40)*14*dt;
   if(a.st<=0){a.mode=2;a.ph=0;}
  } else if(a.mode===2){ // the dive
   a.y+=ADEF.diver.dive*dt;
   var df=nearestFish(a.x,a.y);
   if(df)a.x+=Math.max(-1,Math.min(1,(df.x-a.x)/8))*spd*0.9*dt; // slight tracking drift
   if(df&&Math.abs(df.x-a.x)<ADEF.diver.r+fishSize(df)*0.6&&
      Math.abs(df.y-a.y)<ADEF.diver.r+fishSize(df)*0.6){if(tryEat(a,df))a.mode=3;}
   if(a.y>=FLOOR-14)a.mode=3;
  } else { // rise back to the lurk line
   a.y-=spd*1.2*dt;
   if(a.y<=TANK_TOP+30)a.mode=0;
  }
  a.x=Math.max(-20,Math.min(W+20,a.x));
  a.y=Math.max(TANK_TOP+18,Math.min(FLOOR-10,a.y));
  return;
 }
 if(a.type==='leech'){ // BUILD 5: latch and drain; killing it frees the fish
  if(a.host&&G.fishes.indexOf(a.host)>=0){
   var hf=a.host;
   a.x=hf.x;a.y=hf.y-fishSize(hf)*0.7-3;a.ph=1;
   hf.leeched=true;hf.panic=Math.max(hf.panic||0,0.25);
   a.dr+=dt;
   if(a.dr>=ADEF.leech.drain){hf.leeched=false;killFish(hf,EVC.EATEN);a.host=null;a.dr=0;a.ph=0;}
   return;
  }
  a.host=null;a.ph=0;
  var lf2=nearestFish(a.x,a.y);
  if(lf2){
   var lx=lf2.x-a.x,ly=lf2.y-a.y,ll=Math.max(1,Math.sqrt(lx*lx+ly*ly));
   a.x+=lx/ll*spd*dt;a.y+=ly/ll*spd*dt;
   if(ll<ADEF.leech.r+fishSize(lf2)*0.7){
    if(lf2.sh){a.x-=lx/ll*24;a.chew=1.2;EV(EVC.BOING,lf2.x,lf2.y);} // the bubble still holds
    else{a.host=lf2;a.dr=0;a.ph=1;lf2.leeched=true;} // flags land THIS tick (guest read)
   }
  } else {a.x+=Math.cos(a.wob)*spd*0.4*dt;a.y+=Math.sin(a.wob*0.8)*spd*0.35*dt;}
  a.x=Math.max(-20,Math.min(W+20,a.x));
  a.y=Math.max(TANK_TOP+18,Math.min(FLOOR-10,a.y));
  return;
 }
 if(a.type==='bulwark'){ // BUILD 5: shielded front, slow deliberate turns
  var bf=nearestFish(a.x,a.y);
  if(bf){
   var wantDir=bf.x>a.x?1:-1;
   if(wantDir!==a.dir){a.st+=dt;if(a.st>0.9){a.dir=wantDir;a.st=0;}} // it turns like a barge
   else a.st=0;
   a.x+=a.dir*spd*dt;
   a.y+=(bf.y-a.y)*Math.min(1,dt*0.55);
   var bd=dist(a.x,a.y,bf.x,bf.y);
   if(bd<ADEF.bulwark.r+fishSize(bf)*0.6)tryEat(a,bf);
  } else a.x+=a.dir*spd*0.5*dt;
  a.x=Math.max(-20,Math.min(W+20,a.x));
  a.y=Math.max(TANK_TOP+18,Math.min(FLOOR-10,a.y));
  return;
 }
 if(a.type==='wraith'){
  a.phT-=dt;
  if(a.phT<=0){
   a.ph=a.ph?0:1;
   a.phT=a.ph?ADEF.wraith.solid:ADEF.wraith.phase;
  }
 }
 if(a.type==='snatcher'){
  if(a.flee){
   var gx=a.flee<0?-30:W+30;
   a.x+=(gx>a.x?1:-1)*spd*1.2*dt;
   if(a.x<-24||a.x>W+24){
    var ai=G.aliens.indexOf(a);
    if(ai>=0){G.aliens.splice(ai,1);EV(EVC.ESCAPE,a.x<0?12:W-12,a.y);}
   }
   return;
  }
  // hunt coins
  var bc=null,bd=1e9;
  for(var i=0;i<G.coins.length;i++){var cn=G.coins[i];
   if(cn.ob)continue;
   var d=dist(a.x,a.y,cn.x,cn.y);if(d<bd){bd=d;bc=cn;}}
  if(bc){
   var dx=bc.x-a.x,dy=bc.y-a.y,dl=Math.max(1,Math.sqrt(dx*dx+dy*dy));
   a.x+=dx/dl*spd*dt;a.y+=dy/dl*spd*dt;
   if(dl<ADEF.snatcher.r+6){
    var ci=G.coins.indexOf(bc);
    if(ci>=0){G.coins.splice(ci,1);a.bag.push(bc.tv);
     if(a.bag.length>=ADEF.snatcher.bag)a.flee=(a.x<W/2?-1:1);}
   }
  } else {
   a.x+=Math.cos(a.wob*0.5)*spd*0.5*dt;
   a.y+=Math.sin(a.wob*0.7)*spd*0.4*dt;
  }
 } else { // grabber / wraith(solid seeks) / splitter / mini
  var canEat=(a.type!=='wraith')||a.ph===1;
  var tf=nearestFish(a.x,a.y);
  if(tf&&canEat){
   var dx2=tf.x-a.x,dy2=tf.y-a.y,dl2=Math.max(1,Math.sqrt(dx2*dx2+dy2*dy2));
   a.x+=dx2/dl2*spd*dt;a.y+=dy2/dl2*spd*dt;
   if(dl2<ADEF[a.type].r+fishSize(tf)*0.6)tryEat(a,tf);
  } else {
   a.x+=Math.cos(a.wob*0.4)*spd*0.4*dt;
   a.y+=Math.sin(a.wob*0.6)*spd*0.3*dt;
  }
 }
 a.x=Math.max(-20,Math.min(W+20,a.x));
 a.y=Math.max(TANK_TOP+18,Math.min(FLOOR-10,a.y));
}
function hitAlien(a,dmg,x,y){
 if(a.type==='wraith'&&a.ph===0){EV(EVC.CLINK,x,y);return false;}
 if(a.type==='bulwark'&&x!==undefined&&(x-a.x)*a.dir>2){ // BUILD 5: shield front
  EV(EVC.CLINK,x,y);return false;
 }
 a.hp-=dmg;
 a.flash=0.14; // BUILD 2: strikes visibly land
 if(x!==undefined&&y!==undefined){ // BUILD 2: pushback away from the strike
  var kdx=a.x-x,kdy=a.y-y,kd=Math.sqrt(kdx*kdx+kdy*kdy);
  if(kd<1){kdx=RR(-0.5,0.5);kdy=-1;kd=1;}
  a.kbx=kdx/kd*95;a.kby=kdy/kd*95;
  a.chew=Math.max(a.chew,0.18); // the blow staggers the bite
 }
 if(a.hp<=0){
  var i=G.aliens.indexOf(a);
  if(i>=0)G.aliens.splice(i,1);
  G.stats.kills++;
  EV(EVC.ADIE,a.x,a.y);
  if(a.type==='snatcher'&&a.bag.length){
   for(var b=0;b<a.bag.length;b++)dropCoin(a.x+RR(-14,14),a.y+RR(-8,8),a.bag[b]);
   EV(EVC.SPILL,a.x,a.y);
  }
  if(a.type==='splitter'){
   spawnAlien('mini',a.x-12,a.y);spawnAlien('mini',a.x+12,a.y);
  }
  if(a.type==='leech'&&a.host)a.host.leeched=false; // BUILD 5: the fish is freed
 }
 return true;
}

 S.bossIntro=2.4;

function bossTotalHp(b){

function bossDied(b){

 for(var i=0;i<6;i++)dropCoin(RR(60,W-60),RR(TANK_TOP+40,TANK_TOP+120),CT_DIAMOND);

function updBoss(b,dt){
 if(b.dead>0){
  b.dead-=dt;
  if(b.dead<=0){G.boss=null;clearLevel();}
  return;
 }
 if(b.t===1){ // KRAKEN WHELP
  var anyT=false;
  for(var i=0;i<3;i++){var tt=b.tt[i];
   if(!tt.alive)continue;anyT=true;tt.ph+=dt*2;
   tt.eat=(tt.eat||RR(4,7))-dt;
   if(tt.eat<=0){tt.eat=RR(5,8);
    var f=nearestFish(tt.x,FLOOR-40);
    if(f&&Math.abs(f.x-tt.x)<34&&f.y>FLOOR-96&&!f.sh){killFish(f,EVC.EATEN);EV(EVC.CHOMP,tt.x,FLOOR-40);}
   }
  }
  if(b.em){
   b.emT-=dt;
   b.y+=((TANK_TOP+150)-b.y)*Math.min(1,dt*3);
   b.eatT-=dt;
   if(b.eatT<=0){b.eatT=3.5;
    var f2=nearestFish(W/2,b.y);
    if(f2&&dist(f2.x,f2.y,W/2,b.y)<70&&!f2.sh){killFish(f2,EVC.EATEN);EV(EVC.CHOMP,W/2,b.y);}
   }
   if(b.emT<=0){
    b.em=0;b.regrow=1.2;
    for(var j=0;j<3;j++){b.tt[j].alive=1;b.tt[j].hp=45;}
   }
  } else {
   b.y+=((FLOOR+40)-b.y)*Math.min(1,dt*3);
   if(!anyT&&b.regrow<=0){
    b.em=1;b.emT=8;b.emerges++;b.eatT=2.5;
    EV(EVC.ROAR,W/2,TANK_TOP+140);
   }
   if(b.regrow>0)b.regrow-=dt;
  }
 } else if(b.t===2){ // ANGLER KING
  b.h+=dt;
  if(b.vt>0){b.vt-=dt;
   if(b.vt<=0){b.lreg=2.0;}
  }
  if(!b.lal&&b.vt<=0){
   b.lreg-=dt;
   if(b.lreg<=0){b.lal=1;b.lhp=60;b.lmx=60;}
  }
  if(b.dash){
   b.x+=b.dx*dt;b.y+=b.dy*dt;b.dash-=dt;
   var f3=nearestFish(b.x,b.y);
   if(f3&&dist(f3.x,f3.y,b.x,b.y)<26&&!f3.sh){killFish(f3,EVC.EATEN);}
   if(b.dash<=0||b.x<30||b.x>W-30||b.y<TANK_TOP+30||b.y>FLOOR-30)b.dash=0;
  } else {
   b.x=W/2+Math.cos(b.h*0.6)*90;
   b.y=TANK_TOP+80+Math.sin(b.h*0.9)*36;
   b.dashT-=dt;
   if(b.dashT<=0){b.dashT=RR(4.5,6.5);
    var f4=nearestFish(b.x,b.y);
    if(f4){var dl=Math.max(1,dist(f4.x,f4.y,b.x,b.y));
     b.dx=(f4.x-b.x)/dl*170;b.dy=(f4.y-b.y)/dl*170;b.dash=1.0;}
   }
  }
  b.minT-=dt;
  if(b.minT<=0){b.minT=12;
   if(G.aliens.length<3){spawnAlien('mini',b.x,b.y+20);b.minions++;EV(EVC.MINION,b.x,b.y);}
  }
  b.x=Math.max(30,Math.min(W-30,b.x));
  b.y=Math.max(TANK_TOP+34,Math.min(FLOOR-40,b.y));
 } else if(b.t===3){ // REEF WRECKER
  var alive=0;
  for(var p=0;p<4;p++)if(b.pl[p].alive)alive++;
  b.vul=alive===0?1:0;
  b.x+=b.dir*22*dt;
  if(b.x<60){b.x=60;b.dir=1;}
  if(b.x>W-60){b.x=W-60;b.dir=-1;}
  if(b.snapA>0)b.snapA-=dt;
  b.snapT-=dt;
  if(b.snapT<=0){b.snapT=9;b.snaps++;b.snapA=0.5;
   EV(EVC.SNAP,b.x,FLOOR-40);
   for(var s=0;s<G.fishes.length;s++)G.fishes[s].stun=4;
   var f5=nearestFish(b.x,FLOOR-40);
   if(f5&&dist(f5.x,f5.y,b.x,FLOOR-40)<64&&!f5.sh)killFish(f5,EVC.EATEN);
  }
 } else if(b.t===4){ // LEVIATHAN PRIME
  var tot=bossTotalHp(b);
  if(b.st===1&&tot<=150){b.st=2;EV(EVC.ROAR,W/2,TANK_TOP+80);}
  var spdMul=b.st===2?1.45:1;
  if(b.ph===0){ // background circling, untouchable
   b.ba+=dt*0.7;
   b.bgT-=dt;
   if(b.bgT<=0){
    b.ph=1;b.passT=0;b.dir=R()<0.5?1:-1;b.passes++;
    b.py=RR(TANK_TOP+60,FLOOR-90);
   }
  } else { // the pass
   b.passT+=dt*spdMul/4.2;
   var hx=b.dir>0? -60+b.passT*(W+180) : W+60-b.passT*(W+180);
   for(var g=0;g<3;g++){
    var lag=g*34;
    var sx=hx-b.dir*lag;
    b.segs[g].x=sx;
    b.segs[g].y=b.py+Math.sin((b.passT*6)+g*0.9)*26;
   }
   var head=b.segs[0];
   if(head.alive){
    var f6=nearestFish(head.x,head.y);
    if(f6&&dist(f6.x,f6.y,head.x,head.y)<24&&!f6.sh)killFish(f6,EVC.EATEN);
   }
   if(b.passT>=1){
    b.ph=0;b.bgT=b.st===2?3.4:4.5;
    if(b.st===2&&G.aliens.length<3){spawnAlien('mini');EV(EVC.MINION,W/2,TANK_TOP+40);}
   }
  }
 }
}
function bossHitTest(b,x,y,dmg){
 if(!b||b.dead>0)return 0; // 0 = nothing there
 if(b.t===1){
  for(var i=0;i<3;i++){var tt=b.tt[i];
   if(tt.alive&&Math.abs(x-tt.x)<20&&y>FLOOR-104&&y<FLOOR){
    tt.hp-=dmg;EV(EVC.BHIT,x,y);
    if(tt.hp<=0){tt.alive=0;puff(tt.x,FLOOR-50,'#c96fd8',12,70);}
    return 1;
   }}
  if(dist(x,y,W/2,b.y)<56){
   if(!b.em){EV(EVC.CLINK,x,y);return 2;} // hit but invulnerable
   b.hp-=dmg;EV(EVC.BHIT,x,y);
   if(b.hp<=0)bossDied(b);
   return 1;
  }
  return 0;
 }
 if(b.t===2){
  var lx=b.x+ (b.dash?0:26), ly=b.y-30;
  if(b.lal&&dist(x,y,lx,ly)<18){
   b.lhp-=dmg;EV(EVC.BHIT,x,y);
   if(b.lhp<=0){b.lal=0;b.vt=7;puff(lx,ly,'#ffe45c',10,60);}
   return 1;
  }
  if(dist(x,y,b.x,b.y)<40){
   if(b.vt<=0){EV(EVC.CLINK,x,y);return 2;}
   b.hp-=dmg;EV(EVC.BHIT,x,y);
   if(b.hp<=0)bossDied(b);
   return 1;
  }
  return 0;
 }
 if(b.t===3){
  var by=FLOOR-58;
  var off=[[-34,-16],[34,-16],[-16,-40],[16,-40]];
  for(var p=0;p<4;p++){var pl=b.pl[p];
   if(pl.alive&&dist(x,y,b.x+off[p][0],by+off[p][1])<16){
    pl.hp-=dmg;EV(EVC.BHIT,x,y);
    if(pl.hp<=0){pl.alive=0;puff(b.x+off[p][0],by+off[p][1],'#e8a24c',10,60);}
    return 1;
   }}
  if(dist(x,y,b.x,by)<44){
   if(!b.vul){EV(EVC.CLINK,x,y);return 2;}
   b.hp-=dmg;EV(EVC.BHIT,x,y);
   if(b.hp<=0)bossDied(b);
   return 1;
  }
  return 0;
 }
 if(b.t===4){
  if(b.ph===0){ // background phase: honoring the depth language, taps pass through
   return 0;
  }
  for(var g=0;g<3;g++){var sg=b.segs[g];
   if(sg.alive&&dist(x,y,sg.x,sg.y)<(g===0?24:20)){
    sg.hp-=dmg;EV(EVC.BHIT,x,y);
    if(sg.hp<=0){sg.alive=0;puff(sg.x,sg.y,'#7ae8d8',12,70);
     var all=!b.segs[0].alive&&!b.segs[1].alive&&!b.segs[2].alive;
     if(all)bossDied(b);
    }
    return 1;
   }}
  return 0;
 }
 return 0;
}

/* ============================ ABILITIES ============================ */
function setupAbilities(){
 G.ab={};
 for(var i=0;i<S.load.length;i++){
  var id=ABIL[S.load[i]].id;
  if(id==='snail') G.ab.snail={x:W*0.3,dir:1,pick:0};
  if(id==='turret')G.ab.turret={x:W-22,y:TANK_TOP+18,cd:1.2};
  if(id==='eel')   G.ab.eel={x:16,y:FLOOR-46,cd:3,mouth:0};
  if(id==='jelly') G.ab.jelly={x:W*0.68,y:TANK_TOP+120,bh:R()*6,orb:0};
  if(id==='urchin')G.ab.urchin={x:W*0.42,y:FLOOR-12,tick:0};
  if(id==='frost') G.ab.frost={x:34,y:TANK_TOP+34,cd:4,pulse:0};
  if(id==='oyster')G.ab.oyster={x:W-52,y:FLOOR-10,cd:C.OYSTER_CD,open:0};
  if(id==='whale') G.ab.whale={x:W*0.5,y:TANK_TOP+170,dir:1};
 }
}
function updAbilities(dt){
 var ab=G.ab,i;
 // whale shield recompute
 for(i=0;i<G.fishes.length;i++)G.fishes[i].sh=false;
 if(ab.whale){
  var wh=ab.whale;
  wh.x+=wh.dir*14*dt;
  wh.y=TANK_TOP+170+Math.sin(S.t*0.7)*26;
  if(wh.x<70)wh.dir=1;
  if(wh.x>W-70)wh.dir=-1;
  for(i=0;i<G.fishes.length;i++){var f=G.fishes[i];
   if(dist(f.x,f.y,wh.x,wh.y)<C.WHALE_R)f.sh=true;}
 }
 if(ab.snail){
  var sn=ab.snail;
  if(sn.pick>0)sn.pick-=dt;
  else{
   var bc=null,bd=1e9;
   for(i=0;i<G.coins.length;i++){var cn=G.coins[i];
    if(cn.rest>0&&!cn.ob){var d=Math.abs(cn.x-sn.x);if(d<bd){bd=d;bc=cn;}}}
   if(bc){
    sn.dir=bc.x>sn.x?1:-1;
    sn.x+=sn.dir*C.SNAIL_SPD*dt;
    if(Math.abs(bc.x-sn.x)<10){
     var ci=G.coins.indexOf(bc);
     if(ci>=0){G.coins.splice(ci,1);
      var v=coinVal(bc.tv);G.money+=v;G.stats.earned+=v;
      EV(EVC.SNAILGET,sn.x,FLOOR-14,v);sn.pick=0.5;}
    }
   } else {
    sn.x+=sn.dir*C.SNAIL_SPD*0.4*dt;
    if(sn.x<26)sn.dir=1;
    if(sn.x>W-26)sn.dir=-1;
   }
  }
 }
 if(ab.turret){
  ab.turret.cd-=dt;
  if(ab.turret.cd<=0){
   var ta=null,td=1e9;
   for(i=0;i<G.aliens.length;i++){var a=G.aliens[i];
    if(a.type==='wraith'&&a.ph===0)continue;
    var d2=dist(ab.turret.x,ab.turret.y,a.x,a.y);
    if(d2<td){td=d2;ta=a;}}
   if(ta){ab.turret.cd=C.TURRET_CD;
    EV(EVC.TURRET,ta.x,ta.y);
    hitAlien(ta,C.TURRET_DMG,ta.x,ta.y);}
   else ab.turret.cd=0.4;
  }
 }
 if(ab.eel){
  ab.eel.cd-=dt;
  if(ab.eel.mouth>0)ab.eel.mouth-=dt;
  if(ab.eel.cd<=0){
   ab.eel.cd=C.EEL_CD;
   if(G.foods.length<G.foodCap){
    ab.eel.mouth=0.5;
    var fd=dropFood(ab.eel.x+30,G.qual);
    fd.y=ab.eel.y-6;fd.x=ab.eel.x+22;
    EV(EVC.SPIT,ab.eel.x+10,ab.eel.y-6);
   }
  }
 }
 if(ab.jelly){
  var j=ab.jelly;
  j.bh+=dt*0.5;
  j.x=W*0.68+Math.cos(j.bh)*40;
  j.y=TANK_TOP+120+Math.sin(j.bh*1.3)*34;
 }
 if(ab.urchin){
  ab.urchin.tick-=dt;
  if(ab.urchin.tick<=0){
   ab.urchin.tick=0.5;
   for(i=G.aliens.length-1;i>=0;i--){var a2=G.aliens[i];
    if(dist(a2.x,a2.y,ab.urchin.x,ab.urchin.y)<ADEF[a2.type].r+14){
     hitAlien(a2,C.URCHIN_DPS*0.5,a2.x,a2.y);
    }}
  }
 }
 if(ab.frost){
  ab.frost.cd-=dt;
  if(ab.frost.pulse>0)ab.frost.pulse-=dt;
  if(ab.frost.cd<=0){
   ab.frost.cd=C.FROST_CD;
   if(G.aliens.length){
    ab.frost.pulse=0.6;
    EV(EVC.FROST,ab.frost.x,ab.frost.y);
    for(i=0;i<G.aliens.length;i++)G.aliens[i].slow=C.FROST_DUR;
   }
  }
 }
 if(ab.oyster){
  var oy=ab.oyster;
  if(oy.open>0)oy.open-=dt;
  oy.cd-=dt;
  if(oy.cd<=0){
   oy.cd=C.OYSTER_CD;oy.open=1.2;
   dropCoin(oy.x,oy.y-16,CT_PEARL);
  }
 }
}

/* ============================ TAPS ============================ */
function coinAt(x,y){var b=null,bd=C.TAP_COIN_R;
 for(var i=0;i<G.coins.length;i++){var cn=G.coins[i];
  if(cn.ob)continue; // orbiting coins are the jelly's; cash the cluster instead
  var d=dist(x,y,cn.x,cn.y);if(d<bd){bd=d;b=cn;}}return b;}
function alienAt(x,y){var b=null,bd=1e9;
 for(var i=0;i<G.aliens.length;i++){var a=G.aliens[i];
  var d=dist(x,y,a.x,a.y);
  if(d<ADEF[a.type].r+C.TAP_ALIEN_PAD&&d<bd){bd=d;b=a;}}return b;}
function zapDmg(){return C.ZAP_BASE+G.laser*C.ZAP_TIER;}
function tankTap(x,y){
 var cn=coinAt(x,y);
 if(cn){collectCoin(cn,x,y);return;}
 var j=G.ab.jelly;
 if(j&&dist(x,y,j.x,j.y)<26&&j.orb>0){
  for(var i=G.coins.length-1;i>=0;i--){
   if(G.coins[i].ob)collectCoin(G.coins[i],j.x,j.y);
  }
  j.orb=0;return;
 }
 var a=alienAt(x,y);
 if(a){EV(EVC.ZAP,x,y);hitAlien(a,zapDmg(),x,y);return;}
 if(G.boss){
  var r=bossHitTest(G.boss,x,y,zapDmg());
  if(r>0){EV(EVC.ZAP,x,y);return;}
 }
 if(y>TANK_TOP+4){
  if(G.foods.length<G.foodCap)dropFood(x,G.qual);
  else if(!G.fullT||G.fullT<=0){G.fullT=1;textUp(x,y,'food full','#cfeeff');}
 }
}
function tankDrag(x,y){
 var cn=coinAt(x,y);
 if(cn)collectCoin(cn,x,y);
}

/* ============================ SHOP ============================ */
function eggCost(){return C.EGG_BASE+C.EGG_STEP*(G.level-1);}
function shopDefs(){
 return [
  {id:'qual',ic:'Q',lb:'FOOD',cost:G.qual<2?C.QUAL_COST[G.qual]:0,max:G.qual>=2,tier:G.qual,tmax:2},
  {id:'maxf',ic:'M',lb:'MAX',cost:G.foodCap<C.FOOD_MAX?C.MAXF_COST:0,max:G.foodCap>=C.FOOD_MAX,tier:G.foodCap-C.FOOD_START,tmax:C.FOOD_MAX-C.FOOD_START},
  {id:'guppy',ic:'G',lb:'GUPPY',cost:C.GUPPY_COST,max:false},
  {id:'carn',ic:'C',lb:'CARNI',cost:C.CARN_COST,max:false},
  {id:'laser',ic:'L',lb:'LASER',cost:G.laser<C.LASER_MAX?C.LASER_COST:0,max:G.laser>=C.LASER_MAX,tier:G.laser,tmax:C.LASER_MAX},
  L.isBoss?{id:'boss',ic:'!',lb:'BOSS',cost:0,max:true}
          :{id:'egg',ic:'E',lb:'EGG',cost:eggCost(),max:G.eggs>=3,tier:G.eggs,tmax:3}
 ];
}
function shopRects(){
 var r=[],bw=52,gap=1,x0=(W-(bw*6+gap*5))/2;
 for(var i=0;i<6;i++)r.push({x:x0+i*(bw+gap),y:56,w:bw,h:34});
 return r;
}
function buy(id){
 var px=W/2,py=76;
 function ok(cost){G.money-=cost;EV(EVC.BUY,px,py);return true;}
 function no(){EV(EVC.DENY,px,py);return false;}
 if(id==='qual'){if(G.qual>=2)return no();var c=C.QUAL_COST[G.qual];
  if(G.money<c)return no();G.qual++;return ok(c);}
 if(id==='maxf'){if(G.foodCap>=C.FOOD_MAX)return no();
  if(G.money<C.MAXF_COST)return no();G.foodCap++;return ok(C.MAXF_COST);}
 if(id==='guppy'){if(G.money<C.GUPPY_COST)return no();
  spawnGuppy(RR(80,W-80),TANK_TOP+40);return ok(C.GUPPY_COST);}
 if(id==='carn'){if(G.money<C.CARN_COST)return no();
  spawnCarn(RR(80,W-80),TANK_TOP+50);return ok(C.CARN_COST);}
 if(id==='laser'){if(G.laser>=C.LASER_MAX)return no();
  if(G.money<C.LASER_COST)return no();G.laser++;return ok(C.LASER_COST);}
 if(id==='egg'){
  if(L.isBoss||G.eggs>=3)return no();
  var ec=eggCost();
  if(G.money<ec)return no();
  G.eggs++;ok(ec);EV(EVC.EGG,W/2,TANK_TOP+30);
  if(G.eggs>=3)clearLevel();
  return true;
 }
 return no();
}
function shopHit(x,y){
 var rs=shopRects(),ds=shopDefs();
 for(var i=0;i<6;i++){var r=rs[i];
  if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){
   if(ds[i].id!=='boss')buy(ds[i].id);
   return true;
  }}
 return false;
}

/* ============================ LEVEL FLOW ============================ */
function slotCap(lv){return lv>=9?3:2;}
function startLevel(l){
 G=freshG();
 G.level=l;L=LEVELS[l-1];G.zone=L.zone;
 G.money=L.isBoss?C.BOSS_MONEY:C.START_MONEY;
 G.waveT=L.isBoss?9999:L.wf;
 spawnGuppy(W/2-20,TANK_TOP+60);
 if(L.isBoss)spawnGuppy(W/2+20,TANK_TOP+70);
 setupAbilities();
 FX.parts.length=0;FX.texts.length=0;
 if(L.isBoss)G.boss=makeBoss(L.zone);
 S.state='play';S.paused=false;S.fade=0.6;
 if(AU.ctx)padStart(G.zone);
}
function clearLevel(){
 if(S.etest){ // BUILD 4: editor test runs never touch progression
  EV(EVC.CLEAR,W/2,H/2);
  S.etest=false;S.paused=false;S.state='editor';
  toast('CLEAR! BACK TO THE EDITOR');
  return;
 }
 EV(EVC.CLEAR,W/2,H/2);
 S.prog=Math.max(S.prog,G.level);
 S.newAb=-1;
 var ui=UNLOCK_AT.indexOf(G.level);
 if(ui>=0&&!S.unl[ui]){
  S.unl[ui]=true;S.newAb=ui;
  if(S.load.length<slotCap(G.level+1)&&S.load.indexOf(ui)<0)S.load.push(ui);
 }
 S.clearStats={level:G.level,earned:G.stats.earned,lost:G.stats.lost,
  kills:G.stats.kills,isBoss:L.isBoss};
 S.state=(G.level>=16)?'win':'clear';
}
function advanceFromClear(){
 S.nextLv=Math.min(16,G.level+1);
 S.state='loadout';
}

/* ============================ PLAY UPDATE ============================ */
function updatePlay(dt){
 if(S.paused)return;
 G.time+=dt;
 if(G.fullT>0)G.fullT-=dt;
 // waves
 if(!L.isBoss){
  G.waveT-=dt;
  if(G.waveT<=0){spawnWave();G.waveT=L.wi;}
 }
 var i;
 for(i=G.warns.length-1;i>=0;i--){var wn=G.warns[i];
  wn.t-=dt;
  if(wn.t<=0){spawnAlien(wn.type,wn.side,wn.y);G.warns.splice(i,1);}
 }
 for(i=G.fishes.length-1;i>=0;i--)updFish(G.fishes[i],dt);
 for(i=G.foods.length-1;i>=0;i--)updFood(G.foods[i],dt,i);
 for(i=G.coins.length-1;i>=0;i--)updCoin(G.coins[i],dt,i);
 for(i=G.aliens.length-1;i>=0;i--)updAlien(G.aliens[i],dt,i);
 if(G.boss)updBoss(G.boss,dt);
 updAbilities(dt);
 // mercy guppy
 if(G.fishes.length===0&&G.money<C.GUPPY_COST){
  G.mercyT+=dt;
  if(G.mercyT>=C.MERCY_T){G.mercyT=0;
   var f=spawnGuppy(W/2,TANK_TOP+60);f.hunger=0;
   EV(EVC.MERCY,W/2,TANK_TOP+60);}
 } else G.mercyT=0;
}
function updFX(dt){
 var i;
 for(i=FX.parts.length-1;i>=0;i--){var p=FX.parts[i];
  p.t-=dt;
  if(p.t<=0){FX.parts.splice(i,1);continue;}
  if(!p.ring&&!p.bolt){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;}
 }
 for(i=FX.texts.length-1;i>=0;i--){var t=FX.texts[i];
  t.t-=dt;t.y-=22*dt;
  if(t.t<=0)FX.texts.splice(i,1);
 }
 if(S.shake>0){S.shake=Math.max(0,S.shake-dt*14);}
 if(S.msgT>0)S.msgT-=dt;
 if(S.fade>0)S.fade-=dt;
 if(S.bossIntro>0)S.bossIntro-=dt;
 if(S.cur2.t>0)S.cur2.t-=dt;

/* ---------------- PeerJS glue (real devices) ---------------- */
var CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ';
function makeCode(){var c='';for(var i=0;i<4;i++)c+=CODE_CHARS[RI(0,CODE_CHARS.length-1)];return c;}
function mkPeerTr(conn){
 var tr={q:[],send:function(s){try{conn.send(s);}catch(e){}},
  pull:function(){var a=tr.q;tr.q=[];return a;}};
 conn.on('data',function(d){tr.q.push(''+d);});
 conn.on('close',function(){detachNet();});
 conn.on('error',function(){detachNet();});
 return tr;
}
function peerAvailable(){return typeof Peer!=='undefined';}
function startHost(){
 if(!peerAvailable()){S.peerStat='PeerJS offline: co-op unavailable';return;}
 S.code=makeCode();S.peerStat='opening...';
 try{
  NET.peer=new Peer('rrt-'+S.code,{debug:0});
  NET.peer.on('open',function(){S.peerStat='share this code';});
  NET.peer.on('connection',function(c){
   NET.conn=c;
   c.on('open',function(){attachNet('host',mkPeerTr(c));});
  });
  NET.peer.on('error',function(e){S.peerStat='error: '+(e.type||'peer');});
 }catch(e){S.peerStat='error starting host';}
}
function startJoin(code){
 if(!peerAvailable()){S.peerStat='PeerJS offline: co-op unavailable';return;}
 S.peerStat='connecting...';
 try{
  NET.peer=new Peer({debug:0});
  NET.peer.on('open',function(){
   var c=NET.peer.connect('rrt-'+code,{reliable:true});
   NET.conn=c;
   c.on('open',function(){attachNet('guest',mkPeerTr(c));S.peerStat='';});
   c.on('error',function(){S.peerStat='could not reach host';});
  });
  NET.peer.on('error',function(e){S.peerStat='error: '+(e.type||'peer');});
 }catch(e){S.peerStat='error joining';}
}
function killPeer(){
 try{if(NET.conn)NET.conn.close();}catch(e){}
 try{if(NET.peer)NET.peer.destroy();}catch(e){}
 NET.peer=null;NET.conn=null;
}

/* ---------- PeerJS glue (browser only, degrades if CDN blocked) ---------- */
var CODE_CH='ABCDEFGHJKMNPQRSTUVWXYZ';
function genCode(){var s='';for(var i=0;i<4;i++)s+=CODE_CH[RI(0,CODE_CH.length-1)];return s;}
function mkTransport(conn){
 var q=[];
 conn.on('data',function(d){q.push(''+d);});
 return {send:function(s){try{conn.send(s);}catch(e){}},
  pull:function(){var m=q;q=[];return m;},
  close:function(){try{conn.close();}catch(e){}}};
}
function coopCleanup(){
 if(NET.peer){try{NET.peer.destroy();}catch(e){}}
 NET.peer=null;NET.conn=null;netDetach();
}
function partnerLost(){
 if(NET.role==='guest'){coopCleanup();S.state='title';S.coop='off';toast('CONNECTION LOST');}
 else{netDetach();toast('PARTNER LEFT, CARRYING ON SOLO');}
}
function coopHost(){
 if(typeof Peer==='undefined'){S.peerStat='PeerJS unavailable (offline or blocked)';return;}
 coopCleanup();
 S.code=genCode();S.coop='hosting';S.peerStat='opening room...';
 try{NET.peer=new Peer('rrt-'+S.code,{debug:0});}catch(e){S.peerStat='could not start peer';return;}
 NET.peer.on('open',function(){S.peerStat='share this code with player 2';});
 NET.peer.on('connection',function(c){
  NET.conn=c;
  c.on('open',function(){
   netAttach('host',mkTransport(c));
   S.peerStat='';toast('PARTNER JOINED');
   S.nextLv=Math.min(16,S.prog+1);S.state='loadout';
  });
  c.on('close',partnerLost);c.on('error',partnerLost);
 });
 NET.peer.on('error',function(e){S.peerStat='error: '+((e&&e.type)||'peer');});
}
function coopJoin(){
 if(typeof Peer==='undefined'){S.peerStat='PeerJS unavailable (offline or blocked)';return;}
 if(S.join.length<4){S.peerStat='enter the 4 letter code';return;}
 coopCleanup();
 S.coop='joining';S.peerStat='connecting...';
 try{NET.peer=new Peer({debug:0});}catch(e){S.peerStat='could not start peer';return;}
 NET.peer.on('open',function(){
  var c=NET.peer.connect('rrt-'+S.join,{reliable:true});
  NET.conn=c;
  c.on('open',function(){
   netAttach('guest',mkTransport(c));

   if(cx2===0)ctx.moveTo(cx2,cy2);else ctx.lineTo(cx2,cy2);

  }
 }
 // drifting plankton motes everywhere
 for(i=0;i<14;i++){

 // sea grass tufts swaying on the sand
 for(i=0;i<7;i++){

   ctx.stroke();

 }

 if(z===1){ // anemones with waving fingers

   for(var fg=0;fg<5;fg++){
    var fa=3.6+fg*0.5+Math.sin(S.t*2+fg+i)*0.14;

 rr2(R2.bossTog.x,R2.bossTog.y,R2.bossTog.w,R2.bossTog.h,6);ctx.stroke();
 txt(lv.isBoss?'YES: boss fight':'NO: wave level',R2.bossTog.x+56,R2.bossTog.y+14,8,'#cfe8f8',null,true);
 BTN(R2.bossTog.x,R2.bossTog.y,R2.bossTog.w,R2.bossTog.h,function(){lv.isBoss=lv.isBoss?0:1;});
 var dim=!!lv.isBoss;
 stepRow('FIRST WAVE (s)',lv.wf,R2.wfMinus,R2.wfPlus,
  function(){lv.wf=Math.max(5,lv.wf-5);},function(){lv.wf=Math.min(120,lv.wf+5);},dim);
 stepRow('WAVE INTERVAL (s)',lv.wi,R2.wiMinus,R2.wiPlus,
  function(){lv.wi=Math.max(5,lv.wi-2);},function(){lv.wi=Math.min(120,lv.wi+2);},dim);
 stepRow('INVADERS PER WAVE',lv.wn,R2.wnMinus,R2.wnPlus,
  function(){lv.wn=Math.max(1,lv.wn-1);},function(){lv.wn=Math.min(6,lv.wn+1);},dim);
 txt(dim?'wave rows sleep on a boss level':'WAVE POOL (tap to toggle)',24,R2.types[0].y-6,7,'#7fb8d8','left');
 for(var t5=0;t5<ETYPES.length;t5++){
  var tr2=R2.types[t5],on2=lv.types.indexOf(ETYPES[t5])>=0;
  ctx.globalAlpha=dim?0.35:1;
  ctx.fillStyle=on2?'#14507a':'#0a2438';rr2(tr2.x,tr2.y,tr2.w,tr2.h,6);ctx.fill();
  ctx.strokeStyle=on2?'#7dff9a':'#2f6a94';ctx.lineWidth=1;
  rr2(tr2.x,tr2.y,tr2.w,tr2.h,6);ctx.stroke();
  txt(ETYPES[t5].toUpperCase(),tr2.x+32,tr2.y+14,6.5,on2?'#7dff9a':'#7fa8c8',null,true);
  ctx.globalAlpha=1;
  if(!dim)(function(ty){BTN(tr2.x,tr2.y,tr2.w,tr2.h,function(){
   var at=lv.types.indexOf(ty);
   if(at>=0){if(lv.types.length>1)lv.types.splice(at,1);else toast('KEEP AT LEAST ONE');}
   else lv.types.push(ty);
  });})(ETYPES[t5]);
 }
 drawBtn(R2.test.x,R2.test.y,R2.test.w,R2.test.h,'TEST LEVEL',13,function(){
  S.etest=true;startLevel(S.esel+1);});
 drawBtn(R2.resetRow.x,R2.resetRow.y,R2.resetRow.w,R2.resetRow.h,'RESET',10,function(){
  LEVELS[S.esel]=JSON.parse(JSON.stringify(LVDEF[S.esel]));toast('ROW RESTORED');});
 drawBtn(R2.backList.x,R2.backList.y,R2.backList.w,R2.backList.h,'LIST',10,function(){S.esel=-1;});
}
function drawEditorGlobals(R2){
 txt('the dials under every level; RESET ALL restores factory',W/2,78,7,'#7fb8d8',null,false);
 for(var i=0;i<EDITC.length;i++){
  var k=EDITC[i][0],st2=EDITC[i][1],mn=EDITC[i][2],mx=EDITC[i][3];
  var rr=R2.g[i];
  txt(k,(i<8?24:180)- (i<8?0:24),rr.minus.y+13,6.4,C[k]!==CDEF[k]?'#ffe45c':'#9fd8ff','left',true);
  (function(k2,st3,mn2,mx2,rw){
   stepRow('',C[k2],rw.minus,rw.plus,
    function(){C[k2]=Math.max(mn2,+(C[k2]-st3).toFixed(2));},
    function(){C[k2]=Math.min(mx2,+(C[k2]+st3).toFixed(2));});
  })(k,st2,mn,mx,rr);
 }
 drawBtn(R2.resetAll.x,R2.resetAll.y,R2.resetAll.w,R2.resetAll.h,'RESET ALL',11,function(){
  for(var j=0;j<EDITC.length;j++)C[EDITC[j][0]]=CDEF[EDITC[j][0]];
  toast('GLOBALS RESTORED');});
}

})();
</script>
