<script>
/* =============================================================================
   NEVER LOOK DOWN v1.00 | Snail Attack Studios | 2026-09-24 | var BUILD='v1.00'
   -----------------------------------------------------------------------------
   An arcade chase. WOLFGANG, a washed up stunt wolf, chases STRUT, the vain
   peacock who stole his show, up a scrolling desert of flats, mesa
   switchbacks, chasms, boulder gulches and rail crossings. Off an edge he runs
   on thin air for as long as he does not NOTICE: BELIEF is the one economy.
   Started from STUDIO SEED v1.05 (doc 07 BUILD 1 order; doc 11 grid, clock
   and display law built in). Commons adopted verbatim: SNAIL AUDIO KIT core
   plus the GRID GRUDGE music engine, REEF RIOT sweepAt, CANNONBALL CLASH
   sweepFx, FRENZY FLEET noiseFlat, and the SNAIL FEEL PACK core module.
   -----------------------------------------------------------------------------
   CHANGELOG (embedded; append only; one entry per build, for a future dev):
   v1.00 FIRST LIGHT (2026-09-24): the whole arcade loop. Seeded stages built
        from segments (flats, mesa, switchback, chasm, gulch, rail); six
        named stages that loop harder. WOLFGANG: auto trot, sprint, strafe,
        brake (which is LOOKING DOWN), pounce. STRUT: road following AI with
        rubber band pacing, pecking, taunts (fan display, the look down
        point), show off laps, bridge use and flutter, dodges. BELIEF: gauge
        0..100 and score multiplier x1..x4; AWARENESS eye over the wolf while
        he defies gravity; BELIEVE taps spend belief to shut the eye; notice
        at 1.0 means the fall. ROAD WAVE: STRUT bursting round bends throws a
        travelling hump down the road that can toss the wolf off the edge.
        Eleven gadgets (dynamite, anvil, tar, mirror, peahen call, rocket
        skates, lasso, spring pad, vacuum, cactus disguise, balloon), each
        with a backfire. Hazards: trucks (with near miss belief), cacti,
        rolling boulders, trains, dust devils. Gags: pancake, soot and
        frazzle, accordion, cliff fall with a side view GAG CAM. Arcade
        shell: 3 lives, extra lives at 30k then every 60k, capture to clear,
        escape costs a life, tally, local top 10 with initials, attract
        demo with a bot, SNAILCADE score report, fold survival snapshot.
        Findings folded in before publish: throws aim by the stick and lock
        onto a STOPPED STRUT (a running bird cannot be hit, by design); a
        pecking STRUT hears you at 140/100/58px by speed with a 0.3s startle;
        a catch no longer ends the stage (catch him at least once before the
        finish; every catch scores; he slips away 360px ahead); explosions
        MARK traps instead of splicing mid-loop (harness STORM crash);
        presses shorter than a frame latch (paintsmoke found dropped taps);
        HUD re-laid clear of the FULLSCREEN button with a drawn-rect audit;
        backing store capped at 2x (DPR_CAP) for fill rate.
   ============================================================================= */
(function(){
'use strict';
var BUILD='v1.00';                        // the vX.YZ stamp (studio versioning law)
var TITLE='NEVER LOOK DOWN';

/* ---- 1. ERROR REPORTER (always first; doctrine 07). Crashes become
        photographable: the ERR line draws LAST, above everything. ---- */
var lastError=null, ERRMSG='';
function reportErr(site,e){ lastError=String(site)+': '+(e&&e.message?e.message:String(e)); ERRMSG='ERR: '+lastError;
  try{ if(typeof console!=='undefined'&&console.error)console.error(e); }catch(_){} }

/* ---- 2. SHELL: canvas, scaler, fullscreen (STUDIO SEED v1.05, verbatim law) ---- */
var W=640,H=880;                              // RESOLUTION LAW (doc 11 s3): 16/32-bit class
                                              // logical grid; this title's visual contract is
                                              // smooth cartoon cel art at device resolution.
var cv=(typeof document!=='undefined')?document.getElementById('cv'):null;
var ctx=(cv&&cv.getContext)?cv.getContext('2d'):null;
var DPR=1;
var DPR_CAP=2;                                // doc 11 allows a 2x to 3x cap; this title's full-screen
                                              // terrain is fill-rate heavy, so it takes the low end
function applyBacking(){                      // backing store sized FROM THE DEVICE
  var d=(typeof window!=='undefined'&&window.devicePixelRatio)?window.devicePixelRatio:1;
  DPR=Math.max(1,Math.min(DPR_CAP,d));
  if(cv){ cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); }
  if(ctx){ if(ctx.setTransform)ctx.setTransform(DPR,0,0,DPR,0,0);
           ctx.imageSmoothingEnabled=false; }
}
applyBacking();
function viewSize(){
  var vw=window.innerWidth, vh=window.innerHeight;
  try{ if(window.visualViewport){
    vw=Math.min(vw,window.visualViewport.width);
    vh=Math.min(vh,window.visualViewport.height); }
  }catch(e){}
  try{ if(document.body&&document.body.clientWidth){
    vw=Math.min(vw,document.body.clientWidth);
    if(document.body.clientHeight)vh=Math.min(vh,document.body.clientHeight); }
  }catch(e){}
  return {w:vw,h:vh};
}
function computeScale(vw,vh){                 // pure and gated: always CONTAINED
  var s=Math.min(vw/W,vh/H);
  if(s>=2)s=Math.floor(s); if(s<0.25)s=0.25;
  return s;
}
function fitScale(){
  if(!cv||!cv.style||typeof window==='undefined')return;
  var v=viewSize(), s=computeScale(v.w,v.h);
  for(var i=0;i<8;i++){                        // CLOSED LOOP fit (seed v1.03)
    cv.style.width=Math.floor(W*s)+'px';
    cv.style.height=Math.floor(H*s)+'px';
    var r=cv.getBoundingClientRect?cv.getBoundingClientRect():null;
    if(!r||!r.width||r.bottom===undefined)break;
    var vw=window.innerWidth, vh=window.innerHeight;
    try{ if(window.visualViewport){ vw=Math.min(vw,window.visualViewport.width);
         vh=Math.min(vh,window.visualViewport.height); } }catch(e){}
    if(r.bottom<=vh+0.5&&r.right<=vw+0.5)break;
    if(s<=0.25)break;
    s=(s>2)?(s-1):(s*0.9); if(s<0.25)s=0.25;
  }
  applyBacking();
}
function settleFit(){
  fitScale();
  setTimeout(fitScale,150); setTimeout(fitScale,450); setTimeout(fitScale,1000);
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('resize',fitScale);
  window.addEventListener('orientationchange',function(){ settleFit(); });
  window.addEventListener('pageshow',function(){ settleFit(); });
  try{ if(window.visualViewport&&window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize',fitScale); }catch(e){}
}
if(typeof document!=='undefined'&&document.addEventListener)
  document.addEventListener('fullscreenchange',function(){ settleFit(); });
settleFit();
var fsBtn=(typeof document!=='undefined')?document.getElementById('fs'):null;
if(fsBtn&&fsBtn.addEventListener)fsBtn.addEventListener('click',function(){
  try{ var el=document.documentElement;
    if(document.fullscreenElement){ if(document.exitFullscreen)document.exitFullscreen(); }
    else if(el.requestFullscreen)el.requestFullscreen();
  }catch(e){}
  firstGesture();
  settleFit();
});

/* ---- 3. INPUT. Sources merge each sim step in pollInput(): keyboard, touch
        (floating stick on the left, drawn buttons on the right), gamepad,
        the attract/test BOT, and the headless override (setInput). The verb
        map lives in the codex: stick = run and steer (pull back = brake,
        which is LOOKING DOWN), A = USE gadget, B = POUNCE (over thin air it
        becomes BELIEVE), C = SWAP gadget, P = pause.
        touch-action none lives on the CANVAS only (doctrine 07). ---- */
var inp={sx:0,sy:0,a:false,b:false,c:false,p:false,any:false};
var prevBtn={a:false,b:false,c:false,p:false,any:false};
var forced=null;                     // headless override from the hook
var botOn=false, botInp={sx:0,sy:0,a:false,b:false,c:false};
var keys={};
var latch={};                        // presses shorter than a frame still register (v1.00 paintsmoke find)
var taps=[];                         // menu taps {x,y}
var isTouch=false;
function setInput(l,r,u,d,a,b,c){
  forced={sx:(r?1:0)-(l?1:0), sy:(d?1:0)-(u?1:0), a:!!a, b:!!b, c:!!c, p:false};
}
function clearForced(){ forced=null; }
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('keydown',function(e){ keyIn(e,true); });
  window.addEventListener('keyup',function(e){ keyIn(e,false); });
  window.addEventListener('blur',function(){ keys={}; });
}
var KEYMAP={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',A:'l',d:'r',D:'r',w:'u',W:'u',s:'d',S:'d',
  z:'a',Z:'a',' ':'a',j:'a',J:'a',x:'b',X:'b',k:'b',K:'b',c:'c',C:'c',Shift:'c',l:'c',L:'c',
  p:'p',P:'p',Escape:'p',Enter:'enter'};
var typed=[];                        // letters typed (initials entry)
function keyIn(e,on){
  var k=e.key, m=KEYMAP[k];
  if(on)firstGesture();
  if(on&&STATE==='entry'&&k&&k.length===1&&/[a-zA-Z]/.test(k)){ typed.push(k.toUpperCase()); if(e.preventDefault)e.preventDefault(); return; }
  if(on&&STATE==='entry'&&k==='Backspace'){ typed.push('<'); if(e.preventDefault)e.preventDefault(); return; }
  if(!m)return;
  keys[m]=on; if(on)latch[m]=true;
  if(e.preventDefault)e.preventDefault();
}
var stick={id:null,ox:0,oy:0,cx:0,cy:0};
var tbtn={};                          // touch identifier -> button name
var BTN={ a:{x:552,y:770,r:58}, b:{x:432,y:818,r:46}, c:{x:604,y:662,r:28}, p:{x:604,y:96,r:24} };
function touchXY(t){ var r=cv.getBoundingClientRect(), sx=W/r.width, sy=H/r.height;
  return {x:(t.clientX-r.left)*sx, y:(t.clientY-r.top)*sy}; }
function whichBtn(p){
  if(STATE!=='play')return null;
  var best=null,bd=1e9,k,b,d;
  for(k in BTN){ b=BTN[k]; d=Math.sqrt((p.x-b.x)*(p.x-b.x)+(p.y-b.y)*(p.y-b.y));
    if(d<b.r*1.45&&d<bd){bd=d;best=k;} }
  if(!best&&p.x>W*0.56&&p.y>H*0.55){ best=(p.x>500&&p.y<790)?'a':((p.y>800)?(p.x>500?'a':'b'):'a'); }
  return best;
}
function onTouchStart(e){
  firstGesture(); isTouch=true;
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i], p=touchXY(t);
    if(STATE!=='play'||phase==='paused'||phase==='clear'||phase==='gag'){ taps.push({x:p.x,y:p.y}); continue; }
    var b=whichBtn(p);
    if(b){ tbtn[t.identifier]=b; latch[b]=true; continue; }
    if(p.x<W*0.56&&stick.id===null&&p.y>150){ stick.id=t.identifier; stick.ox=p.x; stick.oy=p.y; stick.cx=p.x; stick.cy=p.y; }
    else taps.push({x:p.x,y:p.y});
  }
  if(e.preventDefault)e.preventDefault();
}
function onTouchMove(e){
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===stick.id){ var p=touchXY(t); stick.cx=p.x; stick.cy=p.y;
      var dx=stick.cx-stick.ox, dy=stick.cy-stick.oy, d=Math.sqrt(dx*dx+dy*dy);
      if(d>70){ stick.ox=stick.cx-dx/d*70; stick.oy=stick.cy-dy/d*70; } }   // the ring follows the thumb
  }
  if(e.preventDefault)e.preventDefault();
}
function onTouchEnd(e){
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===stick.id)stick.id=null;
    delete tbtn[t.identifier];
  }
  if(e.preventDefault)e.preventDefault();
}
if(cv&&cv.addEventListener){
  cv.addEventListener('touchstart',onTouchStart,{passive:false});
  cv.addEventListener('touchmove',onTouchMove,{passive:false});
  cv.addEventListener('touchend',onTouchEnd,{passive:false});
  cv.addEventListener('touchcancel',onTouchEnd,{passive:false});
  cv.addEventListener('mousedown',function(e){ firstGesture();
    var r=cv.getBoundingClientRect(); taps.push({x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}); });
}
function padState(){
  var o={sx:0,sy:0,a:false,b:false,c:false,p:false};
  try{
    if(typeof navigator==='undefined'||!navigator.getGamepads)return o;
    var ps=navigator.getGamepads(); if(!ps)return o;
    for(var i=0;i<ps.length;i++){ var g=ps[i]; if(!g||!g.connected)continue;
      var ax=g.axes[0]||0, ay=g.axes[1]||0;
      if(Math.abs(ax)>0.25)o.sx=ax; if(Math.abs(ay)>0.25)o.sy=ay;
      var B=g.buttons, pr=function(n){ return B[n]&&(B[n].pressed||B[n].value>0.5); };
      if(pr(14))o.sx=-1; if(pr(15))o.sx=1; if(pr(12))o.sy=-1; if(pr(13))o.sy=1;
      o.a=o.a||pr(0); o.b=o.b||pr(1); o.c=o.c||pr(2)||pr(3); o.p=o.p||pr(9);
      if(o.a||o.b||o.c||o.p)firstGesture();
    }
  }catch(e){}
  return o;
}
function pollInput(){
  var s={sx:0,sy:0,a:false,b:false,c:false,p:false};
  if(forced){ s.sx=forced.sx; s.sy=forced.sy; s.a=forced.a; s.b=forced.b; s.c=forced.c; }
  else if(botOn){ s.sx=botInp.sx; s.sy=botInp.sy; s.a=botInp.a; s.b=botInp.b; s.c=botInp.c; }
  else {
    s.sx=(keys.r?1:0)-(keys.l?1:0); s.sy=(keys.d?1:0)-(keys.u?1:0);
    s.a=!!keys.a||!!keys.enter||!!latch.a||!!latch.enter; s.b=!!keys.b||!!latch.b; s.c=!!keys.c||!!latch.c; s.p=!!keys.p||!!latch.p;
    if(stick.id!==null){ var dx=stick.cx-stick.ox, dy=stick.cy-stick.oy, d=Math.sqrt(dx*dx+dy*dy);
      if(d>9){ var m=Math.min(1,(d-9)/48); s.sx=dx/d*m; s.sy=dy/d*m; } }
    for(var id in tbtn){ var nb=tbtn[id]; if(nb==='a')s.a=true; else if(nb==='b')s.b=true; else if(nb==='c')s.c=true; else if(nb==='p')s.p=true; }
    var g=padState(); if(g.sx)s.sx=g.sx; if(g.sy)s.sy=g.sy; s.a=s.a||g.a; s.b=s.b||g.b; s.c=s.c||g.c; s.p=s.p||g.p;
  }
  latch={};
  var m2=Math.sqrt(s.sx*s.sx+s.sy*s.sy); if(m2>1){ s.sx/=m2; s.sy/=m2; }
  inp.sx=s.sx; inp.sy=s.sy; inp.a=s.a; inp.b=s.b; inp.c=s.c; inp.p=s.p;
  inp.any=s.a||s.b||s.c||s.p||Math.abs(s.sx)>0.5||Math.abs(s.sy)>0.5;
}
function pressed(k){ return inp[k]&&!prevBtn[k]; }
function latchInput(){ prevBtn.a=inp.a; prevBtn.b=inp.b; prevBtn.c=inp.c; prevBtn.p=inp.p; prevBtn.any=inp.any; }

/* ---- 4. AUDIO. SNAIL AUDIO KIT (commons, verbatim per 08) behind a first
        gesture; degrades silently. boot() runs inside EVERY gesture. ---- */
/* ============================================================================
   SNAIL AUDIO KIT v1.00 (core module) | Snail Attack Studios | 2026-07-06
   (spliced verbatim from snail-audio-lab-v1.06.html; kit v1.02 accessors)
   ============================================================================ */
var AKIT = (function(){
'use strict';
var VERSION = '1.02';   /* kit v1.02: ctx/bus accessors + the five-title merge */
var AC = null, master = null, VOL = 0.16;          // NEON SWARM shipped master

function boot(){                                    // call inside every gesture
  try{
    if(!AC){
      var C = (typeof AudioContext !== 'undefined') ? AudioContext :
              (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if(!C) return false;

      master.connect(AC.destination);

    return true;
  }catch(e){ AC = null; return false; }
}
function setVolume(v){ VOL = Math.max(0, Math.min(1, v)); if(master) master.gain.value = VOL; }
function ready(){ return !!AC; }

/* PATTY PANIC v217 tone(), verbatim shape: linear slide, exp decay */
function tone(f, dur, type, vol, slide){
  if(!AC) return;
  try{
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(vol || 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
/* NEON SWARM v78 beep(), verbatim shape: exponential ramp to a target pitch */
function sweep(freq, end, dur, type, vol){
  if(!AC) return;
  try{
    var o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, end), t + dur);
    gn.gain.setValueAtTime(vol || 0.5, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
/* PATTY PANIC arp(), verbatim shape */
function arp(notes, step, dur, type, vol){
  if(!AC) return;
  for(var i = 0; i < notes.length; i++)
    (function(nt, j){ setTimeout(function(){ tone(nt, dur, type, vol); }, j * step); })(notes[i], i);
}
var sfx = {};   /* title book below (NLD); the shared recipe book is not needed in this file */
return { VERSION:VERSION, boot:boot, ready:ready, setVolume:setVolume,
         tone:tone, sweep:sweep, arp:arp, sfx:sfx,
         ctx:function(){return AC;}, bus:function(){return master;} };
})();

/* ---- GRID GRUDGE CONTRIBUTION (engine verbatim: music layer, noise

(function (root, AKIT) {

/* ---- 11. STAGE FLOW ---- */
function stageSeed(i,lp){ return 9173+i*7919+lp*104729; }
function startGame(){

function stageMult(){ return 1+0.045*Math.min(stageIdx,6)+0.12*loopN; }
function cunning(){ return Math.min(0.75,LV.def.cunning+0.1*loopN); }

function updatePlay(dt){
  phaseT+=dt;
  if(phase==='paused'){ updatePause(); return; }
  if(pressed('p')&&(phase==='run'||phase==='intro'||phase==='ready')){ pauseGame(); return; }
  switch(phase){
    case 'intro': case 'ready':
      simStep(dt);
      if(phaseT>(phase==='intro'?2.3:1.2)){ phase='run'; phaseT=0; if(strut.st==='wait'){ strut.st='run'; strut.spd=STRUT_CRUISE; sfx('honk'); } syncMusic(); }
      break;
    case 'run': simStep(dt); break;
    case 'dying': simStep(dt); if(wolf.st==='gone'){ if(wolf.deathKind==='fall'){ phase='gag'; phaseT=0; } else afterDeath(); } break;
    case 'gag': updateFxOnly(dt); if(phaseT>2.6||(phaseT>0.6&&(pressed('a')||pressed('b')||taps.length))){ taps.length=0; afterDeath(); } break;
    case 'capture': updCapture(dt); break;
    case 'escape': simStep(dt); if(phaseT>2.8){ lives--; if(!infiniteLives&&lives<=0){ gameOver(); } else { startTally(false); } } break;
    case 'clear': updTally(dt); break;
  }
}
function updateFxOnly(dt){ updFx(dt); }
function pauseGame(){ phase='paused'; phaseT=0; syncMusic(); sfx('ui'); taps.length=0; }
var pausePrev='run';
function updatePause(){
  var t; while(taps.length){ t=taps.shift();
    if(t.y>400&&t.y<470){ resumeGame(); return; }
    if(t.y>500&&t.y<570){ quitToTitle(); return; } }
  if(phaseT>0.12&&(pressed('p')||pressed('a'))){ resumeGame(); }
}
function resumeGame(){ phase='ready'; phaseT=0.6; syncMusic(true); sfx('ui'); }
function quitToTitle(){ clearSave(); STATE='title'; titleMode='title'; titleT=0; phase=''; stopBot(); syncMusic(); try{ PORTAL.gameplayStop(); }catch(e){} }

function simStep(dt){
  stageT+=dt;
  if(botOn)botThink(dt);
  updWolf(dt);
  updStrut(dt);
  updWaves(dt);
  updTrucks(dt);
  updBoulders(dt);
  updTrains(dt);
  updDevils(dt);
  updThrown(dt);
  updTraps(dt);
  updCrates(dt);
  updFeathers(dt);
  updFx(dt);
  updCam(dt);
  if(phase==='run'){ spawners(dt);
    if(wolf.y>maxProg+100){ var n=Math.floor((wolf.y-maxProg)/100); maxProg+=n*100; score+=10*n*mult(); if(score>hiScore)hiScore=score; }
    if(wolf.y>=LV.finishY&&(wolf.st==='run'||wolf.st==='air'||wolf.st==='defy')){ if(captures>0)startTally(true); else strutEscapes(); }
  }
  if(hintT>0)hintT-=dt;
}
function updCam(dt){
  var tgt=wolf.y-(H-600);
  if(phase==='escape')tgt=Math.max(tgt,strut.y-420);
  if(wolf.st==='fall'||wolf.st==='gone')return;
  cam.y+=(tgt-cam.y)*Math.min(1,dt*5);
  if(cam.y<-60)cam.y=-60;
  if(cam.y>LV.L-H)cam.y=LV.L-H;
}

/* ---- 12. THE WOLF ---- */
function wolfCanAct(){ var s=wolf.st; return s==='run'||s==='defy'||s==='air'; }
function updWolf(dt){
  var w=wolf; w.t+=dt; w.anim+=dt;
  if(w.invul>0)w.invul-=dt; if(w.pulse>0)w.pulse-=dt; if(w.pounceCD>0)w.pounceCD-=dt;
  if(w.needles>0)w.needles-=dt; if(w.sootT>0)w.sootT-=dt; if(w.fluff>0)w.fluff-=dt; if(w.dizzy>0)w.dizzy-=dt;
  var s=w.st;
  if(s==='notice'||s==='fall'||s==='flat'||s==='soot'||s==='accordion'||s==='gone'){ updWolfDeath(dt); return; }
  if(s==='capture'||s==='sulk')return;
  if(s==='tow'){ updTow(dt); return; }
  // gadget timers
  if(w.skates>0){ w.skates-=dt; if(Math.floor(w.skates*10)!==Math.floor((w.skates+dt)*10))sfx('skate');
    burstW(w.x-8,w.y-14,'#ffb347',1,60); burstW(w.x+8,w.y-14,'#ff7a2a',1,60);
    if(w.skates<=0){ w.skates=0; if(rnd()<0.25){ skatesBackfire(); } } }
  if(w.disguise>0){ w.disguise-=dt; if(w.disguise<=0){ w.disguise=0; sfx('disguise'); } }
  if(w.vacuum>0){ w.vacuum-=dt; if(Math.floor(w.vacuum*8)!==Math.floor((w.vacuum+dt)*8))sfx('vacuum'); vacuumTick(dt); if(w.vacuum<=0){ w.vacuum=0; endVacuum(); } }
  if(w.stuck>0)w.stuck-=dt;
  if(w.ouch>0)w.ouch-=dt;
  if(w.spin>0)w.spin-=dt;
  // input
  var ix=inp.sx, fwd=-inp.sy;
  if(phase==='escape'){ ix=0; fwd=-0.4; }
  if(w.spin>0){ ix=Math.sin(w.t*9)*0.9; fwd=Math.cos(w.t*6.3)*0.7; }
  var vyT, vxT;
  if(w.skates>0){ vyT=430; vxT=ix*STRAFE_V*0.55; }
  else {
    vyT=fwd>=0?RUN_V+(SPRINT_V-RUN_V)*fwd:RUN_V+(-BACK_V-RUN_V)*(-fwd);
    vxT=ix*STRAFE_V;
    if(w.disguise>0){ vyT=clamp(vyT,-50,72); vxT*=0.45; }
  }
  if(w.stuck>0){ vyT*=0.1; vxT*=0.1; }
  if(w.vacuum>0){ vyT*=0.42; vxT*=0.55; }
  if(w.ouch>0){ vyT=-60; vxT=0; }
  if(w.dizzy>0){ vyT*=0.3; vxT=Math.sin(w.t*8)*60; }
  if(w.balloon>0){ vyT=clamp(vyT*0.8,-60,150); vxT*=0.8; }
  w.lookdown=fwd<-0.3;
  var acc=WOLF_ACC*(w.st==='air'&&w.balloon<=0?AIR_CONTROL:1);   // airborne: momentum carries, the stick only nudges
  if(w.pounceT>0){ w.pounceT-=dt; w.vx=w.pdx*POUNCE_V; w.vy=w.pdy*POUNCE_V+RUN_V*0.3; }
  else { w.vx+=clamp(vxT-w.vx,-acc*dt,acc*dt); w.vy+=clamp(vyT-w.vy,-acc*dt,acc*dt); }
  var ox=w.x, oy=w.y;
  w.x+=w.vx*dt; w.y+=w.vy*dt;
  w.stride+=Math.sqrt(w.vx*w.vx+w.vy*w.vy)*dt*0.075;
  if(w.x<16){w.x=16;w.vx=0;} if(w.x>W-16){w.x=W-16;w.vx=0;}
  if(w.y<30){w.y=30;w.vy=Math.max(0,w.vy);}
  if(groundAt(w.x,w.y)==='W'){ w.x=ox; w.vx=0; if(groundAt(w.x,w.y)==='W'){ w.x=roadX(w.y); } }
  // facing and view
  if(Math.abs(w.vx)>Math.abs(w.vy)*0.9&&Math.abs(w.vx)>40){ w.view='side'; w.face=w.vx>0?1:-1; }
  else if(w.vy<-20){ w.view='front'; }
  else w.view='back';
  // vertical: balloon, air, ground
  if(w.balloon>0){
    w.balloon-=dt; w.z+=(40-w.z)*Math.min(1,dt*3); w.vz=0;
    if(w.balloon<=0){ w.balloon=0; sfx('pop'); balloonDown(false); }
  } else if(w.z>0||w.vz>0){
    if(w.st!=='air'){ w.st='air'; }
    w.vz-=GRAV*dt; w.z+=w.vz*dt;
    if(w.z<=0){ w.z=0; w.vz=0; landWolf(); }
  }
  // road wave toss
  if(w.z<=0&&w.balloon<=0&&(w.st==='run'||w.st==='defy')){
    var lift=roadLiftAt(w.y), onRoad=Math.abs(w.x-roadX(w.y))<roadHWh(w.y)+6;
    if(onRoad&&lift>9&&waveCrestNear(w.y,22)){ var side=(w.x>=roadX(w.y))?1:-1;
      w.st='air'; w.vz=210+lift*9; w.vx+=side*150; sfx('toss'); gag('WHOA!',w.x,w.y+50,'#ffe8a8'); w.pounceT=0; }
  }
  // ground state
  if(w.z<=0&&w.balloon<=0&&w.st!=='air'){
    var g=groundAt(w.x,w.y);
    if(g==='A'){ if(w.st!=='defy')beginDefy(); }
    else if(w.st==='defy'){ endDefy(); }
  }
  if(w.st==='defy')updDefy(dt,fwd);
  if(w.st==='notice'||w.st==='fall')return;
  // last safe spot
  w.safeT-=dt;
  if(w.safeT<=0&&w.z<=0&&w.st==='run'&&groundAt(w.x,w.y)==='G'&&groundAt(roadX(w.y),w.y)==='G'&&!nearTrack(w.y,80)&&segAt(w.y).type!=='chasm'){ w.lastSafe={x:roadX(w.y),y:w.y}; w.safeT=0.4; }
  // buttons
  if(phase==='run'||phase==='intro'||phase==='ready'){
    if(pressed('c'))swapGadget();
    if(pressed('b')){ if(w.st==='defy')believeTap(); else startPounce(); }
    if(pressed('a')){ if(inv.length)useGadget(); else if(w.st==='defy')believeTap(); else startPounce(); }
  }
  wolfCollisions(dt);
}
function startPounce(){
  var w=wolf; w.pulse=0.25;
  if(w.pounceCD>0||w.st!=='run'||w.stuck>0||w.ouch>0)return;
  var ix=inp.sx, fy=-inp.sy, m=Math.sqrt(ix*ix+fy*fy);
  if(m<0.3){ ix=0; fy=1; m=1; } if(fy<-0.2)fy=0.2;
  w.pdx=ix/m; w.pdy=fy/m; w.pounceT=POUNCE_T; w.pounceCD=POUNCE_CD; sfx('pounce');
  if(w.disguise>0){ w.disguise=0; gag('SURPRISE!',w.x,w.y+50,'#b6ff8a'); }
}
function beginDefy(){ var w=wolf; w.st='defy'; w.defyT=0; w.pebT=rr(0.5,1.0); w.believeN=0; showHint('defy','OVER THIN AIR! KEEP RUNNING. TAP BELIEVE TO SHUT THE EYE'); }
function endDefy(){ var w=wolf; w.st='run';
  if(w.defyT>0.35){ runStats.defies++; addBelief(GAIN_DEFY+w.defyT*4); addScore(100+Math.round(w.defyT*300),w.x,w.y+40,'DEFIED ','#9ff0ff'); sfx('defyOk'); }
  w.aware=0; }
/*<SLICE belief>*/
function updDefy(dt,fwd){
  var w=wolf; w.defyT+=dt;
  var rate=0;
  if(w.skates>0){ rate=0; addBelief(-4*dt); }
  else {
    var moving=w.vy>70;
    if(belief>0){ addBelief(-BELIEF_AIR_DRAIN*dt*(moving?1:2)); rate=AWARE_BELIEVING; }
    else rate=AWARE_DOUBTING;
    if(!moving)rate+=AWARE_STOPPED;
    if(fwd<-0.3)rate+=AWARE_LOOKDOWN*(-fwd);
  }
  w.aware=clamp(w.aware+rate*dt,0,1.2);
  w.pebT-=dt;
  if(w.pebT<=0&&w.skates<=0){ w.pebT=rr(0.9,1.6); w.aware+=PEBBLE_AWARE; pebbles.push({x:w.x+rr(-14,14),y:w.y-4,z:0,t:0}); sfx('pebble'); }
  if(w.aware>=1)wolfNotices();
}
function believeTap(){
  var w=wolf;
  if(belief>=BELIEVE_COST){ addBelief(-BELIEVE_COST); w.aware=Math.max(0,w.aware-BELIEVE_SHUT); w.believeN++; sfx('believe',w.believeN);
    fx.push({k:'believe',x:w.x,y:w.y,t:0}); w.pulse=0.2; }
  else { sfx('believeNo'); gag('NO BELIEF LEFT',w.x,w.y+70,'#ff9b8a'); }
}
/*</SLICE belief>*/
function wolfNotices(){
  var w=wolf; w.st='notice'; w.t=0; w.aware=1; w.vx=0; w.vy=0; phase='dying'; phaseT=0; w.deathKind='fall';
  sfx('gulp'); syncMusic(); w.skates=0; w.vacuum=0;
}
function landWolf(){
  var w=wolf; var g=groundAt(w.x,w.y);
  if(w.dizzy>0.5)sfx('stomp'); else sfx('land');
  burstW(w.x,w.y,'#e9c89a',8,90);
  if(g==='A'){ w.st='defy'; w.defyT=0; w.pebT=0.5; if(w.aware<0.1)w.aware=0.1; beginDefyQuiet(); }
  else w.st='run';
  for(var i=0;i<traps.length;i++){ var tp=traps[i]; if(tp.k==='spring'&&!tp.used&&dist(tp.x,tp.y,w.x,w.y)<24&&w.st==='run'){ springWolf(tp); return; } }
}
function beginDefyQuiet(){ showHint('defy','OVER THIN AIR! KEEP RUNNING. TAP BELIEVE TO SHUT THE EYE'); }
function balloonDown(popped){
  var w=wolf; w.vz=0;
  if(groundAt(w.x,w.y)==='A'){ w.z=Math.max(w.z,1); w.st='air'; if(popped){ w.aware=1; } else w.aware=0.45; }
  else { w.st='air'; }
}
function wolfCollisions(dt){
  var w=wolf, i;
  if(w.z<22&&w.ouch<=0&&w.invul<=0.5){
    for(i=0;i<LV.props.length;i++){ var p=LV.props[i]; if(!p.solid)continue; if(Math.abs(p.y-w.y)>40)continue;
      var d=dist(p.x,p.y,w.x,w.y), rr2=p.r*p.sz+11;
      if(d<rr2){
        if(w.balloon>0){ popBalloon('cactus'); break; }
        w.ouch=w.skates>0?1.0:0.55; w.needles=2.4; w.vy=-120; w.vx=(w.x-p.x)/(d||1)*120; w.skates=0; w.pounceT=0;
        addBelief(-LOSS_OUCH); sfx('ouch'); gag('OUCH!',w.x,w.y+60,'#ffd3a8'); doFeel('hit'); burstW(w.x,w.y+20,'#6fae4a',6,80); break; }
    }
  }
  if(w.balloon>0&&w.z>10){ for(i=0;i<LV.props.length;i++){ var p2=LV.props[i]; if(p2.kind!=='saguaro')continue; if(dist(p2.x,p2.y,w.x,w.y)<p2.r+10){ popBalloon('cactus'); break; } } }
  for(i=LV.crates.length-1;i>=0;i--){ var c=LV.crates[i]; if(c.z>20)continue;
    if(dist(c.x,c.y,w.x,w.y)<28&&w.z<30){ LV.crates.splice(i,1); pickCrate(c); } }
  for(i=feathers.length-1;i>=0;i--){ var f=feathers[i]; if(f.z>30)continue;
    if(dist(f.x,f.y,w.x,w.y)<26){ feathers.splice(i,1); collectFeather(f); } }
  if(w.vacuum<=0&&w.pounceT<=0){ var dS=dist(strut.x,strut.y,w.x,w.y); if(dS<26&&Math.abs(strut.z-w.z)<30)touchStrut(false); }
  if(w.pounceT>0){ var dP=dist(strut.x,strut.y,w.x,w.y+8); if(dP<34&&Math.abs(strut.z-w.z)<34)touchStrut(true); }
}
function popBalloon(why){ var w=wolf; if(w.balloon<=0)return; w.balloon=0; sfx('pop'); gag('POP!',w.x,w.y+80,'#ffb0b0'); burstW(w.x,w.y+w.z+50,'#ff4b4b',10,120); balloonDown(true); }
function skatesBackfire(){ var w=wolf; sfx('boom'); doFeel('big'); w.sootT=1.6; w.ouch=0.8; addBelief(-10); gag('KA-BLAM!',w.x,w.y+60,'#ffcf6a',true); burstW(w.x,w.y,'#444',14,140); }
function updTow(dt){
  var w=wolf, p=strut, tw=w.tow; tw.t+=dt;
  if(pressed('b')||pressed('a')){ tw.len=Math.max(0,tw.len-10); sfx('reel'); w.pulse=0.15; }
  tw.swing=Math.sin(tw.t*3.1)*0.6;
  var ax=Math.sin(tw.swing), ay=-Math.cos(tw.swing);
  w.x=p.x+ax*tw.len; w.y=p.y+ay*tw.len; w.z=Math.max(0,p.z-6);
  w.view='front'; w.x=clamp(w.x,16,W-16);
  if(Math.floor(tw.t*12)!==Math.floor((tw.t-dt)*12))burstW(w.x,w.y,'#e0bf8c',2,50);
  if(tw.len<34){ captureStrut('lasso'); return; }
  for(var i=0;i<LV.props.length;i++){ var pr=LV.props[i]; if(!pr.solid||Math.abs(pr.y-w.y)>30)continue;
    if(dist(pr.x,pr.y,w.x,w.y)<pr.r+12){ endTow('cactus'); return; } }
  if(tw.t>4.8)endTow('snap');
}
function endTow(why){
  var w=wolf; w.tow=null; w.st='run'; w.vy=-40; w.vx=0; w.z=0;
  if(why==='cactus'){ w.ouch=0.8; w.needles=2.4; sfx('ouch'); gag('THWACK!',w.x,w.y+60,'#ffd3a8',true); doFeel('hit'); addBelief(-LOSS_OUCH); }
  else { sfx('whiff'); gag('SNAP!',w.x,w.y+60,'#ffe0a0'); w.dizzy=0.8; }
  if(strut.st==='lassoed'){ strut.st='run'; strut.spd=STRUT_BURST; }
  if(groundAt(w.x,w.y)==='A'){ w.z=2; w.st='air'; w.aware=0.3; }
}

/* ---- deaths: the gags ---- */
function killWolf(kind,why){
  var w=wolf;
  if(w.invul>0||phase!=='run'&&phase!=='escape')return false;
  if(w.st==='notice'||w.st==='fall'||w.st==='flat'||w.st==='soot'||w.st==='accordion'||w.st==='gone')return false;
  if(w.tow){ w.tow=null; if(strut.st==='lassoed'){ strut.st='run'; strut.spd=STRUT_BURST; } }
  w.st=kind; w.t=0; w.deathKind=kind; w.skates=0; w.vacuum=0; w.balloon=0; w.disguise=0; w.vx=0; w.vy=0; w.vz=0; w.pounceT=0; w.why=why||'';
  phase='dying'; phaseT=0;
  if(kind==='flat'){ sfx('splat'); doFeel('big'); gag(why==='train'?'CHOO CHOO!':(why==='boulder'?'CRUNCH!':'SPLAT!'),w.x,w.y+70,'#ffe0c0',true); }
  else if(kind==='soot'){ doFeel('boom'); gag('KA-BOOM!',w.x,w.y+80,'#ffcf6a',true); }
  else if(kind==='accordion'){ sfx('clang'); doFeel('big'); gag('CLANG!',w.x,w.y+90,'#d8e4ff',true); setTimeout(function(){ sfx('accordion'); },260); }
  return true;
}
function updWolfDeath(dt){
  var w=wolf; w.t+=dt;
  if(w.st==='notice'){
    if(w.t>0.35&&w.t-dt<=0.35)sfx('notice');
    if(w.t>1.05){ w.st='fall'; w.t=0; sfx('fall'); }
  } else if(w.st==='fall'){
    if(w.t>1.25){ w.st='gone'; sfx('thud'); }
  } else if(w.st==='flat'){ if(w.t>1.6)w.st='gone'; }
  else if(w.st==='soot'){ if(w.t>1.8)w.st='gone'; }
  else if(w.st==='accordion'){ if(w.t>1.7)w.st='gone'; }
}
function afterDeath(){
  if(!infiniteLives)lives--;
  if(lives<=0){ gameOver(); return; }
  respawn();
}
function respawn(){
  var w=wolf, ls=w.lastSafe;
  var nw=newWolf(ls.x,ls.y); nw.lastSafe={x:ls.x,y:ls.y}; nw.invul=2.2; wolf=nw;
  belief=Math.max(BELIEF_MIN_RESPAWN,Math.round(belief*0.7));
  cam.y=wolf.y-(H-600);
  var py=Math.max(strut.y,wolf.y+300);
  if(strut.st==='captured'||strut.st==='launched')strut.st='run';

      if(p.st==='taunt'&&p.t>0.2&&p.t-dt<=0.2)sfx('honk');

function holdToGround(p,dt){ var g=groundAt(p.x,p.y); if(g==='W'){ p.x+=(roadX(p.y)-p.x)*Math.min(1,dt*6); } }
function strutRun(dt,ahead){
  var p=strut, w=wolf, cm=stageMult();

  p.spd+=clamp(tgt-p.spd,-620*dt,520*dt);
  var k=roadK(p.y);
  p.y+=p.spd/k*dt;
  // lateral plan: weave, dodge trucks, go around the wolf, avoid traps
  var latT=Math.sin(p.anim*1.7)*9;
  var i;
  for(i=0;i<trucks.length;i++){ var t=trucks[i]; if(t.dead)continue; var dy=t.y-p.y;
    if(dy>-60&&dy<240&&Math.abs(t.x-p.x)<70){ latT=(t.lane<0)?54:-54; if(t.lane<0&&p.lat<0)latT=58; } }
  if(ahead<-20&&ahead>-160&&Math.abs(w.x-p.x)<60){ latT=(p.x>=w.x)?60:-60; }
  for(i=0;i<traps.length;i++){ var tp=traps[i]; if(tp.used)continue; if(tp.k!=='tar'&&tp.k!=='spring'&&tp.k!=='dyn')continue;
    var d2=tp.y-p.y; if(d2>0&&d2<90&&Math.abs(tp.x-p.x)<40){
      if(p.seen.indexOf(tp.id)<0){ p.seen.push(tp.id); tp.avoid=(tp.k==='dyn')?(rnd()<0.8):(rnd()<cunning()); }

  p.lat+=clamp(latT-p.lat,-160*dt,160*dt);
  p.x+=(roadX(p.y)+p.lat*k-p.x)*Math.min(1,dt*9);
  p.view=(Math.abs(p.lat-latT)>20&&p.spd>60)?'side':'back'; p.face=(latT>p.lat)?1:-1;
  p.fan=Math.max(0,p.fan-dt*3);

  var sl=Math.abs(roadSlope(p.y)), cv=Math.abs(roadSlope(p.y+40)-roadSlope(p.y-40));

  // seeds
  if(p.y>LV.finishY+200){ p.y=LV.finishY+200; p.spd=0; if(p.tauntCD<=0){ p.st='taunt'; p.t=0; p.tauntCD=rr(2,3.5); return; } }
  if(!(p.wary>0)&&(ahead>170&&w.disguise<=0||w.disguise>0)){
    for(i=0;i<LV.seeds.length;i++){ var sd=LV.seeds[i]; if(sd.n<=0)continue; var ds=sd.y-p.y;
      if(ds>-6&&ds<24&&Math.abs(sd.x-p.x)<30){ if(rnd()<0.85){ p.st='peck'; p.t=0; p.peckT=rr(1.1,1.9); sd.n--; p.spd=0; } else sd.n=0; break; } }
  }
  // mirror lure
  for(i=0;i<traps.length;i++){ var m=traps[i]; if(m.k!=='mirror'||m.used)continue;
    if(p.mirrorsIgnored.indexOf(m.id)>=0)continue;

}

/* THROW AIM: the stick sets the range (forward long, back short, sideways
   leads); a STRUT standing still inside the band is locked on, with a
   small honest miss. The stunt wolf can hit a parked bird; nobody can hit
   a bird at full tilt, which is the chase's whole joke. */
function throwAim(R,flight){
  var w=wolf, p=strut, fwd=-inp.sy, ix=inp.sx;
  var still=(p.st==='peck'||p.st==='taunt'||p.st==='lookdown'||p.st==='stuck'||p.st==='admire'||p.st==='dazed'||p.st==='display'||p.st==='wait');
  var dy=p.y-w.y;
  if(still&&dy>R[0]&&dy<R[2]&&Math.abs(p.x-w.x)<160){ return {x:p.x+rr(-AIM_ERR,AIM_ERR),y:p.y+rr(-AIM_ERR,AIM_ERR),lock:true}; }
  var d=R[1]+(fwd>0?(R[2]-R[1])*fwd:(R[1]-R[0])*fwd);
  return {x:clamp(w.x+ix*110+w.vx*flight*0.5,20,W-20),y:w.y+d+w.vy*flight*0.35,lock:false};
}

function updTraps(dt){

var GRID='ABCDEFGHIJKLMNOPQRSTUVWXYZ<>';

var SCORE_KEY='nld:scores:v1', scoresCache=null;
var DEFAULT_SCORES=[{i:'WLF',s:40000},{i:'STR',s:32000},{i:'SNL',s:25000},{i:'DUK',s:18000},{i:'ACE',s:12000},{i:'DOC',s:9000},{i:'ZIP',s:6000},{i:'HOP',s:4000},{i:'KID',s:2500},{i:'NEW',s:1000}];

  if(scoresCache)return scoresCache;
  var a=null; try{ if(typeof localStorage!=='undefined'){ var raw=localStorage.getItem(SCORE_KEY); if(raw)a=JSON.parse(raw); } }catch(e){ a=null; }
  if(!Array.isArray(a)||!a.length)a=DEFAULT_SCORES.map(function(r){ return {i:r.i,s:r.s}; });
  scoresCache=a; return a;
}
function qualifies(s){ var t=loadScores(); return s>0&&(t.length<10||s>t[t.length-1].s); }
function submitScore(ini,s){
  var t=loadScores().slice(), rank=t.length;
  for(var i=0;i<t.length;i++){ if(s>t[i].s){ rank=i; break; } }
  t.splice(rank,0,{i:String(ini).slice(0,3).toUpperCase(),s:Math.floor(s)}); t=t.slice(0,10);
  scoresCache=t; try{ if(typeof localStorage!=='undefined')localStorage.setItem(SCORE_KEY,JSON.stringify(t)); }catch(e){}
  return rank<10?rank:-1;
}

/* ---- 21. THE BOT (attract demo, and the gates' completion driver) ---- */
function botThink(dt){
  var w=wolf, p=strut, o=botInp; o.a=false; o.b=false; o.c=false; bot.t+=dt; bot.cd-=dt;
  if(!w||!p)return;
  demoT+=dt;
  var lookY=w.y+140, tx=roadX(lookY), ahead=p.y-w.y, i;
  var vul=strutVulnerable()||p.st==='vacuumed';
  if(vul)tx=p.x; else if(ahead<260&&ahead>-40)tx=lerp(tx,p.x,0.45);
  if(!vul&&inv.length<3){ for(i=0;i<LV.crates.length;i++){ var cr=LV.crates[i], cdy=cr.y-w.y; if(cdy>20&&cdy<260&&Math.abs(cr.x-w.x)<150){ tx=cr.x; break; } } }
  for(i=0;i<trucks.length;i++){ var t=trucks[i]; if(t.dead)continue; var dy=t.y-w.y;
    var closing=(t.dir<0)?(dy>-40&&dy<380):(dy<60&&dy>-300);
    if(closing&&Math.abs(t.x-tx)<74){ tx=t.x+((w.x<t.x)?-86:86); } }
  for(i=0;i<boulders.length;i++){ var b=boulders[i]; var by=b.y-w.y; if(by>-20&&by<340&&Math.abs(b.x-tx)<b.r+34)tx=b.x+((w.x<b.x)?-(b.r+44):(b.r+44)); }
  var stop=false;
  for(i=0;i<traps.length;i++){ var tp=traps[i]; if(tp.k==='dyn'){ var ddy=tp.y-w.y; if(ddy>-30&&ddy<170&&Math.abs(tp.x-w.x)<90)stop=true; } }
  for(i=0;i<thrown.length;i++){ if(thrown[i].k==='anvil'&&dist(thrown[i].tx,thrown[i].ty,w.x+w.vx*0.4,w.y+w.vy*0.4)<60)tx=thrown[i].tx+((w.x<thrown[i].tx)?-80:80); }
  for(i=0;i<trains.length;i++){ var tr=trains[i]; var td=tr.ty-w.y; if(tr.st!=='idle'&&td>-10&&td<150)stop=true; }
  for(i=0;i<LV.props.length;i++){ var pr=LV.props[i]; if(!pr.solid)continue; var pdy=pr.y-w.y; if(pdy>0&&pdy<80&&Math.abs(pr.x-(w.x+(tx-w.x)*0.3))<pr.r+16){ tx=pr.x+((w.x<pr.x)?-(pr.r+26):(pr.r+26)); } }
  if(!solidAt(tx,lookY)&&!solidAt(tx,w.y+40))tx=roadX(lookY);
  tx=clamp(tx,24,W-24);
  o.sx=clamp((tx-w.x)/46,-1,1);
  o.sy=stop?1:(ahead>210?-1:(vul?-1:-0.35));
  if(w.st==='defy'){ o.sy=-1; o.sx=clamp((roadX(w.y+90)-w.x)/60,-1,1); if(w.aware>0.28&&Math.floor(bot.t*9)%2===0)o.b=true; }
  if(w.st==='tow'&&Math.floor(bot.t*10)%2===0)o.b=true;
  if(vul&&dist(p.x,p.y,w.x,w.y)<95&&Math.floor(bot.t*6)%2===0)o.b=true;
  if(p.st==='peck'&&dist(p.x,p.y,w.x,w.y)<90&&Math.floor(bot.t*6)%2===0)o.b=true;
  if(inv.length&&bot.cd<=0&&p.st!=='captured'&&(w.st==='run'||w.st==='defy')){
    var g=inv[invSel].g, d=dist(p.x,p.y,w.x,w.y), dx=Math.abs(p.x-w.x), use=false;
    var still=(p.st==='peck'||p.st==='taunt'||p.st==='lookdown'||p.st==='stuck'||p.st==='admire');
    if(g==='dynamite')use=still&&ahead>70&&ahead<240;
    else if(g==='anvil')use=still&&ahead>130&&ahead<330;
    else if(g==='lasso')use=ahead>40&&ahead<200&&dx<45;
    else if(g==='vacuum')use=ahead>40&&ahead<300&&dx<60;
    else if(g==='mirror'||g==='peahen')use=d<380&&!vul;
    else if(g==='tar')use=p.st==='lap'||(ahead<0&&ahead>-120);
    else if(g==='disguise')use=ahead>150&&ahead<420;
    else if(g==='skates')use=ahead>260&&segAt(w.y+400).type!=='gulch';
    else if(g==='spring')use=segAt(w.y+170).type==='chasm'&&w.st==='run';
    else if(g==='balloon')use=segAt(w.y+120).type==='chasm'&&belief<25;
    if(use){ o.a=true; bot.cd=0.9; }
    else if(bot.t>bot.swapAt){ o.c=true; bot.swapAt=bot.t+rr(2.5,4); }
  }
  if(bot.swapAt==null)bot.swapAt=2;
}

/* ---- 22. FOLD SURVIVAL (the GRID GRUDGE v47 shape, via the seed). ---- */
var SAVE_KEY='nld-resume';

function saveState(){
  if(STATE!=='play'||demo)return false;

         belief:belief,inv:inv,invSel:invSel,x:wolf.x,y:wolf.y,sx:wolf.lastSafe.x,sy:wolf.lastSafe.y,py:strut.y,hints:hintsShown}));

}

  if(typeof localStorage==='undefined')return false;

    var raw=localStorage.getItem(SAVE_KEY); if(!raw)return false;
    var s=JSON.parse(raw); if(!s||s.v!==1||s.st!=='play')return false;

}

  switch(STATE){
    case 'title': updateTitle(dt); break;
    case 'play': updatePlay(dt); if(demo&&STATE==='play'&&demoT>30)endDemo(); break;
    case 'gameover': updateGameOver(dt); break;
    case 'entry': updateEntry(dt); break;
  }

/* ---- 24. FRAME PACING: the catch-up defenses (BACKGROUND-CATCHUP-MEMO,
        seed verbatim). Ceiling 200ms drops a background backlog and
        resyncs (face 1); STEP_CAP hard-limits ticks per frame (face 3). ---- */
var STEP_CAP=5;
var STEP_MS=16.6667;
function frameStep(prevLast,now){
  var acc=now-prevLast;
  if(acc>200)return {steps:1,last:now,resync:true};   // drop the backlog, never sprint
  var steps=Math.floor(acc/STEP_MS);
  if(steps>STEP_CAP)steps=STEP_CAP;
  return {steps:steps,last:prevLast+steps*STEP_MS,resync:false};
}
var tick={last:0}; var lastSaveAt=0;
function frameTick(){
  try{
    var now=performance.now();
    if(!tick.last)tick.last=now;
    var fs=frameStep(tick.last,now);
    tick.last=fs.last;
    for(var i=0;i<fs.steps;i++)update(1/60);
    render();
    if(now-lastSaveAt>5000){ saveState(); lastSaveAt=now; }
  }catch(e){ reportErr('frameTick',e); try{ render(); }catch(e2){} }
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(frameTick);
}

    else { if(hiddenAt&&now-hiddenAt>1000){ tick.last=now; } hiddenAt=0; musicWant=null; syncMusic(true); }
  });
}

}
