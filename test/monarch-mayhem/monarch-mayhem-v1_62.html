   HITSTOP freeze frames, particle BURSTS, and rising score POPS. Pure feel:
   nothing here changes outcomes, only how impacts read. Version lives here AND

   3. After the world, before the HUD:       FEEL.postWorld(ctx);   // particles + pops, then un-shake

  parts:[], pops:[],

function flash(t, col){ S.flashT = Math.max(S.flashT, t||0.3); if(col)S.flashCol = col; }

function burst(x, y, col, n, spd){

    if(S.parts.length >= S.MAX_PARTS) S.parts.shift();
    var a = S._rnd()*6.28318, v = spd*(0.35+S._rnd()*0.65);

      ctx.globalAlpha = 1;

      ctx.globalAlpha = 1;
    }

    ctx.globalAlpha = Math.min(0.8, S.flashT*2.5);  // the shipped alpha curve
    ctx.fillStyle = S.flashCol;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }

       b.proj.push({x,y, vx:(+/-)(0.7..1.2), vy:-2.6, g:0.09, t:2.6, kind:'ember'})
       advanced by  pr.t-=DT; pr.x+=pr.vx; pr.y+=pr.vy; pr.vy+=g
       drawn as     R(x-2,y-2,4,4,'#ff7a2a'); R(x-1,y-1,2,2,'#ffd23f'); + faint trail
     This recipe turns that one particle into a SUSTAINED emitter: embers drift
     UP off a source and fade (ambient burn), instead of arcing once. Returns a
     handle {move, stop}. The emitter registers into FEEL._emitters; drain it
     each frame with FEEL.tickEmbers(dt). Spawns respect FEEL.MAX_PARTS: when the
     pool is full the emitter DROPS, it never grows the pool past the cap.
  --------------------------------------------------------------------------- */
  FEEL.embers = function(x, y, w, rate, col){
    var em = { x:x, y:y, w:(w||8), rate:(rate||16), col:(col||'#ff7a2a'), acc:0, live:true };
    FEEL._emitters = FEEL._emitters || [];
    FEEL._emitters.push(em);
    return {
      move: function(nx, ny){ em.x = nx; if(ny != null) em.y = ny; },   // follow a moving source (a foe on fire)
      stop: function(){ em.live = false; }                              // no more spawns; live particles finish on their own
    };
  };
  // Drain all live ember emitters into the shared pool. Call once per frame from
  // the FEEL update, after the pack ages the pool. dt in seconds.
  FEEL.tickEmbers = function(dt){
    var E = FEEL._emitters; if(!E) return;
    for(var i = E.length - 1; i >= 0; i--){
      var em = E[i];
      if(em.live){
        em.acc += em.rate * dt;
        while(em.acc >= 1){
          em.acc -= 1;
          if(FEEL.parts.length < FEEL.MAX_PARTS){                       // honour the cap: drop when full, never overflow
            FEEL.parts.push({
              x: em.x + (Math.random() - 0.5) * em.w,
              y: em.y,
              vx: (Math.random() - 0.5) * 0.5,
              vy: -0.55 - Math.random() * 0.7,                          // buoyant: embers rise
              g: -0.004,                                                // a touch of lift, then they slow and fade
              t: 0.7 + Math.random() * 0.6,
              t0: 1.3,
              col: em.col,
              kind: 'ember'
            });
          }
        }
      }
      if(!em.live) E.splice(i, 1);                                      // a stopped emitter frees itself: no leak
    }
  };
  // RENDER-only (headless-inert). Draw ember parts, fading toward WHITE as they die.
  FEEL.drawEmbers = function(ctx){
    var P = FEEL.parts;
    for(var i = 0; i < P.length; i++){
      var p = P[i]; if(p.kind !== 'ember') continue;
      var life = Math.max(0, Math.min(1, p.t / (p.t0 || 1.3)));         // 1 fresh -> 0 dead
      // die toward white: the older it gets the whiter, never brighter-colored
      var col = life > 0.5 ? p.col : (life > 0.2 ? '#ffd23f' : '#fff3e0');
      ctx.fillStyle = col; ctx.fillRect((p.x - 1) | 0, (p.y - 1) | 0, 3, 3);
      if(life > 0.6){ ctx.fillStyle = '#ffd23f'; ctx.fillRect(p.x | 0, p.y | 0, 1, 1); }
    }
  };

  /* ---------------------------------------------------------------------------
     RECIPE 2  FEEL.flamePillar(ctx, x, yTop, yBot, t)  -- the BROIL pillar read
     Source: PATTY PANIC drawSala, the preheat and broil phases.
       telegraph (preheat): faint orange column, alpha ramps 0.12 + 0.30*heat
                            R(px-4,0,8,H,'#ff9a3a'); R(px-1,0,2,H,'#ffd8a0')
       lethal (broil):      layered flat columns
                            R(px-5,0,10,H,'#ff5a1e'); R(px-3,0,6,H,'#ff9a3a'); R(px-1,0,2,H,'#fff3b0')
                            + drifting #ffd23f flecks
     RENDER-only. t is the phase in [0,1]:
       t < 0.5  -> TELEGRAPH (the transferable part): a faint, growing warning
                   column. This is the read that makes the lethal moment fair.
       t >= 0.5 -> LETHAL: the full bright pillar with drifting flecks.
     The pack should document that the TELEGRAPH is the reusable idea; the lethal
     fill is title art. x is the column centre; yTop..yBot is the pillar span.
  --------------------------------------------------------------------------- */
  FEEL.flamePillar = function(ctx, x, yTop, yBot, t){
    var h = yBot - yTop;
    if(t < 0.5){                                                        // TELEGRAPH
      var heat = t / 0.5;                                               // 0 -> 1 across the warning window
      var a = 0.12 + 0.30 * heat;
      ctx.globalAlpha = Math.max(0, Math.min(0.55, a));
      ctx.fillStyle = '#ff9a3a'; ctx.fillRect((x - 4) | 0, yTop | 0, 8, h);
      ctx.fillStyle = '#ffd8a0'; ctx.fillRect((x - 1) | 0, yTop | 0, 2, h);
      ctx.globalAlpha = 1;
    } else {                                                            // LETHAL
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = '#ff5a1e'; ctx.fillRect((x - 5) | 0, yTop | 0, 10, h);
      ctx.fillStyle = '#ff9a3a'; ctx.fillRect((x - 3) | 0, yTop | 0, 6, h);
      ctx.fillStyle = '#fff3b0'; ctx.fillRect((x - 1) | 0, yTop | 0, 2, h);
      var f = (Date.now() * 0.02) % Math.max(20, h - 8);               // drifting flecks (pack may pass its own frame)
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect((x - 6) | 0, (yTop + f) | 0, 2, 7);
      ctx.fillRect((x + 4) | 0, (yTop + ((f + h * 0.5) % Math.max(20, h - 8))) | 0, 2, 7);
      ctx.globalAlpha = 1;
    }
  };

  /* ---------------------------------------------------------------------------
     RECIPE 3  FEEL.smokeRings(ctx, x, y, n, t)  -- the death smoke sweep
     Source: PATTY PANIC drawSala death sweep and drawDough puff.
       three rising bars, alpha eased out:  ctx.globalAlpha = 0.5 - t*0.2;
       R(cx-6-s*2, y-10-s*10 - t*14, 12+s*4, 3, '#b9c0d4')
     RENDER-only. n rings rise and widen from (x,y), fading toward white as t
     grows (t is seconds since the death, roughly 0..2). Reads as heat leaving.
  --------------------------------------------------------------------------- */
  FEEL.smokeRings = function(ctx, x, y, n, t){
    n = n || 3; t = t || 0;
    for(var s = 0; s < n; s++){
      var ry = y - 10 - s * 10 - t * 14;
      if(ry <= 0) continue;
      ctx.globalAlpha = Math.max(0, 0.5 - t * 0.2);
      var col = t < 1.2 ? '#b9c0d4' : '#e8ecf6';                        // greys toward white as it thins
      ctx.fillStyle = col;
      ctx.fillRect((x - 6 - s * 2) | 0, ry | 0, 12 + s * 4, 3);
    }
    ctx.globalAlpha = 1;
  };

  /* ---------------------------------------------------------------------------
     RECIPE 4 (optional)  FEEL.burstFlame()  -- the shelved burst-in flame
     Source: PATTY PANIC art lab shelved artifact card (thermostat flame,
       v119..v126, shelved at v127; codex design log v127 THERMOSTAT REVERTED,
       FLAME SHELVED). The art-lab file was not in this workspace, so this is
       RECONSTRUCTED from the documented v126 behavior (hidden until triggered;
       on trigger the flame snaps out PAST its steady size ~1.7x, then eases
       back to 1.0) using the shipped flame palette above. Honest provenance:
       the SIZE CURVE and behavior are faithful to the card; the exact pixel
       fills are the pack's to match against the card if it resurfaces.
     RENDER-only. Returns a handle {trigger, draw, done}. draw(ctx,x,y) scales a
     rounded flame blob by the current curve; hidden (scale 0) until triggered.
  --------------------------------------------------------------------------- */
  FEEL.burstFlame = function(steady){
    steady = steady || 7;                                              // steady radius in px
    var st = { scale: 0, phase: 'hidden', tt: 0 };                     // hidden -> burst -> settle -> steady
    var OVER = 1.7, BURST_T = 0.09, SETTLE_T = 0.22;
    return {
      trigger: function(){ st.phase = 'burst'; st.tt = 0; },
      done: function(){ st.phase = 'hidden'; st.scale = 0; },
      update: function(dt){
        if(st.phase === 'burst'){ st.tt += dt; var k = Math.min(1, st.tt / BURST_T);
          st.scale = OVER * k;                                         // snaps OUT to 1.7x fast
          if(k >= 1){ st.phase = 'settle'; st.tt = 0; } }
        else if(st.phase === 'settle'){ st.tt += dt; var e = Math.min(1, st.tt / SETTLE_T);
          st.scale = OVER + (1 - OVER) * (e * (2 - e));                // ease back to 1.0 (ease-out)
          if(e >= 1){ st.phase = 'steady'; st.scale = 1; } }
      },
      scale: function(){ return st.scale; },
      draw: function(ctx, x, y){
        if(st.phase === 'hidden' || st.scale <= 0) return;            // invisible until triggered
        var r = steady * st.scale;
        // rounded engulfing flame: flat stacked ovals, core to white (neon rule)
        ctx.fillStyle = '#ff5a1e'; ctx.fillRect((x - r) | 0, (y - r * 1.2) | 0, (r * 2) | 0, (r * 2.2) | 0);
        ctx.fillStyle = '#ff9a3a'; ctx.fillRect((x - r * 0.66) | 0, (y - r * 1.4) | 0, (r * 1.32) | 0, (r * 2.0) | 0);
        ctx.fillStyle = '#ffd23f'; ctx.fillRect((x - r * 0.33) | 0, (y - r * 1.5) | 0, (r * 0.66) | 0, (r * 1.7) | 0);
        ctx.fillStyle = '#fff3e0'; ctx.fillRect((x - 1) | 0, (y - r * 1.2) | 0, 2, (r * 1.1) | 0);
      }
    };
  };

  /* ---------------------------------------------------------------------------
     RECIPE 5 (exemplar)  FEEL.webHit(ctx, tgt, dir, api)  -- graded impact bundle
     Source: PATTY PANIC WEB CHEF web-hit, one shipped line of graded impact:
       f.stun = WEB_STUN(2.5); f.webbed = WEB_STUN; f.flash = 4;   // stun + wrap + hit flash
       f.x += dir * 2;                                             // 2px knockback
       shake = Math.max(shake, 4);                                 // 4-frame screen kick
       spark(f.x, feetY-8, 10, '#f4f6fb');                         // 10-particle splat
       sfx.webhit();
     This is the FEEL v1.1 exemplar the spec asked for: a COMPLETE graded impact
     assembled from pack primitives in one call, not five scattered effects. It
     is SIM-touching (it writes target state) but title-shaped, so it is offered
     as a documented exemplar rather than a core recipe. `api` supplies the pack
     hooks: api.shake(n), api.spark(x,y,n,col), api.sound('webhit'). Returns the
     status package to apply to the target, so the caller stays in control.
  --------------------------------------------------------------------------- */
  FEEL.webHit = function(ctx, tgt, dir, api){
    var STUN = 2.5, FLASH = 4, KNOCK = 2, SHAKE = 4, SPARKS = 10;
    if(tgt){ tgt.x += dir * KNOCK; }
    if(api){
      if(api.shake) api.shake(SHAKE);
      if(api.spark && tgt) api.spark(tgt.x, (tgt.y || 0) - 8, SPARKS, '#f4f6fb');
      if(api.sound) api.sound('webhit');
    }
    return { stun: STUN, webbed: STUN, flash: FLASH };                 // caller applies these to the target
  };

})({ FEEL: FEEL });   /* merge adaptation: shim root binds the wrapper to the module instance */

/* ===========================================================================
   SIM GATE (spec point 4). Lift these assertions into feelpack-test. They cover
   ONLY the sim-touching halves: emitter handles stop cleanly, the pool stays
   capped, and there is no leak after stop. Render halves are the Director's gate.
   Runs standalone:  node feelpack-fire-contrib-v1.00.js
   =========================================================================== */
if(typeof module !== 'undefined' && require.main === module){
  var A = require('assert');
  var FEEL = globalThis.FEEL;
  var P = 0; function ok(c, m){ A.ok(c, m); P++; console.log('  ok ' + P + ': ' + m); }

  // helper: age the pool one step and cull dead parts (stands in for the pack's own update)
  function agePool(dt){ for(var i = FEEL.parts.length - 1; i >= 0; i--){ var p = FEEL.parts[i]; p.t -= dt; if(p.t <= 0) FEEL.parts.splice(i, 1); } }

  FEEL.parts.length = 0; FEEL._emitters = [];
  FEEL.MAX_PARTS = 40;                                   // small cap to exercise the drop path

  // 1) an emitter spawns into the pool
  var h = FEEL.embers(100, 100, 8, 60, '#ff7a2a');
  for(var f = 0; f < 5; f++){ FEEL.tickEmbers(1 / 60); }
  ok(FEEL.parts.length > 0, 'a running emitter spawns embers into the pool');
  ok(FEEL._emitters.length === 1, 'the emitter is registered while live');

  // 2) the pool never exceeds MAX_PARTS, even under a hot emitter (drop, do not overflow)
  var overflowed = false;
  for(var f2 = 0; f2 < 600; f2++){ FEEL.tickEmbers(1 / 60); if(FEEL.parts.length > FEEL.MAX_PARTS) overflowed = true; }
  ok(!overflowed, 'the pool stays capped at MAX_PARTS (spawns drop when full)');

  // 3) move() retargets without spawning outside the cap
  h.move(180, 90);
  FEEL.tickEmbers(1 / 60);
  ok(FEEL.parts.length <= FEEL.MAX_PARTS, 'move() retargets the source, pool still capped');

  // 4) stop() cleanly ends the emitter: it frees from _emitters and spawns nothing further
  h.stop();
  FEEL.tickEmbers(1 / 60);
  ok(FEEL._emitters.length === 0, 'stop() frees the emitter from the pool list (no emitter leak)');
  var countAfterStop = FEEL.parts.length;
  for(var f3 = 0; f3 < 10; f3++){ FEEL.tickEmbers(1 / 60); }
  ok(FEEL.parts.length <= countAfterStop, 'no new embers spawn after stop()');

  // 5) no particle leak: with aging, the pool drains fully to zero after stop
  for(var f4 = 0; f4 < 200; f4++){ FEEL.tickEmbers(1 / 60); agePool(1 / 60); }
  ok(FEEL.parts.length === 0, 'the pool drains to zero after stop (no particle leak)');

  // 6) many concurrent emitters all free on stop (no accumulation across sources)
  var hs = []; for(var e = 0; e < 12; e++) hs.push(FEEL.embers(10 * e, 50, 8, 20));
  FEEL.tickEmbers(1 / 60);
  ok(FEEL._emitters.length === 12, 'twelve concurrent emitters register');
  for(var e2 = 0; e2 < hs.length; e2++) hs[e2].stop();
  FEEL.tickEmbers(1 / 60);
  ok(FEEL._emitters.length === 0, 'all emitters free on stop (no accumulation)');

  // 7) render halves are headless-inert: they only touch ctx, never throw on a stub
  var stub = new Proxy({}, { get: function(){ return function(){}; }, set: function(){ return true; } });
  FEEL.parts.push({ x:1, y:1, vx:0, vy:0, g:0, t:1, t0:1.3, col:'#ff7a2a', kind:'ember' });
  FEEL.drawEmbers(stub); FEEL.flamePillar(stub, 10, 0, 40, 0.3); FEEL.flamePillar(stub, 10, 0, 40, 0.8);
  FEEL.smokeRings(stub, 10, 40, 3, 0.5);
  var bf = FEEL.burstFlame(7); bf.trigger(); bf.update(0.05); bf.draw(stub, 10, 10);
  FEEL.webHit(stub, { x:10, y:10 }, 1, { shake:function(){}, spark:function(){}, sound:function(){} });
  ok(true, 'render halves run headless-inert against a stub ctx (no throw)');

  console.log('feelpack-fire-contrib sim gate OK (' + P + ' checks)');
}

// OWN Escalation Law had said "T1 plain hit" since v1.00. The SQUIRE row contradicted the law
// printed directly above it, and nobody read the two together until the Director did.
function WOUNDED_LINE(cell){ return cell.line==='EMBER'&&cell.tier>=2; }

// ===================== THE ABILITY ENGINE (v1.44) =====================
// Every clause a defender has beyond a plain hit, as DATA rather than scattered ifs, so the
// design can be read straight off this table and compared to the doc.
//
// READ THIS BEFORE CHANGING A NUMBER. The ability doc's ladder says "BASE DAMAGE = tier
// (1/2/3/4)", and TIDE's own rows say Fork is "1 + 1" and Chain is "2 + 1 to two others".
// Those disagree: TIDE T2's base would be 2 and T3's would be 3. The reading built here, which
// the Director can overturn, is that THE LADDER IS THE DEFAULT AND AN ABILITY ROW OVERRIDES IT.
// So TIDE trades punch for spread, which is exactly what "the stormcaller" should mean:
//   EVOKER   1 + 1 = 2 across two foes, where MAN AT ARMS puts 2 (or 4) into one
//   ARCHMAGE 2 + 1 + 1 = 4 across three, where CHAMPION puts 3 (or 6) into one
// Flagged in the ladder doc as an interpretation, not a ruling.
var CLAUSES={
 EMBER:{ 4:{execute:2} },                                   // Judgement: left at 2 or less DIES
 TIDE:{  2:{primary:1,splash:1,arcs:1,adjacentOnly:true},   // Fork: one ADJACENT foe only
         3:{primary:2,splash:1,arcs:2,adjacentOnly:false},  // Chain: two others, adjacent FIRST
         4:{critAtCounter:2} },                             // Perfect Bolt: guaranteed crit
 // GRAVE, THE REAPER: "death feeds the reaper". Its whole line is an ECONOMY, not a bigger
 // stick, which is why it is the only unbuilt line today's engine can run: no status, just
 // damage, AP and placement.
 //   T1 Soul Nip   plain 1 (the ratified T1 law)
 //   T2 Harvest    2; on KILL +5 AP
 //   T3 Grim Tithe 3; if ADJACENT TO AN ALLY: 5, and drains 1 charge from that ally
 //   T4 Death Toll 4; on KILL gain a GRAVE T2 to place on any free tile
 // Grim Tithe's 5 is NOT a multiplier: the doc fixes it as a flat number, so it is stored as
 // one. Reading it as "base+2" would silently rebalance the line the next time DMG changes.
 GRAVE:{ 2:{onKillAP:5},
         3:{adjAlly:{dmg:5,drain:1}},
         4:{onKillUnit:{line:'GRAVE',tier:2}} }
};
function CLAUSE(cell){ return (CLAUSES[cell.line]||{})[cell.tier]||{}; }
// THE LABEL IS A FUNCTION, not a string assembled at the draw site. The sweep re-implemented
// this logic in order to measure it, and drifted from the panel within a single edit: it
// measured a label the game had already stopped drawing and reported a FALSE RED, which is as
// corrosive as a false green. A checker that copies the thing it checks is checking itself.
// The panel and the sweep both call THIS now.
// EMBER T4 is why these strings are terse: it carries four damage diamonds, so its label
// starts 28px in and has the least room of any defender while needing to say the most.
function CLAUSE_LABEL(cell){

 if(cl.execute!==undefined)return 'x2 WND, EXEC '+cl.execute;
 if(WOUNDED_LINE(cell))return 'x2 WOUNDED';
 if(cl.arcs)return '+'+cl.splash+' TO '+cl.arcs+(cl.adjacentOnly?' ADJ':'');
 if(cl.critAtCounter!==undefined)return 'x2 AT CLOCK '+cl.critAtCounter;
 if(cl.onKillAP)return 'KILL: +'+cl.onKillAP+' AP';
 if(cl.adjAlly)return 'ALLY: '+cl.adjAlly.dmg+', TITHE '+cl.adjAlly.drain;
 if(cl.onKillUnit)return 'KILL: GAIN '+LINES[cl.onKillUnit.line].key+cl.onKillUnit.tier;

}

// THE STRIKE PLAN. ONE function computes everything a strike does. forecast() SHOWS this and
// attack() APPLIES this, so the panel cannot lie about the strike: there is one calculation.
// This is the WOUNDED_LINE lesson generalised before the same bug can happen six more times.
// ONE definition of "beside an ally", used by the plan and therefore by both the forecast and
// the strike. A defender with charges left, orthogonally adjacent. The reaper cannot tithe a
// spent unit: there is nothing left to take.
function ADJACENT_ALLY(c,r){
 var s=MM.state;
 if(c===undefined||r===undefined)return null;
 var n=[[c-1,r],[c+1,r],[c,r-1],[c,r+1]];
 for(var i=0;i<n.length;i++){
  var nc=n[i][0],nr=n[i][1];
  if(nc<0||nc>=COLS||nr<0||nr>=ROWS)continue;
  var cl=s.grid[nr][nc];
  if(cl&&cl.type==='def'&&cl.actions>0)return {c:nc,r:nr,cell:cl};
 }
 return null;
}
function STRIKE_PLAN(cell,target,enemies,cc,cr){
 var cl=CLAUSE(cell);
 var base=(cl.primary!==undefined)?cl.primary:C.DMG[cell.tier];
 // GRIM TITHE: standing beside an ally turns 3 into a flat 5 and costs that ally a charge.
 // The condition is about the CASTER's neighbours, not the target, which makes it the first
 // clause whose trigger is off-board of the strike entirely.
 var tithe=null;
 if(cl.adjAlly){
  var ally=ADJACENT_ALLY(cc,cr);
  if(ally){ base=cl.adjAlly.dmg; tithe={c:ally.c,r:ally.r,drain:cl.adjAlly.drain}; }
 }
 var max=target.max||C.SKIRM_HP;
 var wounded=WOUNDED_LINE(cell)&&target.hp<=max/2;
 var crit=(cl.critAtCounter!==undefined)&&target.counter<=cl.critAtCounter;
 var dmg=base;
 if(wounded)dmg*=2;
 if(crit)dmg*=2;
 // EXECUTE resolves AFTER the multipliers: a foe LEFT at the threshold or less dies instead.
 var left=target.hp-dmg;
 var execute=(cl.execute!==undefined)&&left>0&&left<=cl.execute;
 // SPLASH. Fork takes ONE strictly adjacent foe; Chain takes two, nearest first. Foes live on
 // a single row, so adjacency is a column step.
 var splash=[];
 if(cl.arcs){
  var others=[];
  for(var i=0;i<enemies.length;i++){
   var e=enemies[i];
   if(!e.alive||!e.settled||e.id===target.id)continue;
   var d=Math.abs(e.col-target.col);
   if(cl.adjacentOnly&&d!==1)continue;
   others.push({e:e,d:d});
  }
  others.sort(function(a,b){return a.d-b.d||a.e.id-b.e.id;});
  for(var j=0;j<Math.min(cl.arcs,others.length);j++)
   splash.push({id:others[j].e.id,dmg:cl.splash,kill:others[j].e.hp<=cl.splash});
 }
 return {base:base,dmg:dmg,wounded:wounded,crit:crit,execute:execute,tithe:tithe,
         onKillAP:cl.onKillAP||0,onKillUnit:cl.onKillUnit||null,
         kill:target.hp<=dmg||execute,splash:splash,target:target};
}

function stateBar(cx,y,val,max,pal,h){
 // ONE BAR for every meter in the game. The Director liked how the CHARGE bar read and asked
 // health to match it, so there is now a single drawing routine and the two differ only by
 // palette and height. Anything true of one is true of the other, by construction.
 //
 // The charge bar's legibility came from three things, all kept: a dark frame around the whole
 // bar, segments INSET inside it, and a light pip on a full segment. What it LACKED, and what
 // the Director asked for, is a SPENT state: an empty segment drew as nothing, so you could
 // not count what you had used.
 //
 // Half-values were the other complaint. Half a segment at 1px of 2 was unreadable, so a half
 // now gets its OWN COLOUR rather than its own width. Three states, three colours, no
 // sub-pixel arithmetic: full, half, spent.
 var segs=Math.ceil(max),sw=2,gap=0.5;
 var w=segs*sw+(segs-1)*gap;
 var x=Math.round((cx-w/2)*2)/2;

 ctx.fillStyle=pal.back;ctx.fillRect(x-1,y,w+2,h);
 for(var i=0;i<segs;i++){
  var sx=x+i*(sw+gap);
  var f=Math.max(0,Math.min(1,val-i));
  pxF(sx,y+inset,sw,1,f>=1?pal.fill:(f>=0.5?pal.half:pal.spent));

// THE FINAL FIGHT LADDER (Director design, 2026-07-16).
// Every pip is HALF a health point, and a bar holds six, so one bar is 3.0 HP. A unit with
// more than that does not get a longer bar: it gets a bar in the NEXT COLOUR, and only the
// CURRENT layer is ever drawn. The bands beneath stay hidden, so the bar answers one question
// at a time ("how much is left in this band") instead of two.
// This is also what finally ends the sizing fight that ran from v1.30 to v1.35: the bar's
// length no longer depends on the unit's health at all, so a BRUTE, the royal and anything we
// add later all draw the same 6-pip object. Nothing has to shrink to fit.
// Side effect worth knowing: the amber half-state is now unreachable for HEALTH, because 0.5
// is the smallest step the damage law produces and a pip IS 0.5. It stays for the charge bar.
var HP_PER_LAYER=6, HP_PER_PIP=1, HP_BAR_PIPS=6;   // x2 rescale: a pip is exactly 1 HP
var HP_LAYERS=[
 {fill:'#E04838',lite:'#F0907E',spent:'#6E2A26'},   // 1: red      0.5 .. 3.0
 {fill:'#4A90D8',lite:'#A8D0F0',spent:'#24405C'},   // 2: blue     3.5 .. 6.0
 {fill:'#A45AD0',lite:'#D8A8F0',spent:'#44245A'},   // 3: violet   6.5 .. 9.0
 {fill:'#E8C558',lite:'#FFF0A8',spent:'#6E5A22'}    // 4: gold     9.5 .. 12.0
];
function hpLayer(hp){ return Math.max(1,Math.ceil(hp/HP_PER_LAYER)); }
function hpLit(hp){ return Math.round((hp-(hpLayer(hp)-1)*HP_PER_LAYER)/HP_PER_PIP); }
function hpCaps(max){ return Math.min(HP_BAR_PIPS,Math.ceil(Math.min(max,HP_PER_LAYER)/HP_PER_PIP)); }
var PAL_HP={back:'#08050A',spent:'#6E2A26',half:'#F0A030',fill:'#E04838',lite:'#F0907E'};
var PAL_CHG={back:'#201418',spent:'#3E4A34',half:'#B8C84A',fill:'#7AB84A',lite:'#C8E8A0'};
function pipBar(cx,y,hp,max,t){
 // health lives in the 2px top-edge slot, because the royal's crown paints to art row 0 and a
 // 3px band would clip it. The charge bar's LOOK survives the shorter slot: a 0.5px frame is
 // still 3 device pixels at 6x.
 var L=HP_LAYERS[Math.min(hpLayer(hp),HP_LAYERS.length)-1];
 var rate=hpPulse(hp),a=1;
 if(rate>0)a=0.58+0.42*(Math.sin(t*rate)+1)/2;

 // ONLY the current layer's colours: the bands beneath are never drawn, per Director ruling
 stateBar(cx,y,hpLit(hp),hpCaps(max),{back:PAL_HP.back,spent:L.spent,half:L.fill,fill:L.fill,lite:L.lite},SOY);

 }

    var ft=fc.execute?('JUDGEMENT: IT DIES'):

   }else{
    // ONE HOME PER STRING. Row 1 is identity: name left, actions right. Row 2 is the verdict:

    }else{

 }else if(s.phase==='play'&&s.piece){

 if(V.announce){

  drawPix(V.announce.text,ap3<0.35?axx:(ap3>0.65?axx:Math.round(BW/2-pixW(V.announce.text,2)/2)),88,'#E8C558',2);
 }
 ctx.save();ctx.globalAlpha=0.06;ctx.fillStyle='#FFF0A8';
 ctx.fillRect(GX,GY,COLS*T,10);ctx.globalAlpha=0.03;ctx.fillRect(GX,GY,COLS*T,22);
 ctx.restore();
 ctx.save();ctx.globalAlpha=0.18;ctx.fillStyle='#100A0C';
 ctx.fillRect(0,44,3,BH-44);ctx.fillRect(BW-3,44,3,BH-44);ctx.fillRect(0,BH-3,BW,3);
 ctx.restore();
 FEEL.postWorld(ctx);
 if(SANDBOX.on&&!V.title){
  // the sandbox announces itself, always: a tester must never mistake a lab board for the game
  drawPix(SANDBOX.testing?'SANDBOX TEST':'SANDBOX EDIT',3,32,'#7FE8D8');
  if(!SANDBOX.testing&&SANDBOX.tool){
   var _tl=SANDBOX.tool.foe?C.FOES[SANDBOX.tool.foeType].name:SANDBOX.tool.k;
   drawPix(_tl,BW-3-pixW(_tl),32,'#7FE8D8');
  }
  if(SANDBOX.paused){
   ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle='#100A0C';ctx.fillRect(0,0,BW,BH);ctx.restore();
   drawPix('PAUSED',Math.round(BW/2-pixW('PAUSED',2)/2),Math.round(BH/2-8),'#E8C558',2);
  }
 }
 if(V.title){
  ctx.fillStyle='#181215';ctx.fillRect(0,0,BW,BH);

  drawPix('[ SANDBOX ]',Math.round(BW/2-pixW('[ SANDBOX ]')/2),166,'#7FE8D8');

 if(s.phase!=='play'){

function cellAt(evx,evy){
 var rect=cv.getBoundingClientRect();
 var sc=rect.width/BW;
 var x=(evx-rect.left)/sc,y=(evy-rect.top)/sc;
 var c=Math.floor((x-GX)/T),r=Math.floor((y-GY)/TY);
 if(c<0||c>=COLS||r<0||r>=ROWS)return null;
 return [c,r];
}
function enemyAt(evx,evy){
 var rect=cv.getBoundingClientRect();
 var sc=rect.width/BW;
 var x=(evx-rect.left)/sc,y=(evy-rect.top)/sc;
 if(y>44)return null;
 var hit=null;
 MM.state.enemies.forEach(function(e){
  if(!e.alive||!e.settled)return;
  var ex=8+e.col*24;
  if(x>=ex-2&&x<=ex+32&&y>=10&&y<=42)hit=e;
 });
 return hit;
}
// ---- sandbox core (v1.45) ----
function sandboxEnter(){
 V.title=false; SANDBOX.on=true; SANDBOX.tool=null; SANDBOX.paused=false; SANDBOX.snap=null;
 MM.newGame(7); V.evCursor=MM.events.length; V.enemies={}; V.cellAnims={}; V.flights=[]; V.bolts=[]; V.royal.init=false;
 MM.state.enemies=[]; MM.state.ap=100; MM.state.msg='SANDBOX: pick a tool, paint, then TEST.';
 if(typeof sbEl!=='undefined'&&sbEl){sbEl.style.display='block';sbMode(false);}
}
function sandboxSnap(){
 var s=MM.state;
 SANDBOX.snap=JSON.stringify({grid:s.grid,enemies:s.enemies,royal:{c:s.royal.c,r:s.royal.r,hp:s.royal.hp},ap:s.ap});
}
function sandboxRestore(){
 if(!SANDBOX.snap)return;
 var d=JSON.parse(SANDBOX.snap), s=MM.state;
 s.grid=d.grid.map(function(row){return row.map(function(c){return c?JSON.parse(JSON.stringify(c)):null;});});
 s.enemies=d.enemies.map(function(e){return JSON.parse(JSON.stringify(e));});
 s.royal.c=d.royal.c; s.royal.r=d.royal.r; s.royal.hp=d.royal.hp;
 s.ap=d.ap; s.phase='play'; s.sel=null; s.aim=null; s.turn=1;
 V.enemies={}; V.cellAnims={}; V.flights=[]; V.bolts=[]; V.royal.init=false; V.evCursor=MM.events.length;
}
var SB_TOOLS=[];
// ONE BUTTON PER LINE PER TIER, GENERATED FROM LINES (v1.53). The same law v1.47 set for foes:
// adding a line must be all it takes to get a paintable defender, or LINES stops being the one
// place a line is defined and the editor becomes a second thing to remember. GRAVE arrived and
// this list did not have to be touched; THORN, VEIL and DAWN will not have to touch it either.
for(var _ln in LINES){
 for(var _lt=1;_lt<=4;_lt++) SB_TOOLS.push({k:LINES[_ln].key+_lt,cell:{type:'def',line:_ln,tier:_lt}});
}
for(var _lp in LINES) SB_TOOLS.push({k:'PX'+LINES[_lp].key,cell:{type:'pixel',line:_lp}});
SB_TOOLS.push({k:'ROK',cell:{type:'rock'}});
SB_TOOLS.push({k:'DEL',del:true});
// ONE FOE BUTTON PER TYPE, GENERATED FROM THE TABLE (v1.47). Not a hand-written list: adding a
// row to C.FOES must be all it takes to get a paintable foe, or the table stops being the one
// place a foe is defined and the editor becomes a second thing to remember.
for(var _ft in C.FOES) SB_TOOLS.push({k:_ft.slice(0,3),foe:true,foeType:_ft});
function sandboxPaint(c,r){
 var s=MM.state, t=SANDBOX.tool;
 if(!t)return;
 if(t.foe){
  var have=s.enemies.filter(function(e){return e.alive&&e.col===c;});
  // tapping a column with the SAME type clears it; a DIFFERENT type replaces what is there,
  // so swapping a SKIRM for a BRUTE is one tap rather than two
  if(have.length&&have[0].type===t.foeType){ have.forEach(function(e){e.alive=false;}); return; }
  have.forEach(function(e){e.alive=false;});
  var f=makeFoe(s.enemies.length,t.foeType,c,0,null);
  f.settled=true;                      // painted foes are armed and in position: testable at once
  s.enemies.push(f);
  return;
 }
 if(s.royal.c===c&&s.royal.r===r)return;
 if(t.del){s.grid[r][c]=null;return;}
 var cell=JSON.parse(JSON.stringify(t.cell));
 if(cell.type==='def')cell.actions=C.ACTIONS[cell.tier];
 s.grid[r][c]=cell;
}
function tap(evx,evy){
 if(!AU){try{AU=new (window.AudioContext||window.webkitAudioContext)();}catch(ex){}}
 var s=MM.state;
 if(V.title){
  var _r=cv.getBoundingClientRect(),_sc=_r.width/BW,_ly=(evy-_r.top)/_sc;
  if(_ly>=158&&_ly<=176){sandboxEnter();return;}
  V.title=false;V.announce={text:'WAVE 1',t:0,dur:1.4};tone(392,0.12,0.03);setTimeout(function(){tone(523,0.16,0.03);},130);return;
 }
 if(SANDBOX.on){
  if(SANDBOX.paused)return;                                            // paused: the board is inert
  if(!SANDBOX.testing){
   // EDIT MODE: taps paint. The FOE tool reads a column from anywhere in that column,
   // including the foe strip above the grid, since that is where foes visibly live.
   var _r2=cv.getBoundingClientRect(),_s2=_r2.width/BW;
   var _lx=(evx-_r2.left)/_s2;
   if(SANDBOX.tool&&SANDBOX.tool.foe){
    var _fc=Math.floor((_lx-GX)/T);
    if(_fc>=0&&_fc<COLS)sandboxPaint(_fc,0);
    return;
   }
   var _cell=cellAt(evx,evy);
   if(_cell)sandboxPaint(_cell[0],_cell[1]);
   return;
  }
  if(MM.state.phase!=='play'){ sandboxRestore(); return; }             // win/lose: back to the setup
 }
 if(s.phase!=='play'){MM.newGame((Date.now()&0xffff)^s.seed);V.enemies={};V.cellAnims={};V.flights=[];V.bolts=[];V.royal.init=false;V.evCursor=MM.events.length;autoCursor(3,4);return;}
 if(s.sel){
  var foe=enemyAt(evx,evy);
  if(foe){
   if(s.aim===foe.id){
    var res=MM.attack(s.sel[0],s.sel[1],foe.id);
    if(!res.ok){
     if(res.why==='ap'){s.msg='Need a full AP orb (20) to attack.';V.apDeny=0.5;tone(90,0.15,0.05);FEEL.shake(0.12);}
     else if(res.why==='spent')s.msg='This defender is spent.';
    }
    s.sel=null;s.aim=null;
    processEvents();
    if(s.ghost===null)autoCursor(3,4);
    return;
   }
   // FIRST tap on this foe, or a re-aim onto a different one: take aim, do not fire
   s.aim=foe.id;
   s.msg='Aimed. The panel shows the strike. Tap the mark to commit, anywhere else to cancel.';
   tone(520,0.05,0.02);
   processEvents();return;
  }
  if(s.aim!==null){s.aim=null;s.msg='Strike cancelled. The orb is untouched.';tone(300,0.06,0.02);}
 }
 var cell=cellAt(evx,evy);
 if(!cell){s.sel=null;s.aim=null;return;}
 var c=cell[0],r=cell[1];
 var content=s.grid[r][c];
 if(content&&content.type==='def'){
  if(content.actions<=0){s.msg='This defender is spent. It will crumble.';s.sel=null;return;}
  s.sel=[c,r];
  s.msg='Glowing foes are in reach. Tap one to take aim.';
  processEvents();return;
 }
 s.sel=null;
 if(s.gift&&MM.placeGift(c,r)){processEvents();autoCursor(c,r);return;}
 if(MM.free(c,r)){
  if(s.ghost&&s.ghost[0]===c&&s.ghost[1]===r){
   MM.place(c,r);
   processEvents();
   autoCursor(c,r);
   if(s.phase==='play'&&!s.msg)s.msg='';
  }else{s.ghost=[c,r];s.msg='Tap the ring again to place here.';}
 }
}
function toggleFull(){
 var d=document.documentElement;
 if(!document.fullscreenElement&&!document.webkitFullscreenElement){
  (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);
 }else{
  (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
 }
}
if(cv){
 cv.addEventListener('pointerdown',function(e){tap(e.clientX,e.clientY);e.preventDefault();});
 var fsb=document.getElementById('fsbtn');
 if(fsb)fsb.addEventListener('click',toggleFull);
 MM.newGame(1337);
 V.evCursor=MM.events.length;
 autoCursor(3,4);
 var last=performance.now();
 function loop(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(FEEL.tick(dt))step(dt);
  render();
  requestAnimationFrame(loop);
 }
 requestAnimationFrame(loop);
}

// ---- sandbox toolbar wiring (v1.45). Real DOM buttons: BH stays fixed (growing it shrinks
// sprites on phones; 390x844 is height-limited already), and buttons give honest touch targets.
var sbEl=document.getElementById('sandbar'), sbTools=document.getElementById('sbtools');
SB_TOOLS.forEach(function(t){
 var b=document.createElement('button'); b.textContent=t.k; b.id='sbt_'+t.k;
 b.onclick=function(){ if(SANDBOX.testing)return;
  SANDBOX.tool=(SANDBOX.tool===t)?null:t;
  Array.prototype.forEach.call(sbTools.children,function(x){x.className=(SANDBOX.tool&&x.id==='sbt_'+SANDBOX.tool.k)?'act':'';});
  MM.state.msg=SANDBOX.tool?(t.foe
    ?('Painting: '+C.FOES[t.foeType].name+' ('+C.FOES[t.foeType].hp+' HP, hits '+C.FOES[t.foeType].dmg+'). Tap a column.')
    :('Painting: '+t.k+'. Tap the board. DEL erases.')):'Pick a tool.';
 };
 sbTools.appendChild(b);
});
function sbMode(testing){
 SANDBOX.testing=testing; SANDBOX.paused=false;
 document.getElementById('sbtest').textContent=testing?'EDIT':'TEST';
 document.getElementById('sbpause').textContent='PAUSE';
 sbTools.style.opacity=testing?0.35:1;
}
document.getElementById('sbtest').onclick=function(){
 if(!SANDBOX.on)return;
 if(!SANDBOX.testing){ sandboxSnap(); sbMode(true); MM.state.msg='TESTING. Play normally. RESTART returns to your setup.'; }
 else { sandboxRestore(); sbMode(false); MM.state.msg='Back to editing. Your setup is restored.'; }
};
document.getElementById('sbpause').onclick=function(){
 if(!SANDBOX.on||!SANDBOX.testing)return;
 SANDBOX.paused=!SANDBOX.paused;
 this.textContent=SANDBOX.paused?'RESUME':'PAUSE';
 MM.state.msg=SANDBOX.paused?'PAUSED.':'Resumed.';
};
document.getElementById('sbreset').onclick=function(){
 if(!SANDBOX.on)return;
 if(SANDBOX.snap){ sandboxRestore(); if(SANDBOX.testing)MM.state.msg='Restarted from your setup.'; }
};
document.getElementById('sbexit').onclick=function(){
 SANDBOX.on=false; SANDBOX.testing=false; SANDBOX.paused=false; SANDBOX.snap=null; SANDBOX.tool=null;
 sbEl.style.display='none';
 MM.newGame((Date.now()&0xffff)); V.title=true; V.enemies={}; V.cellAnims={}; V.flights=[]; V.bolts=[]; V.royal.init=false; V.evCursor=MM.events.length;
};
