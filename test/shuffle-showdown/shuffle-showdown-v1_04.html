function px(g, x, y, w, h, col){ g.fillStyle = col; g.fillRect(x, y, w, h); }
function roundedCardBase(g, T, fill, edge){
  /* pixel-rounded rect: corner steps 3,2,1 texels */
  var ins = [3,2,1];
  px(g, 0, 3*T, TEXW*T, (TEXH-6)*T, fill);
  for(var i = 0; i < 3; i++){

  drawPip(g, s, (rn.length===2?11:8)*T, 17*T, T, col);

function paintCrest(g, T, cx, cy, R, colA, colB){
  /* the crest spiral: r grows with theta, plotted chunky; head + stalks */
  for(var t = 0; t < 13.2; t += 0.045){
    var rr = 1.4 + t * (R / 13.2);
    var x = cx + Math.cos(t) * rr * 0.92, y = cy + Math.sin(t) * rr;
    px(g, Math.round(x - 1)*T, Math.round(y - 1)*T, 2*T, 2*T, (t % 6.28 < 3.14) ? colA : colB);
  }
  var hx = cx - R - 4, hy = cy + 3;
  px(g, Math.round(hx)*T, Math.round(hy)*T, 5*T, 3*T, colA);         // head
  px(g, Math.round(hx)*T, Math.round(hy-2)*T, T, 2*T, colA);         // stalk 1
  px(g, Math.round(hx+2)*T, Math.round(hy-3)*T, T, 3*T, colA);       // stalk 2

    out.push({x:x, w:widths[m]*squeeze, step:step*squeeze, scl:scl, y:L.meld.y + L.ch*scl/2});
    x += widths[m]*squeeze + gap*squeeze;

}
function sortedHand(seat){

    h.sort(function(a, b){
      return STATE.sortMode === 1 ? (rankOf(a) - rankOf(b)) || (suitOf(a) - suitOf(b))
                                  : (suitOf(a) - suitOf(b)) || (rankOf(a) - rankOf(b));

}
function computeHomes(){
  var g = STATE.g, out = {};

  var n = STATE.match.seats.length, i, j, c;
  var GH = curGame();
  if(g.stock) for(i = 0; i < g.stock.length; i++){
    c = g.stock[i];
    var o = Math.min(i, 8) * 0.7;
    out[c] = {x:L.stock.x + L.cw/2 - o, y:L.stock.y + L.ch/2 - o, rot:0, scl:1, fl:0, z:10 + i,
              key:'st' + Math.min(i,8)};
  }
  if(g.discard) for(i = 0; i < g.discard.length; i++){
    c = g.discard[i];
    var vis = i >= g.discard.length - 3;
    out[c] = {x:L.discard.x + L.cw/2 + (vis ? (c % 5) - 2 : 0), y:L.discard.y + L.ch/2,
              rot:vis ? ((c % 9) - 4) * 0.02 : 0, scl:1, fl:1, z:100 + i, key:'dc' + i + (vis?'v':'')};
  }

      c = hd[j];

        out[c] = {x:a.x + (j - (hn-1)/2) * L.cw*sc*0.42, y:a.y + (vi===0? -L.ch*0.2 : 34) + L.ch*sc*0.5,
                  rot:0, scl:sc, fl:1, z:300 + vi*60 + j, key:'rv' + vi + '.' + j};
      } else if(vi === 0){
        var hidden = STATE.screen === 'handoff';
        var p = handFanPos(j, hn, !hidden && STATE.sel.indexOf(c) >= 0);
        out[c] = {x:p.x, y:p.y, rot:p.rot, scl:1, fl:hidden ? 0 : 1, z:400 + j,
                  key:'h' + j + '.' + hn + (hidden?'x':'') + (STATE.sel.indexOf(c)>=0?'s':'') + STATE.sortMode};
      } else {
        var an = seatAnchor(vi, n);
        out[c] = {x:an.x + (j - (hn-1)/2) * 7, y:an.y + 40, rot:(j - (hn-1)/2) * 0.02,
                  scl:0.5, fl:0, z:150 + vi*60 + j, key:'o' + vi + '.' + j + '.' + hn};
      }
    }
  }

function syncHomes(){
  if(!STATE.match || !STATE.g) return;
  if(layoutDirty) computeLayout();
  var homes = computeHomes();
  for(var id in homes){
    var t = homes[id], s = sp(+id);
    var key = t.key + '|' + (W|0) + 'x' + (H|0);
    if(s.key !== key){
      s.key = key;
      var d = s.dealDelay || 0; s.dealDelay = 0;
      var ek = s.easeOnce || 'out'; s.easeOnce = null;
      killTweensOf(s);
      s.z = t.z;
      tween(s, {x:t.x, y:t.y, rot:t.rot, scl:t.scl}, 270, ek, d);
      if(s.fl !== t.fl) tween(s, {fl:t.fl}, 200, 'inout', d + 90);

}
function dealChoreo(){
  resetSprites(); STATE.sel = []; STATE.layMode = false;
  if(layoutDirty) computeLayout();
  var g = STATE.g, i;
  for(i = 0; i < 52; i++){ var s = sp(i); s.x = L.stock.x + L.cw/2; s.y = L.stock.y + L.ch/2; s.fl = 0; s.key=''; }
  var RIFF = HEADLESS ? 0 : 1050;
  shufflePhase = HEADLESS ? null : {t:0, dur:RIFF};
  if(!HEADLESS) for(i = 0; i < 14; i++) qSnd('riff', 180 + i*52);
  var seq = g.dealSeq || [];
  for(i = 0; i < seq.length; i++){
    sp(seq[i].c).dealDelay = RIFF + i*70;
    if(!HEADLESS) qSnd('swish', RIFF + i*70);
  }
  choreoUntil = simNow + RIFF + seq.length*70 + 420;
  if(!HEADLESS) qSnd('snap', RIFF + seq.length*70 + 120);

}
function processEvents(evq){
  for(var i = 0; i < evq.length; i++){
    var ev = evq[i];
    if(ev.e === 'draw'){ qSnd('swish', 40); if(ev.seat === STATE.pov) qSnd('flip', 220); choreoUntil = Math.max(choreoUntil, simNow + 300); }
    else if(ev.e === 'discard' || ev.e === 'play'){ sp(ev.card).easeOnce = 'back'; qSnd('snap', 200); choreoUntil = Math.max(choreoUntil, simNow + 300); buzz(8); }
    else if(ev.e === 'meld'){ qSnd('meld', 60); choreoUntil = Math.max(choreoUntil, simNow + 380); }
    else if(ev.e === 'lay'){ qSnd('chip', 60); choreoUntil = Math.max(choreoUntil, simNow + 300); }
    else if(ev.e === 'reshuffle'){ shufflePhase = HEADLESS ? null : {t:0, dur:800}; if(!HEADLESS) for(var k = 0; k < 10; k++) qSnd('riff', k*60); choreoUntil = Math.max(choreoUntil, simNow + (HEADLESS?0:900)); showMsg('STOCK RESHUFFLED'); }
    else if(ev.e === 'suit'){ qSnd('suit', 60); showMsg('SUIT CALLED: ' + SUITS[ev.suit]); }
    else if(ev.e === 'msg'){ showMsg(ev.txt); }
    else if(ev.e === 'fx'){ if(ev.snd) qSnd(ev.snd, ev.d || 40); if(ev.msg) showMsg(ev.msg); if(ev.buzz) buzz(ev.buzz); choreoUntil = Math.max(choreoUntil, simNow + (ev.hold != null ? ev.hold : 260)); }
  }
}

/* ---- authority path: every state move goes through here ------------------- */
function isLocalHuman(i){
  var st = STATE.match.seats[i];
  if(st.kind !== 'human') return false;
  return NET.on() ? i === NET.mySeat() : true;
}
function isLocalTurn(){
  var g = STATE.g;
  return !!(STATE.match && g && !g.over && isLocalHuman(g.turn) && STATE.pov === g.turn);
}
function isAuthority(){ return !NET.on() || NET.isHost(); }
function tryLocalAction(action){
  var g = STATE.g;
  if(!STATE.match || !g || g.over) return false;
  if(choreoBusy()){ return false; }
  if(!isLocalTurn()){ sfx('denied'); return false; }
  var G = curGame();
  if(!G.legal(g, g.turn, action)){ sfx('denied'); return false; }
  if(NET.on() && !NET.isHost()){ NET.send({t:'want', action:action}); return true; }
  applyAuthAction(g.turn, action);
  return true;
}
function applyAuthAction(seat, action){
  var G = curGame(), g = STATE.g, evq = [];
  G.apply(g, seat, action, function(ev){ evq.push(ev); });
  applyCount++;
  if(NET.on() && NET.isHost()) NET.bcast({t:'act', seq:NET.nextSeq(), seat:seat, action:action});
  processEvents(evq);
  afterApply();
}
function afterApply(){
  var g = STATE.g;
  STATE.sel = []; STATE.layMode = false;
  if(g.over){ endRound(); return; }
  maybeHandoff();
  scheduleBot();
}
function endRound(){
  var G = curGame(), m = STATE.match;
  var res = G.roundResult(STATE.g);
  STATE.lastResult = res;
  if(G.single){                     /* one round IS the match (TCG mode) */
    for(var s1 = 0; s1 < m.seats.length; s1++) m.scores[s1] = res.deltas[s1];
    m.over = true; m.winner = res.winner >= 0 ? res.winner : 0;
    STATE.reveal = false; STATE.overlay = 'matchend';
    botPending = null; flushLite();
    sfx(isLocalHuman(m.winner) ? 'matchwin' : 'lose');
    if(NET.on() && NET.isHost()) NET.bcast({t:'mend'});
    return;
  }
  for(var i = 0; i < m.seats.length; i++) m.scores[i] += res.deltas[i];
  var top = 0;
  for(i = 1; i < m.seats.length; i++) if(m.scores[i] > m.scores[top]) top = i;
  if(m.scores[top] >= m.target){ m.over = true; m.winner = top; }
  STATE.reveal = true; STATE.overlay = 'roundend';
  botPending = null;
  flushLite();
  if(res.winner >= 0) sfx(isLocalHuman(res.winner) ? 'roundwin' : 'chip');
  buzz(30);
}
function flushLite(){ choreoUntil = 0; shufflePhase = null; }
function continueFromRound(){
  var m = STATE.match;
  if(NET.on() && !NET.isHost()) return;                    // host advances the table
  if(m.over){
    STATE.overlay = 'matchend';
    sfx(isLocalHuman(m.winner) ? 'matchwin' : 'lose');
    if(NET.on()) NET.bcast({t:'mend'});
    return;
  }
  m.round++; m.dealer = (m.dealer + 1) % m.seats.length;
  newRoundState();
  if(NET.on()) NET.bcast({t:'round', snap:snapshot()});
}
function newRoundState(){
  var m = STATE.match, G = GAMES[m.gameId];
  var seed = (Math.floor(uiRnd() * 0x7fffffff)) | 0;
  STATE.g = G.setup(m.seats.length, seed, m.dealer, STATE.setup.gopts);
  STATE.overlay = null; STATE.reveal = false; STATE.lastResult = null;
  lastTurnSfx = -1;
  dealChoreo();
  maybeHandoff();
  scheduleBot();
}
function startMatch(gameId, seats, target, seed){
  STATE.match = {gameId:gameId, seats:seats, target:target||TARGET_SCORE,
                 scores:seats.map(function(){ return 0; }), dealer:0, round:1, over:false, winner:-1};
  var G = GAMES[gameId];
  spriteCache = {};                 /* catalog games repaint per match */
  STATE.g = G.setup(seats.length, seed, 0, STATE.setup.gopts);
  STATE.pov = 0;
  if(NET.on()) STATE.pov = NET.mySeat();
  else for(var i = 0; i < seats.length; i++) if(seats[i].kind === 'human'){ STATE.pov = i; break; }
  STATE.screen = 'table'; STATE.overlay = null; STATE.reveal = false;
  STATE.sel = []; STATE.sortMode = 0; STATE.lastResult = null; lastTurnSfx = -1;
  dealChoreo();
  maybeHandoff();
  scheduleBot();
}
function leaveMatch(){
  STATE.match = null; STATE.g = null; STATE.overlay = null; STATE.reveal = false;
  botPending = null; resetSprites(); flushChoreo();
  NET.leave();
  STATE.screen = 'menu';
}
function maybeHandoff(){
  if(NET.on()) return;
  var m = STATE.match, g = STATE.g;
  if(!m || !g || g.over) return;
  var humans = 0;
  for(var i = 0; i < m.seats.length; i++) if(m.seats[i].kind === 'human') humans++;
  if(humans < 2) return;
  if(m.seats[g.turn].kind === 'human' && g.turn !== STATE.pov){
    STATE.handoffTo = g.turn; STATE.screen = 'handoff'; STATE.sel = [];
  }
}
function scheduleBot(){
  botPending = null;
  var m = STATE.match, g = STATE.g;
  if(!m || !g || g.over || !isAuthority()) return;
  if(m.seats[g.turn].kind === 'bot')
    botPending = {at:Math.max(simNow, choreoUntil) + BOT_MIN_MS, seat:g.turn};
}
function botPump(){
  if(!botPending || choreoBusy()) return;
  if(simNow < botPending.at) return;
  var m = STATE.match, g = STATE.g;
  if(!m || !g || g.over){ botPending = null; return; }
  var seat = botPending.seat;
  if(g.turn !== seat || m.seats[seat].kind !== 'bot'){ scheduleBot(); return; }
  var G = curGame(), a = null;
  try{ a = G.bot(g, seat, m.seats[seat].diff); }catch(e){ reportErr('bot', e); }
  if(!a || !G.legal(g, seat, a)){ botFallbacks++; a = G.fallback(g, seat); }
  applyAuthAction(seat, a);
  g = STATE.g;
  if(g && !g.over && g.turn === seat && m.seats[seat].kind === 'bot')
    botPending = {at:simNow + BOT_STEP_MS, seat:seat};
}

/* ---- snapshots (net + gates): full-state serialize, deterministic --------- */
function snapshot(){
  var m = STATE.match;
  return {v:VER, seq:NET.on() ? NET.seq() : 0,
          match:{gameId:m.gameId, target:m.target, scores:m.scores.slice(), dealer:m.dealer,
                 round:m.round, over:m.over, winner:m.winner},
          seats:m.seats.map(function(s){ return {kind:s.kind, name:s.name, diff:s.diff}; }),
          g:JSON.parse(JSON.stringify(STATE.g)),
          ov:STATE.overlay, rev:STATE.reveal};
}
function restoreSnap(sn, mySeat){
  STATE.match = {gameId:sn.match.gameId, seats:sn.seats, target:sn.match.target,
                 scores:sn.match.scores.slice(), dealer:sn.match.dealer, round:sn.match.round,
                 over:sn.match.over, winner:sn.match.winner};
  STATE.g = sn.g;
  STATE.overlay = sn.ov || null; STATE.reveal = !!sn.rev;
  if(STATE.overlay === 'roundend') STATE.lastResult = curGame().roundResult(STATE.g);
  STATE.pov = (mySeat != null) ? mySeat : 0;
  STATE.sel = []; STATE.layMode = false; lastTurnSfx = -1;
  resetSprites(); flushChoreo();
  STATE.screen = 'table';
  scheduleBot();
}

/* ---- NET: PeerJS host-authoritative turn protocol (title-local) ----------- */
/* Provenance: topology per the studio netcode doctrine (host owns truth,
   guests send intents, snapshots heal gaps). Turn-based shape is this
   title's own; SNAIL-NETCODE's realtime core deliberately not consumed,
   reconciliation memo owed (see codex NETCODE notes).                       */
var CODE_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ';
var NET = (function(){
  var st = null;   // {host, peer, conns:[{c, seat, name}], code, mySeat, seq, hostConn, phase}
  function avail(){ return (typeof Peer !== 'undefined'); }
  function on(){ return !!(st && st.phase === 'play'); }
  function reset(){ st = null; }
  function mkCode(){
    var c = '';
    for(var i = 0; i < 4; i++) c += CODE_ABC.charAt(Math.floor(uiRnd() * CODE_ABC.length));
    return c;
  }
  function host(){
    if(!avail()){ showMsg('ONLINE NEEDS A CONNECTION'); return; }
    var code = mkCode();
    st = {host:true, code:code, conns:[], mySeat:0, seq:0, phase:'lobby', names:[SET.name || 'HOST'], gameId:STATE.setupGame, err:null, opts:[]};
    try{
      st.peer = new Peer('shufshow-' + code);
      st.peer.on('error', function(e){
        if(st && st.phase === 'lobby' && !st.retried && String(e && e.type) === 'unavailable-id'){
          st.retried = true;
          try{ st.peer.destroy(); }catch(_){ }
          st = null; host();
        } else netErr(e);
      });
      st.peer.on('connection', function(c){
        c.on('open', function(){
          if(!st || st.names.length >= MAX_SEATS){ try{ c.send({t:'full'}); c.close(); }catch(_){ } return; }
          var seat = st.names.length;
          st.conns.push({c:c, seat:seat, name:'GUEST'});
          st.names.push('GUEST');
          c.send({t:'seat', i:seat});
          c.on('data', function(d){ handleHostMsg(c, d); });
          c.on('close', function(){ dropGuest(c); });
          pushLobby();
        });
      });
    }catch(e){ netErr(e); }
  }
  function join(code){
    if(!avail()){ showMsg('ONLINE NEEDS A CONNECTION'); return; }
    st = {host:false, code:code, mySeat:-1, seq:0, phase:'joining', names:[], gameId:'rummy', err:null};
    try{
      st.peer = new Peer();
      st.peer.on('error', function(e){ netErr(e); });
      st.peer.on('open', function(){
        var c = st.peer.connect('shufshow-' + code, {reliable:true});
        st.hostConn = c;
        c.on('open', function(){ st.phase = 'lobby'; c.send({t:'hi', name:SET.name || 'GUEST'}); });
        c.on('data', function(d){ handleGuestMsg(d); });
        c.on('close', function(){ hostLost(); });
      });
    }catch(e){ netErr(e); }
  }
  function netErr(e){
    if(!st) return;
    st.err = (e && (e.type || e.message)) ? String(e.type || e.message) : 'CONNECTION ERROR';
    if(st.phase !== 'play') showMsg('NET: ' + st.err, 2200);
  }
  function hostLost(){
    if(!st) return;
    if(st.phase === 'play'){ showMsg('HOST LOST: BACK TO MENU', 2600); leaveMatch(); }
    else { showMsg('COULD NOT REACH TABLE ' + st.code, 2200); st.phase = 'joinfail'; }
  }
  function dropGuest(c){
    if(!st) return;
    for(var i = 0; i < st.conns.length; i++) if(st.conns[i].c === c){
      var seat = st.conns[i].seat;
      st.conns.splice(i, 1);
      if(st.phase === 'play' && STATE.match){
        STATE.match.seats[seat] = {kind:'bot', name:STATE.match.seats[seat].name + '*', diff:1};
        bcast({t:'takeover', seat:seat});
        showMsg('SEAT ' + (seat+1) + ' IS NOW A BOT');
        scheduleBot();
      } else if(st.phase === 'lobby'){
        st.names.splice(seat, 1);
        if(st.opts) st.opts.splice(seat, 1);
        for(var k = 0; k < st.conns.length; k++) if(st.conns[k].seat > seat) st.conns[k].seat--;
        for(k = 0; k < st.conns.length; k++) try{ st.conns[k].c.send({t:'seat', i:st.conns[k].seat}); }catch(_){ }
        pushLobby();
      }
      return;
    }
  }
  function pushLobby(){
    bcast({t:'lobby', names:st.names.slice(), gameId:st.gameId, opts:(st.opts || []).slice()});
  }
  function handleHostMsg(c, d){
    try{
      if(!d || !st) return;
      if(d.t === 'hi'){
        for(var i = 0; i < st.conns.length; i++) if(st.conns[i].c === c){
          st.conns[i].name = String(d.name || 'GUEST').slice(0, 8).toUpperCase() || 'GUEST';
          st.names[st.conns[i].seat] = st.conns[i].name;
        }
        pushLobby();
      } else if(d.t === 'opt' && st.phase === 'lobby'){          /* v1.04: a guest's lobby option (a CLASH deck) */
        for(var j = 0; j < st.conns.length; j++) if(st.conns[j].c === c) st.opts[st.conns[j].seat] = String(d.v || '').slice(0, 16);
        pushLobby();
      } else if(d.t === 'want' && st.phase === 'play'){
        var seat = -1;
        for(i = 0; i < st.conns.length; i++) if(st.conns[i].c === c) seat = st.conns[i].seat;
        var g = STATE.g, G = curGame();
        if(seat >= 0 && g && !g.over && g.turn === seat && !STATE.overlay && G.legal(g, seat, d.action))
          applyAuthAction(seat, d.action);
        else if(seat >= 0){ try{ c.send({t:'snap', snap:snapshot()}); }catch(_){ } }   /* refused: the guest may be stale (a lost echo of its own move); heal it, never stall (v1.04) */
      } else if(d.t === 'snap?' && st.phase === 'play'){
        try{ c.send({t:'snap', snap:snapshot()}); }catch(_){ }
      }
    }catch(e){ reportErr('netHost', e); }
  }
  function handleGuestMsg(d){
    try{
      if(!d || !st) return;
      if(d.t === 'seat'){ st.mySeat = d.i; }
      else if(d.t === 'lobby'){ st.names = d.names; st.gameId = d.gameId; st.opts = d.opts || []; }
      else if(d.t === 'full'){ showMsg('TABLE FULL', 2000); st.phase = 'joinfail'; }
      else if(d.t === 'start'){
        st.phase = 'play'; st.seq = d.snap.seq || 0;
        restoreSnap(d.snap, st.mySeat);
        showMsg('DEALT IN: SEAT ' + (st.mySeat + 1));
      } else if(d.t === 'act' && st.phase === 'play'){
        if(d.seq !== st.seq + 1){ askSnap(); return; }
        st.seq = d.seq;
        var g = STATE.g, G = curGame(), evq = [];
        if(g && G.legal(g, d.seat, d.action)){
          G.apply(g, d.seat, d.action, function(ev){ evq.push(ev); });
          processEvents(evq); afterApply();
        } else askSnap();
      } else if(d.t === 'snap'){ st.seq = d.snap.seq || st.seq; restoreSnap(d.snap, st.mySeat); }
      else if(d.t === 'round'){ st.seq = d.snap.seq || st.seq; restoreSnap(d.snap, st.mySeat); dealChoreo(); }
      else if(d.t === 'mend'){ STATE.overlay = 'matchend'; sfx(isLocalHuman(STATE.match.winner) ? 'matchwin' : 'lose'); }
      else if(d.t === 'takeover'){ if(STATE.match) STATE.match.seats[d.seat] = {kind:'bot', name:STATE.match.seats[d.seat].name + '*', diff:1}; }
    }catch(e){ reportErr('netGuest', e); }
  }
  function askSnap(){ try{ if(st && st.hostConn) st.hostConn.send({t:'snap?'}); }catch(_){ } }
  function bcast(m){
    if(!st || !st.host) return;
    for(var i = 0; i < st.conns.length; i++) try{ st.conns[i].c.send(m); }catch(_){ }
  }
  function hostStart(){
    if(!st || !st.host || st.names.length < 2) return;
    var LG = GAMES[st.gameId];
    if(LG && st.names.length > LG.max){ showMsg(LG.name + ' SEATS ' + LG.max, 2200); return; }   /* v1.04: never start a table the game cannot seat */
    if(LG && LG.lobbyOpts) STATE.setup.gopts = LG.lobbyOpts((st.opts || []).slice());   /* v1.04: each seat's lobby pick reaches setup */
    var seats = [];
    for(var i = 0; i < st.names.length; i++) seats.push({kind:'human', name:st.names[i], diff:1});
    for(i = 0; i < st.bots; i++) if(seats.length < MAX_SEATS) seats.push({kind:'bot', name:'HUSTLER', diff:1});
    st.phase = 'play'; st.seq = 0;
    startMatch(st.gameId, seats, TARGET_SCORE, (Math.floor(uiRnd()*0x7fffffff))|0);
    bcast({t:'start', snap:snapshot()});
  }
  function leave(){
    if(!st) return;
    try{ if(st.peer) st.peer.destroy(); }catch(_){ }

/* ---- the loop: fixed step, clock law, hook-drivable ------------------------ */
var last = 0, acc = 0;
function stepSim(dt){
  simNow += dt; uiTime += dt;
  tickTweens(dt);
  if(shufflePhase){ shufflePhase.t += dt; if(shufflePhase.t >= shufflePhase.dur) shufflePhase = null; }
  for(var i = 0; i < sndq.length; i++){
    if(sndq[i].at <= simNow){ sfx(sndq[i].name); sndq.splice(i, 1); i--; }
  }
  botPump();
}
function pump(now){
  try{
    if(!last) last = now;
    acc += now - last; last = now;
    if(acc > CATCHUP_DROP){ last = now - STEP; acc = STEP; }   /* drop the lost time, never sprint (doc 11) */
    var t = 0;
    while(acc >= STEP && t < TICK_CAP){ stepSim(STEP); acc -= STEP; t++; }
    if(t >= TICK_CAP) acc = 0;                                  /* cap reached: shed the backlog */
    syncHomes();
    render();
  }catch(e){ reportErr('pump', e); }
  if(!HEADLESS) win.requestAnimationFrame(pump);
}
if(doc && doc.addEventListener){
  doc.addEventListener('visibilitychange', function(){
    if(!doc.hidden){
      last = 0; acc = 0;                                        /* resync the local clock, every mode */
      if(NET.on() && !NET.isHost()) NET.askSnap();              /* long gap: mini re-join via snapshot */
    }
  });
}

(function(){
  function sortByRank(ids){ return ids.slice().sort(function(a,b){ return rankOf(a) - rankOf(b); }); }
  function meldKind(ids){
    if(ids.length < 3 || ids.length > 13) return null;
    var i, sameRank = true;
    for(i = 1; i < ids.length; i++) if(rankOf(ids[i]) !== rankOf(ids[0])) sameRank = false;
    if(sameRank && ids.length <= 4) return 'set';
    var s = suitOf(ids[0]);
    for(i = 1; i < ids.length; i++) if(suitOf(ids[i]) !== s) return null;
    var srt = sortByRank(ids);
    for(i = 1; i < srt.length; i++) if(rankOf(srt[i]) !== rankOf(srt[i-1]) + 1) return null;
    return 'run';                                   /* ace low only: A-2-3 yes, Q-K-A no */
  }
  function layFit(meld, card){
    if(meld.kind === 'set')
      return meld.cards.length < 4 && rankOf(card) === rankOf(meld.cards[0]);
    if(suitOf(card) !== suitOf(meld.cards[0])) return false;
    var lo = rankOf(meld.cards[0]), hi = rankOf(meld.cards[meld.cards.length - 1]);
    return rankOf(card) === lo - 1 || rankOf(card) === hi + 1;
  }
  function removeCards(hand, ids){
    for(var i = 0; i < ids.length; i++){
      var k = hand.indexOf(ids[i]);
      if(k < 0) return false;
      hand.splice(k, 1);
    }
    return true;
  }
  function reshuffleStock(g, emit){
    if(g.stock.length) return;
    if(g.discard.length <= 1) return;
    var top = g.discard.pop();
    g.stock = g.discard; g.discard = [top];
    shuffleArr(g, g.stock);
    emit({e:'reshuffle'});
  }
  function advance(g){
    g.turn = (g.turn + 1) % g.n; g.phase = 'draw'; g.drewDisc = -1; g.turnCount++;
    if(g.turnCount > TURN_GUARD){ g.over = true; g.winner = -1; }
  }
  function goOutCheck(g, seat){
    if(g.hands[seat].length === 0){ g.over = true; g.winner = seat; }
  }
  /* best meld cover: exact search, hands are small (max 11 cards) */
  function candidateMelds(hand){
    var out = [], byRank = {}, bySuit = {}, i, k;
    for(i = 0; i < hand.length; i++){
      var c = hand[i];
      (byRank[rankOf(c)] = byRank[rankOf(c)] || []).push(c);
      (bySuit[suitOf(c)] = bySuit[suitOf(c)] || []).push(c);
    }
    for(k in byRank){
      var grp = byRank[k];
      if(grp.length >= 3){
        if(grp.length === 3) out.push(grp.slice());
        else {
          out.push(grp.slice());
          for(i = 0; i < 4; i++){ var t3 = grp.slice(); t3.splice(i, 1); out.push(t3); }
        }
      }
    }
    for(k in bySuit){
      var run = sortByRank(bySuit[k]);
      for(i = 0; i < run.length; i++){
        var seq = [run[i]];
        for(var j = i + 1; j < run.length; j++){
          if(rankOf(run[j]) === rankOf(seq[seq.length-1]) + 1) seq.push(run[j]);
          else if(rankOf(run[j]) === rankOf(seq[seq.length-1])) continue;
          else break;
        }
        for(var len = 3; len <= seq.length; len++) out.push(seq.slice(0, len));
      }
    }
    return out;
  }
  function bestCover(hand){
    var cands = candidateMelds(hand);
    var best = {value:0, melds:[]};
    function val(ids){ var v = 0; for(var i = 0; i < ids.length; i++) v += pipValue(ids[i]); return v; }
    function used(sel, ids){
      for(var i = 0; i < ids.length; i++) if(sel.indexOf(ids[i]) >= 0) return true;
      return false;
    }
    function rec(idx, sel, melds, value){
      if(value > best.value) best = {value:value, melds:melds.slice()};
      if(idx >= cands.length) return;
      for(var i = idx; i < cands.length; i++){
        if(used(sel, cands[i])) continue;
        rec(i + 1, sel.concat(cands[i]), melds.concat([cands[i]]), value + val(cands[i]));
      }
    }
    rec(0, [], [], 0);
    return best;
  }
  function helpsHand(g, hand, c){
    for(var m = 0; m < g.melds.length; m++) if(layFit(g.melds[m], c)) return true;
    for(var i = 0; i < hand.length; i++) for(var j = i + 1; j < hand.length; j++)
      if(meldKind([hand[i], hand[j], c])) return true;
    return false;
  }
  function keepScore(hand, c){                       /* pair or run-neighbor potential */
    var k = 0;

  }
}

function foeOf(seat){ return (seat + 1) % 2; }

/* ---- state helpers -------------------------------------------------------- */
function drawOne(g, seat, emit){
  if(!g.decks[seat].length) return false;
  var c = g.decks[seat].pop();
  g.hands[seat].push(c);
  emit({e:'draw', seat:seat, card:c, src:'stock'});
  return true;
}
function refillTo(g, seat, emit){ while(g.hands[seat].length < HAND && drawOne(g, seat, emit)){} }
function ringSum(g, seat){
  var s = 0;
  for(var i = 0; i < RINGN; i++) if(g.ring[seat][i]) s += g.ring[seat][i].cur;
  return s;
}
function koSlot(g, seat, idx, emit){
  var sl = g.ring[seat][idx];
  if(!sl) return;
  g.ring[seat][idx] = null;
  g.kos[seat].push(sl.c);
  for(var k = 0; k < sl.backs.length; k++) g.kos[seat].push(sl.backs[k]);
  g.sp[seat] += KO_SP;
  emit({e:'fx', snd:'ko', msg:cardOf(g, sl.c).name + ' IS DOWN', buzz:14, hold:420});
}
function dmgChar(g, seat, idx, amt, emit){
  var sl = g.ring[seat][idx];
  if(!sl || amt <= 0) return;
  sl.cur -= amt;
  if(sl.cur <= 0) koSlot(g, seat, idx, emit);
}
function hitHP(g, seat, amt, emit){
  g.hp[seat] -= amt;
  emit({e:'fx', snd:'thud', msg:'-' + amt + ' HP', buzz:20, hold:420});
  if(g.hp[seat] <= 0){ g.hp[seat] = 0; g.over = true; g.winner = foeOf(seat); }
}
function biggestFoe(g, me){
  var f = foeOf(me), best = -1;
  for(var i = 0; i < RINGN; i++){
    var sl = g.ring[f][i];
    if(sl && (best < 0 || sl.cur > g.ring[f][best].cur)) best = i;
  }
  return best;
}
function smallestFoe(g, me){
  var f = foeOf(me), best = -1;
  for(var i = 0; i < RINGN; i++){
    var sl = g.ring[f][i];
    if(sl && (best < 0 || sl.cur < g.ring[f][best].cur)) best = i;
  }
  return best;
}
function hurtAlly(g, me){
  var best = -1, most = 0;
  for(var i = 0; i < RINGN; i++){
    var sl = g.ring[me][i];
    if(sl && sl.max - sl.cur > most){ most = sl.max - sl.cur; best = i; }
  }
  return best;
}
function readySlots(g, seat){
  var out = [];
  for(var i = 0; i < RINGN; i++){
    var sl = g.ring[seat][i];
    if(sl && !sl.warm && !sl.used) out.push(i);
  }
  return out;
}
function startTurn(g, seat, emit){
  g.turn = seat; g.phase = 'main'; g.played = false; g.atk = null;
  for(var i = 0; i < RINGN; i++){
    var sl = g.ring[seat][i];
    if(sl){ sl.warm = false; sl.used = false; }
  }
  refillTo(g, seat, emit);
  g.turnCount++;
  if(g.turnCount > TURN_GUARD){
    g.over = true;
    g.winner = g.hp[0] > g.hp[1] ? 0 : g.hp[1] > g.hp[0] ? 1
             : ringSum(g, 0) >= ringSum(g, 1) ? 0 : 1;   /* stall: HP then ring */
  }
}
function resolveAttackEnd(g){
  var by = g.atk.by;
  g.atk = null; g.phase = 'main'; g.turn = by;
}

      var seat = (dealer + 1 + s) % 2, c = g.decks[seat].pop();
      g.hands[seat].push(c); g.dealSeq.push({c:c, seat:seat});
    }
    return g;
  },
  legal:function(g, seat, a){
    if(g.over || !a || seat !== g.turn) return false;
    var hand = g.hands[seat];
    if(g.phase === 'block'){
      if(a.a === 'noblock') return true;
      if(a.a === 'block') return a.slot >= 0 && a.slot < RINGN && !!g.ring[seat][a.slot];
      return false;
    }
    if(a.a === 'end') return true;
    if(a.a === 'playchar'){
      if(g.played || hand.indexOf(a.card) < 0) return false;
      if(!(a.slot >= 0 && a.slot < RINGN) || g.ring[seat][a.slot]) return false;
      return cardOf(g, a.card).kind === 'char';
    }
    if(a.a === 'backup'){
      if(hand.indexOf(a.card) < 0) return false;
      var tgt = g.ring[seat][a.slot];
      if(!tgt || tgt.backs.length >= BK_MAX) return false;
      var hc = cardOf(g, a.card);
      return hc.kind === 'char' && cardOf(g, tgt.c).backs.indexOf(hc.id) >= 0;
    }
    if(a.a === 'action'){
      if(hand.indexOf(a.card) < 0) return false;
      var e = cardOf(g, a.card);
      if(e.kind !== 'act' || g.sp[seat] < e.cost) return false;
      if(e.fx === 'mend') return hurtAlly(g, seat) >= 0;
      if(e.fx === 'rally') return ringSum(g, seat) > 0;
      if(e.fx === 'draw2') return g.decks[seat].length > 0;
      if(e.fx === 'crush') return smallestFoe(g, seat) >= 0;
      return true;                                /* fire + sabo always land somewhere */
    }
    if(a.a === 'attack'){
      if(!a.slots || !a.slots.length || a.slots.length > RINGN) return false;
      var seen = {};
      for(var i = 0; i < a.slots.length; i++){
        var ix = a.slots[i], sl = g.ring[seat][ix];
        if(seen[ix] || !sl || sl.warm || sl.used) return false;
        seen[ix] = 1;
      }
      return g.sp[seat] >= UNITED[a.slots.length];
    }
    return false;
  },
  apply:function(g, seat, a, emit){
    var hand = g.hands[seat];
    if(a.a === 'playchar'){
      hand.splice(hand.indexOf(a.card), 1);
      var e = cardOf(g, a.card);
      g.ring[seat][a.slot] = {c:a.card, cur:e.bp, max:e.bp, backs:[], warm:e.kw !== 'RUSH', used:false};
      g.played = true;
      g.sp[seat] += e.sp;
      emit({e:'play', seat:seat, card:a.card});
      emit({e:'fx', snd:'chip', msg:e.name + ' ENTERS' + (e.kw === 'RUSH' ? ' WITH RUSH' : ''), hold:340});
      if(e.spark){
        var f = biggestFoe(g, seat);
        emit({e:'fx', snd:'thud', msg:'SPARK ' + e.spark, buzz:12, hold:380});
        if(f >= 0) dmgChar(g, foeOf(seat), f, e.spark, emit);
        else hitHP(g, foeOf(seat), e.spark, emit);
      }
      return;
    }
    if(a.a === 'backup'){
      hand.splice(hand.indexOf(a.card), 1);
      var sl = g.ring[seat][a.slot];
      sl.backs.push(a.card); sl.max += BK_BP; sl.cur += BK_BP;
      emit({e:'lay', seat:seat, card:a.card, meld:a.slot});
      emit({e:'fx', msg:'+' + BK_BP + ' BP BACKUP', hold:280});
      return;
    }
    if(a.a === 'action'){
      hand.splice(hand.indexOf(a.card), 1);
      g.kos[seat].push(a.card);                   /* spent actions rest in the KO pile */
      var act = cardOf(g, a.card);
      g.sp[seat] -= act.cost;
      emit({e:'fx', snd:'meld', msg:act.name + '!', hold:420});
      var f2;
      if(act.fx === 'fire'){
        f2 = biggestFoe(g, seat);
        if(f2 >= 0) dmgChar(g, foeOf(seat), f2, 400, emit);
        else hitHP(g, foeOf(seat), 200, emit);
      } else if(act.fx === 'mend'){
        f2 = hurtAlly(g, seat);
        var m = g.ring[seat][f2];
        m.cur = Math.min(m.max, m.cur + 400);
      } else if(act.fx === 'rally'){
        for(var i = 0; i < RINGN; i++) if(g.ring[seat][i]){ g.ring[seat][i].cur += 100; g.ring[seat][i].max += 100; }
      } else if(act.fx === 'draw2'){
        drawOne(g, seat, emit); drawOne(g, seat, emit);
      } else if(act.fx === 'sabo'){
        g.sp[foeOf(seat)] = Math.max(0, g.sp[foeOf(seat)] - 200);
        g.sp[seat] += 100;
      } else if(act.fx === 'crush'){
        f2 = smallestFoe(g, seat);
        koSlot(g, foeOf(seat), f2, emit);
      }
      return;
    }
    if(a.a === 'attack'){
      var bp = 0;
      for(var k = 0; k < a.slots.length; k++){
        var asl = g.ring[seat][a.slots[k]];
        asl.used = true; bp += asl.cur;
      }
      g.sp[seat] -= UNITED[a.slots.length];
      g.atk = {by:seat, slots:a.slots.slice(), bp:bp};
      g.phase = 'block'; g.turn = foeOf(seat);
      emit({e:'fx', snd:'swish', msg:'INCOMING ' + bp + ' BP', buzz:10, hold:420});
      return;
    }
    if(a.a === 'block'){
      var atk = g.atk, def = seat;
      var bl = g.ring[def][a.slot];
      var ret = bl.cur;
      var take = atk.bp - (cardOf(g, bl.c).kw === 'GUARD' ? 200 : 0);
      if(take < 0) take = 0;
      emit({e:'fx', snd:'thud', msg:cardOf(g, bl.c).name + ' BLOCKS', buzz:24, hold:520});
      dmgChar(g, def, a.slot, take, emit);
      var lead = g.ring[atk.by][atk.slots[0]];
      if(lead) dmgChar(g, atk.by, atk.slots[0], ret, emit);
      resolveAttackEnd(g);
      return;
    }
    if(a.a === 'noblock'){
      var amt = g.atk.bp;
      resolveAttackEnd(g);
      hitHP(g, seat, amt, emit);
      return;
    }
    if(a.a === 'end'){
      startTurn(g, foeOf(seat), emit);
    }
  },

    if(!STATE.setup.gopts) STATE.setup.gopts = {deck:'royal'};
    drawText(ctx, 'YOUR DECK', x + 12, y, 1, PAL.brassLo);
    chip(x + 12, y + 14, (pw - 34) / 2, 'ROYAL GUARD', 'gopt:royal', STATE.setup.gopts.deck === 'royal');
    chip(x + 22 + (pw - 34) / 2, y + 14, (pw - 34) / 2, 'GOBLIN TIDE', 'gopt:goblin', STATE.setup.gopts.deck === 'goblin');
    drawText(ctx, 'DROP THEIR ' + HP0 + ' HP TO ZERO', x + 12, y + 48, 1, PAL.dim);
  },
  onSetupTap:function(v){ STATE.setup.gopts = {deck:v === 'goblin' ? 'goblin' : 'royal'}; },
  /* v1.04: the online lobby. Each seat picks its own starter (a mirror match is
     allowed); an unpicked host plays ROYAL GUARD and an unpicked guest the other
     deck, which is v1.03's online behaviour. */
  lobbyRow:function(x, y, pw, opts, seat){
    var mine = clashLobbyDecks(opts)[seat];
    drawText(ctx, 'YOUR DECK', x + 12, y, 1, PAL.brassLo);
    chip(x + 12, y + 14, (pw - 34) / 2, 'ROYAL GUARD', 'lopt:royal', mine === 'royal');
    chip(x + 22 + (pw - 34) / 2, y + 14, (pw - 34) / 2, 'GOBLIN TIDE', 'lopt:goblin', mine === 'goblin');
  },
  lobbyLabel:function(opts, i){ return i < 2 ? DECKS[clashLobbyDecks(opts)[i]].name : ''; },
  lobbyOpts:function(opts){ var d = clashLobbyDecks(opts); return {deck:d[0], decks:d}; },
  bot:function(g, seat, diff){
    var hand = g.hands[seat], i, sl;
    if(g.phase === 'block'){
      var atk = g.atk.bp, opts = [];
      for(i = 0; i < RINGN; i++) if(g.ring[seat][i]) opts.push(i);
      if(!opts.length) return {a:'noblock'};
      var lethal = g.hp[seat] - atk <= 0;
      var lead = g.ring[g.atk.by][g.atk.slots[0]];
      var best = -1, bestScore = -1e9;
      for(i = 0; i < opts.length; i++){
        sl = g.ring[seat][opts[i]];
        var guard = cardOf(g, sl.c).kw === 'GUARD' ? 200 : 0;
        var survives = sl.cur - Math.max(0, atk - guard) > 0;
        var kills = lead && sl.cur >= lead.cur;
        var sc = (survives ? 500 : 0) + (kills ? 300 : 0) - sl.cur * 0.1;
        if(sc > bestScore){ bestScore = sc; best = opts[i]; }
      }
      if(lethal) return {a:'block', slot:best};
      if(diff === 0) return uiRnd() < 0.5 ? {a:'block', slot:opts[Math.floor(uiRnd()*opts.length)]} : {a:'noblock'};
      if(bestScore >= 500 || atk >= 500) return {a:'block', slot:best};
      return {a:'noblock'};
    }
    /* main: field, back up, spend, strike, end */
    if(!g.played){
      var bestC = -1, bestBp = -1, slot = -1;
      for(i = 0; i < RINGN; i++) if(!g.ring[seat][i]){ slot = i; break; }
      if(slot >= 0){
        for(i = 0; i < hand.length; i++){
          var e = cardOf(g, hand[i]);
          if(e.kind === 'char' && (diff === 0 ? uiRnd() * 1000 : e.bp) > bestBp){
            bestBp = diff === 0 ? uiRnd() * 1000 : e.bp; bestC = hand[i];
          }
        }
        if(bestC >= 0) return {a:'playchar', card:bestC, slot:slot};
      }
    }
    if(diff > 0 || uiRnd() < 0.4){
      for(i = 0; i < hand.length; i++){
        var hc = cardOf(g, hand[i]);
        if(hc.kind !== 'char') continue;
        for(var t = 0; t < RINGN; t++){
          var tg = g.ring[seat][t];
          if(tg && tg.backs.length < BK_MAX && cardOf(g, tg.c).backs.indexOf(hc.id) >= 0)
            return {a:'backup', card:hand[i], slot:t};
        }
      }
    }
    var ready = readySlots(g, seat);
    var sum = 0;
    for(i = 0; i < ready.length; i++) sum += g.ring[seat][ready[i]].cur;
    if(ready.length && sum >= g.hp[foeOf(seat)] && g.sp[seat] >= UNITED[ready.length]){
      ready.sort(function(a2, b2){ return g.ring[seat][b2].cur - g.ring[seat][a2].cur; });
      return {a:'attack', slots:ready};
    }
    for(i = 0; i < hand.length; i++){
      var ac = cardOf(g, hand[i]);
      if(ac.kind !== 'act' || g.sp[seat] < ac.cost) continue;
      var bf = biggestFoe(g, seat), sf = smallestFoe(g, seat);
      if(diff === 0 && uiRnd() < 0.35) return {a:'action', card:hand[i]};
      if(diff === 0) continue;
      if(ac.fx === 'crush' && sf >= 0 && g.ring[foeOf(seat)][sf].cur >= 450) return {a:'action', card:hand[i]};
      if(ac.fx === 'fire' && bf >= 0 && g.ring[foeOf(seat)][bf].cur <= 400) return {a:'action', card:hand[i]};
      if(ac.fx === 'mend' && hurtAlly(g, seat) >= 0 && g.ring[seat][hurtAlly(g, seat)].max - g.ring[seat][hurtAlly(g, seat)].cur >= 300) return {a:'action', card:hand[i]};
      if(ac.fx === 'draw2' && hand.length <= 2 && g.decks[seat].length) return {a:'action', card:hand[i]};
      if(ac.fx === 'rally' && ringSum(g, seat) >= 700 && g.sp[seat] >= ac.cost + 200) return {a:'action', card:hand[i]};
      if(ac.fx === 'sabo' && diff === 2 && g.sp[foeOf(seat)] >= 300) return {a:'action', card:hand[i]};
    }
    if(ready.length){
      var foeBest = biggestFoe(g, seat);
      var foeBp = foeBest >= 0 ? g.ring[foeOf(seat)][foeBest].cur : 0;
      ready.sort(function(a3, b3){ return g.ring[seat][b3].cur - g.ring[seat][a3].cur; });
      var lead2 = g.ring[seat][ready[0]].cur;
      if(diff === 0){ if(uiRnd() < 0.7) return {a:'attack', slots:[ready[0]]}; }
      else if(diff === 1){
        if(ready.length >= 2 && g.sp[seat] >= UNITED[ready.length] && (foeBp === 0 || sum >= foeBp + 300))
          return {a:'attack', slots:ready};
        return {a:'attack', slots:[ready[0]]};
      } else {
        if(foeBp === 0 || lead2 + 200 >= foeBp || g.hp[foeOf(seat)] <= 600)
          return {a:'attack', slots:[ready[0]]};
        if(ready.length >= 2 && g.sp[seat] >= UNITED[2] && sum >= foeBp + 200)
          return {a:'attack', slots:ready.slice(0, 2)};
      }
    }
    return {a:'end'};
  },
  fallback:function(g, seat){
    return g.phase === 'block' ? {a:'noblock'} : {a:'end'};
  },
  ctrl:{
    tapCard:function(id){
      if(inspect != null){ inspect = null; sfx('tick'); return; }
      if(STATE.g.hands[STATE.pov].indexOf(id) < 0) return;
      STATE.sel = STATE.sel[0] === id ? [] : [id];
      sfx('tick');
    },
    tapPile:function(){},
    tapMeld:function(k){
      if(inspect != null){ inspect = null; sfx('tick'); return; }
      syncSel();
      var g = STATE.g, s = Math.floor(k / 3), i = k % 3;
      if(k > 5) return;
      if(!isLocalTurn() || choreoBusy()){ return; }
      if(g.phase === 'block'){
        if(s === STATE.pov && g.ring[s][i]){ blockSel = blockSel === i ? -1 : i; sfx('tick'); }
        return;
      }
      if(s !== STATE.pov) return;
      var sl = g.ring[s][i];
      if(!sl){
        if(STATE.sel.length === 1 && cardOf(g, STATE.sel[0]).kind === 'char')
          tryLocalAction({a:'playchar', card:STATE.sel[0], slot:i});
        return;
      }
      if(STATE.sel.length === 1){
        var hc = cardOf(g, STATE.sel[0]);
        if(hc.kind === 'char' && cardOf(g, sl.c).backs.indexOf(hc.id) >= 0 && sl.backs.length < BK_MAX){
          tryLocalAction({a:'backup', card:STATE.sel[0], slot:i});
          return;
        }
      }
      if(!sl.warm && !sl.used){
        var k2 = mySel.indexOf(i);
        if(k2 >= 0) mySel.splice(k2, 1); else mySel.push(i);
        sfx('tick');
      } else sfx('denied');
    },
    buttons:function(){
      syncSel();
      var g = STATE.g;
      if(g.phase === 'block'){
        var bs = blockSel;
        return [
          {label:'BLOCK', en:bs >= 0, fire:function(){ if(inspect != null){ inspect = null; return; } var b = blockSel; blockSel = -1; tryLocalAction({a:'block', slot:b}); }},
          {label:'NO BLOCK', en:true, fire:function(){ if(inspect != null){ inspect = null; return; } tryLocalAction({a:'noblock'}); }}
        ];
      }
      var sel = STATE.sel, canCast = false;
      if(sel.length === 1){
        var e = cardOf(g, sel[0]);
        canCast = e && e.kind === 'act' && GAMES.clash.legal(g, g.turn, {a:'action', card:sel[0]});
      }
      var atkEn = mySel.length > 0 && g.sp[g.turn] >= UNITED[mySel.length];
      return [
        {label:'CAST', en:canCast, fire:function(){ if(inspect != null){ inspect = null; return; } tryLocalAction({a:'action', card:sel[0]}); }},
        {label:'ATTACK', en:atkEn, fire:function(){ if(inspect != null){ inspect = null; return; }
          var s2 = mySel.slice(); mySel = [];
          s2.sort(function(a4, b4){ return STATE.g.ring[STATE.g.turn][b4].cur - STATE.g.ring[STATE.g.turn][a4].cur; });
          tryLocalAction({a:'attack', slots:s2});
        }},
        {label:'END TURN', en:true, fire:function(){ if(inspect != null){ inspect = null; return; } tryLocalAction({a:'end'}); }}
      ];
    }
  }
});
})();
/*==== GAME:CLASH END ====*/

/*==== BOOT BEGIN ====*/
function init(){
  loadSet();
  fitCanvas();
  computeLayout();
  if(!HEADLESS) win.requestAnimationFrame(pump);
}
init();
/*==HOOK-SPLICE==*/
/*==== BOOT END ====*/
})();
</script>
