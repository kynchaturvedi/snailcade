<script>
(function () {
  'use strict';

  /* =================================================================
     CONSTANTS
     ================================================================= */
  var BUILD = 41;

  var LOGICAL_H = 448;
  var CAR_AW = 128, CAR_AH = 88, CAR_SCALE = 1.35;  // pixel-art car grid + on-screen upscale (v28: smaller)

  // Camera / projection
  var FIELD_OF_VIEW = 100;                 // degrees, wide for narrow portrait road
  var CAMERA_HEIGHT = 1180;                // chase cam, lowered for immersion (Director: drop behind the car)
  var CAMERA_DEPTH  = 1 / Math.tan((FIELD_OF_VIEW / 2) * Math.PI / 180);
  var DRAW_DISTANCE = 200;                 // segments rendered ahead
  var ROAD_WIDTH    = 4400;                // half-width of the road (v23: wider again, per Director; render scale only)

  var DRIFT_CHAIN_GRACE = 1.0;             // s to start another drift and keep the combo

  // Economy

  var CHECKPOINT_BONUS   = 14;             // seconds granted per checkpoint
  var CHECKPOINT_SPACING = 250;            // segments between checkpoints

  // Speed readout (mph) and the speed-limit combo
  var MAX_MPH        = 200;                // top-speed readout
  var LIMIT_PERFECT  = 4;                  // mph at/under the limit that scores the x3 band
  var LIMIT_WINDOW   = 12;                 // mph under the limit for the x2 band
  var SCORE_RATE     = 60;                 // base points per second inside a scoring zone
  var LIMIT_SPACING  = 240;                // segments between speed-limit signs (approx)

  // Police pursuit
  var POLICE_OVER      = 5;                // mph over the limit that provokes the police
  var POLICE_TRIGGER   = 3.0;              // s over the line before they appear
  var POLICE_GAP_MAX   = 38000;            // world units: spawn distance near the horizon
  var POLICE_CLOSE     = 6500;             // u/s the gap closes while you keep speeding
  var POLICE_OPEN      = 13000;            // u/s the gap opens while you comply
  var POLICE_COMPLY    = 2.5;              // s of compliance before they peel away
  var POLICE_BUST_TIME = 2.0;              // s a bust holds the car
  var POLICE_PENALTY   = 400;              // points lost in a bust
  var POLICE_COOLDOWN  = 3.0;              // s grace after a bust
  var MOUNTAIN_GROW_RATE = 0.000000275;    // Mt Rainier scales up very slowly (v11: quartered; was 0.0000011)
  var MOUNTAIN_GROW_MAX  = 0.55;           // it never arrives; the approach scale is capped here (v11: was 0.8)
  var PLACE_FLASH_TIME   = 3.5;            // s a location-name banner stays up on entry
  var DAY_LENGTH         = 300;            // seconds per full day -> night -> day cycle (v15: longer)
  var WEATHER_SEQ        = [0, 1, 0, 2];   // 0 clear, 1 rain, 0 clear, 2 snow (cycled)
  var WEATHER_DUR        = [48, 52, 38, 52]; // seconds spent in each step (v15: longer)
  var POLICE_ACTIVE    = false;            // v9: police dormant; the officer is kept for a future mechanic, not active enforcement

  /* =================================================================
     PALETTE
     ================================================================= */
  var COL = {
    GRASS_LIGHT: '#3f9a4e', GRASS_DARK:  '#368544',
    ROAD_LIGHT:  '#6d7280', ROAD_DARK:   '#646978',
    RUMBLE_A:    '#d23b3b', RUMBLE_B:    '#f4f4f4',
    RUMBLE_CP:   '#ffd24a', LANE:        '#f4f4f4',
    FOG:         '#cfe0ee',
    CANYON_HI:   '#7a5a3c', CANYON_LO:   '#2e2118', RIVER: '#5fa9c8',
    LAKE_HI:     '#62acdc', LAKE_LO:     '#2f6fa8', WATER_SUN: '#e2f3ff',
    TREE_FAR:    '#2c5a39', TREE_NEAR:   '#1f4a2e'
  };
  var SKY_BANDS = ['#2e6fb0','#3a79bb','#4a88c7','#5d99d3','#74acdf',
                   '#90c0e9','#aed3f1','#cfe6f8'];
  var SUN_BANDS = ['#fff3b0','#ffe27a','#ffc24a','#ff9a3c','#ff6b4a','#ff4d5e'];

  // Track shape vocabulary
  var LEN  = { S: 25, M: 50, L: 100 };
  var CRV  = { E: 2, M: 4, H: 5 };
  var HILL = { L: 30, M: 70, H: 130 };   // v17: roughly doubled for dramatic, steeper elevation

  /* =================================================================
     MODULE STATE
     ================================================================= */
  var STATE = 'title';            // 'title' | 'play' | 'paused' | 'over'
  var lastError = null;
  var segments = [];
  var zones = [];
  var limits = [];
  var trackLength = 0;
  var G = null;                   // game state object

  var bestTime = 0;               // PARADISE RUN best finish time (seconds)
  var gameMode = 'standard';      // 'standard' (endless loop) | 'paradise' (finite point-to-point)
  var builtMode = null;           // which mode the current track was built for
  var finishZ = Infinity;         // world Z of the PARADISE finish line (finite mode only)
  var TITLE_BTN = {
    standard: { x: 48, y: 250, w: 160, h: 30 },
    paradise: { x: 48, y: 288, w: 160, h: 30 }
  };
  var input = { steer: 0, throttle: null, brake: 0, driftDir: 0 };
  var canvas = null, ctx = null, pauseBtn = null, mapBtn = null;
  var mapOpen = false, mapPath = null, mapPOI = null, mapBounds = null;
  var bgOffset = 0;
  var bgBuffer = null, bgBufCtx = null;   // offscreen, for feathering zone-landmark edges
  var animClock = 0;
  var carBuf = null, carBufCtx = null;    // (legacy) offscreen buffer for the old vector car sprite
  var carArt = null, carArtCtx = null;    // pixel-art car: art buffer painted in blocks, scaled up (v26)
  var bgWeights = { forest: 1, lake: 0, ravine: 0, alpine: 0 };
  var last = 0;
  var renderBaseIndex = 0;
  var _lakeStrength = 0, _bgPan = 0;   // reflection is drawn after the road, over the lake water plane
  var uiSticks = { left: null, right: null };

  /* =================================================================
     UTILITIES (pure)
     ================================================================= */
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function interpolate(a, b, p) { return a + (b - a) * p; }
  function easeIn(a, b, p) { return a + (b - a) * Math.pow(p, 2); }
  function easeOut(a, b, p) { return a + (b - a) * (1 - Math.pow(1 - p, 2)); }
  function easeInOut(a, b, p) { return a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5); }
  function exponentialFog(d, density) { return 1 / Math.pow(Math.E, d * d * density); }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* =================================================================
     PROJECTION (pure math; writes into the point's camera/screen)
     ================================================================= */
  function project(p, camX, camY, camZ, W, H) {
    p.camera.x = (p.world.x || 0) - camX;
    p.camera.y = (p.world.y || 0) - camY;
    p.camera.z = (p.world.z || 0) - camZ;
    p.screen.scale = CAMERA_DEPTH / p.camera.z;
    p.screen.x = Math.round((W / 2) + (p.screen.scale * p.camera.x * W / 2));
    p.screen.y = Math.round((H / 2) - (p.screen.scale * p.camera.y * H / 2));
    p.screen.w = Math.round((p.screen.scale * ROAD_WIDTH * W / 2));
  }

  /* =================================================================
     TRACK BUILD (deterministic; no runtime RNG)
     ================================================================= */
  function lastY() {
    return segments.length === 0 ? 0 : segments[segments.length - 1].p2.world.y;
  }

  function addSegment(curve, y) {
    var n = segments.length;
    var even = Math.floor(n / RUMBLE_LENGTH) % 2;
    segments.push({
      index: n,
      p1: { world: { y: lastY(), z: n * SEGMENT_LENGTH }, camera: {}, screen: {} },
      p2: { world: { y: y, z: (n + 1) * SEGMENT_LENGTH }, camera: {}, screen: {} },
      curve: curve,
      sprites: [], biome: 'forest', cliff: 0, wall: 0, place: '', tunnel: 0, bridge: 0,
      looped: false, fog: 1, clip: LOGICAL_H,
      color: {
        road:   even ? COL.ROAD_LIGHT  : COL.ROAD_DARK,
        grass:  even ? COL.GRASS_LIGHT : COL.GRASS_DARK,
        rumble: even ? COL.RUMBLE_A    : COL.RUMBLE_B,
        lane:   even ? COL.LANE        : null
      }
    });
  }

  function addRoad(enter, hold, leave, curve, y) {
    var startY = lastY();
    var endY = startY + y * SEGMENT_LENGTH;
    var total = enter + hold + leave, n;
    for (n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
    for (n = 0; n < hold; n++)  addSegment(curve,                       easeInOut(startY, endY, (enter + n) / total));
    for (n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
  }

  function addStraight(num) { num = num || LEN.M; addRoad(num, num, num, 0, 0); }
  function addHill(num, height) { num = num || LEN.M; height = (height === undefined ? HILL.M : height); addRoad(num, num, num, 0, height); }
  function addCurve(num, curve, height) {
    num = num || LEN.M; curve = (curve === undefined ? CRV.M : curve); height = (height === undefined ? 0 : height);
    addRoad(num, num, num, curve, height);
  }
  function addSCurve() {
    addRoad(LEN.M, LEN.M, LEN.M, -CRV.E, 0);
    addRoad(LEN.M, LEN.M, LEN.M,  CRV.M, HILL.M);
    addRoad(LEN.M, LEN.M, LEN.M,  CRV.E, -HILL.L);
    addRoad(LEN.M, LEN.M, LEN.M, -CRV.M, HILL.M);
    addRoad(LEN.M, LEN.M, LEN.M,  CRV.E, 0);
  }

  function decorate() {
    var rng = mulberry32(1337);
    var n = 8;
    while (true) {
      var look = segments[n] ? (segments[n].biome || 'forest') : 'forest';
      var step = (look === 'forest') ? (1 + Math.floor(rng() * 2))
               : (look === 'lake')   ? (5 + Math.floor(rng() * 8))
               :                       (3 + Math.floor(rng() * 6));
      n += step;
      if (n >= segments.length - 2) break;
      var seg = segments[n];
      var b = seg.biome || 'forest';
      var snowy = (b === 'alpine');
      if (b === 'lake') continue;                  // open water: keep the lake clear of roadside props (trees, signs, flowers)

      // PARADISE: a subalpine wildflower meadow under the mountain
      if (seg.place === 'PARADISE') {
        for (var pf = -1; pf <= 1; pf += 2) {
          if (rng() < 0.92) seg.sprites.push({ source: 'flower', offset: pf * (1.0 + rng() * 0.5), hue: Math.floor(rng() * 4) });
          if (rng() < 0.55) seg.sprites.push({ source: 'flower', offset: pf * (1.4 + rng() * 0.8), hue: Math.floor(rng() * 4) });
        }
        if (rng() < 0.30) seg.sprites.push({ source: 'tree', offset: (rng() < 0.5 ? -1 : 1) * (1.7 + rng() * 0.6), scale: 0.8 + rng() * 0.4, snowy: false });
        continue;
      }

      // RAVINE: a dense, tall wall of rock pillars opposite the gorge (guard rail drawn in the road pass)
      if (b === 'ravine' && seg.cliff) {
        seg.sprites.push({ source: 'rockpillar', offset: -seg.cliff * (1.0 + rng() * 0.04), scale: 1.35 + rng() * 0.5, variant: Math.floor(rng() * 3) });
        seg.sprites.push({ source: 'rockpillar', offset: -seg.cliff * (1.5 + rng() * 0.30), scale: 2.1 + rng() * 1.2, variant: Math.floor(rng() * 3) });
        if (rng() < 0.6) seg.sprites.push({ source: 'rockpillar', offset: -seg.cliff * (1.95 + rng() * 0.4), scale: 2.5 + rng() * 1.3, variant: Math.floor(rng() * 3) });
        continue;
      }

      // FOREST: an enclosing corridor of layered trees, tall behind and small crowding the verge
      if (b === 'forest') {
        for (var sgn = -1; sgn <= 1; sgn += 2) {
          if (rng() < 0.92) seg.sprites.push({ source: 'tree', offset: sgn * (1.55 + rng() * 1.0), scale: 1.25 + rng() * 0.7, snowy: false });
          if (rng() < 0.85) seg.sprites.push({ source: 'tree', offset: sgn * (1.02 + rng() * 0.16), scale: 0.5 + rng() * 0.35, snowy: false });
        }
        if (rng() < 0.40) seg.sprites.push({ source: 'tree', offset: (rng() < 0.5 ? -1 : 1) * (1.25 + rng() * 0.3), scale: 0.9 + rng() * 0.3, snowy: false });
        if (rng() < 0.28) seg.sprites.push({ source: 'flower', offset: (rng() < 0.5 ? -1 : 1) * (1.0 + rng() * 0.1), hue: Math.floor(rng() * 4) });
        continue;
      }

      // LAKE / ALPINE / generic
      var near = (b === 'lake') ? 1.7 : 1.2;
      var second = (b === 'lake') ? 0.0 : (b === 'alpine') ? 0.5 : 0.45;
      var side = rng() < 0.5 ? -1 : 1;
      var src = rng() < ((b === 'lake') ? 0.08 : 0.05) ? 'sign' : 'tree';
      seg.sprites.push({ source: src, offset: side * (near + rng() * 1.5), scale: 0.9 + rng() * 0.5, snowy: snowy });
      if (rng() < second) seg.sprites.push({ source: 'tree', offset: -side * (near + rng() * 1.4), scale: 1.0 + rng() * 0.6, snowy: snowy });
      if (b === 'lake' && rng() < 0.22) seg.sprites.push({ source: 'flower', offset: (rng() < 0.5 ? -1 : 1) * (1.0 + rng() * 0.1), hue: Math.floor(rng() * 4) });
    }

    // WARNING CHEVRONS at the onset of sharp curves, on the outside of the bend
    var prevMag = 0;
    for (var s2 = 4; s2 < segments.length - 14; s2++) {
      var c = segments[s2].curve, mag = c < 0 ? -c : c;
      if (mag >= 3.2 && prevMag < 3.2 && (segments[s2].biome || '') !== 'lake') {
        var dir = c > 0 ? 1 : -1;
        for (var q = 0; q < 3; q++) {
          var si = s2 + q * 5;
          if (si < segments.length - 2) segments[si].sprites.push({ source: 'chevron', offset: -dir * 1.3, dir: dir });
        }
      }
      prevMag = mag;
    }
  }

  // Speed-limit signs along the lap, posted mph keyed to the biome (tight in the
  // gorge, open by the lake). Each sign is also a roadside sprite carrying its number.
  function placeSpeedLimits() {
    limits = [];
    var rng = mulberry32(909);
    var seg = 40;
    while (seg < segments.length - 4) {
      var b = segments[seg].biome || 'forest';
      var mph;
      if (b === 'ravine')      mph = 40 + Math.floor(rng() * 2) * 5;   // 40 / 45
      else if (b === 'forest') mph = 50 + Math.floor(rng() * 3) * 5;   // 50 / 55 / 60
      else if (b === 'alpine') mph = 55 + Math.floor(rng() * 3) * 5;   // 55 / 60 / 65
      else                     mph = 65 + Math.floor(rng() * 4) * 5;   // 65..80 (lake / open)
      if (b !== 'lake') {                               // no speed signs standing in the open water
        limits.push({ seg: seg, mph: mph });
        segments[seg].sprites.push({ source: 'limit', offset: 1.25, mph: mph });
      }
      seg += LIMIT_SPACING + Math.floor(rng() * 40) - 20;
    }
  }

  // GEARED acceleration (v21): the accel multiplier depends on the speed band, so low gears pull
  // hard and the top gear barely pulls. 5 gears; boundaries as fractions of top speed.
  var GEAR_BANDS = [0.22, 0.42, 0.62, 0.82];           // speedPercent splits between gears 1-2 .. 4-5
  var GEAR_ACCEL = [2.3, 1.8, 1.2, 0.82, 0.5];          // accel multiplier per gear (v23: punchier)
  function gearIndex(sp) { var i = 0; while (i < GEAR_BANDS.length && sp >= GEAR_BANDS[i]) i++; return i; }
  function accelMul(sp) { return GEAR_ACCEL[gearIndex(sp)]; }

  function mphForSpeed(spd) { return spd / MAX_SPEED * MAX_MPH; }
  function speedForMph(m)   { return m / MAX_MPH * MAX_SPEED; }

  // The posted limit in force at the player's position. Before the first sign the last
  // sign of the lap carries over the seam.
  function currentLimitMph() {
    if (!G || limits.length === 0) return 0;
    var pseg = Math.floor(G.position / SEGMENT_LENGTH);
    var best = limits[limits.length - 1].mph;
    for (var i = 0; i < limits.length; i++) {
      if (limits[i].seg <= pseg) best = limits[i].mph; else break;
    }
    return best;
  }

  function addZone(biome, builder, place) {
    var s = segments.length;
    builder();
    for (var i = s; i < segments.length; i++) { segments[i].biome = biome; if (place) segments[i].place = place; }
    zones.push({ biome: biome, start: s, end: segments.length, place: place || '' });
  }

  // A national-park lap. Elevation is balanced to net ~0 so the loop seam
  // is flat; within it the climbs and descents are deliberately large.
  function buildTrack() {
    segments = [];
    zones = [];

    // 1) FOREST: rolling climb out of the trees (net ~ +8000)
    addZone('forest', function () {
      addStraight(LEN.S);
      addHill(LEN.M, HILL.L);
      addCurve(LEN.M, CRV.M, HILL.L);
      addCurve(LEN.L, -CRV.M, HILL.L);
      addHill(LEN.S, -HILL.L);
      addStraight(LEN.S);
    });

    // 2) LAKE: open shoreline, gentle and flat, long sweeping curves (net 0)
    addZone('lake', function () {
      addCurve(LEN.L, CRV.M, 0);
      addStraight(LEN.M);
      addCurve(LEN.L, -CRV.E, HILL.L);
      addHill(LEN.M, -HILL.L);
      addStraight(LEN.S);
    }, 'REFLECTION LAKE');

    // 3) RAVINE: a plunging, twisting descent along a gorge (net ~ -16000)
    var rs = segments.length;
    addZone('ravine', function () {
      addCurve(LEN.M, CRV.H, -HILL.M);
      addCurve(LEN.M, -CRV.M, -HILL.L);
      addCurve(LEN.L, CRV.H, -HILL.M);
      addCurve(LEN.M, -CRV.H, HILL.L);
    });
    for (var ci = rs; ci < segments.length; ci++) { segments[ci].cliff = 1; } // gorge on the right; forested slope on the left

    // 3.5) PARADISE: a subalpine wildflower meadow under the mountain (gentle)
    addZone('alpine', function () {
      addStraight(LEN.S);
      addHill(LEN.M, HILL.M);
      addCurve(LEN.M, -CRV.E, HILL.L);
    }, 'PARADISE');

    // 4) ALPINE -> SUNRISE: a hard climb to the high point, then a crest (net ~ +20000)
    addZone('alpine', function () {
      addRoad(LEN.M, LEN.S, LEN.M, 0, HILL.H);   // steep crest: the road climbs sharply and drops out of sight over the top
      addCurve(LEN.M, CRV.M, HILL.M);
      addCurve(LEN.L, -CRV.M, HILL.L);
      addHill(LEN.M, -HILL.L);
      addStraight(LEN.S);
    }, 'SUNRISE');

    // 5) FOREST: a winding descent back toward the start (net ~ -12000)
    addZone('forest', function () {
      addCurve(LEN.L, CRV.H, -HILL.M);
      addCurve(LEN.M, -CRV.M, -HILL.L);
      addCurve(LEN.M, CRV.E, -HILL.L);
      addHill(LEN.S, HILL.L);
      addStraight(LEN.M);
    });

    // ease any residual elevation back to flat for a clean loop seam
    var resetY = -lastY() / SEGMENT_LENGTH;
    addRoad(LEN.M, LEN.M, LEN.M, 0, resetY);

    // pad to a multiple of CHECKPOINT_SPACING and at least 4 checkpoint blocks
    var padBiome = segments.length ? (segments[segments.length - 1].biome || 'forest') : 'forest';
    while (segments.length % CHECKPOINT_SPACING !== 0 || segments.length < CHECKPOINT_SPACING * 4) {
      addSegment(0, lastY());
      segments[segments.length - 1].biome = padBiome;
    }

    if (zones.length) zones[zones.length - 1].end = segments.length;  // last zone covers the seam pad
    decorate();
    placeSpeedLimits();
    finishZ = Infinity;                              // the endless track never finishes
    computeShore();
    trackLength = segments.length * SEGMENT_LENGTH;
  }

  // PARADISE RUN: a finite, faithful drive from the Stevens Canyon ticket booth up to
  // Paradise, in the real landmark order. Lengthened and exaggerated so it is fast and fun.
  // Per-segment shoreline value (0 = grass, 1 = open water). Ramps in over the ends of each
  // lake run so the water meets the land as a shore, not a hard edge.
  function computeShore() {
    for (var i = 0; i < segments.length; i++) segments[i].shore = 0;
    var j = 0, N = segments.length, fade = 14;
    while (j < N) {
      if (segments[j].biome === 'lake') {
        var s = j; while (j < N && segments[j].biome === 'lake') j++;
        for (var k = s; k < j; k++) segments[k].shore = clamp(Math.min(k - s, j - 1 - k) / fade, 0, 1);
      } else j++;
    }
  }

  function buildParadiseTrack() {
    segments = [];
    zones = [];
    addZone('forest', function () {                 // the ticket booth and the long climb out of the trees
      addStraight(LEN.M);
      addStraight(LEN.M);
      addHill(LEN.M, HILL.L);
      addCurve(LEN.L, CRV.M, HILL.L);
      addCurve(LEN.L, -CRV.M, HILL.M);
      addHill(LEN.M, HILL.L);
    }, 'STEVENS CANYON ENTRANCE');
    addZone('forest', function () {                 // deep Ohanapecosh old-growth, climbing (longer)
      addCurve(LEN.L, -CRV.M, HILL.L);
      addHill(LEN.M, HILL.M);
      addCurve(LEN.L, CRV.H, HILL.L);
      addStraight(LEN.L);
      addCurve(LEN.M, -CRV.M, HILL.L);
      addStraight(LEN.M);
    }, 'OHANAPECOSH FOREST');
    var boxS = segments.length;                     // Box Canyon: a plunge, a bridge over the slot, a hard turn
    addZone('ravine', function () {
      addCurve(LEN.M, CRV.H, -HILL.M);
      addStraight(LEN.S);
      addCurve(LEN.M, -CRV.H, HILL.L);
    }, 'BOX CANYON');
    var boxE = segments.length;
    for (var bxi = boxS; bxi < boxE; bxi++) segments[bxi].cliff = 1;
    var stvS = segments.length;                     // Stevens Canyon: the long gorge shelf (longer), falls + a tunnel
    addZone('ravine', function () {
      addCurve(LEN.L, CRV.H, -HILL.M);
      addCurve(LEN.M, -CRV.M, -HILL.L);
      addCurve(LEN.L, CRV.H, HILL.L);
      addStraight(LEN.M);
      addCurve(LEN.M, -CRV.H, -HILL.L);
      addCurve(LEN.L, CRV.M, HILL.M);
      addCurve(LEN.L, -CRV.M, -HILL.L);
      addCurve(LEN.M, CRV.H, HILL.L);
    }, 'STEVENS CANYON');
    var stvE = segments.length;
    for (var sti = stvS; sti < stvE; sti++) segments[sti].cliff = 1;
    var lakS = segments.length;                     // Reflection Lakes: a calm lakefront drive, then the road swings away
    addZone('lake', function () {
      addStraight(LEN.M);                             // arrive along the shore
      addCurve(LEN.L, CRV.E, 0);                      // gently hug the still water
      addStraight(LEN.L);                             // the lakefront straight, mountain mirrored ahead
      addCurve(LEN.M, -CRV.E, 0);                     // ease the other way, still by the water
      addStraight(LEN.M);                             // last calm stretch
      addCurve(LEN.M, CRV.M, 0);                       // the road turns away from the lake on the flat; the lake scrolls out (climb comes later)
    }, 'REFLECTION LAKES');
    var lakE = segments.length;
    addZone('alpine', function () {                 // Inspiration Point: a crest with the mountain laid out ahead
      addRoad(LEN.M, LEN.S, LEN.M, 0, HILL.M);
      addCurve(LEN.M, CRV.M, -HILL.L);
      addStraight(LEN.M);
    }, 'INSPIRATION POINT');
    addZone('alpine', function () {                 // Paradise Valley: the hard switchback climb (longer)
      addCurve(LEN.M, CRV.H, HILL.M);
      addCurve(LEN.M, -CRV.H, HILL.M);
      addCurve(LEN.M, CRV.H, HILL.L);
      addCurve(LEN.M, -CRV.H, HILL.M);
      addRoad(LEN.M, LEN.S, LEN.M, 0, HILL.H);
    }, 'PARADISE VALLEY');
    var parS = segments.length;                     // PARADISE: the wildflower meadow under the mountain; the finish
    addZone('alpine', function () {
      addStraight(LEN.M);
      addHill(LEN.S, HILL.L);
      addStraight(LEN.M);
      addStraight(LEN.M);
      addStraight(LEN.S);
    }, 'PARADISE');
    var finishSeg = segments.length - 8;
    finishZ = finishSeg * SEGMENT_LENGTH;
    for (var pad = 0; pad < 90; pad++) {
      addSegment(0, lastY());
      segments[segments.length - 1].biome = 'alpine';
      segments[segments.length - 1].place = 'PARADISE';
    }
    if (zones.length) zones[zones.length - 1].end = segments.length;
    decorate();
    placeSpeedLimits();

    // --- landmark set pieces (placed after decoration so they sit on top) ---
    segments[80].sprites.push({ source: 'parksign', offset: -1.15 });           // entrance park sign (after a long lead-in)
    segments[130].sprites.push({ source: 'booth', offset: 1.05 });              // ranger booth, well into the approach
    for (var bri = boxS; bri < boxE; bri++) {                                    // Box Canyon: bridge parapets both edges
      segments[bri].sprites.push({ source: 'bridgerail', offset: -1.02 });
      segments[bri].sprites.push({ source: 'bridgerail', offset: 1.02 });
      segments[bri].bridge = 1;
    }
    segments[boxS].sprites.push({ source: 'bridgegate', offset: 0 });
    if (boxE - 1 > boxS) segments[boxE - 1].sprites.push({ source: 'bridgegate', offset: 0 });
    var fallA = stvS + Math.floor((stvE - stvS) * 0.28);                         // Stevens Canyon waterfalls (cliff side = left)
    var fallB = stvS + Math.floor((stvE - stvS) * 0.70);
    segments[fallA].sprites.push({ source: 'waterfall', offset: -1.55, scale: 1.0 });
    segments[fallB].sprites.push({ source: 'waterfall', offset: -1.9, scale: 1.35 });
    var tunS = stvS + Math.floor((stvE - stvS) * 0.46);                          // a longer rock tunnel (v35)
    var tunE = Math.min(stvE - 1, tunS + 34);
    for (var tni = tunS; tni < tunE; tni++) segments[tni].tunnel = 1;
    segments[tunS].sprites.push({ source: 'tunnel', offset: 0 });
    segments[tunE].sprites.push({ source: 'tunnel', offset: 0 });
    segments[parS + 10].sprites.push({ source: 'lodge', offset: -1.2 });         // Paradise Inn, on the meadow cruise
    segments[parS + 24].sprites.push({ source: 'visitorcenter', offset: 1.2 });  // visitor center, further along
    segments[finishSeg].sprites.push({ source: 'finish', offset: 0 });           // finish banner

    computeShore();
    trackLength = segments.length * SEGMENT_LENGTH;
  }

  function buildForMode() {
    if (gameMode === 'paradise') buildParadiseTrack(); else buildTrack();
    builtMode = gameMode;
    computeMapPath();
  }

  function findSegment(z) {
    if (segments.length === 0) return null;
    return segments[Math.floor(z / SEGMENT_LENGTH) % segments.length];
  }

  /* =================================================================
     GAME STATE TRANSITIONS
     ================================================================= */
  function resetGame() {
    buildForMode();
    G = {
      position: 0, playerX: 0, speed: 0, distance: 0,
      time: START_TIME, checkpointsPassed: 0, cpFlash: 0, steer: 0, place: '', placeCur: '', placeFlash: 0,
      prevSteer: 0,
      driftActive: false, driftDir: 0, driftTime: 0, comboTime: 0,
      chainGrace: 0, driftFlash: 0, driftBanked: 0,
      prevPlayerX: 0, latVel: 0, skid: 0, skidBraking: false, trail: [], brakeHeld: 0, prevBrake: false,
      curLimit: 0, mountainGrow: 0,
      tod: 0.30, weather: 0, weatherIdx: 0, weatherTimer: 20, wet: 0, snowCover: 0,
      police: { state: 'off', gap: 0, timer: 0, overTimer: 0, cooldown: 0, siren: 0 },
      finite: (gameMode === 'paradise'), finished: false, runTime: 0
    };
    STATE = 'title';
    lastError = null;
  }

  function startGame() {
    if (!G) resetGame();
    if (builtMode !== gameMode) buildForMode();
    G.position = 0; G.playerX = 0; G.speed = 0; G.distance = 0;
    G.time = START_TIME; G.checkpointsPassed = 0; G.cpFlash = 0; G.steer = 0;
    G.place = ''; G.placeCur = ''; G.placeFlash = 0;
    G.prevSteer = 0;
    G.driftActive = false; G.driftDir = 0; G.driftTime = 0; G.comboTime = 0;
    G.chainGrace = 0; G.driftFlash = 0; G.driftBanked = 0;
    G.prevPlayerX = 0; G.latVel = 0; G.skid = 0; G.skidBraking = false; G.trail = []; G.brakeHeld = 0; G.prevBrake = false;
    G.curLimit = 0; G.mountainGrow = 0;
    G.finite = (gameMode === 'paradise'); G.finished = false; G.runTime = 0;
    if (G.finite) { G.tod = 0.5; G.weather = 0; G.weatherIdx = 0; G.weatherTimer = 999; G.wet = 0; G.snowCover = 0; }
    else { G.tod = 0.30; G.weather = 0; G.weatherIdx = 0; G.weatherTimer = 20; G.wet = 0; G.snowCover = 0; }
    G.police = { state: 'off', gap: 0, timer: 0, overTimer: 0, cooldown: 0, siren: 0 };
    STATE = 'play';
  }

  function endGame() {
    if (G.distance > bestDistance) bestDistance = G.distance;
    STATE = 'over';
  }

  // PARADISE RUN finish: stop the clock, record a best time, end the run.
  function finishRun() {
    G.finished = true;
    if (bestTime === 0 || G.runTime < bestTime) bestTime = G.runTime;
    STATE = 'over';
  }

  // Pause only freezes active play; update() returns early unless STATE==='play',
  // so the simulation halts with no special-casing inside it.
  function pauseGame()  { if (STATE === 'play')   STATE = 'paused'; }
  function resumeGame() { if (STATE === 'paused') STATE = 'play'; }
  function togglePause() {
    if (STATE === 'play') STATE = 'paused';
    else if (STATE === 'paused') { STATE = 'play'; mapOpen = false; }
  }
  function toggleMap() {
    if (mapOpen) { mapOpen = false; STATE = 'play'; }
    else if (STATE === 'play' || STATE === 'paused') { mapOpen = true; STATE = 'paused'; }
  }

  // Integrate a top-down route from the segment curves (once per track build), normalized
  // to a unit box, plus a point-of-interest marker at each named zone start. Approximate
  // shape: it shows the studio's layout to compare against the real map, not GPS truth.
  function computeMapPath() {
    mapPath = []; mapPOI = []; mapBounds = null;
    if (!segments.length) return;
    var theta = 0, x = 0, y = 0, pts = [];
    for (var i = 0; i < segments.length; i++) {
      theta += (segments[i].curve || 0) * 0.0011;
      x += Math.sin(theta); y += Math.cos(theta);
      pts.push({ x: x, y: y });
    }
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (var p = 0; p < pts.length; p++) {
      if (pts[p].x < minX) minX = pts[p].x; if (pts[p].x > maxX) maxX = pts[p].x;
      if (pts[p].y < minY) minY = pts[p].y; if (pts[p].y > maxY) maxY = pts[p].y;
    }
    var w = Math.max(1, maxX - minX), hgt = Math.max(1, maxY - minY);
    mapBounds = { w: w, h: hgt };
    for (var q = 0; q < pts.length; q++) mapPath.push({ x: (pts[q].x - minX) / w, y: (pts[q].y - minY) / hgt });
    for (var z = 0; z < zones.length; z++) {
      var seg = Math.min(zones[z].start, mapPath.length - 1);
      if (mapPath[seg] && zones[z].place) mapPOI.push({ x: mapPath[seg].x, y: mapPath[seg].y, label: zones[z].place });
    }
  }

  function endDrift() {
    if (G.driftTime >= DRIFT_MIN_BANK) {
      var bonus = Math.min(DRIFT_BANK_CAP, G.driftTime * DRIFT_BANK_RATE);
      G.time += bonus;
      G.driftBanked = bonus;
      G.driftFlash = 1.2;
    }
    G.driftActive = false;
    G.driftDir = 0;
    G.driftTime = 0;
    G.chainGrace = DRIFT_CHAIN_GRACE;
  }

  // Police pursuit state machine. Provoked by sustained over-limit driving; closes the
  // gap while you keep speeding, peels away if you comply, busts you (stops the car and
  // docks points) if you do not. Pure: mutates G.police / G.score only.
  function updatePolice(dt, mph) {
    var P = G.police, L = G.curLimit;
    var over = (L > 0) && (mph >= L + POLICE_OVER);
    if (P.cooldown > 0) P.cooldown -= dt;

    if (P.state === 'off') {
      if (POLICE_ACTIVE && over && P.cooldown <= 0) {
        P.overTimer += dt;
        if (P.overTimer >= POLICE_TRIGGER) { P.state = 'chase'; P.gap = POLICE_GAP_MAX; P.timer = 0; P.siren = 0; }
      } else {
        P.overTimer = Math.max(0, P.overTimer - dt * 1.5);
      }
    } else if (P.state === 'chase') {
      var complying = (L > 0) && (mph <= L);
      if (complying) {
        P.timer += dt; P.gap += POLICE_OPEN * dt; P.siren = 0;
        if (P.timer >= POLICE_COMPLY || P.gap >= POLICE_GAP_MAX) { P.state = 'off'; P.overTimer = 0; P.gap = 0; P.timer = 0; }
      } else {
        P.timer = 0;
        var pace = POLICE_CLOSE * (1 + Math.max(0, mph - L) / 60);
        P.gap -= pace * dt;
        if (P.gap <= 6000) P.siren = 1;
        if (P.gap <= 0) { P.gap = 0; P.state = 'bust'; P.timer = 0; P.siren = 1; }
      }
    } else if (P.state === 'bust') {
      P.siren = 1;
      P.timer += dt;
      if (P.timer >= POLICE_BUST_TIME) { P.state = 'off'; P.overTimer = 0; P.gap = 0; P.timer = 0; P.siren = 0; P.cooldown = POLICE_COOLDOWN; }
    }
  }

  /* =================================================================
     UPDATE  -  PURE SIMULATION (no DOM, no canvas)
     ================================================================= */
  function update(dt, inp) {
    if (STATE !== 'play' || !G) return;
    inp = inp || {};
    var steer = inp.steer || 0;
    var playerSeg = findSegment(G.position + PLAYER_Z);
    var speedPercent = G.speed / MAX_SPEED;

    // longitudinal: tests/legacy pass an explicit throttle (up accel, down brake, 0 holds); the play
    // model (v20) AUTO-ACCELERATES and a right-thumb press brakes (inp.brake true = braking).
    var throttle;
    if (inp.throttle !== undefined && inp.throttle !== null) throttle = clamp(inp.throttle, -1, 1);
    else throttle = inp.brake ? -1 : 1;                            // auto-accelerate unless braking
    var policeBusting = (G.police.state === 'bust');
    if (policeBusting)            G.speed -= MAX_SPEED * 1.5 * dt;  // the cop stops you (firm, fixed rate)
    else if (throttle > 0.05)     G.speed += ACCEL * accelMul(speedPercent) * throttle * dt;  // geared (v21)
    else if (throttle < -0.05)    G.speed += BRAKING * (-throttle) * dt;
    // else: neutral (explicit 0), hold the current speed
    var braking = (throttle < -0.05) || policeBusting;
    var mphNow = mphForSpeed(G.speed);

    // DRIFT (v20): a quick BRAKE TAP (press then release) while turning, above 100 mph, kicks a drift.
    // It sustains while that turn is held fast enough, and ends when the car straightens or slows.
    if (braking && !policeBusting) {
      G.brakeHeld += dt;
    } else {
      if (G.prevBrake && G.brakeHeld > 0 && G.brakeHeld <= DRIFT_TAP_MAX &&
          Math.abs(steer) > DRIFT_STEER_THRESH && mphNow > DRIFT_MIN_MPH &&
          !G.driftActive && !policeBusting) {
        G.driftActive = true; G.driftDir = steer > 0 ? 1 : -1; G.driftTime = 0; G.driftFlash = 1.2;
      }
      G.brakeHeld = 0;
    }
    G.prevBrake = braking;
    if (G.driftActive) {
      if (steer * G.driftDir > 0.05 && mphNow > DRIFT_MIN_MPH * 0.7 && !policeBusting) {
        G.driftTime += dt;
        G.comboTime += dt;
      } else {
        endDrift();
      }
    } else if (G.chainGrace > 0) {
      G.chainGrace -= dt;
      if (G.chainGrace <= 0) G.comboTime = 0;
    }

    // steering: requires forward momentum (no low-speed floor); boosted in the drift direction
    var slip = Math.min(0.85, G.wet * 0.7 + G.snowCover * 0.5);       // 0 dry; slick roads in rain/snow
    var steerGain = dt * STEER_RATE * clamp(speedPercent / 0.45, 0, 1) * (1 - slip * 0.3);  // zero at a standstill
    var steerDx = steerGain * ((G.driftActive && steer * G.driftDir > 0) ? DRIFT_STEER_MULT : 1);
    G.playerX += steerDx * steer;
    G.playerX -= dt * STEER_RATE * speedPercent * speedPercent * playerSeg.curve * CENTRIFUGAL * (1 + slip);  // slides out more when slick

    // hard walls/rails: hold the car inside them BEFORE the off-road test, so pressing
    // against a wall never reads as off-road (that drag used to bleed speed and pin the car)
    if (playerSeg && playerSeg.bridge) G.playerX = clamp(G.playerX, -0.80, 0.80);
    else if (playerSeg && playerSeg.cliff > 0) G.playerX = clamp(G.playerX, -0.80, 0.70);
    else if (playerSeg && playerSeg.cliff < 0) G.playerX = clamp(G.playerX, -0.70, 0.80);

    // off-road drag (open shoulders only now; walls are clamped inside region above)
    if ((G.playerX < -1 || G.playerX > 1) && G.speed > OFF_ROAD_LIMIT) {
      G.speed += OFF_ROAD_DECEL * dt;
    }

    // clamp
    G.playerX = clamp(G.playerX, -2.2, 2.2);
    G.speed = clamp(G.speed, 0, MAX_SPEED);

    // advance: PARADISE RUN is a finite point-to-point (clamp + finish); STANDARD loops
    if (G.finite) {
      G.position += G.speed * dt;
      var endCap = trackLength - SEGMENT_LENGTH * 6;
      if (G.position > endCap) G.position = endCap;
      if (!G.finished && G.position + PLAYER_Z >= finishZ) finishRun();
    } else {
      G.position = (G.position + G.speed * dt) % trackLength;
      if (G.position < 0) G.position += trackLength;
    }
    // gorge guardrail: re-checked against the segment the car now sits on, so the car never
    // crosses the rail in the rendered frame (no one-frame overshoot at a zone boundary)
    var gSeg = findSegment(G.position + PLAYER_Z);
    if (gSeg && gSeg.bridge) G.playerX = clamp(G.playerX, -0.80, 0.80);          // inside both parapets
    else if (gSeg && gSeg.cliff > 0) G.playerX = clamp(G.playerX, -0.80, 0.70);  // rock wall (left), guardrail (right)
    else if (gSeg && gSeg.cliff < 0) G.playerX = clamp(G.playerX, -0.70, 0.80);  // guardrail (left), rock wall (right)
    G.distance += G.speed * dt;
    G.mountainGrow = Math.min(MOUNTAIN_GROW_MAX, G.mountainGrow + G.speed * dt * MOUNTAIN_GROW_RATE);
    var hereSeg = segments[Math.floor(G.position / SEGMENT_LENGTH) % segments.length];
    var herePlace = hereSeg ? (hereSeg.place || '') : '';
    if (herePlace !== G.placeCur) { G.placeCur = herePlace; if (herePlace) { G.place = herePlace; G.placeFlash = PLACE_FLASH_TIME; } }
    if (G.placeFlash > 0) G.placeFlash = Math.max(0, G.placeFlash - dt);

    // environment: STANDARD cycles day/night and weather; PARADISE RUN is a fixed clear day,
    // and runs on a count-UP timer that ends at the finish line, not a countdown clock.
    if (!G.finite) {
      G.tod = (G.tod + dt / DAY_LENGTH) % 1;
      G.weatherTimer -= dt;
      if (G.weatherTimer <= 0) {
        G.weatherIdx = (G.weatherIdx + 1) % WEATHER_SEQ.length;
        G.weather = WEATHER_SEQ[G.weatherIdx];
        G.weatherTimer = WEATHER_DUR[G.weatherIdx];
      }
      G.wet = clamp(G.wet + (G.weather === 1 ? dt * 0.5 : -dt * 0.35), 0, 1);
      G.snowCover = clamp(G.snowCover + (G.weather === 2 ? dt * 0.12 : -dt * 0.04), 0, 1);

      var passed = Math.floor(G.distance / (CHECKPOINT_SPACING * SEGMENT_LENGTH));
      if (passed > G.checkpointsPassed) {
        G.time += (passed - G.checkpointsPassed) * CHECKPOINT_BONUS;
        G.checkpointsPassed = passed;
        G.cpFlash = 1.6;
      }
      G.time -= dt;
      if (G.time <= 0) { G.time = 0; endGame(); }
    } else {
      G.runTime += dt;
    }
    if (G.cpFlash > 0) G.cpFlash = Math.max(0, G.cpFlash - dt);
    if (G.driftFlash > 0) G.driftFlash = Math.max(0, G.driftFlash - dt);

    // the posted speed limit drives the police only; the staying-under scoring was removed in v8
    G.curLimit = currentLimitMph();
    var mph = mphForSpeed(G.speed);
    if (!G.finite) updatePolice(dt, mph);

    // tire-skid state (sim-side, deterministic; the harness exercises it)
    var sp = G.speed / MAX_SPEED;
    var skidding = G.driftActive || (braking && sp > 0.55) || (steer !== 0 && sp > 0.92);
    G.latVel = (G.playerX - G.prevPlayerX) / Math.max(dt, 1e-4);
    G.prevPlayerX = G.playerX;
    var skTarget = (skidding && G.speed > OFF_ROAD_LIMIT) ? 1 : 0;
    G.skid += (skTarget - G.skid) * Math.min(1, dt * (skTarget > G.skid ? 12 : 5));
    G.skidBraking = braking;
    G.trail.push({ x: G.playerX, on: skTarget, b: braking ? 1 : 0 });
    if (G.trail.length > 16) G.trail.shift();

    G.prevSteer = steer;
    G.steer = steer;
  }

  /* =================================================================

  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

  function hex2rgb(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }

  function polygon(ax, ay, bx, by, cx, cy, dx2, dy2, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy); ctx.lineTo(dx2, dy2);
    ctx.closePath(); ctx.fill();
  }
  function triangleFill(ax, ay, bx, by, cx, cy) {

    ctx.closePath(); ctx.fill();
  }
  function roundRectPath(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();

  function rumbleWidth(projW) { return projW / Math.max(6, 2 * LANES); }

  /* =================================================================
     BACKDROP : banded sky, slotted sun, Mt Rainier, foothills
     ================================================================= */
  function renderBackdrop() {
    var horizon = LOGICAL_H / 2;
    var w = biomeWeights();            // for the ground tint only
    var par = bgOffset;                // ONE smoothed parallax source so every layer moves together
    drawSky(horizon);
    drawMountainRange(horizon, par);   // ALWAYS present, big, vector; the constant backdrop (far -> small shift)
    drawGround(horizon, w);            // distant terrain below the horizon: never leaves black behind the road
    drawRidge(LOGICAL_W / 2 - par * 0.5, horizon, 0.6);

    // Zone features slide in front of the constant range by signed distance, feathered at
    // their edges, so transitions read as scenery passing rather than a backdrop swap.
    var lakeStrength = 0;
    if (G && zones.length) {
      var p = G.position, tl = trackLength;
      for (var zi = 0; zi < zones.length; zi++) {
        var z = zones[zi];
        var halfLen = (z.end - z.start) * SEGMENT_LENGTH / 2;
        var center = (z.start + z.end) * SEGMENT_LENGTH / 2;
        var dz = center - p;
        dz = ((dz % tl) + tl) % tl;
        if (dz > tl / 2) dz -= tl;
        var off = zoneScroll(dz, halfLen);
        if (off === null) continue;
        drawZoneFeatureFeathered(z.biome, LOGICAL_W / 2 + off + par * 0.7, horizon);
        if (z.biome === 'lake') {
          var st = clamp(1 - Math.abs(off) / (LOGICAL_W * 1.1), 0, 1);
          if (st > lakeStrength) lakeStrength = st;
        }

    if (lakeStrength > 0.01) drawMountainReflection(horizon, par, lakeStrength);  // Mt Rainier mirror in the horizon lake; the road draws over its centre

  }

  // Horizontal offset for a zone landmark given its signed distance to the player
  // and its half-length. 0 = centred (you are inside it), grows to slide it off the
  // side as you near and cross the boundary; null once it is fully gone.
  function zoneScroll(dz, halfLen) {
    var REVEAL = 22000, SLIDE = LOGICAL_W * 1.25;
    var edge = halfLen - Math.abs(dz);
    if (edge > REVEAL) return 0;
    if (edge < -REVEAL) return null;
    var t = clamp((REVEAL - edge) / (2 * REVEAL), 0, 1);
    t = t * t * (3 - 2 * t);                 // smoothstep: lingers centred, eases off the side
    return (dz >= 0 ? 1 : -1) * t * SLIDE;
  }

  function drawZoneFeature(biome, x, horizon) {
    if (biome === 'lake') drawLake(x, horizon, LOGICAL_W * 1.0);
    else if (biome === 'ravine') drawCanyonWalls(x, horizon, LOGICAL_W * 0.72);
    else if (biome === 'forest') drawTreeline(x, horizon, LOGICAL_W * 0.72);
    // alpine: the always-present mountain range is the feature; nothing extra in front
  }

  // The always-present mountain range: Mt Rainier as flat-shaded VECTOR facets (matching the
  // trees and road), a FIXED shape that only translates with parallax and scales very slowly as
  // you approach (G.mountainGrow). No gradients, no animated snow line: the silhouette never morphs.
  function drawMountainRange(horizon, pan) {
    var W = LOGICAL_W, baseY = horizon + 8;
    var grow = (G && isFinite(G.mountainGrow)) ? G.mountainGrow : 0;
    var ms = 1 + grow;

    // far range: fixed flat ridge, translated only (no morph)
    var offF = pan * 0.2;                              // far range: small shift, same source
    var far = [[-60,26],[-10,44],[40,28],[95,50],[150,30],[205,48],[256,30],[316,46]];
    ctx.fillStyle = '#9fb1c6';
    ctx.beginPath(); ctx.moveTo(-60, baseY);
    for (var fi = 0; fi < far.length; fi++) ctx.lineTo(far[fi][0] + offF, baseY - far[fi][1]);
    ctx.lineTo(W + 60, baseY); ctx.closePath(); ctx.fill();

    // Mt Rainier: fixed proportional vertices, translated + scaled (never reshaped)
    var off = clamp(pan * 0.4, -64, 64);              // Rainier: a fraction of the single parallax
    var cx = W * 0.52 + off;
    var ph = 150 * ms, hw = 150 * ms;
    var P = [[-1.00,0.00],[-0.62,0.34],[-0.40,0.56],[-0.20,0.80],[-0.07,0.95],

    function vx(i){ return cx + P[i][0] * hw; }
    function vy(i){ return baseY - P[i][1] * ph; }
    function silhouette(){
      ctx.beginPath(); ctx.moveTo(vx(0), baseY);
      for (var i = 0; i < P.length; i++) ctx.lineTo(vx(i), vy(i));
      ctx.lineTo(vx(P.length - 1), baseY); ctx.closePath();
    }

    silhouette(); ctx.fillStyle = '#74859a'; ctx.fill();              // rock body (flat)

    ctx.save(); silhouette(); ctx.clip();                            // facets + snow stay inside the rock
    // left rock shadow facet (flat, sun is upper-right)
    ctx.fillStyle = '#5c6c80';
    ctx.beginPath(); ctx.moveTo(vx(0), baseY);
    for (var li = 0; li <= 5; li++) ctx.lineTo(vx(li), vy(li));
    ctx.lineTo(cx, baseY); ctx.closePath(); ctx.fill();
    // right sunlit facet (flat): a clear lit/shadow split down the summit ridge
    ctx.fillStyle = '#8a9ab0';
    ctx.beginPath(); ctx.moveTo(cx, baseY);
    ctx.lineTo(vx(5), vy(5)); ctx.lineTo(vx(6), vy(6)); ctx.lineTo(vx(7), vy(7));
    ctx.lineTo(vx(8), vy(8)); ctx.lineTo(vx(9), vy(9)); ctx.lineTo(vx(10), vy(10));
    ctx.closePath(); ctx.fill();
    // darker rock ribs on the lower slopes for detail
    ctx.fillStyle = '#5f6f86';
    ctx.beginPath(); ctx.moveTo(vx(2), vy(2)); ctx.lineTo(vx(3), vy(3));
    ctx.lineTo(cx - 0.16 * hw, baseY); ctx.lineTo(cx - 0.40 * hw, baseY); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7d8da2';
    ctx.beginPath(); ctx.moveTo(vx(8), vy(8)); ctx.lineTo(vx(9), vy(9));
    ctx.lineTo(cx + 0.42 * hw, baseY); ctx.lineTo(cx + 0.20 * hw, baseY); ctx.closePath(); ctx.fill();
    // snow cap: flat white over a FIXED snow line
    var snow = [[-0.46,0.46],[-0.24,0.60],[-0.08,0.54],[0.02,0.60],[0.16,0.52],[0.30,0.58],[0.50,0.44]];
    function sx(i){ return cx + snow[i][0] * hw; }
    function sy(i){ return baseY - snow[i][1] * ph; }
    ctx.fillStyle = '#eef4ff';
    ctx.beginPath(); ctx.moveTo(sx(0), sy(0));
    ctx.lineTo(vx(2), vy(2)); ctx.lineTo(vx(3), vy(3)); ctx.lineTo(vx(4), vy(4));
    ctx.lineTo(vx(5), vy(5)); ctx.lineTo(vx(6), vy(6)); ctx.lineTo(vx(7), vy(7)); ctx.lineTo(vx(8), vy(8));
    ctx.lineTo(sx(snow.length - 1), sy(snow.length - 1));
    for (var bi = snow.length - 2; bi >= 0; bi--) ctx.lineTo(sx(bi), sy(bi));
    ctx.closePath(); ctx.fill();
    // snow shadow facet (flat, left of the summit) for the low-poly read
    ctx.fillStyle = '#cdd9ef';
    ctx.beginPath();
    ctx.moveTo(vx(5), vy(5)); ctx.lineTo(vx(3), vy(3)); ctx.lineTo(sx(1), sy(1));
    ctx.lineTo(sx(2), sy(2)); ctx.lineTo(cx, baseY - 0.60 * ph);
    ctx.closePath(); ctx.fill();
    // atmospheric haze at the base: the lower slopes fade into the distance so the mountain
    // sits in the scene rather than reading as a flat illustration pasted on the sky
    var hz = ctx.createLinearGradient(0, baseY - ph * 0.55, 0, baseY);

    ctx.restore();
  }

  // Render a zone landmark with its own left/right edges feathered, so a panel only partly
  // scrolled into frame fades at the seam instead of showing a hard vertical edge. The
  // landmark is drawn into an offscreen buffer, that buffer's edges are softened with a
  // destination-in gradient (no holes punched in the sky), then it is composited over.
  // Falls back to a direct draw when no canvas is available (headless gates).
  function ensureBgBuffer() {
    if (bgBuffer) return true;
    if (typeof document === 'undefined') return false;
    bgBuffer = document.createElement('canvas');
    bgBuffer.width = LOGICAL_W; bgBuffer.height = LOGICAL_H;
    bgBufCtx = bgBuffer.getContext('2d');
    return !!bgBufCtx;
  }
  function drawZoneFeatureFeathered(biome, x, horizon) {
    if (!ensureBgBuffer()) { drawZoneFeature(biome, x, horizon); return; }
    var halfW = (biome === 'alpine') ? LOGICAL_W * 0.92 : LOGICAL_W * 0.72;
    bgBufCtx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
    var saved = ctx; ctx = bgBufCtx;
    drawZoneFeature(biome, x, horizon);
    ctx = saved;
    bgBufCtx.save();
    bgBufCtx.globalCompositeOperation = 'destination-in';
    var fx0 = x - halfW, fx1 = x + halfW, span = Math.max(1, fx1 - fx0);
    var fe = clamp(56 / span, 0.02, 0.45);
    var grad = bgBufCtx.createLinearGradient(fx0, 0, fx1, 0);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(fe, 'rgba(0,0,0,1)');
    grad.addColorStop(1 - fe, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    bgBufCtx.fillStyle = grad;
    bgBufCtx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    bgBufCtx.restore();
    ctx.drawImage(bgBuffer, 0, 0);
  }

  // How much of each biome lies in the road ahead, near segments weighted more.
  // Drives a smooth cross-fade between backdrops as the player changes zones.
  function biomeWeights() {
    var w = { forest: 0, lake: 0, ravine: 0, alpine: 0 };
    if (!G || segments.length === 0) { w.forest = 1; return w; }
    var base = Math.floor(G.position / SEGMENT_LENGTH);
    var N = 150, total = 0;
    for (var i = 0; i < N; i++) {
      var idx = ((base + i) % segments.length + segments.length) % segments.length;
      var b = segments[idx].biome || 'forest';
      if (w[b] === undefined) w[b] = 0;
      var ww = 1 - i / N;
      w[b] += ww; total += ww;
    }
    if (total > 0) { w.forest /= total; w.lake /= total; w.ravine /= total; w.alpine /= total; }
    return w;
  }

  // Average signed curve over the road just ahead; >0 means the route bends right.
  // Drives the panorama so the backdrop scrolls with where the car is heading.
  // The curve the road is actually showing near the player, weighted toward the nearest
  // segments so the backdrop parallax tracks the visible bend and sits still on a straight
  // (the old long flat average pre-panned toward curves that were not visible yet).
  function headingAhead() {
    if (!G || segments.length === 0) return 0;
    var base = Math.floor(G.position / SEGMENT_LENGTH);
    var sum = 0, wsum = 0, N = 30;
    for (var i = 0; i < N; i++) {
      var idx = ((base + i) % segments.length + segments.length) % segments.length;
      var wgt = 1 - i / N;                 // nearer segments dominate
      sum += segments[idx].curve * wgt; wsum += wgt;
    }
    return clamp(sum / wsum, -1, 1);
  }

  // Ease the displayed biome mix toward the sampled target so backdrops fade
  // in and out smoothly as zones approach, never popping.
  function updateBgWeights() {
    var t = biomeWeights(), k = 0.06;
    bgWeights.forest += (t.forest - bgWeights.forest) * k;
    bgWeights.lake   += (t.lake   - bgWeights.lake)   * k;
    bgWeights.ravine += (t.ravine - bgWeights.ravine) * k;
    bgWeights.alpine += (t.alpine - bgWeights.alpine) * k;
    return bgWeights;
  }

  // Distant terrain below the horizon: far grass, rolling hills, and haze.
  // This is the connecting middle layer; the road draws on top, so the area
  // the road cannot cover (e.g. over a crest) shows ground rather than black.
  function drawGround(horizon, w) {
    ctx.fillStyle = COL.GRASS_DARK;
    ctx.fillRect(0, horizon, LOGICAL_W, LOGICAL_H - horizon);
    var hillCol = '#2f7a3e';
    if (w.ravine > 0.45) hillCol = '#6f5436';
    else if (w.alpine > 0.45) hillCol = '#3a6f57';
    ctx.fillStyle = hillCol;
    ctx.beginPath();
    ctx.moveTo(0, horizon + 1);
    for (var x = 0; x <= LOGICAL_W; x += 8) {
      var wx = x + bgOffset * 0.6;
      var hh = 6 + Math.sin(wx * 0.06) * 4 + Math.sin(wx * 0.017 + 1) * 5;
      ctx.lineTo(x, horizon - hh);
    }
    ctx.lineTo(LOGICAL_W, horizon + 1); ctx.closePath(); ctx.fill();
    var g = ctx.createLinearGradient(0, horizon, 0, horizon + 40);
    g.addColorStop(0, 'rgba(207,224,238,0.55)');
    g.addColorStop(1, 'rgba(207,224,238,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, horizon, LOGICAL_W, 40);
  }

  function bgHash(a, b) {
    var s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;
    return s - Math.floor(s);
  }

  // Bright arcade sky driven by time of day and weather (Super Scaler palette): a smooth
  // gradient between midnight / dawn / noon / dusk, blended toward overcast for rain and pale
  // for snow, with a tracking sun by day, a moon and stars by night.
  function drawSky(horizon) {
    var tod = G ? G.tod : 0.4, wet = G ? G.wet : 0, snow = G ? G.snowCover : 0;
    var dl = (1 - Math.cos(tod * 2 * Math.PI)) / 2;                 // 0 midnight -> 1 noon
    var kTop = [[10,18,48],[58,74,122],[63,134,208],[58,63,114]];
    var kMid = [[22,32,63],[240,168,102],[191,224,244],[239,138,84]];
    var fph = tod * 4, ki = Math.floor(fph) % 4, kt = fph - Math.floor(fph);
    var top = mix(kTop[ki], kTop[(ki + 1) % 4], kt);
    var mid = mix(kMid[ki], kMid[(ki + 1) % 4], kt);
    var overcast = Math.min(0.75, wet * 0.8);
    top = mix(top, [86,92,102], overcast);  mid = mix(mid, [110,116,126], overcast);
    top = mix(top, [188,194,204], snow * 0.6); mid = mix(mid, [206,210,218], snow * 0.6);
    var g = ctx.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, rgbStr(top)); g.addColorStop(1, rgbStr(mid));
    ctx.fillStyle = g; ctx.fillRect(0, 0, LOGICAL_W, horizon);

    if (dl < 0.35 && wet < 0.3 && snow < 0.3) {                      // stars at night
      var sa = (0.35 - dl) / 0.35;
      for (var st = 0; st < 44; st++) {
        if (bgHash(st, 1) > 0.5) {
          ctx.fillStyle = 'rgba(255,255,255,' + (sa * (0.35 + bgHash(st, 2) * 0.5)).toFixed(2) + ')';
          ctx.fillRect((st * 53) % LOGICAL_W, (st * 29) % Math.floor(horizon * 0.7), 1, 1);
        }
      }
    }

    var sunUp = (tod > 0.22 && tod < 0.78);
    if (sunUp) {
      var arc = (tod - 0.22) / 0.56;
      var bx = LOGICAL_W * (0.12 + arc * 0.76) - bgOffset * 0.3;
      var by = horizon * (0.80 - Math.sin(arc * Math.PI) * 0.62);
      var warm = 1 - Math.sin(arc * Math.PI);
      var rg = ctx.createRadialGradient(bx, by, 2, bx, by, 34);
      rg.addColorStop(0, 'rgba(255,255,245,0.95)');
      rg.addColorStop(0.4, 'rgba(255,240,205,0.45)');
      rg.addColorStop(1, 'rgba(255,240,205,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(bx, by, 34, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgbStr(mix([255,250,235], [255,168,88], warm * 0.8));
      ctx.beginPath(); ctx.arc(bx, by, 9, 0, Math.PI * 2); ctx.fill();
    } else {
      var ma = clamp(((tod + 0.5) % 1 - 0.22) / 0.56, 0, 1);
      var mx = LOGICAL_W * (0.12 + ma * 0.76) - bgOffset * 0.3;
      var my = horizon * (0.80 - Math.sin(ma * Math.PI) * 0.6);
      ctx.fillStyle = 'rgba(232,238,250,0.92)'; ctx.beginPath(); ctx.arc(mx, my, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgbStr(top); ctx.beginPath(); ctx.arc(mx + 3, my - 2, 7, 0, Math.PI * 2); ctx.fill();  // crescent
    }
    drawClouds(horizon, wet, snow, dl);
  }

  function puff(x, y, s) {
    ctx.fillRect(Math.round(x - s), Math.round(y - s * 0.6), Math.round(s * 2), Math.round(s * 1.2));
  }
  function drawClouds(horizon, wet, snow, dl) {
    wet = wet || 0; snow = snow || 0; dl = (dl === undefined) ? 1 : dl;
    var overcast = Math.max(wet, snow * 0.7);
    var count = 5 + Math.round(overcast * 6);
    var col = mix([255,255,255], [120,124,134], Math.min(1, overcast * 1.1));   // white -> storm grey
    col = mix(col, [70,74,84], (1 - dl) * 0.4);                                  // darker at night
    for (var i = 0; i < count; i++) {
      var speed = 6 + i * 2.5;
      var span = LOGICAL_W + 80;
      var x = ((i * 67 + 20) - (animClock * speed)) % span;
      if (x < 0) x += span;
      x -= 40;
      var y = 12 + ((i * 53) % Math.max(1, Math.floor(horizon * 0.5)));
      var s = 5 + (i % 3) * 2 + overcast * 3;
      var al = clamp((0.6 - i * 0.05) * (0.5 + overcast * 0.7), 0, 0.9);
      ctx.fillStyle = 'rgba(' + Math.round(col[0]) + ',' + Math.round(col[1]) + ',' + Math.round(col[2]) + ',' + al.toFixed(2) + ')';
      puff(x, y, s);
      puff(x + s * 1.6, y + 1, s * 1.3);
      puff(x - s * 1.4, y + 1, s * 0.9);
    }
  }

  function drawRidge(cx, horizon, alpha) {
    ctx.save();
    ctx.globalAlpha = 0.7 * alpha;
    ctx.fillStyle = '#7d93b0';
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    for (var x = 0; x <= LOGICAL_W; x += 8) {
      var wx = x + bgOffset * 0.5;
      var hh = 16 + Math.sin(wx * 0.05) * 7 + Math.sin(wx * 0.013 + 2) * 8;
      ctx.lineTo(x, horizon - hh);
    }
    ctx.lineTo(LOGICAL_W, horizon); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Mt Rainier, daytime: chunky pixel columns, lit snow, alive (plume + shimmer).
  function drawMountainDay(cx, horizon) {
    var CELL = 4;
    var peakY = 40;
    var baseY = horizon + 2;
    var halfW = LOGICAL_W * 0.92;
    var span = baseY - peakY;

    function ridgeY(px) {
      var ax = Math.abs(px);
      var tn = ax / halfW;
      if (tn > 1) return baseY + 999;
      var y = peakY + span * Math.pow(tn, 0.92);
      y += Math.sin(px * 0.11) * 3 * (1 - tn);
      y += Math.sin(px * 0.047 + 2) * 5 * (1 - tn * 0.5);
      return y;
    }
    function snowLineY(px) {
      return peakY + span * 0.42 + Math.sin(px * 0.16) * 5 + Math.sin(px * 0.5 + 1) * 3;
    }

    var leftPx = -Math.floor(halfW / CELL) * CELL;
    for (var px = leftPx; px <= halfW; px += CELL) {
      var top = ridgeY(px);
      if (top >= baseY) continue;
      var colX = Math.round(cx + px);
      var qtop = Math.floor(top / CELL) * CELL;
      var sLine = snowLineY(px);
      var lit = px > -halfW * 0.1;            // daytime sun from the upper right
      var gx = Math.floor(colX / CELL);

      for (var yy = qtop; yy < baseY; yy += CELL) {
        var gy = Math.floor(yy / CELL);
        var dither = ((gx + gy) & 1) === 0;
        var col;
        if (yy < sLine - CELL) {
          col = dither ? '#ffffff' : '#e9f0fc';
          if (Math.sin(animClock * 3 + bgHash(gx, gy) * 6.283) > 0.9) col = '#ffffff';
        } else if (yy < sLine + CELL) {
          col = dither ? '#d7e0ef' : (lit ? '#aab4c6' : '#9099ad');
        } else {
          if (lit) col = dither ? '#8089a0' : '#737d94';
          else col = dither ? '#586079' : '#4f566e';
        }
        ctx.fillStyle = col;
        ctx.fillRect(colX, yy, CELL, CELL);
      }
    }
    drawPlume(cx, peakY);
  }

  function drawPlume(cx, peakY) {
    var puffs = 8;
    var rise = (animClock * 6) % 4;
    for (var i = 0; i < puffs; i++) {
      var p = i / puffs;
      var py = peakY - 2 - p * 30 - rise;
      var sway = Math.sin(animClock * 1.6 + i * 0.7) * 7 * p;
      var size = 2 + p * 5;
      var a = (1 - p) * 0.28;
      ctx.fillStyle = 'rgba(245,248,255,' + a.toFixed(3) + ')';
      ctx.fillRect(Math.round(cx + sway - size / 2), Math.round(py),
                   Math.round(size), Math.max(1, Math.round(size * 0.8)));
    }
  }

  // Reflection Lake: a body of water with Mt Rainier mirrored in it, surface shimmer,
  // and a far shoreline of dark pines. The reflected snow peak narrows and ripples with depth.
  function drawLake(cx, horizon, halfW) {
    var top = Math.round(horizon - 3);
    var bottom = Math.round(horizon + 118);                      // a large body of water (v35)
    var x0 = Math.round(cx - halfW), x1 = Math.round(cx + halfW);
    var g = ctx.createLinearGradient(0, top, 0, bottom);
    g.addColorStop(0, COL.LAKE_HI);
    g.addColorStop(1, COL.LAKE_LO);
    ctx.fillStyle = g;
    ctx.fillRect(x0, top, x1 - x0, bottom - top);
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, top, x1 - x0, bottom - top); ctx.clip();
    var span = bottom - top;
    for (var i = 0; i < span; i += 2) {                          // moving shimmer bands across the water
      if (Math.sin(i * 0.45 + animClock * 3.6 + cx * 0.01) > 0.18) {
        ctx.fillStyle = 'rgba(232,245,255,' + (0.08 + 0.10 * (i / span)).toFixed(3) + ')';
        var yy2 = top + i, seg = 16 + (i % 5) * 4;
        for (var x = x0 + ((animClock * 14 + i * 7) % seg); x < x1; x += seg * 1.6) ctx.fillRect(Math.round(x), yy2, Math.round(seg), 1);
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.5)';                     // bright moving glints right at the surface
    for (var gx2 = x0; gx2 < x1; gx2 += 11) {
      var gw = 3 + Math.sin(animClock * 5 + gx2 * 0.2) * 3;
      if (gw > 0) ctx.fillRect(Math.round(gx2 + (animClock * 8) % 11), top + 1, Math.max(1, Math.round(gw)), 1);
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(216,238,255,0.92)';                    // bright near-shore waterline
    ctx.fillRect(x0, top - 1, x1 - x0, 2);
    ctx.fillStyle = COL.TREE_FAR;                                // far shoreline pines at the waterline
    for (var sx = x0; sx < x1; sx += 6) {
      var bump = 3 + Math.floor(bgHash(Math.floor((sx - cx) / 6), 7) * 4);
      ctx.fillRect(sx, top - bump, 6, bump + 1);
    }
  }

  // The aligned reflection of Mt Rainier in Reflection Lakes: the SAME silhouette as the
  // real mountain, at the SAME x, flipped about the waterline, dimmed and broken by ripples.
  // strength (0..1) fades it in as the lake is centred ahead.
  function drawMountainReflection(horizon, pan, strength) {
    if (strength <= 0.01) return;
    var W = LOGICAL_W, waterline = horizon + 5;
    var grow = (G && isFinite(G.mountainGrow)) ? G.mountainGrow : 0, ms = 1 + grow;
    var off = clamp(pan * 0.4, -64, 64), cx = W * 0.52 + off;     // aligned under the real peak
    var hw = 150 * ms, ph = 150 * ms * 0.55;                      // foreshortened: the mirror sits in the horizon lake band, clear of the wide near road
    var P = [[-1.00,0.00],[-0.62,0.34],[-0.40,0.56],[-0.20,0.80],[-0.07,0.95],
             [0.00,1.00],[0.10,0.95],[0.24,0.78],[0.44,0.54],[0.66,0.32],[1.00,0.00]];
    function vx(i){ return cx + P[i][0] * hw; }
    function vyR(i){ return waterline + P[i][1] * ph; }           // flipped DOWN: wide at the shore, summit deepest
    ctx.save();
    ctx.globalAlpha = clamp(0.9 * strength, 0, 0.92);
    ctx.beginPath(); ctx.moveTo(vx(0), waterline);                // flipped Rainier silhouette (recognisable, aligned)
    for (var i = 0; i < P.length; i++) ctx.lineTo(vx(i), vyR(i));
    ctx.lineTo(vx(P.length - 1), waterline); ctx.closePath();
    ctx.fillStyle = '#5b6f8c'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(vx(0), waterline);                // clip to the reflection
    for (var i2 = 0; i2 < P.length; i2++) ctx.lineTo(vx(i2), vyR(i2));
    ctx.lineTo(vx(P.length - 1), waterline); ctx.closePath(); ctx.clip();
    var snowH = ph * 0.5;                                         // broad BRIGHT snow across the shallow (visible) band so it flanks the road
    var sg = ctx.createLinearGradient(0, waterline, 0, waterline + snowH);
    sg.addColorStop(0, 'rgba(238,246,255,0.96)');
    sg.addColorStop(1, 'rgba(190,210,236,0.30)');
    ctx.fillStyle = sg;
    ctx.fillRect(Math.round(cx - hw), Math.round(waterline), Math.round(hw * 2), Math.ceil(snowH));
    for (var ry = 0; ry < ph; ry += 3) {                          // ripple bands break up the mirror
      var yy = waterline + ry, fr = ry / ph;
      var dx = Math.sin(fr * 8 + animClock * 3.0) * (2.0 + fr * 9) + Math.sin(fr * 19 + animClock * 4.2) * 2.0;
      ctx.fillStyle = 'rgba(150,182,214,' + (0.12 + 0.14 * Math.abs(Math.sin(fr * 11 + animClock * 3.3))).toFixed(3) + ')';
      ctx.fillRect(Math.round(cx - hw + dx), Math.round(yy), Math.round(hw * 2), 1);
    }
    ctx.restore();
    ctx.save(); ctx.globalAlpha = 0.72 * strength;                // bright shoreline glint at the waterline
    ctx.fillStyle = 'rgba(224,240,255,0.95)';
    ctx.fillRect(Math.round(cx - hw), Math.round(waterline - 1), Math.round(hw * 2), 2);
    ctx.restore();
  }

  function drawTreeline(cx, horizon, halfW) {
    var x0 = cx - halfW, x1 = cx + halfW;
    var rows = [
      { c: COL.TREE_FAR,  base: horizon - 3, hMin: 8,  hMax: 20, step: 7 },
      { c: COL.TREE_NEAR, base: horizon + 2, hMin: 12, hMax: 30, step: 9 }
    ];
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      ctx.fillStyle = row.c;
      for (var x = x0; x <= x1; x += row.step) {
        var hh = row.hMin + bgHash(Math.floor((x - cx) / row.step), r) * (row.hMax - row.hMin);
        triangleFill(x, row.base - hh, x - row.step * 0.7, row.base, x + row.step * 0.7, row.base);
      }
    }
  }

  // The gorge backdrop: distant layered rock canyon walls (no waterfall as of v18). The repeating
  // rock pillars that line the road are roadside sprites; this is just the far canyon behind them.
  function drawCanyonWalls(cx, horizon, halfW) {
    var x0 = cx - halfW, x1 = cx + halfW;
    var layers = [['#6f5a44', 58], ['#82664a', 42], ['#9a7a56', 28], ['#b5926a', 15]];
    for (var L = 0; L < layers.length; L++) {
      var col = layers[L][0], amp = layers[L][1];
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(x0, horizon);
      for (var x = x0; x <= x1; x += 7) {
        var hh = amp * (0.55 + 0.45 * Math.sin((x - cx) * 0.022 + L * 1.6)) + 6;
        ctx.lineTo(x, horizon - hh);
      }
      ctx.lineTo(x1, horizon); ctx.closePath(); ctx.fill();
    }
    // a few lit crest edges for definition
    ctx.strokeStyle = 'rgba(206,180,140,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var rx = x0; rx <= x1; rx += 7) {
      var ry = horizon - (28 * (0.55 + 0.45 * Math.sin((rx - cx) * 0.022 + 2 * 1.6)) + 6);
      if (rx === x0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
    }
    ctx.stroke();
  }

  function drawHaze(horizon) {
    var g = ctx.createLinearGradient(0, horizon - 14, 0, horizon + 2);
    g.addColorStop(0, 'rgba(207,224,238,0)');
    g.addColorStop(1, 'rgba(207,224,238,0.34)');
    ctx.fillStyle = g;
    ctx.fillRect(0, horizon - 14, LOGICAL_W, 16);
  }

  function drawSeam(horizon) {
    ctx.fillStyle = COL.GRASS_DARK;
    ctx.fillRect(0, horizon, LOGICAL_W, 2);
  }

  /* =================================================================
     ROAD
     ================================================================= */
  function renderRoad() {
    if (!G) return;
    var W = LOGICAL_W, H = LOGICAL_H;
    var baseSegment = findSegment(G.position);
    var basePercent = (G.position % SEGMENT_LENGTH) / SEGMENT_LENGTH;
    var playerSegment = findSegment(G.position + PLAYER_Z);
    var playerRW = 1 - 0.42 * (playerSegment.shore || 0);   // match the player offset to the narrowed lakefront road
    var playerPercent = ((G.position + PLAYER_Z) % SEGMENT_LENGTH) / SEGMENT_LENGTH;
    var playerY = interpolate(playerSegment.p1.world.y, playerSegment.p2.world.y, playerPercent);
    var maxy = H;
    var x = 0;
    var dx = -(baseSegment.curve * basePercent);
    renderBaseIndex = baseSegment.index;

    for (var n = 0; n < DRAW_DISTANCE; n++) {
      var seg = segments[(baseSegment.index + n) % segments.length];
      seg.looped = seg.index < baseSegment.index;
      seg.fog = exponentialFog(n / DRAW_DISTANCE, FOG_DENSITY);
      seg.clip = maxy;

      var camZ = G.position - (seg.looped ? trackLength : 0);
      project(seg.p1, (G.playerX * ROAD_WIDTH * playerRW) - x, playerY + CAMERA_HEIGHT, camZ, W, H);
      project(seg.p2, (G.playerX * ROAD_WIDTH * playerRW) - x - dx, playerY + CAMERA_HEIGHT, camZ, W, H);

      x = x + dx;
      dx = dx + seg.curve;

      if ((seg.p1.camera.z <= CAMERA_DEPTH) ||
          (seg.p2.screen.y >= seg.p1.screen.y) ||
          (seg.p2.screen.y >= maxy)) continue;

      var checkpoint = (seg.index % CHECKPOINT_SPACING) < (RUMBLE_LENGTH * 2);
      renderSegment(seg, checkpoint);
      maxy = seg.p2.screen.y;
    }
  }

  function renderSegment(seg, checkpoint) {
    var W = LOGICAL_W;
    var p1 = seg.p1.screen, p2 = seg.p2.screen;
    var col = seg.color;
    var rumble = checkpoint ? COL.RUMBLE_CP : col.rumble;
    var lane = checkpoint ? COL.RUMBLE_CP : col.lane;
    var road = checkpoint ? '#8a8f99' : col.road;

    var x1 = p1.x, y1 = p1.y, w1 = p1.w, x2 = p2.x, y2 = p2.y, w2 = p2.w;
    var shore = seg.shore || 0;
    var rw = 1 - 0.42 * shore;                        // the lakefront road narrows toward a single lane
    w1 *= rw; w2 *= rw;
    var r1 = rumbleWidth(w1), r2 = rumbleWidth(w2);
    var l1 = laneMarkerWidth(w1), l2 = laneMarkerWidth(w2);

    // weather tint: snow whitens grass and road; rain darkens (wets) the road
    var _snow = G ? G.snowCover : 0, _wet = G ? G.wet : 0;
    var grassC = col.grass, roadC = road;
    if (_snow > 0.02 || _wet > 0.02) {
      var _gr = hex2rgb(col.grass), _rd = hex2rgb(road);
      if (_snow > 0.02) { _gr = mix(_gr, [236,240,248], _snow * 0.85); _rd = mix(_rd, [222,227,235], _snow * 0.8); }
      if (_wet > 0.02) { _rd = mix(_rd, [26,30,40], _wet * 0.35); }
      grassC = rgbStr(_gr); roadC = rgbStr(_rd);
    }
    // ground. REFLECTION LAKES is two parts: the far horizon band is left to the backdrop
    // lake (so the Mt Rainier mirror shows there and never paints onto the road); the near
    // band draws the lake water surface flanking the road.
    var lakeFar = (seg.biome === 'lake') && shore > 0.4 && ((y1 - LOGICAL_H / 2) <= 90);
    if (lakeFar) {
      // no ground fill here: the large backdrop lake and the mountain mirror show through
    } else if (seg.biome === 'lake' && shore > 0.01) {
      var depth = clamp((y1 - LOGICAL_H / 2) / (LOGICAL_H / 2), 0, 1);
      var gnd = mix(hex2rgb(col.grass), mix([75,148,207], [35,90,140], depth), shore);  // grass fades into open water along the shore
      ctx.fillStyle = rgbStr(gnd);
      ctx.fillRect(0, y2, W, y1 - y2);
      if (shore > 0.25) {                                                  // livelier surface: two scrolling shimmer layers
        var a1 = (Math.sin(seg.index * 0.7 + animClock * 3.4) * 0.5 + 0.5) * 0.16 * shore * (1 - depth * 0.5);
        ctx.fillStyle = 'rgba(232,246,255,' + a1.toFixed(3) + ')';
        ctx.fillRect(0, y2, W, Math.max(1, y1 - y2));
        if (Math.sin(seg.index * 1.3 + animClock * 5.1) > 0.4) {
          ctx.fillStyle = 'rgba(255,255,255,' + (0.10 * shore).toFixed(3) + ')';
          ctx.fillRect(0, y2, W, Math.max(1, y1 - y2));
        }
      }
    } else {
      ctx.fillStyle = grassC;
      ctx.fillRect(0, y2, W, y1 - y2);
    }

    // RAVINE: a banded rock cliff that opens to a hazy gorge view on the cliff side
    if (seg.cliff > 0)      drawCliff(x1 + w1 + r1, y1, x2 + w2 + r2, y2, 1, seg.index, W);
    else if (seg.cliff < 0) drawCliff(x1 - w1 - r1, y1, x2 - w2 - r2, y2, -1, seg.index, W);

    polygon(x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, rumble);
    polygon(x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, rumble);
    if (seg.bridge) roadC = '#474c54';                                 // steel bridge deck (v35)
    polygon(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, roadC);
    if (seg.bridge) {                                                  // deck detail: transverse joints + centre seam
      if (seg.index % 2 === 0) {
        var jh = Math.max(1, (y1 - y2) * 0.42);
        polygon(x1 - w1, y1, x1 + w1, y1, x1 + w1 * 0.96, y1 - jh, x1 - w1 * 0.96, y1 - jh, '#2c2f36');
      }
      polygon(x1 - Math.max(1, w1 * 0.04), y1, x1 + Math.max(1, w1 * 0.04), y1, x2 + Math.max(1, w2 * 0.04), y2, x2 - Math.max(1, w2 * 0.04), y2, '#5a5f67');
    }

    var segLanes = (seg.biome === 'lake' && shore > 0.5) ? 1 : LANES;     // a single undivided lane along the lakefront
    if (lane && segLanes > 1) {
      var lw1 = w1 * 2 / segLanes, lw2 = w2 * 2 / segLanes;
      var lx1 = x1 - w1 + lw1, lx2 = x2 - w2 + lw2;
      for (var k = 1; k < segLanes; lx1 += lw1, lx2 += lw2, k++) {
        polygon(lx1 - l1 / 2, y1, lx1 + l1 / 2, y1, lx2 + l2 / 2, y2, lx2 - l2 / 2, y2, lane);
      }
    }

    // ravine guard rail: continuous fence running along the gorge edge
    if (seg.cliff > 0) drawGuardrail(x1 + w1 + r1, y1, x2 + w2 + r2, y2, w1, seg.index);
    else if (seg.cliff < 0) drawGuardrail(x1 - w1 - r1, y1, x2 - w2 - r2, y2, w1, seg.index);

    if (!lakeFar && seg.fog < 1) {
      ctx.globalAlpha = (1 - seg.fog);
      ctx.fillStyle = COL.FOG;
      ctx.fillRect(0, y2, W, y1 - y2);
      ctx.globalAlpha = 1;
    }
  }

  // The cliff side: a lit rim, a banded rock face, then a hazy band standing in for
  // the open gorge and the landscape across it (so it is not a flat dark wall).
  function drawCliff(ex1, y1, ex2, y2, side, idx, W) {
    var farX = side > 0 ? W : 0;
    var midX1 = ex1 + (farX - ex1) * 0.55;
    var midX2 = ex2 + (farX - ex2) * 0.55;
    polygon(ex1, y1, midX1, y1, midX2, y2, ex2, y2, '#6b4f34');     // warm rock face (the drop)
    polygon(midX1, y1, farX, y1, farX, y2, midX2, y2, '#94897b');   // warm hazy depth (blends, not a separate blue layer)
    var rim = side > 0 ? 2 : -2;
    polygon(ex1, y1, ex1 + rim, y1 - 3, ex2 + (rim > 0 ? 1 : -1), y2 - 2, ex2, y2, COL.CANYON_HI); // lit rim at the edge
  }

  /* =================================================================
     SPRITES : pine trees and neon billboards
     ================================================================= */
  function renderSprites() {
    if (!G) return;
    for (var n = DRAW_DISTANCE - 1; n > 0; n--) {
      var seg = segments[(renderBaseIndex + n) % segments.length];
      if (!seg.sprites || seg.sprites.length === 0) continue;
      var scale = seg.p1.screen.scale;
      if (!isFinite(scale) || scale <= 0) continue;
      for (var i = 0; i < seg.sprites.length; i++) {
        var sp = seg.sprites[i];
        var sx = seg.p1.screen.x + (scale * sp.offset * ROAD_WIDTH * LOGICAL_W / 2);
        var sy = seg.p1.screen.y;
        if (!isFinite(sx) || !isFinite(sy)) continue;
        var size = scale * ROAD_WIDTH * (LOGICAL_W / 2) * SPRITE_SCALE;
        if (sp.source === 'tree') drawTree(sx, sy, size, seg.clip, sp.snowy, sp.scale);
        else if (sp.source === 'rail') drawRail(sx, sy, size, seg.clip);
        else if (sp.source === 'rockpillar') drawRockPillar(sx, sy, size, seg.clip, sp.variant);
        else if (sp.source === 'chevron') drawChevron(sx, sy, size, seg.clip, sp.dir);
        else if (sp.source === 'flower') drawFlower(sx, sy, size, seg.clip, sp.hue);
        else if (sp.source === 'limit') drawLimitSign(sx, sy, size, seg.clip, sp.mph);
        else if (sp.source === 'finish') drawFinishBanner(sx, sy, seg.p1.screen.w, scale, seg.clip);
        else if (sp.source === 'parksign') drawParkSign(sx, sy, size, seg.clip);
        else if (sp.source === 'booth') drawBooth(sx, sy, size, seg.clip);
        else if (sp.source === 'bridgerail') drawBridgeRail(sx, sy, size, seg.clip);
        else if (sp.source === 'waterfall') drawWaterfall(sx, sy, size, seg.clip, sp.scale);
        else if (sp.source === 'tunnel') drawTunnelPortal(sx, sy, seg.p1.screen.w, scale, seg.clip);
        else if (sp.source === 'bridgegate') drawBridgeGate(sx, sy, seg.p1.screen.w, scale, seg.clip);
        else if (sp.source === 'lodge') drawLodge(sx, sy, size, seg.clip);
        else if (sp.source === 'visitorcenter') drawVisitorCenter(sx, sy, size, seg.clip);
        else drawSign(sx, sy, size, seg.clip);
      }
    }
  }

  function drawTree(x, baseY, s, clipY, snowy, scale) {
    if (baseY > clipY) return;
    var h = clamp(s * 0.95 * (scale || 1), 3, LOGICAL_H * 1.6);
    var w = h * 0.5;
    ctx.fillStyle = '#5a3a22';
    ctx.fillRect(Math.round(x - w * 0.07), Math.round(baseY - h * 0.16),
                 Math.max(1, Math.round(w * 0.14)), Math.round(h * 0.18));
    var greens = ['#2f6b34', '#357a3b', '#3f8a45'];
    for (var t = 0; t < 3; t++) {
      var tierY = baseY - h * 0.16 - (h * 0.27) * t;
      var tierW = w * (1 - t * 0.22);
      var tierH = h * 0.4;
      ctx.fillStyle = greens[t];
      triangleFill(x, tierY - tierH, x - tierW / 2, tierY, x + tierW / 2, tierY);
    }
    var sc = G ? G.snowCover : 0;
    var snowAmt = snowy ? 1 : Math.max(0, (sc - 0.3) / 0.7);
    if (snowAmt > 0) {
      ctx.fillStyle = '#eef3ff';
      var topY = baseY - h * 0.16 - (h * 0.27) * 2 - h * 0.4;
      triangleFill(x, topY, x - w * 0.18, topY + h * 0.13, x + w * 0.18, topY + h * 0.13);    // crown snow
      if (snowAmt > 0.5) {                                                                     // settles on the mid tier as it builds
        var midY = baseY - h * 0.16 - (h * 0.27);
        var midW = w * 0.78;
        ctx.fillRect(Math.round(x - midW * 0.5), Math.round(midY - h * 0.4), Math.max(1, Math.round(midW)), Math.max(1, Math.round(h * 0.05)));
      }
    }
  }

  function drawSign(x, baseY, s, clipY) {
    if (baseY > clipY) return;
    var h = clamp(s * 0.6, 3, LOGICAL_H);
    var w = h * 1.0;
    // wooden park sign: post + tan board with two routed lines
    ctx.fillStyle = '#5a3a22';
    ctx.fillRect(Math.round(x - 1), Math.round(baseY - h * 0.55), 2, Math.round(h * 0.55));
    var by = baseY - h;
    ctx.fillStyle = '#7a5126';
    ctx.fillRect(Math.round(x - w / 2), Math.round(by), Math.round(w), Math.round(h * 0.5));
    ctx.fillStyle = '#caa56a';
    ctx.fillRect(Math.round(x - w / 2) + 1, Math.round(by) + 1, Math.round(w) - 2, Math.max(1, Math.round(h * 0.5) - 2));
    ctx.fillStyle = '#5a3a22';
    ctx.fillRect(Math.round(x - w * 0.32), Math.round(by + h * 0.12), Math.round(w * 0.64), Math.max(1, Math.round(h * 0.05)));
    ctx.fillRect(Math.round(x - w * 0.32), Math.round(by + h * 0.26), Math.round(w * 0.44), Math.max(1, Math.round(h * 0.05)));
  }

  // A checkered finish gantry spanning the road, with a PARADISE label band that becomes readable
  // as you approach. Sized from the projected road half-width so it scales with distance.
  function drawFinishBanner(cx, baseY, roadW, scale, clipY) {
    if (baseY > clipY) return;
    roadW = Math.max(6, roadW);
    var span = roadW * 1.12;
    var postH = clamp(span * 1.1, 10, LOGICAL_H * 1.5);
    var beamH = Math.max(3, postH * 0.16);
    var topY = baseY - postH;
    var lx = Math.round(cx - span), rx = Math.round(cx + span);
    var pw = Math.max(2, Math.round(span * 0.10));
    ctx.fillStyle = '#d9dde6';                                  // posts
    ctx.fillRect(lx - pw, Math.round(baseY - postH), pw, Math.round(postH));
    ctx.fillRect(rx, Math.round(baseY - postH), pw, Math.round(postH));
    var bw = rx - lx, cells = 10, cw = bw / cells;              // checkered beam
    for (var c = 0; c < cells; c++) {
      ctx.fillStyle = (c % 2 === 0) ? '#10131b' : '#f2f4f8';
      ctx.fillRect(Math.round(lx + c * cw), Math.round(topY), Math.ceil(cw), Math.round(beamH));
    }
    if (beamH > 7) {                                            // label band when close
      var lh = Math.max(5, beamH * 0.62);
      ctx.fillStyle = '#21e6dc';
      ctx.fillRect(lx, Math.round(topY + beamH), bw, Math.round(lh));
      ctx.fillStyle = '#06222a';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + Math.round(lh * 0.86) + 'px monospace';
      ctx.fillText('PARADISE', cx, Math.round(topY + beamH + lh / 2));
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    }
  }

  // PARADISE RUN set pieces -------------------------------------------------
  // A big rustic national-park entrance sign on two posts.
  function drawParkSign(x, baseY, s, clipY) {
    if (baseY > clipY) return;
    var h = clamp(s * 1.5, 4, LOGICAL_H), w = h * 1.7, by = baseY - h;
    ctx.fillStyle = '#4a3220';
    ctx.fillRect(Math.round(x - w * 0.42), Math.round(by + h * 0.45), Math.max(1, Math.round(w * 0.05)), Math.round(h * 0.55));
    ctx.fillRect(Math.round(x + w * 0.37), Math.round(by + h * 0.45), Math.max(1, Math.round(w * 0.05)), Math.round(h * 0.55));
    ctx.fillStyle = '#6e4a28'; ctx.fillRect(Math.round(x - w / 2), Math.round(by), Math.round(w), Math.round(h * 0.5));
    ctx.fillStyle = '#825a30'; ctx.fillRect(Math.round(x - w / 2) + 1, Math.round(by) + 1, Math.round(w) - 2, Math.round(h * 0.5) - 2);
    if (h > 30) {
      ctx.fillStyle = '#f1e7d0'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + Math.max(4, Math.round(h * 0.12)) + 'px monospace';
