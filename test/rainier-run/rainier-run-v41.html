      ctx.fillText('MOUNT RAINIER', x, by + h * 0.17);
      ctx.font = 'bold ' + Math.max(3, Math.round(h * 0.10)) + 'px monospace';
      ctx.fillText('NATIONAL PARK', x, by + h * 0.34);
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    } else {
      ctx.fillStyle = '#caa56a';
      ctx.fillRect(Math.round(x - w * 0.3), Math.round(by + h * 0.16), Math.round(w * 0.6), Math.max(1, Math.round(h * 0.05)));
      ctx.fillRect(Math.round(x - w * 0.3), Math.round(by + h * 0.30), Math.round(w * 0.45), Math.max(1, Math.round(h * 0.05)));
    }
  }

  // A small ranger booth: gabled roof, lit wall, a glowing window.
  function drawBooth(x, baseY, s, clipY) {
    if (baseY > clipY) return;
    var h = clamp(s * 1.2, 4, LOGICAL_H), w = h * 0.9, by = baseY - h;
    ctx.fillStyle = '#caa56a'; ctx.fillRect(Math.round(x - w / 2), Math.round(by + h * 0.35), Math.round(w), Math.round(h * 0.65));
    ctx.fillStyle = '#a07c46'; ctx.fillRect(Math.round(x - w / 2), Math.round(by + h * 0.35), Math.max(1, Math.round(w * 0.18)), Math.round(h * 0.65));
    ctx.fillStyle = '#3a4a3a'; triangleFill(x, by, x - w * 0.62, by + h * 0.4, x + w * 0.62, by + h * 0.4);
    ctx.fillStyle = '#22324a'; ctx.fillRect(Math.round(x - w * 0.22), Math.round(by + h * 0.5), Math.round(w * 0.44), Math.round(h * 0.28));
    ctx.fillStyle = '#8fc0e0'; ctx.fillRect(Math.round(x - w * 0.20), Math.round(by + h * 0.52), Math.round(w * 0.40), Math.round(h * 0.12));
  }

  // A steel bridge-truss bay: a vertical post, a top chord, and an X cross-brace (v34).
  function drawBridgeRail(x, baseY, s, clipY) {
    if (baseY > clipY) return;
    var h = clamp(s * 0.62, 3, LOGICAL_H * 0.8), w = Math.max(3, h * 0.5), topY = baseY - h;
    ctx.fillStyle = '#8a9098'; ctx.fillRect(Math.round(x - w * 0.10), Math.round(topY), Math.max(1, Math.round(w * 0.2)), Math.round(h));   // post
    ctx.fillStyle = '#aab0b8'; ctx.fillRect(Math.round(x - w), Math.round(topY), Math.round(w * 2), Math.max(1, Math.round(h * 0.14)));      // top chord
    ctx.strokeStyle = '#6f757d'; ctx.lineWidth = Math.max(1, w * 0.10);                                                                      // X cross-brace
    ctx.beginPath();
    ctx.moveTo(x - w, baseY); ctx.lineTo(x + w, topY + h * 0.16);
    ctx.moveTo(x + w, baseY); ctx.lineTo(x - w, topY + h * 0.16);
    ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = '#cfd4da'; ctx.fillRect(Math.round(x - w), Math.round(topY), Math.round(w * 2), 1);                                       // lit edge
  }

  // A steel truss gateway spanning the road at each end of the bridge (v34).
  function drawBridgeGate(cx, baseY, roadW, scale, clipY) {
    if (baseY > clipY) return;
    roadW = Math.max(6, roadW);
    var span = roadW * 1.12, h = clamp(span * 1.3, 12, LOGICAL_H * 1.6), topY = baseY - h;
    var lx = Math.round(cx - span), rx = Math.round(cx + span), pw = Math.max(2, Math.round(span * 0.10));
    ctx.fillStyle = '#9aa0a8'; ctx.fillRect(lx - pw, Math.round(topY), pw, Math.round(h)); ctx.fillRect(rx, Math.round(topY), pw, Math.round(h));  // towers
    var beamH = Math.max(3, h * 0.12);
    ctx.fillStyle = '#7f858d'; ctx.fillRect(lx, Math.round(topY), rx - lx, Math.round(beamH));        // top beam
    ctx.fillStyle = '#b6bcc4'; ctx.fillRect(lx, Math.round(topY), rx - lx, 1);
    ctx.strokeStyle = '#6a7079'; ctx.lineWidth = Math.max(1, span * 0.03);                            // diagonal truss members
    var cells = 8, cw = (rx - lx) / cells;
    ctx.beginPath();
    for (var c = 0; c < cells; c++) { var bx = lx + c * cw; ctx.moveTo(bx, topY + beamH); ctx.lineTo(bx + cw, topY); }
    ctx.stroke(); ctx.lineWidth = 1;
  }

  // A waterfall down the gorge wall: white falling streaks, animated, with a misty pool.
  function drawWaterfall(x, baseY, s, clipY, scale) {
    if (baseY > clipY) return;
    var h = clamp(s * 2.2 * (scale || 1), 6, LOGICAL_H * 2), w = Math.max(2, h * 0.07);
    ctx.fillStyle = '#5a4632'; ctx.fillRect(Math.round(x - w * 1.4), Math.round(baseY - h), Math.round(w * 2.8), Math.round(h));
    var cols = ['rgba(226,240,252,0.85)', '#ffffff', 'rgba(226,240,252,0.85)'];
    for (var c = -1; c <= 1; c++) {
      ctx.fillStyle = cols[c + 1];
      ctx.fillRect(Math.round(x + c * w * 0.7 - w * 0.3), Math.round(baseY - h), Math.max(1, Math.round(w * 0.6)), Math.round(h));
    }
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (var d = 0; d < 4; d++) {
      var yy = baseY - ((animClock * 120 + d * h * 0.27) % h);
      ctx.fillRect(Math.round(x - w * 0.5), Math.round(yy), Math.max(1, Math.round(w)), Math.max(1, Math.round(h * 0.05)));
    }
    ctx.fillStyle = 'rgba(230,245,255,0.55)';
    ctx.fillRect(Math.round(x - w * 1.6), Math.round(baseY - h * 0.06), Math.round(w * 3.2), Math.max(1, Math.round(h * 0.07)));
  }

  // A rock tunnel portal spanning the road, with a black arched mouth.
  function drawTunnelPortal(cx, baseY, roadW, scale, clipY) {
    if (baseY > clipY) return;
    roadW = Math.max(6, roadW);
    var span = roadW * 1.5, h = clamp(span * 1.5, 12, LOGICAL_H * 1.8), topY = baseY - h;
    ctx.fillStyle = '#5b5048'; ctx.fillRect(Math.round(cx - span), Math.round(topY), Math.round(span * 2), Math.round(h));
    ctx.fillStyle = '#6a5f55'; ctx.fillRect(Math.round(cx - span), Math.round(topY), Math.round(span * 2), Math.max(1, Math.round(h * 0.12)));
    var ow = roadW * 1.12, oh = h * 0.78, oy = baseY - oh;
    ctx.fillStyle = '#070608';
    ctx.beginPath();
    ctx.moveTo(cx - ow, baseY);
    ctx.lineTo(cx - ow, oy + ow * 0.5);
    ctx.quadraticCurveTo(cx, oy - ow * 0.2, cx + ow, oy + ow * 0.5);
    ctx.lineTo(cx + ow, baseY);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a322c'; ctx.lineWidth = Math.max(1, roadW * 0.05); ctx.stroke(); ctx.lineWidth = 1;
  }

  // Paradise Inn: a big timber lodge with a steep snow-laden roof and warm windows.
  function drawLodge(x, baseY, s, clipY) {
    if (baseY > clipY) return;
    var h = clamp(s * 1.9, 6, LOGICAL_H * 1.7), w = h * 1.5, by = baseY - h;
    ctx.fillStyle = '#6b4a2e'; ctx.fillRect(Math.round(x - w / 2), Math.round(by + h * 0.30), Math.round(w), Math.round(h * 0.70));
    ctx.fillStyle = '#5a3d26'; ctx.fillRect(Math.round(x - w / 2), Math.round(by + h * 0.30), Math.max(1, Math.round(w * 0.16)), Math.round(h * 0.70));
    ctx.fillStyle = '#43362a'; triangleFill(x, by, x - w * 0.58, by + h * 0.36, x + w * 0.58, by + h * 0.36);
    ctx.fillStyle = '#eef4ff'; triangleFill(x, by, x - w * 0.30, by + h * 0.18, x + w * 0.30, by + h * 0.18);
    ctx.fillStyle = '#ffd98a';
    for (var ry = 0; ry < 2; ry++) for (var cn = -2; cn <= 2; cn++)
      ctx.fillRect(Math.round(x + cn * w * 0.17 - w * 0.04), Math.round(by + h * 0.42 + ry * h * 0.22), Math.max(1, Math.round(w * 0.08)), Math.max(1, Math.round(h * 0.10)));
  }

  // The visitor center: a round base with a glass band under a wide conical roof.
  function drawVisitorCenter(x, baseY, s, clipY) {
    if (baseY > clipY) return;
    var h = clamp(s * 1.7, 6, LOGICAL_H * 1.6), w = h * 1.2, by = baseY - h;
    ctx.fillStyle = '#8a8f98'; ctx.fillRect(Math.round(x - w * 0.4), Math.round(by + h * 0.45), Math.round(w * 0.8), Math.round(h * 0.55));
    ctx.fillStyle = '#6f747d'; ctx.fillRect(Math.round(x - w * 0.4), Math.round(by + h * 0.45), Math.max(1, Math.round(w * 0.14)), Math.round(h * 0.55));
    ctx.fillStyle = '#7fb0d8'; ctx.fillRect(Math.round(x - w * 0.36), Math.round(by + h * 0.5), Math.round(w * 0.72), Math.max(1, Math.round(h * 0.12)));
    ctx.fillStyle = '#4a5560'; triangleFill(x, by, x - w * 0.55, by + h * 0.48, x + w * 0.55, by + h * 0.48);
    ctx.fillStyle = '#5a6570'; triangleFill(x, by, x, by + h * 0.48, x + w * 0.55, by + h * 0.48);
  }

  // A wooden post-and-rail guard fence: a post plus two horizontal rails that span wide enough to
  // meet the neighbouring posts, so a run of them reads as a continuous fence along the gorge edge.
  function drawRail(x, baseY, s, clipY) {
    if (baseY > clipY) return;
    var h = clamp(s * 0.42, 3, LOGICAL_H * 0.5);
    var w = Math.max(3, h * 0.95);
    ctx.fillStyle = '#8a6038';                                   // two rails (span across to neighbours)
    ctx.fillRect(Math.round(x - w), Math.round(baseY - h * 0.92), Math.round(w * 2), Math.max(1, Math.round(h * 0.14)));
    ctx.fillRect(Math.round(x - w), Math.round(baseY - h * 0.50), Math.round(w * 2), Math.max(1, Math.round(h * 0.14)));
    ctx.fillStyle = '#6b4a2a';                                   // post
    ctx.fillRect(Math.round(x - w * 0.07), Math.round(baseY - h), Math.max(1, Math.round(w * 0.14)), Math.round(h));
    ctx.fillStyle = '#7d5832';                                   // post lit edge
    ctx.fillRect(Math.round(x - w * 0.07), Math.round(baseY - h), 1, Math.round(h));
  }

  // A big chunky rock pillar (granite), flat-shaded with a lit and a shadow face and a couple of
  // strata; placed densely along the ravine to build a repeating rock wall (OutRunners style).
  function drawRockPillar(x, baseY, s, clipY, variant) {
    if (baseY > clipY) return;
    variant = variant || 0;
    var h = clamp(s * 2.6, 10, LOGICAL_H * 2.4);                 // much taller (Director)
    var w = h * (0.26 + (variant % 3) * 0.04), topW = w * 0.72, topY = baseY - h;
    ctx.fillStyle = '#8a6a44';                                   // lit body (brown, matches the canyon rock)
    ctx.beginPath();
    ctx.moveTo(x - w / 2, baseY);
    ctx.lineTo(x - topW / 2, topY + h * 0.06);
    ctx.lineTo(x - topW * 0.3, topY);
    ctx.lineTo(x + topW * 0.3, topY);
    ctx.lineTo(x + topW / 2, topY + h * 0.06);
    ctx.lineTo(x + w / 2, baseY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5e4530';                                   // shadow side (dark brown)
    ctx.beginPath();
    ctx.moveTo(x + topW * 0.05, topY); ctx.lineTo(x + topW / 2, topY + h * 0.06);
    ctx.lineTo(x + w / 2, baseY); ctx.lineTo(x + w * 0.12, baseY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a8835a';                                   // lit left edge
    ctx.fillRect(Math.round(x - w / 2), Math.round(topY + h * 0.06), Math.max(1, Math.round(w * 0.10)), Math.round(h * 0.92));
    ctx.fillStyle = '#6e5238';                                   // strata
    for (var st = 1; st <= 3; st++) {
      var sy = topY + h * (0.24 * st + 0.10);
      ctx.fillRect(Math.round(x - w * 0.42), Math.round(sy), Math.round(w * 0.84), Math.max(1, Math.round(h * 0.035)));
    }
  }

  // A continuous post-and-rail guard fence running ALONG the gorge edge (drawn per road segment so
  // the rails recede with the road, the correct orientation). Posts every few segments.
  function drawGuardrail(ex1, y1, ex2, y2, w1, idx) {
    var h1 = clamp(w1 * 0.16, 2, 72), h2 = h1 * 0.78;
    polygon(ex1, y1 - h1, ex2, y2 - h2, ex2, y2 - h2 * 0.82, ex1, y1 - h1 * 0.82, '#8a6038');         // top rail
    polygon(ex1, y1 - h1 * 0.52, ex2, y2 - h2 * 0.52, ex2, y2 - h2 * 0.38, ex1, y1 - h1 * 0.38, '#79522e'); // lower rail
    if (idx % 3 === 0) {
      var pw = Math.max(1, w1 * 0.03);
      ctx.fillStyle = '#5e4126';
      ctx.fillRect(Math.round(ex1 - pw / 2), Math.round(y1 - h1), Math.max(1, Math.round(pw)), Math.round(h1));
    }
  }

  // A roadside curve-warning board: yellow plate with black chevrons pointing the bend way.
  function drawChevron(x, baseY, s, clipY, dir) {
    if (baseY > clipY) return;
    var h = clamp(s * 0.5, 4, LOGICAL_H);
    var w = h * 0.9;
    var d = dir > 0 ? 1 : -1;
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(Math.round(x - 1), Math.round(baseY - h * 0.5), 2, Math.round(h * 0.5));
    var by = baseY - h;
    ctx.fillStyle = '#f4c020';
    ctx.fillRect(Math.round(x - w / 2), Math.round(by), Math.round(w), Math.round(h * 0.55));
    ctx.fillStyle = '#1a1a1a';
    for (var i = 0; i < 2; i++) {
      var cxp = x - w * 0.20 + i * w * 0.28;
      var topx = cxp - d * w * 0.12, tipx = cxp + d * w * 0.12;
      ctx.beginPath();
      ctx.moveTo(Math.round(topx), Math.round(by + h * 0.12));
      ctx.lineTo(Math.round(tipx), Math.round(by + h * 0.27));
      ctx.lineTo(Math.round(topx), Math.round(by + h * 0.42));
      ctx.lineTo(Math.round(topx + d * w * 0.06), Math.round(by + h * 0.42));
      ctx.lineTo(Math.round(tipx + d * w * 0.06), Math.round(by + h * 0.27));
      ctx.lineTo(Math.round(topx + d * w * 0.06), Math.round(by + h * 0.12));
      ctx.closePath(); ctx.fill();
    }
  }

  // Tiny roadside flowers: a small green tuft with a few coloured petals. Visible up close.
  function drawFlower(x, baseY, s, clipY, hue) {
    if (baseY > clipY) return;
    var h = clamp(s * 0.13, 1, 16);
    if (h < 1.5) return;
    var cols = ['#ff5d7a', '#ffd24a', '#c77dff', '#ff9e3d'];
    var c = cols[(hue || 0) % cols.length];
    ctx.fillStyle = '#2f6b34';
    ctx.fillRect(Math.round(x - h * 0.5), Math.round(baseY - h), Math.max(1, Math.round(h)), Math.max(1, Math.round(h)));
    ctx.fillStyle = c;
    for (var i = 0; i < 3; i++) {
      var dx = (i - 1) * Math.max(1, h * 0.5);
      ctx.fillRect(Math.round(x + dx - 1), Math.round(baseY - h - 1), 2, 2);
    }
  }

  /* =================================================================
     CAR  (rear view, fixed near the bottom; road shifts under it)
     ================================================================= */
  // Tire marks + skid smoke, drawn on the road behind the rear wheels (screen
  // space). They darken under braking and smear sideways while sliding.
  function drawTireMarks(cx, cy) {
    if (!G || G.skid <= 0.02) return;
    var s = G.skid, brake = G.skidBraking, bw = 84;
    var wheels = [cx - bw * 0.36, cx + bw * 0.36];
    var up = Math.round(6 + 16 * s), down = 18;
    var smear = clamp(-G.latVel * 0.5, -9, 9);
    var col = brake ? '28,26,28' : '38,36,40';
    for (var wi = 0; wi < wheels.length; wi++) {
      var wx = wheels[wi];
      for (var i = -up; i <= down; i += 2) {
        var yy = cy + 4 + i;
        if (yy > LOGICAL_H || yy < 0) continue;
        var p = (i + up) / (up + down);
        var xx = wx + smear * (0.5 - p);
        var fade = 1 - Math.abs(p - 0.5) * 1.6;
        if (fade <= 0) continue;
        ctx.fillStyle = 'rgba(' + col + ',' + (0.55 * s * fade).toFixed(3) + ')';
        ctx.fillRect(Math.round(xx - 1.5), Math.round(yy), 3, 2);
      }
    }
    if (s > 0.4) {
      var dir = (G.latVel < 0 ? 1 : -1);
      for (var k = 0; k < 4; k++) {
        var sa = (0.22 * s) - k * 0.04;
        if (sa <= 0) continue;
        var sox = cx + dir * (10 + k * 9) + Math.sin(animClock * 8 + k) * 2;
        var soy = cy - 4 + Math.sin(animClock * 6 + k * 1.3) * 2;
        var ss = 6 + k * 3;
        ctx.fillStyle = 'rgba(225,225,235,' + sa.toFixed(3) + ')';
        ctx.fillRect(Math.round(sox - ss / 2), Math.round(soy), Math.round(ss), Math.round(ss * 0.7));
      }
    }
  }

  function roundRectPathOn(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function drawTailOn(g, x, y, w, h, braking) {
    g.fillStyle = braking ? '#ff2f3e' : '#c22633';
    roundRectPathOn(g, x, y, w, h, 2); g.fill();
    g.fillStyle = braking ? '#ffd0cf' : '#e0606a';
    g.fillRect(Math.round(x + w * 0.12), Math.round(y + h * 0.32), Math.round(w * 0.76), Math.max(1, Math.round(h * 0.3)));
    g.fillStyle = braking ? '#ffcf6a' : '#caa030';
    g.fillRect(Math.round(x), Math.round(y + h * 0.05), Math.max(1, Math.round(w * 0.22)), Math.max(1, Math.round(h * 0.24)));
  }

  // The player car, authored as PIXEL ART: flat hard-edged colour blocks, a limited palette, manual
  // shading bands and a dark outline, painted into an art buffer and scaled up nearest-neighbour. It
  // is drawn at different VIEWS: a quantized turn step swings it into a 3/4 angle on steep turns, and a
  // pitch step (from the road grade) tips it for uphill / downhill, the OutRunners way. (v26)
  function paintCar(g, turn, pitch, braking, drifting, driftDir, li, spd) {
    var W = CAR_AW, H = CAR_AH, cx0 = W / 2;
    var turnAmt = turn * 16;                                   // wider yaw into turns (v40)
    function ox(y) { return turnAmt * (1 - y / H); }
    var pY = pitch * 5, lean = turn * 4;

    var OUT = '#0a1430';
    var bHi = '#a6caff', bLt = '#5f95ec', bMd = '#356bbe', bMd2 = '#264f96', bDk = '#1a3870', bAO = '#102450';
    var crease = '#cfe2ff', trimDk = '#93a0ae', chrome = '#eaf0f7';
    var tire = '#100c12', tireHi = '#37323c', rim = '#c2c9d2', rimDk = '#5a626e';
    var seat = '#1c1610', cockpit = '#120d16', hoop = '#0c0911';
    var skin = '#b6794a', skinHi = '#d6a06a';

    // sculpted rear: narrow greenhouse, haunches bulging over the wheels, tucked diffuser
    function halfW(y) {
      if (y < 34) return 23 + (y - 26) * 1.3;
      if (y < 50) return 33 + (y - 34) * 1.06;
      if (y < 58) return 50;
      if (y < 67) return 50 - (y - 58) * 1.7;
      return 35 - (y - 67) * 1.4;
    }
    function row(y, hw, col) {
      g.fillStyle = col;
      g.fillRect(Math.round(cx0 + ox(y) - hw), y, Math.round(hw * 2), 1);
    }

    g.fillStyle = 'rgba(0,0,0,0.32)';                                       // ground shadow
    g.beginPath(); g.ellipse(cx0 + ox(74), 78, 52, 6, 0, 0, Math.PI * 2); g.fill();

    function wheel(side) {                                                  // wheels tucked at the corners
      var wx = Math.round(cx0 + ox(62) + side * 44 - 7);
      g.fillStyle = OUT;    g.fillRect(wx - 1, 51, 16, 22);
      g.fillStyle = tire;   g.fillRect(wx, 52, 14, 20);
      g.fillStyle = tireHi;   g.fillRect(wx + 2, 54, 10, 2);              // sheen across the TOP (v29: was a side strip) so the black face points at the camera
      g.fillStyle = '#0a0810'; g.fillRect(wx + 1, 69, 12, 2);              // shaded lower lip, reads as round
      // spinning rim: a hub with three spokes that rotate with speed (v28)
      var hubx = wx + 7, huby = 63, spin = animClock * (3 + spd * 34);
      g.fillStyle = rimDk;  g.fillRect(hubx - 4, huby - 4, 9, 9);
      g.fillStyle = rim;
      for (var sp = 0; sp < 3; sp++) {
        var a = spin + sp * 2.0944;
        g.fillRect(Math.round(hubx + Math.cos(a) * 3 - 1), Math.round(huby + Math.sin(a) * 3 - 1), 2, 2);
      }
      g.fillStyle = '#e8eef6'; g.fillRect(hubx - 1, huby - 1, 2, 2);
    }
    wheel(-1); wheel(1);

    var y;
    for (y = 25; y <= 73; y++) row(y, halfW(y) + 1, OUT);                   // body outline
    for (y = 26; y <= 72; y++) {                                            // shaded fills
      var col = y < 30 ? bHi : y < 38 ? bLt : y < 48 ? bMd : y < 58 ? bMd2 : y < 67 ? bDk : bAO;
      row(y, halfW(y), col);
    }
    row(47, halfW(47) - 2, crease);                                         // haunch shoulder crease

    function arch(side) { g.fillStyle = OUT; g.fillRect(Math.round(cx0 + ox(52) + side * 44 - 10), 50, 20, 3); }
    arch(-1); arch(1);

    g.fillStyle = bMd2; g.fillRect(Math.round(cx0 + ox(42) - 30), 41, 60, 5);   // tonneau / deck panel
    g.fillStyle = crease; g.fillRect(Math.round(cx0 + ox(41) - 27), 41, 54, 1);

    function tail(side) {                                                   // slim LED taillights
      var lx = Math.round(cx0 + ox(55) + side * 22 - 11);
      g.fillStyle = OUT; g.fillRect(lx - 1, 53, 24, 6);
      g.fillStyle = braking ? '#ff3a4a' : '#cc2f3d'; g.fillRect(lx, 54, 22, 4);
      g.fillStyle = braking ? '#ffd6d2' : '#ef7b82'; g.fillRect(lx + 2, 55, 18, 1);
    }
    tail(-1); tail(1);
    g.fillStyle = braking ? '#ff5560' : '#7a2230';                         // connecting strip
    g.fillRect(Math.round(cx0 + ox(55) - 12), 55, 24, 1);

    g.fillStyle = bAO; g.fillRect(Math.round(cx0 + ox(67) - 30), 65, 60, 5);    // bumper
    g.fillStyle = OUT;                                                          // diffuser fins
    var d; for (d = -2; d <= 2; d++) g.fillRect(Math.round(cx0 + ox(70) + d * 7 - 1), 68, 2, 4);
    g.fillStyle = chrome;                                                       // twin exhausts
    g.fillRect(Math.round(cx0 + ox(71) - 17), 69, 4, 2);
    g.fillRect(Math.round(cx0 + ox(71) + 13), 69, 4, 2);

    g.fillStyle = cockpit; g.fillRect(Math.round(cx0 + ox(38) - 27), Math.round(33 + pY), 54, 11);  // cockpit

    function rider(hx, hairCol, hairHi, isWoman, top, topHi, topSh) {
      hx = hx + lean;
      var hyH = 23 + pY;
      g.fillStyle = hoop;  g.fillRect(Math.round(hx - 9), Math.round(29 + pY), 18, 4);     // roll hoop
      g.fillStyle = seat;  g.fillRect(Math.round(hx - 8), Math.round(31 + pY), 16, 11);    // seat back
      g.fillStyle = topSh; g.fillRect(Math.round(hx - 9), Math.round(35 + pY), 18, 9);     // shoulders shadow
      g.fillStyle = top;   g.fillRect(Math.round(hx - 9), Math.round(35 + pY), 16, 8);     // shirt
      g.fillStyle = topHi; g.fillRect(Math.round(hx - 8), Math.round(36 + pY), 6, 2);      // shirt highlight
      g.fillStyle = OUT;   g.fillRect(Math.round(hx - 6), Math.round(hyH - 1), 13, 14);    // head outline
      g.fillStyle = skin;  g.fillRect(Math.round(hx - 5), Math.round(hyH), 11, 12);        // head
      if (isWoman) {
        g.fillStyle = hairCol;
        g.fillRect(Math.round(hx - 6), Math.round(hyH - 1), 12, 8);
        g.fillRect(Math.round(hx - 7), Math.round(hyH + 6), 14, 13 + Math.round(spd * 4));
        g.fillStyle = hairHi; g.fillRect(Math.round(hx - 4), Math.round(hyH), 3, 5);
      } else {
        g.fillStyle = hairCol;
        g.fillRect(Math.round(hx - 6), Math.round(hyH - 2), 12, 8);
        g.fillRect(Math.round(hx - 7), Math.round(hyH), 4, 6);
        g.fillRect(Math.round(hx + 3), Math.round(hyH), 4, 6);
        g.fillStyle = hairHi; g.fillRect(Math.round(hx - 4), Math.round(hyH - 1), 4, 2);
      }
      if (Math.abs(turn) > 0.55) {
        var fs = turn > 0 ? 1 : -1;
        g.fillStyle = skinHi; g.fillRect(Math.round(hx + fs * 4), Math.round(hyH + 4), 2, 4);
      }
    }
    rider(cx0 - 15, '#181210', '#33261d', false, '#16b0b0', '#46d6d6', '#0d6e6e');   // driver
    rider(cx0 + 15, '#241812', '#4d3320', true,  '#e8447a', '#ff7da8', '#ad2a54');   // passenger

    g.fillStyle = trimDk; var wsx = Math.round(cx0 + ox(31) - 22); g.fillRect(wsx, Math.round(30 + pY), 44, 2);  // windshield
    g.fillStyle = 'rgba(150,180,210,0.40)'; g.fillRect(wsx + 2, Math.round(31 + pY), 40, 2);
    g.fillStyle = bMd;                                                                                          // mirrors
    g.fillRect(Math.round(cx0 + ox(40) - 34), Math.round(39 + pY), 5, 3);
    g.fillRect(Math.round(cx0 + ox(40) + 29), Math.round(39 + pY), 5, 3);

    var glow = (braking ? 0.7 : 0) + (li > 0.1 ? 0.4 * li : 0);                                                 // brake / night glow
    if (glow > 0.02) {
      g.save(); g.globalCompositeOperation = 'lighter';
      g.fillStyle = 'rgba(255,60,70,' + Math.min(0.85, glow).toFixed(3) + ')';
      g.fillRect(Math.round(cx0 + ox(55) - 33), 52, 22, 7);
      g.fillRect(Math.round(cx0 + ox(55) + 11), 52, 22, 7);
      g.restore();
    }
  }

  // Orchestrates the car: road-space effects (tire marks, headlights) to the main canvas, then the
  // pixel-art car painted into its art buffer and blitted scaled up, then the over-the-car effects.
  function drawCar(steer, braking, drifting, driftDir, accel) {
    var cx = LOGICAL_W / 2 + steer * 4 + (drifting ? driftDir * 9 : 0);   // slides further out in a drift (v21)
    var cy = LOGICAL_H - 16;
    var roll = steer * (drifting ? 8 : 3) + (drifting ? driftDir * 11 : 0); // banks/yaws into a turn, much harder in a drift (v40)
    var spd = G ? clamp(G.speed / MAX_SPEED, 0, 1) : 0.4;
    var _dl = G ? (1 - Math.cos(G.tod * 2 * Math.PI)) / 2 : 1;
    var li = clamp((0.5 - _dl) / 0.4, 0, 1);
    if (G) li = Math.max(li, G.wet * 0.5);

    drawTireMarks(cx, cy);
    drawHeadlights(cx, cy, li);

    var bob = braking ? -2 : (accel && spd > 0.3 ? 1 : 0);       // brake lifts the rear; accel squats it

    // pick the VIEW: a quantized turn step (like OutRunners' angle sprites) and an uphill/downhill pitch
    var rawTurn = drifting ? driftDir : clamp(steer, -1, 1);
    var turnStep = Math.round(rawTurn * 2) / 2;                 // -1, -0.5, 0, 0.5, 1
    var pitchStep = 0;
    if (G) {
      var hereSeg = findSegment(G.position + PLAYER_Z);
      if (hereSeg) {
        var grade = (hereSeg.p2.world.y - hereSeg.p1.world.y) / SEGMENT_LENGTH;
        pitchStep = grade > 0.04 ? 1 : (grade < -0.04 ? -1 : 0);
      }
    }
    if (!carArt) {
      carArt = document.createElement('canvas');
      carArt.width = CAR_AW; carArt.height = CAR_AH;
      carArtCtx = carArt.getContext('2d');
    }
    var g = carArtCtx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, CAR_AW, CAR_AH);
    paintCar(g, turnStep, pitchStep, braking, drifting, driftDir, li, spd);
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    var _dW = Math.round(CAR_AW * CAR_SCALE), _dH = Math.round(CAR_AH * CAR_SCALE);
    var _dX = Math.round(cx - CAR_AW * CAR_SCALE / 2), _dY = Math.round(cy - CAR_AH * CAR_SCALE + bob + 22);  // lower (v28)
    if (roll) {                                                  // yaw/bank the whole car into a turn or drift (v40)
      var _pvx = cx, _pvy = _dY + _dH * 0.66;                    // pivot near the rear axle
      ctx.translate(_pvx, _pvy); ctx.rotate(roll * Math.PI / 180); ctx.translate(-_pvx, -_pvy);
    }
    ctx.drawImage(carArt, 0, 0, CAR_AW, CAR_AH, _dX, _dY, _dW, _dH);
    ctx.restore();

    // EFFECTS drawn OVER the car (it sits at the screen bottom, so behind-the-car puffs were hidden):
    // exhaust on the throttle, tan dust off the outer tire on a hard turn or drift, brake smoke.
    if (accel && spd > 0.10) {
      for (var e = 0; e < 3; e++) {
        var eph = (animClock * 2.6 + e * 0.5) % 1;
        var ex = cx + (e - 1) * 14 + Math.sin(animClock * 5 + e) * 2;
        var ey = cy + 7 + eph * 9, er = 3 + eph * 5;
        ctx.fillStyle = 'rgba(172,172,180,' + (0.30 * (1 - eph) * (0.4 + spd)).toFixed(3) + ')';
        ctx.beginPath(); ctx.ellipse(ex, ey, er, er * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    // DRIFT smoke (v21, OutRunners look): white tire smoke billows off all four wheels, flung outward
    if (G && drifting && spd > 0.18) {
      var wheels = [[-38, 2], [38, 2], [-31, -7], [31, -7]];   // rear-left, rear-right, front-left, front-right
      for (var w = 0; w < wheels.length; w++) {
        var wx = cx + wheels[w][0], wy = cy + wheels[w][1];
        var out = wheels[w][0] > 0 ? 1 : -1;
        for (var dw = 0; dw < 5; dw++) {
          var dphw = (animClock * 3.4 + dw * 0.34 + w * 0.22) % 1;
          var puffX = wx + out * dphw * 24 + Math.sin(animClock * 7 + dw + w) * 3;
          var puffY = wy - dphw * 9;
          var pr = 8 + dphw * 18;                                // bigger clouds (v23)
          ctx.fillStyle = 'rgba(238,240,245,' + (0.46 * (1 - dphw)).toFixed(3) + ')';
          ctx.beginPath(); ctx.ellipse(puffX, puffY, pr, pr * 0.8, 0, 0, Math.PI * 2); ctx.fill();
        }
      }
    } else if (G && spd > 0.22 && Math.abs(steer) > 0.40) {
      // a hard (non-drift) turn just scuffs a little tan dust off the outer tire
      var damt = clamp((Math.abs(steer) - 0.40) / 0.60, 0, 1);
      var dsgn = steer > 0 ? -1 : 1;
      var ox0 = cx + dsgn * 34;
      for (var d = 0; d < 5; d++) {
        var dph = (animClock * 4.0 + d * 0.3) % 1;
        var dxp = ox0 + dsgn * dph * 18;
        var dyp = cy - 1 - dph * 5;
        var dr = 4 + dph * 8 + damt * 3;
        ctx.fillStyle = 'rgba(200,182,148,' + (0.30 * (1 - dph) * damt).toFixed(3) + ')';
        ctx.beginPath(); ctx.ellipse(dxp, dyp, dr, dr * 0.8, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (braking && spd > 0.15) {
      for (var bk = 0; bk < 4; bk++) {
        var bph = (animClock * 3.6 + bk * 0.4) % 1;
        var bxp = cx + (bk < 2 ? -1 : 1) * (38 + bph * 8);
        var byp = cy - 2 + bph * 6;
        ctx.fillStyle = 'rgba(150,150,158,' + (0.34 * (1 - bph) * (0.4 + spd)).toFixed(3) + ')';
        ctx.beginPath(); ctx.ellipse(bxp, byp, 5 + bph * 7, 5, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // Headlights (night / heavy rain): twin beams that aim DOWN THE ROAD AHEAD, biased into the
  // bend and stopping at the horizon (never the sky), plus a bright pool in front of the car.
  function drawHeadlights(cx, cy, li) {
    if (li <= 0.02) return;
    var horizon = LOGICAL_H / 2, topY = horizon + 16;
    var aimX = cx - bgOffset * 0.45, oy = cy - 20;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var s = -1; s <= 1; s += 2) {
      var ox = cx + s * 15, tx = aimX + s * 9;
      var grd = ctx.createLinearGradient(ox, oy, tx, topY);
      grd.addColorStop(0, 'rgba(255,242,200,' + (0.40 * li).toFixed(3) + ')');
      grd.addColorStop(1, 'rgba(255,242,200,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(ox - 9, oy); ctx.lineTo(ox + 9, oy);
      ctx.lineTo(tx + 4, topY); ctx.lineTo(tx - 4, topY);
      ctx.closePath(); ctx.fill();
    }
    var pg = ctx.createRadialGradient(cx, cy - 28, 2, cx, cy - 28, 42);
    pg.addColorStop(0, 'rgba(255,244,205,' + (0.28 * li).toFixed(3) + ')');
    pg.addColorStop(1, 'rgba(255,244,205,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(cx, cy - 28, 42, 20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // The car sprite in LOCAL coords (origin at car centre), drawn into the pixelation buffer g.
  function drawCarSprite(g, steer, braking, drifting, driftDir, accel, li, spd) {
    var bw = 84, bh = 34;

    g.fillStyle = 'rgba(0,0,0,0.40)';
    g.beginPath(); g.ellipse(0, 7, bw * 0.55, 7, 0, 0, Math.PI * 2); g.fill();

    g.fillStyle = '#15161a';
    g.fillRect(-bw / 2 - 2, -bh * 0.10, 7, bh * 0.5);
    g.fillRect(bw / 2 - 5, -bh * 0.10, 7, bh * 0.5);

    g.fillStyle = '#5c6066';
    roundRectPathOn(g, -bw / 2, -bh * 0.5, bw, bh * 0.62, 5); g.fill();

    g.fillStyle = '#9aa0a8';
    roundRectPathOn(g, -bw / 2, -bh, bw, bh, 6); g.fill();
    g.fillStyle = '#878d95';
    g.fillRect(-bw / 2 + 2, -bh * 0.46, bw - 4, bh * 0.44);
    g.fillStyle = '#aab0b8';
    g.fillRect(-bw / 2 + 4, -bh + 3, bw - 8, 3);

    var lean = steer * 3 + (drifting ? driftDir * 2 : 0);
    var turn = clamp(steer, -1, 1), faceShow = Math.abs(turn), fside = turn > 0 ? 1 : -1;
    var dxM = -bw * 0.18 + lean, dxW = bw * 0.18 + lean, hY = -bh - 11;
    var skin = '#9c6638', skinHi = '#b87d4c';

    g.fillStyle = '#888e96';
    roundRectPathOn(g, -bw * 0.42, -bh - 4, bw * 0.84, 7, 3); g.fill();
    g.fillStyle = '#23262b';
    roundRectPathOn(g, -bw * 0.34, -bh - 11, bw * 0.68, 12, 4); g.fill();

    g.fillStyle = 'rgba(185,212,228,0.30)';
    roundRectPathOn(g, -bw * 0.28, -bh - 17, bw * 0.56, 6, 2); g.fill();
    g.fillStyle = '#7c828a';
    g.fillRect(Math.round(-bw * 0.28), Math.round(-bh - 17), Math.round(bw * 0.56), 1);
    g.fillRect(Math.round(-bw * 0.28), Math.round(-bh - 17), 1, 6);
    g.fillRect(Math.round(bw * 0.28 - 1), Math.round(-bh - 17), 1, 6);

    g.fillStyle = '#2b2724';
    roundRectPathOn(g, dxM - 7, hY - 1, 14, 13, 3); g.fill();
    roundRectPathOn(g, dxW - 7, hY - 1, 14, 13, 3); g.fill();

    // DRIVER (man): brighter shirt, neck, curls, sunglasses-profile into the turn
    g.fillStyle = '#16b0b0';
    roundRectPathOn(g, dxM - 7, hY + 4, 14, 9, 3); g.fill();
    g.fillStyle = skin; g.fillRect(Math.round(dxM - 2.5), Math.round(hY + 2), 5, 4);
    g.fillStyle = '#191210';
    for (var c = 0; c < 11; c++) {
      var ca = c * 0.78;
      g.beginPath();
      g.arc(dxM + Math.cos(ca) * 3.7, hY - 1 + Math.sin(ca) * 3.1, (c % 2 ? 2.0 : 2.8), 0, Math.PI * 2);
      g.fill();
    }
    g.beginPath(); g.arc(dxM, hY - 1, 4.7, 0, Math.PI * 2); g.fill();
    if (faceShow > 0.15) {
      g.fillStyle = skin;
      g.beginPath(); g.ellipse(dxM + fside * 3.4, hY, 2.0 + faceShow * 1.4, 3.6, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#101014';
      g.fillRect(Math.round(dxM + fside * 2.2), Math.round(hY - 1.5), Math.max(2, Math.round(2 + faceShow * 2)), 2);
      g.fillStyle = skinHi;
      g.fillRect(Math.round(dxM + fside * 4.6), Math.round(hY + 0.5), 1, 2);
    }

    // PASSENGER (woman): shoulders/head first, then the long hair draped in FRONT (was behind -> fixed)
    var sway = Math.sin(animClock * 6) * (1.8 + spd * 4.2) - lean * 0.9;
    var sway2 = Math.sin(animClock * 4.3 + 1.1) * (1.2 + spd * 3.0);
    var hairLen = 30 + spd * 5;                                  // longer hair
    g.fillStyle = '#e8447a';                                     // top / shoulders (behind the hair)
    roundRectPathOn(g, dxW - 7, hY + 4, 14, 9, 3); g.fill();
    g.fillStyle = skin; g.fillRect(Math.round(dxW - 2.5), Math.round(hY + 2), 5, 4);   // neck
    g.fillStyle = '#241812';                                     // back of the head
    g.beginPath(); g.arc(dxW, hY - 1, 4.8, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#241812';                                     // long flowing hair, OVER the shoulders
    g.beginPath();
    g.moveTo(dxW - 5, hY - 3);
    g.quadraticCurveTo(dxW - 9 + sway * 0.5, hY + hairLen * 0.5, dxW - 6 + sway, hY + hairLen);
    g.quadraticCurveTo(dxW + sway + sway2 * 0.5, hY + hairLen + 3, dxW + 6 + sway, hY + hairLen);
    g.quadraticCurveTo(dxW + 9 + sway * 0.5, hY + hairLen * 0.5, dxW + 5, hY - 3);
    g.closePath(); g.fill();
    g.strokeStyle = '#3a2618'; g.lineWidth = 1;                  // strands on top of the hair
    g.beginPath();
    g.moveTo(dxW - 2, hY + 1); g.quadraticCurveTo(dxW - 4 + sway, hY + hairLen * 0.55, dxW - 3 + sway + sway2, hY + hairLen - 2);
    g.moveTo(dxW + 2, hY + 1); g.quadraticCurveTo(dxW + 4 + sway, hY + hairLen * 0.55, dxW + 3 + sway, hY + hairLen - 3);
    g.moveTo(dxW, hY + 1); g.quadraticCurveTo(dxW + sway * 1.2, hY + hairLen * 0.6, dxW + sway2, hY + hairLen - 1);
    g.stroke();
    g.fillStyle = '#2e1f16';                                     // sheen
    g.beginPath(); g.arc(dxW - 1.4, hY - 2.4, 1.8, 0, Math.PI * 2); g.fill();
    if (faceShow > 0.15) {
      g.fillStyle = skin;
      g.beginPath(); g.ellipse(dxW + fside * 3.5, hY, 2.0 + faceShow * 1.5, 3.7, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#3a1010';
      g.fillRect(Math.round(dxW + fside * 3.0), Math.round(hY - 1.6), 1, 1);
      g.fillStyle = '#c83a5a';
      g.fillRect(Math.round(dxW + fside * 3.4), Math.round(hY + 1.4), 2, 1);
      g.fillStyle = skinHi;
      g.fillRect(Math.round(dxW + fside * 4.8), Math.round(hY + 0.3), 1, 2);
    }

    g.fillStyle = '#7d838b'; g.fillRect(-bw * 0.44, -bh * 0.52, bw * 0.88, 1);

    drawTailOn(g, -bw * 0.46, -bh * 0.52, bw * 0.30, bh * 0.30, braking);
    drawTailOn(g, bw * 0.16, -bh * 0.52, bw * 0.30, bh * 0.30, braking);
    g.fillStyle = braking ? '#ff5566' : '#7a2a30';
    g.fillRect(-bw * 0.16, -bh * 0.42, bw * 0.32, 2);

    var glow = (braking ? 0.7 : 0) + (li > 0.10 ? 0.4 * li : 0);   // brake bloom + night tail glow
    if (glow > 0.02) {
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.fillStyle = 'rgba(255,46,54,' + Math.min(0.85, glow).toFixed(3) + ')';
      g.beginPath(); g.ellipse(-bw * 0.31, -bh * 0.37, 9, 6, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(bw * 0.31, -bh * 0.37, 9, 6, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }

    g.fillStyle = '#bfe3ef';
    g.beginPath(); g.ellipse(0, -bh * 0.30, 5, 3.2, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#3d8fb0';
    g.beginPath(); g.ellipse(0, -bh * 0.30, 3, 1.8, 0, 0, Math.PI * 2); g.fill();

    g.fillStyle = '#e9eef2'; g.fillRect(-11, -bh * 0.16, 22, 7);
    g.fillStyle = '#3a4048'; g.fillRect(-9, -bh * 0.16 + 2, 18, 2);

    g.fillStyle = '#2f7fb0'; g.fillRect(bw * 0.20, -bh * 0.20, 12, 3);
  }

  function drawTail(x, y, w, h, braking) {
    // modern horizontal lamp cluster: red lens, bright inner bar, amber corner
    ctx.fillStyle = braking ? '#ff2f3e' : '#c22633';
    roundRectPath(x, y, w, h, 2); ctx.fill();
    ctx.fillStyle = braking ? '#ffd0cf' : '#e0606a';
    ctx.fillRect(Math.round(x + w * 0.12), Math.round(y + h * 0.32), Math.round(w * 0.76), Math.max(1, Math.round(h * 0.3)));
    ctx.fillStyle = braking ? '#ffcf6a' : '#caa030';
    ctx.fillRect(Math.round(x), Math.round(y + h * 0.05), Math.max(1, Math.round(w * 0.22)), Math.max(1, Math.round(h * 0.24)));
  }

  /* =================================================================
     HUD + SCREENS
     ================================================================= */
  function drawHUD() {
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1; ctx.shadowBlur = 0;

    if (G.finite) {
      ctx.font = 'bold 11px monospace';
      ctx.fillStyle = '#21e6dc';
      ctx.fillText('PARADISE RUN', 8, 8);
    } else {
      var t = Math.ceil(G.time);
      ctx.font = 'bold 30px monospace';
      ctx.fillStyle = (G.time < 6 && (Math.floor(G.time * 4) % 2 === 0)) ? '#ff3344'
                      : (G.cpFlash > 0 ? '#7dffa6' : '#ffffff');
      ctx.fillText(String(t), 8, 6);
      ctx.font = 'bold 9px monospace';
      ctx.fillStyle = '#cfd3ff';
      ctx.fillText('TIME', 9, 38);
    }

    var mph = Math.round(G.speed / MAX_SPEED * MAX_MPH);
    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(String(mph), 9, 52);
    ctx.font = 'bold 8px monospace';
    ctx.fillStyle = '#9aa0d8';
    ctx.fillText('MPH', 10, 70);
    var gear = gearIndex(G.speed / MAX_SPEED) + 1;
    ctx.font = 'bold 10px monospace';
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('GEAR ' + gear, 9, 80);

    ctx.textAlign = 'right';
    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText((G.distance / 1000).toFixed(1) + ' KM', LOGICAL_W - 8, LOGICAL_H - 52);
    ctx.font = 'bold 8px monospace';
    ctx.fillStyle = '#9aa0d8';
    ctx.fillText('DIST', LOGICAL_W - 8, LOGICAL_H - 40);
    ctx.textAlign = 'left';

    if (G.finite && isFinite(finishZ)) {
      var prog = Math.round(clamp(G.position / finishZ, 0, 1) * 100);
      ctx.textAlign = 'right';
      ctx.font = 'bold 9px monospace';
      ctx.fillStyle = '#21e6dc';
      ctx.fillText('PARADISE ' + prog + '%', LOGICAL_W - 8, LOGICAL_H - 28);
      ctx.textAlign = 'left';
    }

    ctx.shadowColor = 'transparent';
    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    drawLimitHud();
    drawPlaceBanner();

    if (G.cpFlash > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 16px monospace';
      ctx.fillStyle = '#7dffa6';
      ctx.fillText('CHECKPOINT +' + CHECKPOINT_BONUS + 's', LOGICAL_W / 2, LOGICAL_H * 0.30);
      ctx.textAlign = 'left';
    }

    drawComboMeter();

    if (G.driftFlash > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px monospace';
      ctx.fillStyle = '#ffd24a';
      ctx.fillText('DRIFT +' + G.driftBanked.toFixed(1) + 's', LOGICAL_W / 2, LOGICAL_H * 0.38);
      ctx.textAlign = 'left';
    }
  }

  function drawComboMeter() {
    if (!G.driftActive && G.comboTime <= 0) return;
    var cw = 120, ch = 8;
    var x = (LOGICAL_W - cw) / 2, y = LOGICAL_H * 0.24;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = G.driftActive ? '#21e6dc' : '#9aa0d8';
    ctx.fillText((G.driftActive ? 'DRIFT  ' : 'COMBO  ') + G.comboTime.toFixed(1) + 's', LOGICAL_W / 2, y - 13);
    ctx.fillStyle = 'rgba(20,12,32,0.7)';
    ctx.fillRect(x, y, cw, ch);
    var frac = clamp((G.driftActive ? G.driftTime : 0) / (DRIFT_BANK_CAP / DRIFT_BANK_RATE), 0, 1);
    ctx.fillStyle = G.driftActive ? '#21e6dc' : '#5a4a78';
    ctx.fillRect(x, y, cw * frac, ch);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
    ctx.textAlign = 'left';
  }

  function drawLimitSign(x, baseY, s, clipY, mph) {
    if (baseY > clipY) return;
    var h = clamp(s * 0.62, 4, LOGICAL_H);
    var w = h * 0.72;
    ctx.fillStyle = '#9aa0a8';
    ctx.fillRect(Math.round(x - 1), Math.round(baseY - h * 0.5), 2, Math.round(h * 0.5));
    var by = baseY - h;
    ctx.fillStyle = '#101014';
    ctx.fillRect(Math.round(x - w / 2), Math.round(by), Math.round(w), Math.round(h * 0.62));
    ctx.fillStyle = '#f4f4f4';
    ctx.fillRect(Math.round(x - w / 2) + 1, Math.round(by) + 1, Math.round(w) - 2, Math.round(h * 0.62) - 2);
    ctx.fillStyle = '#101014';
    ctx.textAlign = 'center';
    if (h > 24) {
      ctx.textBaseline = 'top';
      var fs = Math.max(3, Math.round(h * 0.12));
      ctx.font = 'bold ' + fs + 'px monospace';
      ctx.fillText('SPEED', x, by + Math.round(h * 0.06));
      ctx.fillText('LIMIT', x, by + Math.round(h * 0.06) + fs + 1);
      ctx.font = 'bold ' + Math.max(5, Math.round(h * 0.26)) + 'px monospace';
      ctx.fillText(String(mph), x, by + Math.round(h * 0.32));
    } else {
      ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + Math.max(4, Math.round(h * 0.42)) + 'px monospace';
      ctx.fillText(String(mph), x, by + Math.round(h * 0.32));
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  }

  // The police cruiser, rear view: white body, black top, roof light bar that flashes
  // red and blue while the siren is on.
  function drawCruiser(x, baseY, s, siren) {
    var h = clamp(s * 0.85, 4, LOGICAL_H);
    var w = h * 1.3;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(x, baseY + h * 0.10, w * 0.55, Math.max(1, h * 0.18), 0, 0, Math.PI * 2); ctx.fill();
    var by = baseY - h;
    ctx.fillStyle = '#e9edf2';
    roundRectPath(x - w / 2, by + h * 0.45, w, h * 0.55, Math.max(1, h * 0.12)); ctx.fill();
    ctx.fillStyle = '#15171c';
    roundRectPath(x - w * 0.42, by + h * 0.18, w * 0.84, h * 0.42, Math.max(1, h * 0.10)); ctx.fill();
    ctx.fillStyle = '#2b3640';
    ctx.fillRect(Math.round(x - w * 0.30), Math.round(by + h * 0.24), Math.round(w * 0.60), Math.max(1, Math.round(h * 0.16)));
    ctx.fillStyle = '#c22633';
    ctx.fillRect(Math.round(x - w * 0.46), Math.round(by + h * 0.50), Math.round(w * 0.16), Math.max(1, Math.round(h * 0.16)));
    ctx.fillRect(Math.round(x + w * 0.30), Math.round(by + h * 0.50), Math.round(w * 0.16), Math.max(1, Math.round(h * 0.16)));
    var lb = by + h * 0.04;
    if (siren) {
      var on = Math.sin(animClock * 18) > 0;
      ctx.fillStyle = on ? '#ff2f3e' : '#22307a';
      ctx.fillRect(Math.round(x - w * 0.22), Math.round(lb), Math.round(w * 0.22), Math.max(1, Math.round(h * 0.13)));
      ctx.fillStyle = on ? '#22307a' : '#2f6bff';
      ctx.fillRect(Math.round(x), Math.round(lb), Math.round(w * 0.22), Math.max(1, Math.round(h * 0.13)));
    } else {
      ctx.fillStyle = '#3a3f6a';
      ctx.fillRect(Math.round(x - w * 0.22), Math.round(lb), Math.round(w * 0.44), Math.max(1, Math.round(h * 0.10)));
    }
  }

  function drawPolice() {
    if (!G || G.police.state === 'off') return;
    var P = G.police;
    var aheadSeg = findSegment((G.position + P.gap) % trackLength);
    var sc = aheadSeg.p1.screen;
    if (!sc || !isFinite(sc.x) || !isFinite(sc.y) || !isFinite(sc.scale) || sc.scale <= 0) return;
    if (sc.y < LOGICAL_H / 2 - 6 || sc.y > LOGICAL_H + 20) return;   // occluded over a crest, or off screen
    var size = sc.scale * ROAD_WIDTH * (LOGICAL_W / 2) * SPRITE_SCALE;
    drawCruiser(sc.x, sc.y, size, P.siren);
  }

  function screenFrame(r, g, b, a) {
    a = clamp(a, 0, 0.85);
    ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(3) + ')';
    var t = 4;
    ctx.fillRect(0, 0, LOGICAL_W, t);
    ctx.fillRect(0, LOGICAL_H - t, LOGICAL_W, t);
    ctx.fillRect(0, 0, t, LOGICAL_H);
    ctx.fillRect(LOGICAL_W - t, 0, t, LOGICAL_H);
  }

  function drawSignal(up, col, label) {
    var cxp = LOGICAL_W / 2, cy = LOGICAL_H * 0.30;
    var s = 9 + (Math.sin(animClock * 6) > 0 ? 1 : 0);
    ctx.fillStyle = col;
    ctx.beginPath();
    if (up) { ctx.moveTo(cxp, cy - s); ctx.lineTo(cxp - s, cy + s * 0.6); ctx.lineTo(cxp + s, cy + s * 0.6); }
    else    { ctx.moveTo(cxp, cy + s); ctx.lineTo(cxp - s, cy - s * 0.6); ctx.lineTo(cxp + s, cy - s * 0.6); }
    ctx.closePath(); ctx.fill();
    ctx.font = 'bold 10px monospace'; ctx.fillStyle = col; ctx.textBaseline = 'top';
    ctx.fillText(label, cxp, cy + s + 4);
  }

  // Score, the speed-limit chip and multiplier, the speed-up / slow-down signal, the
  // zone tint, and the police warning.
  // v8: the staying-under scoring is gone. This HUD now shows only the posted limit (for
  // context, since the police still enforce it) and the police chase / bust warnings.
  // A location-name banner that fades in when you enter a named place (Reflection Lake,
  // Paradise, Sunrise) and fades out a few seconds later.
  function drawPlaceBanner() {
    if (!G || !G.place || G.placeFlash <= 0) return;
    var T = PLACE_FLASH_TIME;
    var a = Math.max(0, Math.min(1, (T - G.placeFlash) / 0.4, G.placeFlash / 0.9));
    if (a <= 0) return;
    var slide = (1 - Math.min(1, (T - G.placeFlash) / 0.35)) * -12;        // slides down into place
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 14px monospace';
    var tw = ctx.measureText(G.place).width;
    var pw = Math.min(LOGICAL_W - 16, Math.max(tw + 28, 120)), ph2 = 31;
    var px = Math.round((LOGICAL_W - pw) / 2), py = Math.round(50 + slide);  // sits BELOW the top button row, never under it
    roundRectPath(px, py, pw, ph2, 9);
    ctx.fillStyle = 'rgba(8,16,28,0.74)'; ctx.fill();
    ctx.strokeStyle = 'rgba(33,230,220,0.65)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#eaf2ff';
    ctx.fillText(G.place, LOGICAL_W / 2, py + 11);
    ctx.font = 'bold 7px monospace';
    ctx.fillStyle = '#7fd6cf';
    ctx.fillText('MT RAINIER NATIONAL PARK', LOGICAL_W / 2, py + 23);
    ctx.restore();
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  }

  function drawLimitHud() {
    if (!G) return;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    if (G.police.state === 'chase') {
      ctx.textAlign = 'center';
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = (Math.sin(animClock * 10) > 0) ? '#ff4d5e' : '#ffd24a';
      ctx.fillText('POLICE', LOGICAL_W / 2, LOGICAL_H * 0.44);
      ctx.textAlign = 'left';
    } else if (G.police.state === 'bust') {
      ctx.textAlign = 'center';
      ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#ff4d5e';
      ctx.fillText('PULLED OVER', LOGICAL_W / 2, LOGICAL_H * 0.40);
      ctx.textAlign = 'left';
      screenFrame(255, 70, 70, 0.45 + 0.2 * Math.sin(animClock * 16));
    }
  }

  function drawStick(st, col) {
    if (!st) return;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(st.ox, st.oy, 42, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(st.x, st.y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.arc(st.x, st.y, 14, 0, Math.PI * 2); ctx.stroke();
  }
  function hintStick(x, y, label) {
    ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 8px monospace';
    ctx.fillText(label, x, y);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  }
  function drawSticks() {
    if (STATE !== 'play' && STATE !== 'paused') return;
    if (!uiSticks.left) hintStick(LOGICAL_W * 0.22, LOGICAL_H - 44, 'STEER');
    drawStick(uiSticks.left, '#7db8ff');
    drawBrakeZone();
  }

  // right-half brake indicator: a pad that lights when the player is pressing to brake (v20)
  function drawBrakeZone() {
    var cx = LOGICAL_W * 0.80, cy = LOGICAL_H - 44, r = 22;
    ctx.fillStyle = input.brake ? 'rgba(255,60,90,0.85)' : 'rgba(255,60,90,0.20)';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 9px monospace'; ctx.fillText('BRAKE', cx, cy);
    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  }

  function drawBrakePad() {
    var x = 8, y = LOGICAL_H - 46, w = 54, h = 38;
    ctx.fillStyle = input.brake ? 'rgba(255,45,90,0.85)' : 'rgba(255,45,90,0.30)';
    roundRectPath(x, y, w, h, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    roundRectPath(x + 0.5, y + 0.5, w - 1, h - 1, 8); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 11px monospace';
    ctx.textBaseline = 'middle';
    ctx.fillText('BRAKE', x + w / 2, y + h / 2);
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
  }

  // m:ss.t time format for the run timer and finish screen
  function fmtTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), sec = s - m * 60;
    var ss = sec.toFixed(1);
    if (sec < 10) ss = '0' + ss;
    return m + ':' + ss;
  }

  function drawTitleBtn(key, label, sub, sel) {
    var b = TITLE_BTN[key];
    ctx.fillStyle = sel ? 'rgba(33,230,220,0.20)' : 'rgba(20,12,32,0.72)';
    roundRectPath(b.x, b.y, b.w, b.h, 6); ctx.fill();
    ctx.strokeStyle = sel ? '#21e6dc' : '#5a4a78';
    ctx.lineWidth = sel ? 2 : 1;
    roundRectPath(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1, 6); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = sel ? '#eafffd' : '#cfd3ff';
    ctx.fillText(label, b.x + b.w / 2, b.y + 4);
    ctx.font = '8px monospace';
    ctx.fillStyle = sel ? '#9fe9e4' : '#8b90c0';
    ctx.fillText(sub, b.x + b.w / 2, b.y + 19);
  }

  function drawTitle() {
    ctx.fillStyle = 'rgba(10,6,20,0.55)';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 34px monospace';
    ctx.fillStyle = '#21e6dc';
    ctx.fillText('RAINIER', LOGICAL_W / 2 + 1, LOGICAL_H * 0.15);
    ctx.fillStyle = '#ff2d95';
    ctx.fillText('RUN', LOGICAL_W / 2, LOGICAL_H * 0.15 + 30);
    ctx.font = 'bold 10px monospace';
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('BUILD ' + BUILD, LOGICAL_W / 2, LOGICAL_H * 0.15 + 62);

    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = '#cfd3ff';
    ctx.fillText('CHOOSE A MODE', LOGICAL_W / 2, LOGICAL_H * 0.40);
    drawTitleBtn('standard', 'STANDARD', 'endless time attack', gameMode === 'standard');
    drawTitleBtn('paradise', 'PARADISE RUN', 'the booth to Paradise', gameMode === 'paradise');

    ctx.font = '9px monospace';
    ctx.fillStyle = '#b8bce8';
    ctx.fillText('LEFT steer    RIGHT brake', LOGICAL_W / 2, LOGICAL_H * 0.78);
    ctx.fillText('tap brake + turn over 60 to DRIFT', LOGICAL_W / 2, LOGICAL_H * 0.78 + 12);
    ctx.fillStyle = '#9fe9e4';
    ctx.fillText('tap a mode to drive', LOGICAL_W / 2, LOGICAL_H * 0.78 + 26);
    ctx.textAlign = 'left';
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(10,6,20,0.62)';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    if (G.finished) {
      ctx.font = 'bold 24px monospace';
      ctx.fillStyle = '#21e6dc';
      ctx.fillText('PARADISE', LOGICAL_W / 2, LOGICAL_H * 0.26);
      ctx.font = 'bold 10px monospace';
      ctx.fillStyle = '#e8e8ff';
      ctx.fillText('YOU REACHED THE MOUNTAIN', LOGICAL_W / 2, LOGICAL_H * 0.26 + 30);
      ctx.font = 'bold 11px monospace';
      ctx.fillStyle = '#e8e8ff';
      ctx.fillText('the drive is complete', LOGICAL_W / 2, LOGICAL_H * 0.46);
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#21e6dc';
      ctx.fillText('TAP TO DRIVE AGAIN', LOGICAL_W / 2, LOGICAL_H * 0.60);
    } else {
      ctx.font = 'bold 24px monospace';
      ctx.fillStyle = '#ff3344';
      ctx.fillText('OUT OF TIME', LOGICAL_W / 2, LOGICAL_H * 0.32);
      ctx.font = 'bold 13px monospace';
      ctx.fillStyle = '#fff';
      ctx.fillText('DIST  ' + (G.distance / 1000).toFixed(1) + ' KM', LOGICAL_W / 2, LOGICAL_H * 0.45);
      ctx.fillStyle = '#ffd24a';
      ctx.fillText('BEST  ' + (bestDistance / 1000).toFixed(1) + ' KM', LOGICAL_W / 2, LOGICAL_H * 0.45 + 18);
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#21e6dc';
      ctx.fillText('TAP TO RETRY', LOGICAL_W / 2, LOGICAL_H * 0.62);
    }
    ctx.textAlign = 'left';
  }

  function drawPaused() {
    ctx.fillStyle = 'rgba(8,18,30,0.55)';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 28px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('PAUSED', LOGICAL_W / 2, LOGICAL_H * 0.40);
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = '#cfe0ee';
    ctx.fillText('tap the pause button or press P', LOGICAL_W / 2, LOGICAL_H * 0.40 + 34);
    ctx.fillText('to resume', LOGICAL_W / 2, LOGICAL_H * 0.40 + 48);
    ctx.textAlign = 'left';
  }

  // Top-down TRACK MAP overlay (shown while paused via the MAP button): the route from the
  // segment data, START / PARADISE / point-of-interest markers, and a YOU-ARE-HERE dot.
  function drawMap() {
    ctx.fillStyle = 'rgba(6,12,20,0.88)';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#21e6dc';
    ctx.fillText('TRACK MAP', LOGICAL_W / 2, 10);
    ctx.font = '8px monospace'; ctx.fillStyle = '#9fb0c8';
    ctx.fillText(gameMode === 'paradise' ? 'BOOTH to PARADISE' : 'STANDARD loop', LOGICAL_W / 2, 27);
    if (!mapPath || mapPath.length < 2 || !mapBounds) {
      ctx.fillStyle = '#cfe0ee'; ctx.fillText('(no map)', LOGICAL_W / 2, LOGICAL_H / 2);
      ctx.textAlign = 'left'; return;
    }
    var boxL = 18, boxT = 44, boxW = LOGICAL_W - 36, boxH = LOGICAL_H - 90;
    var aspect = mapBounds.w / mapBounds.h, bw, bh;
    if (aspect > boxW / boxH) { bw = boxW; bh = boxW / aspect; } else { bh = boxH; bw = boxH * aspect; }
    var ox = boxL + (boxW - bw) / 2, oy = boxT + (boxH - bh) / 2;
    function px(nx) { return ox + nx * bw; }
    function py(ny) { return oy + (1 - ny) * bh; }            // north up: start low, Paradise high
    ctx.fillStyle = 'rgba(12,22,34,0.7)'; roundRectPath(boxL - 4, boxT - 4, boxW + 8, boxH + 8, 8); ctx.fill();
    ctx.strokeStyle = '#2a3c52'; ctx.lineWidth = 1; roundRectPath(boxL - 4, boxT - 4, boxW + 8, boxH + 8, 8); ctx.stroke();
    ctx.strokeStyle = '#7fd4ff'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < mapPath.length; i += 3) {
      var X = px(mapPath[i].x), Y = py(mapPath[i].y);
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke(); ctx.lineWidth = 1;
    function dot(nx, ny, col, r) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px(nx), py(ny), r, 0, Math.PI * 2); ctx.fill(); }
    ctx.font = '7px monospace'; ctx.textAlign = 'left';
    dot(mapPath[0].x, mapPath[0].y, '#9fe9a0', 3);
    ctx.fillStyle = '#9fe9a0'; ctx.fillText('START', px(mapPath[0].x) + 5, py(mapPath[0].y) - 3);
    if (isFinite(finishZ)) {
      var fseg = Math.min(mapPath.length - 1, Math.floor(finishZ / SEGMENT_LENGTH));
      dot(mapPath[fseg].x, mapPath[fseg].y, '#ff5d6c', 3);
      ctx.fillStyle = '#ff8d97'; ctx.fillText('PARADISE', px(mapPath[fseg].x) + 5, py(mapPath[fseg].y) - 3);
    }
    for (var k = 0; k < mapPOI.length; k++) {
      var poi = mapPOI[k];
      dot(poi.x, poi.y, '#ffd24a', 2);
      ctx.fillStyle = '#ffe39a';
      ctx.fillText(poi.label.length > 17 ? poi.label.slice(0, 17) : poi.label, px(poi.x) + 4, py(poi.y) + (k % 2 ? 2 : -8));
    }
    if (G) {
      var pidx = Math.min(mapPath.length - 1, Math.max(0, Math.floor(G.position / SEGMENT_LENGTH)));
      var hx = px(mapPath[pidx].x), hy = py(mapPath[pidx].y);
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(hx, hy, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#21e6dc'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(hx, hy, 5.5, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1;
    }
    ctx.textAlign = 'center'; ctx.fillStyle = '#9fb0c8'; ctx.font = '8px monospace';
    ctx.fillText('tap, M, or the map button to close', LOGICAL_W / 2, LOGICAL_H - 20);
    ctx.textAlign = 'left';
  }

  function drawErr(msg) {
    ctx.fillStyle = 'rgba(150,0,0,0.85)';
    ctx.fillRect(0, LOGICAL_H - 12, LOGICAL_W, 12);
    ctx.fillStyle = '#fff';
    ctx.font = '8px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    var s = 'ERR: ' + msg;
    if (s.length > 46) s = s.slice(0, 46);
    ctx.fillText(s, 3, LOGICAL_H - 11);
  }

  /* =================================================================
     RENDER (browser only)
     ================================================================= */
  // Night and rain dim the whole scene (a translucent overlay over the world, under the HUD).
  function applyDaylight() {
    var dl = (1 - Math.cos(G.tod * 2 * Math.PI)) / 2;
    var dark = (1 - dl) * 0.6 + G.wet * 0.22;
    if (dark > 0.02) {
      ctx.fillStyle = 'rgba(10,14,32,' + Math.min(0.72, dark).toFixed(3) + ')';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    }
  }

  // Inside the Stevens Canyon tunnel the world goes dark (the HUD still draws on top).
  function applyTunnelDark() {
    var z = G.position + PLAYER_Z;
    var s = findSegment(z);
    if (!s || !s.tunnel) return;
    var base = Math.floor(z / SEGMENT_LENGTH), steps = 0;       // scan to the tunnel exit ahead
    while (steps < 60 && segments[(base + steps) % segments.length].tunnel) steps++;
    var dist = Math.max(0, (base + steps) * SEGMENT_LENGTH - z);
    var t = clamp(1 - dist / (SEGMENT_LENGTH * 22), 0, 1);      // 0 deep inside, 1 at the mouth
    drawTunnelInterior(t);
  }

  // Modelled tunnel interior (v34): rock walls and a ceiling converging to a bright EXIT
  // aperture (the scene beyond shows through it), with overhead lamps scrolling for motion.
  function drawTunnelInterior(t) {
    t = t || 0;
    var W = LOGICAL_W, H = LOGICAL_H, horizon = H / 2;
    var ax = W / 2, ay = horizon + 2;
    var aw = W * (0.34 + 0.46 * t), ah = H * (0.32 + 0.44 * t);          // a wider mouth that grows as you approach the exit
    var aL = ax - aw / 2, aR = ax + aw / 2, aT = ay - ah / 2, aB = ay + ah / 2;
    polygon(0, 0, W, 0, aR, aT, aL, aT, '#221d16');                       // ceiling (stone, not pure black)
    polygon(0, 0, aL, aT, aL, aB, 0, H, '#41382d');                       // left wall (lit)
    polygon(W, 0, aR, aT, aR, aB, W, H, '#2a241c');                       // right wall (shadowed)
    var ribs = 7, rphase = (G.position / SEGMENT_LENGTH) % 1;             // concrete arch rings receding to the mouth, scrolling toward the viewer
    for (var r = 0; r < ribs; r++) {
      var d = (((r / ribs) - rphase) % 1 + 1) % 1;                        // 1 far (at the mouth), 0 near (screen edge)
      var rl = aL * d, rt = aT * d, rr = aR * d + W * (1 - d), rb = aB * d + H * (1 - d);
      ctx.strokeStyle = 'rgba(88,76,58,' + (0.22 + 0.42 * d).toFixed(2) + ')';
      ctx.lineWidth = Math.max(1, (1 - d) * 5);
      ctx.strokeRect(Math.round(rl), Math.round(rt), Math.round(rr - rl), Math.round(rb - rt));
      ctx.strokeStyle = 'rgba(154,138,106,' + (0.16 + 0.30 * d).toFixed(2) + ')';   // lit inner lip
      ctx.lineWidth = 1;
      ctx.strokeRect(Math.round(rl) + 1, Math.round(rt) + 1, Math.round(rr - rl) - 2, Math.round(rb - rt) - 2);
    }
    var dayA = clamp((t - 0.10) / 0.90, 0, 1);                            // DAYLIGHT through the mouth: brighten the opening so we emerge into light
    if (dayA > 0.01) {
      ctx.save();
      ctx.beginPath(); ctx.rect(aL, aT, aR - aL, aB - aT); ctx.clip();
      var dg = ctx.createLinearGradient(0, aT, 0, aB);
      dg.addColorStop(0,   'rgba(150,196,236,' + (0.52 * dayA).toFixed(3) + ')');   // sky beyond
      dg.addColorStop(0.62,'rgba(206,226,242,' + (0.52 * dayA).toFixed(3) + ')');   // bright haze
      dg.addColorStop(1,   'rgba(238,243,250,' + (0.42 * dayA).toFixed(3) + ')');   // lit road mouth
      ctx.fillStyle = dg;
      ctx.fillRect(aL, aT, aR - aL, aB - aT);
      ctx.restore();
    }
    ctx.strokeStyle = 'rgba(216,233,250,' + (0.42 + 0.4 * t).toFixed(2) + ')';      // glowing rim where daylight meets rock
    ctx.lineWidth = 2 + 2 * t;
    ctx.strokeRect(aL, aT, aR - aL, aB - aT);
    ctx.lineWidth = 1;
    var lampN = 8, phase = (G.position / 170) % 1;                        // warm overhead lamps scroll toward the viewer
    for (var li = 0; li < lampN; li++) {
      var lt = (li + phase) / lampN;
      var ly = aT * (1 - lt) + (H * 0.03) * lt, lw = 6 + lt * 34;
      ctx.fillStyle = 'rgba(255,224,150,' + (0.26 + 0.5 * lt).toFixed(2) + ')';
      ctx.fillRect(Math.round(W / 2 - lw / 2), Math.round(ly), Math.round(lw), 2);
      ctx.fillStyle = 'rgba(255,238,190,' + (0.18 + 0.35 * lt).toFixed(2) + ')';   // soft halo
      ctx.fillRect(Math.round(W / 2 - lw / 2 - 2), Math.round(ly - 1), Math.round(lw + 4), 1);
    }
  }

  // Falling rain (fast diagonal streaks) and snow (slow drifting flakes), over the dimmed scene.
  function drawWeatherFX() {
    if (G.wet > 0.12) {
      var rn = Math.round(30 + G.wet * 90);
      ctx.strokeStyle = 'rgba(200,214,236,' + (0.22 + G.wet * 0.32).toFixed(2) + ')';
      ctx.lineWidth = 1; ctx.beginPath();
      for (var i = 0; i < rn; i++) {
        var yy = ((animClock * (560 + (i % 5) * 60) + i * 97) % (LOGICAL_H + 40)) - 20;
        var xx = ((i * 71) + yy * 0.5) % LOGICAL_W;
        ctx.moveTo(xx, yy); ctx.lineTo(xx - 3, yy + 9);
      }
      ctx.stroke();
    }
    if (G.weather === 2 || G.snowCover > 0.04) {
      var amt = (G.weather === 2) ? 1 : G.snowCover;
      var sn = Math.round(28 + amt * 60);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + amt * 0.4).toFixed(2) + ')';
      for (var j = 0; j < sn; j++) {
        var sy = ((animClock * (40 + (j % 4) * 14) + j * 61) % (LOGICAL_H + 20)) - 10;
        var sway = Math.sin(animClock * 1.5 + j) * 6;
        var sz = (j % 3 === 0) ? 2 : 1;
        ctx.fillRect(Math.round(((j * 53) + sway + LOGICAL_W) % LOGICAL_W), Math.round(sy), sz, sz);
      }
    }
  }

  function render() {
    ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
    renderBackdrop();
    renderRoad();
    renderSprites();
    if (G) drawPolice();
    if (G) drawSpeedLines(G.speed / MAX_SPEED);
    drawCar(G ? G.steer : 0, (G ? G.skidBraking : false), G ? G.driftActive : false, G ? G.driftDir : 0, (G ? (!G.skidBraking && G.speed > 1) : false));
    if (G) applyDaylight();
    if (G) applyTunnelDark();
    if (G) drawWeatherFX();
    if (STATE === 'title') drawTitle();
    else if (STATE === 'play') drawHUD();
    else if (STATE === 'paused') { drawHUD(); if (mapOpen) drawMap(); else drawPaused(); }
    else if (STATE === 'over') { drawHUD(); drawOver(); }
    drawSticks();
  }

  // Faint motion streaks near the screen edges that build with speed.
  function drawSpeedLines(pct) {
    if (pct <= 0.58) return;
    var intensity = (pct - 0.58) / 0.42;
    if (intensity > 1) intensity = 1;
    for (var i = 0; i < 8; i++) {
      var left = (i % 2 === 0);
      var ex = left ? (3 + (i * 5) % 20) : (LOGICAL_W - 5 - (i * 5) % 20);
      var phase = (animClock * (2.5 + intensity * 4) + i * 0.37) % 1;
      var yy = phase * (LOGICAL_H + 60) - 30;
      var hgt = 22 + intensity * 48;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.09 * intensity).toFixed(3) + ')';
      ctx.fillRect(Math.round(ex), Math.round(yy), 2, Math.round(hgt));
    }
  }

  /* =================================================================
     BOOT : DOM, input, resize, rAF loop  (browser only)
     ================================================================= */
  function frame(now) {
    var dt = (now - last) / 1000;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;
    last = now;

    var err = null;
    try {
      update(dt, input);
    } catch (e) {
      err = 'update: ' + (e && e.message ? e.message : e);
    }
    try {
      animClock += dt;
      if (G) {
        var target = headingAhead() * 60;     // the single parallax source for ALL background layers
        bgOffset += (target - bgOffset) * Math.min(1, dt * 4);
      }
      render();
      if (pauseBtn) pauseBtn.textContent = (STATE === 'paused') ? '\u25B6' : 'II';
    } catch (e2) {
      err = (err ? err + ' | ' : '') + 'render: ' + (e2 && e2.message ? e2.message : e2);
    }
    lastError = err;
    if (err) drawErr(err);
    requestAnimationFrame(frame);
  }

  function resize() {
    canvas.width = LOGICAL_W;
    canvas.height = LOGICAL_H;
    ctx.imageSmoothingEnabled = false;
    var ww = window.innerWidth, wh = window.innerHeight;
    var scale = Math.min(ww / LOGICAL_W, wh / LOGICAL_H);
    canvas.style.width = Math.floor(LOGICAL_W * scale) + 'px';
    canvas.style.height = Math.floor(LOGICAL_H * scale) + 'px';
  }

  function toggleFs() {
    try {
      if (!document.fullscreenElement) {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) req.call(el);
      } else {
        var ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) ex.call(document);
      }
    } catch (e) { /* ignore */ }
  }

  function titleHit(p, key) {
    var b = TITLE_BTN[key];
    return !!p && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
  }
  function handleTap(p) {
    if (mapOpen) { toggleMap(); return; }
    if (STATE === 'title') {
      if (titleHit(p, 'standard')) gameMode = 'standard';
      else if (titleHit(p, 'paradise')) gameMode = 'paradise';
      startGame();
    } else if (STATE === 'over') {
      startGame();
    }
  }

  function setupInput() {
    var RADIUS = 42, DEAD = 0.16, RDEAD = 12;
    var L = null;   // left floating stick -> steer (x only)
    var R = null;   // right-half press -> brake
    var keys = {};

    function logicalXY(clientX, clientY) {
      var rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) / rect.width * LOGICAL_W,
        y: (clientY - rect.top) / rect.height * LOGICAL_H
      };
    }
    function knob(o, v) { var d = v - o; if (d > RADIUS) d = RADIUS; if (d < -RADIUS) d = -RADIUS; return o + d; }

    function apply() {
      var steer = 0, brake = 0;
      if (L) {
        steer = clamp((L.x - L.ox) / (RADIUS * 0.6), -1, 1);   // full lock at ~60% travel (x only now)
        if (Math.abs(steer) < DEAD) steer = 0;
      }
      if (R) brake = 1;                                        // any press on the right half brakes
      // keyboard: arrows / A D steer; Down / S brake; the car auto-accelerates otherwise
      var kl = keys['ArrowLeft'] || keys['a'] || keys['A'];
      var kr = keys['ArrowRight'] || keys['d'] || keys['D'];
      var kb = keys['ArrowDown'] || keys['s'] || keys['S'];
      if (!L) steer = (kl && !kr) ? -1 : ((kr && !kl) ? 1 : 0);
      if (!R && kb) brake = 1;
      input.steer = steer; input.brake = brake; input.throttle = null;
      uiSticks.left  = L ? { ox: L.ox, oy: L.oy, x: knob(L.ox, L.x), y: knob(L.oy, L.y) } : null;
      uiSticks.right = R ? { brake: true } : null;
    }

    function startPointer(id, clientX, clientY) {
      var p = logicalXY(clientX, clientY);
      if (p.x < LOGICAL_W / 2) { if (!L) L = { id: id, ox: p.x, oy: p.y, x: p.x, y: p.y }; }
      else { if (!R) R = { id: id, ox: p.x, oy: p.y, x: p.x, y: p.y }; }
    }
    function movePointer(id, clientX, clientY) {
      var p = logicalXY(clientX, clientY);
      if (L && L.id === id) { L.x = p.x; L.y = p.y; }
      else if (R && R.id === id) { R.x = p.x; R.y = p.y; }
    }
    function endPointer(id) {
      if (L && L.id === id) L = null;
      if (R && R.id === id) R = null;
    }

    function touchStart(e) {
      if (STATE !== 'play') { var t0 = e.changedTouches[0]; handleTap(t0 ? logicalXY(t0.clientX, t0.clientY) : null); }
      for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; startPointer(t.identifier, t.clientX, t.clientY); }
      apply(); e.preventDefault();
    }
    function touchMove(e) {
      for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; movePointer(t.identifier, t.clientX, t.clientY); }
      apply(); e.preventDefault();
    }
    function touchEnd(e) {
      for (var i = 0; i < e.changedTouches.length; i++) { endPointer(e.changedTouches[i].identifier); }
      apply(); e.preventDefault();
    }
    canvas.addEventListener('touchstart', touchStart, { passive: false });
    canvas.addEventListener('touchmove', touchMove, { passive: false });
    canvas.addEventListener('touchend', touchEnd, { passive: false });
    canvas.addEventListener('touchcancel', touchEnd, { passive: false });

    // mouse acts as the left stick on desktop; drift is on Q / E
    var md = false;
    canvas.addEventListener('mousedown', function (e) { md = true; if (STATE !== 'play') handleTap(logicalXY(e.clientX, e.clientY)); startPointer('m', e.clientX, e.clientY); apply(); });
    window.addEventListener('mousemove', function (e) { if (!md) return; movePointer('m', e.clientX, e.clientY); apply(); });
    window.addEventListener('mouseup', function () { md = false; endPointer('m'); apply(); });

    // keyboard: arrows / WASD drive and steer, Q / E drift
    window.addEventListener('keydown', function (e) {
      keys[e.key] = true;
      if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].indexOf(e.key) >= 0) e.preventDefault();
      if (STATE !== 'play' && STATE !== 'paused' && (e.key === ' ' || e.key === 'Enter')) handleTap();
      if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
      if (e.key === 'm' || e.key === 'M') toggleMap();
      apply();
    });
    window.addEventListener('keyup', function (e) { keys[e.key] = false; apply(); });
  }

  function boot() {
    canvas = document.getElementById('game');
    ctx = canvas.getContext('2d');
    resetGame();
    setupInput();
    window.addEventListener('resize', resize);
    resize();
    var fs = document.getElementById('fs');
    if (fs) fs.addEventListener('click', toggleFs);
    pauseBtn = document.getElementById('pause');
    if (pauseBtn) pauseBtn.addEventListener('click', togglePause);
    mapBtn = document.getElementById('map');
    if (mapBtn) mapBtn.addEventListener('click', toggleMap);
    last = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    requestAnimationFrame(frame);
  }

  if (typeof document !== 'undefined') boot();
  /*__HOOK_INSERT__*/
})();
</script>
</body>
</html>
